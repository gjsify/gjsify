# Meson cross file for the GObject-in-Wasm prototype.
#
# `pkg-config --static` is set here rather than per-invocation because meson's
# dependency lookup does not otherwise ask for the static link line, and every
# dependency in this sysroot is static-only.
#
# c_thread_count = 0 keeps meson from adding -pthread: the prototype is
# deliberately single-threaded (no SharedArrayBuffer, no COOP/COEP).

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkg-config = ['pkg-config', '--static']

[built-in options]
c_thread_count = 0
cpp_thread_count = 0

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
