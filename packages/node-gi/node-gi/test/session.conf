<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Throwaway session bus for `npm run test:dbus`, handed to dbus-daemon through
  `dbus-run-session`'s config-file option. (XML comments cannot contain a double
  hyphen, hence the prose spelling of the flag names below.)

  WHY: `dbus-run-session` with its DEFAULT config cannot run on macOS. Homebrew's
  dbus is built with launchd support, so the stock session.conf listens on
  `launchd:env=DBUS_LAUNCHD_SESSION_BUS_SOCKET` and the daemon exits with
  "DBUS_LAUNCHD_SESSION_BUS_SOCKET is empty" unless a launchd-managed bus is
  already running. A plain unix socket in the temp dir works on macOS AND Linux,
  so the suite becomes runnable on both from one entry point.

  Deliberately NO service directories: an activation-capable bus could start real
  user services, and this bus exists purely so two processes in one test can find
  each other.
-->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
