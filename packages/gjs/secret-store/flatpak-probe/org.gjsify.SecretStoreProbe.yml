# Proof of the portal-secret driver: a sandbox with NO finish-args, in particular no
# --talk-name=org.freedesktop.secrets (ADR 0138 section 6). See ./run.sh.
app-id: org.gjsify.SecretStoreProbe
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: probe
finish-args: []
modules:
  - name: probe
    buildsystem: simple
    build-commands:
      - install -Dm644 probe.mjs /app/share/probe/probe.mjs
      - mkdir -p /app/bin
      - printf '#!/bin/sh\nexec gjs -m /app/share/probe/probe.mjs "$@"\n' > /app/bin/probe
      - chmod +x /app/bin/probe
    sources:
      - type: file
        path: probe.mjs
