# DIAGNOSTIC: does the gjsify CLI toolchain run off-Linux?
#
# The main suite (main.yml) is 100% Fedora/Linux; the "cli-cross-runtime" job there
# means JS-engine (node/bun/deno), not OS — all still on ubuntu. So `gjsify
# install/build/run` has never been exercised on macOS or Windows. The node-gi
# reverse bridge IS proven cross-OS (node-gi.yml), but that is the RUNTIME (running
# GJS apps), not the toolchain.
#
# This runs the PUBLISHED @gjsify/cli under Node on macos-latest + windows-latest
# through the real user path — install → build --app node → run — to get EVIDENCE
# of what works vs. breaks. The published CLI is used deliberately: the repo's own
# install runs under `gjs`, which does not exist off-Linux, so "can a user on a
# Mac/Windows use gjsify" == the npm-installed CLI.
#
# Each substantive step is continue-on-error so ONE run maps ALL the gaps at once
# (version? build? run? the install backend?); the final summary surfaces every
# step's outcome and then fails the job if ANY of them broke.
#
# The install backend is part of that gate as of the OS-axis fix. It used to be
# reported-only because linking a bin off Linux was structurally impossible —
# the backend wrote a file symlink (needs elevation/Developer Mode on Windows) or
# fell back to copying a `#!/usr/bin/env node` script, and Windows executes
# neither (extension-less files are not on PATHEXT, and there is no shebang
# handling). win32 now gets npm's three-file cmd-shim set instead, so a failure
# there is a regression rather than a known gap.
name: CLI cross-platform (Node / macOS + Windows)

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'Published @gjsify/cli version/tag to test (default: latest)'
        required: false
        default: 'latest'
  pull_request:
    paths:
      - '.github/workflows/cli-cross-platform.yml'
  # NOT a `release: published` trigger — it cannot fire, and it would be wrong
  # if it could. Measured on the v0.26.1 cut:
  #
  #   1. The release record is created by `release-cut.yml` using GITHUB_TOKEN,
  #      and GitHub deliberately does not let a token-driven event start further
  #      workflow runs. This workflow did not run on that release at all. It is
  #      the same wall #895 hit, which is why `release.yml` is DISPATCHED.
  #   2. Even firing, it would be too EARLY: this job installs the PUBLISHED
  #      `@gjsify/cli`, and the release record exists before `release.yml` has
  #      pushed anything to npm — so it would measure the PREVIOUS version while
  #      appearing to check the new one. A green run against the wrong artifact
  #      is the worst of the three outcomes.
  #
  # So `release.yml` dispatches this workflow at the END of its publish job,
  # where the thing being measured actually exists. The cron below stays as the
  # independent net.
  schedule:
    # Weekly drift check (Mondays 05:00 UTC) so a released regression surfaces
    # even when no release happened — a registry-side or runner-image change can
    # break a published CLI that nobody republished.
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  cli-diag:
    name: gjsify CLI under Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # git-bash on windows-latest — one shell for both OSes
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # THE ONLY THING THIS JOB TAKES FROM THE REPO, and it is deliberately not a
      # checkout of the repo: `/scripts` alone, with cone mode OFF so no root-level
      # file (package.json, gjsify-lock.json, a .npmrc) materialises anywhere the
      # published CLI could walk up into. The premise of every step below is a runner
      # with NO gjsify tree on it — that is what makes this a user's experience rather
      # than ours — and a full checkout would quietly end that premise.
      #
      # THE LEADING SLASH IS LOAD-BEARING. A no-cone pattern is gitignore syntax, so a
      # bare `scripts` matches a directory of that name at EVERY depth: measured on this
      # branch, 33 of them and 198 files, reaching into `packages/`, `tests/` and
      # `showcases/` — which is the beginning of exactly the tree this job must not have.
      # `/scripts` anchors it to the root: one directory, 125 files.
      #
      # What it is for: `npm-install-published.mjs`, so npm's registry propagation lag
      # cannot be reported as an off-Linux toolchain gap. release.yml dispatches this
      # workflow minutes after the publish sweep with `cli_version: latest`, so the
      # dist-tag itself always resolves — but the TRANSITIVE @gjsify closure npm then
      # has to resolve is the same one whose lag the v0.46.0 incident measured (see
      # that script's header), and one lagging member is an ETARGET for the whole
      # install. The 0.30.0 note above is the same class from the other side: a probe
      # that runs before the thing it measures reports its own scheduling. Moving the
      # dispatch fixed the ORDER; this covers the lag that survives a correct order.
      - name: Fetch the install helper (/scripts only — no gjsify tree on this runner)
        uses: actions/checkout@v6
        with:
          path: gjsify-scripts
          sparse-checkout: /scripts
          sparse-checkout-cone-mode: false

      # A fresh project that depends on the PUBLISHED @gjsify/cli — exactly what a
      # user on this OS would have. npm wires the bin (a .cmd shim on Windows).
      - name: Scaffold a minimal gjsify project (npm install @gjsify/cli)
        env:
          CLI_VERSION: ${{ github.event.inputs.cli_version || 'latest' }}
        run: |
          set -eux
          mkdir gjsify-diag && cd gjsify-diag
          npm init -y >/dev/null
          node ../gjsify-scripts/scripts/npm-install-published.mjs -- \
            "@gjsify/cli@${CLI_VERSION}" --no-audit --no-fund
          # a minimal --app node entry that touches a node: builtin (stays external
          # on the node target) so we exercise real bundling, not an empty file.
          printf "import { platform, arch } from 'node:os';\nconsole.log('GJSIFY_DIAG_OK', platform(), arch());\n" > hello.ts
          echo "installed @gjsify/cli: $(node -p "require('./node_modules/@gjsify/cli/package.json').version")"

      - name: 'CLI loads: gjsify --version'
        id: version
        continue-on-error: true
        working-directory: gjsify-diag
        run: npx gjsify --version

      - name: 'Build: gjsify build --app node'
        id: build
        continue-on-error: true
        working-directory: gjsify-diag
        run: npx gjsify build hello.ts --app node --outfile hello.node.mjs

      - name: 'Run: node the built bundle'
        id: run
        continue-on-error: true
        working-directory: gjsify-diag
        run: |
          node hello.node.mjs | tee run.out
          grep -q "GJSIFY_DIAG_OK" run.out

      - name: 'Install backend: gjsify install a dep'
        id: install
        continue-on-error: true
        working-directory: gjsify-diag
        run: npx gjsify install @gjsify/path

      # The install backend's bin linking is the part that used to be
      # structurally impossible off Linux: it created a file symlink (needs
      # elevation/Developer Mode on Windows) and fell back to a raw copy of a
      # `#!/usr/bin/env node` script, which Windows can execute either way —
      # extension-less files are not on PATHEXT and there is no shebang
      # handling. It now writes npm's three-file cmd-shim set on win32 instead.
      # `@gjsify/cli` is the target because it declares a real Node bin with a
      # shebang, so this exercises the shebang-driven shim, not a stub.
      - name: 'Install backend: bin shim is created AND runnable'
        id: binshim
        continue-on-error: true
        env:
          CLI_VERSION: ${{ github.event.inputs.cli_version || 'latest' }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -eux
          mkdir gjsify-binshim && cd gjsify-binshim
          npm init -y >/dev/null
          # Install through gjsify's OWN backend (not npm), so the entry under
          # node_modules/.bin is the one linkBins wrote.
          npx --yes "@gjsify/cli@${CLI_VERSION}" install "@gjsify/cli@${CLI_VERSION}"
          ls -la node_modules/.bin/
          test -e node_modules/.bin/gjsify
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then
            # cmd.exe and pwsh entry points — absent before this fix.
            test -f node_modules/.bin/gjsify.cmd
            test -f node_modules/.bin/gjsify.ps1
          fi
          # Actually run it through the shim (git-bash on Windows uses the
          # extension-less `sh` member of the trio).
          ./node_modules/.bin/gjsify --version

      # `showcase` is the first thing a user runs, and the ONLY command that
      # asks about SYSTEM dependencies. This runner has no gjs — which is
      # exactly why the step belongs here: every Linux job has gjs installed,
      # so "does this work without gjs" is a question they structurally cannot
      # ask, and the environment answers it before the test can. That blind
      # spot shipped a pre-flight demanding a gjs binary for `--runtime node`
      # (#889) — every showcase unreachable for every Windows / plain-Node
      # user, on the default path too.
      #
      # Probes a gjs-ONLY showcase so the run ends at the declaration check:
      # no bundle, no node-gi, no GTK on the runner. WHICH error comes back is
      # the assertion — the declaration one means the runtime was resolved
      # first, the GJS one means it was not.
      #
      # This job measures the PUBLISHED CLI, which necessarily lags the fix.
      # So the EXPECTATION is bound to the installed version rather than
      # asserted unconditionally: below the first release carrying the fix a
      # gjs demand is a KNOWN gap — reported, not failed; from that release on
      # it is a regression and fails. The gate therefore arms ITSELF on the
      # release that fixes it, with no edit here and no hand-maintained
      # "currently skipped" list to drift.
      #
      # TWO bounds, because this step now gates TWO fixes that shipped in
      # DIFFERENT releases — the node-gi step below learned the same lesson the
      # hard way ("one bound served both and therefore lied about one of them").
      # Each is a BOUND, not a prediction of the next version number:
      #   * LOWEST_FIXED — the runtime gate must not demand gjs for
      #     `--runtime node`. Merged after 0.25.1, so >= 0.25.2 (#889).
      #   * LOWEST_PREFLIGHT_FIXED — the declaration check must run BEFORE the
      #     install, not after it. Merged after 0.31.0, so >= 0.31.1 (#1069).
      - name: 'Showcase: --runtime node does not demand gjs'
        id: showcase
        continue-on-error: true
        working-directory: gjsify-diag
        env:
          LOWEST_FIXED: '0.25.2'
          LOWEST_PREFLIGHT_FIXED: '0.31.1'
        run: |
          set -eux
          out="$(npx gjsify showcase webrtc-loopback --runtime node 2>&1 || true)"
          echo "$out"
          INSTALLED="$(node -p "require('./node_modules/@gjsify/cli/package.json').version")"
          # Compared in node (present by definition here); `sort -V` is not
          # portable across git-bash and BSD userland. Values travel through
          # the environment, never through string interpolation.
          #
          # One comparison, two call sites — a shell function for the same reason
          # the node-gi step below uses one: two inline copies serving two
          # different bounds is how the wrong fix got demanded of a release.
          has_fix() {
            INSTALLED="$1" BOUND="$2" node -e '
              const parse = (v) => v.split("-")[0].split(".").map(Number);
              const [a, b] = [process.env.INSTALLED, process.env.BOUND].map(parse);
              const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
              process.stdout.write(cmp >= 0 ? "1" : "0");
            '
          }
          HAS_FIX="$(has_fix "$INSTALLED" "$LOWEST_FIXED")"
          if echo "$out" | grep -q "Missing system dependencies"; then
            if [ "$HAS_FIX" = "1" ]; then
              echo "::error::@gjsify/cli $INSTALLED demanded gjs for --runtime node — the runtime gate ran too early"
              exit 1
            fi
            echo "::warning::@gjsify/cli $INSTALLED predates the runtime-gate fix (< $LOWEST_FIXED) — known gap, not failing"
            exit 0
          fi
          echo "$out" | grep -q "does not support --runtime node"

          # The error being RIGHT is not the whole property (#1069). It used to be
          # produced only AFTER a full resolve + download of the showcase tree and
          # the pinned native `@gjsify/node-gi` bridge — the bridge fetched
          # BECAUSE `--runtime node` was requested, to support a runtime the
          # package was about to refuse. The declaration is in the registry
          # packument, so it must be answered with one metadata GET and no
          # install. Asserting the ABSENCE of the install lines is what turns
          # "the error is right" into "the error is right and nothing was
          # downloaded to produce it" — the part that actually regressed.
          if [ "$(has_fix "$INSTALLED" "$LOWEST_PREFLIGHT_FIXED")" = "1" ]; then
            if echo "$out" | grep -q "gjsify install:"; then
              echo "::error::@gjsify/cli $INSTALLED installed the showcase tree before the declaration check rejected the run"
              exit 1
            fi
          elif echo "$out" | grep -q "gjsify install:"; then
            echo "::warning::@gjsify/cli $INSTALLED predates the showcase pre-flight (< $LOWEST_PREFLIGHT_FIXED) — known gap, not failing"
          fi

      # The PUBLISH-side question no other gate asks. `audit-runtimes --check` holds
      # "a declared target is produced by a CI job", and `node-gi.yml` genuinely
      # produces win32-x64 and darwin-arm64 — load test included. Nothing asked
      # whether the RELEASE ships them, and it did not: `@gjsify/node-gi@0.26.0`'s
      # tarball carried only the two linux targets, so `--runtime node` could not
      # work on this runner at all.
      #
      # This is the cheapest possible form of that check and needs no GTK and no
      # display: install the package and look for the addon for THIS host triple.
      # Only a cross-platform job can ask it, because only here is the host triple
      # something other than linux-x64.
      #
      # Version-bound like the showcase step below: a published version predating
      # the fix reports a KNOWN gap; from the first release carrying it, the same
      # absence fails. The gate arms itself, with no edit here.
      #
      # TWO bounds, because this step gates TWO different fixes that shipped in
      # DIFFERENT releases — one bound served both and therefore lied about one of
      # them (measured: it failed windows-latest against 0.26.1, demanding an
      # install fix that release does not contain).
      #   * LOWEST_PREBUILD_SHIPPED — the release from which the TARBALL must carry
      #     this target's prebuild. 0.26.1: verified by unpacking the published
      #     tarball, which contains all four declared targets.
      #   * LOWEST_INSTALL_FIXED — the release from which `npm install` must
      #     SUCCEED here. 0.26.1 still declares `install: node-gyp rebuild`, so it
      #     cannot; the guard that makes the prebuild reachable landed afterwards.
      # Both are BOUNDS, not predictions of a version number: any later release
      # arms them.
      - name: 'node-gi: a prebuild exists for this platform'
        id: nodegiprebuild
        continue-on-error: true
        working-directory: gjsify-diag
        env:
          LOWEST_PREBUILD_SHIPPED: '0.26.1'
          LOWEST_INSTALL_FIXED: '0.26.2'
        run: |
          set -eux
          TARGET="$(node -p "process.platform + '-' + process.arch")"
          # One comparison, three call sites — the copies drifted into serving two
          # different bounds from one variable, which is how the wrong fix got
          # demanded of a release.
          has_fix() {
            INSTALLED="$1" BOUND="$2" node -e '
              const parse = (v) => v.split("-")[0].split(".").map(Number);
              const [a, b] = [process.env.INSTALLED, process.env.BOUND].map(parse);
              const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
              process.stdout.write(cmp >= 0 ? "1" : "0");
            '
          }
          # The install is ALLOWED to fail and is a finding in its own right. It
          # declares `scripts.install: node-gyp rebuild`, so npm ALWAYS runs a
          # source build here — independent of whether a prebuild ships — and a
          # tarball missing a file that `binding.gyp` calls makes `npm install`
          # itself fail. Letting `set -e` kill the step would report that as a raw
          # node-gyp trace with no attribution.
          install_ok=1
          npm install --no-audit --no-fund --no-save "@gjsify/node-gi@latest" > npm-nodegi.log 2>&1 || install_ok=0
          tail -40 npm-nodegi.log
          # A failed install often ROLLS BACK, so the package is simply not there
          # afterwards. That is a CONSEQUENCE of the failure above, not a separate
          # defect, and it must stay version-bound with it — treating "not placed"
          # as unconditionally fatal made a KNOWN gap fail the job (measured on
          # windows-latest: the node-gyp configure error leaves no package behind).
          #
          # Only the other order is inexplicable and stays hard: npm reported
          # SUCCESS and the package is still missing.
          if [ ! -f node_modules/@gjsify/node-gi/package.json ]; then
            if [ "$install_ok" = "1" ]; then
              echo "::error::npm reported success but did not place @gjsify/node-gi on $TARGET"
              exit 1
            fi
            # The version bound needs a version, and the manifest is gone — read it
            # from the registry instead of guessing.
            INSTALLED="$(npm view @gjsify/node-gi version 2>/dev/null || echo 0.0.0)"
            if [ "$(has_fix "$INSTALLED" "$LOWEST_INSTALL_FIXED")" = "1" ]; then
              echo "::error::@gjsify/node-gi $INSTALLED cannot be installed on $TARGET at all — its install script runs node-gyp unconditionally and npm rolled the install back"
              exit 1
            fi
            echo "::warning::@gjsify/node-gi $INSTALLED cannot be installed on $TARGET and predates the install fix (< $LOWEST_INSTALL_FIXED) — known gap, not failing"
            exit 0
          fi
          ADDON="node_modules/@gjsify/node-gi/prebuilds/$TARGET/node_gi.node"
          ls -la node_modules/@gjsify/node-gi/prebuilds/ || true
          INSTALLED="$(node -p "require('./node_modules/@gjsify/node-gi/package.json').version")"
          if [ -f "$ADDON" ] && [ "$install_ok" = "1" ]; then
            echo "prebuild present for $TARGET and the install completed"
            exit 0
          fi
          # Report the two failure modes separately — they have different causes
          # and different fixes, and collapsing them would send the next reader
          # after the wrong one.
          if [ "$install_ok" = "0" ]; then
            if [ "$(has_fix "$INSTALLED" "$LOWEST_INSTALL_FIXED")" = "1" ]; then
              echo "::error::@gjsify/node-gi $INSTALLED failed to install on $TARGET — its install script must prefer the shipped prebuild, so an install that still runs node-gyp here is the defect"
              exit 1
            fi
            echo "::warning::@gjsify/node-gi $INSTALLED failed to install on $TARGET and predates the install fix (< $LOWEST_INSTALL_FIXED) — known gap, not failing"
            exit 0
          fi
          # It is declared but not shipped — report which, so the message names the
          # contradiction rather than just the missing file.
          DECLARED="$(node -p "require('./node_modules/@gjsify/node-gi/package.json').gjsify.platforms.join(' ')")"
          if [ "$(has_fix "$INSTALLED" "$LOWEST_PREBUILD_SHIPPED")" = "1" ]; then
            echo "::error::@gjsify/node-gi $INSTALLED declares [$DECLARED] but ships no prebuild for $TARGET — every --runtime node command fails at the addon load"
            exit 1
          fi
          echo "::warning::@gjsify/node-gi $INSTALLED ships no $TARGET prebuild (declares [$DECLARED]) and predates the shipping fix (< $LOWEST_PREBUILD_SHIPPED) — known gap, not failing"

      # Does the addon LOAD? The step above asks only whether the FILE is there,
      # and says so ("needs no GTK and no display"). File existence is exactly the
      # assertion that stays green while `LoadLibrary` fails on the addon's
      # dependency closure — which is what every `gi://` showcase did on a clean
      # Windows host (#1063), with the file present the whole time:
      #
      #   Error: Das angegebene Modul wurde nicht gefunden.
      #   \\?\C:\...\prebuilds\win32-x64\node_gi.node   code: ERR_DLOPEN_FAILED
      #
      # Nothing in this repository has ever executed that load off a Windows
      # runner carrying gvsbuild, so nothing could see it. This step is the
      # mechanism (#1065): install the published prebuild PLUS the published
      # batteries-included bundle, and resolve a real namespace.
      #
      # THE RUNNER MUST STAY GTK-FREE. Installing gvsbuild here would make the
      # step measure the runner instead of the artifact, which is the failure mode
      # of the existence gate one level up. GLib alone is the probe: loading the
      # addon and resolving one namespace exercises the entire DLL closure and the
      # PATH-prepend in gtk-runtime.js, with no window and nothing to flake.
      - name: 'node-gi: the addon LOADS with no system GTK'
        id: nodegiload
        continue-on-error: true
        if: runner.os == 'Windows'
        working-directory: gjsify-diag
        env:
          # The release from which the bundle is expected to make the addon
          # loadable here. A BOUND, not a prediction: the policy that lets a
          # shipped bundle serve a prebuild merged after 0.31.0.
          LOWEST_BUNDLE_FIXED: '0.31.1'
        run: |
          set -eux
          TARGET="$(node -p "process.platform + '-' + process.arch")"
          has_fix() {
            INSTALLED="$1" BOUND="$2" node -e '
              const parse = (v) => v.split("-")[0].split(".").map(Number);
              const [a, b] = [process.env.INSTALLED, process.env.BOUND].map(parse);
              const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
              process.stdout.write(cmp >= 0 ? "1" : "0");
            '
          }
          npm install --no-audit --no-fund --no-save "@gjsify/node-gi@latest" "@gjsify/gtk-runtime-$TARGET@latest" > npm-load.log 2>&1 || true
          tail -20 npm-load.log
          INSTALLED="$(node -p "require('./node_modules/@gjsify/node-gi/package.json').version" 2>/dev/null || echo 0.0.0)"
          # `requireGi` is the consumer-facing entry, so this is the same code path
          # a showcase takes. GLib.get_monotonic_time() proves the namespace is not
          # merely present but callable — an unbacked typelib resolves and then
          # dies in its first call, which is the failure shape the bundle gates
          # exist to prevent.
          load_ok=1
          node -e '
            const { requireGi } = await import("@gjsify/node-gi/gi");
            const GLib = requireGi("GLib", "2.0");
            const t = GLib.get_monotonic_time();
            if (!(typeof t === "bigint" || typeof t === "number")) throw new Error("GLib call returned " + typeof t);
            console.log("addon loaded and GLib is callable");
          ' > load.log 2>&1 || load_ok=0
          cat load.log
          if [ "$load_ok" = "1" ]; then
            echo "the addon loaded against the bundle, with no gvsbuild on this runner"
            exit 0
          fi
          if [ "$(has_fix "$INSTALLED" "$LOWEST_BUNDLE_FIXED")" = "1" ]; then
            echo "::error::@gjsify/node-gi $INSTALLED could not load on $TARGET with @gjsify/gtk-runtime-$TARGET installed — this is #1063"
            exit 1
          fi
          echo "::warning::@gjsify/node-gi $INSTALLED predates the GTK-source policy (< $LOWEST_BUNDLE_FIXED) — known gap, not failing"

      # And the same load WITHOUT the bundle must fail ACTIONABLY rather than with
      # a raw OS string in the host's language. The diagnosis is the other half of
      # #1063: the message a user actually meets has to name GTK, the package that
      # supplies it, and the MSVC runtime.
      - name: 'node-gi: a bundle-less load is diagnosed, not just failed'
        id: nodegidiag
        continue-on-error: true
        if: runner.os == 'Windows'
        working-directory: gjsify-diag
        env:
          LOWEST_BUNDLE_FIXED: '0.31.1'
        run: |
          set -eux
          TARGET="$(node -p "process.platform + '-' + process.arch")"
          rm -rf node_modules/@gjsify/gtk-runtime-$TARGET
          INSTALLED="$(node -p "require('./node_modules/@gjsify/node-gi/package.json').version" 2>/dev/null || echo 0.0.0)"
          out="$(node -e 'await import("@gjsify/node-gi/gi")' 2>&1 || true)"
          echo "$out"
          # If it loaded anyway the runner has a GTK we did not expect, and this
          # step is measuring the machine rather than the message. Say so instead
          # of reporting a pass.
          if ! echo "$out" | grep -qi "could not be loaded\|Modul\|module could not be found\|ERR_DLOPEN_FAILED"; then
            echo "::warning::no load failure to diagnose on this runner — a system GTK is present, so this step proved nothing"
            exit 0
          fi
          if echo "$out" | grep -q "@gjsify/gtk-runtime-$TARGET" && echo "$out" | grep -q "vcruntime140"; then
            echo "the failure names the bundle and the MSVC runtime"
            exit 0
          fi
          has_fix() {
            INSTALLED="$1" BOUND="$2" node -e '
              const parse = (v) => v.split("-")[0].split(".").map(Number);
              const [a, b] = [process.env.INSTALLED, process.env.BOUND].map(parse);
              const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
              process.stdout.write(cmp >= 0 ? "1" : "0");
            '
          }
          if [ "$(has_fix "$INSTALLED" "$LOWEST_BUNDLE_FIXED")" = "1" ]; then
            echo "::error::@gjsify/node-gi $INSTALLED failed to load and the error names neither @gjsify/gtk-runtime-$TARGET nor the MSVC runtime — see #1063"
            exit 1
          fi
          echo "::warning::@gjsify/node-gi $INSTALLED predates the load diagnosis (< $LOWEST_BUNDLE_FIXED) — known gap, not failing"

      # The FULL end-user journey, run to completion. The step above it asserts a
      # correct EARLY EXIT for a gjs-only showcase; that assertion is valuable and
      # stays, but it terminates before the dlx cache, before any install and before
      # the addon load — which is precisely why a directory-symlink `EPERM` in the
      # dlx cache shipped to Windows users unnoticed. A probe that stops one step
      # before the code that breaks cannot see the break.
      #
      # `express-webserver` is the showcase for this, deliberately not the
      # canvas/GTK ones: it declares `node` in `gjsify.example.runtimes` AND is
      # headless, so it proves dlx cache -> install -> node bundle -> real HTTP
      # response with no display and no GTK on the runner. The GUI showcases need
      # a windowing GTK bundle that is a separate, still-open concern.
      #
      # It serves forever (`app.listen`), so the run is BOUNDED: start detached,
      # poll until it answers, assert the payload, then kill it. A hang must fail
      # the step rather than burn the job timeout, which is what the poll ceiling
      # is for.
      - name: 'Showcase: the full --runtime node journey'
        id: journey
        continue-on-error: true
        working-directory: gjsify-diag
        env:
          LOWEST_FIXED: '0.26.1'
          PORT: '3123'
        run: |
          set -eux
          npx gjsify showcase express-webserver --runtime node > journey.log 2>&1 &
          SHOWCASE_PID=$!
          ok=0
          # ~90s ceiling: a cold dlx tree installs the showcase + node-gi first.
          # Counter loop, not `seq`: `seq` is coreutils and not something to assume
          # of every runner image's bash (git-bash on windows-latest included).
          tries=0
          while [ "$tries" -lt 90 ]; do
            if curl -fsS "http://127.0.0.1:${PORT}/api/posts" -o payload.json 2>/dev/null; then ok=1; break; fi
            # If the child is already gone, stop waiting — it failed to start, and
            # polling a dead process for 90s would hide the reason in the timeout.
            kill -0 "$SHOWCASE_PID" 2>/dev/null || break
            tries=$((tries + 1))
            sleep 1
          done
          kill "$SHOWCASE_PID" 2>/dev/null || true
          wait "$SHOWCASE_PID" 2>/dev/null || true
          cat journey.log
          INSTALLED="$(node -p "require('./node_modules/@gjsify/cli/package.json').version")"
          HAS_FIX="$(INSTALLED="$INSTALLED" node -e '
            const parse = (v) => v.split("-")[0].split(".").map(Number);
            const [a, b] = [process.env.INSTALLED, process.env.LOWEST_FIXED].map(parse);
            const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            process.stdout.write(cmp >= 0 ? "1" : "0");
          ')"
          if [ "$ok" = "1" ]; then
            # Assert something is really answering with JSON — deliberately NOT a
            # shape assertion: the showcase's payload contract is not pinned
            # anywhere, and inventing one here would fail on a harmless change to
            # the demo data. `readFileSync`, not `require`, because the scaffold's
            # module type is not ours to assume.
            node -e "
              const { readFileSync } = require('node:fs');
              const raw = readFileSync('payload.json', 'utf8');
              const parsed = JSON.parse(raw);
              if (raw.length === 0 || parsed === null) { console.error('empty payload'); process.exit(1); }
              console.log('payload parsed,', raw.length, 'bytes');
            "
            echo "the journey completed and the showcase served a response"
            exit 0
          fi
          if [ "$HAS_FIX" = "1" ]; then
            echo "::error::@gjsify/cli $INSTALLED could not run a node-declared showcase to completion on this platform — see journey.log above"
            exit 1
          fi
          echo "::warning::@gjsify/cli $INSTALLED predates the Windows/dlx fixes (< $LOWEST_FIXED) — known gap, not failing"

      - name: Diagnostic summary
        run: |
          echo "## gjsify CLI on ${{ matrix.os }} (Node)" >> "$GITHUB_STEP_SUMMARY"
          echo "| step | outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| gjsify --version | ${{ steps.version.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gjsify build --app node | ${{ steps.build.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| run the bundle | ${{ steps.run.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gjsify install (backend) | ${{ steps.install.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| .bin shim created + runnable | ${{ steps.binshim.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| showcase --runtime node (no gjs) | ${{ steps.showcase.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| node-gi prebuild for this platform | ${{ steps.nodegiprebuild.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| node-gi addon LOADS (no system GTK) | ${{ steps.nodegiload.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| bundle-less load is diagnosed | ${{ steps.nodegidiag.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| showcase --runtime node (full journey) | ${{ steps.journey.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "--- outcomes: version=${{ steps.version.outcome }} build=${{ steps.build.outcome }} run=${{ steps.run.outcome }} install=${{ steps.install.outcome }} binshim=${{ steps.binshim.outcome }}"
          # Every substantive step stays continue-on-error so ONE run still maps
          # ALL the gaps; the gate lives here, at the end.
          #
          # `install` is part of that gate: the native backend's path handling is
          # already Windows-correct, so a failure there is a real regression.
          #
          # `binshim` gates like every other step. It covers npm's win32
          # cmd-shim trio (`<name>` / `.cmd` / `.ps1`), which replaces a file
          # symlink needing elevation and a `#!` script Windows cannot execute.
          # `utils/bin-shim.spec.ts` additionally unit-tests the win32 branch
          # from Linux by injecting the platform.
          FAILED=0
          if [ "${{ steps.version.outcome }}" != "success" ]; then FAILED=1; fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then FAILED=1; fi
          if [ "${{ steps.run.outcome }}" != "success" ]; then FAILED=1; fi
          if [ "${{ steps.install.outcome }}" != "success" ]; then FAILED=1; fi
          if [ "${{ steps.binshim.outcome }}" != "success" ]; then FAILED=1; fi
          # `showcase` gates like the rest. It measures the PUBLISHED CLI, so
          # its EXPECTATION is version-bound (see the step): a gjs demand from
          # a CLI predating the fix warns and passes; from the first release
          # carrying it, the same demand fails. Nothing to remember later.
          if [ "${{ steps.showcase.outcome }}" != "success" ]; then FAILED=1; fi
          # The two publish-side probes gate the same way, and for the same reason
          # the others do: they are the only steps in this repository that can ask
          # whether a RELEASED artifact works on a platform nobody here runs.
          #
          # `nodegiprebuild` asks the question no declaration invariant covers —
          # `audit-runtimes --check` proves a CI job BUILDS a target, never that the
          # release SHIPS it, and two of node-gi's four declared platforms were
          # missing from the tarball while every check stayed green.
          #
          # `journey` is the end-user path run to completion. The `showcase` step
          # above asserts a correct early exit for a gjs-only showcase; this one
          # goes all the way through the dlx cache, the install and the bundle, and
          # is what would have caught the directory-symlink EPERM on Windows.
          #
          # Both are version-bound in their steps, so they report against a CLI
          # predating the fix and fail from the first release that carries it.
          if [ "${{ steps.nodegiprebuild.outcome }}" != "success" ]; then FAILED=1; fi
          if [ "${{ steps.journey.outcome }}" != "success" ]; then FAILED=1; fi
          # The two LOAD probes gate too. They are win32-only (`if: runner.os ==
          # 'Windows'`), so on macOS their outcome is `skipped` — accepted there
          # and ONLY there. Without these two lines both steps are
          # continue-on-error forever: they would report a regression and leave
          # the job green, which is the exact shape of the existence gate they
          # were added to replace.
          for OUTCOME in "${{ steps.nodegiload.outcome }}" "${{ steps.nodegidiag.outcome }}"; do
            if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "skipped" ]; then FAILED=1; fi
          done
          if [ "$FAILED" = "0" ]; then
            echo "CLI PATH GREEN on ${{ matrix.os }} (toolchain + install backend)"
          else
            echo "CLI PATH BROKEN on ${{ matrix.os }} — see the step outcomes above"
            exit 1
          fi
