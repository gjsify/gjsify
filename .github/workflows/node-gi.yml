name: node-gi

# Dedicated CI for @gjsify/node-gi — the Node-native GObject-Introspection
# engine (Axis 5). It is NOT a gjsify workspace member (the GJS-first
# install/foreach tooling can't build a node-gyp addon), so the main GJS
# workflow does not build or test it; this workflow is its source of truth.
# Builds the N-API addon against girepository-2.0 and runs the smoke tests on
# Node, mirroring the Fedora 44 environment the rest of CI uses.

on:
  push:
    branches: [main]
    paths:
      - 'packages/node-gi/**'
      - 'scripts/node-gi-consumer-harness.mjs'
      - '.github/workflows/node-gi.yml'
  pull_request:
    paths:
      - 'packages/node-gi/**'
      - 'scripts/node-gi-consumer-harness.mjs'
      - '.github/workflows/node-gi.yml'

permissions:
  contents: read

concurrency:
  group: node-gi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (Node / Fedora 44)
    runs-on: ubuntu-latest
    # Backstop: the mainloop tests run a blocking GLib loop; a regression in the
    # libuv↔GLib bridge could hang run(), so cap the job rather than wait 6h.
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + GObject-Introspection dev headers
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            glib2-devel gobject-introspection-devel gobject-introspection gjs cairo-devel \
            dbus-daemon \
            pango gdk-pixbuf2 dejavu-sans-fonts
          # pango (Pango/PangoCairo typelibs) + gdk-pixbuf2 (GdkPixbuf typelib) back the
          # caller-alloc-struct-out + bytes-in conformance programs; dejavu supplies a
          # real font so Pango layout relations (width > 0) hold deterministically.
          gjs --version
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"
          echo "dbus-run-session: $(command -v dbus-run-session)"

      # Use the official nodejs.org build, NOT Fedora's `dnf nodejs`: the Fedora
      # package segfaults rolldown's prebuilt napi binding (the gjsify bundler
      # engine) inside the minimal container, so `gjsify build` crashes. The
      # official build runs it fine. setup-node works inside this container (the
      # main workflow does the same), and node-gyp builds the addon against it.
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Bun + Deno for the quad-runtime example capstone below (gjs + node are
      # already present). The quad harness auto-skips a runtime not on PATH, so
      # these just widen the capstone from 2 to all 4 runtimes in this one job.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runtimes
        run: |
          node --version
          bun --version
          deno --version

      - name: Build native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      - name: Smoke test (node --test)
        working-directory: packages/node-gi/node-gi
        run: npm test

      # DBus leg: the Gio.DBus client surface (makeProxyWrapper + name owning +
      # a live signal round-trip) needs a session bus — no display required, so it
      # runs here under a throwaway private bus (dbus-run-session, from the
      # dbus-daemon package added above). The test also spawns `gjs -m` against its
      # OWN private bus and asserts the normalized round-trip is byte-identical
      # (gjs is the gold standard). The default `npm test` above self-skips these
      # cases when no bus is reachable, so this is the leg that exercises them.
      - name: DBus test (dbus-run-session)
        working-directory: packages/node-gi/node-gi
        run: npm run test:dbus

      # GC-stress leg: the toggle-ref instance bridge (wrapper identity,
      # collectability, toggle-up rooting, resurrection, signal-cycle, soak) only
      # surfaces under deliberate GC pressure, which needs --expose-gc for
      # global.gc(). Plain `node --test` self-skips those cases; this leg runs
      # them. Reuses the addon already built by the previous step.
      - name: GC-stress test (node --test --expose-gc)
        working-directory: packages/node-gi/node-gi
        run: npm run test:gc

      # Golden-diff conformance harness: the same gi:// programs
      # (conformance/programs/*.conf.mjs) run on gjs, node, bun AND deno —
      # stdout must be byte-identical to the committed goldens (gjs = the
      # reference; failures are only excusable via the strict exclusion ledger,
      # and a stale ledger entry fails too). All four runtimes are installed in
      # this job; no bundler involved (runtime twins via globals.js + requireGi).
      - name: Conformance (golden-diff, gjs/node/bun/deno)
        working-directory: packages/node-gi/node-gi
        run: npm run test:conformance

      # Tier-B typelib oracle: the GJS installed-tests port (gimarshalling/)
      # runs against the purpose-built GIMarshallingTests-1.0 typelib compiled
      # from the pinned gobject-introspection-tests revision (the same pin
      # refs/gjs tests against). meson + ninja are installed in a dedicated
      # step (the shared dnf line at the top of the job stays stable), and the
      # built .gi-tests/ tree is cached keyed by that pin — a hit makes the
      # typelib build a stamped no-op. The rev in the key MUST match PINNED_REV
      # in scripts/build-gi-test-typelibs.mjs.
      - name: Install meson + ninja (typelib oracle build deps)
        run: dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 meson ninja-build

      - name: Cache GI test typelibs (pinned rev)
        uses: actions/cache@v4
        with:
          path: packages/node-gi/node-gi/.gi-tests
          key: gi-test-typelibs-67432ee4ebf74349cb3c848f73945b21a767e276-fedora44-v1

      - name: Typelib oracle (GIMarshallingTests port)
        working-directory: packages/node-gi/node-gi
        run: npm run test:gimarshalling

      # Quad-runtime capstone: several unchanged gi:// sources build + run
      # BYTE-IDENTICALLY on gjs, node, bun AND deno. `npm install` builds
      # @gjsify/node-gi via the `file:../node-gi` dependency (node-gyp), so the
      # example exercises the in-tree runtime + addon. `quad.e2e.mjs` builds each
      # source `--app gjs` (real bundler) + runs on gjs (the reference), then
      # runs the `--app node` bundle (or its runtime twin) on node/bun/deno,
      # asserting every runtime's output equals gjs and the fixed golden.
      - name: Quad gjs/node/bun/deno example (capstone)
        working-directory: packages/node-gi/example
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          node --test quad.e2e.mjs

  # Cross-runtime proof: the SAME Node-API addon runs the GObject/GLib/Gio surface
  # on Bun and Deno, not just Node. node-gyp builds it once; scripts/stage-prebuild
  # then stages it as prebuilds/<platform>-<arch>/ so the conformance runs load via
  # the PREBUILD path (the only install path Deno supports — it runs no postinstall
  # build). The runner spawns one bun/deno process per file (they share a process
  # across files by default, unlike Node's per-file pool). Headless — no display —
  # so the GTK/co-pump/--expose-gc legs are excluded (they stay Node's job above).
  cross-runtime:
    name: Bun + Deno conformance (Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + GObject-Introspection dev headers
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            glib2-devel gobject-introspection-devel gobject-introspection cairo-devel
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"

      # Official Node builds the addon (node-gyp) and orchestrates the runner, which
      # spawns bun/deno per file. Same rationale as the build-test job.
      - name: Use official Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      - name: Stage prebuild (conformance loads via the prebuild path)
        working-directory: packages/node-gi/node-gi
        run: node scripts/stage-prebuild.mjs

      - name: Verify runtimes
        run: |
          node --version
          bun --version
          deno --version

      # NODE_GI_NATIVE=prebuild keeps this job validating the prebuild LOAD PATH
      # (Deno's install path) explicitly — the runner otherwise defaults to the
      # just-built addon so stale local prebuilds can't shadow verification.
      - name: Conformance on Bun
        working-directory: packages/node-gi/node-gi
        run: npm run test:bun
        env:
          NODE_GI_NATIVE: prebuild

      - name: Conformance on Deno
        working-directory: packages/node-gi/node-gi
        run: npm run test:deno
        env:
          NODE_GI_NATIVE: prebuild

  # GTK/Adw layering proof (Axis-5 GTK milestone): UNCHANGED Gtk.Application (PR1),
  # Adw.Application (PR2) AND a Gtk.Template composite-template widget (PR4) run on
  # Node via the engine — construct + activate + window + Adwaita chrome
  # (HeaderBar/ToolbarView/StatusPage) + CSS provider + quit; the libuv↔GLib bridge
  # co-pumps Node's event loop during g_application_run (a setTimeout scheduled
  # before run() fires while run() blocks); and a registerClass({Template,Children,
  # InternalChildren,CssName}) subclass installs its template in class_init, runs
  # gtk_widget_init_template at construction, and exposes its bound children on the
  # instance. This needs a display + the GTK/Adw stack, so it is isolated in a
  # dedicated job: the fast headless `Build & test` leg above stays light and the
  # smoke tests self-skip there (no DISPLAY). Runs the GTK loop, so cap the job
  # rather than let a hung loop wait 6h.
  gtk-smoke:
    name: GTK/Adw smoke (Node + Xvfb / Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The storybook proof (last step) runs the prebuilt --app node storybook
    # bundle the storybook-node-gi-bundle job produced — the Linux parity of the
    # windows-gtk-storybook capstone (same bundle, both platforms).
    needs: storybook-node-gi-bundle
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + GTK4/Adwaita + Xvfb + dbus
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz gjs \
            glib2-devel gobject-introspection-devel gobject-introspection \
            gtk4-devel libadwaita-devel adwaita-icon-theme gtksourceview5-devel \
            xorg-x11-server-Xvfb dbus-daemon dbus-x11 mesa-dri-drivers
          gjs --version
          echo "gtk4: $(pkg-config --modversion gtk4)"
          echo "libadwaita: $(pkg-config --modversion libadwaita-1)"
          echo "gtksourceview5: $(pkg-config --modversion gtksourceview-5)"

      # Same rationale as the build-test job: the official nodejs.org build, not
      # Fedora's dnf node (which crashes the bundler's prebuilt napi binding).
      - name: Use official Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      # Xvfb gives a virtual X11 display; dbus-run-session gives a private session
      # bus so GApplication startup is quiet/deterministic; GSK_RENDERER=cairo +
      # LIBGL_ALWAYS_SOFTWARE=1 + GDK_BACKEND=x11 keep GTK off any GPU/Vulkan path
      # that a software-only Xvfb cannot provide; GTK_A11Y=none avoids the a11y bus.
      # Runs ALL the GTK smoke tests (Gtk.Application PR1 + Adw.Application PR2 +
      # Gtk.Template PR4 + Template signal callbacks & menu breadth + the GStrv
      # construct-property cases + the GListModel interface-typed property cases +
      # the Adwaita widget-breadth proof (widgets.test.mjs: PreferencesPage/Group +
      # SwitchRow/EntryRow/ComboRow/SpinRow/ExpanderRow + a Gtk.ListBox + a toast,
      # DumpTree-typed and driven through the node-gi notify:: signal chain) + the
      # GtkSource-5 proof (gtksource-smoke.test.mjs: a GtkSource.Buffer/Language
      # Manager model + a GtkSource.GutterRendererText SUBCLASS with a
      # vfunc_query_data override — Learn6502's editor-gutter shape — constructs,
      # inserts into a GtkSource.View gutter and rasterises; the Learn6502-port
      # groundwork), which need the Gtk-4.0 typelib the fast headless leg lacks) in
      # one node --test invocation so each reports even if one fails.
      - name: GTK/Adw smoke test (xvfb + dbus)
        working-directory: packages/node-gi/node-gi
        run: |
          xvfb-run -a dbus-run-session -- \
            env GSK_RENDERER=cairo GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
            node --test test/gtk-smoke.test.mjs test/adw-smoke.test.mjs \
              test/windowing.test.mjs test/windowing-interactive.test.mjs \
              test/widgets.test.mjs test/gtksource-smoke.test.mjs \
              test/gtk-template.test.mjs test/gtk-template-callbacks.test.mjs \
              test/gtk-template-signals.test.mjs \
              test/strv-construct.test.mjs test/interface-props.test.mjs

      # GTK capstone: ONE unchanged Adwaita gi:// source builds + runs
      # byte-identically on BOTH gjs and node under one display — the GTK analog of
      # the headless L3 capstone. `npm install` builds @gjsify/node-gi via the
      # file:../node-gi dependency (node-gyp), so the example exercises the in-tree
      # runtime + addon. dual.e2e.mjs builds `--app gjs` (real bundler) + runs on
      # gjs, and runs the same source on node (the real `--app node` bundle when
      # the installed CLI carries the gi://→requireGi rewrite, else the
      # @gjsify/node-gi runtime), asserting both equal the golden. Both runtimes
      # run under the SAME Xvfb display + software render env; the gjs binary is
      # installed above for the gjs side.
      - name: GTK dual gjs+node Adwaita example (capstone)
        working-directory: packages/node-gi/example-gtk
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          xvfb-run -a dbus-run-session -- \
            env GSK_RENDERER=cairo GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
            node --test dual.e2e.mjs

      # Storybook capstone (Linux parity of windows-gtk-storybook): the SAME
      # prebuilt `--app node` Adwaita-Storybook bundle the storybook-node-gi-bundle
      # job produced, run on Node via the reverse bridge. `GJSIFY_STORYBOOK_PROBE`
      # drives it headlessly (no DBus): asserts the sidebar lists the component
      # categories, the storybook chrome is in the widget tree, a representative
      # story (Boxed Lists/Switch Row) opens + renders an AdwSwitchRow subtree, and
      # the window rasterises to a non-empty GSK PNG — then quits 0/1. The bundle is
      # placed IN the node-gi package dir so its external `@gjsify/node-gi/gi` import
      # self-resolves (Node package self-reference); NODE_GI_NATIVE=build loads the
      # node-gyp addon this job built. System GTK + Xvfb here; the Windows leg proves
      # the same bundle on the batteries-included --windowing bundle with no gvsbuild.
      - name: Download the Adwaita Storybook --app node bundle
        uses: actions/download-artifact@v4
        with:
          name: storybook-node-gi-bundle
          path: packages/node-gi/node-gi

      - name: Storybook proof — full Adwaita gallery renders on node-gi (system GTK, xvfb)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: build
          GJSIFY_STORYBOOK_PROBE: '1'
          GJSIFY_STORYBOOK_PROBE_STORY: 'Boxed Lists/Switch Row'
          GJSIFY_STORYBOOK_PROBE_STORY_WIDGET: 'AdwSwitchRow'
          GJSIFY_STORYBOOK_PROBE_OUT: storybook-probe.json
        run: |
          set +e
          xvfb-run -a dbus-run-session -- \
            env GSK_RENDERER=cairo GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
            node storybook.node.mjs
          code=$?
          set -e
          echo "--- probe result ---"; cat storybook-probe.json 2>/dev/null || true
          exit $code

  # Second real consumer of the node-gi reverse bridge (ADR-0005 graduation-gate
  # item: "a second real consumer using the dual-build"; consumer #1 is
  # `gjsify storybook --runtime node`). Runs the Tier-1 `@gjsify/sqlite` package's
  # OWN GJS test suite UNDER node-gi on Node: `gjsify build --app node
  # --alias node:sqlite=@gjsify/sqlite` rewrites its `gi://Gda?version=6.0` onto
  # `@gjsify/node-gi` (the L2 gjsGiNodePlugin) and retargets the specs' `node:sqlite`
  # import onto the libgda-backed polyfill, then runs it on `node`. sqlite's
  # DatabaseSync/StatementSync API is fully SYNCHRONOUS (libgda open/execute block),
  # so the WHOLE suite runs with no GLib main-loop pumping: of the 52 tests, 51 pass
  # — exercising real `Gda.Connection` construction, GObject/GValue-parameter method
  # marshalling AND result-row reading via `Gda.DataModel.get_value_at()` (node-gi
  # unboxes its scalar GValue returns to JS primitives since gjsify PR #735). The 1
  # remaining failure is skipped WITH a documented reason (a BLOB `Uint8Array` does
  # not yet round-trip to/from a GValue byte array — a distinct marshalling gap) via
  # the opt-in `run(..., { skip })` list in `src/test.node-gi.mts`; the shared specs
  # are reused verbatim, never weakened. `@gjsify/node-gi` is a devDependency ONLY
  # (the sanctioned ADR-0005 seam; `scripts/audit-runtimes.mjs --check` stays green).
  #
  # BUILD ENGINE — under Node, not GJS. The workspace `.bin/gjsify` that
  # `gjsify install` writes is GJS-first (runs the committed cli.gjs.mjs bundle when
  # gjs is present), whose `gjsify build` needs `@gjsify/rolldown-native` — a
  # vala/meson prebuild NOT in this minimal fedora container. So every `gjsify build`
  # here runs under Node via a published `@gjsify/cli` (npm `rolldown` engine), the
  # same way the build-test job builds the node-gi/example. Isolated in its own job
  # like cross-runtime/gtk-smoke — the other jobs are untouched.
  consumer-sqlite:
    name: sqlite suite as node-gi consumer (Node / Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + GI dev headers + cairo + libgda (Gda-6.0 typelib) + gjs
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            glib2-devel gobject-introspection-devel gobject-introspection gjs \
            cairo-devel cairo-gobject-devel \
            libgda libgda-sqlite \
            libsoup3
          gjs --version
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"
          echo "Gda typelib: $(ls /usr/lib64/girepository-1.0/Gda-6.0.typelib 2>/dev/null || echo MISSING)"

      # Official nodejs.org build, NOT Fedora's dnf node (which crashes rolldown's
      # prebuilt napi binding — the gjsify bundler engine). Same rationale as the
      # build-test job. Also builds the @gjsify/node-gi addon via node-gyp.
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build @gjsify/node-gi native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      # Node-free workspace install via the committed CLI bundle (the supported
      # `gjsify install --immutable` path). Needed because @gjsify/sqlite is a
      # workspace package with `workspace:^` deps + `@girs/gda-6.0` — it cannot be
      # built standalone like the self-contained node-gi/example.
      - name: Install the gjsify workspace (committed CLI bundle, Node-free)
        run: gjs -m packages/infra/cli/dist/cli.gjs.mjs install --immutable

      # Repoint the workspace `.bin/gjsify` at a Node-runnable published @gjsify/cli
      # so every `gjsify build` below runs under Node (npm `rolldown`), NOT the
      # committed GJS bundle (which needs the absent @gjsify/rolldown-native). The
      # published cli ships a prebuilt Node entry; install the version the workspace
      # pins (one release train per ADR 0008) into a scratch dir and symlink it in.
      - name: Use a published @gjsify/cli as the Node bundler (npm rolldown)
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && npm install "@gjsify/cli@${CLI_VERSION}" --no-audit --no-fund --no-save )
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          echo "Node bundler: $(node_modules/.bin/gjsify --version)"

      # Build only what the --app node bundle inlines: @gjsify/sqlite's lib and
      # @gjsify/unit's lib (+ their transitive workspace-dep libs, topological).
      # build:gjsify (the --library step) is enough — the bundle needs lib/esm/*.js,
      # not the .d.ts emit. Runs under Node via the repointed .bin/gjsify.
      - name: Build @gjsify/sqlite + @gjsify/unit under Node (+ workspace deps)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          gjsify workspace @gjsify/unit build:gjsify --with-dependencies
          gjsify workspace @gjsify/sqlite build:gjsify --with-dependencies

      # Guarantee the devDependency file: link resolves to the freshly node-gyp-built
      # addon regardless of how the install materialised it (belt-and-suspenders).
      - name: Link the node-gi devDependency
        run: |
          mkdir -p packages/node/sqlite/node_modules/@gjsify
          ln -sfn ../../../../node-gi/node-gi packages/node/sqlite/node_modules/@gjsify/node-gi
          ls -l packages/node/sqlite/node_modules/@gjsify/node-gi

      # Build the --app node node-gi bundle (under Node via the repointed cli) + run
      # it on Node — the package's `test:gjs-on-node` script. The system-installed
      # Gda-6.0 typelib + libgda .so live on the default GI/loader search paths, so
      # node-gi loads them with no extra GI_TYPELIB_PATH/LD_LIBRARY_PATH. Exits
      # non-zero on any real failure (the 1 documented BLOB skip is not a failure).
      - name: Run @gjsify/sqlite suite on node-gi
        working-directory: packages/node/sqlite
        run: |
          export PATH="$PWD/../../../node_modules/.bin:$PATH"
          gjsify run test:gjs-on-node

  # aarch64 proof: build the Node-API addon + run the core suite, the golden-diff
  # conformance (gjs/node/bun/deno byte-identical) and the tier-B typelib oracle on
  # a NATIVE arm64 runner (ubuntu-24.04-arm — no qemu). node-gi has hand-written
  # C++ marshalling (ffi arg/return slots, pointer-width + endianness assumptions,
  # the toggle-ref GC dance) that only x86_64 has exercised so far; this catches any
  # arch-specific regression and produces the arm64 prebuild the published tarball
  # ships for Deno (which runs no postinstall build). Kept lean vs the x86_64
  # build-test job (no GC-stress/quad/DBus legs) so the extra arm minutes stay small.
  arm64:
    name: aarch64 build + conformance (Fedora 44)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + GObject-Introspection dev headers
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            glib2-devel gobject-introspection-devel gobject-introspection gjs cairo-devel \
            meson ninja-build \
            pango gdk-pixbuf2 dejavu-sans-fonts
          gjs --version
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"
          echo "arch: $(uname -m)"

      - name: Use official Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      - name: Smoke test (node --test)
        working-directory: packages/node-gi/node-gi
        run: npm test

      - name: Conformance (golden-diff, gjs/node/bun/deno)
        working-directory: packages/node-gi/node-gi
        run: npm run test:conformance

      - name: Cache GI test typelibs (pinned rev, aarch64)
        uses: actions/cache@v4
        with:
          path: packages/node-gi/node-gi/.gi-tests
          key: gi-test-typelibs-67432ee4ebf74349cb3c848f73945b21a767e276-fedora44-arm64-v1

      - name: Typelib oracle (GIMarshallingTests port)
        working-directory: packages/node-gi/node-gi
        run: npm run test:gimarshalling

      # Stage the arm64 prebuild + upload it as an artifact so a release can ship
      # prebuilds/linux-arm64/ in the tarball (the Deno install path — no postinstall
      # build). NODE_GI_NATIVE=prebuild then re-verifies the staged binary loads.
      - name: Stage arm64 prebuild
        working-directory: packages/node-gi/node-gi
        run: node scripts/stage-prebuild.mjs

      - name: Verify the staged prebuild loads (bun + deno)
        working-directory: packages/node-gi/node-gi
        run: npm run test:bun && npm run test:deno
        env:
          NODE_GI_NATIVE: prebuild

      - name: Upload arm64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-prebuild-linux-arm64
          path: packages/node-gi/node-gi/prebuilds/linux-arm64/node_gi.node
          if-no-files-found: error

  # macOS proof (Phase 1 — the reverse bridge BUILDS + RUNS on macOS). The whole
  # team is Linux-only, so a macos-latest runner (Apple silicon, arm64 → the addon
  # is darwin-arm64) is the only way to validate. Installs GTK4 + GObject-
  # Introspection from Homebrew, builds the N-API addon FROM SOURCE (node-gyp +
  # pkg-config, binding.gyp's xcode_settings carry the clang cflags), and runs the
  # DISPLAY-FREE conformance subset on Node (+ Bun/Deno) — the exact subset
  # scripts/cross-runtime.mjs curates (GLib/GObject/Gio marshalling, signals,
  # variant, boxed structs, mainloop-pump, DBus). The GTK-window / GLArea /
  # cairo-drawfunc / adw-smoke DISPLAY tests are NOT run here — GTK-on-macOS is the
  # quartz backend and needs its own display wiring; that is Phase 2 (which also
  # ships a prebuilt GTK stack so consumers need no Homebrew). The darwin-arm64
  # addon prebuild IS staged + uploaded here (the Deno install path — Deno runs no
  # postinstall build), mirroring the arm64 job; a future prebuilt-GTK upload slots
  # in beside it.
  macos:
    name: macOS build + conformance (Node+Bun+Deno / macos-latest arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Install GTK4 + GObject-Introspection (Homebrew)
        run: |
          # gtk4/libadwaita pull graphene/pango/gdk-pixbuf/cairo/glib transitively,
          # but name them so a slimmer future job (core subset only) still resolves.
          # glib provides libgirepository-2.0 + girepository-2.0.pc (the merged API);
          # gobject-introspection provides the GLib/GObject/Gio typelibs (Homebrew
          # builds them there to break the glib<->g-i circular dep) + g-ir tools.
          brew install gtk4 libadwaita gobject-introspection cairo pango gdk-pixbuf graphene pkg-config adwaita-icon-theme
          BREW_PREFIX="$(brew --prefix)"
          # brew symlinks each keg's lib/ — incl. girepository-1.0/*.typelib and
          # pkgconfig/*.pc — into $BREW_PREFIX/lib, so one dir covers every formula.
          # (The typelib DIRECTORY is historically named girepository-1.0 even for
          # the girepository-2.0 API.) DYLD_FALLBACK_LIBRARY_PATH lets the addon's
          # g_module_open() find the Homebrew dylibs a typelib names by leaf soname
          # (Gdk/Graphene/PangoCairo are dlopen'd, not linked into the addon).
          {
            echo "BREW_PREFIX=$BREW_PREFIX"
            echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            echo "GI_TYPELIB_PATH=$BREW_PREFIX/lib/girepository-1.0${GI_TYPELIB_PATH:+:$GI_TYPELIB_PATH}"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$BREW_PREFIX/lib:/usr/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Verify pkg-config + typelibs (diagnostics)
        run: |
          echo "pkg-config: $(command -v pkg-config) ($(pkg-config --version))"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          if pkg-config --exists girepository-2.0; then
            echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"
          else
            echo "girepository-2.0: MISSING — build will fail; check the glib formula's introspection build"
          fi
          pkg-config --exists cairo && echo "cairo: $(pkg-config --modversion cairo)" || echo "cairo: MISSING"
          echo "GI_TYPELIB_PATH=$GI_TYPELIB_PATH"
          echo "--- typelibs present ---"
          ls "${GI_TYPELIB_PATH%%:*}" 2>/dev/null | grep -E 'GLib|GObject|Gio|Gdk|Graphene|Pango|Gtk' || echo "(none matched)"

      # Node 24 builds the addon (node-gyp) and runs the authoritative Node leg.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Bun + Deno widen the proof to all three Node-API runtimes (the SAME addon,
      # their common ABI). setup-bun / setup-deno both support macOS arm64.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runtimes
        run: |
          node --version
          bun --version
          deno --version

      # From source: node-gyp reads binding.gyp's `pkg-config --cflags/--libs
      # girepository-2.0 cairo` (xcode_settings.OTHER_CFLAGS on macOS) → darwin-arm64
      # build/Release/node_gi.node. The install script IS node-gyp rebuild.
      - name: Build native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      # The display-free conformance subset on Node — the primary proof. Loads the
      # just-built build/Release addon (cross-runtime.mjs defaults NODE_GI_NATIVE to
      # `build`). Same curated list as the Bun/Deno legs (single source of truth).
      - name: Conformance subset on Node (display-free)
        working-directory: packages/node-gi/node-gi
        run: node scripts/cross-runtime.mjs node

      - name: Conformance subset on Bun
        working-directory: packages/node-gi/node-gi
        run: npm run test:bun

      # Deno on macOS: 36/37 are a hard gate. `struct-construct` is a documented,
      # self-healing SOFT-FAIL on deno+darwin ONLY (all 9 assertions pass, then the
      # process aborts on Deno's N-API env teardown — see cross-runtime.mjs). Node,
      # Bun, and Deno-on-Linux run it as a hard gate; the carve-out lifts when the
      # Deno-macOS teardown path is fixed at the engine.
      - name: Conformance subset on Deno
        working-directory: packages/node-gi/node-gi
        run: npm run test:deno

      # Stage the darwin-arm64 addon prebuild + smoke it via the PREBUILD load path
      # (Deno's only install path — it runs no postinstall build), then upload it so
      # a release can ship prebuilds/darwin-arm64/. Mirrors the arm64 job. NB this is
      # the node-gi ADDON prebuild, NOT the Phase-2 prebuilt-GTK stack.
      - name: Stage darwin-arm64 prebuild
        working-directory: packages/node-gi/node-gi
        run: node scripts/stage-prebuild.mjs

      - name: Verify the staged prebuild loads (Node)
        working-directory: packages/node-gi/node-gi
        run: node --test test/smoke.test.mjs
        env:
          NODE_GI_NATIVE: prebuild

      - name: Upload darwin-arm64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-prebuild-darwin-arm64
          path: packages/node-gi/node-gi/prebuilds/darwin-arm64/node_gi.node
          if-no-files-found: error

  # Cross-runtime consumer harness (scripts/node-gi-consumer-harness.mjs): the
  # GENERALIZATION of the consumer-sqlite job above into a reusable tool that
  # builds a gjsify package's OWN GJS test suite `--app node` (gi:// →
  # @gjsify/node-gi) and runs it on node + bun + deno. This job runs the PROOF
  # SET (packages that pass today: sqlite=Gda, http2=Soup, zlib=Gio — three
  # GNOME lib families) under `--require-pass`, so a regression in the reverse
  # bridge fails CI. The full 22-package rollout + a non-gating full-survey job
  # are documented follow-ups; the gap report + methodology live in
  # docs/reports/node-gi-consumer-survey.md. Setup mirrors consumer-sqlite; the
  # extra bun+deno legs come free from the harness's PATH-skip.
  consumer-suites:
    name: node-gi consumer harness (proof set / Node+Bun+Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + GI dev headers + cairo + libgda + libsoup + gjs
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            glib2-devel gobject-introspection-devel gobject-introspection gjs \
            cairo-devel cairo-gobject-devel \
            libgda libgda-sqlite \
            libsoup3
          gjs --version
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"

      # Official nodejs.org build, NOT Fedora's dnf node (which crashes rolldown's
      # prebuilt napi binding). Same rationale as the build-test job.
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Bun + Deno widen the harness from node-only to all three (PATH-skip
      # otherwise drops them). Node-API is their common ABI — same --app node bundle.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build @gjsify/node-gi native addon (node-gyp) + stage prebuild
        working-directory: packages/node-gi/node-gi
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          node scripts/stage-prebuild.mjs   # Deno loads the addon only via the prebuild path

      - name: Install the gjsify workspace (committed CLI bundle, Node-free)
        run: gjs -m packages/infra/cli/dist/cli.gjs.mjs install --immutable

      # Repoint the workspace .bin/gjsify at a Node-runnable published @gjsify/cli
      # (npm rolldown) + link @gjsify/node-gi at the workspace root so every
      # package's dist/ resolves the reverse-bridge addon at runtime.
      - name: Use a published @gjsify/cli as the Node bundler + link node-gi
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && npm install "@gjsify/cli@${CLI_VERSION}" --no-audit --no-fund --no-save )
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          mkdir -p node_modules/@gjsify
          ln -sfn ../../packages/node-gi/node-gi node_modules/@gjsify/node-gi
          echo "Node bundler: $(node_modules/.bin/gjsify --version)"

      - name: Build proof-set libs under Node (+ workspace deps)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          gjsify workspace @gjsify/unit build:gjsify --with-dependencies
          for p in @gjsify/sqlite @gjsify/http2 @gjsify/zlib; do
            gjsify workspace "$p" build:gjsify --with-dependencies
          done

      - name: Run the node-gi consumer harness (proof set, --require-pass)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/node-gi-consumer-harness.mjs \
            @gjsify/sqlite @gjsify/http2 @gjsify/zlib \
            --runtimes node,bun,deno --require-pass \
            --out /tmp/node-gi-consumer-survey.json

  # macOS Phase 2 — BUILD the batteries-included GTK runtime bundle. Brew-installs
  # the GTK stack as the closure SOURCE (build-time only; NOT shipped), CONSUMES
  # the darwin-arm64 node-gi addon prebuild the `macos` job produced (PR #767),
  # walks its dylib graph + relocates the whole display-free closure to
  # @loader_path (+ ad-hoc re-sign — mandatory on arm64), and relocates a COPY of
  # the addon to @rpath so it loads the bundled libgirepository with no Homebrew.
  # Uploads the bundle + the relocated addon for the no-brew conformance job below.
  macos-gtk-runtime:
    name: macOS GTK runtime bundle (build + relocate / macos-latest arm64)
    runs-on: macos-latest
    needs: macos
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      # Build-time closure SOURCE only — these libraries are collected + relocated
      # into a self-contained bundle, they are NOT what the conformance job runs on.
      - name: Install GTK4 + GObject-Introspection (Homebrew, build-time closure source)
        run: brew install gtk4 libadwaita gobject-introspection cairo pango gdk-pixbuf graphene pkg-config

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      # Consume the darwin-arm64 addon prebuild the `macos` job staged + uploaded.
      - name: Download node-gi addon prebuild (from the macos job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-darwin-arm64
          path: addon

      # Collect + relocate: --out = the platform package's shippable bundle;
      # --addon + --stage = a relocated addon + a SIBLING bundle copy under
      # node-gi's prebuilds/darwin-arm64/ (the layout the addon's @rpath expects,
      # and the layout the conformance job consumes).
      - name: Build + relocate the GTK runtime bundle
        run: |
          node packages/node-gi/gtk-runtime-darwin-arm64/scripts/build-gtk-runtime.mjs \
            --out packages/node-gi/gtk-runtime-darwin-arm64/gtk \
            --addon "$PWD/addon/node_gi.node" \
            --stage packages/node-gi/node-gi/prebuilds/darwin-arm64

      - name: Report bundle size + relocation sanity
        run: |
          cat packages/node-gi/gtk-runtime-darwin-arm64/gtk/manifest.json
          echo "--- bundle size ---"
          du -sh packages/node-gi/gtk-runtime-darwin-arm64/gtk
          echo "--- assert NO /opt/homebrew refs remain in the bundle ---"
          if otool -L packages/node-gi/gtk-runtime-darwin-arm64/gtk/lib/*.dylib | grep -F /opt/homebrew; then
            echo "RELOCATION FAILED: bundled dylibs still reference /opt/homebrew"; exit 1
          fi
          echo "clean — no Homebrew references"
          echo "--- relocated addon load commands ---"
          otool -l packages/node-gi/node-gi/prebuilds/darwin-arm64/node_gi.node | grep -A2 LC_RPATH || true

      - name: Upload GTK runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: gtk-runtime-darwin-arm64
          path: packages/node-gi/gtk-runtime-darwin-arm64/gtk
          if-no-files-found: error

      - name: Upload relocated node-gi addon
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-addon-relocated-darwin-arm64
          path: packages/node-gi/node-gi/prebuilds/darwin-arm64/node_gi.node
          if-no-files-found: error

  # macOS Phase 2 — PROVE batteries-included. This job does NOT `brew install` the
  # GTK runtime at all: it downloads the relocated bundle + addon and runs the
  # display-free conformance against them, so a green run proves node-gi works with
  # ZERO Homebrew/system GTK. Two legs:
  #   • env-free CORE — no DYLD/GI_TYPELIB env at all. The relocated addon loads the
  #     bundled libgirepository via @rpath; node-gi prepends the bundle's typelib
  #     dir itself (prependSearchPath); GLib/GObject/Gio/cairo are in-process via
  #     the addon's link closure. Runs every conformance file whose closure is
  #     exactly those namespaces.
  #   • FULL subset — adds DYLD_FALLBACK_LIBRARY_PATH=<bundle>/lib so the leaf-name
  #     g_module_open lookups for the NON-addon-linked backers (Pango→cairo.test,
  #     Gdk/Graphene→struct-construct) resolve from the bundle. Runs the whole
  #     scripts/cross-runtime.mjs node subset.
  macos-gtk-batteries-included:
    name: macOS batteries-included conformance (no brew GTK / macos-latest arm64)
    runs-on: macos-latest
    needs: macos-gtk-runtime
    timeout-minutes: 30
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      # This job never `brew install`s GTK. Hard-fail if the toolkit itself
      # (gtk4/libadwaita — the Gdk backer) is somehow preinstalled, which would
      # muddy the proof. Lower-level deps (pango/cairo/gdk-pixbuf) may be present
      # transitively via unrelated preinstalled formulae (imagemagick/graphviz),
      # but they DON'T interfere: node-gi PREPENDS the bundle's typelib dir, and
      # the explicit DYLD_FALLBACK_LIBRARY_PATH=<bundle>/lib:/usr/lib below removes
      # /usr/local from the search + /opt/homebrew/lib is never a leaf-dlopen dir,
      # so the bundle is authoritative regardless. Report them for transparency.
      - name: Assert the GTK toolkit is NOT installed (clean batteries-included host)
        run: |
          echo "--- GTK-related Homebrew formulae present on the runner (informational) ---"
          brew list --formula 2>/dev/null | grep -iE 'gtk|pango|cairo|graphene|gdk|glib|gobject|harfbuzz' || echo "(none)"
          if brew list --formula 2>/dev/null | grep -qE '^(gtk4|libadwaita)$'; then
            echo "gtk4/libadwaita is installed — not a clean batteries-included test"; exit 1
          fi
          echo "clean host — the GTK toolkit was never brew-installed in this job"

      # Stage the bundle + relocated addon in the SIBLING layout node-gi expects
      # (prebuilds/darwin-arm64/{node_gi.node, gtk/}). The addon's @rpath is
      # @loader_path/gtk/lib, and node-gi's loader finds gtk/ at that prebuilds path.
      - name: Download GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-darwin-arm64
          path: packages/node-gi/node-gi/prebuilds/darwin-arm64/gtk

      - name: Download relocated node-gi addon
        uses: actions/download-artifact@v4
        with:
          name: node-gi-addon-relocated-darwin-arm64
          path: packages/node-gi/node-gi/prebuilds/darwin-arm64

      - name: Verify staged layout
        working-directory: packages/node-gi/node-gi
        run: |
          ls -la prebuilds/darwin-arm64
          echo "--- dylibs ---"; ls prebuilds/darwin-arm64/gtk/lib | head
          echo "--- typelibs ---"; ls prebuilds/darwin-arm64/gtk/girepository-1.0 | head
          echo "--- addon deps (should be @rpath, no /opt/homebrew) ---"
          otool -L prebuilds/darwin-arm64/node_gi.node | head -20

      # Fast probe FIRST — one clean process, NO library-lookup env. Reproduces the
      # exact paths that need a leaf-soname g_module_open against the bundle
      # (registerClass subclassing + Pango/Graphene/Gdk get_type). node-gi's
      # DYLD_FALLBACK re-exec (gtk-runtime.js) is what makes this resolve env-free;
      # a failure here is an unambiguous signal, isolated from the test runner.
      - name: Batteries-included probe — env-free, no brew GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/check-batteries.mjs

      # Leg 1 — CORE (35 files), env-free: no DYLD/GI_TYPELIB set by the job.
      # cross-runtime.mjs re-execs ITSELF once with the bundle's DYLD fallback set
      # (dyld reads it at launch), so its per-file children inherit it — no brew
      # GTK, nothing but the bundle on disk. `--only` drops the two files whose
      # backers are NOT addon-linked (cairo→PangoCairo, struct-construct→Gdk/Graphene).
      - name: Conformance CORE — env-free, no brew GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: |
          node scripts/cross-runtime.mjs node --only \
            arrays,boxed-out,async-error,bytes,cairo-canvas2d,call-function,callbacks,closure-exception,construct-camelcase,dbus-async,enums-constants,gclosure-in-args,gettext,gi,globals,gobject,gtype,int64,methods,multilevel-subclass,out-params,paramspec,paramspec-object,proxy-fallback,register-class,register-class-decorator,register-class-props,registerclass-inplace,signals,smoke,static-camel,system,variant,vfunc,vfunc-chainup

      # Leg 2 — FULL display-free subset (37 files), also env-free (NO DYLD set by
      # the job). The same one-shot re-exec covers the NON-addon-linked backers
      # (Pango→cairo.test, Gdk/Graphene→struct-construct) from the bundle.
      - name: Conformance FULL subset — env-free, no brew GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/cross-runtime.mjs node

  # Build the WINDOWING superset darwin bundle — the display-free macos-gtk-runtime
  # bundle omits libadwaita (conformance never touches Adwaita), so a real
  # `new Adw.Application()` fails on it with "Failed to load shared library
  # 'libadwaita-1.0.dylib'". This variant passes `--windowing` so build-gtk-runtime.mjs
  # seeds libadwaita into the relocated closure. Mirrors windows-gtk-windowing-runtime;
  # feeds the macos-gtk-windowing GUI proof below.
  macos-gtk-windowing-runtime:
    name: macOS windowing GTK runtime bundle (build + relocate / macos-latest arm64)
    runs-on: macos-latest
    needs: macos
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Install GTK4 + Adwaita + GtkSource + icons + GObject-Introspection (build-time closure source)
        run: brew install gtk4 libadwaita gtksourceview5 adwaita-icon-theme gobject-introspection cairo pango gdk-pixbuf graphene pkg-config

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download node-gi addon prebuild (from the macos job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-darwin-arm64
          path: addon

      # --windowing adds libadwaita + libgtksourceview (+ their otool deps) to the
      # relocated closure.
      - name: Build + relocate the WINDOWING GTK runtime bundle
        run: |
          node packages/node-gi/gtk-runtime-darwin-arm64/scripts/build-gtk-runtime.mjs \
            --windowing \
            --out packages/node-gi/gtk-runtime-darwin-arm64/gtk \
            --addon "$PWD/addon/node_gi.node" \
            --stage packages/node-gi/node-gi/prebuilds/darwin-arm64

      - name: Report bundle + assert libadwaita + GtkSource are present
        run: |
          cat packages/node-gi/gtk-runtime-darwin-arm64/gtk/manifest.json
          echo "--- bundle size ---"; du -sh packages/node-gi/gtk-runtime-darwin-arm64/gtk
          echo "--- assert libadwaita relocated into the bundle ---"
          ls packages/node-gi/gtk-runtime-darwin-arm64/gtk/lib | grep -i adwaita || { echo "libadwaita MISSING from the windowing bundle"; exit 1; }
          echo "--- assert libgtksourceview dylib + GtkSource-5 typelib are bundled ---"
          ls packages/node-gi/gtk-runtime-darwin-arm64/gtk/lib | grep -i gtksourceview || { echo "libgtksourceview MISSING from the windowing bundle"; exit 1; }
          ls packages/node-gi/gtk-runtime-darwin-arm64/gtk/girepository-1.0 | grep -i 'GtkSource-5.typelib' || { echo "GtkSource-5.typelib MISSING from the windowing bundle"; exit 1; }
          echo "--- assert WINDOWING DATA: compiled GSettings schemas (Gio.Settings) + GtkSource language-specs ---"
          B=packages/node-gi/gtk-runtime-darwin-arm64/gtk
          test -f "$B/share/glib-2.0/schemas/gschemas.compiled" || { echo "gschemas.compiled MISSING — Gio.Settings would fail on macOS"; exit 1; }
          test -d "$B/share/gtksourceview-5/language-specs" || { echo "GtkSource-5 language-specs MISSING from the windowing bundle"; exit 1; }
          echo "--- icon themes present (Adwaita/hicolor) ---"; ls "$B/share/icons" 2>/dev/null || echo "(no icon themes — symbolic icons may be blank)"
          echo "--- assert NO /opt/homebrew refs remain ---"
          if otool -L packages/node-gi/gtk-runtime-darwin-arm64/gtk/lib/*.dylib | grep -F /opt/homebrew; then
            echo "RELOCATION FAILED: bundled dylibs still reference /opt/homebrew"; exit 1
          fi
          echo "clean — no Homebrew references"

      - name: Upload windowing GTK runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: gtk-runtime-darwin-arm64-windowing
          path: packages/node-gi/gtk-runtime-darwin-arm64/gtk

      - name: Upload relocated node-gi addon (windowing)
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-addon-relocated-darwin-arm64-windowing
          path: packages/node-gi/node-gi/prebuilds/darwin-arm64/node_gi.node

  # macOS GUI proof — the darwin counterpart of windows-gtk-windowing. macOS had
  # build + display-free conformance + the batteries-included bundle, but no
  # ON-SCREEN render proof; this closes that gap so the cross-platform story is
  # symmetric. Runs the SAME render-to-texture GUI tests the Windows windowing job
  # runs (windowing + windowing-interactive + widgets), on the batteries-included
  # darwin-arm64 bundle as the ONLY GTK. The tests treat darwin like win32 (implicit
  # display — no DISPLAY needed; the GdkMacos backend supplies it), so a real
  # Adw.ApplicationWindow realizes + renders via the GSK renderer and a
  # WidgetPaintable snapshot rasterises to a PNG — headless, no visible desktop,
  # exactly as on Windows. GSK_RENDERER=cairo forces software rendering (no GPU
  # guarantee on the runner). node-gi's DYLD_FALLBACK re-exec (gtk-runtime.js) makes
  # the bundle authoritative env-free; NODE_GI_NATIVE=prebuild loads the relocated
  # addon. Same clean-host discipline as macos-gtk-batteries-included: no brew GTK.
  macos-gtk-windowing:
    name: macOS windowing proof (no brew GTK / macos-latest arm64)
    runs-on: macos-latest
    needs: macos-gtk-windowing-runtime
    timeout-minutes: 30
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      # Never brew-installs GTK — the batteries-included bundle must be the ONLY GTK.
      - name: Assert the GTK toolkit is NOT installed (clean batteries-included host)
        run: |
          echo "--- GTK-related Homebrew formulae present (informational) ---"
          brew list --formula 2>/dev/null | grep -iE 'gtk|pango|cairo|graphene|gdk|glib|gobject|harfbuzz' || echo "(none)"
          if brew list --formula 2>/dev/null | grep -qE '^(gtk4|libadwaita)$'; then
            echo "gtk4/libadwaita is installed — not a clean batteries-included test"; exit 1
          fi
          echo "clean host — the GTK toolkit was never brew-installed in this job"

      # Stage the WINDOWING bundle + relocated addon in the sibling layout node-gi's
      # loader expects (prebuilds/darwin-arm64/{node_gi.node, gtk/}); the addon's
      # @rpath is @loader_path/gtk/lib. From macos-gtk-windowing-runtime (libadwaita
      # included), NOT the display-free macos-gtk-runtime bundle.
      - name: Download WINDOWING GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-darwin-arm64-windowing
          path: packages/node-gi/node-gi/prebuilds/darwin-arm64/gtk

      - name: Download relocated node-gi addon (windowing)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-addon-relocated-darwin-arm64-windowing
          path: packages/node-gi/node-gi/prebuilds/darwin-arm64

      - name: Verify staged layout
        working-directory: packages/node-gi/node-gi
        run: |
          ls -la prebuilds/darwin-arm64
          echo "--- dylibs ---"; ls prebuilds/darwin-arm64/gtk/lib | head
          echo "--- typelibs ---"; ls prebuilds/darwin-arm64/gtk/girepository-1.0 | head

      # The windowing proof: a real Adw.ApplicationWindow realizes + renders a
      # surface via the GSK renderer, reacts to a Gio action + Gtk.Button::clicked
      # (interactive, headless), and widgets.test.mjs rasterises an Adwaita
      # widget-breadth surface to a GSK PNG — all on the batteries-included bundle.
      - name: Windowing proof — Adw window realizes, renders, reacts + widget breadth (no brew GTK)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
          GSK_RENDERER: cairo
        run: node --test test/windowing.test.mjs test/windowing-interactive.test.mjs test/widgets.test.mjs

  # Windows proof (Phase 1 — the reverse bridge BUILDS + RUNS on windows-latest).
  # The whole team is Linux-only, so a windows-latest runner is the only way to
  # validate. Sibling of the macOS proof (its `macos` job above is the template).
  #
  # TOOLCHAIN — MSVC + gvsbuild (NOT MSYS2/mingw). node-gyp defaults to MSVC, and
  # stock Node/Bun/Deno on Windows are MSVC-ABI, so the addon AND the GTK/GLib it
  # links must be MSVC-ABI too — a mingw GTK + MSVC addon is an ABI hazard and a
  # mingw-built .node does not load into stock MSVC-ABI Node (the ABI wall). gvsbuild
  # publishes a prebuilt MSVC-ABI GTK4 bundle (GLib 2.88, girepository-2.0, built
  # with --enable-gi) that loads into stock Node. We build the N-API addon FROM
  # SOURCE (node-gyp/MSVC + pkg-config via scripts/win-gi-gyp-flags.mjs) and run the
  # DISPLAY-FREE conformance subset on Node — the exact set scripts/cross-runtime.mjs
  # curates. The GTK-window / GLArea / cairo-drawfunc / adw-smoke DISPLAY tests are
  # NOT run here (GTK-on-Windows is the win32 backend and needs its own display
  # wiring — Phase 2, which also ships a prebuilt GTK stack so consumers need no
  # gvsbuild). The win32-x64 addon prebuild IS staged + uploaded here, mirroring the
  # arm64 + macos jobs; a future prebuilt-GTK upload slots in beside it.
  windows:
    name: Windows build + conformance (Node / windows-latest x64)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GVSBUILD_VERSION: '2026.6.0'
      # Extract to gvsbuild's canonical build prefix so its .pc files' baked
      # absolute `prefix=` is correct with no relocation needed.
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 builds the addon (node-gyp) and runs the authoritative Node leg —
      # same version the macOS proof pins.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache gvsbuild GTK4 bundle
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk\x64\release
          key: gvsbuild-gtk4-${{ env.GVSBUILD_VERSION }}-x64-v1

      - name: Download + extract gvsbuild GTK4 (MSVC-ABI, girepository-2.0)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          # tar.exe (bsdtar) extracts zip; the zip holds the CONTENTS of release\
          # (bin/ lib/ include/ share/ …) at its root.
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      - name: Put GTK on PATH + set GI/PKG env
        shell: pwsh
        run: |
          # GTK bin/ carries the DLLs the addon links (glib/gobject/gio/girepository/
          # cairo/ffi/intl) AND pkgconf.exe + pkg-config.exe (gvsbuild bundles them).
          "$env:GTK_PREFIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=$env:GTK_PREFIX\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The typelib DIRECTORY is historically named girepository-1.0 even for
          # the girepository-2.0 API.
          "GI_TYPELIB_PATH=$env:GTK_PREFIX\lib\girepository-1.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GSETTINGS_SCHEMA_DIR=$env:GTK_PREFIX\share\glib-2.0\schemas" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # gvsbuild's libffi meson build ships ffi.lib + the DLL but NOT ffi.h/
      # ffitarget.h (its meson.build has `install: true` on the library() but no
      # install_headers()), yet GLib's girffi.h — which gvsbuild DOES install —
      # does `#include <ffi.h>`, so the addon won't compile (C1083). Supply the two
      # headers from vcpkg's libffi (preinstalled vcpkg; MSVC-native x64 headers).
      # libffi's public ABI (ffi_type/ffi_cif/ffi_closure) is frozen across 3.x, so
      # the vcpkg header + gvsbuild's 3.5.2 ffi.lib are compatible.
      - name: Supply libffi headers (gvsbuild omits ffi.h)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libffi:x64-windows
          $inc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          Copy-Item "$inc\ffi.h","$inc\ffitarget.h" -Destination "$env:GTK_PREFIX\include" -Force
          Write-Host "ffi.h -> $env:GTK_PREFIX\include (from vcpkg libffi)"

      - name: Verify pkg-config + girepository-2.0 (diagnostics)
        shell: pwsh
        run: |
          Write-Host "pkg-config: $((Get-Command pkg-config).Source)"
          pkg-config --version
          # `--exists` signals via exit code, not stdout — check $LASTEXITCODE (a
          # bare `if (pkg-config ...)` tests stdout and false-reports MISSING).
          pkg-config --define-prefix --exists girepository-2.0
          if ($LASTEXITCODE -eq 0) {
            Write-Host "girepository-2.0: $(pkg-config --define-prefix --modversion girepository-2.0)"
          } else {
            Write-Host "girepository-2.0: MISSING — the addon build will fail"
          }
          Write-Host "cflags : $(pkg-config --define-prefix --cflags girepository-2.0 cairo)"
          Write-Host "cflags(static) : $(pkg-config --define-prefix --static --cflags-only-I girepository-2.0 cairo 2>&1)"
          Write-Host "--- typelibs present ---"
          Get-ChildItem "$env:GTK_PREFIX\lib\girepository-1.0" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'GLib|GObject|Gio|Pango|GdkPixbuf|Graphene|cairo' } |
            Select-Object -ExpandProperty Name
          Write-Host "--- helper: include_dirs ---"
          node packages/node-gi/node-gi/scripts/win-gi-gyp-flags.mjs --includes
          Write-Host "`n--- helper: libraries ---"
          node packages/node-gi/node-gi/scripts/win-gi-gyp-flags.mjs --libs

      # From source: node-gyp reads binding.gyp's OS=="win" branch (the helper feeds
      # cl.exe include dirs + link.exe .lib paths) → win32-x64 build/Release/
      # node_gi.node. The package's `install` script IS node-gyp rebuild.
      - name: Build native addon (node-gyp / MSVC)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      # The display-free conformance subset on Node — the primary proof. Loads the
      # just-built build/Release addon (cross-runtime.mjs defaults NODE_GI_NATIVE to
      # `build`). Same curated list the macOS/Bun/Deno legs use (single source).
      - name: Conformance subset on Node (display-free)
        working-directory: packages/node-gi/node-gi
        run: node scripts/cross-runtime.mjs node

      # Stage the win32-x64 addon prebuild + smoke it via the PREBUILD load path,
      # then upload it so a release can ship prebuilds/win32-x64/ (the loader already
      # expects that path). Mirrors the arm64 + macos jobs. NB this is the node-gi
      # ADDON prebuild, NOT a Phase-2 prebuilt-GTK stack.
      - name: Stage win32-x64 prebuild
        working-directory: packages/node-gi/node-gi
        run: node scripts/stage-prebuild.mjs

      - name: Verify the staged prebuild loads (Node)
        working-directory: packages/node-gi/node-gi
        run: node --test test/smoke.test.mjs
        env:
          NODE_GI_NATIVE: prebuild

      - name: Upload win32-x64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64/node_gi.node
          if-no-files-found: error

  # Windows Phase 2 — BUILD the batteries-included GTK runtime bundle. Reuses the
  # `windows` job's gvsbuild download/cache steps as the closure SOURCE (build-time
  # only; NOT shipped), then COLLECTS the display-free DLL closure into gtk/bin +
  # the typelibs into gtk/girepository-1.0. CRUCIAL DIFFERENCE from macOS: NO
  # relocation — Windows resolves DLLs by SEARCH PATH at LoadLibrary time, so
  # "relocation" is just copying the DLLs into one dir (no install_name_tool /
  # @rpath / codesign, and no addon relocation). Uploads the bundle for the
  # no-gvsbuild conformance job below. Independent of the `windows` job (it does not
  # consume the addon), so it runs in parallel.
  windows-gtk-runtime:
    name: Windows GTK runtime bundle (build / windows-latest x64)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GVSBUILD_VERSION: '2026.6.0'
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 runs build-gtk-runtime.mjs (node:child_process/fs). Same version the
      # `windows` proof pins.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache gvsbuild GTK4 bundle
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk\x64\release
          key: gvsbuild-gtk4-${{ env.GVSBUILD_VERSION }}-x64-v1

      # Build-time closure SOURCE only — the DLLs are collected INTO the bundle, they
      # are NOT what the no-gvsbuild conformance job runs on. Verbatim from the
      # `windows` job's download/extract step.
      - name: Download + extract gvsbuild GTK4 (build-time closure source)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      # Collect the DLL closure + typelibs into the package's gtk/ dir. The script
      # walks the closure with dumpbin (located via vswhere) and falls back to
      # copying the full bin/*.dll set if dumpbin is unavailable — either way the
      # bundle is complete. Only --out + --prefix are needed (no addon relocation).
      - name: Build the GTK runtime bundle (collect DLL closure + typelibs)
        shell: pwsh
        run: |
          node packages/node-gi/gtk-runtime-win32-x64/scripts/build-gtk-runtime.mjs `
            --out packages/node-gi/gtk-runtime-win32-x64/gtk `
            --prefix $env:GTK_PREFIX

      - name: Report bundle size + layout sanity
        shell: pwsh
        run: |
          $B = "packages/node-gi/gtk-runtime-win32-x64/gtk"
          Get-Content "$B/manifest.json"
          Write-Host "--- bundle size ---"
          "{0:N1} MiB" -f ((Get-ChildItem $B -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          if (-not (Test-Path "$B/bin") -or -not (Test-Path "$B/girepository-1.0")) {
            Write-Host "BUNDLE INCOMPLETE: gtk/bin + gtk/girepository-1.0 are required (index.js isPresent)"
            exit 1
          }
          Write-Host "--- a few bundled DLLs ---"
          Get-ChildItem "$B/bin" -Filter *.dll | Select-Object -First 10 -ExpandProperty Name

      - name: Upload GTK runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: gtk-runtime-win32-x64
          path: packages/node-gi/gtk-runtime-win32-x64/gtk
          if-no-files-found: error

  # Windows Phase 2 — PROVE batteries-included. This job NEVER installs gvsbuild: it
  # downloads the relocated-by-copy bundle + the win32 addon prebuild and runs the
  # display-free conformance against them, so a green run proves node-gi works with
  # ZERO gvsbuild/system GTK. UNLIKE the macOS batteries job (which needs a CORE
  # leg + a re-exec for the non-addon-linked backers), ONE PATH-prepend covers the
  # whole subset: node-gi prepends the bundle's gtk/bin to PATH before the addon
  # loads, and Windows re-reads that path at each LoadLibrary — so the addon's own
  # DLL imports AND the runtime g_module_open of Pango/Gdk/Graphene both resolve
  # from the bundle in a single, env-free run.
  windows-batteries-included:
    name: Windows batteries-included conformance (no gvsbuild / windows-latest x64)
    runs-on: windows-latest
    needs: [windows, windows-gtk-runtime]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # This job never installs gvsbuild. Hard-fail if a gvsbuild GTK tree is present
      # (it would muddy the proof — the bundle must be the ONLY GTK).
      - name: Assert gvsbuild GTK is NOT present (clean batteries-included host)
        shell: pwsh
        run: |
          if (Test-Path 'C:\gtk-build\gtk\x64\release\bin\glib-2.0-0.dll') {
            Write-Host "gvsbuild GTK is present — not a clean batteries-included test"
            exit 1
          }
          Write-Host "clean host — gvsbuild GTK was never installed in this job"

      # Stage the bundle + addon prebuild in the SIBLING layout node-gi's loader
      # expects (prebuilds/win32-x64/{node_gi.node, gtk/}). The loader prepends
      # gtk/bin to PATH before loading the addon, so its DLL imports resolve here.
      - name: Download GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64/gtk

      - name: Download node-gi addon prebuild (from the windows job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64

      - name: Verify staged layout
        shell: pwsh
        run: |
          Get-ChildItem packages/node-gi/node-gi/prebuilds/win32-x64
          Write-Host "--- DLLs ---"
          Get-ChildItem packages/node-gi/node-gi/prebuilds/win32-x64/gtk/bin -Filter *.dll | Select-Object -First 10 -ExpandProperty Name
          Write-Host "--- typelibs ---"
          Get-ChildItem packages/node-gi/node-gi/prebuilds/win32-x64/gtk/girepository-1.0 -Filter *.typelib | Select-Object -First 10 -ExpandProperty Name

      # Fast probe FIRST — one clean process, NO GTK on PATH set by the job. node-gi's
      # loader prepends the bundle's gtk/bin to PATH before loading the addon, and
      # prependSearchPath for the typelibs; this reproduces registerClass subclassing
      # + Pango/Graphene/Gdk get_type resolving env-free from the bundle.
      - name: Batteries-included probe — no gvsbuild GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/check-batteries.mjs

      # The full display-free conformance subset — the primary proof, with the bundle
      # as the ONLY GTK. NODE_GI_NATIVE=prebuild loads the staged addon; the loader's
      # PATH-prepend makes its DLL imports + the typelib backers resolve from gtk/bin.
      # No CORE/FULL split (see the job comment): one PATH covers everything.
      - name: Conformance subset — no gvsbuild GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/cross-runtime.mjs node

  # Windows Phase 2 (windowing) — BUILD the FULL-windowing GTK runtime bundle. The
  # display-free bundle above ships only the loadable-DLL closure; this builds the
  # SUPERSET a real GTK WINDOW needs on Windows via `build-gtk-runtime.mjs
  # --windowing`: the gdk-pixbuf loaders + a bundle-relative `loaders.cache`, compiled
  # GSettings schemas (`gschemas.compiled`), the Adwaita/hicolor icon themes +
  # `icon-theme.cache`, Fontconfig config/cache, and the SVG/PNG image-loader backing
  # DLLs walked into bin/. Reuses the same gvsbuild download/cache as the `windows`
  # job (build-time closure SOURCE only, NOT shipped). Runs in parallel (does not
  # consume the addon). Uploads the bundle for the windowing proof job below.
  windows-gtk-windowing-runtime:
    name: Windows FULL-windowing GTK runtime bundle (build / windows-latest x64)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GVSBUILD_VERSION: '2026.6.0'
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 runs build-gtk-runtime.mjs (node:child_process/fs). Same version the
      # `windows` proof pins.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache gvsbuild GTK4 bundle
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk\x64\release
          key: gvsbuild-gtk4-${{ env.GVSBUILD_VERSION }}-x64-v1

      # Build-time closure SOURCE only. Verbatim from the `windows` job.
      - name: Download + extract gvsbuild GTK4 (build-time closure source)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      # The bundle's data step runs gvsbuild's own tools (gdk-pixbuf-query-loaders /
      # glib-compile-schemas / gtk4-update-icon-cache / fc-cache) from <prefix>/bin,
      # which link glib/gio DLLs — so <prefix>/bin must be on PATH. (The DLL closure
      # walk uses dumpbin, located via vswhere on the VS2022 image.)
      - name: Put GTK on PATH (for the bundle-data tools)
        shell: pwsh
        run: '"$env:GTK_PREFIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8'

      - name: Build the FULL-windowing GTK runtime bundle (--windowing)
        shell: pwsh
        run: |
          node packages/node-gi/gtk-runtime-win32-x64/scripts/build-gtk-runtime.mjs `
            --windowing `
            --out packages/node-gi/gtk-runtime-win32-x64/gtk `
            --prefix $env:GTK_PREFIX

      - name: Report bundle size + assert the windowing data is present
        shell: pwsh
        run: |
          $B = "packages/node-gi/gtk-runtime-win32-x64/gtk"
          Get-Content "$B/manifest.json"
          Write-Host "--- bundle size ---"
          "{0:N1} MiB" -f ((Get-ChildItem $B -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          # The windowing marker node-gi keys on + the loader cache must be present.
          $missing = @()
          foreach ($p in @(
            "$B/bin",
            "$B/girepository-1.0",
            "$B/share/glib-2.0/schemas/gschemas.compiled",
            "$B/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          )) { if (-not (Test-Path $p)) { $missing += $p } }
          if ($missing.Count -gt 0) {
            Write-Host "WINDOWING BUNDLE INCOMPLETE — missing:`n  $($missing -join "`n  ")"
            exit 1
          }
          Write-Host "--- icon themes ---"
          Get-ChildItem "$B/share/icons" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          # GtkSource-5 (the Learn6502 editor's GtkSource.View backer). The gvsbuild
          # GTK4 release ZIP ships gtksourceview5, so ASSERT the full closure landed:
          # the DLL is seeded (WINDOWING_SEED_PATTERNS), the typelib copied, and the
          # language-specs/styles bundled (build step 4e). A future gvsbuild that drops
          # gtksourceview5 fails here loudly rather than silently shipping a bundle the
          # editor can't load.
          Write-Host "--- assert GtkSource-5 in the bundle ---"
          $srcDll = Get-ChildItem "$B/bin" -Filter '*gtksourceview-5*.dll' -ErrorAction SilentlyContinue
          if (-not $srcDll) { Write-Host "libgtksourceview-5 DLL MISSING from the windowing bundle"; exit 1 }
          if (-not (Test-Path "$B/girepository-1.0/GtkSource-5.typelib")) { Write-Host "GtkSource-5.typelib MISSING from the windowing bundle"; exit 1 }
          if (-not (Test-Path "$B/share/gtksourceview-5/language-specs")) { Write-Host "GtkSource-5 language-specs MISSING from the windowing bundle"; exit 1 }
          Write-Host ("GtkSource-5 OK: {0} + GtkSource-5.typelib + language-specs" -f $srcDll.Name)

      - name: Upload FULL-windowing GTK runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: gtk-runtime-win32-x64-windowing
          path: packages/node-gi/gtk-runtime-win32-x64/gtk
          if-no-files-found: error

  # Windows Phase 2 (windowing) — PROVE a real GTK WINDOW realizes + renders with the
  # FULL-windowing bundle as the ONLY GTK (NEVER installs gvsbuild). Mirrors the
  # windows-batteries-included setup (download the bundle + the win32 addon prebuild
  # into the sibling prebuilds/ layout), then runs the windowing test:
  # `test/windowing.test.mjs` creates an Adw.ApplicationWindow (HeaderBar / WindowTitle
  # / StatusPage), presents it, and captures a PNG through the GSK renderer
  # (Gtk.WidgetPaintable → Gsk.Renderer.render_texture → Gdk.Texture) — a non-empty
  # PNG proves a GdkWin32 surface was allocated + a render tree rasterised through
  # node-gi, beyond the display-free conformance. windows-latest has a desktop session;
  # GSK_RENDERER=cairo keeps it off any GPU/GL path. node-gi's loader wires the bundle
  # (PATH for DLLs + GSETTINGS_SCHEMA_DIR / GDK_PIXBUF_MODULE_FILE / XDG_DATA_DIRS for
  # the windowing data) from the gschemas.compiled marker.
  windows-gtk-windowing:
    name: Windows windowing proof (no gvsbuild / windows-latest x64)
    runs-on: windows-latest
    needs: [windows, windows-gtk-windowing-runtime]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Never installs gvsbuild. Hard-fail if a gvsbuild GTK tree is present (it would
      # muddy the proof — the windowing bundle must be the ONLY GTK).
      - name: Assert gvsbuild GTK is NOT present (clean host)
        shell: pwsh
        run: |
          if (Test-Path 'C:\gtk-build\gtk\x64\release\bin\glib-2.0-0.dll') {
            Write-Host "gvsbuild GTK is present — not a clean windowing test"
            exit 1
          }
          Write-Host "clean host — gvsbuild GTK was never installed in this job"

      # Stage the windowing bundle + addon prebuild in the sibling layout node-gi's
      # loader expects (prebuilds/win32-x64/{node_gi.node, gtk/}). The loader prepends
      # gtk/bin to PATH + wires the windowing env from the gschemas.compiled marker.
      - name: Download FULL-windowing GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-win32-x64-windowing
          path: packages/node-gi/node-gi/prebuilds/win32-x64/gtk

      - name: Download node-gi addon prebuild (from the windows job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64

      - name: Verify staged layout
        shell: pwsh
        run: |
          Get-ChildItem packages/node-gi/node-gi/prebuilds/win32-x64
          Write-Host "--- windowing data ---"
          Test-Path packages/node-gi/node-gi/prebuilds/win32-x64/gtk/share/glib-2.0/schemas/gschemas.compiled
          Test-Path packages/node-gi/node-gi/prebuilds/win32-x64/gtk/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache

      # The windowing proof: a real Adw.ApplicationWindow realizes + renders a surface
      # via the GSK renderer, AND responds to input (a Gio action + a Gtk.Button::clicked
      # drive the counter — the interactive proof runs headless, no visible desktop
      # needed, same as the render-to-texture screenshot); widgets.test.mjs adds the
      # Adwaita widget-breadth proof on the SAME bundle (a PreferencesPage of
      # SwitchRow/EntryRow/ComboRow/SpinRow/ExpanderRow rows + a Gtk.ListBox + a toast,
      # constructed, DumpTree-typed, driven via notify:: and GSK-rendered), with the
      # bundle as the ONLY
      # GTK. NODE_GI_NATIVE=prebuild loads the staged addon; the loader's PATH-prepend +
      # windowing-env wiring makes the DLLs + schemas/loaders/icons resolve from the
      # bundle. On win32 the test's display gate is IMPLICIT (no DISPLAY/WAYLAND_DISPLAY
      # needed — the GdkWin32 backend supplies it), so it runs here. GSK_RENDERER=cairo
      # forces software rendering (no GPU on the runner).
      - name: Windowing proof — Adw window realizes, renders, reacts + widget breadth (no gvsbuild GTK)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
          GSK_RENDERER: cairo
        run: node --test test/windowing.test.mjs test/windowing-interactive.test.mjs test/widgets.test.mjs

  # Adwaita Storybook capstone — BUILD the `--app node` bundle. The full
  # @gjsify/storybook Libadwaita component gallery (showcases/gtk/adwaita-storybook,
  # 35 *.story.ts) built for the node-gi reverse bridge via
  # `gjsify storybook --runtime node` (consumer #1 of the reverse bridge). node-gi is
  # kept EXTERNAL, so this build needs NO C++ toolchain / GTK / display — just the
  # workspace + a Node bundler. Uploads the single-file bundle for BOTH the Linux
  # parity leg (gtk-smoke) and the Windows capstone (windows-gtk-storybook).
  #
  # BUILD ENGINE — under Node, not GJS (same rationale as consumer-sqlite): the
  # workspace `.bin/gjsify` is GJS-first and its `gjsify build` needs
  # `@gjsify/rolldown-native` (a vala/meson prebuild absent in this container), so
  # every build here runs under Node via a published `@gjsify/cli` (npm rolldown).
  storybook-node-gi-bundle:
    name: Adwaita Storybook --app node bundle (build / Node / Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: fedora:44
    steps:
      # libsoup3 supplies the Soup-3.0 typelib the committed `cli.gjs.mjs` GJS
      # bundle EAGERLY imports at load (the network commands' fetch chain) — any
      # `gjsify` CLI invocation via the GJS bundle crashes without it, so the
      # `gjsify install` step below needs it (same as the other CLI-running jobs).
      - name: Install toolchain + gjs + libsoup (Node-free workspace install)
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            glib2-devel gobject-introspection-devel gobject-introspection gjs \
            cairo-devel cairo-gobject-devel \
            libsoup3
          gjs --version

      # Official nodejs.org build, NOT Fedora's dnf node (which crashes rolldown's
      # prebuilt napi binding — the gjsify bundler engine).
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout
        uses: actions/checkout@v4

      # Node-free workspace install via the committed CLI bundle (the supported
      # `gjsify install --immutable` path). The showcase depends on workspace
      # `@gjsify/storybook` (+ deps) which must be present + built.
      - name: Install the gjsify workspace (committed CLI bundle, Node-free)
        run: gjs -m packages/infra/cli/dist/cli.gjs.mjs install --immutable

      # Repoint the workspace `.bin/gjsify` at a Node-runnable published @gjsify/cli
      # (npm rolldown), NOT the committed GJS bundle (which needs the absent
      # @gjsify/rolldown-native). Install the version the workspace pins.
      - name: Use a published @gjsify/cli as the Node bundler (npm rolldown)
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && npm install "@gjsify/cli@${CLI_VERSION}" --no-audit --no-fund --no-save )
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          echo "Node bundler: $(node_modules/.bin/gjsify --version)"

      # Build @gjsify/storybook's lib (+ its transitive workspace deps incl.
      # @gjsify/devtools, which the storybook probe uses) so the showcase bundle
      # resolves them. build:gjsify (the --library step) emits lib/esm/*.js, which is
      # all the --app node bundle inlines — no .d.ts emit needed here.
      - name: Build @gjsify/storybook lib under Node (+ workspace deps)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          gjsify workspace @gjsify/storybook build:gjsify --with-dependencies

      # `gjsify storybook --runtime node --build-only` discovers the showcase's
      # *.story.ts, generates the entry, and builds it --app node (gi:// → requireGi,
      # @gjsify/node-gi external). Assert it is a real node-gi bundle.
      - name: Build the Adwaita Storybook --app node bundle
        working-directory: showcases/gtk/adwaita-storybook
        run: |
          export PATH="$PWD/../../../node_modules/.bin:$PATH"
          gjsify storybook --runtime node --build-only --out dist/storybook.node.mjs
          node --check dist/storybook.node.mjs
          grep -q requireGi dist/storybook.node.mjs
          grep -q "@gjsify/node-gi" dist/storybook.node.mjs
          if grep -q "gi://" dist/storybook.node.mjs; then echo "raw gi:// left in bundle"; exit 1; fi
          echo "storybook --app node bundle OK ($(wc -c < dist/storybook.node.mjs) bytes)"

      - name: Upload the storybook --app node bundle
        uses: actions/upload-artifact@v4
        with:
          name: storybook-node-gi-bundle
          path: showcases/gtk/adwaita-storybook/dist/storybook.node.mjs
          if-no-files-found: error

  # Windows Adwaita Storybook capstone — PROVE the FULL @gjsify Libadwaita component
  # gallery realizes + renders on windows-latest via node-gi, with the batteries-
  # included FULL-windowing GTK bundle as the ONLY GTK (NEVER installs gvsbuild).
  # Mirrors windows-gtk-windowing: download the --windowing bundle + the win32 addon
  # prebuild into the sibling prebuilds/ layout, PLUS the prebuilt --app node storybook
  # bundle (storybook-node-gi-bundle). The bundle is placed IN the node-gi package dir
  # so its external `@gjsify/node-gi/gi` import self-resolves (Node package self-
  # reference). GJSIFY_STORYBOOK_PROBE drives it headlessly IN-PROCESS (no DBus session
  # bus — robust on windows-latest): the StorybookApplication window realizes, the
  # sidebar lists the component categories, a representative story (Boxed Lists/Switch
  # Row) opens + renders an AdwSwitchRow subtree (DumpTree), and the window rasterises
  # to a non-empty PNG via the GSK renderer (Screenshot) — then quits 0/1. On win32 the
  # display gate is implicit (GdkWin32 supplies the surface); GSK_RENDERER=cairo forces
  # software rendering. node-gi's loader wires the windowing bundle (PATH for the DLLs +
  # GSETTINGS_SCHEMA_DIR / GDK_PIXBUF_MODULE_FILE / XDG_DATA_DIRS for schemas/loaders/
  # icons) off the gschemas.compiled marker.
  windows-gtk-storybook:
    name: Windows Adwaita Storybook proof (no gvsbuild / windows-latest x64)
    runs-on: windows-latest
    needs: [windows, windows-gtk-windowing-runtime, storybook-node-gi-bundle]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Never installs gvsbuild. Hard-fail if a gvsbuild GTK tree is present (it would
      # muddy the proof — the windowing bundle must be the ONLY GTK).
      - name: Assert gvsbuild GTK is NOT present (clean host)
        shell: pwsh
        run: |
          if (Test-Path 'C:\gtk-build\gtk\x64\release\bin\glib-2.0-0.dll') {
            Write-Host "gvsbuild GTK is present — not a clean storybook test"
            exit 1
          }
          Write-Host "clean host — gvsbuild GTK was never installed in this job"

      # Stage the windowing bundle + addon prebuild in the sibling layout node-gi's
      # loader expects (prebuilds/win32-x64/{node_gi.node, gtk/}), plus the storybook
      # bundle IN the package dir (self-reference resolves @gjsify/node-gi/gi).
      - name: Download FULL-windowing GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-win32-x64-windowing
          path: packages/node-gi/node-gi/prebuilds/win32-x64/gtk

      - name: Download node-gi addon prebuild (from the windows job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64

      - name: Download the Adwaita Storybook --app node bundle
        uses: actions/download-artifact@v4
        with:
          name: storybook-node-gi-bundle
          path: packages/node-gi/node-gi

      - name: Verify staged layout
        shell: pwsh
        run: |
          Get-ChildItem packages/node-gi/node-gi/prebuilds/win32-x64
          "storybook bundle: $(Test-Path packages/node-gi/node-gi/storybook.node.mjs)"
          "schemas: $(Test-Path packages/node-gi/node-gi/prebuilds/win32-x64/gtk/share/glib-2.0/schemas/gschemas.compiled)"
          "loaders: $(Test-Path packages/node-gi/node-gi/prebuilds/win32-x64/gtk/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache)"

      # The capstone: the full Adwaita gallery renders on node-gi from the windowing
      # bundle. NODE_GI_NATIVE=prebuild loads the staged addon; the loader's PATH-prepend
      # + windowing-env wiring resolves the DLLs + schemas/loaders/icons from the bundle.
      - name: Storybook proof — full Adwaita gallery renders on node-gi (no gvsbuild GTK)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
          GSK_RENDERER: cairo
          GJSIFY_STORYBOOK_PROBE: '1'
          GJSIFY_STORYBOOK_PROBE_STORY: 'Boxed Lists/Switch Row'
          GJSIFY_STORYBOOK_PROBE_STORY_WIDGET: 'AdwSwitchRow'
          GJSIFY_STORYBOOK_PROBE_OUT: storybook-probe.json
        shell: pwsh
        run: |
          node storybook.node.mjs
          $code = $LASTEXITCODE
          Write-Host "--- probe result ---"
          if (Test-Path storybook-probe.json) { Get-Content storybook-probe.json }
          exit $code
