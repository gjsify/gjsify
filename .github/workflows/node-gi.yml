name: node-gi

# Dedicated CI for @gjsify/node-gi — the Node-native GObject-Introspection
# engine (Axis 5). It is NOT a gjsify workspace member (the GJS-first
# install/foreach tooling can't build a node-gyp addon), so the main GJS
# workflow does not build or test it; this workflow is its source of truth.
# Builds the N-API addon against girepository-2.0 and runs the smoke tests on
# Node, mirroring the Fedora 44 environment the rest of CI uses.

# THE TRIGGER IS A DENY-LIST, and that is the whole point (#1173). The consumer
# harness runs NINE OTHER packages' own test suites through the reverse bridge, so
# a break originating anywhere in their source — or in anything they share, like
# `packages/gjs/unit` — was invisible to the allow-list of three node-gi paths this
# used to carry. Measured: `main` went red on 2026-08-13 and stayed red with nothing
# reporting it, because no merge after the v0.38.1 release touched a filtered path.
# A docs-only edit to `packages/node-gi/AGENTS.md` is what eventually re-triggered
# it, 1 day later. Same class as #1028 (an e2e guard firing only on `tests/e2e/**`)
# and #1149 (a hook trigger naming four of 111 closure packages): a guard whose
# trigger is narrower than its subject. An allow-list fails SILENT — an input nobody
# listed produces no run, and no run reads as no problem. A deny-list fails the
# other way, which is the only direction a guard may fail in.
#
# The first answer to #1173 was `schedule` + `workflow_dispatch`, on the reasoning
# that a PR-side fix was unaffordable: "this builds an addon and runs three runtimes
# over nine suites, which no unrelated PR should pay for". That treats the run as
# indivisible, and it is not. Six of the 23 jobs are plain `ubuntu-latest` (~21 job-
# minutes, ~8 min wall) and they ARE the consumer guard; the other 17 are the macOS
# ×10 / Windows ×6 / arm64 matrix, which proves the ENGINE's OS portability — dyld
# and PE relocation, marshalling under a different pointer width — and which no
# consumer change can move. So the trigger runs wide and the `scope` job below keeps
# the OS matrix on the narrow set. The nightly stays: it is what bounds how long a
# break can hide when nobody pushes at all.
#
# The case that settled it: #1179 fixes the very red leg this comment describes, and
# under the allow-list no CI job could observe the fix, because the fix is in
# `packages/node/zlib`. A gate that cannot see its own repair is not a gate.
on:
  push:
    branches: [main]
    # Deliberately short, and repeated rather than shared: a YAML anchor is not
    # part of the workflow syntax GitHub parses. Every entry must be a path that
    # CANNOT change what this workflow builds or runs; when in doubt it belongs
    # off the list, because an entry added by guess restores the silence above.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
      - 'refs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
      - 'refs/**'
  schedule:
    # 03:17 UTC — off the hour, so this does not queue behind everything else
    # scheduled at :00.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-RUN off a PR, so no two runs share a group and none can evict another while
  # pending. `main.yml` carries the measured incident and why the sha is not enough.
  group: ${{ github.event_name == 'pull_request' && format('node-gi-pr-{0}', github.ref) || format('node-gi-{0}', github.run_id) }}
  # PRs cancel their own superseded runs; main pushes and the nightly complete on
  # their own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ONE decision, read by every OS leg: does this run include the macOS/Windows/
  # arm64 matrix? The `on:` block above explains why the trigger is wide; this is
  # where the cost of that width is paid back. The rule is deliberately blunt and
  # per-RUNNER rather than per-job — everything on `ubuntu-latest` always runs,
  # the scarce runners run when node-gi's own sources changed — because a
  # per-job "could a consumer change move this?" list is a second copy of the
  # dependency graph, and the copy is what drifts. This is a per-RUNNER cost
  # control on THIS workflow's own matrix, not an application of ADR 0018 § 5's
  # PR asymmetry — that half was re-measured on 2026-08-16 and superseded, and
  # the OS legs elsewhere (`macos-suites.yml`, `windows-suites.yml`, `napi.yml`)
  # now run on every PR. What separates the two is what the gate keys on: this
  # one asks which FILES changed, the superseded asymmetry asked which EVENT it
  # was — and only the second leaves a PR structurally unable to see what its own
  # merge will.
  scope:
    name: Scope the OS legs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.decide.outputs.engine }}
    steps:
      - name: Decide from the changed files
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          decide() {
            printf 'engine=%s\n' "$1" >> "$GITHUB_OUTPUT"
            printf '### OS legs: %s\n\n%s\n' "$1" "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          files=''
          case "$EVENT" in
            pull_request)
              files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || files=''
              ;;
            push)
              # A branch's first push and a force-push leave no usable base.
              case "$BEFORE" in
                ''|0000000000000000000000000000000000000000) files='' ;;
                *) files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename') || files='' ;;
              esac
              ;;
            *)
              decide true "\`$EVENT\` runs the full matrix by definition."
              ;;
          esac

          # No list is no decision, and a guard may only fail towards running.
          # GitHub truncates the file list of a very large diff, which lands here
          # as well rather than as a quietly narrowed run.
          if [ -z "$files" ]; then
            decide true 'The changed-file list was empty or unreadable — failing open.'
          fi

          if printf '%s\n' "$files" | grep -Eq '^(packages/node-gi/|scripts/node-gi-consumer-harness\.mjs$|\.github/(workflows/node-gi\.yml$|scripts/))'; then
            decide true "node-gi's own sources changed."
          fi
          decide false 'Consumer-only change: the Linux legs run, the OS matrix does not.'

  build-test:
    name: Build & test (Node / Fedora 44)
    runs-on: ubuntu-latest
    # Backstop: the mainloop tests run a blocking GLib loop; a regression in the
    # libuv↔GLib bridge could hang run(), so cap the job rather than wait 6h.
    timeout-minutes: 20
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - name: Verify the baked toolchain
        run: |
          # pango (Pango/PangoCairo typelibs) + gdk-pixbuf2 (GdkPixbuf typelib) back the
          # caller-alloc-struct-out + bytes-in conformance programs; dejavu supplies a
          # real font so Pango layout relations (width > 0) hold deterministically.
          gjs --version
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"
          echo "dbus-run-session: $(command -v dbus-run-session)"

      # Use the official nodejs.org build, NOT Fedora's `dnf nodejs`: the Fedora
      # package segfaults rolldown's prebuilt napi binding (the gjsify bundler
      # engine) inside the minimal container, so `gjsify build` crashes. The
      # official build runs it fine. setup-node works inside this container (the
      # main workflow does the same), and node-gyp builds the addon against it.
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Bun + Deno for the quad-runtime example capstone below (gjs + node are
      # already present). The quad harness auto-skips a runtime not on PATH, so
      # these just widen the capstone from 2 to all 4 runtimes in this one job.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runtimes
        run: |
          node --version
          bun --version
          deno --version

      - name: Build native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      - name: Smoke test (node --test)
        working-directory: packages/node-gi/node-gi
        run: npm test

      # DBus leg: the Gio.DBus client surface (makeProxyWrapper + name owning +
      # a live signal round-trip) needs a session bus — no display required, so it
      # runs here under a throwaway private bus (dbus-run-session, from the
      # dbus-daemon package added above). The test also spawns `gjs -m` against its
      # OWN private bus and asserts the normalized round-trip is byte-identical
      # (gjs is the gold standard). The default `npm test` above self-skips these
      # cases when no bus is reachable, so this is the leg that exercises them.
      - name: DBus test (dbus-run-session)
        working-directory: packages/node-gi/node-gi
        run: npm run test:dbus

      # GC-stress leg: the toggle-ref instance bridge (wrapper identity,
      # collectability, toggle-up rooting, resurrection, signal-cycle, soak) only
      # surfaces under deliberate GC pressure, which needs --expose-gc for
      # global.gc(). Plain `node --test` self-skips those cases; this leg runs
      # them. Reuses the addon already built by the previous step.
      - name: GC-stress test (node --test --expose-gc)
        working-directory: packages/node-gi/node-gi
        run: npm run test:gc

      # Golden-diff conformance harness: the same gi:// programs
      # (conformance/programs/*.conf.mjs) run on gjs, node, bun AND deno —
      # stdout must be byte-identical to the committed goldens (gjs = the
      # reference; failures are only excusable via the strict exclusion ledger,
      # and a stale ledger entry fails too). All four runtimes are installed in
      # this job; no bundler involved (runtime twins via globals.js + requireGi).
      - name: Conformance (golden-diff, gjs/node/bun/deno)
        working-directory: packages/node-gi/node-gi
        run: npm run test:conformance

      # Tier-B typelib oracle: the GJS installed-tests port (gimarshalling/)
      # runs against the purpose-built GIMarshallingTests-1.0 typelib compiled
      # from the pinned gobject-introspection-tests revision (the same pin
      # refs/gjs tests against). meson + ninja come from the baked image, and the
      # built .gi-tests/ tree is cached keyed by that pin — a hit makes the
      # typelib build a stamped no-op. The rev in the key MUST match PINNED_REV
      # in scripts/build-gi-test-typelibs.mjs.
      - name: Cache GI test typelibs (pinned rev)
        uses: actions/cache@v4
        with:
          path: packages/node-gi/node-gi/.gi-tests
          key: gi-test-typelibs-67432ee4ebf74349cb3c848f73945b21a767e276-fedora44-v1

      - name: Typelib oracle (GIMarshallingTests port)
        working-directory: packages/node-gi/node-gi
        run: npm run test:gimarshalling

      # Quad-runtime capstone: several unchanged gi:// sources build + run
      # BYTE-IDENTICALLY on gjs, node, bun AND deno. `npm install` builds
      # @gjsify/node-gi via the `file:../node-gi` dependency (node-gyp), so the
      # example exercises the in-tree runtime + addon. `quad.e2e.mjs` builds each
      # source `--app gjs` (real bundler) + runs on gjs (the reference), then
      # runs the `--app node` bundle (or its runtime twin) on node/bun/deno,
      # asserting every runtime's output equals gjs and the fixed golden.
      - name: Quad gjs/node/bun/deno example (capstone)
        working-directory: packages/node-gi/example
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          node --test quad.e2e.mjs

  # Cross-runtime proof: the SAME Node-API addon runs the GObject/GLib/Gio surface
  # on Bun and Deno, not just Node. node-gyp builds it once; scripts/stage-prebuild
  # then stages it as prebuilds/<platform>-<arch>/ so the conformance runs load via
  # the PREBUILD path (the only install path Deno supports — it runs no postinstall
  # build). The runner spawns one bun/deno process per file (they share a process
  # across files by default, unlike Node's per-file pool). Headless — no display —
  # so the GTK/co-pump/--expose-gc legs are excluded (they stay Node's job above).
  cross-runtime:
    name: Bun + Deno conformance (Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - name: Verify the baked toolchain
        run: |
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"

      # Official Node builds the addon (node-gyp) and orchestrates the runner, which
      # spawns bun/deno per file. Same rationale as the build-test job.
      - name: Use official Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      - name: Stage prebuild (conformance loads via the prebuild path)
        working-directory: packages/node-gi/node-gi
        run: node scripts/stage-prebuild.mjs

      - name: Verify runtimes
        run: |
          node --version
          bun --version
          deno --version

      # NODE_GI_NATIVE=prebuild keeps this job validating the prebuild LOAD PATH
      # (Deno's install path) explicitly — the runner otherwise defaults to the
      # just-built addon so stale local prebuilds can't shadow verification.
      - name: Conformance on Bun
        working-directory: packages/node-gi/node-gi
        run: npm run test:bun
        env:
          NODE_GI_NATIVE: prebuild

      - name: Conformance on Deno
        working-directory: packages/node-gi/node-gi
        run: npm run test:deno
        env:
          NODE_GI_NATIVE: prebuild

  # GTK/Adw layering proof (Axis-5 GTK milestone): UNCHANGED Gtk.Application (PR1),
  # Adw.Application (PR2) AND a Gtk.Template composite-template widget (PR4) run on
  # Node via the engine — construct + activate + window + Adwaita chrome
  # (HeaderBar/ToolbarView/StatusPage) + CSS provider + quit; the libuv↔GLib bridge
  # co-pumps Node's event loop during g_application_run (a setTimeout scheduled
  # before run() fires while run() blocks); and a registerClass({Template,Children,
  # InternalChildren,CssName}) subclass installs its template in class_init, runs
  # gtk_widget_init_template at construction, and exposes its bound children on the
  # instance. This needs a display + the GTK/Adw stack, so it is isolated in a
  # dedicated job: the fast headless `Build & test` leg above stays light and the
  # smoke tests self-skip there (no DISPLAY). Runs the GTK loop, so cap the job
  # rather than let a hung loop wait 6h.
  gtk-smoke:
    name: GTK/Adw smoke (Node + Xvfb / Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The storybook proof (last step) runs the prebuilt --app node storybook
    # bundle the storybook-node-gi-bundle job produced — the Linux parity of the
    # windows-gtk-storybook capstone (same bundle, both platforms).
    needs: storybook-node-gi-bundle
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - name: Verify the baked toolchain
        run: |
          gjs --version
          echo "gtk4: $(pkg-config --modversion gtk4)"
          echo "libadwaita: $(pkg-config --modversion libadwaita-1)"
          echo "gtksourceview5: $(pkg-config --modversion gtksourceview-5)"

      # Same rationale as the build-test job: the official nodejs.org build, not
      # Fedora's dnf node (which crashes the bundler's prebuilt napi binding).
      - name: Use official Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Bun + Deno so the GUI proof below can run on all four runtimes. Both
      # setup actions unpack a zip, so they MUST come after the dnf step above
      # and that step must carry `unzip` — every other job in this file that
      # uses them installs it for exactly this reason.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      # Xvfb gives a virtual X11 display; dbus-run-session gives a private session
      # bus so GApplication startup is quiet/deterministic; GSK_RENDERER=cairo +
      # LIBGL_ALWAYS_SOFTWARE=1 + GDK_BACKEND=x11 keep GTK off any GPU/Vulkan path
      # that a software-only Xvfb cannot provide; GTK_A11Y=none avoids the a11y bus.
      # Runs ALL the GTK smoke tests (Gtk.Application PR1 + Adw.Application PR2 +
      # Gtk.Template PR4 + Template signal callbacks & menu breadth + the GStrv
      # construct-property cases + the GListModel interface-typed property cases +
      # the Adwaita widget-breadth proof (widgets.test.mjs: PreferencesPage/Group +
      # SwitchRow/EntryRow/ComboRow/SpinRow/ExpanderRow + a Gtk.ListBox + a toast,
      # DumpTree-typed and driven through the node-gi notify:: signal chain) + the
      # GtkSource-5 proof (gtksource-smoke.test.mjs: a GtkSource.Buffer/Language
      # Manager model + a GtkSource.GutterRendererText SUBCLASS with a
      # vfunc_query_data override — Learn6502's editor-gutter shape — constructs,
      # inserts into a GtkSource.View gutter and rasterises; the Learn6502-port
      # groundwork), which need the Gtk-4.0 typelib the fast headless leg lacks) in
      # one node --test invocation so each reports even if one fails.
      # The GUI capability is portable — the addon is Node-API and a blocking
      # `Gtk.Application.run()` is driven by GLib, not by the host's loop — so
      # it is gated on bun and deno as well, not just node.
      #
      # Bun and Deno need their OWN test runners: `bun file.mjs` refuses
      # `node:test` outright ("Cannot use test outside of the test runner"), so
      # a plain-script invocation proves nothing.
      - name: GTK GUI proof on Bun + Deno (xvfb + dbus)
        working-directory: packages/node-gi/node-gi
        run: |
          # Bun and Deno run SEQUENTIALLY, each under its own `xvfb-run -a`.
          # They were briefly concurrent, which raced: two simultaneous
          # `xvfb-run -a` both scan for a free display number and can settle on
          # the same one, and the loser dies with "Failed to open display".
          # There is nothing to win here anyway — both suites together run in
          # well under a second, while this job is minutes of dnf + node-gyp.
          # Sequential costs noise and cannot race.
          run_rt() {
            xvfb-run -a dbus-run-session -- \
              env GSK_RENDERER=cairo GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
              "$@" > "/tmp/gui-$1.log" 2>&1
          }
          status=0
          run_rt bun  test test/gtk-smoke.test.mjs test/adw-smoke.test.mjs || status=1
          run_rt deno test -A --node-modules-dir=auto test/gtk-smoke.test.mjs test/adw-smoke.test.mjs || status=1
          for rt in bun deno; do
            echo "::group::$rt"; cat "/tmp/gui-$rt.log"; echo "::endgroup::"
          done
          exit $status

      - name: GTK/Adw smoke test (xvfb + dbus)
        working-directory: packages/node-gi/node-gi
        run: |
          xvfb-run -a dbus-run-session -- \
            env GSK_RENDERER=cairo GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
            node --test test/gtk-smoke.test.mjs test/adw-smoke.test.mjs \
              test/windowing.test.mjs test/windowing-interactive.test.mjs \
              test/widgets.test.mjs test/gtksource-smoke.test.mjs \
              test/gtk-template.test.mjs test/gtk-template-callbacks.test.mjs \
              test/gtk-template-signals.test.mjs \
              test/strv-construct.test.mjs test/interface-props.test.mjs

      # The ONE leg with a WAYLAND display, and the only place the #1145 guard can
      # run: every other GTK step here pins GDK_BACKEND=x11, and GdkX11's event
      # source holds nothing across prepare/check, so the deadlock the fix closed
      # (GDK's Wayland prepare() takes libwayland's reader slot, the uv pump's
      # hint pass never gave it back, `gtk_window_present()` blocked forever) is
      # invisible under Xvfb. weston's headless backend needs no GPU, no seat and
      # no DRM — a socket in XDG_RUNTIME_DIR is the whole requirement.
      # NODE_GI_REQUIRE_WAYLAND=1 turns the test's self-skip into a failure, so a
      # compositor that never came up cannot be reported as a pass.
      - name: Wayland prepare/check regression (headless weston)
        working-directory: packages/node-gi/node-gi
        run: |
          set -eu
          # weston is baked into .docker/ci-fedora.Dockerfile. The `||` covers exactly one
          # window and retires itself: `build-ci-image.yml` only PUSHES the `:44` tag from
          # main, so the run that ADDS a package to the image still gets the old one.
          command -v weston >/dev/null 2>&1 ||
            dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 weston
          export XDG_RUNTIME_DIR=/tmp/wayland-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          sock="$XDG_RUNTIME_DIR/wayland-ci"
          # `--backend=headless` is the weston 13+ spelling; older weston wants the
          # module filename. Try both rather than pinning a version we do not control.
          for backend in headless headless-backend.so; do
            if [ -S "$sock" ]; then break; fi
            weston --no-config --backend="$backend" --width=800 --height=600 \
              --socket=wayland-ci >"/tmp/weston-$backend.log" 2>&1 &
            for _ in $(seq 1 50); do
              if [ -S "$sock" ]; then break; fi
              sleep 0.2
            done
          done
          if [ ! -S "$sock" ]; then
            echo "::group::weston logs"; cat /tmp/weston-*.log; echo "::endgroup::"
            echo "headless weston never created its socket"
            exit 1
          fi
          WAYLAND_DISPLAY=wayland-ci NODE_GI_REQUIRE_WAYLAND=1 NODE_GI_NATIVE=build \
            GSK_RENDERER=cairo LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
            node --test test/wayland-prepare-check.test.mjs

      # GTK capstone: ONE unchanged Adwaita gi:// source builds + runs
      # byte-identically on BOTH gjs and node under one display — the GTK analog of
      # the headless L3 capstone. `npm install` builds @gjsify/node-gi via the
      # file:../node-gi dependency (node-gyp), so the example exercises the in-tree
      # runtime + addon. dual.e2e.mjs builds `--app gjs` (real bundler) + runs on
      # gjs, and runs the same source on node (the real `--app node` bundle when
      # the installed CLI carries the gi://→requireGi rewrite, else the
      # @gjsify/node-gi runtime), asserting both equal the golden. Both runtimes
      # run under the SAME Xvfb display + software render env; the gjs binary is
      # installed above for the gjs side.
      - name: GTK dual gjs+node Adwaita example (capstone)
        working-directory: packages/node-gi/example-gtk
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          xvfb-run -a dbus-run-session -- \
            env GSK_RENDERER=cairo GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
            node --test dual.e2e.mjs

      # Storybook capstone (Linux parity of windows-gtk-storybook): the SAME
      # prebuilt `--app node` Adwaita-Storybook bundle the storybook-node-gi-bundle
      # job produced, run on Node via the reverse bridge. `GJSIFY_STORYBOOK_PROBE`
      # drives it headlessly (no DBus): asserts the sidebar lists the component
      # categories, the storybook chrome is in the widget tree, a representative
      # story (Boxed Lists/Switch Row) opens + renders an AdwSwitchRow subtree, and
      # the window rasterises to a non-empty GSK PNG — then quits 0/1. The bundle is
      # placed IN the node-gi package dir so its external `@gjsify/node-gi/gi` import
      # self-resolves (Node package self-reference); NODE_GI_NATIVE=build loads the
      # node-gyp addon this job built. System GTK + Xvfb here; the Windows leg proves
      # the same bundle on the batteries-included --windowing bundle with no gvsbuild.
      - name: Download the Adwaita Storybook --app node bundle
        uses: actions/download-artifact@v4
        with:
          name: storybook-node-gi-bundle
          path: packages/node-gi/node-gi

      - name: Storybook proof — full Adwaita gallery renders on node-gi (system GTK, xvfb)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: build
          GJSIFY_STORYBOOK_PROBE: '1'
          GJSIFY_STORYBOOK_PROBE_STORY: 'Boxed Lists/Switch Row'
          GJSIFY_STORYBOOK_PROBE_STORY_WIDGET: 'AdwSwitchRow'
          GJSIFY_STORYBOOK_PROBE_OUT: storybook-probe.json
        run: |
          set +e
          xvfb-run -a dbus-run-session -- \
            env GSK_RENDERER=cairo GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
            node storybook.node.mjs
          code=$?
          set -e
          echo "--- probe result ---"; cat storybook-probe.json 2>/dev/null || true
          exit $code

  # Second real consumer of the node-gi reverse bridge (ADR-0005 graduation-gate
  # item: "a second real consumer using the dual-build"; consumer #1 is
  # `gjsify storybook --runtime node`). Runs the Tier-1 `@gjsify/sqlite` package's
  # OWN GJS test suite UNDER node-gi on Node: `gjsify build --app node
  # --alias node:sqlite=@gjsify/sqlite` rewrites its `gi://Gda?version=6.0` onto
  # `@gjsify/node-gi` (the L2 gjsGiNodePlugin) and retargets the specs' `node:sqlite`
  # import onto the libgda-backed polyfill, then runs it on `node`. sqlite's
  # DatabaseSync/StatementSync API is fully SYNCHRONOUS (libgda open/execute block),
  # so the WHOLE suite runs with no GLib main-loop pumping: of the 52 tests, 51 pass
  # — exercising real `Gda.Connection` construction, GObject/GValue-parameter method
  # marshalling AND result-row reading via `Gda.DataModel.get_value_at()` (node-gi
  # unboxes its scalar GValue returns to JS primitives since gjsify PR #735). The 1
  # remaining failure is skipped WITH a documented reason (a BLOB `Uint8Array` does
  # not yet round-trip to/from a GValue byte array — a distinct marshalling gap) via
  # the opt-in `run(..., { skip })` list in `src/test.node-gi.mts`; the shared specs
  # are reused verbatim, never weakened. `@gjsify/node-gi` is a devDependency ONLY
  # (the sanctioned ADR-0005 seam; `scripts/audit-runtimes.mjs --check` stays green).
  #
  # BUILD ENGINE — under Node, not GJS. The workspace `.bin/gjsify` that
  # `gjsify install` writes is GJS-first (runs the committed cli.gjs.mjs bundle when
  # gjs is present), whose `gjsify build` needs `@gjsify/rolldown-native` — a
  # vala/meson prebuild NOT in this minimal fedora container. So every `gjsify build`
  # here runs under Node via a published `@gjsify/cli` (npm `rolldown` engine), the
  # same way the build-test job builds the node-gi/example. Isolated in its own job
  # like cross-runtime/gtk-smoke — the other jobs are untouched.
  consumer-sqlite:
    name: sqlite suite as node-gi consumer (Node / Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - name: Verify the baked toolchain
        run: |
          gjs --version
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"
          echo "Gda typelib: $(ls /usr/lib64/girepository-1.0/Gda-6.0.typelib 2>/dev/null || echo MISSING)"

      # Official nodejs.org build, NOT Fedora's dnf node (which crashes rolldown's
      # prebuilt napi binding — the gjsify bundler engine). Same rationale as the
      # build-test job. Also builds the @gjsify/node-gi addon via node-gyp.
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build @gjsify/node-gi native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      # Node-free workspace install via the published CLI (the supported
      # `gjsify install --immutable` path). Needed because @gjsify/sqlite is a
      # workspace package with `workspace:^` deps + `@girs/gda-6.0` — it cannot be
      # built standalone like the self-contained node-gi/example.
      - name: Install the gjsify workspace (published CLI, Node-free)
        run: |
          B=$(gjs -m install.mjs --fetch-only)
          gjs -m "$B" install --immutable

      # A published @gjsify/cli (npm rolldown) is the BOOTSTRAP bundler: the committed
      # GJS bundle needs the absent @gjsify/rolldown-native, and the published cli
      # ships a prebuilt Node entry. It is NOT the bundler under test. A job that
      # builds with the LAST RELEASE cannot observe a change to the bundler in THIS
      # checkout, and that is not hypothetical: the storybook proof went red on a
      # defect #890 had already fixed in source, and STAYED red, because the published
      # cli carried the pre-fix detector. The bootstrap's only job is to build this
      # checkout's cli; from there on we use that one.
      - name: Bootstrap a Node bundler, then switch to this checkout's cli
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          # Prefer the version this checkout declares, but do NOT require it to be
          # on npm yet. The release commit bumps every package.json and only THEN
          # does release.yml publish, so between those two events this step asks
          # npm for a version that provably does not exist — `npm error notarget
          # No matching version found for @gjsify/cli@<v>` — and reddens main on
          # every single release. A recurring, self-resolving red teaches people
          # to ignore the signal. Same guard napi.yml already carries.
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && "${GITHUB_WORKSPACE}/.github/scripts/install-published-cli.sh" "${CLI_VERSION}" )
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          echo "Bootstrap bundler: $(node_modules/.bin/gjsify --version)"

          # ...and that is only the BOOTSTRAP. Build THIS checkout's CLI with it, then
          # switch over, so everything below is gated by the source in this PR rather
          # than by the last release.
          PATH="$PWD/node_modules/.bin:$PATH" node_modules/.bin/gjsify run build:infra
          ln -sfn "$PWD/packages/infra/cli/lib/index.js" node_modules/.bin/gjsify
          echo "Node bundler (this checkout): $(node_modules/.bin/gjsify --version)"

      # Build only what the --app node bundle inlines: @gjsify/sqlite's lib and
      # @gjsify/unit's lib (+ their transitive workspace-dep libs, topological).
      # build:gjsify (the --library step) is enough — the bundle needs lib/esm/*.js,
      # not the .d.ts emit. Runs under Node via the repointed .bin/gjsify.
      - name: Build @gjsify/sqlite + @gjsify/unit under Node (+ workspace deps)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          gjsify workspace @gjsify/unit build:gjsify --with-dependencies
          gjsify workspace @gjsify/sqlite build:gjsify --with-dependencies

      # Guarantee the devDependency file: link resolves to the freshly node-gyp-built
      # addon regardless of how the install materialised it (belt-and-suspenders).
      - name: Link the node-gi devDependency
        run: |
          mkdir -p packages/node/sqlite/node_modules/@gjsify
          ln -sfn ../../../../node-gi/node-gi packages/node/sqlite/node_modules/@gjsify/node-gi
          ls -l packages/node/sqlite/node_modules/@gjsify/node-gi

      # Build the --app node node-gi bundle (under Node via the repointed cli) + run
      # it on Node — the package's `test:gjs-on-node` script. The system-installed
      # Gda-6.0 typelib + libgda .so live on the default GI/loader search paths, so
      # node-gi loads them with no extra GI_TYPELIB_PATH/LD_LIBRARY_PATH. Exits
      # non-zero on any real failure (the 1 documented BLOB skip is not a failure).
      - name: Run @gjsify/sqlite suite on node-gi
        working-directory: packages/node/sqlite
        run: |
          export PATH="$PWD/../../../node_modules/.bin:$PATH"
          gjsify run test:gjs-on-node

  # @gjsify/gtk-host's node leg — the SAME 1934-test suite its gjs leg runs, built
  # `--app node` and executed over the node-gi reverse bridge (ADR 0030: one corpus
  # per claim, gjs is the oracle; the package's `test:gjs-on-node` script). This is
  # the widest GTK-shaped consumer of the bridge — solid/vue/react renderers over
  # the whole curated widget table — and it lives HERE rather than in main.yml
  # because a red on it is node-gi's to answer: the identical source is green on
  # gjs in main.yml's sharded sweep, so a gjs-green/node-red diff is a binding (or
  # reverse-bridge build) defect by construction. Deliberately wired only now: it
  # was left out while 25 of its tests were red for defects outside gtk-host,
  # because a leg that is red for another package's defects teaches people to
  # ignore it. It went in at 0 failures.
  #
  # `@gjsify/iframe` joined the same job rather than getting one of its own, and
  # the reason is the job, not thrift: it already installs the whole workspace,
  # builds this checkout's cli and node-gi addon, and the image already bakes
  # webkitgtk6.0 — a second job would be 70 lines of identical bootstrap for one
  # `run:`. Its slot is the same amendment gtk-host's was (ADR 0022 § Amendment —
  # the `node` slot): the package binds GJS through nothing but `gi://`, and Node
  # is the ONLY host macOS and Windows have for the WebView pillar, so this leg is
  # what stands behind `runtimes.node: "polyfill"` on the two platforms no `gjs`
  # leg can reach. It needs no display (measured with DISPLAY and WAYLAND_DISPLAY
  # both unset) and runs under xvfb anyway, because it shares the step recipe with
  # gtk-host and a second recipe is a second thing to keep true.
  gtk-host-node:
    name: framework suites over the reverse bridge (Node + Xvfb / Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - name: Verify the baked toolchain
        run: |
          gjs --version
          echo "gtk4: $(pkg-config --modversion gtk4)"
          echo "libadwaita: $(pkg-config --modversion libadwaita-1)"
          # @gjsify/iframe loads gi://WebKit 6.0 at module evaluation, so an
          # image without it fails at the first import rather than in a test.
          echo "webkitgtk-6.0: $(pkg-config --modversion webkitgtk-6.0)"

      # Official nodejs.org build, NOT Fedora's dnf node (which crashes rolldown's
      # prebuilt napi binding — the gjsify bundler engine). Same as the sibling jobs.
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build @gjsify/node-gi native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      # Node-free workspace install via the published CLI (the supported
      # `gjsify install --immutable` path) — gtk-host needs its workspace deps
      # (@girs/*, @gjsify/unit) AND its npm peer/dev deps (solid-js, vue,
      # react, react-reconciler) present.
      - name: Install the gjsify workspace (published CLI, Node-free)
        run: |
          B=$(gjs -m install.mjs --fetch-only)
          gjs -m "$B" install --immutable

      # A published @gjsify/cli (npm rolldown) is the BOOTSTRAP bundler: the committed
      # GJS bundle needs the absent @gjsify/rolldown-native, and the published cli
      # ships a prebuilt Node entry. It is NOT the bundler under test — a job that
      # builds with the LAST RELEASE cannot observe a change to the bundler in THIS
      # checkout (the reverse-bridge resolve fix is exactly such a change). The
      # bootstrap's only job is to build this checkout's cli; from there on we use
      # that one. Same block as consumer-sqlite / storybook-node-gi-bundle.
      - name: Bootstrap a Node bundler, then switch to this checkout's cli
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          # Prefer the version this checkout declares, but do NOT require it to be
          # on npm yet — between the release commit and release.yml's publish that
          # version provably does not exist (same guard as the sibling jobs).
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && "${GITHUB_WORKSPACE}/.github/scripts/install-published-cli.sh" "${CLI_VERSION}" )
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          echo "Bootstrap bundler: $(node_modules/.bin/gjsify --version)"

          PATH="$PWD/node_modules/.bin:$PATH" node_modules/.bin/gjsify run build:infra
          ln -sfn "$PWD/packages/infra/cli/lib/index.js" node_modules/.bin/gjsify
          echo "Node bundler (this checkout): $(node_modules/.bin/gjsify --version)"

      # Build the two libs + their transitive workspace deps (incl. @gjsify/unit).
      # build:gjsify (the --library step) emits the lib/esm/*.js the --app node
      # bundle inlines — no .d.ts emit needed here. `--with-dependencies` is what
      # brings @gjsify/message-channel's lib in through iframe's closure, which the
      # iframe leg reaches by its `/core` subpath.
      - name: Build the framework libs under Node (+ workspace deps)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          gjsify workspace @gjsify/unit build:gjsify --with-dependencies
          gjsify workspace @gjsify/gtk-host build:gjsify --with-dependencies
          gjsify workspace @gjsify/iframe build:gjsify --with-dependencies

      # Guarantee the devDependency file: link resolves to the freshly node-gyp-built
      # addon regardless of how the install materialised it (belt-and-suspenders,
      # same as consumer-sqlite).
      - name: Link the node-gi devDependency
        run: |
          for pkg in packages/framework/gtk-host packages/framework/iframe; do
            mkdir -p "$pkg/node_modules/@gjsify"
            ln -sfn ../../../../node-gi/node-gi "$pkg/node_modules/@gjsify/node-gi"
            ls -l "$pkg/node_modules/@gjsify/node-gi"
          done

      # Xvfb + a private session bus, software rendering — the gtk-smoke recipe.
      # NODE_GI_NATIVE=build pins the just-built addon over any staged prebuild.
      # A stood-down green is structurally excluded: the suites gate on runtime
      # IDENTITIES that include Node.js (GTK_HOSTS in src/testing/gate.mts — a
      # capability probe would stand down silently, which is why it is not one),
      # so on this leg they RUN, and a missing GTK dies loudly at Gtk.init().
      - name: Run the gtk-host suite on node-gi (xvfb + dbus)
        working-directory: packages/framework/gtk-host
        run: |
          export PATH="$PWD/../../../node_modules/.bin:$PATH"
          xvfb-run -a dbus-run-session -- \
            env GSK_RENDERER=cairo GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
            NODE_GI_NATIVE=build gjsify run test:gjs-on-node

      # The WebView pillar's node leg — the SAME suite main.yml runs on gjs, built
      # `--app node` so `gi://WebKit?version=6.0` goes through requireGi(). It is
      # what stands behind `@gjsify/iframe`'s `runtimes.node: "polyfill"`
      # (ADR 0022 § Amendment — the `node` slot), and the only leg that exercises
      # the pillar on the host macOS and Windows actually have.
      #
      # It takes no build flags of its own, and that is the point rather than an
      # omission: the first version of this leg carried an `--alias` forcing
      # `@gjsify/message-channel` back onto its polyfill, which made the suite
      # green over a divergence the SHIPPING node build also had (ADR 0022
      # § Amendment → "What the leg found"). The alias is gone because the source
      # is fixed; if a future one seems necessary here, that is the finding.
      - name: Run the iframe suite on node-gi (xvfb + dbus)
        working-directory: packages/framework/iframe
        run: |
          export PATH="$PWD/../../../node_modules/.bin:$PATH"
          xvfb-run -a dbus-run-session -- \
            env GSK_RENDERER=cairo GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GTK_A11Y=none \
            NODE_GI_NATIVE=build gjsify run test:gjs-on-node

  # aarch64 proof: build the Node-API addon + run the core suite, the golden-diff
  # conformance (gjs/node/bun/deno byte-identical) and the tier-B typelib oracle on
  # a NATIVE arm64 runner (ubuntu-24.04-arm — no qemu). node-gi has hand-written
  # C++ marshalling (ffi arg/return slots, pointer-width + endianness assumptions,
  # the toggle-ref GC dance) that only x86_64 has exercised so far; this catches any
  # arch-specific regression and produces the arm64 prebuild the published tarball
  # ships for Deno (which runs no postinstall build). Kept lean vs the x86_64
  # build-test job (no GC-stress/quad/DBus legs) so the extra arm minutes stay small.
  arm64:
    name: aarch64 build + conformance (Fedora 44)
    needs: scope
    if: ${{ needs.scope.outputs.engine == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + GObject-Introspection dev headers
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            glib2-devel gobject-introspection-devel gobject-introspection gjs cairo-devel \
            meson ninja-build \
            pango gdk-pixbuf2 dejavu-sans-fonts
          gjs --version
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"
          echo "arch: $(uname -m)"

      - name: Use official Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      - name: Smoke test (node --test)
        working-directory: packages/node-gi/node-gi
        run: npm test

      - name: Conformance (golden-diff, gjs/node/bun/deno)
        working-directory: packages/node-gi/node-gi
        run: npm run test:conformance

      - name: Cache GI test typelibs (pinned rev, aarch64)
        uses: actions/cache@v4
        with:
          path: packages/node-gi/node-gi/.gi-tests
          key: gi-test-typelibs-67432ee4ebf74349cb3c848f73945b21a767e276-fedora44-arm64-v1

      - name: Typelib oracle (GIMarshallingTests port)
        working-directory: packages/node-gi/node-gi
        run: npm run test:gimarshalling

      # Stage the arm64 prebuild + upload it as an artifact so a release can ship
      # prebuilds/linux-arm64/ in the tarball (the Deno install path — no postinstall
      # build). NODE_GI_NATIVE=prebuild then re-verifies the staged binary loads.
      - name: Stage arm64 prebuild
        working-directory: packages/node-gi/node-gi
        run: node scripts/stage-prebuild.mjs

      - name: Verify the staged prebuild loads (bun + deno)
        working-directory: packages/node-gi/node-gi
        run: npm run test:bun && npm run test:deno
        env:
          NODE_GI_NATIVE: prebuild

      - name: Upload arm64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-prebuild-linux-arm64
          path: packages/node-gi/node-gi/prebuilds/linux-arm64/node_gi.node
          if-no-files-found: error

  # macOS proof (Phase 1 — the reverse bridge BUILDS + RUNS on macOS). The whole
  # team is Linux-only, so a hosted macOS runner is the only way to validate — and
  # BOTH architectures need one, because they are different MACHINES, not different
  # flags: `macos-latest` is Apple silicon (darwin-arm64), `macos-15-intel` is the
  # last x86_64 image Actions offers (through August 2027). The Intel label is the
  # STANDARD tier, so it bills like any other macOS runner and is free on public
  # repos — unlike `macos-*-large`, which is also Intel and carries the 10x
  # multiplier. Installs GTK4 + GObject-Introspection from Homebrew, builds the
  # N-API addon FROM SOURCE (node-gyp + pkg-config, binding.gyp's xcode_settings
  # carry the clang cflags), and runs the DISPLAY-FREE conformance subset on Node
  # (+ Bun/Deno) — the exact subset scripts/cross-runtime.mjs curates (GLib/GObject
  # /Gio marshalling, signals, variant, boxed structs, mainloop-pump, DBus). The
  # GTK-window / GLArea / cairo-drawfunc / adw-smoke DISPLAY tests are NOT run here
  # — GTK-on-macOS is the quartz backend and needs its own display wiring; that is
  # Phase 2 (which also ships a prebuilt GTK stack so consumers need no Homebrew).
  # The addon prebuild IS staged + uploaded PER ARCH (the Deno install path — Deno
  # runs no postinstall build), mirroring the linux legs; a future prebuilt-GTK
  # upload slots in beside it.
  #
  # Nothing here is arch-conditional: every path already derives its target from
  # the running machine (`brew --prefix` is /opt/homebrew on arm64 and /usr/local
  # on Intel; scripts/stage-prebuild.mjs names its directory from
  # `${process.platform}-${process.arch}`), which is why the second leg is a
  # matrix entry rather than a second job.
  macos:
    name: macOS build + conformance (Node+Bun+Deno / darwin-${{ matrix.arch }})
    needs: scope
    if: ${{ needs.scope.outputs.engine == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Install GTK4 + GObject-Introspection (Homebrew)
        run: |
          # gtk4/libadwaita pull graphene/pango/gdk-pixbuf/cairo/glib transitively,
          # but name them so a slimmer future job (core subset only) still resolves.
          # glib provides libgirepository-2.0 + girepository-2.0.pc (the merged API);
          # gobject-introspection provides the GLib/GObject/Gio typelibs (Homebrew
          # builds them there to break the glib<->g-i circular dep) + g-ir tools.
          brew install gtk4 libadwaita gobject-introspection cairo pango gdk-pixbuf graphene pkg-config adwaita-icon-theme
          BREW_PREFIX="$(brew --prefix)"
          # brew symlinks each keg's lib/ — incl. girepository-1.0/*.typelib and
          # pkgconfig/*.pc — into $BREW_PREFIX/lib, so one dir covers every formula.
          # (The typelib DIRECTORY is historically named girepository-1.0 even for
          # the girepository-2.0 API.) DYLD_FALLBACK_LIBRARY_PATH lets the addon's
          # g_module_open() find the Homebrew dylibs a typelib names by leaf soname
          # (Gdk/Graphene/PangoCairo are dlopen'd, not linked into the addon).
          {
            echo "BREW_PREFIX=$BREW_PREFIX"
            echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            echo "GI_TYPELIB_PATH=$BREW_PREFIX/lib/girepository-1.0${GI_TYPELIB_PATH:+:$GI_TYPELIB_PATH}"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$BREW_PREFIX/lib:/usr/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Verify pkg-config + typelibs (diagnostics)
        run: |
          echo "pkg-config: $(command -v pkg-config) ($(pkg-config --version))"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          if pkg-config --exists girepository-2.0; then
            echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"
          else
            echo "girepository-2.0: MISSING — build will fail; check the glib formula's introspection build"
          fi
          pkg-config --exists cairo && echo "cairo: $(pkg-config --modversion cairo)" || echo "cairo: MISSING"
          echo "GI_TYPELIB_PATH=$GI_TYPELIB_PATH"
          echo "--- typelibs present ---"
          ls "${GI_TYPELIB_PATH%%:*}" 2>/dev/null | grep -E 'GLib|GObject|Gio|Gdk|Graphene|Pango|Gtk' || echo "(none matched)"

      # Node 24 builds the addon (node-gyp) and runs the authoritative Node leg.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Bun + Deno widen the proof to all three Node-API runtimes (the SAME addon,
      # their common ABI). setup-bun / setup-deno both support macOS arm64.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runtimes
        run: |
          node --version
          bun --version
          deno --version

      # From source: node-gyp reads binding.gyp's `pkg-config --cflags/--libs
      # girepository-2.0 cairo` (xcode_settings.OTHER_CFLAGS on macOS) → darwin-arm64
      # build/Release/node_gi.node. The install script IS node-gyp rebuild.
      - name: Build native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      # THE LOADER GATE. Every other check on this job — and `gjsify system-check`
      # — asks "is GTK INSTALLED". This asks the question that actually failed:
      # "can dyld find the dylibs a typelib names by BARE LEAF, from a plain
      # `node`". Those had different answers on a fully-installed macOS 15 host
      # (Homebrew's `gjs` carries an rpath into <prefix>/lib, `node` does not), so
      # `showcase canvas2d-fireworks --runtime node` died on
      # `Gtk.DrawingArea is not a subclassable GObject type` while system-check
      # reported GTK4 4.22.4, GI 1.86.0 and everything else present.
      #
      # `env -u` is the load-bearing part, not hygiene: the Homebrew step above
      # exports DYLD_FALLBACK_LIBRARY_PATH=$BREW_PREFIX/lib into GITHUB_ENV, and
      # that hand-written compensation is EXACTLY what hid this from CI — with it
      # set, the broken code passes. Unsetting both loader variables is what makes
      # this step prove node-gi's own env-free resolution (gtk-runtime.js's
      # re-exec over the libdirs system-gi.js derives). Never re-add the variable
      # to this step to "make it more robust"; that reinstates the blind spot.
      #
      # Display-free by construction, which is why it can run here at all:
      # registerClass resolves the parent's get_type() before any window, display
      # or main loop exists. Every DISPLAY/WAYLAND_DISPLAY-gated GTK test in this
      # package skips on macOS (quartz sets neither), so this is currently the
      # only GTK-touching assertion the macOS legs execute. It runs on BOTH matrix
      # arches, so the arm64 leg measures /opt/homebrew and the Intel leg
      # /usr/local — the two prefixes the derivation must handle.
      #
      # TWO invocations, because the derivation has two reachable halves and the
      # convenient one is not the one users take. (a) keeps GI_TYPELIB_PATH, so the
      # typelib half is guaranteed and the test can never degrade into a silent
      # skip; it exercises the "host stated where typelibs live" source. (b) unsets
      # GI_TYPELIB_PATH as well — the actual end-user environment, where nothing is
      # exported and the pkg-config / probed-prefix sources are the only thing that
      # can work. (a) alone would pass even if both of those were broken.
      #
      # (b) asserts the PASS COUNT rather than trusting the exit code: a missing
      # typelib makes the test SKIP, which exits 0 and would quietly stop gating.
      - name: GTK typelib backers resolve with NO loader env (darwin-${{ matrix.arch }})
        working-directory: packages/node-gi/node-gi
        run: |
          set -euo pipefail
          echo "--- (a) loader vars unset, GI_TYPELIB_PATH kept"
          env -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_LIBRARY_PATH \
            node --test --test-reporter=tap test/gtk-typelib-backers.test.mjs
          echo "--- (b) end-user environment: no GI env at all"
          env -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u GI_TYPELIB_PATH \
            node --test --test-reporter=tap test/gtk-typelib-backers.test.mjs | tee /tmp/loader-gate-b.tap
          grep -qx '# pass 2' /tmp/loader-gate-b.tap || {
            echo "::error::env-free leg did not PASS 2 tests (a SKIP means the gate stopped gating)"
            exit 1
          }
        env:
          NODE_GI_NATIVE: build

      # THE APP-CARRIES-ITS-OWN-LIBRARY GATE, and the only place it can be asserted
      # on the OS it was written for. A shipped app stages its typelib and that
      # typelib's backing library into one directory of its own; `GI_TYPELIB_PATH`
      # finds the typelib, and on macOS nothing tells the loader where the library
      # is — a `.app` launcher cannot use `DYLD_*`, because dyld strips those from a
      # restricted (hardened-runtime, Developer-ID-signed) process, so a launcher
      # depending on one works unsigned and breaks at signing time.
      # `GJSIFY_GI_LIBRARY_PATH` → `gi_repository_prepend_library_path()` is the
      # env-free answer, and this step measures the RESULT rather than the wiring:
      # the probe copies a real backer into a scratch dir and reads back which file
      # dyld actually mapped (`process.report` → `_dyld_get_image_name()`), against
      # a control run with the variable unset that must map the system copy.
      #
      # `env -u` for the same reason as the step above: the Homebrew step exports
      # DYLD_FALLBACK_LIBRARY_PATH into GITHUB_ENV, and with it set the scratch dir
      # is not the only way to reach a library — the measurement would still be
      # valid but the leg would stop proving the env-free path.
      #
      # The PASS COUNT is asserted, not the exit code: the probe self-skips when the
      # GdkPixbuf typelib is unavailable, and a skip exits 0.
      - name: An app's OWN GI library loads with no loader env (darwin-${{ matrix.arch }})
        working-directory: packages/node-gi/node-gi
        run: |
          set -euo pipefail
          env -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_LIBRARY_PATH \
            node --test --test-reporter=tap test/gi-library-path-loads.test.mjs | tee /tmp/app-libpath.tap
          grep -qx '# pass 1' /tmp/app-libpath.tap || {
            echo "::error::the app-library-path leg did not PASS 1 test (a SKIP means the gate stopped gating)"
            exit 1
          }
        env:
          NODE_GI_NATIVE: build

      # The display-free conformance subset on Node — the primary proof. Loads the
      # just-built build/Release addon (cross-runtime.mjs defaults NODE_GI_NATIVE to
      # `build`). Same curated list as the Bun/Deno legs (single source of truth).
      - name: Conformance subset on Node (display-free)
        working-directory: packages/node-gi/node-gi
        run: node scripts/cross-runtime.mjs node

      - name: Conformance subset on Bun
        working-directory: packages/node-gi/node-gi
        run: npm run test:bun

      # Deno on macOS: 36/37 are a hard gate. `struct-construct` is a documented,
      # self-healing SOFT-FAIL on deno+darwin ONLY (all 9 assertions pass, then the
      # process aborts on Deno's N-API env teardown — see cross-runtime.mjs). Node,
      # Bun, and Deno-on-Linux run it as a hard gate; the carve-out lifts when the
      # Deno-macOS teardown path is fixed at the engine.
      - name: Conformance subset on Deno
        working-directory: packages/node-gi/node-gi
        run: npm run test:deno

      # Stage the addon prebuild + smoke it via the PREBUILD load path (Deno's only
      # install path — it runs no postinstall build), then upload it so a release
      # can ship prebuilds/darwin-<arch>/. Mirrors the linux legs. NB this is the
      # node-gi ADDON prebuild, NOT the Phase-2 prebuilt-GTK stack.
      #
      # The staging script takes no target argument on purpose — it reads
      # `${process.platform}-${process.arch}` from the running Node, so the leg
      # cannot stage a binary into a directory naming a different machine. That is
      # the mistake the emulated linux legs shipped for weeks (an x86-64 build
      # staged as linux-ppc64), and it is unavailable here by construction.
      - name: Stage darwin-${{ matrix.arch }} prebuild
        working-directory: packages/node-gi/node-gi
        run: node scripts/stage-prebuild.mjs

      - name: Verify the staged prebuild loads (Node)
        working-directory: packages/node-gi/node-gi
        run: node --test test/smoke.test.mjs
        env:
          NODE_GI_NATIVE: prebuild

      - name: Upload darwin-${{ matrix.arch }} prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-prebuild-darwin-${{ matrix.arch }}
          path: packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}/node_gi.node
          if-no-files-found: error

  # Cross-runtime consumer harness (scripts/node-gi-consumer-harness.mjs): the
  # GENERALIZATION of the consumer-sqlite job above into a reusable tool that
  # builds a gjsify package's OWN GJS test suite `--app node` (gi:// →
  # @gjsify/node-gi) and runs it on node + bun + deno. This job runs the PROOF
  # SET under `--require-pass`, so a regression in the reverse bridge fails CI:
  # sqlite=Gda, http2=Soup, zlib=Gio, tls=Gio/glib-networking, ws=Soup,
  # dom-elements=GdkPixbuf(+cairo/Pango via the '2d' factory),
  # node-globals=GLib,
  # crypto=GLib.Checksum/Hmac, string_decoder=pure-TS — the survey's green
  # packages whose system deps fit this minimal container (crypto +
  # string_decoder additionally pin the imports.byteArray seeding and the
  # harness's forced sibling-polyfill closure — survey P3/P4). The remaining
  # green candidates (devtools/devtools-browser/storybook/adwaita-app +
  # os/worker_threads) need the full gtk4/libadwaita/webkitgtk stack resp.
  # procps/sab-native hosts and stay a documented follow-up, like the
  # non-gating full-survey job; the gap report + methodology live in
  # docs/reports/node-gi-consumer-survey.md. Setup mirrors consumer-sqlite;
  # the extra bun+deno legs come free from the harness's PATH-skip.
  consumer-suites:
    name: node-gi consumer harness (proof set / Node+Bun+Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - name: Verify the baked toolchain
        run: |
          # glib-networking = the GIO TLS backend @gjsify/tls runs on;
          # gdk-pixbuf2 = the GdkPixbuf typelib behind @gjsify/dom-elements'
          # Image; pango + dejavu-sans-fonts = PangoCairo text metrics behind
          # dom-elements' '2d' factory (a real font keeps layout sizes
          # deterministic, same rationale as the build-test job's conformance
          # deps).
          #
          # NOT here on purpose: gtk4. @gjsify/canvas2d-core was in this proof
          # set and failed at 201/245 identically on node+bun+deno — a missing
          # `Gdk-4.0` typelib, not a code or display problem. It hard-imported
          # `gi://Gdk?version=4.0` (canvas-pattern.ts, context/pixels.ts,
          # context/drawing.ts) even though the package documents itself as
          # HEADLESS with "NO GTK dependency" — the very property the
          # canvas2d-core / canvas2d split exists to provide.
          #
          # That violation is FIXED (the GDK code moved behind the
          # `@gjsify/canvas2d-core/gdk` side-effect subpath) and is now
          # machine-checked per ADR 0015 — `gjsify.headless` in the package's
          # manifest, enforced by `audit-runtimes --check` against the ROOT
          # entry graph, so it cannot silently come back. status/status.json records the
          # package measuring 578/578 on node+bun+deno. Adding gtk4 here would
          # still drag graphene/vulkan-loader into a 20-minute job, so promoting
          # it into this proof set is a separate cost decision, not a blocked
          # one.
          gjs --version
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"

      # Official nodejs.org build, NOT Fedora's dnf node (which crashes rolldown's
      # prebuilt napi binding). Same rationale as the build-test job.
      # Node 24, not 22. gjsify's `--app node` compile target IS node24, so a
      # node-22 leg runs the bundle BELOW the target it was compiled for, and
      # the consumer survey these members were measured on ran 24.15.0. Node 22
      # returns a plain Blob from `structuredClone(File)` (losing the File brand
      # plus name/lastModified) where 24 returns a real File, which failed
      # @gjsify/node-globals at 216/217 here while the survey recorded 221/221.
      # Eleven other jobs in this workflow already pin '24'.
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Bun + Deno widen the harness from node-only to all three (PATH-skip
      # otherwise drops them). Node-API is their common ABI — same --app node bundle.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build @gjsify/node-gi native addon (node-gyp) + stage prebuild
        working-directory: packages/node-gi/node-gi
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          node scripts/stage-prebuild.mjs   # Deno loads the addon only via the prebuild path

      - name: Install the gjsify workspace (published CLI, Node-free)
        run: |
          B=$(gjs -m install.mjs --fetch-only)
          gjs -m "$B" install --immutable

      # A published @gjsify/cli (npm rolldown) is the BOOTSTRAP bundler: the committed
      # GJS bundle needs the absent @gjsify/rolldown-native, and the published cli
      # ships a prebuilt Node entry. It is NOT the bundler under test. A job that
      # builds with the LAST RELEASE cannot observe a change to the bundler in THIS
      # checkout, and that is not hypothetical: the storybook proof went red on a
      # defect #890 had already fixed in source, and STAYED red, because the published
      # cli carried the pre-fix detector. The bootstrap's only job is to build this
      # checkout's cli; from there on we use that one.
      # Also links @gjsify/node-gi at the workspace root so every package's dist/
      # resolves the reverse-bridge addon at runtime.
      - name: Bootstrap a Node bundler + link node-gi, then switch to this checkout's cli
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          # Prefer the version this checkout declares, but do NOT require it to be
          # on npm yet. The release commit bumps every package.json and only THEN
          # does release.yml publish, so between those two events this step asks
          # npm for a version that provably does not exist — `npm error notarget
          # No matching version found for @gjsify/cli@<v>` — and reddens main on
          # every single release. A recurring, self-resolving red teaches people
          # to ignore the signal. Same guard napi.yml already carries.
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && "${GITHUB_WORKSPACE}/.github/scripts/install-published-cli.sh" "${CLI_VERSION}" )
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          mkdir -p node_modules/@gjsify
          ln -sfn ../../packages/node-gi/node-gi node_modules/@gjsify/node-gi
          echo "Bootstrap bundler: $(node_modules/.bin/gjsify --version)"

          # ...and that is only the BOOTSTRAP. Build THIS checkout's CLI with it, then
          # switch over, so everything below is gated by the source in this PR rather
          # than by the last release.
          PATH="$PWD/node_modules/.bin:$PATH" node_modules/.bin/gjsify run build:infra
          ln -sfn "$PWD/packages/infra/cli/lib/index.js" node_modules/.bin/gjsify
          echo "Node bundler (this checkout): $(node_modules/.bin/gjsify --version)"

      - name: Build proof-set libs under Node (+ workspace deps)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          gjsify workspace @gjsify/unit build:gjsify --with-dependencies
          for p in @gjsify/sqlite @gjsify/http2 @gjsify/zlib \
                   @gjsify/tls @gjsify/ws @gjsify/dom-elements \
                   @gjsify/node-globals \
                   @gjsify/crypto @gjsify/string_decoder; do
            gjsify workspace "$p" build:gjsify --with-dependencies
          done

      - name: Run the node-gi consumer harness (proof set, --require-pass)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/node-gi-consumer-harness.mjs \
            @gjsify/sqlite @gjsify/http2 @gjsify/zlib \
            @gjsify/tls @gjsify/ws @gjsify/dom-elements \
            @gjsify/node-globals \
            @gjsify/crypto @gjsify/string_decoder \
            --runtimes node,bun,deno --require-pass \
            --out /tmp/node-gi-consumer-survey.json

  # macOS Phase 2 — BUILD the batteries-included GTK runtime bundle. Brew-installs
  # the GTK stack as the closure SOURCE (build-time only; NOT shipped), CONSUMES
  # the darwin-<arch> node-gi addon prebuild the `macos` job produced (PR #767),
  # walks its dylib graph + relocates the whole display-free closure to
  # @loader_path (+ ad-hoc re-sign — mandatory on arm64, harmless on Intel), and
  # relocates a COPY of the addon to @rpath so it loads the bundled libgirepository
  # with no Homebrew. Uploads the bundle + the relocated addon for the no-brew
  # conformance job below.
  #
  # A MATRIX, one leg per macOS arch. This job used to be single-arch, and its
  # comment said a second arch "is a second package, not a matrix entry". That was
  # true of the PACKAGE and false of the JOB, and the distinction only became
  # visible once the second package existed: @gjsify/gtk-runtime-darwin-x64 is
  # indeed its own npm package, but it SHARES one parameterised builder
  # (packages/node-gi/scripts/build-gtk-runtime-darwin.mjs) whose target is derived
  # from the running Node, so every path here derives from `matrix.arch` and two
  # copies of a 70-line job would have been the duplication, not the fix.
  # `macos-15-intel` is the Intel runner label (the last x86_64 macOS image Actions
  # offers, through August 2027) — the same label the `macos` job's x64 addon leg
  # uses, so the brew formula list below is already proven on it.
  macos-gtk-runtime:
    name: macOS GTK runtime bundle (build + relocate / darwin-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: macos
    # PER-LEG, NOT PER-MATRIX. `needs:` cannot name a single matrix leg in GitHub
    # Actions, so this job waits on the WHOLE upstream matrix — and a matrix that
    # ends in `failure` skips its dependants outright, as ONE uninstantiated row
    # rather than one row per arch. Measured on the first node-gi nightly, run
    # 31862972834 (2026-08-15): `macos-gtk-runtime` was green on darwin-arm64 and
    # red on darwin-x64 (a GitHub artifact-service timeout, not a node-gi defect),
    # and `macos-gtk-batteries-included` was skipped for BOTH arches, its job name
    # still showing the unexpanded `darwin-${{ matrix.arch }}`. One arch's flake
    # erased the other arch's proof.
    #
    # `!cancelled()` lets each leg run on its own merit and fail, correctly
    # attributed, at its own `download-artifact` step when ITS arch's artifact is
    # genuinely missing. `!= 'skipped'` keeps the `scope` gate: when the OS legs
    # are scoped out upstream, this stays skipped rather than running orphaned.
    #
    # The cost is bounded and paid only on a real double failure: the downloads sit
    # a few cheap steps into the job, so an orphaned leg dies in about a minute of
    # 10x-billed time instead of a 30-minute conformance run. The alternative —
    # splitting the upstream matrices into per-arch jobs so `needs:` can be precise
    # — triples ~100 lines of YAML three times over. This was the smaller change.
    if: ${{ !cancelled() && needs.macos.result != 'skipped' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      # Build-time closure SOURCE only — these libraries are collected + relocated
      # into a self-contained bundle, they are NOT what the conformance job runs on.
      - name: Install GTK4 + GObject-Introspection (Homebrew, build-time closure source)
        run: brew install gtk4 libadwaita gobject-introspection cairo pango gdk-pixbuf graphene pkg-config

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      # Consume the darwin-<arch> addon prebuild the `macos` job staged + uploaded.
      - name: Download node-gi addon prebuild (from the macos job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-darwin-${{ matrix.arch }}
          path: addon

      # Collect + relocate: --out = the platform package's shippable bundle;
      # --addon + --stage = a relocated addon + a SIBLING bundle copy under
      # node-gi's prebuilds/darwin-<arch>/ (the layout the addon's @rpath expects,
      # and the layout the conformance job consumes). The script derives its own
      # target from the running Node and cross-checks --out against the destination
      # package's os/cpu, so an Intel leg cannot populate the arm64 package.
      - name: Build + relocate the GTK runtime bundle
        run: |
          node packages/node-gi/scripts/build-gtk-runtime-darwin.mjs \
            --out packages/node-gi/gtk-runtime-darwin-${{ matrix.arch }}/gtk \
            --addon "$PWD/addon/node_gi.node" \
            --stage packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}

      # The build step is already the hard gate on relocation (build-gtk-runtime-darwin
      # exits non-zero on any surviving reference into the brew prefix, for the dylibs
      # AND the addon). This step is the log-visible echo of that claim — and it derives
      # the prefix rather than hardcoding `/opt/homebrew`, which is the Apple-silicon
      # prefix only: on this job's Intel leg the prefix is /usr/local, so the literal
      # would have matched nothing and "clean" would have meant nothing.
      - name: Report bundle size + relocation sanity
        run: |
          B=packages/node-gi/gtk-runtime-darwin-${{ matrix.arch }}/gtk
          BREW_PREFIX="$(brew --prefix)"
          cat "$B/manifest.json"
          echo "--- bundle size ---"
          du -sh "$B"
          echo "--- assert NO $BREW_PREFIX refs remain in the bundle ---"
          if otool -L "$B"/lib/*.dylib | grep -F "$BREW_PREFIX"; then
            echo "RELOCATION FAILED: bundled dylibs still reference $BREW_PREFIX"; exit 1
          fi
          echo "clean — no Homebrew references"
          echo "--- relocated addon load commands ---"
          otool -l packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}/node_gi.node | grep -A2 LC_RPATH || true

      - name: Upload GTK runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: gtk-runtime-darwin-${{ matrix.arch }}
          path: packages/node-gi/gtk-runtime-darwin-${{ matrix.arch }}/gtk
          if-no-files-found: error

      - name: Upload relocated node-gi addon
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-addon-relocated-darwin-${{ matrix.arch }}
          path: packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}/node_gi.node
          if-no-files-found: error

  # macOS Phase 2 — PROVE batteries-included. This job does NOT `brew install` the
  # GTK runtime at all: it downloads the relocated bundle + addon and runs the
  # display-free conformance against them, so a green run proves node-gi works with
  # ZERO Homebrew/system GTK. Two legs:
  #   • env-free CORE — no DYLD/GI_TYPELIB env at all. The relocated addon loads the
  #     bundled libgirepository via @rpath; node-gi prepends the bundle's typelib
  #     dir itself (prependSearchPath); GLib/GObject/Gio/cairo are in-process via
  #     the addon's link closure. Runs every conformance file whose closure is
  #     exactly those namespaces.
  #   • FULL subset — adds DYLD_FALLBACK_LIBRARY_PATH=<bundle>/lib so the leaf-name
  #     g_module_open lookups for the NON-addon-linked backers (Pango→cairo.test,
  #     Gdk/Graphene→struct-construct) resolve from the bundle. Runs the whole
  #     scripts/cross-runtime.mjs node subset.
  #
  # A MATRIX, one leg per macOS arch, mirroring macos-gtk-runtime. The job never
  # brew-installs GTK, so a green leg IS the proof that the display-free bundle
  # self-satisfies — there is no other GTK on the host to fall back to. (`needs:` cannot
  # be scoped to a single matrix leg in GitHub Actions, so each batteries leg waits for
  # BOTH build legs. This used to say that costs "latency, never correctness"; it was
  # wrong from the day it was written, and the job-level `if:` below is what makes it
  # true — without it, one arch's failure erases the sibling arch's proof entirely.)
  #
  # WHICH ARTIFACT THIS IS, because it is NOT the one npm publishes: the DISPLAY-FREE
  # bundle. `release.yml` ships the `--windowing` superset, so this job is the
  # MINIMAL-CLOSURE check — evidence that the backer-drop filter left a closure the
  # conformance still passes on, and that bundle is what node-gi's own prebuilds stage.
  # The same conformance against the SHIPPED shape runs in macos-gtk-windowing (both
  # arches), and THAT one is authoritative for what a consumer installs. Before this pair
  # was split that way, every conformance leg tested an artifact nobody receives.
  macos-gtk-batteries-included:
    name: macOS batteries-included conformance (no brew GTK / darwin-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: macos-gtk-runtime
    # Per-leg, not per-matrix — see `macos-gtk-runtime` for the run that measured it.
    if: ${{ !cancelled() && needs.macos-gtk-runtime.result != 'skipped' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      # This job never `brew install`s GTK. Hard-fail if the toolkit itself
      # (gtk4/libadwaita — the Gdk backer) is somehow preinstalled, which would
      # muddy the proof. Lower-level deps (pango/cairo/gdk-pixbuf) may be present
      # transitively via unrelated preinstalled formulae (imagemagick/graphviz),
      # but they DON'T interfere: node-gi PREPENDS the bundle's typelib dir, and
      # the explicit DYLD_FALLBACK_LIBRARY_PATH=<bundle>/lib:/usr/lib below removes
      # /usr/local from the search (which is DIRECTLY load-bearing on the Intel leg,
      # where /usr/local IS the Homebrew prefix AND is in dyld's DEFAULT fallback
      # path — on Apple silicon /opt/homebrew/lib is never a leaf-dlopen dir anyway),
      # so the bundle is authoritative regardless. Report them for transparency.
      - name: Assert the GTK toolkit is NOT installed (clean batteries-included host)
        run: |
          echo "--- GTK-related Homebrew formulae present on the runner (informational) ---"
          brew list --formula 2>/dev/null | grep -iE 'gtk|pango|cairo|graphene|gdk|glib|gobject|harfbuzz' || echo "(none)"
          if brew list --formula 2>/dev/null | grep -qE '^(gtk4|libadwaita)$'; then
            echo "gtk4/libadwaita is installed — not a clean batteries-included test"; exit 1
          fi
          echo "clean host — the GTK toolkit was never brew-installed in this job"

      # Stage the bundle + relocated addon in the SIBLING layout node-gi expects
      # (prebuilds/darwin-<arch>/{node_gi.node, gtk/}). The addon's @rpath is
      # @loader_path/gtk/lib, and node-gi's loader finds gtk/ at that prebuilds path.
      - name: Download GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-darwin-${{ matrix.arch }}
          path: packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}/gtk

      - name: Download relocated node-gi addon
        uses: actions/download-artifact@v4
        with:
          name: node-gi-addon-relocated-darwin-${{ matrix.arch }}
          path: packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}

      - name: Verify staged layout
        working-directory: packages/node-gi/node-gi
        env:
          TAG: darwin-${{ matrix.arch }}
        run: |
          ls -la "prebuilds/$TAG"
          echo "--- bundle manifest (target must match this leg) ---"; cat "prebuilds/$TAG/gtk/manifest.json" | head -8
          echo "--- dylibs ---"; ls "prebuilds/$TAG/gtk/lib" | head
          echo "--- typelibs ---"; ls "prebuilds/$TAG/gtk/girepository-1.0" | head
          echo "--- addon deps (should be @rpath, no Homebrew prefix) ---"
          otool -L "prebuilds/$TAG/node_gi.node" | head -20
          # The bundle carries its own derived target stamp; assert it is THIS leg's.
          # An artifact-name mixup would otherwise run the arm64 closure on Intel and
          # fail as an inscrutable dlopen error four steps later.
          node -e '
            const m = require(`./prebuilds/${process.env.TAG}/gtk/manifest.json`);
            const want = `darwin-${process.arch}`;
            if (m.platform !== want) {
              console.error(`bundle manifest says ${m.platform}, this runner is ${want}`);
              process.exit(1);
            }
            console.log(`bundle target ${m.platform} matches the runner`);
          '

      # Fast probe FIRST — one clean process, NO library-lookup env. Reproduces the
      # exact paths that need a leaf-soname g_module_open against the bundle
      # (registerClass subclassing + Pango/Graphene/Gdk get_type). node-gi's
      # DYLD_FALLBACK re-exec (gtk-runtime.js) is what makes this resolve env-free;
      # a failure here is an unambiguous signal, isolated from the test runner.
      - name: Batteries-included probe — env-free, no brew GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/check-batteries.mjs

      # Leg 1 — CORE (35 files), env-free: no DYLD/GI_TYPELIB set by the job.
      # cross-runtime.mjs re-execs ITSELF once with the bundle's DYLD fallback set
      # (dyld reads it at launch), so its per-file children inherit it — no brew
      # GTK, nothing but the bundle on disk. `--only` drops the two files whose
      # backers are NOT addon-linked (cairo→PangoCairo, struct-construct→Gdk/Graphene).
      - name: Conformance CORE — env-free, no brew GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: |
          node scripts/cross-runtime.mjs node --only \
            arrays,boxed-out,async-error,bytes,cairo-canvas2d,call-function,callbacks,closure-exception,construct-camelcase,dbus-async,enums-constants,gclosure-in-args,gettext,gi,globals,gobject,gtype,int64,methods,multilevel-subclass,out-params,paramspec,paramspec-object,proxy-fallback,register-class,register-class-decorator,register-class-props,registerclass-inplace,signals,smoke,static-camel,system,variant,vfunc,vfunc-chainup

      # Leg 2 — FULL display-free subset (37 files), also env-free (NO DYLD set by
      # the job). The same one-shot re-exec covers the NON-addon-linked backers
      # (Pango→cairo.test, Gdk/Graphene→struct-construct) from the bundle.
      - name: Conformance FULL subset — env-free, no brew GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/cross-runtime.mjs node

  # Build the WINDOWING superset darwin bundle — the display-free macos-gtk-runtime
  # bundle omits libadwaita (conformance never touches Adwaita), so a real
  # `new Adw.Application()` fails on it with "Failed to load shared library
  # 'libadwaita-1.0.dylib'". This variant passes `--windowing` so the shared darwin
  # builder seeds libadwaita into the relocated closure. Mirrors windows-gtk-windowing-runtime;
  # feeds macos-gtk-windowing below, which runs BOTH the batteries-included conformance
  # and the GUI proof on it — this is the artifact `release.yml` publishes.
  #
  # A MATRIX over BOTH macOS arches, and that is not a cost decision but a coverage
  # one: `release.yml` publishes the `--windowing` SUPERSET for darwin-x64 AND
  # darwin-arm64, so the bundle an Intel Mac installs is EXACTLY what this pair builds.
  # It was arm64-only, which left the shipped x64 artifact built by the release and
  # exercised by nothing — the missing-signal shape this whole change exists to remove.
  # The display-free pair's x64 leg does NOT cover it: it consumes a different artifact
  # (no libadwaita, no libgtksourceview, no data tree), so a defect in the superset's
  # extra closure or its data is invisible there. The gdk-pixbuf image LOADERS were the
  # last KNOWN gap here, shared by both arches: the bundle shipped 715 Adwaita SVGs with
  # no decoder for any of them, so `Pixbuf.new_from_file()` on its OWN icon returned NULL
  # on the published darwin-x64 0.28.0. The builder bundles + relocates them (§ 2b) and
  # its data gate requires them on BOTH platforms now; the step below is the
  # artifact-level echo of that claim.
  # `macos-15-intel` is the Intel runner label, the same one macos-gtk-runtime's x64 leg
  # already uses with this formula list.
  macos-gtk-windowing-runtime:
    name: macOS windowing GTK runtime bundle (build + relocate / darwin-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: macos
    # Per-leg, not per-matrix — see `macos-gtk-runtime` for the run that measured it.
    if: ${{ !cancelled() && needs.macos.result != 'skipped' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Install GTK4 + Adwaita + GtkSource + icons + GObject-Introspection (build-time closure source)
        run: brew install gtk4 libadwaita gtksourceview5 adwaita-icon-theme gobject-introspection cairo pango gdk-pixbuf graphene pkg-config gstreamer

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download node-gi addon prebuild (from the macos job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-darwin-${{ matrix.arch }}
          path: addon

      # --windowing adds libadwaita + libgtksourceview (+ their otool deps) to the
      # relocated closure, and the runtime data tree. The builder derives its own target
      # from the running Node and cross-checks --out against the destination package's
      # os/cpu, so an Intel leg cannot populate the arm64 package.
      - name: Build + relocate the WINDOWING GTK runtime bundle
        run: |
          node packages/node-gi/scripts/build-gtk-runtime-darwin.mjs \
            --windowing \
            --out packages/node-gi/gtk-runtime-darwin-${{ matrix.arch }}/gtk \
            --addon "$PWD/addon/node_gi.node" \
            --stage packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}

      # The builder is already the hard gate on all of this (typelib/library symmetry,
      # the no-symlink rule, and — new — every DECLARED windowing data set, which now
      # FAILS the build instead of warning). These lines are the log-visible echo of the
      # claim on the ARTIFACT, and they assert bytes rather than directories: a
      # `test -d share/icons` passes on a link to the build host's Cellar, which is how
      # 0.2 MiB of links once looked like a 22 MB icon theme.
      - name: Report bundle + assert libadwaita + GtkSource + the data tree are present
        run: |
          B=packages/node-gi/gtk-runtime-darwin-${{ matrix.arch }}/gtk
          cat "$B/manifest.json"
          echo "--- bundle size ---"; du -sh "$B"
          echo "--- assert libadwaita relocated into the bundle ---"
          ls "$B"/lib | grep -i adwaita || { echo "libadwaita MISSING from the windowing bundle"; exit 1; }
          echo "--- assert libgtksourceview dylib + GtkSource-5 typelib are bundled ---"
          ls "$B"/lib | grep -i gtksourceview || { echo "libgtksourceview MISSING from the windowing bundle"; exit 1; }
          ls "$B"/girepository-1.0 | grep -i 'GtkSource-5.typelib' || { echo "GtkSource-5.typelib MISSING from the windowing bundle"; exit 1; }
          echo "--- assert WINDOWING DATA: schemas + an icon theme + GtkSource's data tree ---"
          test -s "$B/share/glib-2.0/schemas/gschemas.compiled" || { echo "gschemas.compiled MISSING/EMPTY — Gio.Settings would fail on macOS"; exit 1; }
          ls "$B"/share/icons/*/index.theme >/dev/null 2>&1 || { echo "no icon theme with an index.theme — icon lookups fail silently"; exit 1; }
          test -n "$(find "$B/share/gtksourceview-5" -type f -size +0 2>/dev/null | head -1)" || { echo "GtkSource-5 data tree MISSING/EMPTY"; exit 1; }
          echo "--- icon themes + data size ---"; ls "$B/share/icons"; du -sh "$B/share"
          # The DECODERS for those icons. An icon theme without them is bytes nothing in
          # the bundle can read, and the failure is a NULL pixbuf with no diagnostic.
          echo "--- assert the gdk-pixbuf loaders + their cache ---"
          test -s "$B/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache" || { echo "loaders.cache MISSING/EMPTY — no image decodes"; exit 1; }
          test -n "$(find "$B/lib/gdk-pixbuf-2.0/2.10.0/loaders" -type f -size +0 2>/dev/null | head -1)" || { echo "no gdk-pixbuf loader modules bundled"; exit 1; }
          # Anchored on the MODULE SUFFIX, not on a leading `"/`: a cache also holds quoted
          # SIGNATURE lines and XPM's is literally `"/*" "" 50`, which a naive absolute-path
          # test reads as a path. brew's gdk-pixbuf is non-relocatable (no
          # GDK_PIXBUF_MODULEDIR support at all — measured), so it passes these to
          # g_module_open verbatim: an absolute path resolves on the runner only, and a bare
          # leaf resolves nowhere. `@loader_path` is what dyld expands against the bundle's
          # own lib/. The builder fails on this too; this is the echo on the ARTIFACT.
          if grep -qE '^"/[^"]*\.(so|dylib)"$' "$B/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"; then
            echo "loaders.cache carries ABSOLUTE module paths — it would resolve on the build host only"; exit 1
          fi
          grep -qE '^"@loader_path/[^"]*\.(so|dylib)"$' "$B/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache" || { echo "loaders.cache module paths are not @loader_path-relative — dlopen would not find them off the build host"; exit 1; }
          echo "loaders: $(find "$B/lib/gdk-pixbuf-2.0/2.10.0/loaders" -type f | wc -l | tr -d ' ') module(s), cache @loader_path-relative"
          # Prefix-DERIVED, not the literal /opt/homebrew — see macos-gtk-runtime's
          # note: the literal is vacuously absent on an Intel host. The loaders are
          # INCLUDED: they are relocated with a ../../.. prefix, a harder rewrite than
          # the flat lib/ one, and a `lib/*.dylib` glob does not reach their nested dir.
          BREW_PREFIX="$(brew --prefix)"
          echo "--- assert NO $BREW_PREFIX refs remain ---"
          if otool -L "$B"/lib/*.dylib "$B"/lib/gdk-pixbuf-2.0/2.10.0/loaders/* | grep -F "$BREW_PREFIX"; then
            echo "RELOCATION FAILED: bundled images still reference $BREW_PREFIX"; exit 1
          fi
          echo "clean — no Homebrew references"

      - name: Upload windowing GTK runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: gtk-runtime-darwin-${{ matrix.arch }}-windowing
          path: packages/node-gi/gtk-runtime-darwin-${{ matrix.arch }}/gtk
          # error, not the default warn: an empty upload here would hand the consumer
          # job a downloadable-but-empty artifact and fail four steps later as an
          # inscrutable dlopen error.
          if-no-files-found: error

      - name: Upload relocated node-gi addon (windowing)
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-addon-relocated-darwin-${{ matrix.arch }}-windowing
          path: packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}/node_gi.node
          if-no-files-found: error

  # macOS proof ON THE SHAPE THAT SHIPS — the darwin counterpart of
  # windows-gtk-windowing, and a MATRIX over both arches for the same reason its build
  # job is one: `release.yml` publishes this variant for darwin-x64 and darwin-arm64.
  #
  # It carries TWO claims, and the split matters:
  #   • the CONFORMANCE (`check-batteries.mjs` + the full display-free subset) on the
  #     PUBLISHED bundle. This is the authoritative one for the npm packages:
  #     macos-gtk-batteries-included runs the same conformance against the DISPLAY-FREE
  #     bundle, which is a different artifact (no libadwaita, no libgtksourceview, no
  #     data tree, two typelibs fewer), so a green run there proved the shipped bundle
  #     nothing. Both now run: this job is authoritative for "what a consumer installs
  #     works", the display-free pair is the MINIMAL-CLOSURE check (the drop filter left
  #     a closure the conformance still passes on, and that bundle is what node-gi's own
  #     prebuilds stage).
  #   • the GUI RENDER proof (windowing + windowing-interactive + widgets) — the same
  #     render-to-texture tests the Windows windowing job runs. The tests treat darwin
  #     like win32 (implicit display — no DISPLAY needed; the GdkMacos backend supplies
  #     it), so a real Adw.ApplicationWindow realizes + renders via the GSK renderer and
  #     a WidgetPaintable snapshot rasterises to a PNG — headless, no visible desktop.
  #     GSK_RENDERER=cairo forces software rendering (no GPU guarantee on the runner).
  #
  # node-gi's DYLD_FALLBACK re-exec (gtk-runtime.js) makes the bundle authoritative
  # env-free; NODE_GI_NATIVE=prebuild loads the relocated addon. Same clean-host
  # discipline as macos-gtk-batteries-included: no brew GTK, so the bundle is the only
  # GTK on the machine.
  macos-gtk-windowing:
    name: macOS windowing proof (no brew GTK / darwin-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: macos-gtk-windowing-runtime
    # Per-leg, not per-matrix — see `macos-gtk-runtime` for the run that measured it.
    if: ${{ !cancelled() && needs.macos-gtk-windowing-runtime.result != 'skipped' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      # Never brew-installs GTK — the batteries-included bundle must be the ONLY GTK.
      - name: Assert the GTK toolkit is NOT installed (clean batteries-included host)
        run: |
          echo "--- GTK-related Homebrew formulae present (informational) ---"
          brew list --formula 2>/dev/null | grep -iE 'gtk|pango|cairo|graphene|gdk|glib|gobject|harfbuzz' || echo "(none)"
          if brew list --formula 2>/dev/null | grep -qE '^(gtk4|libadwaita)$'; then
            echo "gtk4/libadwaita is installed — not a clean batteries-included test"; exit 1
          fi
          echo "clean host — the GTK toolkit was never brew-installed in this job"

      # Stage the WINDOWING bundle + relocated addon in the sibling layout node-gi's
      # loader expects (prebuilds/darwin-<arch>/{node_gi.node, gtk/}); the addon's
      # @rpath is @loader_path/gtk/lib. From macos-gtk-windowing-runtime (libadwaita
      # included), NOT the display-free macos-gtk-runtime bundle.
      - name: Download WINDOWING GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-darwin-${{ matrix.arch }}-windowing
          path: packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}/gtk

      - name: Download relocated node-gi addon (windowing)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-addon-relocated-darwin-${{ matrix.arch }}-windowing
          path: packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}

      - name: Verify staged layout
        working-directory: packages/node-gi/node-gi
        env:
          TAG: darwin-${{ matrix.arch }}
        run: |
          ls -la "prebuilds/$TAG"
          echo "--- dylibs ---"; ls "prebuilds/$TAG/gtk/lib" | head
          echo "--- typelibs ---"; ls "prebuilds/$TAG/gtk/girepository-1.0" | head
          # Two arches × two variants now share this artifact namespace, so assert the
          # bundle's OWN derived stamp is this leg's and that it is the published shape.
          # A name mixup would otherwise run the arm64 closure on Intel and surface four
          # steps later as an inscrutable dlopen error.
          node -e '
            const m = require(`./prebuilds/${process.env.TAG}/gtk/manifest.json`);
            const want = `darwin-${process.arch}`;
            if (m.platform !== want) {
              console.error(`bundle manifest says ${m.platform}, this runner is ${want}`);
              process.exit(1);
            }
            if (m.windowing !== true || !(m.dataBytes > 0)) {
              console.error(`not the published shape: windowing=${m.windowing} dataBytes=${m.dataBytes}`);
              process.exit(1);
            }
            console.log(`${m.platform} windowing superset, ${m.dataBytes} bytes of runtime data`);
          '

      # Claim 1a — the same fast probe macos-gtk-batteries-included runs, here against
      # the PUBLISHED bundle: one clean process, NO library-lookup env, reproducing the
      # leaf-soname g_module_open paths (registerClass subclassing + Pango/Graphene/Gdk
      # get_type). A failure is unambiguous and isolated from the test runner.
      - name: Batteries-included probe on the PUBLISHED bundle — env-free (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/check-batteries.mjs

      # Claim 1b — the full display-free conformance subset on the PUBLISHED bundle. No
      # CORE/FULL split is needed: cross-runtime.mjs re-execs itself once with the
      # bundle's DYLD fallback, which covers the non-addon-linked backers too.
      - name: Conformance subset on the PUBLISHED bundle — env-free (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/cross-runtime.mjs node

      # Claim 2 — the GUI proof: a real Adw.ApplicationWindow realizes + renders a
      # surface via the GSK renderer, reacts to a Gio action + Gtk.Button::clicked
      # (interactive, headless), and widgets.test.mjs rasterises an Adwaita
      # widget-breadth surface to a GSK PNG — all on the batteries-included bundle.
      - name: Windowing proof — Adw window realizes, renders, reacts + widget breadth (no brew GTK)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
          GSK_RENDERER: cairo
        run: node --test test/windowing.test.mjs test/windowing-interactive.test.mjs test/widgets.test.mjs

      # Composite templates — the proof that was missing on BOTH displayless
      # platforms. All four gtk-template tests gated on DISPLAY/WAYLAND_DISPLAY,
      # variables GdkWin32 and GdkQuartz never set, so they had never run off
      # Linux. Windows meanwhile shipped `GetGtkTemplateApi()` as an
      # `#ifdef _WIN32` stub, and a user found it before CI did: `gjsify showcase
      # three-geometry-teapot --runtime node` on Windows 11 died with "the
      # libgtk-4 template API is unavailable" on a machine with working GTK 4.
      # Running them here is what turns "templates work on this platform" from a
      # claim into a check.
      - name: Template proof — composite templates resolve, install and bind children
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
          GSK_RENDERER: cairo
        run: node --test test/gtk-template.test.mjs test/gtk-template-callbacks.test.mjs test/gtk-template-custom-child-ctor.test.mjs test/gtk-template-signals.test.mjs

      # AUDIO, the counterpart to the windowing proof above. Everything else about
      # the GStreamer payload is checkable by counting files — and counting files is
      # what missed the defect: a bundle shipped both Gst typelibs and ZERO plugins
      # with every gate green. This asks the registry for the elements the decode
      # path is made of, which covers the payload AND the env wiring around it.
      - name: Audio proof — the GStreamer elements resolve on the bundle
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node --test test/gst-elements.test.mjs

  # ── #1354 M2b: a `.app` that RUNS on a Mac carrying neither Node nor GTK ─────
  #
  # The pair below is the two halves of ADR 0024 § A2 pointed at one artifact:
  # phase 1 assembles the bundle where the toolchain is (Linux), phase 2 runs it
  # on the OS it was assembled FOR. Splitting it that way is not a convenience —
  # it is the claim. A leg that built the app on the same Mac that runs it would
  # prove the Mac has a working GTK, which is the opposite of what is wanted.
  #
  # Modelled on `macos-gtk-batteries-included` / `macos-gtk-windowing` above, and
  # it takes their discipline literally: ASSERT THE TOOLKIT IS ABSENT FIRST. Those
  # jobs hard-fail when `brew list --formula` shows gtk4 or libadwaita, because
  # without that the leg proves the runner had GTK. This one adds the second
  # absence the milestone is actually about — a Node on `PATH` — for the same
  # reason: macOS ships none, the GitHub runner image does, and a launcher that
  # execs the bare name `node` would pass on the runner and fail on every Mac a
  # stranger downloads it to.
  macos-app-assemble:
    name: Assemble a self-contained macOS .app (Linux / darwin-${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: macos-gtk-windowing-runtime
    if: ${{ !cancelled() && needs.macos-gtk-windowing-runtime.result != 'skipped' }}
    timeout-minutes: 45
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x64
    steps:
      # Official nodejs.org build, NOT Fedora's dnf node (which crashes rolldown's
      # prebuilt napi binding). Same rationale as `build-test` and `consumer-suites`.
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the gjsify workspace (published CLI, Node-free)
        run: |
          B=$(gjs -m install.mjs --fetch-only)
          gjs -m "$B" install --immutable

      # The bootstrap recipe `consumer-suites` uses, for the reason it states: a job
      # that builds with the LAST RELEASE cannot observe a change to the bundler in
      # THIS checkout, and this milestone lives entirely in this checkout's CLI.
      - name: Bootstrap a Node bundler + link node-gi, then switch to this checkout's cli
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && "${GITHUB_WORKSPACE}/.github/scripts/install-published-cli.sh" "${CLI_VERSION}" )
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          mkdir -p node_modules/@gjsify
          ln -sfn ../../packages/node-gi/node-gi node_modules/@gjsify/node-gi
          PATH="$PWD/node_modules/.bin:$PATH" node_modules/.bin/gjsify run build:infra
          ln -sfn "$PWD/packages/infra/cli/lib/index.js" node_modules/.bin/gjsify
          echo "Node bundler (this checkout): $(node_modules/.bin/gjsify --version)"

      # The SIBLING layout `resolveGtkRuntimeBundle()` walks — candidate 2 of its
      # four, and the one `gjsify ship` resolves through here. Downloading the
      # bundle and the addon into node-gi's own `prebuilds/darwin-<arch>/` is
      # exactly what `macos-gtk-batteries-included` and `macos-gtk-windowing` do
      # before a conformance run, so a job prepared for one is prepared for this.
      - name: Download WINDOWING GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-darwin-${{ matrix.arch }}-windowing
          path: packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}/gtk

      - name: Download relocated node-gi addon (windowing)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-addon-relocated-darwin-${{ matrix.arch }}-windowing
          path: packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}

      # The interpreter. A DOWNLOAD rather than a build, which is why all three
      # `@gjsify/node-runtime-*` targets ride one Linux job in `release.yml` — the
      # script verifies the release's own SHA-256 and copies Node's LICENSE beside
      # the binary. `gjsify ship` resolves the package BY NAME from here.
      - name: Fetch the bundled Node interpreter for darwin-${{ matrix.arch }}
        run: |
          node packages/node-runtime/scripts/fetch-node-runtime.mjs \
            --target darwin-${{ matrix.arch }} \
            --out packages/node-runtime/node-runtime-darwin-${{ matrix.arch }}/bin
          mkdir -p node_modules/@gjsify
          ln -sfn ../../packages/node-runtime/node-runtime-darwin-${{ matrix.arch }} \
            node_modules/@gjsify/node-runtime-darwin-${{ matrix.arch }}

      # `--arch` names the architecture the PAYLOAD was built for and cross-compiles
      # nothing; it is also what selects the closure, so a `darwin-arm64` bundle can
      # only be assembled with `--arch arm64`. `assertPayloadMatchesArch` reads the
      # staged tree back and refuses a Mach-O whose `cputype` disagrees.
      - name: Assemble the .app + zip
        working-directory: tests/e2e/ship-macos/fixtures/window-app
        run: |
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:$PATH"
          gjsify ship darwin --arch ${{ matrix.arch }}
          echo "--- what the bundle carries ---"
          find "ship/out/Ship Window Demo.app/Contents/Frameworks" -maxdepth 5 -type d | head -20
          du -sh "ship/out/Ship Window Demo.app"

      # The launcher, quoted into the log. It is 20 lines and it is the interface
      # between everything above and everything the next job runs, so a reader who
      # is diagnosing that job should not have to unzip an artifact to see it.
      - name: Show the launcher, and assert it names no DYLD variable
        working-directory: tests/e2e/ship-macos/fixtures/window-app
        run: |
          cat "ship/out/Ship Window Demo.app/Contents/MacOS/ship-window-demo"
          if grep -q 'DYLD_' "ship/out/Ship Window Demo.app/Contents/MacOS/ship-window-demo"; then
            echo "the launcher names a DYLD_ variable — it works unsigned and breaks at signing (ADR 0024 A4/A16)"
            exit 1
          fi
          test -x "ship/out/Ship Window Demo.app/Contents/MacOS/node" || {
            echo "the bundle carries no interpreter — the next job would exec the runner's node"; exit 1
          }

      - name: Upload the assembled .app zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-selfcontained-darwin-${{ matrix.arch }}
          path: tests/e2e/ship-macos/fixtures/window-app/ship/out/*.zip
          # error, not warn: an empty upload hands the next job a downloadable
          # nothing and fails there as a missing file rather than here as a
          # missing artifact.
          if-no-files-found: error

  # THE HALF THAT EARNS THE MILESTONE. Everything before this runs on Linux and is
  # a claim about our WIRING; this one unzips the artifact on a Mac that has no
  # Homebrew GTK and no Node on `PATH`, and opens a window with it.
  macos-app-selfcontained:
    name: Self-contained .app opens a window (no brew GTK, no node / darwin-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: macos-app-assemble
    if: ${{ !cancelled() && needs.macos-app-assemble.result != 'skipped' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      # NO `actions/setup-node`, and NO checkout. This job runs a downloaded
      # artifact and nothing else — the shape a stranger is in.
      - name: Assert the GTK toolkit is NOT installed (clean batteries-included host)
        run: |
          echo "--- GTK-related Homebrew formulae present (informational) ---"
          brew list --formula 2>/dev/null | grep -iE 'gtk|pango|cairo|graphene|gdk|glib|gobject|harfbuzz' || echo "(none)"
          if brew list --formula 2>/dev/null | grep -qE '^(gtk4|libadwaita)$'; then
            echo "gtk4/libadwaita is installed — not a clean batteries-included test"; exit 1
          fi
          echo "clean host — the GTK toolkit was never brew-installed in this job"

      - name: Download the assembled .app zip
        uses: actions/download-artifact@v4
        with:
          name: macos-app-selfcontained-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/app

      # Unzipped OUTSIDE any checkout, because a `.app` beside a repository can
      # resolve things a downloaded one cannot: `require('@gjsify/node-gi/gi')`
      # walks `node_modules` UPWARD from the bundle, so a bundle sitting under a
      # tree that has one is not the artifact a user receives.
      - name: Unzip the bundle
        working-directory: ${{ runner.temp }}/app
        run: |
          unzip -q ./*.zip
          # Nothing here sets the quarantine bit (this is a direct download, not a
          # browser one), but stripping it costs nothing and removes one difference
          # between this run and a user's.
          xattr -dr com.apple.quarantine "Ship Window Demo.app" 2>/dev/null || true
          ls -la "Ship Window Demo.app/Contents/MacOS"
          echo "--- the launcher, as assembled on Linux ---"
          cat "Ship Window Demo.app/Contents/MacOS/ship-window-demo"

      # THE OTHER ABSENCE, and the reason this job is worth anything. The runner
      # image ships a Node; a launcher execing the bare name would pass here and
      # fail on every Mac that has none. Stripping `PATH` down to the four system
      # directories is what makes the run measure the bundle rather than the image.
      - name: Assert there is NO node on PATH once PATH is the system one
        run: |
          if PATH=/usr/bin:/bin:/usr/sbin:/sbin command -v node; then
            echo "a system node exists at that path — this leg cannot prove the bundle carries one"; exit 1
          fi
          echo "no node on the system PATH — whatever runs must come from inside the .app"

      # The run. Every loader variable unset, `PATH` reduced to the system one, no
      # Homebrew GTK on the machine: what the app finds, it brought.
      - name: Open a window from the unzipped .app
        working-directory: ${{ runner.temp }}/app
        env:
          GSK_RENDERER: cairo
        run: |
          set -o pipefail
          env -u DYLD_FALLBACK_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u GI_TYPELIB_PATH \
              -u GJSIFY_GTK_RUNTIME -u NODE_GI_NATIVE -u GJSIFY_GI_LIBRARY_PATH \
              -u XDG_DATA_DIRS -u GSETTINGS_SCHEMA_DIR -u NODE_PATH \
              PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              "./Ship Window Demo.app/Contents/MacOS/ship-window-demo" 2>&1 | tee run.log

      # Read back what it printed, line by line, because an exit code of 0 is also
      # what an app that never activated returns.
      - name: Assert what the run proved
        working-directory: ${{ runner.temp }}/app
        run: |
          # Matched by the BUNDLE-RELATIVE suffix, not by an absolute path. The
          # launcher computes `$here` logically (`cd … && pwd`) while
          # `process.execPath` is `uv_exepath`, which realpath()s — so an absolute
          # comparison is a bet on no component of the runner's temp directory
          # being a symlink, and `/var` → `/private/var` is exactly that bet lost
          # on macOS. The claim is "the interpreter is inside THIS bundle", and
          # the suffix says it.
          grep -q '^interpreter: .*/Ship Window Demo\.app/Contents/MacOS/node$' run.log || {
            echo "the app did not run under the interpreter the bundle carries:"; grep '^interpreter:' run.log; exit 1
          }
          # The launcher exported the locator, and it points inside the bundle.
          grep -qE '^gtk-runtime: .*/Ship Window Demo\.app/Contents/Frameworks/node-gi/prebuilds/darwin-[a-z0-9]+/gtk$' run.log || {
            echo "GJSIFY_GTK_RUNTIME was not exported into the bundle:"; grep '^gtk-runtime:' run.log; exit 1
          }
          # The Adwaita tree built and wired through the engine.
          grep -q '^chrome: ok$' run.log || { echo "the Adwaita widget tree is incomplete:"; grep '^chrome:' run.log; exit 1; }
          # And a real GdkSurface was allocated and a GSK render tree rasterised.
          # macOS supplies the display through the quartz backend, so unlike Linux
          # there is no surface-less branch to excuse here.
          grep -qE '^render: [0-9]+x[0-9]+ [0-9]+$' run.log || {
            echo "the window did not realize + render:"; grep '^render:' run.log; exit 1
          }
          grep -q '^done: 0$' run.log || { echo "app.run() returned non-zero:"; grep '^done:' run.log; exit 1; }
          echo "a downloaded .app opened and rendered a window on a Mac with no Homebrew GTK and no node on PATH"

  # Windows proof (Phase 1 — the reverse bridge BUILDS + RUNS on windows-latest).
  # The whole team is Linux-only, so a windows-latest runner is the only way to
  # validate. Sibling of the macOS proof (its `macos` job above is the template).
  #
  # TOOLCHAIN — MSVC + gvsbuild (NOT MSYS2/mingw). node-gyp defaults to MSVC, and
  # stock Node/Bun/Deno on Windows are MSVC-ABI, so the addon AND the GTK/GLib it
  # links must be MSVC-ABI too — a mingw GTK + MSVC addon is an ABI hazard and a
  # mingw-built .node does not load into stock MSVC-ABI Node (the ABI wall). gvsbuild
  # publishes a prebuilt MSVC-ABI GTK4 bundle (GLib 2.88, girepository-2.0, built
  # with --enable-gi) that loads into stock Node. We build the N-API addon FROM
  # SOURCE (node-gyp/MSVC + pkg-config via scripts/win-gi-gyp-flags.mjs) and run the
  # DISPLAY-FREE conformance subset on Node — the exact set scripts/cross-runtime.mjs
  # curates. The GTK-window / GLArea / cairo-drawfunc / adw-smoke DISPLAY tests are
  # NOT run here (GTK-on-Windows is the win32 backend and needs its own display
  # wiring — Phase 2, which also ships a prebuilt GTK stack so consumers need no
  # gvsbuild). The win32-x64 addon prebuild IS staged + uploaded here, mirroring the
  # arm64 + macos jobs; a future prebuilt-GTK upload slots in beside it.
  windows:
    name: Windows build + conformance (Node / windows-latest x64)
    needs: scope
    if: ${{ needs.scope.outputs.engine == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GVSBUILD_VERSION: '2026.6.0'
      # Extract to gvsbuild's canonical build prefix so its .pc files' baked
      # absolute `prefix=` is correct with no relocation needed.
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 builds the addon (node-gyp) and runs the authoritative Node leg —
      # same version the macOS proof pins.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache gvsbuild GTK4 bundle
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk\x64\release
          key: gvsbuild-gtk4-${{ env.GVSBUILD_VERSION }}-x64-v1

      - name: Download + extract gvsbuild GTK4 (MSVC-ABI, girepository-2.0)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          # tar.exe (bsdtar) extracts zip; the zip holds the CONTENTS of release\
          # (bin/ lib/ include/ share/ …) at its root.
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      - name: Put GTK on PATH + set GI/PKG env
        shell: pwsh
        run: |
          # GTK bin/ carries the DLLs the addon links (glib/gobject/gio/girepository/
          # cairo/ffi/intl) AND pkgconf.exe + pkg-config.exe (gvsbuild bundles them).
          "$env:GTK_PREFIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=$env:GTK_PREFIX\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The typelib DIRECTORY is historically named girepository-1.0 even for
          # the girepository-2.0 API.
          "GI_TYPELIB_PATH=$env:GTK_PREFIX\lib\girepository-1.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GSETTINGS_SCHEMA_DIR=$env:GTK_PREFIX\share\glib-2.0\schemas" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # gvsbuild's libffi meson build ships ffi.lib + the DLL but NOT ffi.h/
      # ffitarget.h (its meson.build has `install: true` on the library() but no
      # install_headers()), yet GLib's girffi.h — which gvsbuild DOES install —
      # does `#include <ffi.h>`, so the addon won't compile (C1083). Supply the two
      # headers from vcpkg's libffi (preinstalled vcpkg; MSVC-native x64 headers).
      # libffi's public ABI (ffi_type/ffi_cif/ffi_closure) is frozen across 3.x, so
      # the vcpkg header + gvsbuild's 3.5.2 ffi.lib are compatible.
      - name: Supply libffi headers (gvsbuild omits ffi.h)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libffi:x64-windows
          $inc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          Copy-Item "$inc\ffi.h","$inc\ffitarget.h" -Destination "$env:GTK_PREFIX\include" -Force
          Write-Host "ffi.h -> $env:GTK_PREFIX\include (from vcpkg libffi)"

      - name: Verify pkg-config + girepository-2.0 (diagnostics)
        shell: pwsh
        run: |
          Write-Host "pkg-config: $((Get-Command pkg-config).Source)"
          pkg-config --version
          # `--exists` signals via exit code, not stdout — check $LASTEXITCODE (a
          # bare `if (pkg-config ...)` tests stdout and false-reports MISSING).
          pkg-config --define-prefix --exists girepository-2.0
          if ($LASTEXITCODE -eq 0) {
            Write-Host "girepository-2.0: $(pkg-config --define-prefix --modversion girepository-2.0)"
          } else {
            Write-Host "girepository-2.0: MISSING — the addon build will fail"
          }
          Write-Host "cflags : $(pkg-config --define-prefix --cflags girepository-2.0 cairo)"
          Write-Host "cflags(static) : $(pkg-config --define-prefix --static --cflags-only-I girepository-2.0 cairo 2>&1)"
          Write-Host "--- typelibs present ---"
          Get-ChildItem "$env:GTK_PREFIX\lib\girepository-1.0" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'GLib|GObject|Gio|Pango|GdkPixbuf|Graphene|cairo' } |
            Select-Object -ExpandProperty Name
          Write-Host "--- helper: include_dirs ---"
          node packages/node-gi/node-gi/scripts/win-gi-gyp-flags.mjs --includes
          Write-Host "`n--- helper: libraries ---"
          node packages/node-gi/node-gi/scripts/win-gi-gyp-flags.mjs --libs

      # From source: node-gyp reads binding.gyp's OS=="win" branch (the helper feeds
      # cl.exe include dirs + link.exe .lib paths) → win32-x64 build/Release/
      # node_gi.node. The package's `install` script IS node-gyp rebuild.
      - name: Build native addon (node-gyp / MSVC)
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      # The display-free conformance subset on Node — the primary proof. Loads the
      # just-built build/Release addon (cross-runtime.mjs defaults NODE_GI_NATIVE to
      # `build`). Same curated list the macOS/Bun/Deno legs use (single source).
      - name: Conformance subset on Node (display-free)
        working-directory: packages/node-gi/node-gi
        run: node scripts/cross-runtime.mjs node

      # Stage the win32-x64 addon prebuild + smoke it via the PREBUILD load path,
      # then upload it so a release can ship prebuilds/win32-x64/ (the loader already
      # expects that path). Mirrors the arm64 + macos jobs. NB this is the node-gi
      # ADDON prebuild, NOT a Phase-2 prebuilt-GTK stack.
      - name: Stage win32-x64 prebuild
        working-directory: packages/node-gi/node-gi
        run: node scripts/stage-prebuild.mjs

      - name: Verify the staged prebuild loads (Node)
        working-directory: packages/node-gi/node-gi
        run: node --test test/smoke.test.mjs
        env:
          NODE_GI_NATIVE: prebuild

      - name: Upload win32-x64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64/node_gi.node
          if-no-files-found: error

  # Windows Phase 2 — BUILD the batteries-included GTK runtime bundle. Reuses the
  # `windows` job's gvsbuild download/cache steps as the closure SOURCE (build-time
  # only; NOT shipped), then COLLECTS the display-free DLL closure into gtk/bin +
  # the typelibs into gtk/girepository-1.0. CRUCIAL DIFFERENCE from macOS: NO
  # relocation — Windows resolves DLLs by SEARCH PATH at LoadLibrary time, so
  # "relocation" is just copying the DLLs into one dir (no install_name_tool /
  # @rpath / codesign, and no addon relocation). Uploads the bundle for the
  # no-gvsbuild conformance job below. Independent of the `windows` job (it does not
  # consume the addon), so it runs in parallel.
  windows-gtk-runtime:
    name: Windows GTK runtime bundle (build / windows-latest x64)
    needs: scope
    if: ${{ needs.scope.outputs.engine == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GVSBUILD_VERSION: '2026.6.0'
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 runs build-gtk-runtime.mjs (node:child_process/fs). Same version the
      # `windows` proof pins.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache gvsbuild GTK4 bundle
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk\x64\release
          key: gvsbuild-gtk4-${{ env.GVSBUILD_VERSION }}-x64-v1

      # Build-time closure SOURCE only — the DLLs are collected INTO the bundle, they
      # are NOT what the no-gvsbuild conformance job runs on. Verbatim from the
      # `windows` job's download/extract step.
      - name: Download + extract gvsbuild GTK4 (build-time closure source)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      # Collect the DLL closure + typelibs into the package's gtk/ dir. The script
      # walks the closure with dumpbin (located via vswhere) and falls back to
      # copying the full bin/*.dll set if dumpbin is unavailable — either way the
      # bundle is complete. Only --out + --prefix are needed (no addon relocation).
      - name: Build the GTK runtime bundle (collect DLL closure + typelibs)
        shell: pwsh
        run: |
          node packages/node-gi/gtk-runtime-win32-x64/scripts/build-gtk-runtime.mjs `
            --out packages/node-gi/gtk-runtime-win32-x64/gtk `
            --prefix $env:GTK_PREFIX

      - name: Report bundle size + layout sanity
        shell: pwsh
        run: |
          $B = "packages/node-gi/gtk-runtime-win32-x64/gtk"
          Get-Content "$B/manifest.json"
          Write-Host "--- bundle size ---"
          "{0:N1} MiB" -f ((Get-ChildItem $B -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          if (-not (Test-Path "$B/bin") -or -not (Test-Path "$B/girepository-1.0")) {
            Write-Host "BUNDLE INCOMPLETE: gtk/bin + gtk/girepository-1.0 are required (index.js isPresent)"
            exit 1
          }
          Write-Host "--- a few bundled DLLs ---"
          Get-ChildItem "$B/bin" -Filter *.dll | Select-Object -First 10 -ExpandProperty Name

      - name: Upload GTK runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: gtk-runtime-win32-x64
          path: packages/node-gi/gtk-runtime-win32-x64/gtk
          if-no-files-found: error

  # Windows Phase 2 — PROVE batteries-included. This job NEVER installs gvsbuild: it
  # downloads the relocated-by-copy bundle + the win32 addon prebuild and runs the
  # display-free conformance against them, so a green run proves node-gi works with
  # ZERO gvsbuild/system GTK. UNLIKE the macOS batteries job (which needs a CORE
  # leg + a re-exec for the non-addon-linked backers), ONE PATH-prepend covers the
  # whole subset: node-gi prepends the bundle's gtk/bin to PATH before the addon
  # loads, and Windows re-reads that path at each LoadLibrary — so the addon's own
  # DLL imports AND the runtime g_module_open of Pango/Gdk/Graphene both resolve
  # from the bundle in a single, env-free run.
  #
  # As on macOS, this consumes the DISPLAY-FREE bundle — not the `--windowing` superset
  # `release.yml` publishes. It is the minimal-closure check; the same conformance on the
  # SHIPPED shape runs in windows-gtk-windowing and is authoritative for the tarball.
  windows-batteries-included:
    name: Windows batteries-included conformance (no gvsbuild / windows-latest x64)
    runs-on: windows-latest
    needs: [windows, windows-gtk-runtime]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # This job never installs gvsbuild. Hard-fail if a gvsbuild GTK tree is present
      # (it would muddy the proof — the bundle must be the ONLY GTK).
      - name: Assert gvsbuild GTK is NOT present (clean batteries-included host)
        shell: pwsh
        run: |
          if (Test-Path 'C:\gtk-build\gtk\x64\release\bin\glib-2.0-0.dll') {
            Write-Host "gvsbuild GTK is present — not a clean batteries-included test"
            exit 1
          }
          Write-Host "clean host — gvsbuild GTK was never installed in this job"

      # Stage the bundle + addon prebuild in the SIBLING layout node-gi's loader
      # expects (prebuilds/win32-x64/{node_gi.node, gtk/}). The loader prepends
      # gtk/bin to PATH before loading the addon, so its DLL imports resolve here.
      - name: Download GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64/gtk

      - name: Download node-gi addon prebuild (from the windows job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64

      - name: Verify staged layout
        shell: pwsh
        run: |
          Get-ChildItem packages/node-gi/node-gi/prebuilds/win32-x64
          Write-Host "--- DLLs ---"
          Get-ChildItem packages/node-gi/node-gi/prebuilds/win32-x64/gtk/bin -Filter *.dll | Select-Object -First 10 -ExpandProperty Name
          Write-Host "--- typelibs ---"
          Get-ChildItem packages/node-gi/node-gi/prebuilds/win32-x64/gtk/girepository-1.0 -Filter *.typelib | Select-Object -First 10 -ExpandProperty Name

      # Fast probe FIRST — one clean process, NO GTK on PATH set by the job. node-gi's
      # loader prepends the bundle's gtk/bin to PATH before loading the addon, and
      # prependSearchPath for the typelibs; this reproduces registerClass subclassing
      # + Pango/Graphene/Gdk get_type resolving env-free from the bundle.
      - name: Batteries-included probe — no gvsbuild GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/check-batteries.mjs

      # The full display-free conformance subset — the primary proof, with the bundle
      # as the ONLY GTK. NODE_GI_NATIVE=prebuild loads the staged addon; the loader's
      # PATH-prepend makes its DLL imports + the typelib backers resolve from gtk/bin.
      # No CORE/FULL split (see the job comment): one PATH covers everything.
      - name: Conformance subset — no gvsbuild GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/cross-runtime.mjs node

  # Windows Phase 2 (windowing) — BUILD the FULL-windowing GTK runtime bundle. The
  # display-free bundle above ships only the loadable-DLL closure; this builds the
  # SUPERSET a real GTK WINDOW needs on Windows via `build-gtk-runtime.mjs
  # --windowing`: the gdk-pixbuf loaders + a bundle-relative `loaders.cache`, compiled
  # GSettings schemas (`gschemas.compiled`), the Adwaita/hicolor icon themes +
  # `icon-theme.cache`, Fontconfig config/cache, and the SVG/PNG image-loader backing
  # DLLs walked into bin/. Reuses the same gvsbuild download/cache as the `windows`
  # job (build-time closure SOURCE only, NOT shipped). Runs in parallel (does not
  # consume the addon). Uploads the bundle for the windowing proof job below.
  windows-gtk-windowing-runtime:
    name: Windows FULL-windowing GTK runtime bundle (build / windows-2022 x64)
    # `windows` because the builder now DECODES one of the icons it just bundled and
    # records the result for the release gate (#996). That needs a node-gi addon, and
    # the `windows` job already builds + uploads the win32-x64 one — building a second
    # copy here would be the duplication, and this job's runner is pinned to
    # windows-2022 (see below) where the addon is deliberately not built.
    needs: [scope, windows]
    if: ${{ needs.scope.outputs.engine == 'true' }}
    # PINNED TO windows-2022, and not for nostalgia. Two reasons, both measured:
    #
    #   • gvsbuild builds GStreamer's dependency chain, and libvpx's configure has
    #     no `x86_64-win64-vs18` target — on windows-latest (VS 18) it dies 25
    #     minutes in with "libvpx build failed". Nothing on our side to fix; the
    #     toolchain is simply newer than that build system.
    #   • It is also the more correct choice. The GTK half of this prefix is the
    #     gvsbuild RELEASE zip, built with VS 2022. Compiling GStreamer into that
    #     same prefix with VS 18 mixes toolsets in one bundle; pinning makes the
    #     whole prefix one.
    #
    # The addon that loads these DLLs is built on windows-latest and stays there —
    # the MSVC C ABI is what makes that fine, and it is what the display-free bundle
    # has always relied on.
    runs-on: windows-2022
    # Was 30, which the gvsbuild GStreamer chain blows through on a cache miss (the
    # run that reached libvpx was already at 25 min). A cache hit skips it entirely.
    timeout-minutes: 180
    env:
      GVSBUILD_VERSION: '2026.6.0'
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 runs build-gtk-runtime.mjs (node:child_process/fs). Same version the
      # `windows` proof pins.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache gvsbuild GTK4 bundle
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk\x64\release
          key: gvsbuild-gtk4-gst-gi-${{ env.GVSBUILD_VERSION }}-x64-v2

      # Build-time closure SOURCE only. Verbatim from the `windows` job.
      - name: Download + extract gvsbuild GTK4 (build-time closure source)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      # The bundle's data step runs gvsbuild's own tools (gdk-pixbuf-query-loaders /
      # glib-compile-schemas / gtk4-update-icon-cache / fc-cache) from <prefix>/bin,
      # which link glib/gio DLLs — so <prefix>/bin must be on PATH. (The DLL closure
      # walk uses dumpbin, located via vswhere on the VS2022 image.)
      # GSTREAMER, BUILT FROM SOURCE INTO THE SAME PREFIX.
      #
      # There is no prebuilt Windows GStreamer we can lift. The gvsbuild release
      # publishes exactly two assets — GTK3_Gvsbuild and GTK4_Gvsbuild — and neither
      # carries any of it: measured on the published @gjsify/gtk-runtime-win32-x64
      # tarball, all 40 typelibs present and not one of them GStreamer's, which is why
      # `new AudioContext()` threw `Failed to require Gst 1.0` on a machine whose GTK
      # worked perfectly. gstreamer.freedesktop.org ships an installer .exe for x64,
      # but it dropped the separate devel package, so whether it carries typelibs at
      # all is unverified — and an installer is the wrong thing to extract in CI.
      #
      # gvsbuild DOES define gstreamer/orc/gst-plugins-base/-good with
      # `-Dintrospection=enabled`, so building them is the path where the typelibs are
      # guaranteed and the ABI matches everything already in this prefix.
      #
      # IT WILL REBUILD DEPENDENCIES. The extracted zip carries no gvsbuild build
      # markers, so gvsbuild considers glib/gobject-introspection unbuilt and makes
      # them again from source. That is the cost of not having a prebuilt binary, and
      # it is why the cache key covers the GStreamer projects too and the timeout is
      # generous — on a cache hit this whole step is skipped.
      - name: Build GStreamer with gvsbuild (into the GTK prefix)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 150
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pipx
          python -m pipx ensurepath
          python -m pipx install "gvsbuild==$env:GVSBUILD_VERSION"
          # THE VS VERSION IS DERIVED, NOT ASSUMED. gvsbuild targets VS 17 by default
          # and windows-latest now ships 18, so it found the toolchain, SKIPPED it
          # ("Doesn't match target Visual Studio version of 17") and failed with
          # "Unable to find applicable Visual Studio". Hardcoding 18 would break the
          # same way at the next bump; vswhere already knows the answer.
          # `--vs-ver` takes gvsbuild's OWN names (vs2022, vs2026), not the major
          # version: 18 was rejected with "Choose from: vs2013 … vs2026". The obvious
          # derivation does not work either — `catalog_productLineVersion` returned
          # "18" on this image, not "2026", so it is the major here too and `vs18` was
          # rejected in turn.
          #
          # So the map is EXPLICIT, and an unknown major is a hard error rather than a
          # guess. gvsbuild enumerates the legal names itself; a wrong guess here would
          # only reproduce the same failure with a different number.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsMajor = (& $vswhere -latest -property installationVersion).Split('.')[0]
          $vsVer = switch ($vsMajor) {
            '17' { 'vs2022' }
            '18' { 'vs2026' }
            default { throw "unmapped Visual Studio major '$vsMajor' — add it here (gvsbuild spells these vs2022 / vs2026)" }
          }
          Write-Host "Visual Studio $vsMajor -> gvsbuild --vs-ver $vsVer"
          # Same prefix the zip was extracted into, so one tree carries GTK + Gst and
          # the bundle builder's single closure walk sees both.
          # `--skip libvpx`, and it is the audio-path rule applied to the BUILD
          # rather than only to the payload. gst-plugins-good declares exactly one
          # dependency beyond -base, and it is libvpx: VP8/VP9, i.e. video, which
          # gst-plugins.mjs already excludes from what ships. We were spending 15+
          # minutes compiling a codec whose output is thrown away.
          #
          # It also never once succeeded. On windows-latest its configure has no
          # `x86_64-win64-vs18` target; on windows-2022 it gets further and dies
          # moving `x64/vpxmd.lib`. GStreamer's meson features default to `auto`, so
          # an absent libvpx simply disables the vpx plugin — which is the state we
          # want anyway. -good is still built, for the parsers and decoders the audio
          # path genuinely needs: wavparse, flac, mpg123, autodetect.
          # `--enable-gi` IS THE WHOLE POINT and defaults to FALSE. gvsbuild's
          # gstreamer projects gate introspection on it — without it they pass
          # `-Dintrospection=disabled`, so the build succeeds and produces no
          # .gir/.typelib at all. Measured: a complete 16-minute GStreamer build
          # whose prefix contained zero Gst typelibs. The assertion below is what
          # caught it, at the prefix, instead of three jobs later as "no element
          # decodebin" — typelibs are the only reason we build this from source
          # rather than lifting a binary.
          gvsbuild build --configuration release --vs-ver $vsVer --enable-gi --skip libvpx --build-dir C:\gtk-build gstreamer gst-plugins-base gst-plugins-good

      - name: Assert GStreamer landed in the prefix (typelibs + plugins)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The two the bundle asserts, and the plugin dir the elements come from.
          # Fail HERE rather than three jobs later with "no element decodebin".
          foreach ($t in @('Gst-1.0.typelib', 'GstApp-1.0.typelib')) {
            $p = "$env:GTK_PREFIX\lib\girepository-1.0\$t"
            if (-not (Test-Path $p)) { Write-Host "MISSING $p"; exit 1 }
          }
          $plugins = Get-ChildItem "$env:GTK_PREFIX\lib\gstreamer-1.0" -Filter *.dll -ErrorAction SilentlyContinue
          if (-not $plugins) { Write-Host "no GStreamer plugins in the prefix"; exit 1 }
          Write-Host "GStreamer: $($plugins.Count) plugin DLL(s) in the prefix"

      - name: Put GTK on PATH (for the bundle-data tools)
        shell: pwsh
        run: '"$env:GTK_PREFIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8'

      # The decode probe's consumer half. The MSVC C ABI is what makes a
      # windows-latest-built addon fine on windows-2022 — the same property this job's
      # header already relies on for the DLLs it bundles.
      - name: Download node-gi addon prebuild (from the windows job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: addon

      - name: Build the FULL-windowing GTK runtime bundle (--windowing)
        shell: pwsh
        run: |
          node packages/node-gi/gtk-runtime-win32-x64/scripts/build-gtk-runtime.mjs `
            --windowing `
            --out packages/node-gi/gtk-runtime-win32-x64/gtk `
            --prefix $env:GTK_PREFIX `
            --addon (Join-Path $PWD 'addon\node_gi.node')

      - name: Report bundle size + assert the windowing data is present
        shell: pwsh
        run: |
          $B = "packages/node-gi/gtk-runtime-win32-x64/gtk"
          Get-Content "$B/manifest.json"
          Write-Host "--- bundle size ---"
          "{0:N1} MiB" -f ((Get-ChildItem $B -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          # The windowing marker node-gi keys on + the loader cache must be present.
          $missing = @()
          foreach ($p in @(
            "$B/bin",
            "$B/girepository-1.0",
            "$B/share/glib-2.0/schemas/gschemas.compiled",
            "$B/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          )) { if (-not (Test-Path $p)) { $missing += $p } }
          if ($missing.Count -gt 0) {
            Write-Host "WINDOWING BUNDLE INCOMPLETE — missing:`n  $($missing -join "`n  ")"
            exit 1
          }
          Write-Host "--- icon themes ---"
          Get-ChildItem "$B/share/icons" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          # GtkSource-5 (the Learn6502 editor's GtkSource.View backer). The gvsbuild
          # GTK4 release ZIP ships gtksourceview5, so ASSERT the full closure landed:
          # the DLL is seeded (WINDOWING_SEED_PATTERNS), the typelib copied, and the
          # language-specs/styles bundled (build step 4e). A future gvsbuild that drops
          # gtksourceview5 fails here loudly rather than silently shipping a bundle the
          # editor can't load.
          Write-Host "--- assert GtkSource-5 in the bundle ---"
          $srcDll = Get-ChildItem "$B/bin" -Filter '*gtksourceview-5*.dll' -ErrorAction SilentlyContinue
          if (-not $srcDll) { Write-Host "libgtksourceview-5 DLL MISSING from the windowing bundle"; exit 1 }
          if (-not (Test-Path "$B/girepository-1.0/GtkSource-5.typelib")) { Write-Host "GtkSource-5.typelib MISSING from the windowing bundle"; exit 1 }
          if (-not (Test-Path "$B/share/gtksourceview-5/language-specs")) { Write-Host "GtkSource-5 language-specs MISSING from the windowing bundle"; exit 1 }
          Write-Host ("GtkSource-5 OK: {0} + GtkSource-5.typelib + language-specs" -f $srcDll.Name)

      - name: Upload FULL-windowing GTK runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: gtk-runtime-win32-x64-windowing
          path: packages/node-gi/gtk-runtime-win32-x64/gtk
          if-no-files-found: error

  # Windows Phase 2 (windowing) — PROVE a real GTK WINDOW realizes + renders with the
  # FULL-windowing bundle as the ONLY GTK (NEVER installs gvsbuild). Mirrors the
  # windows-batteries-included setup (download the bundle + the win32 addon prebuild
  # into the sibling prebuilds/ layout), then runs the windowing test:
  # `test/windowing.test.mjs` creates an Adw.ApplicationWindow (HeaderBar / WindowTitle
  # / StatusPage), presents it, and captures a PNG through the GSK renderer
  # (Gtk.WidgetPaintable → Gsk.Renderer.render_texture → Gdk.Texture) — a non-empty
  # PNG proves a GdkWin32 surface was allocated + a render tree rasterised through
  # node-gi, beyond the display-free conformance. windows-latest has a desktop session;
  # GSK_RENDERER=cairo keeps it off any GPU/GL path. node-gi's loader wires the bundle
  # (PATH for DLLs + GSETTINGS_SCHEMA_DIR / GDK_PIXBUF_MODULE_FILE / XDG_DATA_DIRS for
  # the windowing data) from the gschemas.compiled marker.
  windows-gtk-windowing:
    name: Windows windowing proof (no gvsbuild / windows-latest x64)
    runs-on: windows-latest
    needs: [windows, windows-gtk-windowing-runtime]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Never installs gvsbuild. Hard-fail if a gvsbuild GTK tree is present (it would
      # muddy the proof — the windowing bundle must be the ONLY GTK).
      - name: Assert gvsbuild GTK is NOT present (clean host)
        shell: pwsh
        run: |
          if (Test-Path 'C:\gtk-build\gtk\x64\release\bin\glib-2.0-0.dll') {
            Write-Host "gvsbuild GTK is present — not a clean windowing test"
            exit 1
          }
          Write-Host "clean host — gvsbuild GTK was never installed in this job"

      # Stage the windowing bundle + addon prebuild in the sibling layout node-gi's
      # loader expects (prebuilds/win32-x64/{node_gi.node, gtk/}). The loader prepends
      # gtk/bin to PATH + wires the windowing env from the gschemas.compiled marker.
      - name: Download FULL-windowing GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-win32-x64-windowing
          path: packages/node-gi/node-gi/prebuilds/win32-x64/gtk

      - name: Download node-gi addon prebuild (from the windows job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64

      - name: Verify staged layout
        shell: pwsh
        run: |
          $B = "packages/node-gi/node-gi/prebuilds/win32-x64/gtk"
          Get-ChildItem packages/node-gi/node-gi/prebuilds/win32-x64
          Write-Host "--- windowing data ---"
          foreach ($p in @("share/glib-2.0/schemas/gschemas.compiled", "lib/gdk-pixbuf-2.0/2.10.0/loaders.cache")) {
            if (-not (Test-Path "$B/$p")) { Write-Host "$p MISSING from the staged bundle"; exit 1 }
          }
          # This is the PUBLISHED shape, so assert the manifest says so rather than
          # trusting the artifact name (release.yml gates the tarball on the same field).
          node -e '
            const m = require("./packages/node-gi/node-gi/prebuilds/win32-x64/gtk/manifest.json");
            if (m.windowing !== true || !(m.dataBytes > 0)) {
              console.error(`not the published shape: windowing=${m.windowing} dataBytes=${m.dataBytes}`);
              process.exit(1);
            }
            console.log(`win32-x64 windowing superset, ${m.dataBytes} bytes of runtime data`);
          '

      # Claim 1 — the CONFORMANCE on the PUBLISHED bundle, which nothing ran before this
      # change: windows-batteries-included runs the same two steps against the
      # DISPLAY-FREE bundle (a different artifact — no adwaita/gtksourceview DLL, no data
      # tree), so it proved the shipped one nothing. This job is authoritative for "what
      # a consumer installs works"; that job stays the minimal-closure check. One
      # PATH-prepend covers both the addon's DLL imports and the runtime g_module_open,
      # so no CORE/FULL split is needed here either.
      - name: Batteries-included probe on the PUBLISHED bundle — no gvsbuild GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/check-batteries.mjs

      - name: Conformance subset on the PUBLISHED bundle — no gvsbuild GTK (Node)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node scripts/cross-runtime.mjs node

      # Claim 2 — the windowing proof: a real Adw.ApplicationWindow realizes + renders a surface
      # via the GSK renderer, AND responds to input (a Gio action + a Gtk.Button::clicked
      # drive the counter — the interactive proof runs headless, no visible desktop
      # needed, same as the render-to-texture screenshot); widgets.test.mjs adds the
      # Adwaita widget-breadth proof on the SAME bundle (a PreferencesPage of
      # SwitchRow/EntryRow/ComboRow/SpinRow/ExpanderRow rows + a Gtk.ListBox + a toast,
      # constructed, DumpTree-typed, driven via notify:: and GSK-rendered), with the
      # bundle as the ONLY
      # GTK. NODE_GI_NATIVE=prebuild loads the staged addon; the loader's PATH-prepend +
      # windowing-env wiring makes the DLLs + schemas/loaders/icons resolve from the
      # bundle. On win32 the test's display gate is IMPLICIT (no DISPLAY/WAYLAND_DISPLAY
      # needed — the GdkWin32 backend supplies it), so it runs here. GSK_RENDERER=cairo
      # forces software rendering (no GPU on the runner).
      - name: Windowing proof — Adw window realizes, renders, reacts + widget breadth (no gvsbuild GTK)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
          GSK_RENDERER: cairo
        run: node --test test/windowing.test.mjs test/windowing-interactive.test.mjs test/widgets.test.mjs

      # Composite templates — the proof that was missing on BOTH displayless
      # platforms. All four gtk-template tests gated on DISPLAY/WAYLAND_DISPLAY,
      # variables GdkWin32 and GdkQuartz never set, so they had never run off
      # Linux. Windows meanwhile shipped `GetGtkTemplateApi()` as an
      # `#ifdef _WIN32` stub, and a user found it before CI did: `gjsify showcase
      # three-geometry-teapot --runtime node` on Windows 11 died with "the
      # libgtk-4 template API is unavailable" on a machine with working GTK 4.
      # Running them here is what turns "templates work on this platform" from a
      # claim into a check.
      - name: Template proof — composite templates resolve, install and bind children
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
          GSK_RENDERER: cairo
        run: node --test test/gtk-template.test.mjs test/gtk-template-callbacks.test.mjs test/gtk-template-custom-child-ctor.test.mjs test/gtk-template-signals.test.mjs

      # AUDIO, the counterpart to the windowing proof above. Everything else about
      # the GStreamer payload is checkable by counting files — and counting files is
      # what missed the defect: a bundle shipped both Gst typelibs and ZERO plugins
      # with every gate green. This asks the registry for the elements the decode
      # path is made of, which covers the payload AND the env wiring around it.
      - name: Audio proof — the GStreamer elements resolve on the bundle
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
        run: node --test test/gst-elements.test.mjs

  # ── #1354 M3: the Windows program directory, assembled and then RUN ──────────
  #
  # The same pair as `macos-app-assemble` → `macos-app-selfcontained`, one OS over,
  # and modelled on it line for line. Everything here runs on Linux and is a claim
  # about our WIRING; the job below it unzips the artifact on a Windows runner that
  # has no gvsbuild GTK and no Node on `PATH`, and opens a window with it.
  windows-dir-assemble:
    name: Assemble a self-contained Windows program directory (Linux / win32-x64)
    runs-on: ubuntu-latest
    needs: [windows, windows-gtk-windowing-runtime]
    if: ${{ !cancelled() && needs.windows-gtk-windowing-runtime.result != 'skipped' }}
    timeout-minutes: 45
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      # Official nodejs.org build, NOT Fedora's dnf node (which crashes rolldown's
      # prebuilt napi binding). Same rationale as `build-test` and `consumer-suites`.
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the gjsify workspace (published CLI, Node-free)
        run: |
          B=$(gjs -m install.mjs --fetch-only)
          gjs -m "$B" install --immutable

      # The bootstrap recipe `consumer-suites` uses, for the reason it states: a job
      # that builds with the LAST RELEASE cannot observe a change to the bundler in
      # THIS checkout, and this milestone lives entirely in this checkout's CLI.
      - name: Bootstrap a Node bundler + link node-gi, then switch to this checkout's cli
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && "${GITHUB_WORKSPACE}/.github/scripts/install-published-cli.sh" "${CLI_VERSION}" )
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          mkdir -p node_modules/@gjsify
          ln -sfn ../../packages/node-gi/node-gi node_modules/@gjsify/node-gi
          PATH="$PWD/node_modules/.bin:$PATH" node_modules/.bin/gjsify run build:infra
          ln -sfn "$PWD/packages/infra/cli/lib/index.js" node_modules/.bin/gjsify
          echo "Node bundler (this checkout): $(node_modules/.bin/gjsify --version)"

      # The SIBLING layout `resolveGtkRuntimeBundle()` walks — candidate 2 of its
      # four, and the one `gjsify ship` resolves through here. Downloading the
      # bundle and the addon into node-gi's own `prebuilds/win32-x64/` is exactly
      # what `windows-batteries-included` and `windows-gtk-windowing` do before a
      # conformance run, so a job prepared for one is prepared for this.
      - name: Download FULL-windowing GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-win32-x64-windowing
          path: packages/node-gi/node-gi/prebuilds/win32-x64/gtk

      - name: Download node-gi addon prebuild (from the windows job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64

      # The interpreter. A DOWNLOAD rather than a build, which is why all three
      # `@gjsify/node-runtime-*` targets ride one Linux job in `release.yml` — the
      # script verifies the release's own SHA-256 and copies Node's LICENSE beside
      # the binary. `gjsify ship` resolves the package BY NAME from here.
      - name: Fetch the bundled Node interpreter for win32-x64
        run: |
          node packages/node-runtime/scripts/fetch-node-runtime.mjs \
            --target win32-x64 \
            --out packages/node-runtime/node-runtime-win32-x64/bin
          mkdir -p node_modules/@gjsify
          ln -sfn ../../packages/node-runtime/node-runtime-win32-x64 \
            node_modules/@gjsify/node-runtime-win32-x64

      # `--arch` names the architecture the PAYLOAD was built for and cross-compiles
      # nothing; it is also what selects the closure. `x64` is the only value this
      # layout has — gvsbuild publishes no arm64 GTK (#1117) — and
      # `assertPayloadMatchesArch` reads the staged tree back and refuses a PE whose
      # COFF machine disagrees with the label.
      - name: Assemble the program directory + zip
        working-directory: tests/e2e/ship-macos/fixtures/window-app
        run: |
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:$PATH"
          gjsify ship windows --arch x64
          echo "--- what the directory carries ---"
          find "ship/out/Ship Window Demo/lib" -maxdepth 5 -type d | head -20
          du -sh "ship/out/Ship Window Demo"

      # The launcher, quoted into the log. It is a dozen lines and it is the
      # interface between everything above and everything the next job runs, so a
      # reader diagnosing that job should not have to unzip an artifact to see it.
      - name: Show the launcher, and read the artifact back with CPython
        working-directory: tests/e2e/ship-macos/fixtures/window-app
        run: |
          cat "ship/out/Ship Window Demo/ship-window-demo.cmd"
          python3 "${GITHUB_WORKSPACE}/.github/ship-oracle/verify-program-dir.py" \
            "ship/out/Ship Window Demo" ship/stage/.gjsify-ship-stage.json
          bash "${GITHUB_WORKSPACE}/.github/ship-oracle/verify-app-zip.sh" \
            ship/out/ship-window-demo-1.0.0-1.x64.zip "ship/out/Ship Window Demo" "program directory"
          test -f "ship/out/Ship Window Demo/node.exe" || {
            echo "the directory carries no interpreter — the next job would run the runner's node"; exit 1
          }

      # THE ONE MEASUREMENT NO LEG BELOW CAN MAKE, taken here on the REAL binary.
      # `node.exe` is a CONSOLE-subsystem image and the Node release ships no
      # `nodew.exe`, so a GUI launch of this artifact pops a console window — and
      # every Windows leg starts the app from a shell and therefore inherits one,
      # which is why this is a PRINTED number and not a check anywhere. Recorded in
      # `status/open-todos.md`; do not add a leg that appears to cover it.
      - name: Record the interpreter's PE subsystem (the console-window gap)
        working-directory: tests/e2e/ship-macos/fixtures/window-app
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/ship-oracle/verify-program-dir.py" \
            "ship/out/Ship Window Demo" ship/stage/.gjsify-ship-stage.json | tail -1

      # UPLOADED BEFORE THE INSTALLER IS COMPILED, deliberately. The two `.msi`
      # steps below are the only ones in this job that need a tool, and
      # `windows-dir-selfcontained` needs nothing from them — so an image without
      # `msitools` costs the M5 legs and leaves M3's chain intact, instead of
      # failing the whole job before this upload runs.
      - name: Upload the assembled program-directory zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-dir-selfcontained-win32-x64
          path: tests/e2e/ship-macos/fixtures/window-app/ship/out/*.zip
          # error, not warn: an empty upload hands the next job a downloadable
          # nothing and fails there as a missing file rather than here as a
          # missing artifact.
          if-no-files-found: error

      # ── #1354 M5: the installer, as its OWN step ────────────────────────────
      #
      # A SECOND `gjsify ship` INVOCATION rather than a third `--target` on the one
      # above, and the reason is failure ATTRIBUTION. `msi` is the only format here
      # that needs a tool, and `assertToolsInstalled` refuses BEFORE anything is
      # packed — so folding it into the run above would mean an image without
      # `msitools` produces no program directory either, and M3's whole
      # `windows-dir-selfcontained` chain fails on a missing MSI compiler. Two steps,
      # two failures, each naming its own cause. `ship/out/` is not wiped between
      # runs, so the second one adds the `.msi` beside the directory and the zip.
      #
      # `msitools` is baked into `.docker/ci-fedora.Dockerfile`; `wixl --version` is
      # printed first so a failure here is attributable to the image rather than to
      # the document.
      - name: Compile the installer with wixl
        working-directory: tests/e2e/ship-macos/fixtures/window-app
        run: |
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:$PATH"
          wixl --version
          gjsify ship windows --arch x64 --target msi
          ls -l ship/out/*.msi

      # THE INSTALLER, READ BACK — and this read is deliberately NOT the oracle.
      # `wixl` wrote the file and `msiinfo` reads it, which is one package agreeing
      # with itself (ADR 0024 § A3's `selfReading`). What it IS worth is the pair of
      # questions nothing else asks on this side: does the database describe the
      # program directory sitting next to it, and do the bytes in its embedded
      # cabinet come back out unchanged. The independence is bought by the two jobs
      # below — `msiexec` installs THIS file on Windows, and `msiinfo` reads back
      # the one WiX built there from the same `.wxs`.
      - name: Read the installer back against the program directory (same family)
        working-directory: tests/e2e/ship-macos/fixtures/window-app
        run: |
          bash "${GITHUB_WORKSPACE}/.github/ship-oracle/verify-msi.sh" \
            ship/out/ship-window-demo-1.0.0-1.x64.msi \
            "ship/out/Ship Window Demo" \
            msitools

      # STAGED INTO ONE DIRECTORY FIRST, and that is not tidiness — it is the
      # difference between a flat artifact and a nested one. `actions/upload-artifact`
      # roots the archive at the LEAST COMMON ANCESTOR of everything its `path:`
      # matched, so two globs in different directories (`ship/out/*.msi` and
      # `ship/msi/*.wxs`) produce an artifact containing `out/` and `msi/`, not two
      # files. Measured the hard way: the consuming job's
      # `Get-ChildItem "$env:RUNNER_TEMP\msi" -Filter *.msi` found nothing and died on
      # `Cannot index into a null array` — a PowerShell error that says nothing about
      # the cause. One glob over one directory has an unambiguous ancestor, and the
      # `ls -l` makes the layout readable in the log rather than inferable from the
      # action's semantics.
      - name: Stage the installer and its document for upload
        working-directory: tests/e2e/ship-macos/fixtures/window-app
        run: |
          mkdir -p ship/upload
          cp ship/out/*.msi ship/msi/*.wxs ship/upload/
          ls -l ship/upload

      # The installer AND the document it was compiled from. The `.wxs` is not a
      # by-product here: the windows job compiles this exact file a SECOND time with
      # WiX v3, which is what makes the cross-check a cross-check. Its `Source=`
      # attributes are relative (`root/…`), so that job reconstructs `root/` by
      # expanding the zip above.
      - name: Upload the installer and the .wxs it was compiled from
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-win32-x64
          path: tests/e2e/ship-macos/fixtures/window-app/ship/upload/*
          if-no-files-found: error

  # THE HALF THAT EARNS THE MILESTONE. Everything before this runs on Linux and is
  # a claim about our WIRING; this one unzips the artifact on a Windows runner that
  # never installed gvsbuild, strips Node off `PATH`, and opens a window with it.
  windows-dir-selfcontained:
    name: Self-contained program directory opens a window (no gvsbuild, no node / windows-latest x64)
    runs-on: windows-latest
    needs: windows-dir-assemble
    if: ${{ !cancelled() && needs.windows-dir-assemble.result != 'skipped' }}
    timeout-minutes: 20
    steps:
      # NO `actions/setup-node`, and NO checkout. This job runs a downloaded
      # artifact and nothing else — the shape a stranger is in.
      #
      # Never installs gvsbuild. Hard-fail if a gvsbuild GTK tree is present (it
      # would muddy the proof — the carried closure must be the ONLY GTK), which is
      # the assertion `windows-batteries-included` and `windows-gtk-windowing` both
      # open with and the reason either of them means anything.
      - name: Assert gvsbuild GTK is NOT present (clean batteries-included host)
        shell: pwsh
        run: |
          if (Test-Path 'C:\gtk-build\gtk\x64\release\bin\glib-2.0-0.dll') {
            Write-Host "gvsbuild GTK is present — not a clean batteries-included test"
            exit 1
          }
          Write-Host "clean host — gvsbuild GTK was never installed in this job"

      - name: Download the assembled program-directory zip
        uses: actions/download-artifact@v4
        with:
          name: windows-dir-selfcontained-win32-x64
          path: ${{ runner.temp }}/app

      # Unzipped OUTSIDE any checkout, because a program directory beside a
      # repository can resolve things a downloaded one cannot:
      # `require('@gjsify/node-gi/gi')` walks `node_modules` UPWARD from the staged
      # bundle, so a tree sitting under one that has it is not the artifact a user
      # receives.
      - name: Unzip the program directory
        shell: pwsh
        working-directory: ${{ runner.temp }}/app
        run: |
          Expand-Archive -Path (Get-ChildItem -Filter *.zip)[0].FullName -DestinationPath . -Force
          Get-ChildItem "Ship Window Demo"
          Write-Host "--- the launcher, as assembled on Linux ---"
          Get-Content "Ship Window Demo\ship-window-demo.cmd"

      # THE OTHER ABSENCE, and the reason this job is worth anything. The runner
      # image ships a Node; a launcher running the bare name would pass here and
      # fail on every Windows machine that has none. Reducing `PATH` to the two
      # system directories is what makes the run measure the artifact rather than
      # the image.
      - name: Assert there is NO node on PATH once PATH is the system one
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          if (Get-Command node -ErrorAction SilentlyContinue) {
            Write-Host "a system node exists on the reduced PATH — this leg cannot prove the artifact carries one"
            exit 1
          }
          Write-Host "no node on the system PATH — whatever runs must come from inside the program directory"

      # The run. Every locator unset, `PATH` reduced to the system one, no gvsbuild
      # GTK on the machine: what the app finds, it brought. `GSK_RENDERER=cairo`
      # forces software rendering, as every other windowing leg here does.
      - name: Open a window from the unzipped program directory
        shell: pwsh
        working-directory: ${{ runner.temp }}/app
        env:
          GSK_RENDERER: cairo
        run: |
          foreach ($name in 'GJSIFY_GTK_RUNTIME','NODE_GI_NATIVE','GJSIFY_GI_LIBRARY_PATH','GI_TYPELIB_PATH','XDG_DATA_DIRS','GSETTINGS_SCHEMA_DIR','NODE_PATH','GDK_PIXBUF_MODULE_FILE') {
            Remove-Item "env:$name" -ErrorAction SilentlyContinue
          }
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          & "$PWD\Ship Window Demo\ship-window-demo.cmd" 2>&1 | Tee-Object -FilePath run.log
          exit $LASTEXITCODE

      # Read back what it printed, line by line, because an exit code of 0 is also
      # what an app that never activated returns.
      - name: Assert what the run proved
        shell: pwsh
        working-directory: ${{ runner.temp }}/app
        run: |
          $log = Get-Content run.log
          # The interpreter is inside THIS artifact. Matched by the artifact-relative
          # SUFFIX rather than by an absolute path: `%~dp0` is the launcher's own
          # directory as cmd.exe spells it and `process.execPath` is `uv_exepath`,
          # and a runner temp directory can differ between the two in case and in
          # short-name form. The claim is "the interpreter is inside the program
          # directory", and the suffix says it.
          if (-not ($log | Select-String -Pattern '^interpreter: .*Ship Window Demo\\node\.exe$')) {
            Write-Host "the app did not run under the interpreter the directory carries:"
            $log | Select-String -Pattern '^interpreter:'
            exit 1
          }
          # The launcher exported the locator, and it points inside the artifact.
          if (-not ($log | Select-String -Pattern '^gtk-runtime: .*Ship Window Demo\\lib\\node-gi\\prebuilds\\win32-x64\\gtk$')) {
            Write-Host "GJSIFY_GTK_RUNTIME was not exported into the program directory:"
            $log | Select-String -Pattern '^gtk-runtime:'
            exit 1
          }
          # The Adwaita tree built and wired through the engine.
          if (-not ($log | Select-String -Pattern '^chrome: ok$')) {
            Write-Host "the Adwaita widget tree is incomplete:"; $log | Select-String -Pattern '^chrome:'; exit 1
          }
          # And a real GdkSurface was allocated and a GSK render tree rasterised. On
          # win32 the display gate is IMPLICIT — the GdkWin32 backend supplies it, so
          # unlike Linux there is no surface-less branch to excuse here.
          if (-not ($log | Select-String -Pattern '^render: \d+x\d+ \d+$')) {
            Write-Host "the window did not realize + render:"; $log | Select-String -Pattern '^render:'; exit 1
          }
          if (-not ($log | Select-String -Pattern '^done: 0$')) {
            Write-Host "app.run() returned non-zero:"; $log | Select-String -Pattern '^done:'; exit 1
          }
          Write-Host "a downloaded program directory opened and rendered a window on a Windows host with no gvsbuild GTK and no node on PATH"

  # ── #1354 M5: the installer, INSTALLED — and compiled a second time ─────────
  #
  # THE HALF THAT EARNS THE MILESTONE, and it is two claims, not one.
  #
  #   1. `msiexec /i /qn` puts the wixl-built database in front of Windows
  #      Installer — Microsoft's implementation, a different family from the one
  #      that wrote it — and this job then RUNS what it installed and REMOVES it.
  #      Installing and not running would prove the file parses; removing and not
  #      checking would leave "it uninstalls" an assumption. An installer that
  #      cannot be removed is worse than none.
  #   2. WiX Toolset v3.14 — preinstalled on this runner image — compiles the SAME
  #      authored `.wxs` the Linux job compiled with `wixl`. That file is uploaded
  #      for `windows-msi-crossread`, where `msiinfo` reads back a database
  #      msitools did not write. That pair is what ADR 0024 § A6 means by "the
  #      producer and the reader are not the same package".
  #
  # NO CHECKOUT, like the M3 leg: this job runs downloaded artifacts and nothing
  # else, which is the shape a stranger is in. The one thing it does need from the
  # repository is the `.wxs`, and that arrives as an artifact.
  windows-msi-install:
    name: MSI installs, runs and uninstalls (windows-latest x64)
    runs-on: windows-latest
    needs: windows-dir-assemble
    if: ${{ !cancelled() && needs.windows-dir-assemble.result != 'skipped' }}
    timeout-minutes: 25
    steps:
      # The same absence the M3 leg opens with, and the reason either means
      # anything: the carried closure must be the ONLY GTK on the machine.
      - name: Assert gvsbuild GTK is NOT present (clean batteries-included host)
        shell: pwsh
        run: |
          if (Test-Path 'C:\gtk-build\gtk\x64\release\bin\glib-2.0-0.dll') {
            Write-Host "gvsbuild GTK is present — not a clean batteries-included test"
            exit 1
          }
          Write-Host "clean host — gvsbuild GTK was never installed in this job"

      - name: Download the installer and the .wxs
        uses: actions/download-artifact@v4
        with:
          name: windows-msi-win32-x64
          path: ${{ runner.temp }}/msi

      - name: Download the program-directory zip (the WiX compile's payload)
        uses: actions/download-artifact@v4
        with:
          name: windows-dir-selfcontained-win32-x64
          path: ${{ runner.temp }}/msi

      # MEASURED, not assumed. The image's software list says WiX Toolset
      # 3.14.1.8722; whether its `bin` is on `PATH` is a different question and this
      # is where it gets answered out loud. A job that silently skipped the WiX
      # compile would leave the cross-read below reading a file wixl wrote.
      - name: Locate WiX v3 and put it on PATH
        shell: pwsh
        run: |
          $candle = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Recurse -Filter candle.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $candle) {
            Write-Host "no candle.exe under 'C:\Program Files (x86)\WiX Toolset*' — this runner image has no WiX v3,"
            Write-Host "so the second compiler does not exist and the cross-check would be msitools reading msitools."
            exit 1
          }
          # The version off the FILE, not out of `candle -?`. GitHub's pwsh wrapper
          # ends every block with `exit $LASTEXITCODE`, and a help switch that exits
          # non-zero would fail this step for printing a version — a step that fails
          # for the wrong reason is worse than one that prints nothing.
          Write-Host "WiX v3 $($candle.VersionInfo.ProductVersion) in $($candle.DirectoryName)"
          Add-Content -Path $env:GITHUB_PATH -Value $candle.DirectoryName

      # THE OTHER ABSENCE, and the reason the run below is worth anything. The
      # runner image ships a Node; the installed launcher must use the one the
      # package laid down.
      - name: Assert there is NO node on PATH once PATH is the system one
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          if (Get-Command node -ErrorAction SilentlyContinue) {
            Write-Host "a system node exists on the reduced PATH — this leg cannot prove the artifact carries one"
            exit 1
          }
          Write-Host "no node on the system PATH — whatever runs must come from inside what the installer laid down"

      # ── 1. INSTALL ──────────────────────────────────────────────────────────
      #
      # `INSTALLDIR=` overrides the directory whose id is that public property, so
      # nothing lands in Program Files and the uninstall assertion below has an
      # unambiguous tree to look at. `/l*v` because a silent MSI failure is a
      # number, and the log is the only place that says which action produced it.
      - name: Install it with msiexec, into a prefix this job owns
        shell: pwsh
        run: |
          # RESOLVED WITH A COUNT, never `[0]`. Indexing an empty result gives
          # `Cannot index into a null array` — a PowerShell error that names the line
          # and not the cause, which is what the artifact-layout defect surfaced as.
          # `-Recurse` so a nested archive is found anyway, and the assertion is on
          # the COUNT so an unexpected layout says what it is.
          $found = @(Get-ChildItem "${{ runner.temp }}\msi" -Recurse -Filter *.msi)
          if ($found.Count -ne 1) {
            Write-Host "expected exactly one .msi in the downloaded artifact, found $($found.Count):"
            Get-ChildItem "${{ runner.temp }}\msi" -Recurse | Select-Object -First 30 -ExpandProperty FullName
            exit 1
          }
          $msi = $found[0].FullName
          $prefix = "${{ runner.temp }}\prefix"
          Write-Host "installing $msi into $prefix"
          $p = Start-Process msiexec.exe -ArgumentList @(
            '/i', "`"$msi`"", '/qn', "INSTALLDIR=`"$prefix`"", '/l*v', "`"${{ runner.temp }}\install.log`""
          ) -Wait -PassThru
          Write-Host "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Get-Content "${{ runner.temp }}\install.log" -Tail 80
            exit 1
          }
          if (-not (Test-Path "$prefix\ship-window-demo.cmd")) {
            Write-Host "the launcher is not at $prefix — INSTALLDIR was not honoured, or nothing was installed:"
            Get-ChildItem $prefix -ErrorAction SilentlyContinue
            Get-Content "${{ runner.temp }}\install.log" -Tail 80
            exit 1
          }
          Get-ChildItem $prefix

      # The entry a user removes it BY. Generated by Windows Installer from
      # ProductName/ProductVersion/Manufacturer, so its absence means an installed
      # product nobody can find again in Settings.
      - name: Assert the Add/Remove Programs entry exists
        shell: pwsh
        run: |
          # `@(...)` so the count is a count even for one match, and the count is
          # itself an assertion: TWO entries is what a `ProductCode` that did not
          # move — or an `UpgradeCode` that did — produces, and it is the failure
          # the derived GUIDs exist to prevent. Reading `.DisplayVersion` off a bare
          # `$keys` would also have been a filter rather than a comparison the
          # moment there were two.
          $keys = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Ship Window Demo' })
          if ($keys.Count -eq 0) {
            Write-Host "no Add/Remove Programs entry named 'Ship Window Demo' — the package installed and cannot be found"
            exit 1
          }
          $keys | Select-Object DisplayName, DisplayVersion, Publisher, UninstallString | Format-List
          if ($keys.Count -ne 1) {
            Write-Host "$($keys.Count) Add/Remove Programs entries carry this DisplayName — one install produced several products"
            exit 1
          }
          if ($keys[0].DisplayVersion -ne '1.0.0') {
            Write-Host "the entry reports version '$($keys[0].DisplayVersion)', not the 1.0.0 the project declares"
            exit 1
          }

      # ── 2. RUN WHAT WAS INSTALLED ───────────────────────────────────────────
      #
      # The point of the whole milestone. Same reduced PATH and same unset locators
      # as `windows-dir-selfcontained`: what the app finds, the installer brought.
      - name: Open a window from the INSTALLED program directory
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          GSK_RENDERER: cairo
        run: |
          foreach ($name in 'GJSIFY_GTK_RUNTIME','NODE_GI_NATIVE','GJSIFY_GI_LIBRARY_PATH','GI_TYPELIB_PATH','XDG_DATA_DIRS','GSETTINGS_SCHEMA_DIR','NODE_PATH','GDK_PIXBUF_MODULE_FILE') {
            Remove-Item "env:$name" -ErrorAction SilentlyContinue
          }
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          & "${{ runner.temp }}\prefix\ship-window-demo.cmd" 2>&1 | Tee-Object -FilePath run.log
          exit $LASTEXITCODE

      # Line by line, because exit 0 is also what an app that never activated
      # returns. The same four claims the M3 leg makes, against a tree an installer
      # laid down rather than one a zip expanded.
      - name: Assert what the installed app proved
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $log = Get-Content run.log
          if (-not ($log | Select-String -Pattern '^interpreter: .*prefix\\node\.exe$')) {
            Write-Host "the app did not run under the interpreter the installer laid down:"
            $log | Select-String -Pattern '^interpreter:'
            exit 1
          }
          if (-not ($log | Select-String -Pattern '^gtk-runtime: .*prefix\\lib\\node-gi\\prebuilds\\win32-x64\\gtk$')) {
            Write-Host "GJSIFY_GTK_RUNTIME was not exported into the installed tree:"
            $log | Select-String -Pattern '^gtk-runtime:'
            exit 1
          }
          if (-not ($log | Select-String -Pattern '^chrome: ok$')) {
            Write-Host "the Adwaita widget tree is incomplete:"; $log | Select-String -Pattern '^chrome:'; exit 1
          }
          if (-not ($log | Select-String -Pattern '^render: \d+x\d+ \d+$')) {
            Write-Host "the window did not realize + render:"; $log | Select-String -Pattern '^render:'; exit 1
          }
          if (-not ($log | Select-String -Pattern '^done: 0$')) {
            Write-Host "app.run() returned non-zero:"; $log | Select-String -Pattern '^done:'; exit 1
          }
          Write-Host "an MSI-installed application opened and rendered a window with no gvsbuild GTK and no node on PATH"

      # ── 3. REMOVE IT, AND CHECK WHAT IS LEFT ────────────────────────────────
      #
      # The claim `windows-dir` cannot make at all. `/x` by package rather than by
      # ProductCode, so nothing here has to know a GUID; the assertions are about
      # what is on disk and in the registry afterwards, which is the only form of
      # "it uninstalls cleanly" that is not an assumption.
      - name: Uninstall it, and assert nothing is left behind
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem "${{ runner.temp }}\msi" -Recurse -Filter *.msi)[0].FullName
          $prefix = "${{ runner.temp }}\prefix"
          $p = Start-Process msiexec.exe -ArgumentList @(
            '/x', "`"$msi`"", '/qn', '/l*v', "`"${{ runner.temp }}\uninstall.log`""
          ) -Wait -PassThru
          Write-Host "msiexec /x exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "${{ runner.temp }}\uninstall.log" -Tail 80; exit 1 }

          # Every FILE the package installed must be gone. Reported as a list rather
          # than a boolean: "something is left" without naming it is a finding
          # nobody can act on.
          if (Test-Path $prefix) {
            $left = Get-ChildItem $prefix -Recurse -File -ErrorAction SilentlyContinue
            if ($left) {
              Write-Host "$($left.Count) file(s) survived the uninstall:"
              $left | Select-Object -First 40 -ExpandProperty FullName
              exit 1
            }
            # An EMPTY directory tree is a weaker defect than a file, and it is
            # recorded rather than tolerated silently: Windows Installer removes a
            # directory it created once the last component in it goes, so anything
            # here means a directory nothing owned.
            $dirs = Get-ChildItem $prefix -Recurse -Directory -ErrorAction SilentlyContinue
            Write-Host "the install root still exists and holds no files; empty directories left: $($dirs.Count)"
            $dirs | Select-Object -First 20 -ExpandProperty FullName
            exit 1
          }
          Write-Host "the install root is gone"

          $keys = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Ship Window Demo' }
          if ($keys) {
            Write-Host "the Add/Remove Programs entry survived the uninstall"
            $keys | Select-Object DisplayName, UninstallString | Format-List
            exit 1
          }
          Write-Host "the Add/Remove Programs entry is gone"

          $menu = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Filter 'Ship Window Demo*' -ErrorAction SilentlyContinue
          if ($menu) {
            Write-Host "a Start-Menu shortcut survived the uninstall:"
            $menu | Select-Object -ExpandProperty FullName
            exit 1
          }
          Write-Host "no Start-Menu shortcut left"

      # ── 4. THE SECOND COMPILER ──────────────────────────────────────────────
      #
      # The same document, compiled by the other family. `Source=` is relative to
      # the directory holding the `.wxs` (`root/…`), so `root/` is reconstructed
      # here by expanding the program-directory zip and renaming its top level —
      # which is also a check in its own right that the zip and the installer carry
      # the same tree.
      - name: Compile the SAME .wxs with WiX v3
        shell: pwsh
        working-directory: ${{ runner.temp }}/msi
        run: |
          $zips = @(Get-ChildItem -Recurse -Filter *.zip)
          $wxs  = @(Get-ChildItem -Recurse -Filter *.wxs)
          if ($zips.Count -ne 1 -or $wxs.Count -ne 1) {
            Write-Host "expected exactly one .zip and one .wxs, found $($zips.Count) and $($wxs.Count):"
            Get-ChildItem -Recurse | Select-Object -First 30 -ExpandProperty FullName
            exit 1
          }
          Expand-Archive -Path $zips[0].FullName -DestinationPath . -Force
          # `root/` is what the document's relative `Source=` attributes resolve
          # against, and rebuilding it from the ZIP is a check in its own right: the
          # installer and the archive have to carry the same tree.
          Move-Item "Ship Window Demo" root
          Get-ChildItem root | Select-Object -First 10
          candle.exe -nologo -arch x64 -out obj\ $wxs[0].FullName
          light.exe -nologo -out wix.msi obj\$($wxs[0].BaseName).wixobj
          Get-Item wix.msi | Select-Object Name, Length

      - name: Upload the WiX-built installer (for the Linux cross-read)
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-wix-win32-x64
          path: ${{ runner.temp }}/msi/wix.msi
          if-no-files-found: error

  # THE OTHER HALF OF THE CROSS-CHECK. `msiinfo` — msitools — reads back a database
  # WiX wrote, which is the one read in this milestone where the reader's package
  # and the writer's package are genuinely different. `verify-msi.sh`'s third
  # argument is `!msitools`: the script refuses the file if its summary information
  # says msitools produced it, so a job pointed at the wrong artifact fails instead
  # of passing as a self-oracle.
  windows-msi-crossread:
    name: WiX-built MSI read back by msitools (Linux / win32-x64)
    runs-on: ubuntu-latest
    needs: windows-msi-install
    if: ${{ !cancelled() && needs.windows-msi-install.result == 'success' }}
    timeout-minutes: 20
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - name: Checkout (for the reader script)
        uses: actions/checkout@v4

      - name: Download the WiX-built installer
        uses: actions/download-artifact@v4
        with:
          name: windows-msi-wix-win32-x64
          path: incoming

      - name: Download the program-directory zip it should describe
        uses: actions/download-artifact@v4
        with:
          name: windows-dir-selfcontained-win32-x64
          path: incoming

      - name: Unpack the program directory
        working-directory: incoming
        run: |
          unzip -qq "$(ls *.zip | head -1)"
          ls -l

      # `wixl` is not used here and that is the point: this job's msitools only
      # READS. The version is printed so a failure can be attributed to a reader
      # change rather than to the file.
      - name: Read the WiX-built database with msitools
        working-directory: incoming
        run: |
          msiinfo -v
          bash "${GITHUB_WORKSPACE}/.github/ship-oracle/verify-msi.sh" \
            wix.msi "Ship Window Demo" '!msitools'

  # Adwaita Storybook capstone — BUILD the `--app node` bundle. The full
  # @gjsify/storybook Libadwaita component gallery (showcases/gtk/adwaita-storybook,
  # 35 *.story.ts) built for the node-gi reverse bridge via
  # `gjsify storybook --runtime node` (consumer #1 of the reverse bridge). node-gi is
  # kept EXTERNAL, so this build needs NO C++ toolchain / GTK / display — just the
  # workspace + a Node bundler. Uploads the single-file bundle for BOTH the Linux
  # parity leg (gtk-smoke) and the Windows capstone (windows-gtk-storybook).
  #
  # BUILD ENGINE — under Node, not GJS (same rationale as consumer-sqlite): the
  # workspace `.bin/gjsify` is GJS-first and its `gjsify build` needs
  # `@gjsify/rolldown-native` (a vala/meson prebuild absent in this container), so
  # every build here runs under Node via a published `@gjsify/cli` (npm rolldown).
  storybook-node-gi-bundle:
    name: Adwaita Storybook --app node bundle (build / Node / Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      # libsoup3 supplies the Soup-3.0 typelib the committed `cli.gjs.mjs` GJS
      # bundle EAGERLY imports at load (the network commands' fetch chain) — any
      # `gjsify` CLI invocation via the GJS bundle crashes without it, so the
      # `gjsify install` step below needs it (same as the other CLI-running jobs).
      - name: Verify the baked toolchain
        run: |
          gjs --version

      # Official nodejs.org build, NOT Fedora's dnf node (which crashes rolldown's
      # prebuilt napi binding — the gjsify bundler engine).
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout
        uses: actions/checkout@v4

      # Node-free workspace install via the published CLI (the supported
      # `gjsify install --immutable` path). The showcase depends on workspace
      # `@gjsify/storybook` (+ deps) which must be present + built.
      - name: Install the gjsify workspace (published CLI, Node-free)
        run: |
          B=$(gjs -m install.mjs --fetch-only)
          gjs -m "$B" install --immutable

      # A published @gjsify/cli (npm rolldown) is the BOOTSTRAP bundler: the committed
      # GJS bundle needs the absent @gjsify/rolldown-native, and the published cli
      # ships a prebuilt Node entry. It is NOT the bundler under test. A job that
      # builds with the LAST RELEASE cannot observe a change to the bundler in THIS
      # checkout, and that is not hypothetical: the storybook proof went red on a
      # defect #890 had already fixed in source, and STAYED red, because the published
      # cli carried the pre-fix detector. The bootstrap's only job is to build this
      # checkout's cli; from there on we use that one.
      - name: Bootstrap a Node bundler, then switch to this checkout's cli
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          # Prefer the version this checkout declares, but do NOT require it to be
          # on npm yet. The release commit bumps every package.json and only THEN
          # does release.yml publish, so between those two events this step asks
          # npm for a version that provably does not exist — `npm error notarget
          # No matching version found for @gjsify/cli@<v>` — and reddens main on
          # every single release. A recurring, self-resolving red teaches people
          # to ignore the signal. Same guard napi.yml already carries.
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && "${GITHUB_WORKSPACE}/.github/scripts/install-published-cli.sh" "${CLI_VERSION}" )
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          echo "Bootstrap bundler: $(node_modules/.bin/gjsify --version)"

          # ...and that is only the BOOTSTRAP. Build THIS checkout's CLI with it, then
          # switch over, so everything below is gated by the source in this PR rather
          # than by the last release.
          PATH="$PWD/node_modules/.bin:$PATH" node_modules/.bin/gjsify run build:infra
          ln -sfn "$PWD/packages/infra/cli/lib/index.js" node_modules/.bin/gjsify
          echo "Node bundler (this checkout): $(node_modules/.bin/gjsify --version)"

      # Build @gjsify/storybook's lib (+ its transitive workspace deps incl.
      # @gjsify/devtools, which the storybook probe uses) so the showcase bundle
      # resolves them. build:gjsify (the --library step) emits lib/esm/*.js, which is
      # all the --app node bundle inlines — no .d.ts emit needed here.
      - name: Build @gjsify/storybook lib under Node (+ workspace deps)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          gjsify workspace @gjsify/storybook build:gjsify --with-dependencies

      # `gjsify storybook --runtime node --build-only` discovers the showcase's
      # *.story.ts, generates the entry, and builds it --app node (gi:// → requireGi,
      # @gjsify/node-gi external). Assert it is a real node-gi bundle.
      - name: Build the Adwaita Storybook --app node bundle
        working-directory: showcases/gtk/adwaita-storybook
        run: |
          export PATH="$PWD/../../../node_modules/.bin:$PATH"
          # `set -x` + an explicit status check: this step failed twice with
          # NOTHING but "Found 35 story file(s)" and exit 1 — no error, no
          # stack, and it reproduces green locally with the same commit. A
          # silent non-zero is not a puzzle to solve by inspection, it is one
          # to make legible, so surface which command died and with what.
          set -x
          gjsify storybook --runtime node --build-only --out dist/storybook.node.mjs || {
              rc=$?
              echo "::error::gjsify storybook exited ${rc} with no diagnostic output."
              echo "--- storybook entry the CLI generated ---"
              cat node_modules/.cache/gjsify-storybook/entry.ts 2>/dev/null | head -40 || echo "(no entry written)"
              echo "--- is @gjsify/node-gi resolvable from here? ---"
              node -e 'console.log(require.resolve("@gjsify/node-gi/package.json"))' 2>&1 | head -3
              exit "${rc}"
          }
          node --check dist/storybook.node.mjs
          # The assertions are where it actually dies (set -x proved it: the
          # build and node --check both pass, `grep -q requireGi` is the last
          # traced command). A bare `grep -q` reports only "not found", so dump
          # what the bundle DOES contain instead of guessing again.
          if ! grep -q requireGi dist/storybook.node.mjs; then
              echo "::error::bundle has no requireGi — gi:// was never rewritten, so nodeGiGlobalsInject did not fire."
              echo "--- bytes: $(wc -c < dist/storybook.node.mjs) ---"
              echo "--- @gjsify/node-gi occurrences: $(grep -c '@gjsify/node-gi' dist/storybook.node.mjs || true) ---"
              echo "--- gi:// occurrences: $(grep -c 'gi://' dist/storybook.node.mjs || true) ---"
              echo "--- static imports in the emitted bundle ---"
              grep -oE "^import[^;]{0,120};" dist/storybook.node.mjs | head -20
              echo "--- generated entry ---"
              head -20 node_modules/.cache/gjsify-storybook/entry.ts 2>/dev/null || echo "(no entry)"
              exit 1
          fi
          grep -q "@gjsify/node-gi" dist/storybook.node.mjs
          if grep -q "gi://" dist/storybook.node.mjs; then echo "raw gi:// left in bundle"; exit 1; fi
          echo "storybook --app node bundle OK ($(wc -c < dist/storybook.node.mjs) bytes)"

      - name: Upload the storybook --app node bundle
        uses: actions/upload-artifact@v4
        with:
          name: storybook-node-gi-bundle
          path: showcases/gtk/adwaita-storybook/dist/storybook.node.mjs
          if-no-files-found: error

  # Windows Adwaita Storybook capstone — PROVE the FULL @gjsify Libadwaita component
  # gallery realizes + renders on windows-latest via node-gi, with the batteries-
  # included FULL-windowing GTK bundle as the ONLY GTK (NEVER installs gvsbuild).
  # Mirrors windows-gtk-windowing: download the --windowing bundle + the win32 addon
  # prebuild into the sibling prebuilds/ layout, PLUS the prebuilt --app node storybook
  # bundle (storybook-node-gi-bundle). The bundle is placed IN the node-gi package dir
  # so its external `@gjsify/node-gi/gi` import self-resolves (Node package self-
  # reference). GJSIFY_STORYBOOK_PROBE drives it headlessly IN-PROCESS (no DBus session
  # bus — robust on windows-latest): the StorybookApplication window realizes, the
  # sidebar lists the component categories, a representative story (Boxed Lists/Switch
  # Row) opens + renders an AdwSwitchRow subtree (DumpTree), and the window rasterises
  # to a non-empty PNG via the GSK renderer (Screenshot) — then quits 0/1. On win32 the
  # display gate is implicit (GdkWin32 supplies the surface); GSK_RENDERER=cairo forces
  # software rendering. node-gi's loader wires the windowing bundle (PATH for the DLLs +
  # GSETTINGS_SCHEMA_DIR / GDK_PIXBUF_MODULE_FILE / XDG_DATA_DIRS for schemas/loaders/
  # icons) off the gschemas.compiled marker.
  windows-gtk-storybook:
    name: Windows Adwaita Storybook proof (no gvsbuild / windows-latest x64)
    runs-on: windows-latest
    needs: [windows, windows-gtk-windowing-runtime, storybook-node-gi-bundle]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Never installs gvsbuild. Hard-fail if a gvsbuild GTK tree is present (it would
      # muddy the proof — the windowing bundle must be the ONLY GTK).
      - name: Assert gvsbuild GTK is NOT present (clean host)
        shell: pwsh
        run: |
          if (Test-Path 'C:\gtk-build\gtk\x64\release\bin\glib-2.0-0.dll') {
            Write-Host "gvsbuild GTK is present — not a clean storybook test"
            exit 1
          }
          Write-Host "clean host — gvsbuild GTK was never installed in this job"

      # Stage the windowing bundle + addon prebuild in the sibling layout node-gi's
      # loader expects (prebuilds/win32-x64/{node_gi.node, gtk/}), plus the storybook
      # bundle IN the package dir (self-reference resolves @gjsify/node-gi/gi).
      - name: Download FULL-windowing GTK runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: gtk-runtime-win32-x64-windowing
          path: packages/node-gi/node-gi/prebuilds/win32-x64/gtk

      - name: Download node-gi addon prebuild (from the windows job)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64

      - name: Download the Adwaita Storybook --app node bundle
        uses: actions/download-artifact@v4
        with:
          name: storybook-node-gi-bundle
          path: packages/node-gi/node-gi

      - name: Verify staged layout
        shell: pwsh
        run: |
          Get-ChildItem packages/node-gi/node-gi/prebuilds/win32-x64
          "storybook bundle: $(Test-Path packages/node-gi/node-gi/storybook.node.mjs)"
          "schemas: $(Test-Path packages/node-gi/node-gi/prebuilds/win32-x64/gtk/share/glib-2.0/schemas/gschemas.compiled)"
          "loaders: $(Test-Path packages/node-gi/node-gi/prebuilds/win32-x64/gtk/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache)"

      # The capstone: the full Adwaita gallery renders on node-gi from the windowing
      # bundle. NODE_GI_NATIVE=prebuild loads the staged addon; the loader's PATH-prepend
      # + windowing-env wiring resolves the DLLs + schemas/loaders/icons from the bundle.
      - name: Storybook proof — full Adwaita gallery renders on node-gi (no gvsbuild GTK)
        working-directory: packages/node-gi/node-gi
        env:
          NODE_GI_NATIVE: prebuild
          GSK_RENDERER: cairo
          GJSIFY_STORYBOOK_PROBE: '1'
          GJSIFY_STORYBOOK_PROBE_STORY: 'Boxed Lists/Switch Row'
          GJSIFY_STORYBOOK_PROBE_STORY_WIDGET: 'AdwSwitchRow'
          GJSIFY_STORYBOOK_PROBE_OUT: storybook-probe.json
        shell: pwsh
        run: |
          node storybook.node.mjs
          $code = $LASTEXITCODE
          Write-Host "--- probe result ---"
          if (Test-Path storybook-probe.json) { Get-Content storybook-probe.json }
          exit $code
