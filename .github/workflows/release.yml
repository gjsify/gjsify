# Workflow to automatically publish packages to npm on new releases
name: Release to NPM

on:
  release:
    types: [published]
  # Manual reruns. Two scenarios:
  #   1. Re-publish + (re-)upload assets for a real existing release whose
  #      original `release`-event run didn't finish (e.g. asset upload was
  #      skipped because an earlier manual rerun trampled the release
  #      context). Pass the tag in `release_tag`; the workflow checks out
  #      that tag, rebuilds, and uploads the assets to the named release.
  #      Defaults to skip_publish=true so npm isn't republished (already
  #      done by the original run).
  #   2. Ad-hoc smoke test from main with no release attached. Leave
  #      `release_tag` empty.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to (re)upload assets to (e.g. v0.4.15). Leave empty for a no-op dispatch from main.'
        required: false
        default: ''
      skip_publish:
        description: 'Skip the npm publish step (default true — re-uploads are for fixing missing release assets; npm side already published).'
        required: false
        type: boolean
        default: true
      runtime:
        description: >-
          Cold-tree bootstrap runtime, normally FORWARDED by release-cut.yml rather than chosen here.
          Switches only that step — see .github/scripts/bootstrap-cold-tree.sh for what Node still
          drives either way, including publish-napi's Node-only facade bootstrap, which no input reaches.
        required: false
        type: choice
        options: [node, gjs]
        default: node
      verify_only:
        description: 'Run `gjsify foreach publish --check-trusted` against every package and skip the actual publish. Used to audit Trusted Publisher configs on npmjs.com after configuring them — the OIDC JWT issued for THIS workflow file matches the configured `release.yml` Trusted Publishers.'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      # contents: write so softprops/action-gh-release can upload install.mjs
      # + cli.gjs.mjs + .sha256 as assets onto the release record that
      # triggered this workflow. id-token: write keeps OIDC provenance
      # available for future signed-publish work. packages: read lets the job
      # pull the prebuilt ci-fedora image from ghcr (same as main.yml).
      # actions: write is for the cross-platform dispatch at the end of the job —
      # see there; same widening, same reason, as release-cut.yml's dispatch of
      # THIS workflow.
      contents: write
      id-token: write
      packages: read
      actions: write
    container:
      # Build + publish on the SAME prebuilt CI image main.yml builds/tests on —
      # it bundles every build dependency (gjs, gtk4 / libadwaita / blueprint,
      # libatomic, …), so this job needs no manual `dnf install`. Standardised on
      # Fedora 44; the bare fedora:43 image was dropped (its Node 26 binary failed
      # to load libatomic.so.1, and f44 is the supported platform).
      image: ghcr.io/gjsify/ci-fedora:44

    steps:
      # `release` event auto-checks-out the tag. `workflow_dispatch` with a
      # `release_tag` input must explicitly target that tag so the rebuilt
      # bundle + install.mjs match what shipped (not main HEAD).
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # OIDC mode: no `registry-url` here. When set, actions/setup-node
      # injects `NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX` as a literal
      # placeholder into the job env so the generated .npmrc has SOME
      # token reference to expand. That placeholder leaks into every
      # subprocess as a non-empty NODE_AUTH_TOKEN, which `gjsify publish`
      # auto-detect (`!process.env.NODE_AUTH_TOKEN`) then interprets as
      # "user opted into token auth" and skips OIDC — defeating the
      # entire Trusted Publishing setup. Dropping `registry-url` makes
      # setup-node not write the placeholder npmrc; gjsify publish reads
      # the registry from the package's own `publishConfig.registry`
      # (or DEFAULT_REGISTRY) and authenticates via OIDC exchange.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      # Node-free install via the PUBLISHED gjsify (ADR 0002).
      # Mirrors main.yml — see .github/actions/gjsify-setup for the rationale.
      # `GJSIFY_BOOTSTRAP` is what the next step (and `resolve-gjsify.mjs`)
      # falls back to: this tree is installed but not yet built, so the
      # `node_modules/.bin` shim points at two files that do not exist yet.
      - name: Install dependencies (gjsify install --immutable)
        run: |
          B=$(gjs -m install.mjs --fetch-only)
          gjs -m "$B" install --immutable
          echo "GJSIFY_BOOTSTRAP=$B" >> "$GITHUB_ENV"

      - name: Bootstrap the build toolchain (cold trees only)
        run: .github/scripts/bootstrap-cold-tree.sh "${{ inputs.runtime || 'node' }}"

      - name: Build packages
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run build

      - name: Build examples
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run build:examples

      # Trusted-Publisher audit. Runs when `gh workflow run release.yml
      # -f verify_only=true` is invoked. The OIDC JWT issued for this
      # workflow file matches the `release.yml` filename configured per
      # package as Trusted Publisher on npmjs.com, so a `--check-trusted`
      # exchange succeeds for every correctly-configured package and 4xx
      # for every misconfigured one. Always exits 0; read the GitHub Step
      # Summary for the per-bucket counts + list of failing packages.
      - name: Verify Trusted Publishers (audit mode)
        if: ${{ inputs.verify_only == true }}
        id: check_trusted
        env:
          GJSIFY_PUBLISH_DEBUG: "1"
        run: |
          set -o pipefail
          PATH="$PWD/node_modules/.bin:$PATH" \
            gjsify foreach -v --no-private \
              --exclude '@girs/*' \
              --exec -- gjsify publish --check-trusted \
            2>&1 | tee /tmp/check-trusted.log

          MISCONFIGURED=$(grep -cE "(^|\] )✗ " /tmp/check-trusted.log || true)
          OK=$(grep -cE "(^|\] )✓ " /tmp/check-trusted.log || true)
          SKIPPED=$(grep -cE "(^|\] )- " /tmp/check-trusted.log || true)

          {
            echo "## Trusted Publisher verification"
            echo ""
            echo "| Status | Count |"
            echo "|---|---|"
            echo "| ✓ Configured        | $OK |"
            echo "| ✗ Misconfigured     | $MISCONFIGURED |"
            echo "| - Skipped (private) | $SKIPPED |"
            echo ""
            if [ "$MISCONFIGURED" -gt 0 ]; then
              echo "### Misconfigured packages"
              echo ""
              echo "Each row below means the OIDC token exchange returned non-2xx for that package. Most common cause: no Trusted Publisher entry yet — add one at https://www.npmjs.com/package/<name>/access with Repository: gjsify/gjsify, Workflow: release.yml."
              echo ""
              FENCE='```'
              echo "$FENCE"
              grep -E "(^|\] )✗ " /tmp/check-trusted.log || true
              echo "$FENCE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish to npm on the `release` event (always) or on
      # workflow_dispatch with skip_publish=false. Never runs in
      # `verify_only` mode — that path is a pure audit.
      # Authentication mode: npm Trusted Publishing (OIDC). `gjsify publish`
      # auto-detects the GitHub Actions OIDC env vars (the workflow has
      # `id-token: write` above) and, with no NODE_AUTH_TOKEN present,
      # exchanges the runner-minted JWT at npm's
      # `/-/npm/v1/oidc/token/exchange/package/<name>` endpoint for a
      # short-lived publish token per package. The 104 stable @gjsify/*
      # packages have Trusted Publisher entries configured for this
      # repo + workflow on npmjs.com (verified via the `verify_only`
      # audit before this cutover). Long-lived `NPM_TOKEN` secret can
      # be removed once a real OIDC release completes successfully.
      - name: Publish packages to npm
        if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run npm:publish
        env:
          GJSIFY_PUBLISH_DEBUG: "1"

      # Phase F: ship install.mjs + cli.gjs.mjs as GitHub-release assets so end
      # users can bootstrap gjsify (or any gjsify-based GJS app) with a single
      # `curl ... | gjs -m -` line, no npm/Node required. The bundle was
      # rebuilt above by `gjsify run build` (executes build:gjs-bundle).
      #
      # THIS IS NO LONGER THE PRIMARY UPLOAD — `release-cut.yml` now ships these
      # three files immediately after it creates the release, and asserts the
      # documented URLs resolve before it dispatches this workflow. It has to:
      # this phase runs after the ~130-package serial npm publish, and the gap
      # between "release published" and "assets present" was a MEASURED two-hour
      # window in which `releases/latest/download/install.mjs` 404'd — breaking
      # the documented install path and all of ts-for-gir's CI. See the comment
      # at that step for the full incident.
      #
      # It stays because it is the RECOVERY path, and re-uploading identical
      # bytes is a no-op: asset upload fires on the original `release` event and
      # on manual reruns that target a specific tag — the second path is the fix
      # for the v0.4.15 incident (release-event run failed, the manual reruns
      # that followed silently skipped the upload because the original gate was
      # hard-pinned to `event_name == 'release'`). A cut that dies between
      # creating the release and uploading still has one way to land the assets.
      - name: Generate cli.gjs.mjs.sha256
        if: ${{ (github.event_name == 'release' || inputs.release_tag != '') && inputs.verify_only != true }}
        run: |
          cd packages/infra/cli/dist
          sha256sum cli.gjs.mjs | awk '{print $1}' > cli.gjs.mjs.sha256
          cat cli.gjs.mjs.sha256

      - name: Upload installer + bootstrap bundle to GitHub release
        if: ${{ (github.event_name == 'release' || inputs.release_tag != '') && inputs.verify_only != true }}
        uses: softprops/action-gh-release@v3
        with:
          # On `release` softprops infers tag_name from the event payload.
          # On `workflow_dispatch` we must pass it explicitly so the action
          # targets the operator-specified tag instead of attempting to
          # create a new release from HEAD.
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: |
            install.mjs
            packages/infra/cli/dist/cli.gjs.mjs
            packages/infra/cli/dist/cli.gjs.mjs.sha256

      # The cross-platform probe used to be dispatched from HERE, at the end of
      # this job. It now has its own job, `dispatch-cross-platform-probe`, gated
      # on `publish-node-gi` — see the reasoning and the measurement there.
      # Dispatching after THIS job was still too early for everything the probe
      # asserts about `@gjsify/node-gi`, which is published several jobs later.

      - name: Summary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'manual' }}
        run: |
          echo "Packages successfully published to npm for release ${RELEASE_TAG}"
          echo "Published packages: @gjsify/*"

  # macOS publish legs for the batteries-included GTK runtime bundles — ONE JOB, one
  # matrix leg per macOS arch (@gjsify/gtk-runtime-darwin-arm64 on `macos-latest`,
  # @gjsify/gtk-runtime-darwin-x64 on `macos-15-intel`, the last x86_64 macOS image
  # Actions offers).
  #
  # WHY A SEPARATE JOB: each package ships a HEAVY, relocated macOS GTK/GI dylib +
  # typelib closure in its `gtk/` dir. That bundle is gitignored and can ONLY be
  # produced on a darwin runner OF THAT ARCH (Homebrew closure ->
  # install_name_tool/@loader_path relocation -> ad-hoc codesign, see the shared
  # packages/node-gi/scripts/build-gtk-runtime-darwin.mjs). The ubuntu `publish` job
  # above cannot build it, and it never tries to: `packages/node-gi/*` is NOT a root
  # workspace (see root package.json#workspaces), so `gjsify foreach` — the
  # enumerator behind `gjsify run npm:publish` — never touches these packages.
  # Without this job the published tarball is only ever an empty ~18 KB shell (the
  # arm64 package's first 0.19.0 publish was exactly that: isPresent=false, so macOS
  # consumers silently fell back to Homebrew GTK). Here we BUILD the bundle on macOS
  # and OIDC-publish JUST that one package WITH the populated `gtk/`, so
  # `require('@gjsify/gtk-runtime-darwin-<arch>')` reports isPresent=true and the "no
  # brew needed" promise is actually delivered.
  #
  # WHY A MATRIX RATHER THAN A SECOND JOB: the two packages share ONE builder (the
  # relocation pass is arch-agnostic; the script derives its target from the running
  # Node and cross-checks `--out` against the destination package's own os/cpu), so
  # every path below derives from `matrix.arch`. Copying ~90 lines of job would have
  # been the duplication. The Windows sibling stays its own job — its builder is
  # genuinely different (no relocation; Windows resolves DLLs by search path).
  #
  # RACE SAFETY: `packages/node-gi/*` not being a workspace means the ubuntu job can
  # never enumerate — let alone shell-publish — these packages (nothing can overwrite
  # a real bundle with an empty one). If `packages/node-gi/*` is EVER added to the
  # root `workspaces` list, add `--exclude '@gjsify/gtk-runtime-*'` to the
  # `npm:publish` script's `gjsify foreach` so the ubuntu job keeps skipping them.
  #
  # `needs: publish` so @gjsify/cli@<release-version> is already on npm (this job
  # installs it to drive the OIDC publish) and the publish legs are serialized.
  publish-gtk-runtime-darwin:
    name: Publish @gjsify/gtk-runtime-darwin-${{ matrix.arch }} (macOS bundle)
    # `node-gi-prebuild-darwin` because the builder now DECODES one of the icons it just
    # bundled and records the result for the gate (#996) — which needs a node-gi addon,
    # and the one this run built is the only one reachable (a GitHub artifact belongs to
    # the run that produced it, so node-gi.yml's upload is not). Same `if` on both jobs,
    # so they skip and run together.
    #
    # THIS WIDENS THE COUPLING, deliberately: `needs` is per-JOB, and
    # node-gi-prebuild-darwin is a two-arch MATRIX that GitHub reports failed if either
    # leg failed — so an Intel Homebrew hiccup now also skips the arm64 bundle publish,
    # not just the arm64 one, which is a weaker promise than the `fail-fast: false`
    # note below makes on its own. Accepted rather than repaired by splitting the matrix
    # into two per-arch jobs: publish-node-gi already needs the WHOLE matrix (a
    # single-arch prebuild set must never publish), so that scenario already degrades
    # the release, and a split would put a THIRD verbatim copy of the brew formula line
    # on the release path — the copy that job's own header argues hardest against.
    needs: [publish, node-gi-prebuild-darwin]
    # Same gate as the ubuntu npm-publish step: a real release, or a dispatch that
    # opts INTO publishing; never in verify_only (audit) mode. On an asset-only
    # re-upload dispatch (skip_publish=true) this whole job is skipped.
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # NOT fail-fast: one arch's leg here must not CANCEL the other arch's publish. A
      # failed leg leaves that ONE package at the previous version, which is recoverable
      # by re-dispatching; cancelling both is not better. NB this covers THIS matrix
      # only — the `needs:` note above records the case where neither leg starts.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    permissions:
      # id-token: write = npm Trusted Publishing (OIDC). The package's Trusted
      # Publisher is configured for THIS workflow file (release.yml), so an OIDC
      # exchange from any job in it succeeds. contents: read is for checkout.
      contents: read
      id-token: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      # `release` event auto-checks-out the tag; a `workflow_dispatch` must target
      # the operator-specified tag so the built bundle matches what shipped. Mirrors
      # the ubuntu publish job's checkout ref.
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Build-time closure SOURCE only — these libraries are collected + relocated
      # INTO the self-contained bundle, they are NOT a runtime dep of the tarball.
      # Verbatim from .github/workflows/node-gi.yml -> macos-gtk-windowing-runtime
      # (NOT the display-free macos-gtk-runtime): gtksourceview5 backs the GtkSource-5
      # typelib and adwaita-icon-theme supplies share/icons, both of which the
      # --windowing bundle below needs — and now asserts, so a missing formula fails
      # the build instead of quietly shipping a bundle without Adwaita.
      # `glib-networking` is NAMED although brew's `gstreamer` already depends on it.
      # It supplies lib/gio/modules/libgiognutls.so — the GIO TLS backend the bundle
      # ships as its `tls-backend` data set, without which souphttpsrc resolves and then
      # fails on every https URL. A transitive dep is a fact about today's formula; this
      # is the one the builder asserts.
      - name: Install GTK4 + Adwaita + GtkSource + icons + GObject-Introspection (build-time closure source)
        run: brew install gtk4 libadwaita gtksourceview5 adwaita-icon-theme gobject-introspection cairo pango gdk-pixbuf graphene pkg-config gstreamer glib-networking

      # Node 24 runs build-gtk-runtime-darwin.mjs (node:child_process/fs) and the publish.
      # No `registry-url` here — setting it makes actions/setup-node inject a
      # placeholder NODE_AUTH_TOKEN, which `gjsify publish` reads as "token auth
      # requested" and skips OIDC (see the ubuntu publish job's note). Omitting it
      # keeps the OIDC Trusted-Publishing path.
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Populate the gitignored gtk/ bundle so `files: ["gtk"]` ships it (the packer
      # expands a plain-dir entry recursively). `--addon`/`--stage` relocate a THROWAWAY
      # copy of the addon beside a throwaway copy of the bundle, in RUNNER_TEMP: that
      # sibling layout is what the decode probe loads (#996), and none of it is in
      # `files`, so nothing about it reaches the tarball.
      #
      # --windowing, i.e. the SUPERSET, because this is the bundle that gets PUBLISHED.
      # Up to and including 0.27.1 this step built the display-free variant, and the
      # tarball measurably showed it: `"windowing": false`, `"dataBytes": 0`, no
      # `share/` at all, and — because the brew typelib dir was copied wholesale —
      # `Adw-1.typelib` WITHOUT libadwaita, so `new Adw.Application()` died with
      # "Failed to load shared library 'libadwaita-1.0.dylib'" and every
      # GSettings-backed API and icon lookup silently misbehaved. The display-free
      # variant is the CONFORMANCE bundle (its closure is exactly what the display-free
      # conformance loads) and node-gi.yml keeps building it; a consumer installing
      # "batteries-included GTK" wants the complete runtime.
      # The decode probe's consumer half. NOT part of this tarball: the builder stages a
      # relocated COPY beside a copy of the bundle, loads it there and throws both away.
      - name: Download node-gi addon prebuild (for the decode probe)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-darwin-${{ matrix.arch }}
          path: addon

      - name: Build the GTK runtime bundle (--windowing superset, populate gtk/)
        run: |
          node packages/node-gi/scripts/build-gtk-runtime-darwin.mjs \
            --windowing \
            --out packages/node-gi/gtk-runtime-darwin-${{ matrix.arch }}/gtk \
            --addon "$PWD/addon/node_gi.node" \
            --stage "$RUNNER_TEMP/decode-probe-stage"

      # Gate the publish on a genuinely populated, portable, COMPLETE bundle. The build
      # step is already the hard gate on relocation (it fails on any surviving reference
      # into the brew prefix), on typelib/library symmetry and on license coverage; this
      # re-asserts the properties of the ARTIFACT — with a DERIVED prefix, because
      # `/opt/homebrew` hardcoded is vacuously absent on the Intel leg, where the prefix
      # is /usr/local — plus the two dirs index.js's isPresent check needs, plus that the
      # bundle's own derived target stamp matches this leg.
      - name: Verify bundle (relocation clean + windowing data + licenses + layout)
        env:
          TAG: darwin-${{ matrix.arch }}
        run: |
          B="packages/node-gi/gtk-runtime-$TAG/gtk"
          BREW_PREFIX="$(brew --prefix)"
          cat "$B/manifest.json"
          echo "--- bundle size ---"; du -sh "$B"
          echo "--- assert NO $BREW_PREFIX refs remain in the bundle ---"
          if otool -L "$B"/lib/*.dylib | grep -F "$BREW_PREFIX"; then
            echo "RELOCATION FAILED: bundled dylibs still reference $BREW_PREFIX"; exit 1
          fi
          if [ ! -d "$B/lib" ] || [ ! -d "$B/girepository-1.0" ]; then
            echo "BUNDLE INCOMPLETE: gtk/lib + gtk/girepository-1.0 are required (index.js isPresent)"; exit 1
          fi
          echo "--- assert this is the WINDOWING superset, not the display-free variant ---"
          test -f "$B/girepository-1.0/Adw-1.typelib" || { echo "Adw-1.typelib MISSING — not the windowing bundle"; exit 1; }
          ls "$B"/lib | grep -qi adwaita || { echo "libadwaita MISSING — Adw would fail in the constructor"; exit 1; }
          # Each declared data set, asserted on BYTES rather than on a directory: a
          # `test -d share/icons` is satisfied by a link to the build host's Homebrew
          # Cellar, which is how 0.2 MiB of links once passed for a 22 MB icon theme.
          test -s "$B/share/glib-2.0/schemas/gschemas.compiled" || { echo "gschemas.compiled MISSING/EMPTY — Gio.Settings would fail"; exit 1; }
          ls "$B"/share/icons/*/index.theme >/dev/null 2>&1 || { echo "no icon theme with an index.theme — icon lookups would silently fail"; exit 1; }
          test -n "$(find "$B/share/gtksourceview-5" -type f -size +0 2>/dev/null | head -1)" || { echo "share/gtksourceview-5 MISSING/EMPTY — the bundle ships the GtkSource namespace"; exit 1; }
          echo "--- assert the third-party terms ship with the binaries ---"
          test -s "$B/THIRD-PARTY-NOTICES.md" || { echo "THIRD-PARTY-NOTICES.md MISSING or empty"; exit 1; }
          test -d "$B/licenses" || { echo "licenses/ MISSING — relocated LGPL binaries with no terms attached"; exit 1; }
          # The manifest half is a SCRIPT, shared with the win32 leg, because it was
          # twice an inline `node -e '…'` whose last line spliced `join('+')` into a
          # single-quoted shell string — the shell closed the body there and node died
          # with a SyntaxError before one assertion ran, failing all three v0.28.0
          # bundle publishes while the bundles themselves were correct. Guarded against
          # regrowth by scripts/check-workflow-inline-scripts.mjs.
          node packages/node-gi/scripts/verify-bundle-manifest.mjs \
            --bundle "$B" \
            --expect-host-target darwin
          echo "clean — bundle populated, portable, complete + license-covered"

      # A Node-runnable @gjsify/cli at the release-train version drives the OIDC
      # publish: the committed cli.gjs.mjs bundle would need gjs + @gjsify/rolldown-
      # native (absent here) and `packages/infra/cli/lib/` is a build output this cold
      # checkout does not carry, so the published tarball is the only Node-runnable
      # CLI these legs have. `needs: publish` puts that version on npm.
      #
      # A SCRIPT, not shell, for the reason `verify-bundle-manifest.mjs` above is one:
      # this body was three bash copies plus a PowerShell transliteration of the same
      # six commands, and inline shell in a workflow that never runs on a pull request
      # is held by no check and first executes during a release. `needs: publish`
      # fixes the ORDER; the script also survives the registry lag that outlives a
      # correct order — incident in scripts/npm-install-published.mjs, assertions in
      # tests/e2e/npm-install-propagation-retry/.
      - name: Prepare a Node-runnable @gjsify/cli
        id: cli
        run: node scripts/bootstrap-published-cli.mjs

      # OIDC Trusted Publishing from release.yml — publishes ONLY this package, WITH
      # the populated gtk/ bundle. `gjsify publish` auto-detects the GitHub OIDC env
      # (id-token: write above, no NODE_AUTH_TOKEN) and exchanges the JWT for a
      # short-lived per-package token. --tolerate-republish makes a manual rerun over
      # an already-published version a no-op instead of a hard 409/403.
      - name: Publish @gjsify/gtk-runtime-darwin-${{ matrix.arch }} (OIDC, with bundle)
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
        run: |
          node "${{ steps.cli.outputs.bin }}" publish \
            packages/node-gi/gtk-runtime-darwin-${{ matrix.arch }} \
            --tolerate-republish --tag latest --access public

  # Windows publish leg for the batteries-included GTK runtime bundle — the sibling
  # of publish-gtk-runtime-darwin above (see that job's rationale in full). It stays
  # a SEPARATE job rather than a third matrix leg because its builder is genuinely
  # different, not a parameterisation: gvsbuild closure source, no relocation step,
  # no codesign, and PowerShell throughout.
  #
  # WHY A SEPARATE JOB: @gjsify/gtk-runtime-win32-x64 ships a HEAVY GTK/GI DLL +
  # typelib closure in its `gtk/` dir. That bundle is gitignored and can ONLY be
  # produced on a windows/x64 runner (gvsbuild closure -> collect the DLL closure
  # into gtk/bin, see the package's scripts/build-gtk-runtime.mjs). The ubuntu
  # `publish` job cannot build it, and it never tries to: `packages/node-gi/*` is
  # NOT a root workspace, so `gjsify foreach` (behind `gjsify run npm:publish`)
  # never touches this package — the same race-safety the darwin job relies on.
  # Here we BUILD the bundle on Windows and OIDC-publish JUST this one package WITH
  # the populated `gtk/`, so `require('@gjsify/gtk-runtime-win32-x64')` reports
  # isPresent=true and the "no gvsbuild needed" promise is actually delivered.
  #
  # UNLIKE macOS: there is NO relocation/codesign step (Windows resolves DLLs by
  # search path at LoadLibrary time), and NO addon build (the tarball ships only
  # gtk/{bin,girepository-1.0,manifest.json}; the addon prebuild is node-gi's own
  # concern in node-gi.yml).
  #
  # `needs: publish` so @gjsify/cli@<release-version> is already on npm and the two
  # publish legs are serialized.
  publish-gtk-runtime-win32-x64:
    name: Publish @gjsify/gtk-runtime-win32-x64 (Windows bundle)
    # `node-gi-prebuild-win32-x64` for the decode probe — see the darwin sibling.
    needs: [publish, node-gi-prebuild-win32-x64]
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    # windows-2022, for the reasons node-gi.yml's windows-gtk-windowing-runtime
    # records: libvpx's configure has no VS 18 target, so the gvsbuild GStreamer
    # chain cannot build on windows-latest — and the GTK half of this prefix is a
    # VS 2022 release zip anyway, so one toolset per bundle is the better shape.
    runs-on: windows-2022
    # Was 30. gvsbuild builds GStreamer's dependency chain from source on a cache
    # miss, which does not fit in half an hour; a hit skips straight past it.
    timeout-minutes: 180
    permissions:
      # id-token: write = npm Trusted Publishing (OIDC), configured for this
      # workflow file (release.yml). contents: read is for checkout.
      contents: read
      id-token: write
    env:
      GVSBUILD_VERSION: '2026.6.0'
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
    steps:
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Node 24 runs build-gtk-runtime.mjs + the publish. No `registry-url` (it would
      # inject a placeholder NODE_AUTH_TOKEN and defeat OIDC — see the ubuntu job).
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Build-time closure SOURCE only — the DLLs are collected INTO the bundle, they
      # are NOT a runtime dep of the tarball.
      # CACHED, which it was not before. Downloading the GTK zip each time was cheap;
      # BUILDING GStreamer from source is not, and without a cache every release would
      # pay it again. Key covers the gvsbuild version, so a bump rebuilds once.
      - name: Cache the gvsbuild GTK4 + GStreamer prefix
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk\x64\release
          key: gvsbuild-gtk4-gst-soup-gi-${{ env.GVSBUILD_VERSION }}-x64-v3

      - name: Download + extract gvsbuild GTK4 (build-time closure source)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      # Populate the gitignored gtk/ bundle so `files: ["gtk"]` ships it. No addon
      # relocation on Windows — `--addon` here is read by the decode probe alone
      # (Windows resolves DLLs by search path, so there is nothing to rewrite).
      #
      # --windowing, i.e. the SUPERSET, because this is the bundle that gets PUBLISHED —
      # the same correction the darwin leg above documents. Up to and including 0.27.1
      # this step built the display-free variant, and the tarball showed it:
      # `"windowing": false`, `"dataBytes": 0`, no gdk-pixbuf loaders, no GSettings
      # schemas, no icon themes, and `GtkSource-5.typelib` WITHOUT a gtksourceview DLL.
      # gvsbuild's single prefix already carries everything the superset needs, so this
      # costs only bundle size (~36 MiB, dominated by the ANGLE GL DLLs) — and nothing
      # depends on these packages, they are installed on purpose.
      # GSTREAMER, BUILT FROM SOURCE INTO THE SAME PREFIX.
      #
      # There is no prebuilt Windows GStreamer we can lift. The gvsbuild release
      # publishes exactly two assets — GTK3_Gvsbuild and GTK4_Gvsbuild — and neither
      # carries any of it: measured on the published @gjsify/gtk-runtime-win32-x64
      # tarball, all 40 typelibs present and not one of them GStreamer's, which is why
      # `new AudioContext()` threw `Failed to require Gst 1.0` on a machine whose GTK
      # worked perfectly. gstreamer.freedesktop.org ships an installer .exe for x64,
      # but it dropped the separate devel package, so whether it carries typelibs at
      # all is unverified — and an installer is the wrong thing to extract in CI.
      #
      # gvsbuild DOES define gstreamer/orc/gst-plugins-base/-good with
      # `-Dintrospection=enabled`, so building them is the path where the typelibs are
      # guaranteed and the ABI matches everything already in this prefix.
      #
      # IT WILL REBUILD DEPENDENCIES. The extracted zip carries no gvsbuild build
      # markers, so gvsbuild considers glib/gobject-introspection unbuilt and makes
      # them again from source. That is the cost of not having a prebuilt binary, and
      # it is why the cache key covers the GStreamer projects too and the timeout is
      # generous — on a cache hit this whole step is skipped.
      - name: Build GStreamer with gvsbuild (into the GTK prefix)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 150
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pipx
          python -m pipx ensurepath
          python -m pipx install "gvsbuild==$env:GVSBUILD_VERSION"
          # THE VS VERSION IS DERIVED, NOT ASSUMED. gvsbuild targets VS 17 by default
          # and windows-latest now ships 18, so it found the toolchain, SKIPPED it
          # ("Doesn't match target Visual Studio version of 17") and failed with
          # "Unable to find applicable Visual Studio". Hardcoding 18 would break the
          # same way at the next bump; vswhere already knows the answer.
          # `--vs-ver` takes gvsbuild's OWN names (vs2022, vs2026), not the major
          # version: 18 was rejected with "Choose from: vs2013 … vs2026". The obvious
          # derivation does not work either — `catalog_productLineVersion` returned
          # "18" on this image, not "2026", so it is the major here too and `vs18` was
          # rejected in turn.
          #
          # So the map is EXPLICIT, and an unknown major is a hard error rather than a
          # guess. gvsbuild enumerates the legal names itself; a wrong guess here would
          # only reproduce the same failure with a different number.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsMajor = (& $vswhere -latest -property installationVersion).Split('.')[0]
          $vsVer = switch ($vsMajor) {
            '17' { 'vs2022' }
            '18' { 'vs2026' }
            default { throw "unmapped Visual Studio major '$vsMajor' — add it here (gvsbuild spells these vs2022 / vs2026)" }
          }
          Write-Host "Visual Studio $vsMajor -> gvsbuild --vs-ver $vsVer"
          # Same prefix the zip was extracted into, so one tree carries GTK + Gst and
          # the bundle builder's single closure walk sees both.
          # `--skip libvpx`, and it is the audio-path rule applied to the BUILD
          # rather than only to the payload. gst-plugins-good declares exactly one
          # dependency beyond -base, and it is libvpx: VP8/VP9, i.e. video, which
          # gst-plugins.mjs already excludes from what ships. We were spending 15+
          # minutes compiling a codec whose output is thrown away.
          #
          # It also never once succeeded. On windows-latest its configure has no
          # `x86_64-win64-vs18` target; on windows-2022 it gets further and dies
          # moving `x64/vpxmd.lib`. GStreamer's meson features default to `auto`, so
          # an absent libvpx simply disables the vpx plugin — which is the state we
          # want anyway. -good is still built, for the parsers and decoders the audio
          # path genuinely needs: wavparse, flac, mpg123, autodetect.
          # `--enable-gi` IS THE WHOLE POINT and defaults to FALSE. gvsbuild's
          # gstreamer projects gate introspection on it — without it they pass
          # `-Dintrospection=disabled`, so the build succeeds and produces no
          # .gir/.typelib at all. Measured: a complete 16-minute GStreamer build
          # whose prefix contained zero Gst typelibs. The assertion below is what
          # caught it, at the prefix, instead of three jobs later as "no element
          # decodebin" — typelibs are the only reason we build this from source
          # rather than lifting a binary.
          # TWO INVOCATIONS, AND THE ORDER IS THE POINT. gst-plugins-good's `soup`
          # feature is meson `auto` and its ext/soup/meson.build calls `subdir_done()`
          # with a MESSAGE, not an error, when neither libsoup2 nor libsoup3 is found —
          # so building -good against a prefix without libsoup produces a complete,
          # green build with no gstsoup.dll in it, which is exactly the silent gap
          # gst-plugins.mjs § soup was measured on. gst-plugins-good does not DECLARE
          # libsoup3 as a gvsbuild dependency, so nothing orders the two for us.
          # `glib-networking` is named although libsoup3 already depends on it: it is
          # the GIO TLS backend the bundle ships as its `tls-backend` data set, and on
          # Windows the soup plugin LINKS libsoup (ext/soup/meson.build takes the
          # `host_system == 'windows'` branch instead of the dlopen loader), so an
          # https URL would still fail on the missing module alone.
          gvsbuild build --configuration release --vs-ver $vsVer --enable-gi --build-dir C:\gtk-build glib-networking libsoup3
          gvsbuild build --configuration release --vs-ver $vsVer --enable-gi --skip libvpx --build-dir C:\gtk-build gstreamer gst-plugins-base gst-plugins-good

      - name: Assert GStreamer landed in the prefix (typelibs + plugins)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The two the bundle asserts, and the plugin dir the elements come from.
          # Fail HERE rather than three jobs later with "no element decodebin".
          foreach ($t in @('Gst-1.0.typelib', 'GstApp-1.0.typelib')) {
            $p = "$env:GTK_PREFIX\lib\girepository-1.0\$t"
            if (-not (Test-Path $p)) { Write-Host "MISSING $p"; exit 1 }
          }
          $plugins = Get-ChildItem "$env:GTK_PREFIX\lib\gstreamer-1.0" -Filter *.dll -ErrorAction SilentlyContinue
          if (-not $plugins) { Write-Host "no GStreamer plugins in the prefix"; exit 1 }
          Write-Host "GStreamer: $($plugins.Count) plugin DLL(s) in the prefix"
          # NAMED, not counted. `gstsoup.dll` is the one plugin whose absence the build
          # above produces SILENTLY (a meson `message()`, then a green -good), and a
          # count of 80-odd plugins says nothing about which one is missing. Same
          # reason gst-elements.test.mjs names its elements. The GIO module beside it
          # is what makes the https half work at all.
          $soup = Join-Path $env:GTK_PREFIX 'lib\gstreamer-1.0\gstsoup.dll'
          if (-not (Test-Path $soup)) {
            Write-Host "MISSING $soup — gst-plugins-good was built without libsoup in the prefix"; exit 1
          }
          $gioModules = Get-ChildItem "$env:GTK_PREFIX\lib\gio\modules" -Filter *.dll -ErrorAction SilentlyContinue
          if (-not $gioModules) { Write-Host "no GIO module in the prefix — glib-networking did not build"; exit 1 }
          Write-Host "GIO modules: $($gioModules.Count) DLL(s) (the TLS backend)"

      # The decode probe's consumer half (#996). NOT part of this tarball.
      - name: Download node-gi addon prebuild (for the decode probe)
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: addon

      - name: Build the GTK runtime bundle (--windowing superset, populate gtk/)
        shell: pwsh
        run: |
          node packages/node-gi/gtk-runtime-win32-x64/scripts/build-gtk-runtime.mjs `
            --windowing `
            --out packages/node-gi/gtk-runtime-win32-x64/gtk `
            --prefix $env:GTK_PREFIX `
            --addon (Join-Path $PWD 'addon\node_gi.node')

      # Gate the publish on the properties of the ARTIFACT. The build step already hard-
      # fails on typelib/library symmetry and license coverage; this asserts what a
      # consumer will find in the tarball.
      - name: Verify bundle (windowing data + licenses + layout present)
        shell: pwsh
        run: |
          $B = "packages/node-gi/gtk-runtime-win32-x64/gtk"
          Get-Content "$B/manifest.json"
          Write-Host "--- bundle size ---"
          "{0:N1} MiB" -f ((Get-ChildItem $B -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          if (-not (Test-Path "$B/bin") -or -not (Test-Path "$B/girepository-1.0")) {
            Write-Host "BUNDLE INCOMPLETE: gtk/bin + gtk/girepository-1.0 are required (index.js isPresent)"
            exit 1
          }
          Write-Host "--- assert this is the WINDOWING superset, not the display-free variant ---"
          foreach ($p in @("girepository-1.0/Adw-1.typelib", "bin/adwaita-1-0.dll", "girepository-1.0/GtkSource-5.typelib", "bin/gtksourceview-5-0.dll", "lib/gdk-pixbuf-2.0/2.10.0/loaders.cache")) {
            if (-not (Test-Path "$B/$p")) { Write-Host "$p MISSING - not the windowing bundle"; exit 1 }
          }
          # The data sets, asserted on BYTES: a directory that exists and is empty is the
          # same missing signal as an absent one (and is what shipped in 0.27.1).
          foreach ($t in @("share/glib-2.0/schemas", "share/icons", "share/gtksourceview-5")) {
            if (-not (Get-ChildItem "$B/$t" -Recurse -File -ErrorAction SilentlyContinue | Where-Object Length -gt 0 | Select-Object -First 1)) {
              Write-Host "$t holds no non-empty file - declared runtime data is missing"; exit 1
            }
          }
          if (-not (Get-ChildItem "$B/share/icons" -Filter index.theme -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1)) {
            Write-Host "no icon theme with an index.theme - icon lookups would silently fail"; exit 1
          }
          Write-Host "--- assert the third-party terms ship with the binaries ---"
          if (-not (Test-Path "$B/THIRD-PARTY-NOTICES.md")) { Write-Host "THIRD-PARTY-NOTICES.md MISSING"; exit 1 }
          if (-not (Test-Path "$B/licenses")) { Write-Host "licenses/ MISSING - LGPL DLLs with no terms attached"; exit 1 }
          # Same shared script as the darwin leg — see the comment there for why the
          # manifest half stopped being an inline `node -e`. No --expect-host-target:
          # win32-x64 is the only Windows bundle, so there is no arch to cross-check.
          node packages/node-gi/scripts/verify-bundle-manifest.mjs --bundle $B
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "bundle populated, complete + license-covered"

      # Same shared bootstrap as publish-gtk-runtime-darwin — see the note there for
      # why it is a script and what the retry inside it is for.
      - name: Prepare a Node-runnable @gjsify/cli
        id: cli
        shell: pwsh
        run: node scripts/bootstrap-published-cli.mjs

      # OIDC Trusted Publishing from release.yml — publishes ONLY this package, WITH
      # the populated gtk/ bundle. --tolerate-republish makes a manual rerun over an
      # already-published version a no-op instead of a hard 409/403.
      - name: Publish @gjsify/gtk-runtime-win32-x64 (OIDC, with bundle)
        shell: pwsh
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
          CLI_BIN: ${{ steps.cli.outputs.bin }}
        run: |
          node "$env:CLI_BIN" publish `
            packages/node-gi/gtk-runtime-win32-x64 `
            --tolerate-republish --tag latest --access public

  # @gjsify/node-gi is the Node GI reverse bridge. Like the gtk-runtime packages it
  # lives under packages/node-gi/** and is NOT a root workspace, so the ubuntu
  # `publish` job's `gjsify foreach ... publish` never covers it — it was left at
  # 0.13.0 on npm while the release train moved on, and 0.13.0 lacks the
  # ./system, ./gettext, ./cairo subpath exports that every 0.20.0 `--app node`
  # bundle imports (→ ERR_PACKAGE_PATH_NOT_EXPORTED on any external consumer). This
  # dedicated OIDC job publishes it in lockstep with each release, mirroring
  # publish-gtk-runtime-*. Trusted Publishing for @gjsify/node-gi must be configured
  # once for this repo + release.yml (a maintainer runs `gjsify trust`, exactly like
  # the gtk-runtime bootstrap) — OIDC cannot self-bootstrap its own trust.
  #
  # Build the node-gi prebuilds so the published tarball SHIPS them. node-gi's
  # `files` includes `prebuilds`, `index.js` prefers a prebuild, and Deno (which runs
  # NO install script) can only load a prebuild — but nothing staged one, so 0.20/0.21
  # shipped none: node/bun consumers had to `node-gyp rebuild` at install time and a
  # `gjsify install` consumer (which does not run the `install` script) or Deno got no
  # binary at all.
  #
  # ONE LEG PER DECLARED TARGET — the list is `gjsify.platforms` and is deliberately
  # NOT restated here; the staging assertion in publish-node-gi reads it from the
  # manifest, and `platforms-ci`'s release-coverage check holds this workflow to it.
  # 0.26.0 shipped a tarball with `prebuilds/linux-*` only, because only the two linux
  # legs were ever wired up, and `npx @gjsify/cli showcase … --runtime node` died on
  # Windows and macOS with "native addon not found for node on win32-x64" — a promised
  # platform that `audit-runtimes --check` reported as GREEN, because node-gi.yml
  # genuinely BUILDS win32-x64 and darwin-arm64 on every node-gi PR. "Built in CI" was
  # never the same claim as "published to consumers".
  #
  # It then happened a SECOND time, which is why the check now exists: #921 added
  # `darwin-x64` to `gjsify.platforms` and a matrix leg to node-gi.yml's `macos` job,
  # and no release leg. `audit-runtimes --check` stayed green for the same reason as
  # before (it compares the declaration against the UNION of all four workflows, and
  # node-gi.yml covered it), while the staging assertion below — which derives its list
  # from the manifest — would have failed the whole publish at release time, taking
  # @gjsify/node-gi out of that release entirely. The gap closed by adding the leg; the
  # CLASS closed by `platforms-ci` asking the release workflow ALONE whether it produces
  # every declared target whose artifact this repo never commits.
  #
  # WHY THE WIN32/DARWIN LEGS ARE REBUILT HERE rather than reused from node-gi.yml: a
  # GitHub artifact belongs to the workflow RUN that produced it and cannot be
  # downloaded from another workflow's run, so node-gi.yml's uploads (whose own comment
  # says it stages them "so a release can ship prebuilds/win32-x64/") are unreachable
  # from this workflow. Each leg is derived from that workflow's proven recipe, minus
  # its conformance gates — node-gi.yml runs those on every packages/node-gi/** push
  # and PR, so re-running them at release time would only re-prove a commit that is
  # already green.
  #
  # SHAPE — mirrors napi-prebuild-{linux,darwin-arm64} -> publish-napi below: every leg
  # builds on a NATIVE runner (no QEMU, no cross), stages via the package's own
  # scripts/stage-prebuild.mjs (never a hand-written cp — the target dir comes from
  # `${process.platform}-${process.arch}`), LOAD-TESTS the staged artifact through the
  # prebuild path, and uploads ONLY its own triple directory. publish-node-gi then
  # downloads each artifact into its own explicit destination. A leg that fails fails
  # publish-node-gi with it (it is in `needs:`, and the job carries no `always()`), so
  # a platform can never be silently dropped from a release — the failure mode that
  # produced this gap in the first place.
  node-gi-prebuild-linux:
    name: Build @gjsify/node-gi linux-${{ matrix.arch }} prebuild
    needs: publish
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + GObject-Introspection dev headers
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz \
            glib2-devel gobject-introspection-devel cairo-devel
      - name: Use official Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
      # `npm install --foreground-scripts` runs node-gi's `install` (node-gyp rebuild)
      # → build/Release/node_gi.node; stage-prebuild copies it to prebuilds/linux-<arch>
      # (process.arch = x64 | arm64 on the native runner).
      - name: Build + stage the linux-${{ matrix.arch }} prebuild
        working-directory: packages/node-gi/node-gi
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          node scripts/stage-prebuild.mjs
          ls -la prebuilds/*/node_gi.node
      # Load-test the staged artifact through the PREBUILD path (index.js prefers
      # prebuilds/<target>/ over build/Release/), not the build/ path npm install just
      # exercised: a prebuild never loaded in CI is a prebuild nobody tested, and the
      # two paths differ in exactly the way that breaks — stage-prebuild copying the
      # wrong file, or copying it to a directory name the resolver does not probe.
      # Same step node-gi.yml runs after its own staging.
      - name: Verify the staged prebuild loads (Node)
        working-directory: packages/node-gi/node-gi
        run: node --test test/smoke.test.mjs
        env:
          NODE_GI_NATIVE: prebuild
      # Upload ONLY this leg's own triple directory, so publish-node-gi can download
      # each artifact into an explicit destination (the napi shape) instead of
      # flattening a wildcard. The triple then appears LITERALLY in both workflows,
      # which is what the `platforms-ci` release-staging check reads.
      - name: Upload the prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-prebuild-linux-${{ matrix.arch }}
          path: packages/node-gi/node-gi/prebuilds/linux-${{ matrix.arch }}
          if-no-files-found: error

  # win32-x64 leg. Derived from node-gi.yml's `windows` job (Windows build +
  # conformance), whose comments record why each step exists; the conformance subset
  # is dropped here (that job gates it on every node-gi PR), the staging + load test
  # are not.
  #
  # NO gvsbuild CACHE, unlike node-gi.yml: Actions cache entries are scoped to the ref
  # that wrote them plus the default branch, and this workflow runs on a TAG. A restore
  # would be a coin flip, and a release that silently depends on a warm cache is worse
  # than one that always spends the ~1 min download. publish-gtk-runtime-win32-x64
  # above downloads unconditionally for the same reason.
  node-gi-prebuild-win32-x64:
    name: Build @gjsify/node-gi win32-x64 prebuild
    needs: publish
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GVSBUILD_VERSION: '2026.6.0'
      # Extract to gvsbuild's canonical build prefix so its .pc files' baked
      # absolute `prefix=` is correct with no relocation needed.
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
    steps:
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Node 24 builds the addon (node-gyp) and runs the load test — the same version
      # node-gi.yml's Windows and macOS legs pin.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download + extract gvsbuild GTK4 (MSVC-ABI, girepository-2.0)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          # tar.exe (bsdtar) extracts zip; the zip holds the CONTENTS of release\
          # (bin/ lib/ include/ share/ …) at its root.
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      - name: Put GTK on PATH + set GI/PKG env
        shell: pwsh
        run: |
          # GTK bin/ carries the DLLs the addon links (glib/gobject/gio/girepository/
          # cairo/ffi/intl) AND pkgconf.exe + pkg-config.exe (gvsbuild bundles them).
          # PATH is also the DLL search path at load time, so the same line is what
          # lets the staged prebuild load in the smoke test below.
          "$env:GTK_PREFIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=$env:GTK_PREFIX\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The typelib DIRECTORY is historically named girepository-1.0 even for
          # the girepository-2.0 API.
          "GI_TYPELIB_PATH=$env:GTK_PREFIX\lib\girepository-1.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GSETTINGS_SCHEMA_DIR=$env:GTK_PREFIX\share\glib-2.0\schemas" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # gvsbuild's libffi meson build ships ffi.lib + the DLL but NOT ffi.h/
      # ffitarget.h (its meson.build has `install: true` on the library() but no
      # install_headers()), yet GLib's girffi.h — which gvsbuild DOES install — does
      # `#include <ffi.h>`, so the addon won't compile (C1083). Supply the two headers
      # from vcpkg's libffi (preinstalled vcpkg; MSVC-native x64 headers). libffi's
      # public ABI (ffi_type/ffi_cif/ffi_closure) is frozen across 3.x, so the vcpkg
      # header + gvsbuild's 3.5.2 ffi.lib are compatible.
      - name: Supply libffi headers (gvsbuild omits ffi.h)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libffi:x64-windows
          $inc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          Copy-Item "$inc\ffi.h","$inc\ffitarget.h" -Destination "$env:GTK_PREFIX\include" -Force
          Write-Host "ffi.h -> $env:GTK_PREFIX\include (from vcpkg libffi)"

      # A HARD gate, unlike node-gi.yml's advisory diagnostics: if girepository-2.0 is
      # unresolvable the node-gyp run below fails several minutes later inside cl.exe
      # with a C1083 that names a header, not the missing .pc. `--exists` signals via
      # exit code, not stdout — a bare `if (pkg-config ...)` tests stdout and
      # false-reports MISSING.
      - name: Verify pkg-config sees girepository-2.0 + cairo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "pkg-config: $((Get-Command pkg-config).Source)"
          pkg-config --define-prefix --exists girepository-2.0 cairo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "girepository-2.0 / cairo not resolvable — the addon build cannot succeed"
            exit 1
          }
          Write-Host "girepository-2.0: $(pkg-config --define-prefix --modversion girepository-2.0)"
          Write-Host "--- helper: include_dirs ---"
          node packages/node-gi/node-gi/scripts/win-gi-gyp-flags.mjs --includes
          Write-Host "--- helper: libraries ---"
          node packages/node-gi/node-gi/scripts/win-gi-gyp-flags.mjs --libs

      # `npm install --foreground-scripts` runs node-gi's `install` (node-gyp rebuild)
      # → build/Release/node_gi.node via binding.gyp's OS=="win" branch (the helper
      # above feeds cl.exe include dirs + link.exe .lib paths); stage-prebuild then
      # copies it to prebuilds/win32-x64 (`${process.platform}-${process.arch}` on this
      # runner).
      - name: Build + stage the win32-x64 prebuild
        working-directory: packages/node-gi/node-gi
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          node scripts/stage-prebuild.mjs

      - name: Verify the staged prebuild loads (Node)
        working-directory: packages/node-gi/node-gi
        run: node --test test/smoke.test.mjs
        env:
          NODE_GI_NATIVE: prebuild

      - name: Upload the prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64
          if-no-files-found: error

  # darwin legs. Same gap, same shape: `gjsify.platforms` promises both darwin arches,
  # node-gi.yml's `macos` job builds + load-tests + uploads each, and release.yml never
  # picked them up — so every macOS `--runtime node` consumer of a published tarball hit
  # the identical "native addon not found" as Windows. Derived from that job, minus its
  # Node/Bun/Deno conformance legs (gated there on every node-gi PR).
  #
  # A MATRIX, unlike the win32 leg beside it and like `node-gi-prebuild-linux` above —
  # and the reason is the same one node-gi.yml's `macos` job states for its own matrix:
  # nothing in these steps is arch-conditional. `brew --prefix` answers /opt/homebrew on
  # Apple silicon and /usr/local on Intel, and `scripts/stage-prebuild.mjs` names its
  # directory from `${process.platform}-${process.arch}` on the running machine, so the
  # second leg differs from the first in its `runs-on` and in nothing else. The
  # alternative — a second job — would be a THIRD copy of the brew formula line, the
  # PKG_CONFIG/GI_TYPELIB/DYLD env block and the pkg-config gate, on the one path where
  # a drifted copy is unrecoverable; the formula list is deliberately verbatim (below),
  # which is exactly the kind of value copies get wrong. `fail-fast: false` keeps an
  # Intel failure from cancelling the arm64 leg, and publish-node-gi needs the whole
  # matrix, so neither can be silently dropped either way.
  #
  # `macos-15-intel` is the x64 image node-gi.yml's own `macos` matrix uses, and the one
  # `archFromRunner` in the `platforms-ci` rule reads as darwin-x64. It is also the LAST
  # x86_64 image Actions will offer (through August 2027), so this promise has a horizon
  # — recorded in that rule, where the parser that has to keep believing it lives.
  #
  # The brew line is kept VERBATIM rather than trimmed to the addon's actual link
  # closure (girepository-2.0 + cairo, per binding.gyp). Trimming would probably work
  # and would save minutes on a scarce macOS runner — but a release-blocking job is the
  # wrong place to discover that a trimmed formula list dropped a transitive, and a
  # release happens far less often than node-gi.yml proves this exact list green.
  node-gi-prebuild-darwin:
    name: Build @gjsify/node-gi darwin-${{ matrix.arch }} prebuild
    needs: publish
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Install GTK4 + GObject-Introspection (Homebrew)
        run: |
          # gtk4/libadwaita pull graphene/pango/gdk-pixbuf/cairo/glib transitively,
          # but name them so a slimmer future job (core subset only) still resolves.
          # glib provides libgirepository-2.0 + girepository-2.0.pc (the merged API);
          # gobject-introspection provides the GLib/GObject/Gio typelibs (Homebrew
          # builds them there to break the glib<->g-i circular dep) + g-ir tools.
          brew install gtk4 libadwaita gobject-introspection cairo pango gdk-pixbuf graphene pkg-config adwaita-icon-theme
          BREW_PREFIX="$(brew --prefix)"
          # brew symlinks each keg's lib/ — incl. girepository-1.0/*.typelib and
          # pkgconfig/*.pc — into $BREW_PREFIX/lib, so one dir covers every formula.
          # (The typelib DIRECTORY is historically named girepository-1.0 even for
          # the girepository-2.0 API.) DYLD_FALLBACK_LIBRARY_PATH lets the addon's
          # g_module_open() find the Homebrew dylibs a typelib names by leaf soname.
          {
            echo "BREW_PREFIX=$BREW_PREFIX"
            echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            echo "GI_TYPELIB_PATH=$BREW_PREFIX/lib/girepository-1.0${GI_TYPELIB_PATH:+:$GI_TYPELIB_PATH}"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$BREW_PREFIX/lib:/usr/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Verify pkg-config sees girepository-2.0 + cairo
        run: |
          set -eu
          echo "pkg-config: $(command -v pkg-config) ($(pkg-config --version))"
          pkg-config --exists girepository-2.0 cairo
          echo "girepository-2.0: $(pkg-config --modversion girepository-2.0)"
          echo "cairo: $(pkg-config --modversion cairo)"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout repository (the released tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # binding.gyp's non-win branch feeds `pkg-config --cflags/--libs
      # girepository-2.0 cairo` through xcode_settings.OTHER_CFLAGS →
      # darwin-<arch> build/Release/node_gi.node; stage-prebuild copies it to
      # prebuilds/darwin-<arch>, named from the RUNNING machine rather than from
      # `matrix.arch`, so a leg cannot stage a binary into a directory naming a
      # different machine (the mistake the emulated linux legs shipped for weeks).
      - name: Build + stage the darwin-${{ matrix.arch }} prebuild
        working-directory: packages/node-gi/node-gi
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          node scripts/stage-prebuild.mjs
          ls -la prebuilds/*/node_gi.node

      - name: Verify the staged prebuild loads (Node)
        working-directory: packages/node-gi/node-gi
        run: node --test test/smoke.test.mjs
        env:
          NODE_GI_NATIVE: prebuild

      - name: Upload the prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-prebuild-darwin-${{ matrix.arch }}
          path: packages/node-gi/node-gi/prebuilds/darwin-${{ matrix.arch }}
          if-no-files-found: error

  publish-node-gi:
    name: Publish @gjsify/node-gi (Node GI reverse bridge)
    # EVERY prebuild leg is a hard dependency. There is no `always()` and no
    # `continue-on-error` anywhere in this chain on purpose: if one platform's build
    # breaks, this job is SKIPPED and nothing is published, rather than publishing a
    # tarball that is quietly missing that platform. A partial publish is the exact
    # shape of the defect this wiring exists to close — 0.26.0 went out believing it
    # shipped four targets and shipped two.
    needs:
      - publish
      - node-gi-prebuild-linux
      - node-gi-prebuild-win32-x64
      - node-gi-prebuild-darwin
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # id-token: write = npm Trusted Publishing (OIDC), configured for this workflow
      # file (release.yml). contents: read is for checkout.
      contents: read
      id-token: write
    steps:
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # ONE download per artifact, each into its OWN explicit destination — the
      # shape `publish-napi` below uses, and the only one that works.
      #
      # It was a single `pattern: node-gi-prebuild-*` + `merge-multiple: true`
      # into `prebuilds/`, and that stages NOTHING usable: `upload-artifact` with
      # a directory `path` uploads the directory's CONTENTS, so each artifact is
      # a bare `node_gi.node`, and merging four of those into one directory just
      # overwrites the same file three times. Measured on the v0.26.1 publish —
      # all four build legs succeeded, all four artifacts downloaded, and the
      # staging assertion below then found not one `prebuilds/<target>/node_gi.node`.
      #
      # The per-artifact form puts the file where the target directory needs it
      # without depending on any merge semantics. `napi` has been doing it this
      # way for both of its platforms all along; node-gi is the one that drifted.
      - name: Download + stage the linux-x64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-linux-x64
          path: packages/node-gi/node-gi/prebuilds/linux-x64
      - name: Download + stage the linux-arm64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-linux-arm64
          path: packages/node-gi/node-gi/prebuilds/linux-arm64
      - name: Download + stage the darwin-arm64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-darwin-arm64
          path: packages/node-gi/node-gi/prebuilds/darwin-arm64
      - name: Download + stage the darwin-x64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-darwin-x64
          path: packages/node-gi/node-gi/prebuilds/darwin-x64
      - name: Download + stage the win32-x64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: node-gi-prebuild-win32-x64
          path: packages/node-gi/node-gi/prebuilds/win32-x64

      # DERIVED from the package's own `gjsify.platforms`, never a list written here.
      # The old form was `ls prebuilds/*/node_gi.node`, which passes as soon as ANY
      # single target is present — so it was green for the whole time two of the four
      # declared platforms were missing. A check that cannot fail on the defect it
      # guards is worse than no check, because it reads as coverage.
      #
      # This is the last line of defence before the tarball is built: `audit-runtimes
      # --check` holds "a declared target is produced by a CI job", and node-gi.yml
      # genuinely produces all four — the invariant never asks whether the RELEASE
      # ships them, which is exactly the gap that shipped.
      - name: Confirm every declared platform is staged
        run: |
          set -euo pipefail
          cd packages/node-gi/node-gi
          missing=0
          for target in $(node -p "require('./package.json').gjsify.platforms.join('\n')"); do
            if [ -f "prebuilds/$target/node_gi.node" ]; then
              echo "  ok      $target"
            else
              echo "::error::@gjsify/node-gi declares $target in gjsify.platforms but prebuilds/$target/node_gi.node was not staged — the tarball would ship a platform that cannot load"
              missing=1
            fi
          done
          if [ "$missing" != "0" ]; then exit 1; fi
          echo "every declared platform staged:"
          ls -la prebuilds/*/node_gi.node

      # No `registry-url` (it would inject a placeholder NODE_AUTH_TOKEN and defeat
      # OIDC — see the ubuntu `publish` job's rationale).
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Same shared bootstrap as publish-gtk-runtime-darwin — see the note there for
      # why it is a script and what the retry inside it is for.
      - name: Prepare a Node-runnable @gjsify/cli
        id: cli
        run: node scripts/bootstrap-published-cli.mjs

      # OIDC Trusted Publishing from release.yml — publishes ONLY node-gi, at whatever
      # version its package.json carries at the released tag (the release-it bumper
      # aligns it to the train version). --tolerate-republish makes a manual rerun
      # over an already-published version a no-op instead of a hard 409/403.
      - name: Publish @gjsify/node-gi (OIDC)
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
          CLI_BIN: ${{ steps.cli.outputs.bin }}
        run: |
          node "$CLI_BIN" publish packages/node-gi/node-gi \
            --tolerate-republish --tag latest --access public

  # The cross-platform probe is dispatched from HERE, gated on `publish-node-gi`,
  # and not from a step at the end of the `publish` job where it used to live.
  #
  # THE INCIDENT, measured to the second on v0.30.0: `@gjsify/cli@0.30.0` hit npm
  # at 22:13:49, the probe was dispatched at 22:13:53 — four seconds later — and
  # failed at 22:14:34 with `No version of @gjsify/node-gi satisfies 0.30.0`.
  # `@gjsify/node-gi@0.30.0` was not published until 22:21:44, EIGHT MINUTES
  # after the probe had already given its verdict. Identical shape at 0.29.0
  # (published 16:51:04, probe dispatched 16:43:18), and six consecutive red runs
  # across two releases.
  #
  # The old placement was right about `@gjsify/cli` and wrong about everything
  # else the probe measures: `publish-node-gi` needs three prebuild legs ON TOP
  # of `publish`, so from inside `publish` the node-gi tarball the probe resolves
  # — and the per-platform prebuild it asserts on — cannot exist yet. A probe
  # that runs before the thing it measures does not report a gap, it reports its
  # own scheduling.
  #
  # WHY DISPATCHED AT ALL, rather than triggered by `release: published` on that
  # workflow — kept from the original placement, both halves learned on the
  # v0.26.1 cut and neither changed by the move:
  #
  #   1. It never fires. The release record is created by `release-cut.yml` using
  #      GITHUB_TOKEN, and GitHub deliberately does not let a token-driven event
  #      start further workflow runs (the same wall #895 hit). A trigger that
  #      cannot fire is worse than none: it reads as coverage.
  #   2. Even if it fired, it would be too EARLY — the release record exists
  #      before anything is published, so the probe would measure the PREVIOUS
  #      version while the new release looked checked. That is the same class of
  #      error this job's own placement was making, one step further out.
  #
  # Skipped, not failed, when `publish-node-gi` is skipped: if a prebuild leg
  # broke there is nothing to measure, and the weekly cron still covers the
  # probe. Best-effort is preserved — a failed dispatch must not fail a publish
  # that already succeeded.
  dispatch-cross-platform-probe:
    name: Dispatch the cross-platform probe
    needs: [publish, publish-node-gi]
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the cross-platform probe (measures what was just published)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module -e '
            const { GITHUB_TOKEN, REPO } = process.env;
            const url = `https://api.github.com/repos/${REPO}/actions/workflows/cli-cross-platform.yml/dispatches`;
            const res = await fetch(url, {
                method: "POST",
                headers: {
                    authorization: `Bearer ${GITHUB_TOKEN}`,
                    accept: "application/vnd.github+json",
                    "x-github-api-version": "2022-11-28",
                    "content-type": "application/json",
                },
                body: JSON.stringify({ ref: "main", inputs: { cli_version: "latest" } }),
            });
            if (!res.ok) {
                console.error(`dispatch failed: ${res.status} ${res.statusText} — ${(await res.text()).slice(0, 300)}`);
                process.exit(1);
            }
            console.log("dispatched cli-cross-platform.yml against the freshly published latest");
          '

  # ---------------------------------------------------------------------------
  # @gjsify/napi — the N-API host for GJS (native `.node` addons IN GJS), the
  # forward mirror of @gjsify/node-gi. Same structural situation as node-gi and
  # the two gtk-runtime packages: `packages/napi/**` is deliberately NOT a root
  # workspace member (see root package.json#workspaces + the affected-classifier
  # IGNORE list), so `gjsify foreach` — the enumerator behind the ubuntu
  # `publish` job's `gjsify run npm:publish` — never sees it. Unlike node-gi,
  # which was at least published once and then went stale, @gjsify/napi had NO
  # publish path at all: the package did not exist on npm, while AGENTS.md and
  # the website documented `gjsify install @gjsify/napi` as the user-facing flow
  # for transparent `.node` loading. These three jobs are that path.
  #
  # SHAPE (mirrors node-gi-prebuild-linux -> publish-node-gi, one leg per
  # platform): build the meson shim on a native runner per platform, upload the
  # staged prebuild dir as an artifact, then publish ONE tarball carrying BOTH
  # prebuild triples. napi.yml already builds + gates the exact same shim on
  # every push/PR that touches packages/napi/** (Fedora 44 gates + conformance,
  # macOS build + load/value-model/tsfn gates), so these release jobs only
  # rebuild + stage — they do not re-run the gates.
  #
  # WHY NOT `merge-multiple: true` LIKE node-gi: node-gi's two artifacts are
  # disjoint triples under one gitignored `prebuilds/` dir, so flattening them is
  # safe. Here `prebuilds/linux-x64/` is COMMITTED, so the macOS runner's
  # checkout also carries a (possibly stale) copy of it — a merged download could
  # non-deterministically overwrite the freshly built linux .so with the
  # committed one. Each leg therefore uploads only its OWN triple dir and
  # publish-napi downloads each into its own explicit destination.
  #
  # RACE SAFETY: identical to publish-node-gi — `packages/napi/**` not being a
  # workspace means the ubuntu `publish` job can never enumerate, let alone
  # publish, this package, so the two legs can never write the same version. If
  # `packages/napi/*` is EVER added to the root `workspaces` list, add
  # `--exclude '@gjsify/napi'` to the `npm:publish` script's `gjsify foreach` so
  # the ubuntu job keeps skipping it.
  napi-prebuild-linux:
    name: Build @gjsify/napi linux-x64 prebuild
    needs: publish
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # The baked image, which carries the whole set this job used to install
      # for itself (meson/Vala/C++ + the mozjs-140 + gjs-devel headers the shim
      # links, ADR 0011's intrinsic mozjs-major pin). It is x64-only work, so
      # unlike its node-gi sibling there is no arm64 leg to strand.
      #
      # This job is ON THE RELEASE PATH, which is the whole reason the switch is
      # worth making: during the v0.26.0 sweep the `dnf install` it used to run
      # took 41 minutes against a 22-second norm, and a Docker Hub pull timeout
      # independently failed `napi` — neither had anything to do with the code,
      # and either one strands a publish. `scripts/check-ci-image-packages.mjs`
      # holds the image to what the jobs on it install.
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      # Same shape as napi.yml's `consumer` job: name the toolchain the build
      # below silently assumes, so a wrong or drifted image says so here rather
      # than as a confusing meson failure. Costs a second on the release path.
      - name: Verify the baked toolchain
        run: |
          gjs --version
          echo "mozjs-140: $(pkg-config --modversion mozjs-140)"
          echo "gjs-1.0:   $(pkg-config --modversion gjs-1.0)"
          echo "valac:     $(valac --version)"

      # `.docker/ci-fedora.Dockerfile` bakes NO nodejs/npm, deliberately and in
      # those words — every job on that image brings its own via setup-node. The
      # staging step below runs `node scripts/stage-prebuild.mjs`, so without
      # this the leg dies with `node: command not found` (exit 127) AFTER a
      # fully successful meson build. That is exactly how v0.31.0 shipped: 60
      # packages and `@gjsify/node-gi` went out, `@gjsify/napi` did not, because
      # this step was copied from napi.yml without the setup-node that precedes
      # it there (napi.yml's three container jobs all carry one).
      #
      # Version matches `publish-napi` below rather than napi.yml's '24' — same
      # image, same workflow, and the Dockerfile's `libatomic` note is written
      # for setup-node >= 26.
      - name: Setup Node.js (the baked image ships none)
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      - name: Checkout repository (the released tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Verbatim from napi.yml's "Build the @gjsify/napi shim (meson) + stage
      # prebuild" step: meson builds libgjsifynapi.so + GjsifyNapi-1.0.{gir,typelib}
      # and stages them into the committed prebuild dir. The freshly built triple
      # overwrites whatever the checkout carried, so the tarball always ships a
      # binary built from the released source.
      #
      # Since ADR 0017 that directory belongs to the PER-TARGET package
      # (`packages/napi/napi-linux-x64/`), not to the bridge: `@gjsify/napi` no
      # longer lists `prebuilds` in `files`, so staging into it would pack
      # nothing and every consumer would get a bridge with no binary.
      #
      # The staging goes through `scripts/stage-prebuild.mjs` like every other
      # site in the repo, rather than a hand-written `mkdir -p` + `cp` naming
      # each artifact. Two properties come with it that the `cp` list did not
      # have: the destination is DERIVED from the package's own
      # `gjsify.platforms` (a wrong target is an error, not a directory nobody
      # declared), and artifacts are matched by EXTENSION, so renaming a library
      # in meson.build cannot ship a stale or partial set. It also runs
      # `check-prebuild-loader-path.mjs` on what it staged. These two legs were
      # the last pair outside that rule — `tests/e2e/prebuild-change-gate` now
      # scans this workflow too, so the exemption cannot come back.
      - name: Build the @gjsify/napi shim (meson) + stage prebuild
        working-directory: packages/napi/napi
        run: |
          meson setup build .
          meson compile -C build
          node ../../../scripts/stage-prebuild.mjs .

      # THE gate this leg was missing. It used to end at `cp` + upload, and its
      # consumer `publish-napi` checks the four files with `test -f` — existence,
      # never loadability. Since `packages/napi/napi-linux-x64/prebuilds/` stopped
      # being committed, `prebuild-artifacts`' env-free dlopen no longer covers it
      # either, and napi.yml's own gates load out of `build/`, not out of the
      # prebuild path. So NOTHING proved the bytes a release publishes can be
      # opened — on either target.
      #
      # Calling a function is the trigger, not a formality: this namespace has no
      # GObject class, so resolving `imports.gi.GjsifyNapi` proves only that the
      # typelib was FOUND. `is_available()` is what makes GI dlopen the library
      # the typelib records (and it is side-effect free, unlike `init()`).
      - name: Load-test the linux-x64 prebuild this leg will ship
        working-directory: packages/napi/napi-linux-x64/prebuilds/linux-x64
        run: |
          set -euo pipefail
          echo "shipping: $(ls -1)"
          GI_TYPELIB_PATH="$PWD" LD_LIBRARY_PATH="$PWD" gjs -c \
            "const N = imports.gi.GjsifyNapi;
             if (typeof N.is_available !== 'function') {
               throw new Error('GjsifyNapi.is_available did not resolve to a function');
             }
             N.is_available();
             print('GjsifyNapi loaded from the staged prebuild');" < /dev/null

      - name: Upload the linux-x64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-prebuild-linux-x64
          path: packages/napi/napi-linux-x64/prebuilds/linux-x64
          if-no-files-found: error

  # macOS arm64 leg. Homebrew ships the SAME gjs 1.88.x <-> spidermonkey
  # (mozjs-140) pairing the Fedora job pins, so no source build is needed; meson
  # branches to ld64's -exported_symbols_list and the .dylib leaf (see
  # meson.build). Verbatim from napi.yml's `macos` job, minus the node-gyp gates
  # (napi.yml runs those on every push/PR that is not docs-only).
  napi-prebuild-darwin-arm64:
    name: Build @gjsify/napi darwin-arm64 prebuild
    needs: publish
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Install GJS + SpiderMonkey (mozjs-140) + GI toolchain (Homebrew)
        run: |
          # `gjs` pulls `spidermonkey` (mozjs-140) + glib/gobject/gio/cairo
          # transitively; name gobject-introspection (g-ir-compiler), vala, meson,
          # ninja and pkgconf explicitly so the shim's build deps all resolve.
          brew install gjs gobject-introspection vala meson ninja pkgconf
          BREW_PREFIX="$(brew --prefix)"
          # Neither `gjs` nor `spidermonkey` is keg-only, so brew symlinks their
          # lib/pkgconfig (gjs-1.0.pc, mozjs-140.pc + the glib/gobject/gio .pc that
          # gjs-1.0.pc Requires) into $BREW_PREFIX/lib/pkgconfig — one dir resolves
          # the whole shim closure.
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Verify toolchain (gjs / mozjs-140 / gjs-1.0 / valac)
        run: |
          gjs --version
          echo "mozjs-140: $(pkg-config --modversion mozjs-140)"
          echo "gjs-1.0:   $(pkg-config --modversion gjs-1.0)"
          echo "valac:     $(valac --version)"

      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Staged into the per-target package, same as the linux leg above and for
      # the same reason (ADR 0017). This target is the one `gjsify.platforms`
      # declares and `gjsify.platformsUncommitted` exempts — built and shipped by
      # a release, never committed to the repository — so
      # `packages/napi/napi-darwin-arm64/` exists in the tree carrying that
      # exemption and no `prebuilds/`, and this is the step that fills it.
      - name: Build the @gjsify/napi shim (meson) + stage darwin-arm64 prebuild
        working-directory: packages/napi/napi
        run: |
          meson setup build .
          meson compile -C build
          node ../../../scripts/stage-prebuild.mjs .

      # Same gate, same reason as the linux leg above — and this target needs it
      # more, not less: `gjsify.platformsUncommitted` exempts darwin-arm64 from
      # ever being committed, so this job's output is the ONLY copy that exists
      # and the release is its first and last chance to be opened by anything.
      #
      # DYLD_LIBRARY_PATH (not LD_LIBRARY_PATH) is what lets dlopen resolve the
      # bare leaf the typelib records — dyld has no notion of "next to the
      # typelib". This mirrors what the CLI exports via buildNativeEnv() on
      # darwin, so a pass here is a pass for a real `gjsify` run.
      - name: Load-test the darwin-arm64 prebuild this leg will ship
        working-directory: packages/napi/napi-darwin-arm64/prebuilds/darwin-arm64
        run: |
          set -euo pipefail
          echo "shipping: $(ls -1)"
          GI_TYPELIB_PATH="$PWD" DYLD_LIBRARY_PATH="$PWD" gjs -c \
            "const N = imports.gi.GjsifyNapi;
             if (typeof N.is_available !== 'function') {
               throw new Error('GjsifyNapi.is_available did not resolve to a function');
             }
             N.is_available();
             print('GjsifyNapi loaded from the staged prebuild');" < /dev/null

      - name: Upload the darwin-arm64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-prebuild-darwin-arm64
          path: packages/napi/napi-darwin-arm64/prebuilds/darwin-arm64
          if-no-files-found: error

  # WHY THIS JOB BUILDS lib/ (unlike publish-node-gi): node-gi ships committed
  # hand-written JS, so its publish job only stages prebuilds. @gjsify/napi's
  # published entry points (`main`/`types` -> lib/esm/index.js,
  # lib/types/index.d.ts) are BUILD ARTIFACTS that are not committed, so this job
  # runs the package's own `build` script (build:gjsify + build:types) before
  # packing. That needs the workspace's @girs/* + @types/node + @gjsify/tsc on
  # disk (napi's tsconfig `types` array names them), which is exactly what the
  # ubuntu `publish` job's `gjsify install --immutable` recipe provides — so this
  # job runs on the SAME ci-fedora image with the SAME Node-free install, then
  # publishes with the workspace's own `gjsify` (the version being released).
  publish-napi:
    name: Publish @gjsify/napi (N-API host for GJS)
    needs: [publish, napi-prebuild-linux, napi-prebuild-darwin-arm64]
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # id-token: write = npm Trusted Publishing (OIDC), configured for this
      # workflow file (release.yml). contents: read is for checkout; packages:
      # read pulls the prebuilt ci-fedora image from ghcr (same as `publish`).
      contents: read
      id-token: write
      packages: read
    container:
      # Same image the ubuntu `publish` job builds + publishes on — it carries
      # gjs (+ libsoup3, which the committed cli.gjs.mjs eager-imports via
      # gi://Soup), so `gjsify install --immutable` and the workspace `gjsify`
      # bin run with no manual dnf step.
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Stage each prebuild triple into ITS OWN per-target package before the
      # pack (ADR 0017). `@gjsify/napi` no longer lists `prebuilds` in `files`,
      # so a triple staged into the bridge would pack nothing at all — silently,
      # because a `files` entry that is gone cannot warn about a directory that
      # is present. Each platform package lists exactly `["prebuilds"]`, so the
      # directory IS the tarball.
      # Downloaded first so a missing artifact fails before the multi-minute
      # workspace install below.
      - name: Download the linux-x64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: napi-prebuild-linux-x64
          path: packages/napi/napi-linux-x64/prebuilds/linux-x64

      - name: Download the darwin-arm64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: napi-prebuild-darwin-arm64
          path: packages/napi/napi-darwin-arm64/prebuilds/darwin-arm64

      - name: Confirm both prebuilds are staged
        run: |
          set -eu
          ls -la packages/napi/napi-linux-x64/prebuilds/linux-x64 \
                 packages/napi/napi-darwin-arm64/prebuilds/darwin-arm64
          test -f packages/napi/napi-linux-x64/prebuilds/linux-x64/libgjsifynapi.so
          test -f packages/napi/napi-linux-x64/prebuilds/linux-x64/GjsifyNapi-1.0.typelib
          test -f packages/napi/napi-darwin-arm64/prebuilds/darwin-arm64/libgjsifynapi.dylib
          test -f packages/napi/napi-darwin-arm64/prebuilds/darwin-arm64/GjsifyNapi-1.0.typelib

      # No `registry-url` (it would inject a placeholder NODE_AUTH_TOKEN and
      # defeat OIDC — see the ubuntu `publish` job's rationale).
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      # Node-free install via the PUBLISHED gjsify (ADR 0002) — verbatim from
      # the ubuntu `publish` job. Provides @girs/{gjs,glib-2.0,gobject-2.0},
      # @types/node and @gjsify/tsc for the type emit below, plus the workspace
      # `gjsify` bin used for the build + publish.
      #
      # `GJSIFY_BOOTSTRAP` is load-bearing here rather than a convenience: this
      # job's tree is cold by design, so `resolve-gjsify.mjs` — which the next
      # step goes through — finds no usable `node_modules/.bin` shim and no
      # built bundle, and this is its last rung.
      - name: Install dependencies (gjsify install --immutable)
        run: |
          B=$(gjs -m install.mjs --fetch-only)
          gjs -m "$B" install --immutable
          echo "GJSIFY_BOOTSTRAP=$B" >> "$GITHUB_ENV"

      # `build` = build:gjsify (rolldown --library -> lib/esm) + build:types
      # (gjsify tsc -> lib/types). packages/napi/napi is not a workspace, so it is
      # driven with `gjsify run` from inside the package dir rather than through
      # `gjsify workspace`/`foreach`.
      # Under GJS the ONLY bundler engine is @gjsify/rolldown-native — whose JS
      # facade `lib/` is a build output, not tracked. `gjsify install` does not
      # produce it, so without this the next step dies with "no usable bundler
      # engine under GJS". This is the same bootstrap the root `build:infra`
      # runs; it is mtime-skipped, so it costs nothing when the facade is
      # already there.
      #
      # This job's tree is COLD by design (checkout + install, no build), which
      # is what broke the v0.24.1 release: the bootstrap used to require the
      # CLI's Node entry — itself a build output — and exited 1 telling the
      # caller to build it, so @gjsify/napi was the one package that missed the
      # train. The script now runs `build:infra` itself when the entry is
      # absent, so no caller has to know the ordering.
      # THE THIRD COLD-TREE BOOTSTRAP, and the one the `runtime` input does NOT
      # reach — deliberately. It is Node-only by construction, not by oversight:
      # under GJS the only bundler engine is `@gjsify/rolldown-native`, whose JS
      # facade is what THIS step builds, so a GJS arm here would have to bundle
      # its own bundler. Named here because an uncommented exception is how the
      # `runtime` input becomes a lie one level down.
      - name: Bootstrap the native bundler facade
        run: node scripts/bootstrap-native-facades.mjs

      - name: Build @gjsify/napi lib/ (esm + types)
        working-directory: packages/napi/napi
        run: PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" gjsify run build

      # A silent no-op emit would otherwise publish a tarball whose `main`/`types`
      # point at files that do not exist (tsc skips emit when it finds a stale
      # tsconfig.tsbuildinfo, and the packer only fails on a types path that is
      # present-but-unpacked). Assert the two published entry points exist.
      - name: Verify the built lib/ is complete
        run: |
          set -eu
          test -f packages/napi/napi/lib/esm/index.js
          test -f packages/napi/napi/lib/types/index.d.ts
          ls -la packages/napi/napi/lib/esm packages/napi/napi/lib/types

      # OIDC Trusted Publishing from release.yml — publishes the @gjsify/napi
      # SET, at whatever version each package.json carries at the released tag
      # (the release-it bumper's `packages/*/*/package.json` glob covers all
      # three, so they track the train together — and they MUST, because the
      # bridge pins its siblings by literal version, not by `workspace:`).
      # Driven by the workspace's own `gjsify` (the version being released)
      # rather than an npm-installed CLI, because the install above already put
      # it on disk. --tolerate-republish makes a manual rerun over an
      # already-published version a no-op instead of a hard 409/403.
      #
      # WHY THREE COMMANDS AND NOT `gjsify foreach`: `packages/napi/*` is
      # deliberately not in the root `workspaces` list (own CI, own carve-outs),
      # so the `npm:publish` sweep never sees any of them. Before ADR 0017 that
      # cost one explicit publish; now the artifacts live in per-target packages
      # and each is its own npm name, so each needs its own. They are listed
      # rather than globbed on purpose — a new napi target is a new published
      # name and a new Trusted-Publisher bootstrap, which is a decision, not a
      # thing to pick up silently from a directory listing.
      #
      # PLATFORM PACKAGES FIRST: the bridge declares them as
      # `optionalDependencies`, and an optional dependency that does not resolve
      # is skipped in silence. Publishing the bridge first would leave a window
      # in which an install succeeds and produces a bridge with no binary.
      - name: Publish the @gjsify/napi platform packages (OIDC)
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
        run: |
          set -eu
          for pkg in napi-linux-x64 napi-darwin-arm64; do
            PATH="$PWD/node_modules/.bin:$PATH" gjsify publish "packages/napi/$pkg" \
              --tolerate-republish --tag latest --access public
          done

      - name: Publish @gjsify/napi (OIDC)
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
        run: |
          PATH="$PWD/node_modules/.bin:$PATH" gjsify publish packages/napi/napi \
            --tolerate-republish --tag latest --access public

  # ---------------------------------------------------------------------------
  # @gjsify/node-runtime-{darwin-arm64,darwin-x64,win32-x64} — the bundled Node
  # interpreters a `gjsify ship` artifact carries on macOS and Windows, where no
  # system Node can be assumed. Linux gets no package: a `.deb`/`.rpm` declares a
  # dependency on the distribution's Node instead.
  #
  # SAME STRUCTURAL SITUATION as node-gi, napi and the gtk-runtime bundles:
  # `packages/node-runtime/**` is deliberately NOT a root workspace member, so
  # `gjsify foreach` — the enumerator behind the ubuntu `publish` job's
  # `gjsify run npm:publish` — never sees it, and the two can never write the
  # same version. That is what structurally prevents the 0.19.0 incident, where
  # the workspace sweep overwrote a real bundle with an empty shell. If
  # `packages/node-runtime/*` is EVER added to the root `workspaces` list, add
  # `--exclude '@gjsify/node-runtime-*'` to the `npm:publish` script's
  # `gjsify foreach` so the ubuntu job keeps skipping it.
  #
  # ONE UBUNTU JOB FOR ALL THREE, and this is where the design departs from
  # publish-gtk-runtime-*: those need a macOS and a Windows runner because their
  # payload is BUILT from an OS-specific closure. Ours is a DOWNLOAD that is
  # digest-checked against the release's own SHASUMS256.txt, so it is verifiable
  # anywhere and nothing in the fetcher reads `process.platform`. A matrix leg per
  # target, on the cheapest runner, with no cross-OS coupling to strand a leg.
  #
  # `fail-fast: false` for the reason the darwin bundle matrix records: one
  # target's failure must not CANCEL another's publish. A failed leg leaves that
  # one package at its previous version, which a re-dispatch recovers;
  # cancelling the others is not better.
  #
  # `needs: publish` so `@gjsify/cli@<release-version>` is already on npm for the
  # Node-runnable CLI below.
  publish-node-runtime:
    name: Publish @gjsify/node-runtime-${{ matrix.target }} (bundled Node)
    needs: publish
    # Same gate as every other publish job: a real release, or a dispatch that
    # opts INTO publishing; never in verify_only (audit) mode.
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, win32-x64]
    permissions:
      # id-token: write = npm Trusted Publishing (OIDC). Each package's Trusted
      # Publisher is configured for THIS workflow file (release.yml), so an OIDC
      # exchange from any job in it succeeds. contents: read is for checkout.
      contents: read
      id-token: write
    steps:
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Node 24 runs the fetcher (node:crypto/fs + global fetch) and the publish.
      # No `registry-url` — it makes actions/setup-node inject a placeholder
      # NODE_AUTH_TOKEN, which `gjsify publish` reads as "token auth requested"
      # and then skips OIDC (see the ubuntu publish job's note).
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Populate the gitignored bin/ payload so `files: ["bin"]` ships it. The
      # fetcher verifies the archive against the release's own SHASUMS256.txt
      # before it extracts anything, and refuses a LICENSE whose byte length is
      # neither of the two the release publishes.
      - name: Fetch the Node interpreter + its LICENSE
        run: |
          node packages/node-runtime/scripts/fetch-node-runtime.mjs \
            --target ${{ matrix.target }} \
            --out packages/node-runtime/node-runtime-${{ matrix.target }}/bin

      # Gate the publish on the ARTIFACT, a step later — which is a different
      # question from what the fetcher already asserted while writing: this is
      # what catches a skipped step, a stale tree, or a leg whose `--out` pointed
      # at the sibling package. A SCRIPT, not an inline `node -e`: three v0.28.0
      # bundle publishes died on a quote spliced into a single-quoted shell
      # string while the bundles themselves were fine.
      #
      # ⚠️ The licence assertion inside it is the one that matters. The bare
      # https://nodejs.org/dist/<v>/win-x64/ path carries NO LICENSE, and taking
      # that convenient route would ship someone else's binary with no terms
      # attached and nothing to notice — the same class as the
      # `test -s "$B/THIRD-PARTY-NOTICES.md"` line in publish-gtk-runtime-darwin.
      - name: Verify the payload (binary, licence, manifest)
        run: |
          node packages/node-runtime/scripts/verify-node-runtime.mjs \
            --package packages/node-runtime/node-runtime-${{ matrix.target }}
          echo "--- what will be published ---"
          ls -la packages/node-runtime/node-runtime-${{ matrix.target }}/bin
          cat packages/node-runtime/node-runtime-${{ matrix.target }}/bin/manifest.json

      # Same shared bootstrap as publish-gtk-runtime-darwin — see the note there for
      # why it is a script and what the retry inside it is for.
      - name: Prepare a Node-runnable @gjsify/cli
        id: cli
        run: node scripts/bootstrap-published-cli.mjs

      # OIDC Trusted Publishing from release.yml — publishes ONLY this package,
      # WITH the populated bin/. `--tolerate-republish` makes a manual rerun over
      # an already-published version a no-op instead of a hard 409/403.
      #
      # ⚠️ FIRST RELEASE ONLY: these three npm names must be bootstrapped by hand
      # before the release that ships them (`gjsify onboard`, then `gjsify trust`
      # targeting release.yml) — OIDC cannot self-bootstrap its own trust, and an
      # unbootstrapped name 404s on the exchange. That bootstrap is DONE for all three.
      # `scripts/check-shipped-runtime-packages.mjs` is what holds it — it asks the
      # registry whether each name resolves, and fails when one does not.
      #
      # NOTHING HOLDS THIS COMMENT, and the previous version of it claimed otherwise.
      # The check reads `release.yml` only to harvest `gjsify publish <dir>` arguments;
      # its disclosure scan is `DOC_ROOTS` (docs/ + website/), which workflows are not
      # in. It also asks only whether a packument EXISTS, never which version or when —
      # so a date or a version written here is exactly the shape it cannot hold. Say
      # what the check asserts, and keep the unheld half out.
      #
      # ⚠️ `--tolerate-untrusted-new` IS DELIBERATELY ABSENT, and adding it to
      # silence a red leg would be the bug. That flag exists for the SERIALIZED
      # `gjsify foreach publish` sweep in `npm:publish`, where one unbootstrapped name
      # aborts every alphabetically later package (the v0.4.20 incident:
      # `@gjsify/tls-native` unbootstrapped, 60+ packages stuck at 0.4.19). Nothing of
      # that applies here. This is a three-leg matrix with `fail-fast: false`; no job
      # `needs:` it except `verify-release-closure`, which runs on `!cancelled()`. So a
      # failed leg publishes nothing, cancels nothing, and leaves that one package at
      # its previous version — loudly.
      #
      # With the flag, an unbootstrapped name would exit 0 having published NOTHING,
      # and the release would go out green while `gjsify ship` on macOS and Windows
      # still had no interpreter to stage and the docs still told authors to depend on
      # it. A missing bootstrap is exactly the thing this job must not be able to
      # report as done. Bootstrap the name; do not tolerate its absence.
      - name: Publish @gjsify/node-runtime-${{ matrix.target }} (OIDC, with payload)
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
        run: |
          node "${{ steps.cli.outputs.bin }}" publish \
            packages/node-runtime/node-runtime-${{ matrix.target }} \
            --tolerate-republish --tag latest --access public

  # The LAST word on a release: is what npm now serves internally consistent?
  #
  # Every publish job above is fail-fast, and that is correct — but a publish
  # sweep has no transaction. An abort mid-sweep leaves a PREFIX of the tree
  # live, and pack time has already rewritten every `workspace:*` to the exact
  # released version, so a bridge that landed before its platform children pins
  # siblings that do not exist. npm skips an unresolvable `optionalDependency` in
  # SILENCE (a platform mismatch is not an error, and neither is a missing
  # version), so that install SUCCEEDS and hands the consumer the new JS bridge
  # with no typelib and no dylib behind it — strictly worse than the previous
  # version's error state, and until this job nothing looked.
  #
  # Prevention lives in the sweep's ORDER (`npm:publish` runs `gjsify foreach
  # --topological`, whose graph counts `optionalDependencies`, so any prefix is
  # resolvable; `publish-napi` has published children-first by hand since ADR
  # 0017). This job is the DETECTION half. Detection alone would only shorten
  # the window, which is why the two shipped together.
  #
  # `needs` every publishing job, so the check sees the whole release including
  # the three that run after the ubuntu sweep. `!cancelled()` rather than a plain
  # dependency: when a publish job FAILS is exactly when the state of npm is
  # worth reporting, and the re-run is then a deliberate act rather than a guess.
  # `--tolerate-republish` makes that re-run the recovery path — it no-ops for
  # every package that already landed and publishes the rest.
  #
  # No install, no build: the script reads manifests + the registry with plain
  # Node, so it cannot be staled by the committed CLI bundle and it still runs
  # when the release that would have installed the tree is what failed.
  verify-release-closure:
    name: Verify the published dependency closure
    needs:
      - publish
      - publish-gtk-runtime-darwin
      - publish-gtk-runtime-win32-x64
      - publish-node-gi
      - publish-napi
      - publish-node-runtime
    if: ${{ !cancelled() && (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      # Asserts POSITIVE facts, not merely the absence of findings: at least one
      # package LIVE at the released version; the tree DECLARING at least one
      # release-pinned intra-repo edge (a manifest property, so it stays true
      # after any refactor of the enumeration); on a complete release at least
      # one edge actually EXAMINED; and every examined edge resolving. An empty
      # result FAILS — a check that verified nothing must not report a pass. See
      # the script header for what it deliberately does NOT fail on, and why.
      - name: Assert every pinned dependency of every published package resolves
        run: node scripts/verify-published-closure.mjs
