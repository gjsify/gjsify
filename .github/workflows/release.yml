# Workflow to automatically publish packages to npm on new releases
name: Release to NPM

on:
  release:
    types: [published]
  # Manual reruns. Two scenarios:
  #   1. Re-publish + (re-)upload assets for a real existing release whose
  #      original `release`-event run didn't finish (e.g. asset upload was
  #      skipped because an earlier manual rerun trampled the release
  #      context). Pass the tag in `release_tag`; the workflow checks out
  #      that tag, rebuilds, and uploads the assets to the named release.
  #      Defaults to skip_publish=true so npm isn't republished (already
  #      done by the original run).
  #   2. Ad-hoc smoke test from main with no release attached. Leave
  #      `release_tag` empty.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to (re)upload assets to (e.g. v0.4.15). Leave empty for a no-op dispatch from main.'
        required: false
        default: ''
      skip_publish:
        description: 'Skip the npm publish step (default true — re-uploads are for fixing missing release assets; npm side already published).'
        required: false
        type: boolean
        default: true
      verify_only:
        description: 'Run `gjsify foreach publish --check-trusted` against every package and skip the actual publish. Used to audit Trusted Publisher configs on npmjs.com after configuring them — the OIDC JWT issued for THIS workflow file matches the configured `release.yml` Trusted Publishers.'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      # contents: write so softprops/action-gh-release can upload install.mjs
      # + cli.gjs.mjs + .sha256 as assets onto the release record that
      # triggered this workflow. id-token: write keeps OIDC provenance
      # available for future signed-publish work. packages: read lets the job
      # pull the prebuilt ci-fedora image from ghcr (same as main.yml).
      contents: write
      id-token: write
      packages: read
    container:
      # Build + publish on the SAME prebuilt CI image main.yml builds/tests on —
      # it bundles every build dependency (gjs, gtk4 / libadwaita / blueprint,
      # libatomic, …), so this job needs no manual `dnf install`. Standardised on
      # Fedora 44; the bare fedora:43 image was dropped (its Node 26 binary failed
      # to load libatomic.so.1, and f44 is the supported platform).
      image: ghcr.io/gjsify/ci-fedora:44

    steps:
      # `release` event auto-checks-out the tag. `workflow_dispatch` with a
      # `release_tag` input must explicitly target that tag so the rebuilt
      # bundle + install.mjs match what shipped (not main HEAD).
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # OIDC mode: no `registry-url` here. When set, actions/setup-node
      # injects `NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX` as a literal
      # placeholder into the job env so the generated .npmrc has SOME
      # token reference to expand. That placeholder leaks into every
      # subprocess as a non-empty NODE_AUTH_TOKEN, which `gjsify publish`
      # auto-detect (`!process.env.NODE_AUTH_TOKEN`) then interprets as
      # "user opted into token auth" and skips OIDC — defeating the
      # entire Trusted Publishing setup. Dropping `registry-url` makes
      # setup-node not write the placeholder npmrc; gjsify publish reads
      # the registry from the package's own `publishConfig.registry`
      # (or DEFAULT_REGISTRY) and authenticates via OIDC exchange.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      # Phase D.7d: Node-free install via the committed GJS bundle.
      # Mirrors main.yml — see that workflow for rationale.
      - name: Install dependencies (gjsify install --immutable)
        run: gjs -m packages/infra/cli/dist/cli.gjs.mjs install --immutable

      - name: Build packages
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run build

      - name: Build examples
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run build:examples

      # Trusted-Publisher audit. Runs when `gh workflow run release.yml
      # -f verify_only=true` is invoked. The OIDC JWT issued for this
      # workflow file matches the `release.yml` filename configured per
      # package as Trusted Publisher on npmjs.com, so a `--check-trusted`
      # exchange succeeds for every correctly-configured package and 4xx
      # for every misconfigured one. Always exits 0; read the GitHub Step
      # Summary for the per-bucket counts + list of failing packages.
      - name: Verify Trusted Publishers (audit mode)
        if: ${{ inputs.verify_only == true }}
        id: check_trusted
        env:
          GJSIFY_PUBLISH_DEBUG: "1"
        run: |
          set -o pipefail
          PATH="$PWD/node_modules/.bin:$PATH" \
            gjsify foreach -v --no-private \
              --exclude '@girs/*' \
              --exec -- gjsify publish --check-trusted \
            2>&1 | tee /tmp/check-trusted.log

          MISCONFIGURED=$(grep -cE "(^|\] )✗ " /tmp/check-trusted.log || true)
          OK=$(grep -cE "(^|\] )✓ " /tmp/check-trusted.log || true)
          SKIPPED=$(grep -cE "(^|\] )- " /tmp/check-trusted.log || true)

          {
            echo "## Trusted Publisher verification"
            echo ""
            echo "| Status | Count |"
            echo "|---|---|"
            echo "| ✓ Configured        | $OK |"
            echo "| ✗ Misconfigured     | $MISCONFIGURED |"
            echo "| - Skipped (private) | $SKIPPED |"
            echo ""
            if [ "$MISCONFIGURED" -gt 0 ]; then
              echo "### Misconfigured packages"
              echo ""
              echo "Each row below means the OIDC token exchange returned non-2xx for that package. Most common cause: no Trusted Publisher entry yet — add one at https://www.npmjs.com/package/<name>/access with Repository: gjsify/gjsify, Workflow: release.yml."
              echo ""
              FENCE='```'
              echo "$FENCE"
              grep -E "(^|\] )✗ " /tmp/check-trusted.log || true
              echo "$FENCE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish to npm on the `release` event (always) or on
      # workflow_dispatch with skip_publish=false. Never runs in
      # `verify_only` mode — that path is a pure audit.
      # Authentication mode: npm Trusted Publishing (OIDC). `gjsify publish`
      # auto-detects the GitHub Actions OIDC env vars (the workflow has
      # `id-token: write` above) and, with no NODE_AUTH_TOKEN present,
      # exchanges the runner-minted JWT at npm's
      # `/-/npm/v1/oidc/token/exchange/package/<name>` endpoint for a
      # short-lived publish token per package. The 104 stable @gjsify/*
      # packages have Trusted Publisher entries configured for this
      # repo + workflow on npmjs.com (verified via the `verify_only`
      # audit before this cutover). Long-lived `NPM_TOKEN` secret can
      # be removed once a real OIDC release completes successfully.
      - name: Publish packages to npm
        if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run npm:publish
        env:
          GJSIFY_PUBLISH_DEBUG: "1"

      # Phase F: ship install.mjs + cli.gjs.mjs as GitHub-release assets so end
      # users can bootstrap gjsify (or any gjsify-based GJS app) with a single
      # `curl ... | gjs -m -` line, no npm/Node required. The bundle was
      # rebuilt above by `gjsify run build` (executes build:gjs-bundle).
      #
      # Asset upload fires on the original `release` event and on manual
      # reruns that target a specific tag — the second path is the fix for
      # the v0.4.15 incident (release-event run failed, the manual reruns
      # that followed silently skipped the upload because the original
      # gate was hard-pinned to `event_name == 'release'`).
      - name: Generate cli.gjs.mjs.sha256
        if: ${{ (github.event_name == 'release' || inputs.release_tag != '') && inputs.verify_only != true }}
        run: |
          cd packages/infra/cli/dist
          sha256sum cli.gjs.mjs | awk '{print $1}' > cli.gjs.mjs.sha256
          cat cli.gjs.mjs.sha256

      - name: Upload installer + bootstrap bundle to GitHub release
        if: ${{ (github.event_name == 'release' || inputs.release_tag != '') && inputs.verify_only != true }}
        uses: softprops/action-gh-release@v3
        with:
          # On `release` softprops infers tag_name from the event payload.
          # On `workflow_dispatch` we must pass it explicitly so the action
          # targets the operator-specified tag instead of attempting to
          # create a new release from HEAD.
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: |
            install.mjs
            packages/infra/cli/dist/cli.gjs.mjs
            packages/infra/cli/dist/cli.gjs.mjs.sha256

      - name: Summary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'manual' }}
        run: |
          echo "Packages successfully published to npm for release ${RELEASE_TAG}"
          echo "Published packages: @gjsify/*"

  # macOS publish leg for the batteries-included GTK runtime bundle.
  #
  # WHY A SEPARATE JOB: @gjsify/gtk-runtime-darwin-arm64 ships a HEAVY, relocated
  # macOS-arm64 GTK/GI dylib + typelib closure in its `gtk/` dir. That bundle is
  # gitignored and can ONLY be produced on a darwin/arm64 runner (Homebrew closure
  # -> install_name_tool/@loader_path relocation -> ad-hoc codesign, see the
  # package's scripts/build-gtk-runtime.mjs). The ubuntu `publish` job above cannot
  # build it, and it never tries to: `packages/node-gi/*` is NOT a root workspace
  # (see root package.json#workspaces), so `gjsify foreach` — the enumerator behind
  # `gjsify run npm:publish` — never touches this package. Without this job the
  # published tarball is only ever an empty ~18 KB shell (its first 0.19.0 publish
  # was exactly that: isPresent=false, so macOS consumers silently fell back to
  # Homebrew GTK). Here we BUILD the bundle on macOS and OIDC-publish JUST this one
  # package WITH the populated `gtk/`, so `require('@gjsify/gtk-runtime-darwin-arm64')`
  # reports isPresent=true and the "no brew needed" promise is actually delivered.
  #
  # RACE SAFETY: `packages/node-gi/*` not being a workspace means the ubuntu job can
  # never enumerate — let alone shell-publish — this package (nothing can overwrite
  # the real bundle with an empty one). If `packages/node-gi/*` is EVER added to the
  # root `workspaces` list, add `--exclude '@gjsify/gtk-runtime-darwin-arm64'` to the
  # `npm:publish` script's `gjsify foreach` so the ubuntu job keeps skipping it.
  #
  # `needs: publish` so @gjsify/cli@<release-version> is already on npm (this job
  # installs it to drive the OIDC publish) and the two publish legs are serialized.
  #
  # PATTERN: the future @gjsify/gtk-runtime-win32-x64 sibling mirrors this job
  # (windows-latest runner, gvsbuild closure source, its own relocation step).
  publish-gtk-runtime-darwin-arm64:
    name: Publish @gjsify/gtk-runtime-darwin-arm64 (macOS bundle)
    needs: publish
    # Same gate as the ubuntu npm-publish step: a real release, or a dispatch that
    # opts INTO publishing; never in verify_only (audit) mode. On an asset-only
    # re-upload dispatch (skip_publish=true) this whole job is skipped.
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      # id-token: write = npm Trusted Publishing (OIDC). The package's Trusted
      # Publisher is configured for THIS workflow file (release.yml), so an OIDC
      # exchange from any job in it succeeds. contents: read is for checkout.
      contents: read
      id-token: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      # `release` event auto-checks-out the tag; a `workflow_dispatch` must target
      # the operator-specified tag so the built bundle matches what shipped. Mirrors
      # the ubuntu publish job's checkout ref.
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Build-time closure SOURCE only — these libraries are collected + relocated
      # INTO the self-contained bundle, they are NOT a runtime dep of the tarball.
      # Verbatim from .github/workflows/node-gi.yml -> macos-gtk-runtime.
      - name: Install GTK4 + GObject-Introspection (Homebrew, build-time closure source)
        run: brew install gtk4 libadwaita gobject-introspection cairo pango gdk-pixbuf graphene pkg-config

      # Node 24 runs build-gtk-runtime.mjs (node:child_process/fs) and the publish.
      # No `registry-url` here — setting it makes actions/setup-node inject a
      # placeholder NODE_AUTH_TOKEN, which `gjsify publish` reads as "token auth
      # requested" and skips OIDC (see the ubuntu publish job's note). Omitting it
      # keeps the OIDC Trusted-Publishing path.
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Populate the gitignored gtk/ bundle so `files: ["gtk"]` ships it (the packer
      # expands a plain-dir entry recursively). Only --out is needed: the PACKAGE
      # requires just gtk/{lib,girepository-1.0,manifest.json} (index.js isPresent =
      # lib/ && girepository-1.0/). The --addon/--stage relocation is node-gi's OWN
      # prebuilds concern (node-gi.yml), NOT part of this tarball — so no node-gyp
      # addon build here.
      - name: Build the GTK runtime bundle (populate gtk/)
        run: |
          node packages/node-gi/gtk-runtime-darwin-arm64/scripts/build-gtk-runtime.mjs \
            --out packages/node-gi/gtk-runtime-darwin-arm64/gtk

      # Gate the publish on a genuinely populated, portable bundle: assert no
      # /opt/homebrew refs survived relocation, and that the two dirs index.js's
      # isPresent check requires actually exist. Mirrors node-gi.yml's sanity check.
      - name: Verify bundle (relocation clean + layout present)
        run: |
          B=packages/node-gi/gtk-runtime-darwin-arm64/gtk
          cat "$B/manifest.json"
          echo "--- bundle size ---"; du -sh "$B"
          echo "--- assert NO /opt/homebrew refs remain in the bundle ---"
          if otool -L "$B"/lib/*.dylib | grep -F /opt/homebrew; then
            echo "RELOCATION FAILED: bundled dylibs still reference /opt/homebrew"; exit 1
          fi
          if [ ! -d "$B/lib" ] || [ ! -d "$B/girepository-1.0" ]; then
            echo "BUNDLE INCOMPLETE: gtk/lib + gtk/girepository-1.0 are required (index.js isPresent)"; exit 1
          fi
          echo "clean — bundle populated + portable"

      # A Node-runnable @gjsify/cli at the release-train version drives the OIDC
      # publish. The committed cli.gjs.mjs bundle would need gjs + @gjsify/rolldown-
      # native (absent here); this package has NO workspace deps, so a standalone
      # pack needs no `gjsify install`. `needs: publish` guarantees this version is
      # already on npm. Same pattern as node-gi.yml's consumer jobs.
      - name: Prepare a Node-runnable @gjsify/cli
        id: cli
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && npm install "@gjsify/cli@${CLI_VERSION}" --no-audit --no-fund --no-save )
          echo "bin=/tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js" >> "$GITHUB_OUTPUT"
          node /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js --version

      # OIDC Trusted Publishing from release.yml — publishes ONLY this package, WITH
      # the populated gtk/ bundle. `gjsify publish` auto-detects the GitHub OIDC env
      # (id-token: write above, no NODE_AUTH_TOKEN) and exchanges the JWT for a
      # short-lived per-package token. --tolerate-republish makes a manual rerun over
      # an already-published version a no-op instead of a hard 409/403.
      - name: Publish @gjsify/gtk-runtime-darwin-arm64 (OIDC, with bundle)
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
        run: |
          node "${{ steps.cli.outputs.bin }}" publish \
            packages/node-gi/gtk-runtime-darwin-arm64 \
            --tolerate-republish --tag latest --access public

  # Windows publish leg for the batteries-included GTK runtime bundle — the sibling
  # of publish-gtk-runtime-darwin-arm64 above (see that job's rationale in full).
  #
  # WHY A SEPARATE JOB: @gjsify/gtk-runtime-win32-x64 ships a HEAVY GTK/GI DLL +
  # typelib closure in its `gtk/` dir. That bundle is gitignored and can ONLY be
  # produced on a windows/x64 runner (gvsbuild closure -> collect the DLL closure
  # into gtk/bin, see the package's scripts/build-gtk-runtime.mjs). The ubuntu
  # `publish` job cannot build it, and it never tries to: `packages/node-gi/*` is
  # NOT a root workspace, so `gjsify foreach` (behind `gjsify run npm:publish`)
  # never touches this package — the same race-safety the darwin job relies on.
  # Here we BUILD the bundle on Windows and OIDC-publish JUST this one package WITH
  # the populated `gtk/`, so `require('@gjsify/gtk-runtime-win32-x64')` reports
  # isPresent=true and the "no gvsbuild needed" promise is actually delivered.
  #
  # UNLIKE macOS: there is NO relocation/codesign step (Windows resolves DLLs by
  # search path at LoadLibrary time), and NO addon build (the tarball ships only
  # gtk/{bin,girepository-1.0,manifest.json}; the addon prebuild is node-gi's own
  # concern in node-gi.yml).
  #
  # MAINTAINER ACTION — MANUAL FIRST PUBLISH REQUIRED (like the darwin package):
  # npm Trusted Publishing (OIDC) cannot CREATE a package, only publish new versions
  # of an existing one. So @gjsify/gtk-runtime-win32-x64 needs a one-time manual
  # `gjsify publish --access public` + `gjsify trust @gjsify/gtk-runtime-win32-x64`
  # (or `gjsify onboard`) from a maintainer machine BEFORE this job's first CI
  # release — otherwise the OIDC exchange 404s. See AGENTS.md "New @gjsify/* package:
  # first-publish + Trusted Publisher bootstrap".
  #
  # `needs: publish` so @gjsify/cli@<release-version> is already on npm and the two
  # publish legs are serialized.
  publish-gtk-runtime-win32-x64:
    name: Publish @gjsify/gtk-runtime-win32-x64 (Windows bundle)
    needs: publish
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      # id-token: write = npm Trusted Publishing (OIDC), configured for this
      # workflow file (release.yml). contents: read is for checkout.
      contents: read
      id-token: write
    env:
      GVSBUILD_VERSION: '2026.6.0'
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
    steps:
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Node 24 runs build-gtk-runtime.mjs + the publish. No `registry-url` (it would
      # inject a placeholder NODE_AUTH_TOKEN and defeat OIDC — see the ubuntu job).
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Build-time closure SOURCE only — the DLLs are collected INTO the bundle, they
      # are NOT a runtime dep of the tarball.
      - name: Download + extract gvsbuild GTK4 (build-time closure source)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      # Populate the gitignored gtk/ bundle so `files: ["gtk"]` ships it. Only --out +
      # --prefix are needed (no addon relocation on Windows).
      - name: Build the GTK runtime bundle (populate gtk/)
        shell: pwsh
        run: |
          node packages/node-gi/gtk-runtime-win32-x64/scripts/build-gtk-runtime.mjs `
            --out packages/node-gi/gtk-runtime-win32-x64/gtk `
            --prefix $env:GTK_PREFIX

      # Gate the publish on a populated bundle: assert the two dirs index.js's
      # isPresent check requires actually exist.
      - name: Verify bundle (layout present)
        shell: pwsh
        run: |
          $B = "packages/node-gi/gtk-runtime-win32-x64/gtk"
          Get-Content "$B/manifest.json"
          Write-Host "--- bundle size ---"
          "{0:N1} MiB" -f ((Get-ChildItem $B -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          if (-not (Test-Path "$B/bin") -or -not (Test-Path "$B/girepository-1.0")) {
            Write-Host "BUNDLE INCOMPLETE: gtk/bin + gtk/girepository-1.0 are required (index.js isPresent)"
            exit 1
          }
          Write-Host "bundle populated"

      # A Node-runnable @gjsify/cli at the release-train version drives the OIDC
      # publish. This package has NO workspace deps, so a standalone pack needs no
      # `gjsify install`. `needs: publish` guarantees this version is already on npm.
      - name: Prepare a Node-runnable @gjsify/cli
        id: cli
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cliVersion = node -p "require('./packages/infra/cli/package.json').version"
          $dir = Join-Path $env:RUNNER_TEMP 'gjsify-node-cli'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Push-Location $dir
          npm init -y | Out-Null
          npm install "@gjsify/cli@$cliVersion" --no-audit --no-fund --no-save
          Pop-Location
          $bin = Join-Path $dir 'node_modules\@gjsify\cli\lib\index.js'
          "bin=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          node $bin --version

      # OIDC Trusted Publishing from release.yml — publishes ONLY this package, WITH
      # the populated gtk/ bundle. --tolerate-republish makes a manual rerun over an
      # already-published version a no-op instead of a hard 409/403.
      - name: Publish @gjsify/gtk-runtime-win32-x64 (OIDC, with bundle)
        shell: pwsh
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
          CLI_BIN: ${{ steps.cli.outputs.bin }}
        run: |
          node "$env:CLI_BIN" publish `
            packages/node-gi/gtk-runtime-win32-x64 `
            --tolerate-republish --tag latest --access public

  # @gjsify/node-gi is the Node GI reverse bridge. Like the gtk-runtime packages it
  # lives under packages/node-gi/** and is NOT a root workspace, so the ubuntu
  # `publish` job's `gjsify foreach ... publish` never covers it — it was left at
  # 0.13.0 on npm while the release train moved on, and 0.13.0 lacks the
  # ./system, ./gettext, ./cairo subpath exports that every 0.20.0 `--app node`
  # bundle imports (→ ERR_PACKAGE_PATH_NOT_EXPORTED on any external consumer). This
  # dedicated OIDC job publishes it in lockstep with each release, mirroring
  # publish-gtk-runtime-*. Trusted Publishing for @gjsify/node-gi must be configured
  # once for this repo + release.yml (a maintainer runs `gjsify trust`, exactly like
  # the gtk-runtime bootstrap) — OIDC cannot self-bootstrap its own trust.
  #
  # Build the linux node-gi prebuilds (x64 + arm64) so the published tarball SHIPS
  # them. node-gi's `files` includes `prebuilds`, `index.js` prefers a prebuild, and
  # Deno (which runs NO install script) can only load a prebuild — but nothing staged
  # one, so 0.20/0.21 shipped none: node/bun consumers had to `node-gyp rebuild` at
  # install time and a `gjsify install` consumer (which does not run the `install`
  # script) or Deno got no binary at all. Built in the SAME Fedora container node-gi.yml
  # uses (proven GLib/GI ABI) via `npm install` (runs node-gi's `install` = node-gyp
  # rebuild) + stage-prebuild, on a native runner per arch (x64 = ubuntu-latest, arm64 =
  # ubuntu-24.04-arm — no QEMU), then handed to publish-node-gi as artifacts staged into
  # prebuilds/ before publish.
  node-gi-prebuild-linux:
    name: Build @gjsify/node-gi linux-${{ matrix.arch }} prebuild
    needs: publish
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + GObject-Introspection dev headers
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz \
            glib2-devel gobject-introspection-devel cairo-devel
      - name: Use official Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
      # `npm install --foreground-scripts` runs node-gi's `install` (node-gyp rebuild)
      # → build/Release/node_gi.node; stage-prebuild copies it to prebuilds/linux-<arch>
      # (process.arch = x64 | arm64 on the native runner).
      - name: Build + stage the linux-${{ matrix.arch }} prebuild
        working-directory: packages/node-gi/node-gi
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          node scripts/stage-prebuild.mjs
          ls -la prebuilds/*/node_gi.node
      - name: Upload the prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-gi-prebuild-linux-${{ matrix.arch }}
          path: packages/node-gi/node-gi/prebuilds/
          if-no-files-found: error

  publish-node-gi:
    name: Publish @gjsify/node-gi (Node GI reverse bridge)
    needs: [publish, node-gi-prebuild-linux]
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # id-token: write = npm Trusted Publishing (OIDC), configured for this workflow
      # file (release.yml). contents: read is for checkout.
      contents: read
      id-token: write
    steps:
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Stage the linux prebuilds (x64 + arm64, from the node-gi-prebuild-linux matrix)
      # into the package's prebuilds/ dir BEFORE publish, so the tarball ships them
      # (prebuilds is in node-gi's `files`). merge-multiple flattens both artifacts into
      # prebuilds/{linux-x64,linux-arm64}/node_gi.node.
      - name: Download + stage the linux prebuilds (x64 + arm64)
        uses: actions/download-artifact@v4
        with:
          pattern: node-gi-prebuild-linux-*
          merge-multiple: true
          path: packages/node-gi/node-gi/prebuilds/
      - name: Confirm the prebuilds are staged
        run: ls -la packages/node-gi/node-gi/prebuilds/*/node_gi.node

      # No `registry-url` (it would inject a placeholder NODE_AUTH_TOKEN and defeat
      # OIDC — see the ubuntu `publish` job's rationale).
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # A Node-runnable @gjsify/cli at the release-train version drives the OIDC
      # publish. node-gi has no WORKSPACE deps, so a standalone pack needs no
      # `gjsify install`. `needs: publish` guarantees this CLI version is on npm.
      - name: Prepare a Node-runnable @gjsify/cli
        id: cli
        run: |
          set -euo pipefail
          cliVersion=$(node -p "require('./packages/infra/cli/package.json').version")
          dir="$RUNNER_TEMP/gjsify-node-cli"
          mkdir -p "$dir"
          ( cd "$dir" && npm init -y >/dev/null && npm install "@gjsify/cli@$cliVersion" --no-audit --no-fund --no-save )
          echo "bin=$dir/node_modules/@gjsify/cli/lib/index.js" >> "$GITHUB_OUTPUT"
          node "$dir/node_modules/@gjsify/cli/lib/index.js" --version

      # OIDC Trusted Publishing from release.yml — publishes ONLY node-gi, at whatever
      # version its package.json carries at the released tag (the release-it bumper
      # aligns it to the train version). --tolerate-republish makes a manual rerun
      # over an already-published version a no-op instead of a hard 409/403.
      - name: Publish @gjsify/node-gi (OIDC)
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
          CLI_BIN: ${{ steps.cli.outputs.bin }}
        run: |
          node "$CLI_BIN" publish packages/node-gi/node-gi \
            --tolerate-republish --tag latest --access public

  # ---------------------------------------------------------------------------
  # @gjsify/napi — the N-API host for GJS (native `.node` addons IN GJS), the
  # forward mirror of @gjsify/node-gi. Same structural situation as node-gi and
  # the two gtk-runtime packages: `packages/napi/**` is deliberately NOT a root
  # workspace member (see root package.json#workspaces + the affected-classifier
  # IGNORE list), so `gjsify foreach` — the enumerator behind the ubuntu
  # `publish` job's `gjsify run npm:publish` — never sees it. Unlike node-gi,
  # which was at least published once and then went stale, @gjsify/napi had NO
  # publish path at all: the package did not exist on npm, while AGENTS.md and
  # the website documented `gjsify install @gjsify/napi` as the user-facing flow
  # for transparent `.node` loading. These three jobs are that path.
  #
  # SHAPE (mirrors node-gi-prebuild-linux -> publish-node-gi, one leg per
  # platform): build the meson shim on a native runner per platform, upload the
  # staged prebuild dir as an artifact, then publish ONE tarball carrying BOTH
  # prebuild triples. napi.yml already builds + gates the exact same shim on
  # every push/PR that touches packages/napi/** (Fedora 44 gates + conformance,
  # macOS build + load/value-model/tsfn gates), so these release jobs only
  # rebuild + stage — they do not re-run the gates.
  #
  # WHY NOT `merge-multiple: true` LIKE node-gi: node-gi's two artifacts are
  # disjoint triples under one gitignored `prebuilds/` dir, so flattening them is
  # safe. Here `prebuilds/linux-x64/` is COMMITTED, so the macOS runner's
  # checkout also carries a (possibly stale) copy of it — a merged download could
  # non-deterministically overwrite the freshly built linux .so with the
  # committed one. Each leg therefore uploads only its OWN triple dir and
  # publish-napi downloads each into its own explicit destination.
  #
  # RACE SAFETY: identical to publish-node-gi — `packages/napi/**` not being a
  # workspace means the ubuntu `publish` job can never enumerate, let alone
  # publish, this package, so the two legs can never write the same version. If
  # `packages/napi/*` is EVER added to the root `workspaces` list, add
  # `--exclude '@gjsify/napi'` to the `npm:publish` script's `gjsify foreach` so
  # the ubuntu job keeps skipping it.
  napi-prebuild-linux:
    name: Build @gjsify/napi linux-x64 prebuild
    needs: publish
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      # Verbatim from napi.yml's `consumer` job — the meson/Vala/C++ toolchain
      # plus the mozjs-140 + gjs-devel headers the shim links (ADR 0011's
      # intrinsic mozjs-major pin). No node-gyp here: this job builds only the
      # shim, not the N-API test addons.
      - name: Install toolchain + mozjs-140 + GJS + GI dev headers
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            mozjs140-devel gjs gjs-devel libsoup3 \
            gobject-introspection gobject-introspection-devel glib2-devel \
            vala meson ninja-build
          gjs --version

      - name: Checkout repository (the released tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Verbatim from napi.yml's "Build the @gjsify/napi shim (meson) + stage
      # prebuild" step: meson builds libgjsifynapi.so + GjsifyNapi-1.0.{gir,typelib}
      # and stages them into the committed prebuild dir. The freshly built triple
      # overwrites whatever the checkout carried, so the tarball always ships a
      # binary built from the released source.
      - name: Build the @gjsify/napi shim (meson) + stage prebuild
        working-directory: packages/napi/napi
        run: |
          meson setup build .
          meson compile -C build
          cp build/libgjsifynapi.so build/GjsifyNapi-1.0.gir build/GjsifyNapi-1.0.typelib prebuilds/linux-x64/
          echo "staged: $(ls -1 prebuilds/linux-x64)"

      - name: Upload the linux-x64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-prebuild-linux-x64
          path: packages/napi/napi/prebuilds/linux-x64
          if-no-files-found: error

  # macOS arm64 leg. Homebrew ships the SAME gjs 1.88.x <-> spidermonkey
  # (mozjs-140) pairing the Fedora job pins, so no source build is needed; meson
  # branches to ld64's -exported_symbols_list and the .dylib leaf (see
  # meson.build). Verbatim from napi.yml's `macos` job, minus the node-gyp gates
  # (napi.yml runs those on every packages/napi/** push/PR).
  napi-prebuild-darwin-arm64:
    name: Build @gjsify/napi darwin-arm64 prebuild
    needs: publish
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Install GJS + SpiderMonkey (mozjs-140) + GI toolchain (Homebrew)
        run: |
          # `gjs` pulls `spidermonkey` (mozjs-140) + glib/gobject/gio/cairo
          # transitively; name gobject-introspection (g-ir-compiler), vala, meson,
          # ninja and pkgconf explicitly so the shim's build deps all resolve.
          brew install gjs gobject-introspection vala meson ninja pkgconf
          BREW_PREFIX="$(brew --prefix)"
          # Neither `gjs` nor `spidermonkey` is keg-only, so brew symlinks their
          # lib/pkgconfig (gjs-1.0.pc, mozjs-140.pc + the glib/gobject/gio .pc that
          # gjs-1.0.pc Requires) into $BREW_PREFIX/lib/pkgconfig — one dir resolves
          # the whole shim closure.
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Verify toolchain (gjs / mozjs-140 / gjs-1.0 / valac)
        run: |
          gjs --version
          echo "mozjs-140: $(pkg-config --modversion mozjs-140)"
          echo "gjs-1.0:   $(pkg-config --modversion gjs-1.0)"
          echo "valac:     $(valac --version)"

      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Build the @gjsify/napi shim (meson) + stage darwin-arm64 prebuild
        working-directory: packages/napi/napi
        run: |
          meson setup build .
          meson compile -C build
          mkdir -p prebuilds/darwin-arm64
          cp build/libgjsifynapi.dylib build/GjsifyNapi-1.0.gir build/GjsifyNapi-1.0.typelib prebuilds/darwin-arm64/
          echo "staged: $(ls -1 prebuilds/darwin-arm64)"

      - name: Upload the darwin-arm64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-prebuild-darwin-arm64
          path: packages/napi/napi/prebuilds/darwin-arm64
          if-no-files-found: error

  # MAINTAINER ACTION — MANUAL FIRST PUBLISH REQUIRED (like the gtk-runtime and
  # node-gi packages, but here it has never happened at all: `curl
  # https://registry.npmjs.org/@gjsify/napi` still 404s). npm Trusted Publishing
  # (OIDC) can only publish new versions of an EXISTING package, so @gjsify/napi
  # needs a one-time manual `gjsify publish --access public` + `gjsify trust
  # @gjsify/napi` (or `gjsify onboard`) from a maintainer machine BEFORE this
  # job's first CI release — otherwise the OIDC exchange 404s and this job reds.
  # See AGENTS.md "New @gjsify/* package: first-publish + Trusted Publisher
  # bootstrap".
  #
  # WHY THIS JOB BUILDS lib/ (unlike publish-node-gi): node-gi ships committed
  # hand-written JS, so its publish job only stages prebuilds. @gjsify/napi's
  # published entry points (`main`/`types` -> lib/esm/index.js,
  # lib/types/index.d.ts) are BUILD ARTIFACTS that are not committed, so this job
  # runs the package's own `build` script (build:gjsify + build:types) before
  # packing. That needs the workspace's @girs/* + @types/node + @gjsify/tsc on
  # disk (napi's tsconfig `types` array names them), which is exactly what the
  # ubuntu `publish` job's `gjsify install --immutable` recipe provides — so this
  # job runs on the SAME ci-fedora image with the SAME Node-free install, then
  # publishes with the workspace's own `gjsify` (the version being released).
  publish-napi:
    name: Publish @gjsify/napi (N-API host for GJS)
    needs: [publish, napi-prebuild-linux, napi-prebuild-darwin-arm64]
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # id-token: write = npm Trusted Publishing (OIDC), configured for this
      # workflow file (release.yml). contents: read is for checkout; packages:
      # read pulls the prebuilt ci-fedora image from ghcr (same as `publish`).
      contents: read
      id-token: write
      packages: read
    container:
      # Same image the ubuntu `publish` job builds + publishes on — it carries
      # gjs (+ libsoup3, which the committed cli.gjs.mjs eager-imports via
      # gi://Soup), so `gjsify install --immutable` and the workspace `gjsify`
      # bin run with no manual dnf step.
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Stage BOTH prebuild triples into the package's prebuilds/ dir before the
      # pack (`prebuilds` is in napi's `files`, and the gjsify packer expands a
      # plain-dir entry recursively — so every triple present on disk ships).
      # Downloaded first so a missing artifact fails before the multi-minute
      # workspace install below.
      - name: Download the linux-x64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: napi-prebuild-linux-x64
          path: packages/napi/napi/prebuilds/linux-x64

      - name: Download the darwin-arm64 prebuild
        uses: actions/download-artifact@v4
        with:
          name: napi-prebuild-darwin-arm64
          path: packages/napi/napi/prebuilds/darwin-arm64

      - name: Confirm both prebuilds are staged
        run: |
          set -eu
          ls -la packages/napi/napi/prebuilds/linux-x64 packages/napi/napi/prebuilds/darwin-arm64
          test -f packages/napi/napi/prebuilds/linux-x64/libgjsifynapi.so
          test -f packages/napi/napi/prebuilds/linux-x64/GjsifyNapi-1.0.typelib
          test -f packages/napi/napi/prebuilds/darwin-arm64/libgjsifynapi.dylib
          test -f packages/napi/napi/prebuilds/darwin-arm64/GjsifyNapi-1.0.typelib

      # No `registry-url` (it would inject a placeholder NODE_AUTH_TOKEN and
      # defeat OIDC — see the ubuntu `publish` job's rationale).
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      # Phase D.7d Node-free install via the committed GJS bundle — verbatim from
      # the ubuntu `publish` job. Provides @girs/{gjs,glib-2.0,gobject-2.0},
      # @types/node and @gjsify/tsc for the type emit below, plus the workspace
      # `gjsify` bin used for the build + publish.
      - name: Install dependencies (gjsify install --immutable)
        run: gjs -m packages/infra/cli/dist/cli.gjs.mjs install --immutable

      # `build` = build:gjsify (rolldown --library -> lib/esm) + build:types
      # (gjsify tsc -> lib/types). packages/napi/napi is not a workspace, so it is
      # driven with `gjsify run` from inside the package dir rather than through
      # `gjsify workspace`/`foreach`.
      # The workspace `gjsify` shim prefers the committed GJS bundle, and under
      # GJS the ONLY bundler engine is @gjsify/rolldown-native — whose JS facade
      # `lib/` is a build output, not tracked. `gjsify install` does not produce
      # it, so without this the next step dies with "no usable bundler engine
      # under GJS". This is the same bootstrap the root `build:infra` runs; it
      # is mtime-skipped, so it costs nothing when the facade is already there.
      - name: Bootstrap the native bundler facade
        run: node scripts/bootstrap-native-facades.mjs

      - name: Build @gjsify/napi lib/ (esm + types)
        working-directory: packages/napi/napi
        run: PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" gjsify run build

      # A silent no-op emit would otherwise publish a tarball whose `main`/`types`
      # point at files that do not exist (tsc skips emit when it finds a stale
      # tsconfig.tsbuildinfo, and the packer only fails on a types path that is
      # present-but-unpacked). Assert the two published entry points exist.
      - name: Verify the built lib/ is complete
        run: |
          set -eu
          test -f packages/napi/napi/lib/esm/index.js
          test -f packages/napi/napi/lib/types/index.d.ts
          ls -la packages/napi/napi/lib/esm packages/napi/napi/lib/types

      # OIDC Trusted Publishing from release.yml — publishes ONLY @gjsify/napi,
      # at whatever version its package.json carries at the released tag (the
      # release-it bumper's `packages/*/*/package.json` glob covers it, so it
      # tracks the train). Driven by the workspace's own `gjsify` (the version
      # being released) rather than an npm-installed CLI, because the install
      # above already put it on disk. --tolerate-republish makes a manual rerun
      # over an already-published version a no-op instead of a hard 409/403.
      - name: Publish @gjsify/napi (OIDC, with both prebuilds)
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
        run: |
          PATH="$PWD/node_modules/.bin:$PATH" gjsify publish packages/napi/napi \
            --tolerate-republish --tag latest --access public
