# Workflow to automatically publish packages to npm on new releases
name: Release to NPM

on:
  release:
    types: [published]
  # Manual reruns. Two scenarios:
  #   1. Re-publish + (re-)upload assets for a real existing release whose
  #      original `release`-event run didn't finish (e.g. asset upload was
  #      skipped because an earlier manual rerun trampled the release
  #      context). Pass the tag in `release_tag`; the workflow checks out
  #      that tag, rebuilds, and uploads the assets to the named release.
  #      Defaults to skip_publish=true so npm isn't republished (already
  #      done by the original run).
  #   2. Ad-hoc smoke test from main with no release attached. Leave
  #      `release_tag` empty.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to (re)upload assets to (e.g. v0.4.15). Leave empty for a no-op dispatch from main.'
        required: false
        default: ''
      skip_publish:
        description: 'Skip the npm publish step (default true — re-uploads are for fixing missing release assets; npm side already published).'
        required: false
        type: boolean
        default: true
      verify_only:
        description: 'Run `gjsify foreach publish --check-trusted` against every package and skip the actual publish. Used to audit Trusted Publisher configs on npmjs.com after configuring them — the OIDC JWT issued for THIS workflow file matches the configured `release.yml` Trusted Publishers.'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      # contents: write so softprops/action-gh-release can upload install.mjs
      # + cli.gjs.mjs + .sha256 as assets onto the release record that
      # triggered this workflow. id-token: write keeps OIDC provenance
      # available for future signed-publish work. packages: read lets the job
      # pull the prebuilt ci-fedora image from ghcr (same as main.yml).
      contents: write
      id-token: write
      packages: read
    container:
      # Build + publish on the SAME prebuilt CI image main.yml builds/tests on —
      # it bundles every build dependency (gjs, gtk4 / libadwaita / blueprint,
      # libatomic, …), so this job needs no manual `dnf install`. Standardised on
      # Fedora 44; the bare fedora:43 image was dropped (its Node 26 binary failed
      # to load libatomic.so.1, and f44 is the supported platform).
      image: ghcr.io/gjsify/ci-fedora:44

    steps:
      # `release` event auto-checks-out the tag. `workflow_dispatch` with a
      # `release_tag` input must explicitly target that tag so the rebuilt
      # bundle + install.mjs match what shipped (not main HEAD).
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # OIDC mode: no `registry-url` here. When set, actions/setup-node
      # injects `NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX` as a literal
      # placeholder into the job env so the generated .npmrc has SOME
      # token reference to expand. That placeholder leaks into every
      # subprocess as a non-empty NODE_AUTH_TOKEN, which `gjsify publish`
      # auto-detect (`!process.env.NODE_AUTH_TOKEN`) then interprets as
      # "user opted into token auth" and skips OIDC — defeating the
      # entire Trusted Publishing setup. Dropping `registry-url` makes
      # setup-node not write the placeholder npmrc; gjsify publish reads
      # the registry from the package's own `publishConfig.registry`
      # (or DEFAULT_REGISTRY) and authenticates via OIDC exchange.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      # Phase D.7d: Node-free install via the committed GJS bundle.
      # Mirrors main.yml — see that workflow for rationale.
      - name: Install dependencies (gjsify install --immutable)
        run: gjs -m packages/infra/cli/dist/cli.gjs.mjs install --immutable

      - name: Build packages
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run build

      - name: Build examples
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run build:examples

      # Trusted-Publisher audit. Runs when `gh workflow run release.yml
      # -f verify_only=true` is invoked. The OIDC JWT issued for this
      # workflow file matches the `release.yml` filename configured per
      # package as Trusted Publisher on npmjs.com, so a `--check-trusted`
      # exchange succeeds for every correctly-configured package and 4xx
      # for every misconfigured one. Always exits 0; read the GitHub Step
      # Summary for the per-bucket counts + list of failing packages.
      - name: Verify Trusted Publishers (audit mode)
        if: ${{ inputs.verify_only == true }}
        id: check_trusted
        env:
          GJSIFY_PUBLISH_DEBUG: "1"
        run: |
          set -o pipefail
          PATH="$PWD/node_modules/.bin:$PATH" \
            gjsify foreach -v --no-private \
              --exclude '@girs/*' \
              --exec -- gjsify publish --check-trusted \
            2>&1 | tee /tmp/check-trusted.log

          MISCONFIGURED=$(grep -cE "(^|\] )✗ " /tmp/check-trusted.log || true)
          OK=$(grep -cE "(^|\] )✓ " /tmp/check-trusted.log || true)
          SKIPPED=$(grep -cE "(^|\] )- " /tmp/check-trusted.log || true)

          {
            echo "## Trusted Publisher verification"
            echo ""
            echo "| Status | Count |"
            echo "|---|---|"
            echo "| ✓ Configured        | $OK |"
            echo "| ✗ Misconfigured     | $MISCONFIGURED |"
            echo "| - Skipped (private) | $SKIPPED |"
            echo ""
            if [ "$MISCONFIGURED" -gt 0 ]; then
              echo "### Misconfigured packages"
              echo ""
              echo "Each row below means the OIDC token exchange returned non-2xx for that package. Most common cause: no Trusted Publisher entry yet — add one at https://www.npmjs.com/package/<name>/access with Repository: gjsify/gjsify, Workflow: release.yml."
              echo ""
              FENCE='```'
              echo "$FENCE"
              grep -E "(^|\] )✗ " /tmp/check-trusted.log || true
              echo "$FENCE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish to npm on the `release` event (always) or on
      # workflow_dispatch with skip_publish=false. Never runs in
      # `verify_only` mode — that path is a pure audit.
      # Authentication mode: npm Trusted Publishing (OIDC). `gjsify publish`
      # auto-detects the GitHub Actions OIDC env vars (the workflow has
      # `id-token: write` above) and, with no NODE_AUTH_TOKEN present,
      # exchanges the runner-minted JWT at npm's
      # `/-/npm/v1/oidc/token/exchange/package/<name>` endpoint for a
      # short-lived publish token per package. The 104 stable @gjsify/*
      # packages have Trusted Publisher entries configured for this
      # repo + workflow on npmjs.com (verified via the `verify_only`
      # audit before this cutover). Long-lived `NPM_TOKEN` secret can
      # be removed once a real OIDC release completes successfully.
      - name: Publish packages to npm
        if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run npm:publish
        env:
          GJSIFY_PUBLISH_DEBUG: "1"

      # Phase F: ship install.mjs + cli.gjs.mjs as GitHub-release assets so end
      # users can bootstrap gjsify (or any gjsify-based GJS app) with a single
      # `curl ... | gjs -m -` line, no npm/Node required. The bundle was
      # rebuilt above by `gjsify run build` (executes build:gjs-bundle).
      #
      # Asset upload fires on the original `release` event and on manual
      # reruns that target a specific tag — the second path is the fix for
      # the v0.4.15 incident (release-event run failed, the manual reruns
      # that followed silently skipped the upload because the original
      # gate was hard-pinned to `event_name == 'release'`).
      - name: Generate cli.gjs.mjs.sha256
        if: ${{ (github.event_name == 'release' || inputs.release_tag != '') && inputs.verify_only != true }}
        run: |
          cd packages/infra/cli/dist
          sha256sum cli.gjs.mjs | awk '{print $1}' > cli.gjs.mjs.sha256
          cat cli.gjs.mjs.sha256

      - name: Upload installer + bootstrap bundle to GitHub release
        if: ${{ (github.event_name == 'release' || inputs.release_tag != '') && inputs.verify_only != true }}
        uses: softprops/action-gh-release@v3
        with:
          # On `release` softprops infers tag_name from the event payload.
          # On `workflow_dispatch` we must pass it explicitly so the action
          # targets the operator-specified tag instead of attempting to
          # create a new release from HEAD.
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: |
            install.mjs
            packages/infra/cli/dist/cli.gjs.mjs
            packages/infra/cli/dist/cli.gjs.mjs.sha256

      - name: Summary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'manual' }}
        run: |
          echo "Packages successfully published to npm for release ${RELEASE_TAG}"
          echo "Published packages: @gjsify/*"

  # macOS publish leg for the batteries-included GTK runtime bundle.
  #
  # WHY A SEPARATE JOB: @gjsify/gtk-runtime-darwin-arm64 ships a HEAVY, relocated
  # macOS-arm64 GTK/GI dylib + typelib closure in its `gtk/` dir. That bundle is
  # gitignored and can ONLY be produced on a darwin/arm64 runner (Homebrew closure
  # -> install_name_tool/@loader_path relocation -> ad-hoc codesign, see the
  # package's scripts/build-gtk-runtime.mjs). The ubuntu `publish` job above cannot
  # build it, and it never tries to: `packages/node-gi/*` is NOT a root workspace
  # (see root package.json#workspaces), so `gjsify foreach` — the enumerator behind
  # `gjsify run npm:publish` — never touches this package. Without this job the
  # published tarball is only ever an empty ~18 KB shell (its first 0.19.0 publish
  # was exactly that: isPresent=false, so macOS consumers silently fell back to
  # Homebrew GTK). Here we BUILD the bundle on macOS and OIDC-publish JUST this one
  # package WITH the populated `gtk/`, so `require('@gjsify/gtk-runtime-darwin-arm64')`
  # reports isPresent=true and the "no brew needed" promise is actually delivered.
  #
  # RACE SAFETY: `packages/node-gi/*` not being a workspace means the ubuntu job can
  # never enumerate — let alone shell-publish — this package (nothing can overwrite
  # the real bundle with an empty one). If `packages/node-gi/*` is EVER added to the
  # root `workspaces` list, add `--exclude '@gjsify/gtk-runtime-darwin-arm64'` to the
  # `npm:publish` script's `gjsify foreach` so the ubuntu job keeps skipping it.
  #
  # `needs: publish` so @gjsify/cli@<release-version> is already on npm (this job
  # installs it to drive the OIDC publish) and the two publish legs are serialized.
  #
  # PATTERN: the future @gjsify/gtk-runtime-win32-x64 sibling mirrors this job
  # (windows-latest runner, gvsbuild closure source, its own relocation step).
  publish-gtk-runtime-darwin-arm64:
    name: Publish @gjsify/gtk-runtime-darwin-arm64 (macOS bundle)
    needs: publish
    # Same gate as the ubuntu npm-publish step: a real release, or a dispatch that
    # opts INTO publishing; never in verify_only (audit) mode. On an asset-only
    # re-upload dispatch (skip_publish=true) this whole job is skipped.
    if: ${{ (github.event_name == 'release' || inputs.skip_publish == false) && inputs.verify_only != true }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      # id-token: write = npm Trusted Publishing (OIDC). The package's Trusted
      # Publisher is configured for THIS workflow file (release.yml), so an OIDC
      # exchange from any job in it succeeds. contents: read is for checkout.
      contents: read
      id-token: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      # `release` event auto-checks-out the tag; a `workflow_dispatch` must target
      # the operator-specified tag so the built bundle matches what shipped. Mirrors
      # the ubuntu publish job's checkout ref.
      - name: Checkout repository (the released tag)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      # Build-time closure SOURCE only — these libraries are collected + relocated
      # INTO the self-contained bundle, they are NOT a runtime dep of the tarball.
      # Verbatim from .github/workflows/node-gi.yml -> macos-gtk-runtime.
      - name: Install GTK4 + GObject-Introspection (Homebrew, build-time closure source)
        run: brew install gtk4 libadwaita gobject-introspection cairo pango gdk-pixbuf graphene pkg-config

      # Node 24 runs build-gtk-runtime.mjs (node:child_process/fs) and the publish.
      # No `registry-url` here — setting it makes actions/setup-node inject a
      # placeholder NODE_AUTH_TOKEN, which `gjsify publish` reads as "token auth
      # requested" and skips OIDC (see the ubuntu publish job's note). Omitting it
      # keeps the OIDC Trusted-Publishing path.
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Populate the gitignored gtk/ bundle so `files: ["gtk"]` ships it (the packer
      # expands a plain-dir entry recursively). Only --out is needed: the PACKAGE
      # requires just gtk/{lib,girepository-1.0,manifest.json} (index.js isPresent =
      # lib/ && girepository-1.0/). The --addon/--stage relocation is node-gi's OWN
      # prebuilds concern (node-gi.yml), NOT part of this tarball — so no node-gyp
      # addon build here.
      - name: Build the GTK runtime bundle (populate gtk/)
        run: |
          node packages/node-gi/gtk-runtime-darwin-arm64/scripts/build-gtk-runtime.mjs \
            --out packages/node-gi/gtk-runtime-darwin-arm64/gtk

      # Gate the publish on a genuinely populated, portable bundle: assert no
      # /opt/homebrew refs survived relocation, and that the two dirs index.js's
      # isPresent check requires actually exist. Mirrors node-gi.yml's sanity check.
      - name: Verify bundle (relocation clean + layout present)
        run: |
          B=packages/node-gi/gtk-runtime-darwin-arm64/gtk
          cat "$B/manifest.json"
          echo "--- bundle size ---"; du -sh "$B"
          echo "--- assert NO /opt/homebrew refs remain in the bundle ---"
          if otool -L "$B"/lib/*.dylib | grep -F /opt/homebrew; then
            echo "RELOCATION FAILED: bundled dylibs still reference /opt/homebrew"; exit 1
          fi
          if [ ! -d "$B/lib" ] || [ ! -d "$B/girepository-1.0" ]; then
            echo "BUNDLE INCOMPLETE: gtk/lib + gtk/girepository-1.0 are required (index.js isPresent)"; exit 1
          fi
          echo "clean — bundle populated + portable"

      # A Node-runnable @gjsify/cli at the release-train version drives the OIDC
      # publish. The committed cli.gjs.mjs bundle would need gjs + @gjsify/rolldown-
      # native (absent here); this package has NO workspace deps, so a standalone
      # pack needs no `gjsify install`. `needs: publish` guarantees this version is
      # already on npm. Same pattern as node-gi.yml's consumer jobs.
      - name: Prepare a Node-runnable @gjsify/cli
        id: cli
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          ( cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1 \
            && npm install "@gjsify/cli@${CLI_VERSION}" --no-audit --no-fund --no-save )
          echo "bin=/tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js" >> "$GITHUB_OUTPUT"
          node /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js --version

      # OIDC Trusted Publishing from release.yml — publishes ONLY this package, WITH
      # the populated gtk/ bundle. `gjsify publish` auto-detects the GitHub OIDC env
      # (id-token: write above, no NODE_AUTH_TOKEN) and exchanges the JWT for a
      # short-lived per-package token. --tolerate-republish makes a manual rerun over
      # an already-published version a no-op instead of a hard 409/403.
      - name: Publish @gjsify/gtk-runtime-darwin-arm64 (OIDC, with bundle)
        env:
          GJSIFY_PUBLISH_DEBUG: '1'
        run: |
          node "${{ steps.cli.outputs.bin }}" publish \
            packages/node-gi/gtk-runtime-darwin-arm64 \
            --tolerate-republish --tag latest --access public
