name: Cut a release

# CUT a release from CI — the version bump, changelog, release commit, tag and
# GitHub release. PUBLISHING stays in `release.yml`, which fires on the
# `release: published` event this workflow produces. Two workflows because they
# are two acts: this one decides WHAT ships, that one ships it.
#
# WHY THIS EXISTS — it is a correctness fix, not a convenience.
#
# `release-it`'s `after:bump` hook runs `verify-committed-bundles.mjs --rebuild`,
# which REBUILDS the committed GJS bundles and commits whatever it produced. So
# the release ships bundles built by whatever machine ran the release. That is
# only safe if that machine reproduces them byte-identically — and at least one
# developer machine measurably did NOT: rebuilding `tsc.gjs.mjs` there yielded a
# 68-byte-larger file with a different module order (`mapSysname` where the
# committed bundle has `makeCallable`), while the same commit reproduced
# byte-identically in CI. The cause is now IDENTIFIED and fixed at the core:
# `globToEntryPoints` handed fast-glob's completion-ordered matches to Rolldown
# as the entry order, sibling directories race in fast-glob's concurrent
# walker, and Rolldown renders every chunk's imports in entry-order-derived
# exec order — so a `--library` build that caught a minority ordering emitted
# reordered `lib/esm` files, and every bundle inlining them drifted (the
# per-package build cache then kept the raced order alive across rebuilds,
# which is why install/cache/shim/facade repairs could not cure it). Each
# pattern's expansion is now sorted (`utils/entry-points.ts`; guarded by
# `entry-points.spec.ts` + `tests/e2e/deterministic-library-build/`).
#
# Cutting from CI removes the variable entirely: the bundles that ship are built
# in the environment that verifies them. This is also what made the v0.24.0 cut
# fail — a release produced from a tree whose state nobody could explain.
#
# PRE-FLIGHT (do this first, it is the whole point of having it):
#   gh workflow run main.yml --ref main     # deliberate FULL sweep on the ref
# `main.yml`'s selective gates mean a green PR does not imply a green release
# commit; the dispatch is the one that runs everything on the exact ref.
on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment: patch | minor | major (or an exact version like 0.24.1)'
        required: false
        default: 'patch'
      dry_run:
        description: 'Dry run — resolve + print everything, write nothing. Leave ON until a run looks right.'
        required: false
        type: boolean
        default: true
      runtime:
        description: >-
          Cold-tree bootstrap runtime. Switches ONLY that step, and is forwarded to release.yml so the
          cut and the publish cannot pick different ones (they did in v0.31.0). Node survives either
          value: setup-node, npx release-it, the `node scripts/*` hooks inside .release-it.json (which
          no input can reach), verify-committed-bundles.mjs and the dispatch step all still run on it.
          Each run prints a DRIVER line naming the interpreter actually used, derived from the shim.
        required: false
        type: choice
        options: [node, gjs]
        default: node

# Cutting pushes a commit + tag to main and creates a release.
# `actions: write` is for the publish dispatch at the end of the job — see there.
permissions:
  contents: write
  actions: write

concurrency:
  # Never two cuts at once — they would race on the same tag + main ref.
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Cut ${{ inputs.increment }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # The SAME image release.yml publishes from — it carries gjs, GTK, the
      # blueprint toolchain and everything the workspace build needs, so the
      # bundles this job commits are built exactly where they are verified.
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      # Full history + tags: the conventional-changelog plugin walks commits
      # since the last tag, and release-it derives the next version from the
      # tags. A shallow clone silently produces an empty changelog.
      # SSH via the repository DEPLOY KEY, not the workflow token — and that is
      # forced rather than preferred, for the same reason `commit-prebuilds` in
      # prebuilds.yml uses it.
      #
      # `main` is protected by the `main` ruleset, whose `required_status_checks`
      # rule applies to DIRECT PUSHES and not only to pull requests. The release
      # commit is created BY this job, so the three required checks cannot
      # possibly have run on it — the push is rejected with
      #
      #   GH013: Repository rule violations found for refs/heads/main.
      #     - 3 of 3 required status checks are expected.
      #
      # which is not a condition any amount of waiting satisfies. The ruleset
      # already grants `DeployKey` an `always` bypass precisely for this class of
      # push (alongside org/repo admins); the workflow token's
      # `github-actions[bot]` is deliberately NOT a bypass actor, because that
      # would exempt EVERY workflow holding `contents: write` rather than the two
      # bot paths that need it. So the fix is to push as the actor the repo has
      # already sanctioned, NOT to widen the ruleset.
      #
      # Measured: the ruleset was created 2026-08-02, one day after v0.26.1, so
      # the v0.27.0 attempt was the first cut to meet it — it failed AFTER
      # `verify-committed-bundles` had passed and left nothing behind, because
      # release-it rolled the remote tag back on the failed push.
      #
      # This is not an unverified push: the job installs, builds and runs
      # `scripts/verify-committed-bundles.mjs` before release-it commits, and the
      # tree it cuts from is a `main` commit that already went green.
      - name: Checkout main (full history + tags)
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # Handing the key to checkout is what makes the later `git push` use
          # SSH as the deploy key rather than HTTPS as the workflow token.
          ssh-key: ${{ secrets.PREBUILDS_DEPLOY_KEY }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      # Node-free install via the PUBLISHED gjsify (ADR 0002) — verbatim from
      # release.yml's publish job. See .github/actions/gjsify-setup for why
      # `latest` and not a pin, and for why `GJSIFY_BOOTSTRAP` is exported.
      - name: Install dependencies (gjsify install --immutable)
        run: |
          B=$(gjs -m install.mjs --fetch-only)
          gjs -m "$B" install --immutable
          echo "GJSIFY_BOOTSTRAP=$B" >> "$GITHUB_ENV"

      # Bootstrap under NODE, not under the GJS bootstrap bundle.
      #
      # `$GJSIFY_BOOTSTRAP` is downloaded from `releases/latest/download/cli.gjs.mjs`,
      # so it is ALWAYS THE PREVIOUS RELEASE'S CLI. That makes this step unfixable
      # from the CLI source: a bug reached here can only be repaired by a release,
      # and this step is what a release runs. v0.31.0's first cut hit exactly that —
      # `gjsify tsc` inside `@gjsify/create-app`'s build spawned the bootstrap bundle
      # instead of `node`, wrote no `lib/index.js`, and the `&&` chain then died in
      # `set-bin-mode.mjs` on the missing file, naming a step past the fault.
      #
      # A published @gjsify/cli run under Node has none of that surface: `isNode()`
      # is genuinely true so `nodeBinary()` resolves the real interpreter, and
      # `process.exit()` is immediate rather than idle-scheduled. It is the same
      # mechanism napi.yml already uses for the same reason, down to the shared
      # `install-published-cli.sh` (which retries through the window where a release
      # has bumped every package.json but npm does not serve the version yet).
      #
      # TEMPORARY, AND MEANT TO BE REVERTED. The project's direction is to run as
      # much as possible ON gjsify rather than on Node — CI included — because
      # running the toolchain on itself is what makes its defects observable at
      # all. This one step is the exception only because it cannot repair itself.
      # Revert it to `gjs -m "$GJSIFY_BOOTSTRAP" run build:infra` once BOTH hold:
      #   1. a RELEASED @gjsify/cli carries the fixes this step trips over
      #      (gjsify#1038: `gjsify tsc` exiting 0 when it can spawn no compiler),
      #      so `releases/latest` is no longer the broken one; and
      #   2. a NON-BLOCKING job exercises the GJS-hosted bootstrap, so the next
      #      regression there is a signal rather than a deadlocked release.
      # Without (2) a revert only re-arms the trap for the next CLI bug.
      # Note: every step AFTER this one already runs the repo's own CLI
      # (`PATH="$PWD/node_modules/.bin:$PATH" gjsify …`), so what is on Node here
      # is the cold start, not the release.
      - name: Bootstrap the build toolchain (cold trees only)
        run: .github/scripts/bootstrap-cold-tree.sh "${{ inputs.runtime || 'node' }}"

      # `verify-committed-bundles.mjs` (the after:bump hook) resolves each
      # workspace dep's `lib/esm` — it must run AFTER a workspace build, which is
      # documented in the script itself.
      - name: Build packages
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run build

      # Prove the tree reproduces BEFORE bumping anything. If this fails, the
      # cut would ship bundles that do not match their source — exactly the
      # condition this workflow exists to prevent — and it fails here, before a
      # commit, a tag or a release record exists.
      - name: Verify the committed bundles reproduce
        run: PATH="$PWD/node_modules/.bin:$PATH" node scripts/verify-committed-bundles.mjs

      - name: Configure the release author
        run: |
          git config --global user.name 'gjsify-bot'
          git config --global user.email 'pascal@artandcode.studio'
          git config --global --add safe.directory "$PWD"

      # release-it does the rest: bump every package.json (the bumper globs),
      # regenerate CHANGELOG.md from the conventional commits, run `after:bump`,
      # commit, tag, push, and create the GitHub release — whose `published`
      # event triggers release.yml.
      #
      # THE `after:bump` CHAIN IS THE ONLY GATE THAT CAN SEE THE BUMPED TREE.
      # bump → hooks → commit → tag → push all happen inside this ONE step, so a
      # workflow step cannot sit between the bump and the commit; the hook can.
      # It runs, in order (`.release-it.json`):
      #
      #   1. bump-docs-version.mjs           — docs follow the version
      #   2. generate-platform-packages --write — RE-DERIVE what the bumper cannot
      #   3. bump-release-train-ranges.mjs   — the same, for workspace-EXCLUDED apps
      #   4. audit-runtimes --check --strict  — REFUSE to commit an inconsistent tree
      #   5. verify-committed-bundles --rebuild — bundles reproduce at the new version
      #
      # Steps 2 AND 3 exist for one reason: `@release-it/bumper` rewrites ONLY the
      # `version` field. Never a dependency RANGE. That is enough for a workspace
      # member, whose siblings are pinned `workspace:^` and resolved at pack time
      # — and it has now cost a release twice, in the two places that are not
      # workspace members.
      #
      # Step 2: `@gjsify/napi` is NOT a workspace member (its own CI, its own
      # carve-out), so its `optionalDependencies` on
      # `@gjsify/napi-{linux-x64,darwin-arm64}` carry LITERAL versions that
      # nothing rewrote. v0.27.0 was cut with the parent at 0.27.0 and both
      # children pinned 0.26.1; `main` went red on `platform-packages` and the tag
      # would have published a bridge pinned to the previous release's binaries.
      # Measured: simulating the bumper's version-only rewrite reproduces exactly
      # those two findings, and `--write` clears them.
      #
      # Step 3: the NativeScript apps under `showcases/` are excluded from
      # `workspaces` too, so their `@gjsify/*` deps are ordinary npm ranges. The
      # `release-train` rule (ADR 0008) requires them to name the CURRENT version
      # — which, between the bump and step 4, they never did: the rule was
      # unsatisfiable inside a cut from the day it landed, and the v0.32.0 attempt
      # (the first cut since) died on 11 findings across three apps. The rewriter
      # shares its edge selection with the rule it satisfies, so the two cannot
      # drift apart.
      #
      # Step 4 is the mechanism, not a belt-and-braces repeat: steps 2-3 fix what
      # is DERIVABLE, and anything they cannot fix must stop the cut rather than
      # ride a tag out to npm. The audit already runs on every PR — it just never
      # ran on the tree the bump creates, which exists for only these few seconds.
      #
      # A SECOND hook fires later, and it has to: `after:bump` sees the bumped
      # TREE, but CHANGELOG.md is not regenerated until the changelog plugin's
      # `beforeRelease`. So `before:git:beforeRelease` —
      # `check-changelog-references.mjs --write` — is the last point that sees the
      # regenerated infile before `Git.beforeRelease()` stages it and
      # `Git.release()` commits and tags it.
      #
      # THAT HOOK REPAIRS THE FILE AND ONLY THE FILE. The published release body
      # is a DIFFERENT artefact: release-it computes `changelog` once, in memory
      # (`lib/index.js:63`, frozen into the context at `:92`), and
      # `lib/plugin/GitRelease.js:34` posts that context — a shell hook runs in
      # its own process and cannot mutate it. Measured in a throwaway repo with
      # both plugins: after `--write` had repaired CHANGELOG.md, an
      # `after:git:beforeRelease` hook dumping `${changelog}` still contained
      # `pre-#955`, `Post-#955`, `#version`, `442/#121`, `859/#861`, `220-#222`,
      # `PKCS#1`. That is how 0.27.1's notes went public carrying links to
      # `github.com/gjsify/pre-/issues/955` and `.../issues/version`.
      #
      # So the body is DERIVED FROM THE FILE rather than repaired beside it:
      # `.release-it.json` sets `github.releaseNotes` to
      # `check-changelog-references.mjs --release-notes ${version}`, which
      # `GitRelease.processReleaseNotes()` execs and whose stdout becomes the
      # body. It re-asserts the whole infile, then prints the top section
      # verbatim — so the notes are a slice of the bytes that get committed, and
      # the two cannot disagree. It also refuses (exit 1, aborting the cut before
      # the commit, the tag and the release exist) if the section is dirty, if
      # its heading does not name `${version}`, or if it exceeds GitHub's
      # 124000-char body cap — which means broken notes cannot be published even
      # if the repair hook above is removed.
      #
      # WHEN THEY SUCCEED, THIS LOG SHOWS NOTHING. release-it captures a hook's
      # output (`lib/shell.js` runs it through `child_process.exec` and routes
      # both streams into `log.verbose`, which `shouldLog()` suppresses without
      # `--verbose`, which this step does not pass) — measured on the rehearsal
      # cut: zero of the script's lines reached the log. A FAILURE does surface,
      # because release-it rejects with the hook's stderr and logs it as ERROR.
      # But repair is LOSSY (an unlinked mention, a dropped cross-repo entry) and
      # that happens on the SUCCESS path, so the script also writes its repairs,
      # its findings and the emitted section to `$GITHUB_STEP_SUMMARY`, which no
      # verbosity setting swallows. Read the job summary, not this log, for what
      # the cut changed in CHANGELOG.md.
      #
      # `--ci` keeps it non-interactive (no prompts on a runner). The dry run
      # resolves and prints the whole plan without writing — note that release-it
      # skips hooks AND `github.releaseNotes` under `--dry-run`
      # (`lib/shell.js` returns early when `isDryRun`), and does not write the
      # infile either, so a dry run exercises none of these three chains.
      - name: release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCREMENT: ${{ inputs.increment }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # `increment` reaches a shell command line, so ALLOWLIST it rather
          # than interpolate whatever was typed. Only a keyword or a plain
          # semver is accepted; anything else fails here instead of being
          # word-split into the release command. (Dispatch is collaborator-only,
          # but a release job holds `contents: write` — the one place not to
          # rely on who is allowed to press the button.)
          case "$INCREMENT" in
            patch|minor|major) ;;
            [0-9]*.[0-9]*.[0-9]*)
              printf '%s' "$INCREMENT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
                || { echo "::error::invalid version '$INCREMENT'"; exit 1; } ;;
            *) echo "::error::increment must be patch|minor|major or an exact semver, got '$INCREMENT'"; exit 1 ;;
          esac
          set -- --ci "$INCREMENT"
          if [ "$DRY" = "true" ]; then set -- "$@" --dry-run; fi
          echo "release-it $*"
          PATH="$PWD/node_modules/.bin:$PATH" npx release-it "$@"

      # THE ASSETS SHIP HERE, NOT IN release.yml — and the ordering is the whole
      # point.
      #
      # release-it above creates the GitHub release as PUBLISHED
      # (`github.release: true`, `preRelease: false`), and `releases/latest`
      # starts pointing at it immediately. `release.yml` used to be the only
      # uploader, in its Phase F, AFTER the ~130-package serial npm publish. So
      # between those two moments there was a live release with zero assets that
      # `releases/latest/download/...` already resolved to. MEASURED on the
      # v0.29.0 cut: over TWO HOURS, `install.mjs` and `cli.gjs.mjs` both HTTP
      # 404 the whole time.
      #
      # That URL is not incidental — it is THE documented Node-free install path
      # (README.md, website/src/content/docs/guides/install.md), and every job in
      # `gjsify/ts-for-gir`'s CI bootstraps through it. So for the length of each
      # publish, a fresh consumer install and that repo's entire CI failed with
      # `curl: (22) 404`. It cost an investigation once already: a container probe
      # bootstrapping that way failed, and the failure first read as a
      # GJS-version problem.
      #
      # This job is the only one that HAS the bytes before anything is public.
      # Both are same-commit artifacts of the release commit itself:
      # `install.mjs` is tracked at the root, and `dist/cli.gjs.mjs` was rebuilt
      # AT THE NEW VERSION by the `after:bump` hook — `--rebuild` implies
      # `--keep`, so what is on disk here is what the tag carries. Uploading from
      # release.yml could only ever re-derive that.
      # The distro packages, from the SAME bundle the assets above carry. `ship`
      # re-reads `dist/cli.gjs.mjs`, so there is no second build and no way for the
      # `.deb` and the `.gjs.mjs` on one release to disagree.
      #
      # `--skip-build` is the point: rebuilding here would produce a bundle from the
      # working tree rather than the one the `after:bump` hook made AT THE NEW
      # VERSION, and the tag would then carry two different bundles.
      #
      # Why this belongs on the release at all: `gjsify self-update` REFUSES to run
      # when the CLI was installed by a package manager, because writing the XDG
      # prefix there leaves the user with two installs. That refusal points at
      # `releases/latest`, so the packages have to be there for the sentence to be
      # true.
      - name: Package the CLI as .deb and .rpm
        if: ${{ !inputs.dry_run }}
        working-directory: packages/infra/cli
        run: node lib/index.js ship --skip-build

      - name: Generate cli.gjs.mjs.sha256
        if: ${{ !inputs.dry_run }}
        id: assets
        run: |
          set -euo pipefail
          cd packages/infra/cli/dist
          sha256sum cli.gjs.mjs | awk '{print $1}' > cli.gjs.mjs.sha256
          cat cli.gjs.mjs.sha256
          cd - >/dev/null
          # The tag release-it just created. The dispatch step below re-derives
          # this the same way; both read the tag rather than recomputing a
          # version, so neither can disagree with what was actually pushed.
          echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Upload installer + bootstrap bundle to the release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          # Same invocation shape as release.yml's Phase F (tag_name + files, no
          # `body`): targeting an EXISTING release uploads the assets onto it and
          # leaves the release notes release-it computed alone.
          tag_name: ${{ steps.assets.outputs.tag }}
          # The two `ship` entries are GLOBS, and this action's default for
          # `fail_on_unmatched_files` is false — so without the flag, a renamed
          # `outDir` or a format that stops being written uploads nothing and
          # leaves this step green. `scripts/check-workflow-release-globs.mjs`
          # keeps the shape from regrowing; the flag is what makes it fail here.
          fail_on_unmatched_files: true
          files: |
            install.mjs
            packages/infra/cli/dist/cli.gjs.mjs
            packages/infra/cli/dist/cli.gjs.mjs.sha256
            packages/infra/cli/ship/out/*.deb
            packages/infra/cli/ship/out/*.rpm

      # A check that cannot fail is decoration, so this one gates — and it gates
      # BEFORE the publish dispatch on purpose. The two failure modes are not
      # symmetric: stopping here leaves a cut release with npm not yet published,
      # which the dispatch comment below already describes as recoverable by
      # hand; letting it through would publish into exactly the 404 window this
      # step exists to close. Retried because the object store needs a moment to
      # serve a just-uploaded asset, and a redirect-following HEAD on a cold CDN
      # path is the one part of this that can be slow without being wrong.
      - name: Assert the documented install URLs resolve
        if: ${{ !inputs.dry_run }}
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.assets.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          base="https://github.com/$REPO/releases"

          # The packages are globbed onto the release, so "ship built nothing" and
          # "everything uploaded" are indistinguishable from here unless the set is
          # COUNTED first — and the URL loop below cannot count it, because a name
          # carries the version and the arch label (`gjsify_1.2.3-1_all.deb`), so it
          # has to be read off disk rather than written down. `gjsify self-update`
          # refuses for a system-prefix install and points at exactly these assets,
          # which is the sentence an empty upload would make false.
          debs=(packages/infra/cli/ship/out/*.deb)
          rpms=(packages/infra/cli/ship/out/*.rpm)
          if [ "${#debs[@]}" -eq 0 ] || [ "${#rpms[@]}" -eq 0 ]; then
            echo "::error::gjsify ship wrote ${#debs[@]} .deb and ${#rpms[@]} .rpm into packages/infra/cli/ship/out — expected at least one of each."
            exit 1
          fi

          urls=("$base/latest/download/install.mjs" \
                "$base/latest/download/cli.gjs.mjs" \
                "$base/download/$TAG/install.mjs" \
                "$base/download/$TAG/cli.gjs.mjs")
          for package in "${debs[@]}" "${rpms[@]}"; do
            urls+=("$base/download/$TAG/$(basename "$package")")
          done

          fail=0
          for url in "${urls[@]}"; do
            code=""
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sILo /dev/null -w '%{http_code}' "$url" || echo 000)"
              [ "$code" = "200" ] && break
              sleep 10
            done
            if [ "$code" = "200" ]; then
              echo "ok   $code  $url"
            else
              echo "::error::$url returned $code — the documented install path is broken for this release."
              fail=1
            fi
          done
          [ "$fail" = "0" ]

      # The cut creates a GitHub release, and release.yml listens for
      # `release: [published]` — but a release created by a workflow using the
      # repository's GITHUB_TOKEN does NOT trigger other workflows. That is
      # GitHub's recursion guard, and it is not optional or configurable.
      #
      # So the cut tagged, pushed and published a GitHub release, and NOTHING
      # went to npm — silently, with this job green. v0.25.0 and v0.25.1 both
      # sat on GitHub for an hour while npm still served 0.24.2, and the first
      # symptom was three unrelated-looking node-gi jobs failing with
      # `ETARGET No matching version found for @gjsify/cli@0.25.0` (they install
      # the PUBLISHED cli at the version the checkout declares). This step's own
      # Summary text used to assert the release event would do it.
      #
      # `workflow_dispatch` is the DOCUMENTED exception to that guard, so a
      # dispatch from here does start a run. Dispatching (rather than making
      # release.yml a `workflow_call` reusable workflow) is deliberate: npm
      # Trusted Publishing binds the OIDC claim to the workflow FILE, and the
      # configured publisher is `release.yml`. Called as a reusable workflow its
      # `workflow_ref` would name THIS file instead and the OIDC exchange would
      # be rejected. A dispatch keeps release.yml a top-level run, so the claim
      # still matches what npmjs.com is configured to trust.
      # THE LOAD-BEARING STEP. A `release: published` event created with the
      # workflow's own GITHUB_TOKEN does NOT trigger other workflows (GitHub's
      # recursion guard), so `release.yml` only ever runs because of this
      # dispatch. If it does not fire, the release is committed, tagged and
      # visible on GitHub while NOTHING reaches npm — and the job goes red only
      # AFTER all of that is already written, which reads like "the cut failed"
      # when in fact only publishing did.
      #
      # It used to call `gh`, which exists on a bare runner image but NOT in
      # this job's container (ghcr.io/gjsify/ci-fedora:44). The v0.26.0 cut is
      # where that surfaced: `gh: command not found`, release cut, npm empty,
      # recovered by dispatching by hand. So dispatch through `node`, which this
      # job provably has (setup-node ran, and release-it above went through
      # npx) rather than through a CLI the image is not required to carry.
      - name: Dispatch the npm publish
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUNTIME: ${{ inputs.runtime || 'node' }}
        run: |
          TAG="$(git describe --tags --abbrev=0)"
          echo "dispatching release.yml for $TAG (bootstrap runtime: $RUNTIME)"
          echo "PUBLISH_TAG=$TAG" >> "$GITHUB_ENV"
          # A QUOTED heredoc, not `node -e '…'`, and the reason is this step's own
          # history: the comment below about v0.31.0 carried an apostrophe, which closed
          # the single-quoted shell string early and handed node a truncated script
          # (`SyntaxError: Unexpected end of input`). v0.38.0 was cut, tagged and
          # released — and never dispatched to npm. `<<'JS'` interpolates nothing and
          # ends only on its own delimiter, so no character in the script can escape it.
          # The dry run cannot catch this: this step is the one thing a dry run skips.
          cat > "$RUNNER_TEMP/dispatch-publish.mjs" <<'DISPATCH_JS'
            const { GITHUB_TOKEN, REPO, TAG } = process.env;
            const url = `https://api.github.com/repos/${REPO}/actions/workflows/release.yml/dispatches`;
            const res = await fetch(url, {
                method: "POST",
                headers: {
                    authorization: `Bearer ${GITHUB_TOKEN}`,
                    accept: "application/vnd.github+json",
                    "x-github-api-version": "2022-11-28",
                    "content-type": "application/json",
                },
                body: JSON.stringify({
                    ref: "main",
                    // RUNTIME is forwarded, not re-chosen: v0.31.0's cut and publish
                    // ran different bootstraps because each workflow carried its own
                    // copy of the decision.
                    inputs: {
                        release_tag: TAG,
                        skip_publish: "false",
                        verify_only: "false",
                        runtime: process.env.RUNTIME || "node",
                    },
                }),
            });
            // 204 is the documented success. Anything else means the release is
            // already cut but unpublished, so say exactly how to finish it by
            // hand instead of leaving the operator to reconstruct the call.
            if (res.status !== 204) {
                console.error(`::error::dispatch failed: HTTP ${res.status} ${await res.text()}`);
                console.error(
                    `::error::${TAG} is cut and tagged but NOT on npm. Recover with: ` +
                        `gh workflow run release.yml --ref main -f release_tag=${TAG} ` +
                        `-f skip_publish=false -f verify_only=false`,
                );
                process.exit(1);
            }
            console.log(`dispatched release.yml for ${TAG} (HTTP 204)`);
          DISPATCH_JS
          TAG="$TAG" node "$RUNNER_TEMP/dispatch-publish.mjs"

      - name: Summary
        if: always()
        env:
          DRY: ${{ inputs.dry_run }}
          INC: ${{ inputs.increment }}
        run: |
          {
            echo "## Release cut"
            echo ""
            echo "- increment: \`$INC\`"
            echo "- dry run: \`$DRY\`"
            if [ "$DRY" = "true" ]; then
              echo ""
              echo "Nothing was written. Re-run with **dry run off** to cut for real;"
              echo "that dispatches \`release.yml\` to publish to npm."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # THE CANARY. Non-blocking by construction (`continue-on-error`), and the
  # precondition the cut's own revert note names: "a NON-BLOCKING job exercises
  # the GJS-hosted bootstrap, so the next regression there is a signal rather
  # than a deadlocked release. Without (2) a revert only re-arms the trap for
  # the next CLI bug."
  #
  # It runs the SAME script with `gjs`, never a second copy of it — a second copy
  # is the thing that drifts, and it is the copy you reach for under pressure
  # (v0.31.0: the cut was fixed, release.yml's duplicate was not).
  #
  # THREE ASSERTIONS, IN ORDER, because the v0.31.0 signature was a ZERO EXIT WITH
  # NO OUTPUT — `gjsify tsc` returning 0 having compiled nothing, the `&&` chain
  # then dying one command later and naming a step past the fault:
  #   1. ARTIFACT   — the CLI entry exists and is non-empty.
  #   2. LOADABLE   — it runs and reports the version its manifest declares.
  #                   Present-but-broken is exactly what a file test misses.
  #   3. REPRODUCES — the tree still reproduces the committed bundles byte for
  #                   byte, read-only. This is the real flip criterion: the
  #                   157-byte-short `affected.gjs.mjs` incident passed 1 and 2.
  #
  # One greppable verdict line in BOTH outcomes. Neither release workflow has a
  # ci-summary aggregator, and a canary that reports nothing on failure is a job
  # that burns half an hour saying nothing.
  gjs-bootstrap-canary:
    name: Canary — cold-tree bootstrap under GJS (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    container:
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      - name: Install dependencies (gjsify install --immutable)
        run: |
          B=$(gjs -m install.mjs --fetch-only)
          gjs -m "$B" install --immutable
          echo "GJSIFY_BOOTSTRAP=$B" >> "$GITHUB_ENV"

      - name: Bootstrap the build toolchain under GJS
        id: bootstrap
        run: .github/scripts/bootstrap-cold-tree.sh gjs

      - name: Verdict
        if: always()
        run: |
          ENTRY=packages/infra/cli/lib/index.js
          # `if` blocks and not `[ … ] && …`: this runs under `bash -e`, where an
          # AND-list whose left side fails is a trap the next reader steps in.
          verdict() {
            echo "GJS-BOOTSTRAP-CANARY: $1"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "**GJS-BOOTSTRAP-CANARY: $1**" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "${2:-pass}" = fail ]; then
              exit 1
            fi
            exit 0
          }

          # 1. ARTIFACT
          if [ ! -s "$ENTRY" ]; then
            verdict "FAIL — $ENTRY is missing or empty after the GJS bootstrap" fail
          fi

          # 2. LOADABLE. The declared version is the oracle: a CLI that starts but
          #    reports something else is not the one this commit ships.
          DECLARED="$(node -p "require('./packages/infra/cli/package.json').version")"
          REPORTED="$(node "$ENTRY" --version 2>&1 | tr -d '[:space:]' || true)"
          case "$REPORTED" in
            *"$DECLARED"*) ;;
            *) verdict "FAIL — $ENTRY runs but reports '$REPORTED', not the declared $DECLARED" fail ;;
          esac

          # 3. REPRODUCES. Read-only on purpose: `--rebuild` would make the check
          #    pass by writing the answer it is supposed to compare against.
          if ! node scripts/verify-committed-bundles.mjs; then
            verdict "FAIL — bootstrapped under GJS, but the tree no longer reproduces the committed bundles" fail
          fi

          verdict "PASS — GJS cold-tree bootstrap produced a loadable CLI $DECLARED that reproduces the committed bundles"

