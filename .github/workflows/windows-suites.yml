# The OS axis, exercised rather than declared (ADR 0018 § 5).
#
# WHAT THIS IS FOR
#
# Before this workflow, NO job ran a single `@gjsify/*` package suite on
# Windows. `audit-runtimes.yml`'s `check-windows` reads manifests and never
# executes a package; `cli-cross-platform.yml` diagnoses the PUBLISHED CLI on a
# schedule and therefore structurally cannot gate this repository's code; and
# `node-gi.yml`'s Windows jobs cover the GI bridge, not the Node pillar.
#
# The size of that hole was measured on the win11-gjsify VM, on a `main` that
# every existing check called green: 144 failing assertions across five
# packages — `child_process` 86 of 145, `path` 23 of 402, `fs` 19 of 589, `os`
# 10 of 178, `process` 6 of 167. Not one was a defect in the implementation.
# All of them were specs that spelled a POSIX answer as though it were THE
# answer, which is exactly the failure mode a Linux-only pipeline cannot see:
# on Linux the POSIX literal CANNOT fail.
#
# WHY ON EVERY PR
#
# For its first ten days it was not, and the reason it gave was re-measured and
# found wrong. That text named 2x Windows billing and the ~1000-package install,
# concluded the leg belonged on `main` and the nightly, and path-filtered the
# `pull_request` trigger onto this file alone — a filter satisfiable only by
# editing the filter. It read as PR-covered and covered nothing else.
#
# What that cost, concretely: #1209 changed the CLI's install classifier and
# showed "all checks passed" — no Windows package suite was among those checks.
# It merged, and this leg stayed red across eight further merges until #1217
# corrected `classifyInstall`'s answer for the target platform. That was not the
# only one; red `main` pushes here have been a recurring event since the
# workflow was created, each on a commit that was already in.
#
# The re-measurement, 2026-08-16:
#   · The billing premise does not hold for this repository. It is PUBLIC and
#     this job runs on the standard `windows-latest` image. The 2x figure is a
#     multiplier on BILLED minutes, and there are none to multiply.
#   · The runner was already being paid for. `node-gi.yml` spawns Windows jobs
#     on every pull request under a `paths-ignore` deny-list, so this is one
#     more job on a runner class the PR already uses, not a new cost category.
#   · It is not the critical path. A successful run here finishes comfortably
#     inside `main.yml`'s, so no PR waits longer than it already did.
#
# The required-check half of the old reasoning stands and is unchanged: `main`
# is branch-protected with EXACTLY THREE required checks, and adding a fourth is
# a governance decision with a trap behind it (a required check that does not
# RUN blocks the PR forever). This leg stays ADVISORY — read before merging, not
# waited on. Advisory is a statement about the merge BUTTON; it was never a
# reason to withhold the measurement from the PR.
#
# WHY NO PATH FILTER
#
# The last step runs `audit-runtimes.mjs --check`, whose subject is the whole
# tree rather than a set of workspaces. Filtering a job that contains a
# whole-tree check is the shape that made #1183 green while `main` went red: the
# affected classifier reported truthfully that the PR touched nothing it models,
# and skipped the job whose repo-wide `format --check` step reads every file in
# the checkout. So both triggers here are unfiltered — which is also the parity
# `scripts/manifest-conformance/rules/pr-trigger-parity.mjs` now holds them to.
#
# WHY cmd.exe, AND WHY THE PATH IS STRIPPED
#
# `status/open-todos.md` records the measurement: Git for Windows puts
# `C:\Program Files\Git\usr\bin` on PATH, which supplies a real `chmod`, `cp`,
# `rm`, `sed` and `which`, and every process spawned from that shell inherits
# them. npm, however, runs package scripts through `%COMSPEC%`, where none of
# those exist. The two disagree on the same tree at the same commit —
# `gjsify run build:infra` completed under git-bash and failed at
# `@gjsify/create-app` under cmd.exe.
#
# GitHub's Windows images have Git on PATH too, so a leg that used bash would
# reproduce that false green faithfully. Any Windows claim has to name its
# shell; this one names cmd.exe and removes the `\Git\` entries so it cannot be
# quietly rescued by them.
#
# WHAT THIS LEG CANNOT SEE, STATED SO NOBODY READS IT AS MORE
#
# `test:gjs` does not run here and cannot: there is no GJS host on Windows.
# What is measured is the NODE leg of each suite, which for a package declaring
# `runtimes.node: "none"` or `"native"` proves the TEST is correct rather than
# proving our implementation is — that is the standing gap named in
# `@gjsify/child_process`'s and `@gjsify/os`'s `gjsify.osNotes.win32`.
#
# It also runs ELEVATED. GitHub's Windows runners execute as an administrator,
# so `fs`'s symlink specs — which need elevation or Developer Mode — RUN here
# rather than being tolerated. That is the right way round (the capability
# probe in `packages/node/fs/src/capabilities.spec.ts` decides per host, never
# per platform), but it means a green run here does NOT prove an unprivileged
# Windows user sees the same thing. The leg prints the probe's verdict so the
# log says which of the two was measured.

name: Windows suites

on:
  push:
    branches:
      - main
  schedule:
    # 05:30 UTC — after main.yml's 04:00 nightly, so the two do not contend for
    # the Windows runner pool or interleave in the notification stream.
    - cron: '30 5 * * *'
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('windows-suites-pr-{0}', github.ref) || format('windows-suites-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node-suites:
    name: Node-pillar suites (win32-x64 / cmd.exe)
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: cmd

    steps:
      # Before checkout, so it governs the checkout itself. `core.autocrlf=true`
      # is Git for Windows' installer default and is what
      # `website/…/platform-support.md` tells a Windows contributor to turn off;
      # pinning it here means this job measures the setup the docs recommend and
      # cannot start failing because a runner image changed its git defaults.
      - name: Check out with line endings untouched
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      # The measurement this leg exists to keep honest. See the header: a
      # git-bash PATH turns cmd.exe-only failures green, so the POSIX utilities
      # Git for Windows ships are removed before anything runs. Written to
      # GITHUB_ENV so every later step inherits it.
      - name: Remove the git-bash POSIX utilities from PATH
        shell: pwsh
        run: |
          $kept = ($env:PATH -split ';') | Where-Object { $_ -and ($_ -notmatch '\\Git\\') }
          "PATH=$($kept -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "dropped $((($env:PATH -split ';') | Where-Object { $_ -match '\\Git\\' }).Count) \Git\ entr(y|ies) from PATH"

      # `ECHO` DOES NOT RESET ERRORLEVEL in cmd.exe, so the obvious spelling of
      # this assertion — `where sh && exit 1 || echo "good"` — leaves the 1 that
      # `where` set on the SUCCESS path, and the step fails precisely because
      # the check passed. Measured on run 31128583511: all three lines printed
      # their expected output ("no sh on PATH - good", "no rm on PATH - good",
      # `COMSPEC=…`), no other command ran, and the step still exited 1. That
      # was the entire Windows leg, red from its first push and never green.
      #
      # `bin-shim.ts` already carries the same lesson for the launchers it
      # GENERATES ("ERRORLEVEL is read via IF/ELSE rather than `&&`/`||`
      # chaining"); this is the hand-written copy that missed it. So: assert
      # with an explicit failure branch, and exit 0 explicitly rather than
      # trusting a trailing command to have cleared the flag.
      - name: Prove the POSIX utilities are gone
        run: |
          where sh 2>nul && (echo FAIL: sh is on PATH - the \Git\ strip did not take & exit /b 1)
          where rm 2>nul && (echo FAIL: rm is on PATH - the \Git\ strip did not take & exit /b 1)
          echo no sh and no rm on PATH - good
          echo COMSPEC=%COMSPEC%
          exit /b 0

      # Cold tree: `node_modules/.bin/gjsify` dispatches to build outputs that do
      # not exist yet (ADR 0002 untracked both bundles), and the Linux route
      # through `gjs -m dist/cli.gjs.mjs` is unavailable here by construction.
      # The published CLI is the only CLI this tree has, which is the same
      # bootstrap `cli-cross-platform.yml` exercises from a user's side.
      #
      # THE ORDER IS LOAD-BEARING, and it was inverted until 2026-08-07 (this
      # workflow landed in #1021 during the GitHub Actions degradation with no
      # checks reported on its PR). `build:infra` cannot run before the install:
      # `@gjsify/vite-plugin-blueprint` declares `"types": ["node"]`, so with no
      # `node_modules` its `gjsify tsc` dies on `TS2688: Cannot find type
      # definition file for 'node'` — which is what the macOS leg, whose first
      # step this also was, failed on for every run it ever had.
      #
      # Installing first then exposes the second half, and THIS leg is the only
      # one that can: after the install `.bin\gjsify.cmd` exists and dispatches
      # to `lib\index.js`, a build output the tree has not produced yet, so the
      # first nested `gjsify` inside `build:infra` died with `Cannot find module
      # …\lib\index.js`. Linux never sees it (its bootstrap runs the published
      # GJS bundle, which shims itself onto PATH) and neither does macOS
      # (`gjs` present). `ensureGjsifyShimOnPath()` now does the same for a
      # bootstrap CLI under Node, writing the `.cmd`/`.ps1` members cmd.exe
      # needs — so both steps below stay on the published CLI throughout.
      # Fetched to RUNNER_TEMP, not into the work tree: nothing this drags in
      # can then be mistaken for repo state by a later step.
      - name: Fetch the published CLI (a cold tree has no other)
        # The `npm install` goes through scripts/npm-install-published.mjs so npm's own
        # registry propagation lag cannot report itself as a toolchain gap: the v0.46.0
        # incident is in that script's header, and this leg resolves the SAME just-
        # published @gjsify closure. Every retry knob has a default; the call passes none.
        run: node scripts/npm-install-published.mjs -- --no-save --prefix "%RUNNER_TEMP%\bootstrap-cli" @gjsify/cli@latest

      - name: Install the workspace
        run: node "%RUNNER_TEMP%\bootstrap-cli\node_modules\@gjsify\cli\lib\index.js" install --immutable

      # This step used to carry an `env:` bridge — `GJSIFY_SHIM_DIR` plus
      # `npm_config_user_agent=gjsify/bootstrap` — pointing PATH at npm's own
      # `.bin` because `build:infra`'s nested `gjsify` clauses would otherwise
      # resolve to the tree's not-yet-built shim. The published CLI now does
      # that itself, and its retirement condition (`latest > 0.30.0`) is met at
      # 0.39.0 with the fix in the SHIPPED tarball.
      #
      # WATCH THIS LEG SPECIFICALLY on the first run without the bridge. Windows
      # is where the removal is a real test rather than a formality: the bridge
      # always pointed at npm's shim trio, so the `.cmd`/`.ps1` pair that
      # `buildLauncherShims` writes has never been exercised by
      # `%COMSPEC%`/PATHEXT here.
      # A red here is a CLI bug in `utils/bin-shim.ts`, not a reason to restore
      # the `env:` block — restoring it would only re-hide the same gap.
      - name: Bootstrap the toolchain
        run: node "%RUNNER_TEMP%\bootstrap-cli\node_modules\@gjsify\cli\lib\index.js" run build:infra

      # `test:node` is only `node test.node.mjs` — it BUILDS nothing. The
      # bundle has to exist first, and a package's own build needs its
      # workspace dependencies built, so this is workspace-wide and once.
      - name: Build the workspace
        run: node packages\infra\cli\lib\index.js run build

      # Which of the two Windows hosts this run measured. `@gjsify/fs`'s symlink
      # specs are gated on the CAPABILITY, not the platform, so the same commit
      # legitimately produces "19 tests ran" here and "19 expected failures" on
      # an unprivileged workstation. Without this line a reader cannot tell
      # which, and would take the green as covering both.
      - name: Report the host capability this run measured
        run: node scripts\report-symlink-capability.mjs

      # One package per line so a failure names the package in the step title
      # rather than in the middle of a 10-package log. `test:node` only: there
      # is no gjs here, and a suite's `test` script chains `test:gjs`.
      #
      # `@gjsify/utils` IS NOT IN THIS LIST, and that is a statement rather than
      # an omission. It declares `runtimes.node: "none"` and ships only
      # `build:test:gjs` / `test:gjs` — there is no Node test bundle to build,
      # so the step this leg first shipped (`… run build:test:node`) could only
      # ever die with `has no script "build:test:node" — did you mean
      # "build:test:gjs"?`. A GJS-only package on a host with no GJS is not a
      # suite this leg can run, and pretending otherwise cost the whole leg.
      # macOS DOES cover it (`… run test`, which is `test:gjs` there), which is
      # exactly the asymmetry the header names.
      - name: '@gjsify/path'
        run: node packages\infra\cli\lib\index.js workspace @gjsify/path run build:test:node && node packages\infra\cli\lib\index.js workspace @gjsify/path run test:node

      - name: '@gjsify/os'
        run: node packages\infra\cli\lib\index.js workspace @gjsify/os run build:test:node && node packages\infra\cli\lib\index.js workspace @gjsify/os run test:node

      - name: '@gjsify/process'
        run: node packages\infra\cli\lib\index.js workspace @gjsify/process run build:test:node && node packages\infra\cli\lib\index.js workspace @gjsify/process run test:node

      - name: '@gjsify/util'
        run: node packages\infra\cli\lib\index.js workspace @gjsify/util run build:test:node && node packages\infra\cli\lib\index.js workspace @gjsify/util run test:node

      - name: '@gjsify/fs'
        run: node packages\infra\cli\lib\index.js workspace @gjsify/fs run build:test:node && node packages\infra\cli\lib\index.js workspace @gjsify/fs run test:node

      - name: '@gjsify/child_process'
        run: node packages\infra\cli\lib\index.js workspace @gjsify/child_process run build:test:node && node packages\infra\cli\lib\index.js workspace @gjsify/child_process run test:node

      - name: '@gjsify/net'
        run: node packages\infra\cli\lib\index.js workspace @gjsify/net run build:test:node && node packages\infra\cli\lib\index.js workspace @gjsify/net run test:node

      - name: '@gjsify/worker_threads'
        run: node packages\infra\cli\lib\index.js workspace @gjsify/worker_threads run build:test:node && node packages\infra\cli\lib\index.js workspace @gjsify/worker_threads run test:node

      - name: '@gjsify/node-globals'
        run: node packages\infra\cli\lib\index.js workspace @gjsify/node-globals run build:test:node && node packages\infra\cli\lib\index.js workspace @gjsify/node-globals run test:node

      # The CLI is the package ADR 0018 singles out: it writes `PATH` /
      # `DYLD_LIBRARY_PATH` / `LD_LIBRARY_PATH` per host and generates the
      # launcher every other package is started through, and it declares
      # `gjsify.os.win32: "supported"`. Its own suite is what holds that claim.
      - name: '@gjsify/cli'
        run: node packages\infra\cli\lib\index.js workspace @gjsify/cli run build:test:node && node packages\infra\cli\lib\index.js workspace @gjsify/cli run test:node

      # Manifest conformance including `os-axis` — cheap, and it is the check
      # that the declarations these suites back up are still present.
      - name: Conformance audit (os-axis included)
        run: node scripts\audit-runtimes.mjs --check
