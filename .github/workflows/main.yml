name: GJS

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly full sweep on main — safety net for the selective-CI gates
    # below. Runs the full test suite even when no PR touched a path the
    # classifier would mark as a global trigger.
    - cron: '0 4 * * *'

# Cancel superseded runs on the SAME PR branch (a force-push / new commit
# obsoletes the in-flight run). main pushes + the nightly schedule are NOT
# cancelled — each landed commit + sweep must complete on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Matrix planner — decides which Fedora legs the build/test jobs run.
  # A GitHub matrix axis cannot read `github.event_name` directly, so we
  # emit the leg list as a JSON job output and `fromJSON` it into the matrix.
  # Each entry is a full object {v, gjs} — we do NOT use a static `include:`
  # for the gjs label, because a static include for a version that ISN'T in
  # the (PR-reduced) axis would spawn a phantom extra job (GitHub adds an
  # unmatched include as a brand-new combination).
  #   - pull_request    → Fedora 44 only (GJS 1.88, the newest platform — most
  #                       likely to surface a new GNOME-library regression;
  #                       both legs share SpiderMonkey 140 so JS-engine
  #                       coverage is identical either way).
  #   - push / schedule → FULL matrix (43 + 44), so the documented minimum
  #                       runtime (GJS 1.86 / Fedora 43) is always re-covered
  #                       before merge + on the nightly sweep.
  # Flip the PR leg to 43 if protecting the minimum runtime pre-merge matters
  # more than catching new-platform regressions.
  setup:
    runs-on: ubuntu-latest
    outputs:
      fedora-matrix: ${{ steps.plan.outputs.fedora-matrix }}
    steps:
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'fedora-matrix=[{"v":"44","gjs":"GJS 1.88 / SM 140"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'fedora-matrix=[{"v":"43","gjs":"GJS 1.86 / SM 140"},{"v":"44","gjs":"GJS 1.88 / SM 140"}]' >> "$GITHUB_OUTPUT"
          fi

  # Classifier job — diffs HEAD vs the PR's base SHA, emits per-test-tier
  # gates as job outputs. Runs in seconds on plain ubuntu-latest with no
  # Fedora image and no `gjsify install` — it boots the committed CLI
  # bundle (`packages/infra/cli/dist/cli.gjs.mjs`) which has zero runtime
  # dependencies. `continue-on-error` + missing-output defaults mean a
  # classifier crash falls back to a full run (fail-safe).
  #
  # Skipped on main pushes and on the nightly schedule — those branches
  # MUST run the full suite unconditionally. The downstream build/test jobs
  # observe `needs.changes.outputs.*` as empty in those cases and fall
  # back to the historical full-run path.
  #
  # Repo-level kill switch: set `vars.GJSIFY_CI_FORCE_FULL=1` in the repo
  # settings and the classifier emits `global=true` regardless of the
  # diff. Lets maintainers force a full run without editing this file.
  changes:
    if: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      skip-all: ${{ steps.classify.outputs.skip-all }}
      global: ${{ steps.classify.outputs.global }}
      include-args: ${{ steps.classify.outputs.include-args }}
      run-integration: ${{ steps.classify.outputs.run-integration }}
      run-e2e: ${{ steps.classify.outputs.run-e2e }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gjs (host-side, for the classifier bundle only)
        run: sudo apt-get update && sudo apt-get install -y gjs
      - id: base
        name: Resolve diff base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Push to a non-main branch: diff against HEAD~1.
            echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          fi
      - id: classify
        name: Classify affected workspaces
        # On classifier failure we leave outputs unset; the build/test jobs'
        # gates then default to "global" via the `||` fallbacks below.
        continue-on-error: true
        env:
          FORCE_FULL: ${{ vars.GJSIFY_CI_FORCE_FULL }}
        run: |
          set -e
          if [ "$FORCE_FULL" = "1" ]; then
            echo "global=true" >> "$GITHUB_OUTPUT"
            echo "skip-all=false" >> "$GITHUB_OUTPUT"
            echo "include-args=" >> "$GITHUB_OUTPUT"
            echo "run-integration=true" >> "$GITHUB_OUTPUT"
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
            echo "reason=vars.GJSIFY_CI_FORCE_FULL=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gjs -m packages/infra/cli/dist/cli.gjs.mjs affected \
              --base "${{ steps.base.outputs.sha }}" \
              --format=github-actions

  # ── Build + type-check ──────────────────────────────────────────────
  # Compiles the workspace packages and type-checks them, then leaves the
  # result in the node_modules + build-output caches that the parallel
  # downstream jobs (test / e2e / examples) restore via `needs: build`.
  # Selective (affected-closure only) when the classifier scoped the change
  # AND the build cache is warm; full otherwise — see "Detect warm build
  # cache" + the Build/Check steps.
  build:
    needs: [changes, setup]
    # `always()` so we still run when `changes` was skipped (main / schedule);
    # those land here with empty outputs and the steps default to full.
    if: ${{ always() && needs.changes.outputs.skip-all != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Track the latest stable Node (Current line) on purpose. A floating
        # `<major>.x` auto-adopts security/patch releases that can change
        # behaviour (e.g. CVE-2026-48618 broke IPv6 IP-SAN matching in native
        # Node) — @gjsify/unit tags each run with its runtime so such a failure
        # reads as `[Node.js …]`, not a GJS/gjsify bug.
        node-version: [26.x]
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
    name: Build Fedora ${{ matrix.fedora.v }} (${{ matrix.fedora.gjs }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Cold full build of the whole workspace under gjs/native-rolldown can hit
    # ~110 min on the 2-core runner; warm/selective runs are minutes. Generous
    # cap so a hang fails before burning a runner for 6h.
    timeout-minutes: 180
    container:
      # Prebuilt image baked by .github/workflows/build-ci-image.yml — ships
      # every GJS/GNOME/Vala dnf package preinstalled (.docker/ci-fedora.Dockerfile
      # is the source of truth). `credentials` because the GHCR package is
      # private; remove them if it is made public (also enables fork-PR pulls).
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Raise nofile for the parallel GJS foreach (GStreamer/webrtc + bundler
      # eventfds exhaust the default soft limit on the F43 leg).
      options: --ulimit nofile=1048576:1048576
    steps:
      # Checkout MUST precede the local composite action (it can only resolve
      # once the repo is on disk).
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}
          node-version: ${{ matrix.node-version }}

      # Selective build/check rebuild ONLY the affected closure and rely on the
      # build cache having restored a complete baseline of lib/ + dist/ for the
      # unchanged forward-deps (`gjsify foreach --include` only FILTERS, it does
      # not pull in deps outside the matched set). That baseline exists only on a
      # warm cache → probe a few foundational packages and fall back to a FULL
      # build/check when cold. (Infra packages are global triggers, never in a
      # selective closure, so their cached lib/ is always correct here.)
      - name: Detect warm build cache
        id: buildwarm
        run: |
          if [ -d packages/gjs/utils/lib ] && [ -d packages/node/stream/lib ] && [ -d packages/web/fetch/lib ]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "[ci] build cache warm — selective build/check eligible"
          else
            echo "warm=false" >> "$GITHUB_OUTPUT"
            echo "[ci] build cache cold — forcing full build/check"
          fi

      # Full build on global / main / schedule / empty-classifier OR a cold
      # cache; otherwise rebuild only the affected closure.
      - name: Build
        env:
          GLOBAL: ${{ needs.changes.outputs.global }}
          INCLUDE_ARGS: ${{ needs.changes.outputs.include-args }}
          WARM: ${{ steps.buildwarm.outputs.warm }}
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" sh -c '
            if [ \"\$GLOBAL\" = \"true\" ] || [ -z \"\$GLOBAL\" ] || [ -z \"\$INCLUDE_ARGS\" ] || [ \"\$WARM\" != \"true\" ]; then
              echo \"[ci] full build\"
              gjsify run build
            else
              echo \"[ci] selective build: \$INCLUDE_ARGS\"
              gjsify foreach build \$INCLUDE_ARGS -tp --no-private --exclude \"@girs/*\" --exclude \"@gjsify/example-*\" --exclude \"@gjsify/website\"
            fi
          '"

      # Workspace-wide dependency-range drift detection. `--exclude-workspace
      # '@gjsify/integration-*'` carves out integration tests whose pins to
      # specific upstream versions are intentional.
      - name: Check dependency consistency
        run: >
          su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH"
          gjsify upgrade --check --exclude-workspace "@gjsify/integration-*"'

      # Same gate as Build: full type-check on a full build, otherwise
      # type-check only the affected closure (deps' .d.ts come from the warm
      # cache, exactly like the selective build above).
      - name: Check
        env:
          GLOBAL: ${{ needs.changes.outputs.global }}
          INCLUDE_ARGS: ${{ needs.changes.outputs.include-args }}
          WARM: ${{ steps.buildwarm.outputs.warm }}
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" sh -c '
            if [ \"\$GLOBAL\" = \"true\" ] || [ -z \"\$GLOBAL\" ] || [ -z \"\$INCLUDE_ARGS\" ] || [ \"\$WARM\" != \"true\" ]; then
              echo \"[ci] full check\"
              gjsify run check
            else
              echo \"[ci] selective check: \$INCLUDE_ARGS\"
              gjsify foreach check \$INCLUDE_ARGS -ptv --exclude \"@girs/*\" --exclude \"@gjsify/example-*\" --exclude \"@gjsify/website\"
            fi
          '"

  # ── Unit tests (sharded) ────────────────────────────────────────────
  # Restores the build job's output and runs the workspace test suite split
  # across SHARD_TOTAL parallel jobs (gjsify foreach --shard). On a small
  # selective closure most shards are near-empty no-ops; on a global/main run
  # the full ~120-package suite is split N-ways. WebGL conformance rides shard 1.
  test:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' && (needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args != '') }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
        shard: [1, 2, 3, 4]
    name: Test ${{ matrix.shard }}/4 Fedora ${{ matrix.fedora.v }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 90
    container:
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}

      # Full sharded sweep on global/main/schedule/empty; selective + sharded
      # otherwise. The full path inlines the root `test` script's filters so it
      # can take --shard (the script form can't). Integration tests stay opt-in.
      - name: Test
        env:
          GLOBAL: ${{ needs.changes.outputs.global }}
          INCLUDE_ARGS: ${{ needs.changes.outputs.include-args }}
          SHARD: ${{ matrix.shard }}
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args=\"-screen 0 1280x720x24\" sh -c '
            ulimit -n \"\$(ulimit -Hn)\" 2>/dev/null || true
            echo \"[ci] nofile soft=\$(ulimit -Sn) hard=\$(ulimit -Hn); shard \$SHARD/4\"
            if [ \"\$GLOBAL\" = \"true\" ] || [ -z \"\$GLOBAL\" ]; then
              gjsify foreach test -v --no-private --exclude \"@girs/*\" --exclude \"@gjsify/example-*\" --exclude \"@gjsify/website\" --shard \$SHARD/4
            else
              gjsify foreach test \$INCLUDE_ARGS --exclude \"@gjsify/integration-*\" --shard \$SHARD/4
            fi
          '"

      # WebGL conformance — heavy xvfb run, only on shard 1 to avoid 4× work,
      # and only when @gjsify/webgl is in the closure (or a full run).
      - name: Test WebGL conformance
        if: ${{ matrix.shard == 1 && (needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || contains(needs.changes.outputs.include-args, '@gjsify/webgl')) }}
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args="-screen 0 1280x720x24" gjsify workspace @gjsify/webgl test:conformance'

  # ── E2E tests ───────────────────────────────────────────────────────
  # Exercises the CLI end-to-end (install, build, dlx, publish, …) in its own
  # parallel job. Gated when an `e2e` path was touched OR on a full run.
  e2e:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' && (needs.changes.outputs.run-e2e == 'true' || needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '') }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
    name: E2E Fedora ${{ matrix.fedora.v }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    container:
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}
      - name: E2E tests
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run test:e2e'

  # ── Examples (build + check + test) ─────────────────────────────────
  # Self-contained: builds the private example/showcase workspaces against the
  # restored package lib/ (their dist/ is NOT in the build cache, so they are
  # built + tested in the same job) and runs the CLI/net example suites. Gated
  # when an example/showcase is in the closure (or a full run).
  examples:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' && (needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || contains(needs.changes.outputs.include-args, '@gjsify/example-')) }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
    name: Examples Fedora ${{ matrix.fedora.v }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    container:
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}

      # Build all examples sequentially (--jobs 1): native rolldown's
      # `--globals auto` multi-pass is memory-heavy and the three.js example
      # bundles exhaust the 2-core runner's RAM at cpu-count parallelism.
      - name: Build examples
        timeout-minutes: 45
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify foreach build -ptv --include "@gjsify/example-*" --jobs 1'

      - name: Check examples
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run check:examples'

      - name: Test CLI examples
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run test:examples'

      - name: Test net examples
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run test:examples:net'

  # Integration tests are NOT wired into CI yet (opt-in; suites have
  # CI-incompatible preconditions — Podman for autobahn, test:gjs hangs for
  # axios, …). The classifier still emits `run-integration` so the gate can be
  # re-enabled per-suite once each is hardened. Tracked in STATUS.md Open TODOs.
