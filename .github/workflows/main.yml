name: GJS

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly full sweep on main — safety net for the selective-CI gates
    # below. Runs the full test suite even when no PR touched a path the
    # classifier would mark as a global trigger.
    - cron: '0 4 * * *'

jobs:
  # Classifier job — diffs HEAD vs the PR's base SHA, emits per-test-tier
  # gates as job outputs. Runs in seconds on plain ubuntu-latest with no
  # Fedora image and no `gjsify install` — it boots the committed CLI
  # bundle (`packages/infra/cli/dist/cli.gjs.mjs`) which has zero runtime
  # dependencies. `continue-on-error` + missing-output defaults mean a
  # classifier crash falls back to a full run (fail-safe).
  #
  # Skipped on main pushes and on the nightly schedule — those branches
  # MUST run the full suite unconditionally. The downstream `linux` job
  # observes `needs.changes.outputs.*` as empty in those cases and falls
  # back to the historical `gjsify run test` path.
  #
  # Repo-level kill switch: set `vars.GJSIFY_CI_FORCE_FULL=1` in the repo
  # settings and the classifier emits `global=true` regardless of the
  # diff. Lets maintainers force a full run without editing this file.
  changes:
    if: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      skip-all: ${{ steps.classify.outputs.skip-all }}
      global: ${{ steps.classify.outputs.global }}
      include-args: ${{ steps.classify.outputs.include-args }}
      run-integration: ${{ steps.classify.outputs.run-integration }}
      run-e2e: ${{ steps.classify.outputs.run-e2e }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gjs (host-side, for the classifier bundle only)
        run: sudo apt-get update && sudo apt-get install -y gjs
      - id: base
        name: Resolve diff base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Push to a non-main branch: diff against HEAD~1.
            echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          fi
      - id: classify
        name: Classify affected workspaces
        # On classifier failure we leave outputs unset; the linux job's
        # gates then default to "global" via the `||` fallbacks below.
        continue-on-error: true
        env:
          FORCE_FULL: ${{ vars.GJSIFY_CI_FORCE_FULL }}
        run: |
          set -e
          if [ "$FORCE_FULL" = "1" ]; then
            echo "global=true" >> "$GITHUB_OUTPUT"
            echo "skip-all=false" >> "$GITHUB_OUTPUT"
            echo "include-args=" >> "$GITHUB_OUTPUT"
            echo "run-integration=true" >> "$GITHUB_OUTPUT"
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
            echo "reason=vars.GJSIFY_CI_FORCE_FULL=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gjs -m packages/infra/cli/dist/cli.gjs.mjs affected \
              --base "${{ steps.base.outputs.sha }}" \
              --format=github-actions

  linux:
    needs: changes
    # Run unless the classifier explicitly says skip-all. `always()`
    # ensures we proceed even when the `changes` job was itself skipped
    # (main / schedule path) — those land here with empty outputs and the
    # gates below default to "run everything".
    if: ${{ always() && needs.changes.outputs.skip-all != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        fedora-version: [43, 44]
        include:
          - fedora-version: 43
            gjs-info: "GJS 1.86 / SM 140"
          - fedora-version: 44
            gjs-info: "GJS 1.88 / SM 140"

    name: Fedora ${{ matrix.fedora-version }} (${{ matrix.gjs-info }})
    runs-on: ubuntu-latest
    # Cap the whole job well under GitHub's 6h default so a runaway (e.g. a
    # hung build step) fails in ~2h instead of burning a runner for 6h. The
    # per-step guard on "Build examples" below is the tighter, targeted net.
    timeout-minutes: 120
    container:
      image: fedora:${{ matrix.fedora-version }}

    steps:
      - name: Install container prerequisites
        run: dnf install -y git tar xz findutils

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install GJS and GNOME development libraries
        # gstreamer1-{,plugins-base-,plugins-bad-free-}devel provide the
        # gstreamer-1.0 / gstreamer-sdp-1.0 / gstreamer-webrtc-1.0 pkg-config
        # files + headers needed to compile @gjsify/webrtc-native at Vala
        # build time. libnice-gstreamer1 provides the `nice` plugin that
        # webrtcbin needs at runtime for the WebRTC test suite.
        #
        # `glib2` (NOT just `glib2-devel`) ships the `glib-compile-resources`
        # binary that tests/e2e/cli-only/run.mjs hard-requires for the
        # `gjsify gresource` test (silent-skip was hiding the gap in CI).
        # `gettext` ships `msgfmt` for the parallel `gjsify gettext` test.
        run: >
          dnf install -y
          gjs
          glib2
          glib2-devel
          gettext
          gobject-introspection-devel
          gtk4-devel
          libsoup3-devel
          webkitgtk6.0-devel
          libadwaita-devel
          gdk-pixbuf2-devel
          libepoxy-devel
          gstreamer1-devel
          gstreamer1-plugins-base-devel
          gstreamer1-plugins-bad-free-devel
          libnice-gstreamer1
          libgda
          libgda-sqlite
          xorg-x11-server-Xvfb
          mesa-dri-drivers
          mesa-libGL


      - name: Install Meson, Vala and Blueprint Compiler
        run: dnf install -y meson vala gcc pkgconf blueprint-compiler

      - name: Enable corepack (yarn shim for PnP e2e suite)
        # tests/e2e/{cli-only-pnp,pnp-zip-static-reads}/ hard-require yarn
        # (>= 4 via corepack's `packageManager` field). Yarn-PnP is a
        # first-class gjsify consumer scenario — silent-skipping the suite
        # when yarn was missing hid real coverage gaps for PnP users
        # (ts-for-gir, easy6502). Node 24 ships corepack; enable it once
        # so `which yarn` succeeds.
        run: corepack enable

      - name: Create non-root user for tests
        run: |
          useradd -m testuser
          chown -R testuser:testuser .

      # Phase D.7d: Node-free install. The committed GJS bundle
      # (`packages/infra/cli/dist/cli.gjs.mjs`) consumes
      # `gjsify-lock.json` and materialises `node_modules/` (incl.
      # workspace `.bin/` shims so `gjsify run …` finds `gjsify` on PATH).
      # No yarn anywhere in the bootstrap.
      - name: Install dependencies (gjsify install --immutable)
        run: su testuser -c 'gjs -m packages/infra/cli/dist/cli.gjs.mjs install --immutable'

      # The CLI's GJS bundle is committed to enable Node-free bootstrap (Phase D.7b).
      # We can't enforce a byte-exact freshness check — the build is not perfectly
      # cross-environment deterministic (Node patch version + system libs perturb
      # the rolldown output). Instead we run a functional check: the committed
      # bundle must execute under stock GJS AND report the *current* package.json
      # version. That catches both "bundle is broken" and "bundle is from the
      # previous release" without forcing every CI environment to produce
      # byte-identical output.
      #
      # MUST run BEFORE the Build step — `gjsify run build` rebuilds
      # `dist/cli.gjs.mjs`, overwriting the committed copy with one assembled
      # from the just-installed node_modules layout. Verifying after a rebuild
      # would test the rebuilt bundle (not the committed one), defeating the
      # purpose of the freshness check.
      - name: Verify committed CLI GJS bundle is functional + up-to-date
        run: |
          set -e
          EXPECTED=$(node -p "require('./packages/infra/cli/package.json').version")
          ACTUAL=$(gjs -m packages/infra/cli/dist/cli.gjs.mjs --version 2>&1 | head -1 | tr -d '[:space:]')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::packages/infra/cli/dist/cli.gjs.mjs reports version '$ACTUAL', package.json says '$EXPECTED'."
            echo "::error::Refresh locally: gjsify workspace @gjsify/cli build && gjsify workspace @gjsify/cli build:gjs-bundle"
            echo "::error::Then commit packages/infra/cli/dist/cli.gjs.mjs."
            exit 1
          fi
          echo "GJS bundle OK — reports v$ACTUAL matching package.json."

      # Same logic as the CLI bundle check above, applied to the `@gjsify/tsc`
      # GJS bundle. The committed `dist/tsc.gjs.mjs` wraps upstream
      # `typescript`'s `_tsc.js` CLI — its `--version` output (`Version <X>`)
      # must match the `TYPESCRIPT_VERSION` constant pinned in
      # `packages/infra/tsc/src/index.ts`. A drift between the two means
      # either the bundle wasn't rebuilt after a typescript devDep bump
      # (stale artifact) or `TYPESCRIPT_VERSION` wasn't updated to reflect a
      # rebuild (wrong constant). Both are real bugs — `@gjsify/tsc`'s only
      # value is being a Node-free TypeScript CLI, and downstream
      # `tsc --version` checks rely on the reported number matching the
      # actual bundled compiler.
      #
      # Must also run BEFORE Build, for the same reason as the CLI check —
      # `gjsify run build` would rebuild the bundle in-place.
      - name: Verify committed @gjsify/tsc GJS bundle is functional + up-to-date
        run: |
          set -e
          EXPECTED=$(grep "TYPESCRIPT_VERSION = " packages/infra/tsc/src/index.ts | sed "s/.*'\([^']*\)'.*/\1/")
          ACTUAL=$(gjs -m packages/infra/tsc/dist/tsc.gjs.mjs --version 2>&1 | head -1 | sed 's/^Version //' | tr -d '[:space:]')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::packages/infra/tsc/dist/tsc.gjs.mjs reports 'Version $ACTUAL', TYPESCRIPT_VERSION constant says '$EXPECTED'."
            echo "::error::Refresh locally: gjsify workspace @gjsify/tsc build"
            echo "::error::Then commit packages/infra/tsc/dist/tsc.gjs.mjs (and TYPESCRIPT_VERSION in packages/infra/tsc/src/index.ts if upstream typescript was bumped)."
            exit 1
          fi
          echo "@gjsify/tsc bundle OK — reports v$ACTUAL matching TYPESCRIPT_VERSION."

      # Restore previously-built `lib/` directories + `tsbuildinfo` files.
      # TypeScript with `composite: true` (the standard tsconfig template in
      # this monorepo) reads `tsconfig.tsbuildinfo` and only re-emits files
      # whose source signature changed. The cache key is content-addressable
      # over every input that affects build output, so a PR touching only
      # docs / a single workspace's src lands on a near-perfect cache hit:
      #
      #   primary key: includes the hash of all `packages/**/src/**` files.
      #                exact-hit only on a perfect no-source-change PR.
      #   restore-key 1: drops the src hash → restores the most-recent
      #                  cached lib/ for the same lockfile+tsconfig set.
      #                  tsc + rolldown then re-emit only the files whose
      #                  src changed; the rest stay byte-identical.
      #   restore-key 2: just the Fedora version → ultimate fallback,
      #                  useful when the lockfile bumps en masse.
      #
      # Per-Fedora-major scope because the bundler output (rolldown) can
      # diverge by host libs; Fedora 43 vs 44 would otherwise share the
      # same cache and produce stale bundles.
      # IMPORTANT: paths use `packages/*/*/...` (pillar/name), NOT
      # `packages/**/...`. The double-star globs into node_modules and
      # blew up the cache POST upload to multi-gigabyte tars that hung
      # for hours. The pillar/name shape covers every real workspace
      # while skipping the deps tree.
      - name: Cache build output (lib/ + tsbuildinfo)
        uses: actions/cache@v4
        with:
          # NEVER cache git-committed, version-locked artifacts. `@gjsify/tsc`'s
          # `lib/` (the ~108 default `lib.*.d.ts`) and the committed `.gjs.mjs`
          # bundles are TRACKED DATA, not build output. Caching them lets a cache
          # restore overwrite the correct checked-out files with a stale set — a
          # Fedora-44-only run could then type-check the workspace with an
          # incomplete lib (e.g. crypto: `TS2550 padStart` / `TS2339
          # toStringTag`) non-deterministically. The `!` excludes keep them = the
          # git checkout, so `build-bundle.mjs`'s pickLibSource() `keep` branch is
          # always safe. (In a `|` block scalar the `!` lines are literal — no
          # quoting, and a leading `#` would be a path, not a comment.)
          path: |
            packages/*/*/lib
            !packages/infra/tsc/lib
            packages/*/*/tsconfig.tsbuildinfo
            packages/*/*/tsconfig.*.tsbuildinfo
            packages/*/*/dist
            !packages/infra/cli/dist/cli.gjs.mjs
            !packages/infra/tsc/dist/tsc.gjs.mjs
          key: build-v2-${{ runner.os }}-fedora${{ matrix.fedora-version }}-${{ hashFiles('gjsify-lock.json', 'package.json', 'packages/*/*/tsconfig*.json', 'packages/*/*/package.json') }}-${{ hashFiles('packages/*/*/src/**/*.ts', 'packages/*/*/src/**/*.mts', 'packages/*/*/src/**/*.cts') }}
          restore-keys: |
            build-v2-${{ runner.os }}-fedora${{ matrix.fedora-version }}-${{ hashFiles('gjsify-lock.json', 'package.json', 'packages/*/*/tsconfig*.json', 'packages/*/*/package.json') }}-
            build-v2-${{ runner.os }}-fedora${{ matrix.fedora-version }}-

      - name: Build
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run build'

      # Root `build` uses --no-private, so private example workspaces are skipped; tests need dist/.
      - name: Build examples
        # Targeted guard: the example workspaces fan out the most parallel
        # build work. A legitimate run finishes in a few minutes; 30 min is
        # ample headroom but fails fast if a build hang ever creeps in, instead
        # of waiting out the 120-min job ceiling.
        timeout-minutes: 30
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run build:examples'

      # Workspace-wide dependency consistency drift detection. The CLI's
      # `upgrade --check` mode walks every `package.json` in the monorepo,
      # groups by dep name, and fails if the same dep is declared at
      # multiple ranges across workspaces. `--exclude-workspace
      # '@gjsify/integration-*'` carves out integration-test packages
      # whose pins to specific upstream versions are intentional (e.g.
      # `zod@4.3.6` exact in `integration-mcp-typescript-sdk`,
      # `typescript@^5.x` in `integration-deepkit-type-compiler`).
      # Pairs with `gjsify upgrade --align` as the local fix.
      - name: Check dependency consistency
        run: >
          su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH"
          gjsify upgrade --check --exclude-workspace "@gjsify/integration-*"'

      - name: Check
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run check'

      - name: Check examples
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run check:examples'

      # Test step — gated by the classifier's output. Three observable
      # paths:
      #   1. main / schedule / global trigger / classifier failed → full
      #      `gjsify run test` (workspace foreach across the monorepo).
      #   2. include-args non-empty (typical PR) → `gjsify foreach
      #      <include args> --exclude '@gjsify/integration-*' test`. The
      #      integration carve-out keeps the heavy suites in their own
      #      gate below.
      #   3. neither → step is skipped (the `if:` below). The whole job
      #      run as a no-op is intentional: build + check + lint still
      #      ran so the PR has SOMETHING green to merge against, but no
      #      test time is wasted.
      - name: Test
        if: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args != '' }}
        env:
          GLOBAL: ${{ needs.changes.outputs.global }}
          INCLUDE_ARGS: ${{ needs.changes.outputs.include-args }}
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args=\"-screen 0 1280x720x24\" sh -c '
            if [ \"\$GLOBAL\" = \"true\" ] || [ -z \"\$GLOBAL\" ]; then
              gjsify run test
            else
              gjsify foreach test \$INCLUDE_ARGS --exclude \"@gjsify/integration-*\"
            fi
          '"

      # WebGL conformance — only when @gjsify/webgl (or its consumers)
      # are in the closure, OR on the full-run paths. The classifier
      # emits @gjsify/webgl as part of include-args when warranted; we
      # check for its presence to gate this expensive xvfb-run.
      - name: Test WebGL conformance
        if: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || contains(needs.changes.outputs.include-args, '@gjsify/webgl') }}
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args="-screen 0 1280x720x24" gjsify workspace @gjsify/webgl test:conformance'

      - name: Test CLI examples
        if: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args != '' }}
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run test:examples'

      - name: Test net examples
        if: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args != '' }}
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run test:examples:net'

      # E2E tests — gated when an `e2e` path was touched OR on a full
      # run. Tests live under `tests/e2e/` and exercise the CLI end-to-
      # end (install, build, dlx, …). Slow enough to skip on docs-only
      # / single-workspace-impl PRs.
      - name: E2E tests
        if: ${{ needs.changes.outputs.run-e2e == 'true' || needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' }}
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run test:e2e'

      # Integration tests — NOT wired into CI yet. AGENTS.md "Integration
      # tests" section explicitly classifies them as opt-in
      # ("NOT part of `gjsify foreach test` — opt-in to avoid blocking
      # PRs on tracked gaps."). Individual suites have CI-incompatible
      # preconditions today: `integration-autobahn` needs Podman/Docker
      # for the crossbario fuzzingserver, `integration-axios` (and
      # likely others) hang on test:gjs in this Fedora container.
      #
      # The classifier still emits `run-integration` so we can re-enable
      # the gate per-suite once each integration package has been
      # individually hardened for the Fedora-in-Ubuntu environment.
      # Tracked as a STATUS.md "Open TODO" follow-up.
