name: GJS

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly full sweep on main — safety net for the selective-CI gates
    # below. Runs the full test suite even when no PR touched a path the
    # classifier would mark as a global trigger.
    - cron: '0 4 * * *'
  # On-demand FULL sweep. The nightly is a safety net that runs when it runs;
  # this is the one you can point at a specific ref and wait for — the check
  # you want before cutting a release, or whenever a selective run's green is
  # not the answer to the question you are asking.
  #
  # Deliberately NOT an input-gated "force full" on the normal triggers: the
  # only existing way to force a full run is the repo variable
  # `GJSIFY_CI_FORCE_FULL`, which is a global switch that slows down EVERY PR
  # until someone remembers to unset it. A dispatch is per-run and leaves no
  # residue.
  workflow_dispatch:

# Cancel superseded runs on the SAME PR branch (a force-push / new commit
# obsoletes the in-flight run). main pushes + the nightly schedule are not
# cancelled ONCE THEY HAVE STARTED — each landed commit + sweep completes on its
# own.
#
# `cancel-in-progress` governs IN-PROGRESS runs only. A run still PENDING in the
# group is evicted when a newer run joins it, whatever this expression says —
# GitHub keeps one pending run per group. Measured 2026-08-14: the push run for
# the #1170 merge sat pending behind a main run from 34 minutes earlier, a
# `workflow_dispatch` on main joined the group, and the push run was cancelled 3 s
# later with zero jobs ever started. So a LANDED COMMIT COULD END UP WITH NO RUN
# OF ITS OWN, and the run list showed `cancelled`, which reads as noise rather
# than as a gap. Until this is confirmed fixed, that gap is still detectable the
# way it was found: `gh run list --commit $(git rev-parse origin/main)` shows
# whether main's CURRENT sha has a run at all, which reading the newest green run
# on the branch does not.
#
# Which is why the group key is now PER-RUN off a PR. Eviction is a property of
# the group, so the fix is to stop putting independent runs in one. `github.sha`
# is NOT enough and was the first attempt: in all four eviction pairs on record
# the push and the `workflow_dispatch` are the SAME commit, so keying on the sha
# leaves them competing exactly as before. `github.run_id` is unique per run, so
# nothing off a PR ever shares a group. Same construction as `prebuilds.yml`,
# which has keyed it this way all along.
#
# Pull requests deliberately keep the branch-wide key — there, superseding IS the
# wanted behaviour, and `cancel-in-progress` above is what performs it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('main-pr-{0}', github.ref) || format('main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Package lists shared between the job that BUILDS a bundle and the job that
# RUNS it. Workflow-level `env` is visible to every job's `run:` steps (and
# survives the `su testuser -c` boundary, which preserves the environment), so
# each list has exactly ONE definition. Paths, not package names, because both
# consumers work on directories (`cd <dir> && gjsify run <script>`).
env:
  # ── macOS leg (see the `macos` job) ────────────────────────────────────
  # A curated subset, not the full 113-spec suite. Two groups:
  #
  #   platform-aware — packages that dispatch on the host OS and whose macOS
  #   branch has never executed anywhere:
  #     v8            `src/heap/darwin.ts` (`ps -o rss=,vsz=`; no procfs) behind
  #                   a SystemVersion.plist probe — the spec asserts
  #                   `used_heap_size > 0`, so the darwin reader is really read.
  #     child_process `src/platform/darwin.ts` — the BSD signal table (SIGUSR1 is
  #                   30 on Darwin, 10 on Linux; SIGSTOP 17 vs 19), `detached`
  #                   degrading without `setsid(1)`, and the new in-process
  #                   `communicate.ts` timeout that replaced GNU `timeout(1)`.
  #     path          POSIX/Win32 dispatch + `getPathSeparator()`; also the
  #                   single largest pure-logic suite here (432 cases).
  #
  #     os            `src/darwin.ts` — `sysctl` for cpu model/speed, `vm_stat`
  #                   for free memory, `ifconfig` parsing for
  #                   networkInterfaces. It GATES here now; it was a non-gating
  #                   probe while `os.cpus()` returned a `times` object with no
  #                   members on macOS. The one reading macOS genuinely cannot
  #                   produce (per-CPU tick counters, which need Mach's
  #                   `host_processor_info`) is an `it.failing(…, { when })`
  #                   that fails the day a reader exists, so it is carried by
  #                   the assertion rather than by this list.
  #
  #   controls — pure-TS/engine-level packages that MUST behave identically on
  #   both hosts. If one of these reds while the platform-aware ones pass, the
  #   fault is the harness/toolchain, not the package:
  #     querystring, string_decoder (pure logic),
  #     buffer (Blob/atob/btoa — i.e. macOS SpiderMonkey itself).
  #
  # This list stays a curated subset ON PURPOSE. The full Node-pillar sweep,
  # on BOTH `test:node` and `test:gjs` and on both architectures, is
  # `macos-suites.yml` — which checks out and builds, so it can run the legs
  # this job structurally cannot. What remains here is the fast signal on every
  # main push: platform-neutral bundles built on the Fedora leg, executed on
  # macOS.
  MACOS_TEST_PACKAGES: >-
    packages/node/v8
    packages/node/child_process
    packages/node/os
    packages/node/path
    packages/node/querystring
    packages/node/string_decoder
    packages/node/buffer

  # ── Bun + Deno leg (see the `cross-runtime` job) ───────────────────────
  # Packages whose `--app node` test bundle actually exercises OUR code on a
  # Node-API runtime. The filter is NOT `gjsify.runtimes.node != "none"` alone:
  # a spec that imports `node:path` gets Node's/Bun's/Deno's own builtin (the
  # bundle externalises it), so such a leg would test the runtime, not the
  # polyfill. Every entry below either imports its own package by name, or
  # imports a bare Web specifier that `ALIASES_WEB_FOR_NODE` routes to the
  # POLYFILL (`dom-events`-style), or is infra code that is nobody's builtin.
  # Every entry is run locally on node + bun + deno BEFORE being listed — that is
  # the bar for joining this list, and it is why there is no count here: a number
  # in a comment is a second copy of the list's length that nothing checks.
  CROSS_RUNTIME_PACKAGES: >-
    packages/gjs/unit
    packages/gjs/runtime
    packages/web/adwaita-core
    packages/framework/storybook-core
    packages/web/domparser
    packages/web/webstorage
    packages/infra/semver
    packages/infra/workspace
    packages/infra/npm-registry
    packages/infra/tar
    packages/infra/create-gjsify

  # ── Browser leg (see the `browser` job) ────────────────────────────────
  # Playwright `--grep` regex matching the browser bundles that are KNOWN RED
  # today. They run as a NON-GATING probe so wiring the axis in does not red
  # main; everything else gates. (`MACOS_PROBE_PACKAGES` above was the same
  # shape and is GONE — `@gjsify/os` gates now, which is what a probe list is
  # supposed to end as.) Each
  # entry must name a real, understood defect and must be DELETED once fixed —
  # a growing list means the axis is being routed around instead of used.
  #
  #   events  `src/test.browser.mts` is `export * from './test.mjs'`, i.e. it
  #           re-runs the GJS/Node spec files in a browser. AGENTS.md forbids
  #           exactly that ("never import … *.spec.ts files that do"). It does
  #           not fail, it HANGS — the bundle never sets `data-tests-done`, so
  #           the Playwright timeout is the only signal.
  #   util    Same forbidden re-export shape. `util.styleText`'s spec reads bare
  #           `process.env.FORCE_COLOR`, and `--app browser` maps `process` to
  #           `@gjsify/empty`, so the assertion dies on `process is not defined`
  #           (1 of 269). The IMPL is fine — `styleText` guards with
  #           `globalThis.process?.stdout`; the SPEC is the browser-hostile part.
  #   streams The spec feeds STRING chunks into `new Response(stream).text()`.
  #           Per the Fetch spec a body stream must yield `Uint8Array`, and
  #           Firefox enforces it ("Can't convert value to Uint8Array while
  #           consuming Body") where Chromium and undici are lenient (3 of 13).
  #           A genuine engine difference the axis exists to surface.
  BROWSER_PROBE_GREP: '@gjsify/(events|util|streams) — browser unit tests'

  # Packages whose `--app browser` BUILD (not test) is known broken, so the
  # staging step below does not red the build job over them. Also deliberately
  # ledgered rather than skipped: `build-bundles.mjs` still attempts them and
  # says so when one starts working again.
  #
  #   constants  `gjsify build --app browser` dies with a rolldown MissingExport:
  #              `lib/esm/index.js` imports `{ constants }` from `node:os`,
  #              `node:fs` and `node:crypto`, all of which the browser alias
  #              layer maps to `@gjsify/empty` (which exports nothing). The build
  #              then prints the CLI help + a `{"error": …}` line, writes no
  #              bundle — and EXITS 0. That silent-zero is why `build-bundles.mjs`
  #              asserts the artifact exists instead of trusting the exit code;
  #              the exit code itself is a `@gjsify/cli` bug to fix separately.
  BROWSER_KNOWN_BROKEN_BUILDS: '@gjsify/constants'

jobs:
  # Matrix planner — emits the Fedora legs the build/test jobs run as a JSON job
  # output that the matrix `fromJSON`s (a matrix axis can't be built inline here).
  # Each entry is a full object {v, gjs}. Standardised on Fedora 44 (GJS 1.88 /
  # SM 140), the supported platform — the Fedora 43 / GJS 1.86 leg was dropped.
  setup:
    runs-on: ubuntu-latest
    outputs:
      fedora-matrix: ${{ steps.plan.outputs.fedora-matrix }}
      macos-matrix: ${{ steps.plan.outputs.macos-matrix }}
      macos-enabled: ${{ steps.plan.outputs.macos-enabled }}
      # Human-readable twin of `macos-enabled`, emitted by the SAME branch that
      # decides it. The `ci-summary` job prints it verbatim so the reason a leg
      # was skipped lives in exactly one place — next to the decision — instead
      # of being restated (and eventually contradicted) by the reporter.
      macos-reason: ${{ steps.plan.outputs.macos-reason }}
    steps:
      - id: plan
        env:
          # Booleans/enums only — never interpolate attacker-controlled text
          # (titles, branch names, …) into this shell.
          EVENT: ${{ github.event_name }}
          MACOS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
        run: |
          echo 'fedora-matrix=[{"v":"44","gjs":"GJS 1.88 / SM 140"}]' >> "$GITHUB_OUTPUT"

          # macOS leg. The axis is an OBJECT for the same reason the Fedora one
          # is: `runs-on` and the job name are read off the entry, so adding an
          # Intel `macos-13` leg later is one more object rather than a static
          # `include:` (an include for a runner absent from a reduced axis
          # spawns a phantom leg).
          #
          # The enable/disable decision is a SEPARATE boolean, deliberately not
          # an empty array: an empty matrix vector is a workflow-authoring
          # hazard, while a job-level `if:` skips cleanly and reads as "skipped"
          # rather than "no legs".
          echo 'macos-matrix=[{"os":"macos-latest","arch":"arm64","gjs":"Homebrew GJS 1.88 / SM 140"}]' >> "$GITHUB_OUTPUT"

          # Cost control. GitHub bills macOS runners at 10x Linux, so the leg is
          # OFF on pull_request by default and ON for push-to-main + the nightly
          # sweep — the same "full on main/nightly, reduced on PR" shape the
          # Fedora axis uses. Escape hatch: label a PR `ci:macos` to opt that PR
          # in (for a change that touches a per-platform module).
          if [ "$EVENT" = "pull_request" ] && [ "$MACOS_LABEL" != "true" ]; then
            echo 'macos-enabled=false' >> "$GITHUB_OUTPUT"
            echo 'macos-reason=pull_request without the `ci:macos` label (macOS runners bill at 10x) — add the label to opt this PR in' >> "$GITHUB_OUTPUT"
            echo "[ci] macOS leg: skipped (pull_request without the ci:macos label)"
          else
            echo 'macos-enabled=true' >> "$GITHUB_OUTPUT"
            echo "macos-reason=enabled for event '$EVENT'" >> "$GITHUB_OUTPUT"
            echo "[ci] macOS leg: enabled ($EVENT)"
          fi

  # Classifier job — diffs HEAD vs the PR's base SHA, emits per-test-tier
  # gates as job outputs. Runs in seconds on plain ubuntu-latest with no
  # Fedora image and no `gjsify install` — it boots the committed, DEDICATED
  # classifier bundle (`packages/infra/cli/dist/affected.gjs.mjs`). That bundle
  # imports ONLY the `affected` command, so it pulls just GLib/Gio/GioUnix
  # (which ship with the host's `gjs`) and NOT `gi://Soup` — unlike the full
  # `cli.gjs.mjs`, whose network commands require the Soup typelib this host
  # lacks, which silently crashed the classifier into a permanent full-run
  # fallback. `continue-on-error` + missing-output defaults still mean a
  # classifier crash falls back to a full run (fail-safe).
  #
  # Skipped on main pushes and on the nightly schedule — those branches
  # MUST run the full suite unconditionally. The downstream build/test jobs
  # observe `needs.changes.outputs.*` as empty in those cases and fall back
  # to the historical full-run path.
  #
  # Repo-level kill switch: set `vars.GJSIFY_CI_FORCE_FULL=1` and the
  # classifier emits `global=true` regardless of the diff.
  changes:
    # Skipped for schedule / main / manual dispatch — all three MUST run the
    # full suite. Downstream jobs read `needs.changes.outputs.*` as empty and
    # fall back to the historical full-run path, so a dispatch needs no gate of
    # its own; it reuses the branch the nightly has been proving every night.
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      skip-all: ${{ steps.classify.outputs.skip-all }}
      global: ${{ steps.classify.outputs.global }}
      include-args: ${{ steps.classify.outputs.include-args }}
      run-integration: ${{ steps.classify.outputs.run-integration }}
      run-e2e: ${{ steps.classify.outputs.run-e2e }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gjs (host-side, for the classifier bundle only)
        run: sudo apt-get update && sudo apt-get install -y gjs
      - id: base
        name: Resolve diff base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Push to a non-main branch: diff against HEAD~1.
            echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          fi
      - id: classify
        name: Classify affected workspaces
        # On classifier failure we leave outputs unset; the build/test jobs'
        # gates then default to "global" via the `||` fallbacks below.
        continue-on-error: true
        env:
          FORCE_FULL: ${{ vars.GJSIFY_CI_FORCE_FULL }}
        run: |
          set -e
          if [ "$FORCE_FULL" = "1" ]; then
            echo "global=true" >> "$GITHUB_OUTPUT"
            echo "skip-all=false" >> "$GITHUB_OUTPUT"
            echo "include-args=" >> "$GITHUB_OUTPUT"
            echo "run-integration=true" >> "$GITHUB_OUTPUT"
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
            echo "reason=vars.GJSIFY_CI_FORCE_FULL=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gjs -m packages/infra/cli/dist/affected.gjs.mjs \
              --base "${{ steps.base.outputs.sha }}" \
              --format=github-actions

  # ── Whole-tree checks ───────────────────────────────────────────────
  # The three claims in this workflow that are about the TREE rather than about
  # a set of workspaces: lint is clean, the tree is formatted, no dependency
  # range has drifted. Their own job, on purpose.
  #
  # They used to ride `check` and `build`, and each carried a comment saying it
  # was deliberately whole-repo — but both host jobs are gated on the affected
  # classifier's `skip-all`, so "whole-repo" only ever meant "whole repo, IF the
  # classifier found a workspace to build". `skip-all` is an honest answer to a
  # BUILD question and was answering a TREE question by accident.
  #
  # The bill came due in #1183: it touched only classifier-IGNORE paths
  # (`packages/node-gi/**`), skipped the matrix, and landed unformatted code
  # behind a green required check — `gate` treats a skipped `check` as a pass.
  # #1186 reformatted it afterwards; nothing stopped the next one. The IGNORE
  # list also covers `packages/napi/**` and `website/**`, and neither node-gi.yml
  # nor napi.yml has any lint or format step, so those trees were reachable the
  # same way. This is the second instance of the class — the first (#949, #960)
  # put its red on a stranger's PR, #957.
  #
  # NOT `needs: build`. That is the whole point: `build` is skipped exactly when
  # this job is needed, and `check` additionally requires it to have SUCCEEDED,
  # so neither could host an ungated step no matter what its `if:` said.
  #
  # The CLI here is the PUBLISHED bootstrap (`$GJSIFY_BOOTSTRAP`), not this
  # commit's — a tree that is installed but not built has no other (ADR 0002).
  # That is honest for what this job claims, because the CLI only assembles
  # argv: `gjsify lint` runs the workspace's PINNED oxlint through its Node
  # launcher, `format --check` the pinned oxfmt, and `upgrade --check` reads the
  # tree's own package.json files. Whether the CLI's own lint/format commands
  # still WORK is a different claim, and `tests/e2e/{oxc,oxc-plugin,
  # lint-gjs-launcher}` in the `e2e` job is what holds it.
  tree-checks:
    name: Whole-tree checks
    needs: [setup]
    # No classifier gate anywhere in this expression, deliberately. The cost is
    # one install on a docs-only PR, and it is the price of the claim.
    if: ${{ always() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    container:
      # One Fedora, not the matrix: lint, format and dependency ranges are
      # properties of the checkout, identical on every leg.
      image: ghcr.io/gjsify/ci-fedora:${{ fromJSON(needs.setup.outputs.fedora-matrix)[0].v }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ fromJSON(needs.setup.outputs.fedora-matrix)[0].v }}
          # This job must run when `build` does not, so there is no artifact to
          # restore — `gjsify-setup` publishes the published bundle instead.
          bootstrap-bundles: 'false'

      # Gates on ERRORS ONLY, and that is oxlint's own exit semantics, not a
      # flag: warnings never affect the exit code unless you opt in with
      # --max-warnings/--deny-warnings, which this deliberately does NOT pass.
      # The open warnings (mostly consistent-type-imports / no-unused-vars) stay
      # visible in the log without failing the build.
      - name: Lint (oxlint, errors only)
        run: su testuser -c "gjs -m '$GJSIFY_BOOTSTRAP' lint"

      # And the question the step above cannot ask about itself: did it SEE the code?
      # `.oxlintrc.json`'s `**/lib` was written for build output and also hid 26
      # hand-written sources in `@gjsify/{manifest-conformance,resolve-npm}` — the
      # manifest gates that block this branch and the alias layer every build target
      # routes through, neither ever linted. The lint step was green throughout,
      # because a gate grades the files it was handed and the defect was in the
      # handing. This one diffs `oxlint --debug=files .` against the same walker over
      # `git ls-files` with `--no-ignore`, so both halves are oxlint's own answer, and
      # every blind file is either declared with a reason or red.
      #
      # It runs HERE, next to the lint it audits, and not in `audit-runtimes.yml` with
      # the other repo-scoped gates: that workflow deliberately installs nothing, and
      # this needs the pinned `oxlint` from `node_modules`.
      #
      # As TESTUSER, unlike the `check-doc-fences.mjs` step below: `gjsify-setup` runs
      # `chown -R testuser:testuser .`, and this script's subject is `git ls-files`, so
      # as root it would meet git's dubious-ownership refusal against a tree owned by
      # someone else. `check-doc-fences.mjs` touches no git and does not care.
      - name: Check the lint gate sees every tracked file
        run: su testuser -c 'node scripts/check-lint-visibility.mjs'

      # The same question of the repository's own SOURCE WALKERS, which the step above
      # cannot ask: oxlint reading a file says nothing about whether the reach audit, the
      # comment budget or the spec-registration reader ever opened it. `.tsx` arrived and
      # three of them kept grading the files they were handed — the reach audit could not
      # see `@gjsify/adwaita-react-native`'s four widget implementations at all (measured on
      # `feat/adwaita-react-native`, where that package lives), so setting its `react-native`
      # runtime slot to `polyfill`, `partial` or `none` was exit 0 for each; and on this
      # branch the comment budget did not count 19 tracked `.tsx` files, which took
      # `showcases` from 0.153 to 0.170 against a ceiling that had shown headroom.
      # Each carried its own extension literal, so fixing one taught the others nothing.
      #
      # One vocabulary now (`source-extensions.mjs`), and this holds it: every extension
      # oxlint reads on a tracked file is in it or declared with a reason, and each
      # registered walker is asked which files its OWN scope holds and which of those it
      # actually reads. It runs here, beside the lint it borrows as an oracle, for the same
      # reason that step does — `audit-runtimes.yml` installs nothing.
      - name: Check every source walker sees the source
        run: su testuser -c 'node scripts/check-source-visibility.mjs'

      # A formatter with a config and no gate formats nothing. `.oxfmtrc.json`
      # had been maintained all along while nothing enforced it, and the drift
      # just accumulated: 388 files were unformatted against the version the
      # repo itself pinned.
      - name: Format (oxfmt --check)
        run: su testuser -c "gjs -m '$GJSIFY_BOOTSTRAP' format --check"

      # Workspace-wide dependency-range drift, incl. the TypeScript version
      # invariant. `--exclude-workspace '@gjsify/integration-*'` carves out the
      # integration tests whose pins to specific upstream versions are
      # intentional. It moved here from `build` with the other two: `website` is
      # a root workspace member AND a classifier-IGNORE path, so a website-only
      # dependency bump skipped this check the same way.
      # The Adwaita doc pages' SAMPLES. `check-website-adwaita-gallery.mjs` holds that
      # every storybook widget has a gallery block, and says so in its own header: "it
      # therefore says NOTHING about whether a page RENDERS". Nothing read a fence at
      # all, and an audit found eight defects in that blind spot — three tabs using a
      # glyph they never import, an icon in no theme under prose promising one, a class
      # no stylesheet declares, and two blueprint blocks that do not compile.
      #
      # It lives HERE and not in `audit-runtimes.yml` with the other repo-scoped Adwaita
      # gates, because this is the only job where all four of its arms are real: the
      # compile arm needs GTK's typelibs, not just the binary. On a bare `ubuntu-latest`
      # with `blueprint-compiler` apt-installed, all 40 fences came back "Could not find
      # GTK 4 introspection files" — 40 failures that say nothing about the samples. The
      # ci-fedora image bakes blueprint-compiler, gtk4-devel and gobject-introspection
      # (`.docker/ci-fedora.Dockerfile`), and this job carries no classifier gate, so a
      # docs-only PR runs it too.
      - name: Check every Adwaita doc sample is one that runs
        run: node scripts/check-doc-fences.mjs

      - name: Check dependency consistency
        run: >
          su testuser -c "gjs -m '$GJSIFY_BOOTSTRAP'
          upgrade --check --exclude-workspace '@gjsify/integration-*'"

      # `@gjsify/gtk-host`'s type surface is GENERATED from the GTK/Adwaita GIR, and
      # `gjsify tsc --noEmit` on the package cannot check it: a type surface type-checks
      # against ITSELF whatever it claims about `<gtk-box>`. So the gate compiles fixtures
      # that must FAIL — a `@ts-expect-error` per JSX negative (TypeScript reports an unused
      # one, so the half reduces to exit 0) and a declared error code per Vue SFC — and it
      # re-runs them with each load-bearing setting flipped, because a setting whose removal
      # changes nothing is not load-bearing. The one it exists for: with `jsx: "preserve"`,
      # no `jsxImportSource` and `noImplicitAny` off, every JSX element is implicitly `any`
      # and `tsc` exits 0 having checked nothing — measured, 11 of 12 negatives go green.
      # It rides HERE and not in `check`, because the fixtures resolve the package's own
      # subpath to `src/` through a `paths` entry and need no build; this job has the
      # workspace installed and carries no `paths:` filter.
      - name: Check the generated type surfaces (JSX + Vue SFC)
        run: su testuser -c 'node scripts/check-type-surfaces.mjs'

  # ── Build + type-check + examples ───────────────────────────────────
  # Compiles + type-checks the workspace packages and, when examples are in
  # scope, builds them too (build:examples MUST run right after a full build
  # in the SAME job — an example `--app browser` build resolves into workspace
  # package sources and fails off a build-cache-only state). Leaves package
  # lib/dist in the build-output cache and uploads the example dist as an
  # artifact the e2e + examples jobs download.
  #
  # FULL build on global / main / schedule / empty-classifier / cold cache /
  # whenever examples are needed (their build needs the full package tree);
  # otherwise rebuild only the affected closure.
  build:
    needs: [changes, setup]
    if: ${{ always() && needs.changes.outputs.skip-all != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [26.x]
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
    name: Build Fedora ${{ matrix.fedora.v }} (${{ matrix.fedora.gjs }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 180
    container:
      # No `credentials:` — the image is public and pulled anonymously, which
      # is what gives fork PRs any CI at all (a fork's GITHUB_TOKEN cannot
      # authenticate against the org registry). Same for every container job
      # below; see .github/actions/gjsify-setup/action.yml.
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      # `id` so the explicit build-output cache SAVE at the end of this job can
      # read the key + path set the composite restored with. This is the ONLY
      # job that writes that cache — see the save step for why.
      - uses: ./.github/actions/gjsify-setup
        id: setup
        with:
          fedora-version: ${{ matrix.fedora.v }}
          node-version: ${{ matrix.node-version }}

      # Selective build/check rebuild ONLY the affected closure and rely on the
      # build cache having restored a complete lib/+dist/ baseline for the
      # unchanged forward-deps (`gjsify foreach --include` only FILTERS). That
      # baseline exists only on a warm cache → probe a few foundational packages
      # and fall back to a FULL build when cold.
      # The selective path rebuilds ONLY the affected closure and trusts the
      # restored cache for every unchanged forward-dep, so "is the cache warm"
      # really means "is the restored tree a COMPLETE baseline". Probing three
      # directories did not answer that question — it answered "did the archive
      # contain these three", which a badly incomplete archive also satisfies.
      #
      # Observed: a ~4 MB `build-v3-…` archive restored via the *prefix*
      # restore-key ("Cache hit for restore-key", not an exact hit) contained
      # `packages/web/xmlhttprequest/lib/esm` but NOT its `lib/types`. The three
      # probe dirs were present, so the job went selective, never rebuilt
      # xmlhttprequest (outside the closure), and then died in the post-build
      # `Verify declared package outputs exist`. Every selective PR hit it.
      # Such archives exist because during the #855 era a selective run built
      # nothing and still saved its tree; the prefix restore-key happily serves
      # them to later runs.
      #
      # So probe with the SAME whole-tree post-condition the build is checked
      # against, and treat failure as COLD rather than as an error: an
      # incomplete cache now means "do a full build" — which is what the
      # fallback was always for — instead of a red PR. The post-build check
      # keeps its teeth; this only decides which build path can be trusted.
      # Stat-only, ~0.1 s, so it costs nothing.
      - name: Detect warm build cache
        id: buildwarm
        run: |
          if su testuser -c 'node scripts/verify-package-outputs.mjs' > /tmp/warmprobe.log 2>&1; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "[ci] build cache warm (declared outputs all present) — selective build/check eligible"
          else
            echo "warm=false" >> "$GITHUB_OUTPUT"
            echo "[ci] build cache cold or INCOMPLETE — forcing full build/check"
            echo "[ci] probe said:"
            sed -n '1,20p' /tmp/warmprobe.log
          fi

      # `$INCLUDE_ARGS` IS EXPANDED UNQUOTED ON PURPOSE, here and at the three
      # other consumption sites below (browser bundles / check / test). The
      # classifier emits it as space-separated, already-shell-safe tokens
      # (`--include @gjsify/fs --include @gjsify/stream`) and word splitting is
      # exactly what turns that back into argv. Do NOT quote it, and do NOT make
      # the producer quote it either:
      #
      #   `gjsify affected` used to emit `--include '@gjsify/fs'`. The value is
      #   spliced into the `su testuser -c "… sh -c '…'"` nesting below, and the
      #   RESULT of a parameter expansion is never re-scanned for quoting — so
      #   the apostrophes stayed in each glob, every pattern matched zero
      #   workspaces, and `gjsify foreach` printed one line and exited 0. Every
      #   selective PR run built NOTHING in 0.65 s while all later steps happily
      #   inspected the cache-restored tree; `main` stayed green only because a
      #   push to main takes the FULL branch, which passes no include args at
      #   all. See the `include-args` contract in commands/affected.ts.
      #
      # The silence is now closed at the CLI: `gjsify foreach` FAILS when an
      # `--include` pattern matches no workspace, so a future re-break of this
      # transport reds the run instead of no-opping through it. That check is
      # deliberately in the CLI rather than in an assertion here — it protects
      # every caller (the root `test:examples`/`check:examples` scripts, the
      # other three steps below, any consumer repo), and it can distinguish
      # "the filter names nothing that exists" (always a bug) from "the
      # selection narrowed to empty" (legitimate under --shard/--exclude).

      # Every step below reaches the CLI through `node_modules/.bin/gjsify`,
      # which dispatches to `packages/infra/cli/lib/index.js` (node) or
      # `dist/cli.gjs.mjs` (gjs). Since ADR 0002 untracked the bundle, BOTH are
      # build outputs, so on a cold build-output cache the shim exists and
      # points at nothing. `build:infra` is what produces them, and it has to
      # run through the published bundle because that is the only CLI this tree
      # has yet.
      #
      # A PRECONDITION, not an `if:` expression — it mirrors
      # `ensureNodeCliEntry()`'s COLD/WARM branch in
      # `scripts/bootstrap-native-facades.mjs`, so the repo has one shape for
      # this and not two. Its steps are mtime-skipped, so a warm tree pays
      # almost nothing.
      #
      # Required on the SELECTIVE path in particular: `gjsify foreach build
      # $INCLUDE_ARGS` never runs `build:infra`, and until the untracking the
      # committed bundle is what quietly made that work.
      - name: Bootstrap the build toolchain (cold trees only)
        run: |
          if [ -f packages/infra/cli/lib/index.js ]; then
            echo "Node CLI entry present — the .bin shim is usable, skipping build:infra."
          else
            su testuser -c "XDG_CACHE_HOME='$PWD/.gjsify-cache' gjs -m '$GJSIFY_BOOTSTRAP' run build:infra"
          fi

      - name: Build
        env:
          # FULL is computed as a GitHub expression (cleaner than shell logic).
          # Note it SUPERSETS the examples gate below, so whenever build:examples
          # runs the build was full → it has the complete package tree.
          #
          # The `contains(include-args, …)` gates in this file substring-match
          # this same value; they are unaffected by the token spelling (they
          # matched the quoted form too — which is precisely why the gates kept
          # working while the build itself did nothing).
          #
          # `--with-dependencies` on the selective build below is what makes the
          # restored cache safe to sit on. Without it the build rebuilt only the
          # affected set and trusted every unchanged dependency's `lib/` — and a
          # cache can be COMPLETE without being CURRENT, so one cancelled build
          # on `main` left later PRs compiling against pre-merge outputs and
          # failing with errors naming a package they never touched (#1080). The
          # warmth probe below cannot catch that and no probe can: a stale
          # archive is perfectly complete. It goes AFTER the excludes, so the
          # closure does not walk out through `@gjsify/website` (which
          # prod-depends every showcase); measured on the #1080 change set, that
          # ordering is 5 extra packages instead of 56.
          FULL: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args == '' || steps.buildwarm.outputs.warm != 'true' || needs.changes.outputs.run-e2e == 'true' || contains(needs.changes.outputs.include-args, '@gjsify/example-') }}
          INCLUDE_ARGS: ${{ needs.changes.outputs.include-args }}
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" sh -c '
            if [ \"\$FULL\" = \"true\" ]; then
              echo \"[ci] full build\"
              gjsify run build
            else
              echo \"[ci] selective build: \$INCLUDE_ARGS\"
              gjsify foreach build \$INCLUDE_ARGS --with-dependencies -tp --no-private --exclude \"@girs/*\" --exclude \"@gjsify/example-*\" --exclude \"@gjsify/website\"
            fi
          '"

      # A build that exits 0 is not evidence that it WROTE anything. `gjsify
      # tsc` on a `composite`/`incremental` project whose `.tsbuildinfo`
      # outlived its output tree considers the project up to date, emits
      # nothing, and exits 0 (#67, reproduced in `@gjsify/adwaita-core`: with a
      # stale `tmp/.tsbuildinfo` present `lib/types/` was never created; deleting
      # the build info made the same command emit it). The package then publishes
      # a `types` entry point that does not exist and consumers hit TS7016.
      #
      # Nothing else in the pipeline can see that: `check` type-checks SOURCES
      # and never looks at `lib/`; the build cache restores per output unit, so
      # a tree missing a unit is a HIT; and `gjsify pack`'s type-shipping guard
      # (#655) deliberately does NOT fire on an ABSENT declaration, because an
      # unbuilt dev tree must still pack.
      #
      # WHY HERE: this is a POST-condition on a built tree, and `build` is the
      # only job that has one. It runs right after `Build` — before `Verify
      # committed bundles`, which rebuilds parts of the tree and restores
      # artifacts around itself. Cheap (stat-only, no rebuild), so no job that
      # merely restores the build cache needs to repeat it.
      #
      # Both build paths above leave a complete tree: FULL builds everything,
      # and the selective path only runs when the cache probe found a warm
      # baseline for the unchanged forward-deps.
      - name: Verify declared package outputs exist
        id: verifyoutputs
        run: su testuser -c 'node scripts/verify-package-outputs.mjs'

      # The same declarations, asked of the TARBALL rather than the repo. The
      # step above is structurally blind to "the path is not published": in this
      # tree `lib/` always exists, so a package can declare `main: lib/esm/…`,
      # build it, pass that check and still ship a tarball without the file
      # because `files` never named the gitignored build output. Runs here and
      # not in the packer because the superset needs `declaredPaths()` from the
      # still-`private` `@gjsify/manifest-conformance` (see the script's header
      # and `status/open-todos.md`). Post-condition: it reads the CLI's built
      # `lib/`, so it must follow the build.
      - name: Verify declared entry points are in the tarball
        run: su testuser -c 'node scripts/verify-tarball-outputs.mjs'

      # The SHOWCASES, as a separate scope. Held back until now for one honest
      # reason recorded in `status/open-todos.md`: it red-lined on a real finding
      # — 13 declared entry points across 6 of the 8 published showcases, every
      # one present on disk and absent from the tarball because `files` was
      # `["dist"]` while the export names `./src/…`. Wiring it while it failed
      # would only have blocked main; the finding is fixed now (those six ship
      # `src`, matching what `adwaita-storybook` already did), so the scope can
      # hold the line instead of documenting a hole. It matters beyond cosmetics:
      # AGENTS.md documents `require.resolve('@gjsify/example-dom-<name>/assets/
      # <file>')` as the RUNTIME asset path, and the website imports `./browser`
      # from every one of them — published, each was a dangling pointer.
      - name: Verify declared entry points are in the tarball (showcases)
        run: su testuser -c 'node scripts/verify-tarball-outputs.mjs --scope examples'

      # THE build-output cache's only writer. `gjsify-setup` deliberately only
      # RESTORES, because `actions/cache`'s automatic post-job save fires in
      # every job that uses the action — and `deploy-docs.yml`, which builds the
      # website and finishes in ~2 min, won the reservation against this ~22 min
      # job every single time. The result: the cache has essentially never held
      # a full build, only a website-shaped ~4.5 MB tree. That is what left
      # `@gjsify/xmlhttprequest`'s `lib/types` out of it, what makes the
      # completeness probe above fire, and what gave selective builds a junk
      # baseline. Single writer = the race cannot happen.
      #
      # Placed AFTER the completeness post-condition on purpose, and gated on
      # that step's own OUTCOME rather than on `success()`: the automatic save
      # runs even when a job FAILS, so a half-built tree would be published
      # under a fresh key. `outcome == 'success'` is also the correct spelling
      # against a SKIPPED verification (a skip is not a pass) — `success()`
      # alone would be true for a step that never ran.
      #
      # Skipped on an exact key hit: `cache/save` cannot overwrite an existing
      # key, and a hit means the tree it would write is already there.
      - name: Save build output cache
        if: ${{ steps.verifyoutputs.outcome == 'success' && steps.setup.outputs.build-cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          # Same list the composite restored with — one source of truth, so the
          # two cannot drift.
          path: ${{ steps.setup.outputs.build-cache-paths }}
          key: ${{ steps.setup.outputs.build-cache-key }}

      # Rebuilds the two generated things still committed — `affected.gjs.mjs`
      # and `@gjsify/tsc`'s shipped libs — and compares them byte-for-byte
      # against `git show HEAD:<path>`. `affected.gjs.mjs` is the one that needs
      # it: the `changes` job boots it before any install and it gates every
      # other job, so a stale copy does not fail, it silently gates today's PR
      # with an older commit's tables.
      #
      # It also BUILDS `cli.gjs.mjs` + `tsc.gjs.mjs` and leaves them on disk for
      # the artifact upload below — see the `groups` comments in the script for
      # why built-but-ungrouped is the mechanism rather than an oversight.
      #
      # And it is the guard that ADR 0002's untracking STAYS: the artifact set
      # is discovered from git and a committed bundle with no rebuild recipe is
      # a hard error, so re-committing one reds CI.
      #
      # WHY HERE, and only here: ONE job. The rebuild is the expensive part, and
      # `build` is the only job that already has a built workspace for the
      # bundle build to resolve its deps from. AFTER `Build`, so the deps'
      # `lib/` is current. The expected bytes come from git, NOT the working
      # tree — `gjsify run build` rewrites those files in place, so a
      # working-tree comparison would compare a fresh build against itself.
      - name: Verify committed bundles rebuild from source
        id: verify-bundles
        timeout-minutes: 30
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" node scripts/verify-committed-bundles.mjs'

      # When the check fails, hand back the bytes THIS run built. "Rebuild it
      # locally and commit" is the normal fix, but it is not always a fix a
      # contributor can apply: at least two developer machines measurably do not
      # reproduce these bundles (a module-order difference that survives
      # matching the Node version, the rolldown version, the lockfile and the
      # core count — see release-cut.yml, which exists because of it). On such a
      # machine the instruction is an infinite loop and CI is the only source of
      # the bytes that satisfy the check. Uploading them costs nothing on a
      # green run (the step is skipped) and turns a dead end into a download.
      # The transport that replaces `git` for the two big bundles (ADR 0002).
      # Every downstream job boots `dist/cli.gjs.mjs` (≈17 e2e suites do), and
      # once it is untracked a checkout no longer carries it.
      #
      # NOT the build-output cache: its key hashes `packages/*/*/src/**/*.ts`,
      # while `cli.gjs.mjs` inlines `packages/infra/resolve-npm/lib/*.mjs` —
      # tracked source that is not under `src/**` and not in the key. Two
      # revisions differing only there share a key, which is incident #821. The
      # three cache excludes stay for exactly that reason.
      #
      # Unconditional on purpose: a SELECTIVE build must still publish these, or
      # a downstream job silently gets a bundle from another revision.
      #
      # While the bundles are still tracked this uploads the checked-out bytes
      # and the download below overwrites them with what they already are — a
      # no-op that proves the transport with the old path still in place. The
      # untracking commit makes the rebuild the producer.
      - name: Upload the GJS bootstrap bundles
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-bundles-fedora${{ matrix.fedora.v }}
          path: |
            packages/infra/cli/dist/cli.gjs.mjs
            packages/infra/tsc/dist/tsc.gjs.mjs
          retention-days: 1
          if-no-files-found: error

      # Build examples (+ check below) only when an example/showcase is in the
      # closure, e2e will run (its lint-engines suite asserts example dist), or
      # a full run. --jobs 1: native rolldown's --globals auto multi-pass is
      # memory-heavy and the three.js example bundles exhaust the runner's RAM
      # at cpu-count parallelism.
      - name: Build examples
        if: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.run-e2e == 'true' || contains(needs.changes.outputs.include-args, '@gjsify/example-') }}
        timeout-minutes: 45
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify foreach build -ptv --include "@gjsify/example-*" --jobs 1'

      # Same declared-output post-condition as the core sweep above, for the
      # packages that sweep deliberately excludes because they build in the step
      # right before this one. A showcase is published like any other package,
      # and a declared entry point it does not ship breaks a user the same way:
      # `@gjsify/example-dom-excalibur-jelly-jumper@0.23.0` promised four
      # runtimes, shipped only the GJS bundle, and `deno run npm:@gjsify/cli
      # showcase excalibur-jelly-jumper` died on the file it named. Gated on the
      # SAME condition as `Build examples` — it reads what that step produces.
      - name: Verify declared example outputs exist
        if: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.run-e2e == 'true' || contains(needs.changes.outputs.include-args, '@gjsify/example-') }}
        run: su testuser -c 'node scripts/verify-package-outputs.mjs --scope examples'

      # Type-check the examples. UNLIKE the package `check` job (which runs in
      # parallel off the build cache), this MUST stay in the build job: the
      # example type-check resolves workspace deps to their SOURCE (e.g.
      # @gjsify/adwaita-web/src/index.ts → ./styles.generated.js), and those
      # generated sources only exist after this job's full build. The cache
      # carries lib/.d.ts, not generated src, so a cache-only job can't do it.
      - name: Check examples
        if: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.run-e2e == 'true' || contains(needs.changes.outputs.include-args, '@gjsify/example-') }}
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run check:examples'

      # Hand the freshly-built example dist to the e2e + examples jobs. They
      # CANNOT rebuild examples themselves (build:examples needs the full
      # package tree of THIS job), so the dist travels as an artifact instead.
      - name: Upload example build output
        if: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.run-e2e == 'true' || contains(needs.changes.outputs.include-args, '@gjsify/example-') }}
        uses: actions/upload-artifact@v7
        with:
          name: example-dist-fedora${{ matrix.fedora.v }}
          path: |
            showcases/*/*/dist
            examples/*/*/dist
          retention-days: 1
          if-no-files-found: error

      # ── macOS leg: build the bundles HERE, run them THERE ────────────────
      # `@gjsify/rolldown-native` is the only bundler engine that runs under
      # GJS, and it does not compile for Apple targets at all (its Rust core
      # wakes the GLib loop with `eventfd(2)`) — see
      # website/src/content/docs/platform-support.md. On macOS `gjsify build`
      # therefore has to run under Node + npm `rolldown`, which would mean a
      # full `gjsify install` (a ~2 GB, ~16 min cold extract) on a runner billed
      # at 10x. So the build stays on this Fedora leg — where npm rolldown /
      # rolldown-native, node_modules and the build cache already exist — and
      # macOS executes the result.
      #
      # That is sound because `--app gjs` output is a SINGLE self-contained file
      # whose only unbundled imports are `gi://GLib|Gio|GioUnix` (verified with
      # `grep -oE 'gi://[^"]+'` on every bundle in this set): platform-neutral
      # JS plus three typelibs the macOS host provides. What this DOES verify is
      # runtime behaviour on macOS/arm64 — the gap this leg exists to close.
      # What it does NOT verify is the gjsify build toolchain on macOS; that is
      # a separate gap owned by `cli-cross-platform.yml`, and it cannot be
      # closed here while the native bundler has no Apple target at all.
      #
      # Each bundle is copied to a flat staging dir so the macOS side can just
      # glob it — the package list stays defined exactly once (workflow `env`).
      # Staged under `.gjsify-cache/` because gjsify-setup already creates that
      # dir and chowns it to testuser, and it is gitignored (no stray untracked
      # path in the work tree). It is NOT the tarball cache path
      # (`.gjsify-cache/gjsify/tarballs`), so the install cache is untouched.
      - name: Stage GJS test bundles for the macOS leg
        if: ${{ needs.setup.outputs.macos-enabled == 'true' }}
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" sh -c '
            set -e
            out=.gjsify-cache/macos-test-bundles
            rm -rf \"\$out\"
            mkdir -p \"\$out/gate\"
            for d in \$MACOS_TEST_PACKAGES; do
              (cd \"\$d\" && gjsify run build:test:gjs)
              cp \"\$d/test.gjs.mjs\" \"\$out/gate/\$(basename \$d).test.gjs.mjs\"
            done
            ls -l \"\$out/gate\"
          '"

      - name: Upload GJS test bundles for the macOS leg
        if: ${{ needs.setup.outputs.macos-enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: gjs-test-bundles-fedora${{ matrix.fedora.v }}
          path: .gjsify-cache/macos-test-bundles
          retention-days: 1
          if-no-files-found: error

      # ── Browser leg: build the bundles HERE, run them THERE ──────────────
      # Same split as the macOS leg above, for the same reason: the bundler
      # toolchain (`gjsify` + node_modules + the build cache) exists only in this
      # Fedora image, while Playwright's browser dependencies are Debian/Ubuntu-
      # only (`playwright install-deps` has no Fedora support), so the RUN has to
      # happen on ubuntu-latest. `--app browser` output is a SINGLE self-contained
      # ESM file with no unbundled imports at all, so shipping it across is sound.
      #
      # Scope: `$INCLUDE_ARGS` is the classifier's `--include @gjsify/x …` list and
      # `build-bundles.mjs` takes the same flag, so a selective run builds only the
      # affected packages' bundles. A full run (or a change to `tests/browser/**`,
      # i.e. `@gjsify/tests-browser` in the closure — the harness itself, which
      # every bundle rides on) builds all of them.
      #
      # Unquoted expansion is intentional — same contract as the `Build` step
      # above. NB this consumer is a plain node script, NOT `gjsify foreach`, and
      # a closure holding no browser-capable package legitimately produces zero
      # bundles (the upload step's `if-no-files-found: warn` says exactly that),
      # so it deliberately does not inherit foreach's fatal zero-match rule.
      - name: Stage browser test bundles for the Playwright leg
        if: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args != '' }}
        timeout-minutes: 30
        env:
          FULL: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args == '' || contains(needs.changes.outputs.include-args, '@gjsify/tests-browser') }}
          INCLUDE_ARGS: ${{ needs.changes.outputs.include-args }}
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" sh -c '
            set -e
            out=.gjsify-cache/browser-test-bundles
            rm -rf \"\$out\"
            if [ \"\$FULL\" = \"true\" ]; then
              echo \"[ci] browser bundles: all\"
              node tests/browser/scripts/build-bundles.mjs --jobs 2 --known-broken \"\$BROWSER_KNOWN_BROKEN_BUILDS\"
            else
              echo \"[ci] browser bundles (selective): \$INCLUDE_ARGS\"
              node tests/browser/scripts/build-bundles.mjs --jobs 2 --known-broken \"\$BROWSER_KNOWN_BROKEN_BUILDS\" \$INCLUDE_ARGS
            fi
            # Mirror the package-relative paths into the staging dir so the
            # artifact unpacks straight back onto `packages/<pillar>/<pkg>/dist/`
            # in the Playwright job (discover-bundles.mjs resolves them from the
            # repo root, and http-server serves them from there).
            for f in packages/*/*/dist/test.browser.mjs; do
              [ -e \"\$f\" ] || continue
              mkdir -p \"\$out/\$(dirname \$f)\"
              cp \"\$f\" \"\$out/\$f\"
            done
            find \"\$out\" -name test.browser.mjs | sort
          '"

      - name: Upload browser test bundles
        if: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-bundles-fedora${{ matrix.fedora.v }}
          path: .gjsify-cache/browser-test-bundles
          retention-days: 1
          # `warn`, not `error`: a selective closure with no browser-capable
          # package legitimately produces zero bundles. The Playwright job
          # reports the count it received and no-ops cleanly at zero.
          if-no-files-found: warn

  # ── Type-check: packages ────────────────────────────────────────────
  # Restores the build job's .d.ts and type-checks the workspace packages in
  # its own job so it overlaps with test/e2e instead of serializing after the
  # build. tsc only needs the cached .d.ts (the build job just saved them), so
  # no fresh in-job build is required. Selective when the classifier scoped the
  # change (the cache always has the unchanged packages' .d.ts here).
  check:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
    name: Check Fedora ${{ matrix.fedora.v }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    container:
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}
          # Boots dist/cli.gjs.mjs; ADR 0002 took it out of the checkout.
          bootstrap-bundles: 'true'
      - name: Check
        env:
          # No warm-probe here: the build cache is always warm in this job
          # (needs: build just saved it), so selective is safe whenever there
          # is a closure; full otherwise.
          #
          # `$INCLUDE_ARGS` is expanded unquoted below — same contract as the
          # `Build` step; the classifier emits shell-safe tokens and `gjsify
          # foreach` now fails loudly if any of them matches no workspace.
          FULL: ${{ needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args == '' }}
          INCLUDE_ARGS: ${{ needs.changes.outputs.include-args }}
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" sh -c '
            if [ \"\$FULL\" = \"true\" ]; then
              echo \"[ci] full check\"
              gjsify run check
            else
              echo \"[ci] selective check: \$INCLUDE_ARGS\"
              gjsify foreach check \$INCLUDE_ARGS -ptv --exclude \"@girs/*\" --exclude \"@gjsify/example-*\" --exclude \"@gjsify/website\"
            fi
          '"

      # Lint and format used to ride here, because the workspace was already
      # restored. That is a hosting argument, not a correctness one, and this
      # job's `if:` made both claims conditional on the classifier — they are in
      # `tree-checks` now, which nothing gates.

  # ── Unit tests (sharded) ────────────────────────────────────────────
  # Restores the build job's output and runs the workspace test suite split
  # across 4 parallel shards (gjsify foreach --shard). WebGL conformance rides
  # shard 1. On a small selective closure most shards are near-empty no-ops; on
  # a global/main run the full suite is split 4 ways.
  test:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' && (needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args != '') }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
        shard: [1, 2, 3, 4]
    name: Test ${{ matrix.shard }}/4 Fedora ${{ matrix.fedora.v }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 90
    container:
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}
          # Boots dist/cli.gjs.mjs; ADR 0002 took it out of the checkout.
          bootstrap-bundles: 'true'

      # Full sharded sweep on global/main/schedule/empty; selective + sharded
      # otherwise. The full path inlines the root `test` script's filters so it
      # can take --shard. Integration tests stay opt-in.
      #
      # `$INCLUDE_ARGS` is expanded unquoted — same contract as the `Build`
      # step. This is also the one site where an EMPTY final selection is
      # routine: `--shard N/4` over a small closure leaves most shards with
      # nothing to run. That is why the fatal rule in `gjsify foreach` is scoped
      # to "an --include pattern matched no workspace" and not to "the selection
      # came out empty" — the latter would red this job on every small PR.
      #
      # BOTH branches exclude `@gjsify/example-*`, and the selective one has to
      # say so explicitly even though it looks redundant next to the global
      # branch's `--no-private`. An example's `test` is `gjsify run start` — it
      # RUNS the built bundle — and this job never has one: the example dist
      # travels to the `examples` job as the `example-dist-fedora<N>` ARTIFACT,
      # while this job restores the build-output cache, whose path list is
      # `packages/*/*` only. So a closure that pulls an example in (any change to
      # a package an example depends on — measured on `@gjsify/sab-native-*`,
      # which drags in `@gjsify/example-node-cli-sab-parallel-hash`) died on
      # `Error opening file …/dist/index.gjs.js: No such file or directory`,
      # attributing a CI-plumbing gap to whatever package the PR touched.
      # Examples keep their coverage — `Build examples` + `Check examples` here,
      # `Test CLI/net examples` in the `examples` job — this only stops the test
      # shards from running something they cannot have built.
      - name: Test
        env:
          GLOBAL: ${{ needs.changes.outputs.global }}
          INCLUDE_ARGS: ${{ needs.changes.outputs.include-args }}
          SHARD: ${{ matrix.shard }}
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args=\"-screen 0 1280x720x24\" sh -c '
            ulimit -n \"\$(ulimit -Hn)\" 2>/dev/null || true
            echo \"[ci] nofile soft=\$(ulimit -Sn) hard=\$(ulimit -Hn); shard \$SHARD/4\"
            if [ \"\$GLOBAL\" = \"true\" ] || [ -z \"\$GLOBAL\" ]; then
              gjsify foreach test -v --no-private --exclude \"@girs/*\" --exclude \"@gjsify/example-*\" --exclude \"@gjsify/website\" --shard \$SHARD/4
            else
              gjsify foreach test \$INCLUDE_ARGS --exclude \"@gjsify/integration-*\" --exclude \"@gjsify/example-*\" --shard \$SHARD/4
            fi
          '"

      - name: Test WebGL conformance
        if: ${{ matrix.shard == 1 && (needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || contains(needs.changes.outputs.include-args, '@gjsify/webgl')) }}
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args="-screen 0 1280x720x24" gjsify workspace @gjsify/webgl test:conformance'

  # ── Cross-runtime tests (Node + Bun + Deno) ─────────────────────────
  # Bun and Deno share the `node` runtime slot with Node via the Node-API common
  # ABI, which the runtime model ASSERTS. This job is where that assertion is
  # actually tested.
  #
  # Two payloads, one job (the container boot + install + cache restore is the
  # dominant cost, so splitting them would double it):
  #
  #   1. @gjsify/cli — host-runtime-aware: it runs under gjs, node, bun AND
  #      deno, and its DEFAULT `--app` target + `--runtime` follow the host, so
  #      its own suite must pass on all three. Bun/Deno self-fake
  #      `process.versions.node`, so the fixed `isNode()` detector (Bun/Deno
  #      probed first) is what keeps host-derived defaults correct there.
  #      (`test:gjs` is intentionally NOT run here: the gjs bundle builds, but
  #      the build-cache suite's file-hashing loop hangs under @gjsify/fs's
  #      readSync.)
  #
  #   2. $CROSS_RUNTIME_PACKAGES — the packages whose `--app node` bundle
  #      genuinely contains OUR code (see the workflow `env` block for why the
  #      set is not simply "every package with runtimes.node != none"). Same
  #      shape as the CLI: build ONE engine-agnostic bundle, run it three times.
  cross-runtime:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' && (needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || contains(needs.changes.outputs.include-args, '@gjsify/cli') || contains(needs.changes.outputs.include-args, '@gjsify/unit') || contains(needs.changes.outputs.include-args, '@gjsify/runtime') || contains(needs.changes.outputs.include-args, '@gjsify/adwaita-core') || contains(needs.changes.outputs.include-args, '@gjsify/storybook-core') || contains(needs.changes.outputs.include-args, '@gjsify/domparser') || contains(needs.changes.outputs.include-args, '@gjsify/webstorage') || contains(needs.changes.outputs.include-args, '@gjsify/semver') || contains(needs.changes.outputs.include-args, '@gjsify/workspace') || contains(needs.changes.outputs.include-args, '@gjsify/npm-registry') || contains(needs.changes.outputs.include-args, '@gjsify/tar') || contains(needs.changes.outputs.include-args, '@gjsify/create-app')) }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
    name: Cross-runtime (node+bun+deno) Fedora ${{ matrix.fedora.v }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    container:
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}
          # Boots dist/cli.gjs.mjs; ADR 0002 took it out of the checkout.
          bootstrap-bundles: 'true'
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify runtimes
        run: |
          gjs --version
          node --version
          bun --version
          deno --version
      # Build the CLI (refresh lib/ over the restored build cache) + the
      # engine-agnostic @gjsify/unit test bundle (dist/test.node.mjs) as
      # testuser, matching the other jobs' ownership model.
      - name: Build CLI + test bundle
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" sh -c '
            gjsify workspace @gjsify/cli build
            gjsify workspace @gjsify/cli build:test:node
          '"
      # Run the SAME bundle on all three Node-API runtimes. Executed as the
      # container user (root) directly from the CLI dir: the bundle is
      # self-contained + world-readable, and bun/deno land on PATH via the setup
      # actions (which the `su testuser` environment would drop). A non-zero exit
      # from @gjsify/unit fails the step.
      - name: Test CLI on Node
        run: cd packages/infra/cli && node dist/test.node.mjs
      - name: Test CLI on Bun
        run: cd packages/infra/cli && bun dist/test.node.mjs
      - name: Test CLI on Deno
        run: cd packages/infra/cli && deno run -A --no-lock --node-modules-dir=none dist/test.node.mjs

      # ── The package set ─────────────────────────────────────────────────
      # Build as testuser (matching every other build step's ownership model);
      # run as root so bun/deno stay on PATH, exactly as the CLI steps above.
      # The interpreter invocations here are byte-identical to the `test:node` /
      # `test:bun` / `test:deno` scripts each package declares — the scripts are
      # the contract for local runs, this loop is the CI driver.
      - name: Build package test bundles (--app node)
        run: |
          su testuser -c "PATH=\"\$PWD/node_modules/.bin:\$PATH\" sh -c '
            set -e
            for d in \$CROSS_RUNTIME_PACKAGES; do
              echo \"[ci] build:test:node \$d\"
              (cd \"\$d\" && gjsify run build:test:node)
            done
          '"
      - name: Test packages on Node
        run: |
          set -e
          for d in $CROSS_RUNTIME_PACKAGES; do
            echo "::group::node — $d"
            (cd "$d" && node test.node.mjs)
            echo "::endgroup::"
          done
      - name: Test packages on Bun
        run: |
          set -e
          for d in $CROSS_RUNTIME_PACKAGES; do
            echo "::group::bun — $d"
            (cd "$d" && bun test.node.mjs)
            echo "::endgroup::"
          done
      # `--node-modules-dir=none` keeps Deno from materialising a node_modules
      # tree next to the bundle; the bundle resolves nothing at runtime.
      # NOTE: `@gjsify/unit`'s `on('Node.js', …)` blocks do NOT run under Deno
      # (Deno is correctly detected as its own runtime and those suites are
      # counted as "ignored"). Only `@gjsify/tar` in this set has such a block —
      # 25 of its 27 cases run on Deno. Watch that count when adding a package:
      # a suite that is entirely `on('Node.js')`-wrapped would be vacuous here.
      - name: Test packages on Deno
        run: |
          set -e
          for d in $CROSS_RUNTIME_PACKAGES; do
            echo "::group::deno — $d"
            (cd "$d" && deno run -A --no-lock --node-modules-dir=none test.node.mjs)
            echo "::endgroup::"
          done

  # ── macOS: the GJS suite on Apple silicon ───────────────────────────
  # Until this job existed, every one of the ~10,000 test cases across 113 spec
  # files ran on Linux ONLY. The non-Linux legs elsewhere in the repo test other
  # things: node-gi.yml tests node-gi, napi.yml tests the N-API shim,
  # cli-cross-platform.yml runs four diagnostic steps. None of them execute a
  # `@gjsify/*` polyfill suite on macOS.
  #
  # This job does, for a curated subset (see $MACOS_TEST_PACKAGES in the
  # workflow `env` block for the set and the reason for each entry). It runs the
  # bundles the Fedora `build` job staged — the build cannot happen here, see
  # the "Stage GJS test bundles" step for why.
  #
  # Toolchain copied from napi.yml's `macos` job: Homebrew's `gjs` 1.88.x pulls
  # `spidermonkey` (mozjs-140) + glib/gobject-introspection transitively, which
  # is the same GJS/SM pairing the Fedora image ships, so a difference here is a
  # difference in the OS, not in the engine version.
  #
  # Cost: OFF on pull_request unless the PR is labelled `ci:macos` (macOS
  # runners bill at 10x). ON for push-to-main + the nightly sweep, where a red
  # is a signal rather than a merge blocker.
  macos:
    needs: [setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.setup.outputs.macos-enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        macos: ${{ fromJSON(needs.setup.outputs.macos-matrix) }}
    name: macOS ${{ matrix.macos.arch }} GJS suite (${{ matrix.macos.gjs }})
    runs-on: ${{ matrix.macos.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      # No `actions/checkout` — this job runs prebuilt, self-contained bundles
      # and needs nothing from the work tree. Skipping it keeps the billed
      # minutes down.
      - name: Install GJS + SpiderMonkey (mozjs-140) via Homebrew
        run: brew install gjs

      # dyld must be able to find `libgjs.0.dylib`. GJS's own `GjsPrivate`
      # typelib — which Gio's core override loads from `_init` — records the
      # library by BARE name, and Homebrew's `gjs` carries exactly one rpath,
      # `@loader_path/../../../../opt/glib/lib`, i.e. GLIB's keg and no other.
      # Without a repair, merely importing `Gio` can die with "Unsupported type
      # void, deriving from fundamental void" after a `Failed to load shared
      # library 'libgjs.0.dylib'` warning: the typelib loads, its shared library
      # does not, and the override then marshals a type that is no longer
      # resolvable.
      #
      # This used to write `DYLD_LIBRARY_PATH=$(brew --prefix)/lib` to
      # `$GITHUB_ENV`, WHICH CANNOT WORK. SIP strips every `DYLD_*` variable
      # when a protected binary is exec'd, and every `run:` step is
      # `/bin/bash -e {0}` — a protected binary. Measured on the darwin-x64 VM:
      # `DYLD_LIBRARY_PATH=x /bin/sh -c 'echo $DYLD_LIBRARY_PATH'` prints
      # nothing, while the same value through Homebrew's `node` survives. The
      # leg was green because these six bundles need only GLib/Gio/GioUnix,
      # which gjs's own rpath happens to reach — not because the variable was
      # doing anything. `macos-suites.yml` prints that measurement on every run.
      #
      # A symlink at the location the existing rpath already names needs no
      # variable and survives every shell boundary. (`LD_LIBRARY_PATH` is not
      # the same asymmetry: dyld ignores the ELF variable entirely, which is
      # what `buildNativeEnv()` handles for our own prebuilds by setting
      # `DYLD_FALLBACK_LIBRARY_PATH` on the CHILD's launch env — a hop where it
      # is not stripped, because `gjs` is not a protected binary.)
      - name: Make libgjs resolvable without a DYLD_ variable
        run: |
          prefix="$(brew --prefix)"
          ln -sfn "$prefix/opt/gjs/lib/libgjs.0.dylib" "$prefix/opt/glib/lib/libgjs.0.dylib"
          ls -l "$prefix/opt/glib/lib/libgjs.0.dylib"

      # Fail LOUDLY and early if the host is missing something the bundles
      # import, instead of letting it surface as a confusing suite failure. The
      # `--app gjs` bundles in this set externalise exactly three specifiers:
      # gi://GLib, gi://Gio and gi://GioUnix (all version 2.0).
      - name: Verify gjs + the GLib/Gio/GioUnix typelibs
        run: |
          gjs --version
          gjs -c 'const {GLib, Gio, GioUnix} = imports.gi; void Gio; void GioUnix; print("GLib " + GLib.MAJOR_VERSION + "." + GLib.MINOR_VERSION + "." + GLib.MICRO_VERSION + " — Gio + GioUnix typelibs load OK");'

      # `pattern` + `merge-multiple` so this stays correct if the Fedora axis
      # ever grows a second leg (the bundles are identical builds).
      - name: Download the staged GJS test bundles
        uses: actions/download-artifact@v8
        with:
          pattern: gjs-test-bundles-fedora*
          merge-multiple: true
          path: bundles

      # The gate. Every bundle runs even if an earlier one fails, so one red
      # package does not hide the state of the rest.
      - name: Run the GJS test suites
        run: |
          status=0
          for f in bundles/gate/*.test.gjs.mjs; do
            echo "::group::$(basename "$f")"
            gjs -m "$f" || { status=1; echo "::error title=macOS GJS suite::$(basename "$f") failed"; }
            echo "::endgroup::"
          done
          exit $status


  # ── E2E tests ───────────────────────────────────────────────────────
  # Exercises the CLI end-to-end (install, build, dlx, publish, …) in its own
  # parallel job. Downloads the example dist the build job produced (its
  # lint-engines suite asserts every example has built output). Gated when an
  # `e2e` path was touched OR on a full run.
  e2e:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' && (needs.changes.outputs.run-e2e == 'true' || needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '') }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
        shard: [1, 2, 3, 4]
    name: E2E ${{ matrix.shard }}/4 Fedora ${{ matrix.fedora.v }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    container:
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}
          # Boots dist/cli.gjs.mjs; ADR 0002 took it out of the checkout.
          bootstrap-bundles: 'true'
      # Only shard 1 runs lint-engines (the suite that asserts example dist),
      # so only it needs the artifact — skip the download on the other shards.
      - name: Download example build output
        if: ${{ matrix.shard == 1 }}
        uses: actions/download-artifact@v8
        with:
          name: example-dist-fedora${{ matrix.fedora.v }}
      - name: Fix example dist ownership for testuser
        if: ${{ matrix.shard == 1 }}
        run: chown -R testuser:testuser showcases examples
      - name: E2E tests (shard ${{ matrix.shard }}/4)
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" node scripts/e2e-shard.mjs ${{ matrix.shard }} 4'

  # ── build:infra on a cold tree with NO node ──────────────────────────
  #
  # WHAT IS ALREADY COVERED, so this job says only what that one cannot. The
  # `build` job's "Bootstrap the build toolchain (cold trees only)" step does run
  # `build:infra` under gjs on a cold build-output cache. It differs in exactly
  # one dimension, and that dimension is the whole defect: `node` is on PATH
  # there, so a package script's `node scripts/x.mjs` runs NATIVELY and is never
  # bundled for GJS. The re-entry through `gjsify run --node-script` — where the
  # `@gjsify/*` substitutions and every `--globals auto` register subpath have to
  # RESOLVE against a tree that has not been built — was unreachable from CI.
  #
  # That is how it stayed broken: `build:infra` failed on a cold clone for a
  # Node-less contributor, `open-todos.md` recorded the opposite as measured
  # (the measurement deleted the two native facades, which leaves every
  # workspace `lib/esm` in place — not the cold case it reads as), and the same
  # failure blocked `check-refs-pin.mjs`, so `build:prebuilds` could not start
  # either.
  #
  # WHY A CLONE AND NOT `git clean`. This checkout is warm by now: the setup
  # composite restores `node_modules` AND the build-output cache. Cleaning it
  # would destroy what the rest of the job graph depends on; a clone costs a
  # hardlinked object store.
  #
  # WHY node_modules IS COPIED RATHER THAN INSTALLED. A cold clone is defined by
  # having no `lib/esm`, NOT by having no dependencies — a real contributor runs
  # `gjsify install` first, which is a ~2 GB extract this job has no reason to
  # repeat. The workspace symlinks are RELATIVE (`../../packages/node/fs`), so a
  # copy re-points them at the clone's own unbuilt packages, which is precisely
  # the shape under test. `.cache` is dropped because it carries the build cache,
  # and restoring that would hand the clone the outputs it must not have.
  #
  # A REAL COPY, not `cp -al`. Hardlinks were the first attempt and are wrong
  # twice over: `/tmp` and the workspace are different filesystems in this
  # container, so it fails outright with `Invalid cross-device link` (measured) —
  # and even where it works, every file the build writes THROUGH a link would
  # mutate the checkout's own `node_modules`, which the post-job `actions/cache`
  # step then saves. A silent cache poisoned by a test tree is a worse bug than
  # the seconds a local copy costs. The clone lives under `RUNNER_TEMP` for the
  # same filesystem reason, so nothing here depends on `/tmp`'s mount.
  #
  # WHY `node` IS MOVED ASIDE RATHER THAN FAKED. The first version put a `node`
  # on PATH that exits 127 and announces itself — the technique
  # `workspace-node-free-gjs` uses — and it DEFEATED the mechanism under test.
  # `writeNodeShim` installs the `node` that re-enters `gjsify run --node-script`
  # only when `resolveBinOnPath('node')` finds nothing ("a real Node is present —
  # leave it alone"), so a fake is indistinguishable from the real thing: gjsify
  # declined to install its shim, the package script called the fake, and the run
  # died with `FAKE node CALLED` — measured. A Node-less host is one where `node`
  # resolves NOWHERE, so this makes that literally true for the duration of the
  # step and restores it in a trap. The precondition is asserted before the build
  # runs, because a `node` that survived would silently turn this job back into a
  # duplicate of the `build` job's own cold-tree step.
  cold-bootstrap:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
    name: Cold-tree build:infra, no node (Fedora ${{ matrix.fedora.v }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    container:
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}
          # The CLI bundle THIS tree's build job produced. Deliberately not the
          # published one `install.mjs` fetches: the question a PR must answer is
          # whether its own source bootstraps a cold clone.
          bootstrap-bundles: 'true'
      - name: build:infra on a cold clone, with node absent
        shell: bash
        run: |
          set -euo pipefail
          CLI="$PWD/packages/infra/cli/dist/cli.gjs.mjs"
          test -f "$CLI" || { echo "::error::$CLI missing — the build job must publish it"; exit 1; }

          COLD="${RUNNER_TEMP:-/tmp}/cold-tree"
          rm -rf "$COLD"
          git config --global --add safe.directory '*'
          # Explicit SHA: `actions/checkout` leaves a DETACHED head, which a
          # branch-following clone cannot reproduce.
          SHA="$(git rev-parse HEAD)"
          git clone --no-checkout "$PWD" "$COLD"
          git -C "$COLD" checkout --detach "$SHA"
          cp -a node_modules "$COLD/node_modules"
          rm -rf "$COLD/node_modules/.cache"

          # Assert the premise instead of assuming it. A warm clone would make
          # this job green while testing nothing, which is the failure mode the
          # job exists to remove.
          if find "$COLD/packages" -maxdepth 4 -type d -path '*/lib/esm' | grep -q .; then
            echo "::error::the clone is not cold — lib/esm present"; exit 1
          fi
          test -e "$COLD/node_modules/@gjsify/cli" || { echo "::error::node_modules did not come across"; exit 1; }

          # Make this a Node-less host for real. Restored in a trap, so a failure
          # inside the build cannot leave the container without an interpreter
          # the post-job steps might want.
          HIDDEN=""
          for p in $(type -aP node npm npx 2>/dev/null || true); do
            if mv "$p" "$p.gjsify-hidden" 2>/dev/null; then HIDDEN="$HIDDEN $p"; fi
          done
          restore_node() {
            for p in $HIDDEN; do
              [ -e "$p.gjsify-hidden" ] && mv "$p.gjsify-hidden" "$p" || true
            done
          }
          trap restore_node EXIT

          if su testuser -c 'command -v node' >/dev/null 2>&1; then
            echo "::error::node is still reachable — writeNodeShim would decline and this job would test nothing"
            exit 1
          fi

          chown -R testuser:testuser "$COLD"
          su testuser -c "cd '$COLD' && XDG_CACHE_HOME='$COLD/.gjsify-cache' gjs -m '$CLI' run build:infra"

  # ── Integration suites (curated upstream tests) ─────────────────────
  # The suites under `tests/integration/` run real upstream test bodies against
  # `@gjsify/*`. They are the largest regression net this repo owns, and until
  # this job existed no event ran a single one of them: every mention in every
  # workflow was an `--exclude`. The classifier half was already built and
  # wired to nothing — `changes` has emitted `run-integration` all along and
  # its only consumer was a line in the step summary.
  #
  # WHY AN ALLOWLIST, AND WHY THESE
  #
  # Not all of them pass, so gating all of them would gate red. Every suite was
  # run individually in this same container image, and the list below is the
  # set that came back green WITH assertions actually executed. The rest stay
  # out and carry their measured cause in `status/integration-coverage.md`;
  # each returns here in the commit that makes it green, one cause per commit.
  #
  # A suite blocked on a MISSING IMAGE PACKAGE returns one merge later than the
  # commit that bakes it, and that is not slack. `build-ci-image.yml` pushes
  # `ghcr.io/gjsify/ci-fedora:<major>` on a push to main and deliberately never
  # pushes from a pull request (a fork PR's token cannot authenticate to GHCR),
  # while the `container:` below resolves the MUTABLE tag at job start. So adding
  # the package and the `--include` in one commit runs the suite against the image
  # from before the package: red on its own PR, then red on main. `openssl` for
  # `@gjsify/integration-tls-session` is the open instance — see that suite's note.
  #
  # The list is spelled out rather than globbed on purpose. `gjsify foreach`
  # makes an `--include` PATTERN matching zero workspaces a hard error, so a
  # renamed or deleted suite fails this job loudly — where a glob would quietly
  # shrink the set and stay green.
  #
  # `devtools-cdp` is NOT here although it exits 0. Its entire run is one test
  # reading `skipped — no reachable inspector`: it needs a live WebKit remote
  # inspector and self-skips without one. Exit code and assertion count
  # disagree there, and the assertion count is the one that means something —
  # listing it would add a permanently green check that verifies nothing.
  #
  # To reproduce exactly what this job runs, from the repo root:
  #   gjsify foreach test -tv --include @gjsify/integration-acorn …
  # `gjsify run test:integration` answers a DIFFERENT question — every suite,
  # opt-in, including the ones known to fail.
  integration:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' && (needs.changes.outputs.run-integration == 'true' || needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '') }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
    name: Integration suites Fedora ${{ matrix.fedora.v }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    container:
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}
          # Each suite's `test` script drives the CHECKOUT's cli through the
          # `.bin` shim, which dispatches to `dist/cli.gjs.mjs`; ADR 0002 took
          # that out of the checkout, so it arrives as the build artifact.
          bootstrap-bundles: 'true'
      - name: Integration suites (the measured-green set)
        run: >
          su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify foreach test -tv
          --include @gjsify/integration-acorn
          --include @gjsify/integration-chokidar
          --include @gjsify/integration-cosmiconfig
          --include @gjsify/integration-deepkit-type-compiler
          --include @gjsify/integration-deltachat
          --include @gjsify/integration-domparser
          --include @gjsify/integration-dotenv
          --include @gjsify/integration-execa
          --include @gjsify/integration-fast-glob
          --include @gjsify/integration-gettext-parser
          --include @gjsify/integration-lightningcss
          --include @gjsify/integration-loro-crdt
          --include @gjsify/integration-minify-xml
          --include @gjsify/integration-oxfmt-native
          --include @gjsify/integration-pkg-types
          --include @gjsify/integration-rolldown-native
          --include @gjsify/integration-rollup-pluginutils
          --include @gjsify/integration-streamx
          --include @gjsify/integration-typescript-tsc
          --include @gjsify/integration-worker-stress
          --include @gjsify/integration-yargs
          --include @gjsify/integration-yjs'

  # ── Examples (test) ─────────────────────────────────────────────────
  # Runs the example/showcase test suites against the dist the build job
  # produced (downloaded as an artifact — examples can't be rebuilt off a
  # cache-only state). Gated when an example/showcase is in the closure (or a
  # full run).
  examples:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' && (needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || contains(needs.changes.outputs.include-args, '@gjsify/example-')) }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
    name: Examples Fedora ${{ matrix.fedora.v }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    container:
      image: ghcr.io/gjsify/ci-fedora:${{ matrix.fedora.v }}
      options: --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ matrix.fedora.v }}
          # Boots dist/cli.gjs.mjs; ADR 0002 took it out of the checkout.
          bootstrap-bundles: 'true'
      - name: Download example build output
        uses: actions/download-artifact@v8
        with:
          name: example-dist-fedora${{ matrix.fedora.v }}
      - name: Fix example dist ownership for testuser
        run: chown -R testuser:testuser showcases examples
      - name: Test CLI examples
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run test:examples'
      - name: Test net examples
        run: su testuser -c 'PATH="$PWD/node_modules/.bin:$PATH" gjsify run test:examples:net'

      # The showcase matrix's gjs column (#999). `gjsify.example.runtimes` is a
      # per-showcase promise — "this showcase ships an artifact for this runtime
      # and it runs there" — and until this step nothing in CI launched one. The
      # two steps above cover `@gjsify/example-node-cli-*` and `-net-*` only, and
      # the closest thing to a showcase check, `verify-package-outputs.mjs
      # --scope examples`, holds the declaration to a FILE EXISTING: a bundle
      # that exists and dies on its first `gi://` import passes it completely.
      #
      # ONE `xvfb-run` around the WHOLE script, never around the individual
      # showcases. Fedora's xvfb-run ends in `DISPLAY=:N XAUTHORITY=… "$@" 2>&1`,
      # so anything launched THROUGH it has no separate stderr — and stderr is
      # where the gate reads GJS's `JS ERROR` / unhandled-rejection markers, the
      # only evidence of a throw inside a GLib callback (the process survives it
      # and still exits 0). Wrapping per showcase made every captured stderr
      # empty and the gate green on a crash. `dbus-run-session` gives
      # GApplication a private bus; the GSK/GL/a11y vars keep GTK on the software
      # path a display-less runner can provide — the same set as node-gi.yml's
      # GTK legs.
      - name: Smoke-launch the showcases (gjs column)
        run: su testuser -c 'LIBGL_ALWAYS_SOFTWARE=1 GSK_RENDERER=cairo GDK_BACKEND=x11 GTK_A11Y=none xvfb-run -a --server-args="-screen 0 1280x720x24" dbus-run-session -- node scripts/showcase-smoke.mjs'

  # ── Browser tests (Playwright / Firefox) ────────────────────────────
  # The THIRD test axis, alongside `test:gjs` (the `test` job) and `test:node`
  # (`cross-runtime`). Until this job existed it was documented in AGENTS.md and
  # implemented in `tests/browser/` + 50-odd `src/test.browser.mts` entries, but
  # NO workflow ran it — so every `src/browser.ts` in the repo was unverified by
  # construction, which is exactly how a `validateHeaderName` with an empty
  # function body survived in `@gjsify/http`.
  #
  # Why NOT the Fedora container every other job uses: Playwright's dependency
  # installer (`playwright install --with-deps`) supports Debian/Ubuntu only, so
  # a Fedora-hosted run would need a hand-curated `dnf` list that silently drifts
  # on every Playwright bump — the same class of unverified-by-construction
  # problem this job exists to remove. Running on plain `ubuntu-latest` lets
  # Playwright own its own dependency set. The GJS toolchain is not needed here:
  # the `build` job already produced the bundles (see "Stage browser test bundles
  # for the Playwright leg"), and `--app browser` output is a single
  # self-contained ESM file.
  #
  # Firefox is the ONLY browser installed. It is the primary target because
  # Firefox and GJS share SpiderMonkey, so the suite validates the same engine
  # our GJS implementations claim to match. `playwright.config.ts` still declares
  # a `chromium` project for local `--project=chromium` engine-diff runs; CI does
  # not pay for that download.
  browser:
    needs: [changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' && (needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '' || needs.changes.outputs.include-args != '') }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ fromJSON(needs.setup.outputs.fedora-matrix) }}
    name: Browser (Playwright/Firefox) Fedora ${{ matrix.fedora.v }} bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x

      # `pattern` + `merge-multiple` so this stays correct if the Fedora axis
      # ever grows a second leg (the bundles are identical builds). Unpacked at
      # the repo root: the staging dir mirrors `packages/<pillar>/<pkg>/dist/`,
      # which is both where `discover-bundles.mjs` looks and what the harness
      # http-server serves.
      - name: Download the staged browser test bundles
        uses: actions/download-artifact@v8
        with:
          pattern: browser-test-bundles-fedora*
          merge-multiple: true
          path: .

      - name: Report the bundle set
        id: bundles
        run: |
          set -e
          COUNT=$(find packages -name test.browser.mjs -path '*/dist/*' 2>/dev/null | wc -l | tr -d '[:space:]')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "[ci] $COUNT browser test bundle(s) received"
          find packages -name test.browser.mjs -path '*/dist/*' 2>/dev/null | sort
          if [ "$COUNT" = "0" ]; then
            echo "::notice title=Browser tests::No browser-capable package in the affected closure — nothing to run."
          fi

      # Only the Playwright runner + the static server are installed, straight
      # from `tests/browser/package.json`, INSIDE `tests/browser` (npm keeps a
      # workspace-member install local, so the workspace root is untouched and no
      # ~2 GB `gjsify install` is paid for a leaf harness). `--ignore-scripts`
      # skips @playwright/test's postinstall, which would download all three
      # browser engines; the explicit `playwright install firefox` below fetches
      # only the one we run.
      - name: Install the Playwright runner
        if: ${{ steps.bundles.outputs.count != '0' }}
        working-directory: tests/browser
        run: npm install --no-save --no-package-lock --no-workspaces --ignore-scripts

      - name: Cache the Playwright browser download
        if: ${{ steps.bundles.outputs.count != '0' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('tests/browser/package.json') }}
          restore-keys: |
            playwright-firefox-${{ runner.os }}-

      - name: Install Firefox
        if: ${{ steps.bundles.outputs.count != '0' }}
        working-directory: tests/browser
        run: npx playwright install --with-deps firefox

      # The gate. `--pass-with-no-tests` covers ONE emptiness: `--grep-invert` removing
      # every staged bundle because all of them are probe-listed. An empty bundle SET
      # never gets here — the `if:` below skips the step at count 0.
      #
      # WHAT THIS GATE CANNOT SEE — read it before treating a green run as coverage.
      # It is bounded by the bundle SET, and the set is a `find` over what the `build`
      # job staged. So:
      #   · a package that stops declaring `build:test:browser` AND stops shipping
      #     `src/test.browser.mts` leaves `discoverBuildablePackages`, no build is
      #     attempted, and the count simply gets smaller. Dropping only ONE of the two
      #     is red — `check-browser-test-registration.mjs` holds the pairing — and so is
      #     a build that exits 0 writing no bundle, which `build-bundles.mjs` asserts;
      #   · a package ledgered in `$BROWSER_KNOWN_BROKEN_BUILDS` fails its build without
      #     failing the `build` job, so it is absent here by design;
      #   · at count 0 every step here is skipped and the job is green having run
      #     nothing, which is also the correct outcome for a selective closure — the two
      #     are indistinguishable from the outside;
      #   · a bundle named in `$BROWSER_PROBE_GREP` is grep-inverted OUT of this
      #     invocation, so the `results.total > 0` floor is ADVISORY for it: it only
      #     executes inside the `continue-on-error` probe below. `@gjsify/events` is
      #     covered by neither arm — it delegates to the shared entry, where the static
      #     check demands one namespace and no particular suite.
      # The spec-level floor (`results.total > 0` in `tests/browser/specs/unit.spec.ts`)
      # closes the case where a bundle IS staged and registers nothing; the static
      # `check-browser-test-registration.mjs` in the required audit job closes the case
      # where a browser-only package's spec file exists but was never registered. Neither
      # can speak for a bundle that is not here.
      - name: Run the browser test suite
        if: ${{ steps.bundles.outputs.count != '0' }}
        working-directory: tests/browser
        run: npx playwright test --project=firefox --reporter=list --pass-with-no-tests --grep-invert "$BROWSER_PROBE_GREP"

      # NON-GATING probe over the ledgered failures in $BROWSER_PROBE_GREP.
      # Answers "is that still broken?" on every run without reddening main.
      # Delete an entry from the ledger the moment its package goes green.
      - name: Probe the known-red browser bundles (not a gate)
        if: ${{ steps.bundles.outputs.count != '0' }}
        continue-on-error: true
        working-directory: tests/browser
        run: |
          if npx playwright test --project=firefox --reporter=list --pass-with-no-tests --grep "$BROWSER_PROBE_GREP"; then
            echo "::notice title=Browser probe::every ledgered bundle passed — drop it from BROWSER_PROBE_GREP in main.yml"
          else
            echo "::warning title=Browser probe::a ledgered bundle still fails — expected while its entry is in BROWSER_PROBE_GREP"
            exit 1
          fi

      - name: Upload the Playwright report
        if: ${{ failure() && steps.bundles.outputs.count != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-fedora${{ matrix.fedora.v }}
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          retention-days: 7
          if-no-files-found: ignore

  # ── Ship: assemble here, pack there (ADR 0024 § A1–A2) ──────────────
  #
  # Two jobs because the design is two phases. `--stage` assembles a payload on
  # a host that has the toolchain; the finish phase packs it on the host that
  # owns the FORMAT. Splitting them in CI is the only way to find out whether
  # the handoff actually carries everything — a single-process `gjsify ship`
  # cannot tell a value it computed from a value it received.
  #
  # WHY A BARE `ubuntu-latest` FOR THE PACK HALF, with no `container:`.
  # `status/open-todos.md` § `gjsify ship` item 8: **`dpkg` is on no CI runner
  # this project uses**, so the `.deb` this repo writes by hand has never been
  # read by a real `dpkg`. The Fedora image every other job runs in cannot fix
  # that — `dpkg-deb` does not exist there, which is the reason the packers are
  # hand-written in the first place (`packages/infra/cli/AGENTS.md`). An Ubuntu
  # runner ships `dpkg`/`dpkg-deb` natively AND can `docker run --rm fedora:44`
  # for `rpm`, so ONE free runner closes both halves. The `docker run`
  # precedent, incl. the pull-retry, is `prebuilds.yml`'s emulated-build leg.
  #
  # WHAT THIS LEG DOES NOT CHECK — read it before treating green as coverage.
  # The subject is `packages/infra/cli`, the only in-tree package that declares
  # `gjsify.ship` and the one `release-cut.yml` ships on every cut. It resolves
  # to `kind: 'cli'`, so `cacheRefreshCommands()` returns nothing and the `.deb`
  # carries NO `postinst`/`postrm` at all: maintainer scripts, the desktop
  # entry, the icon cache and `glib-compile-schemas` are all unexercised here.
  # Closing that needs a `kind: 'app'` subject — `tests/e2e/ship/run.mjs`'s
  # `scaffold()` is one, once it is lifted into a `fixture.mjs` both callers can
  # import (a second copy of it here would be the exact duplication AGENTS.md
  # names). Tracked in `status/open-todos.md`.
  ship-stage:
    needs: [changes, setup, build]
    # The same gate `e2e` carries, and it is safe for this leg specifically:
    # every path that can change ship behaviour is a GLOBAL trigger in
    # `affected-classify.ts` — `^packages/infra/cli/` (all of `utils/ship/**`),
    # `^\.github/workflows/main\.yml$` (this file), and an unmatched path such
    # as `.github/ship-oracle/**` falls through to the full-run bail-out. So the
    # leg cannot skip on the PR that changes it, which is the #1183 class this
    # workflow already paid for once (`tree-checks`' header).
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.skip-all != 'true' && (needs.changes.outputs.run-e2e == 'true' || needs.changes.outputs.global == 'true' || needs.changes.outputs.global == '') }}
    name: Ship stage (assemble)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    container:
      # One Fedora leg, not the matrix: the stage is platform-neutral JS plus a
      # `/bin/sh` launcher, identical on every leg. Same reduction `tree-checks`
      # makes, for the same reason.
      image: ghcr.io/gjsify/ci-fedora:${{ fromJSON(needs.setup.outputs.fedora-matrix)[0].v }}
      options: --ulimit nofile=1048576:1048576
    outputs:
      # The floor the pack job checks its artifacts against. DERIVED from the
      # tree this job just wrote — there is no file count written down anywhere,
      # because a written-down count is a second copy that drifts and then lies.
      staged-count: ${{ steps.handover.outputs.staged-count }}
      # The same number for the darwin tree, which is a DIFFERENT payload and not
      # a second layout of the first — see the step that stages it.
      staged-count-darwin: ${{ steps.handover-darwin.outputs.staged-count-darwin }}
    env:
      # ONE definition, read by the run blocks AND by the upload's `path:`
      # (`env` is available in `steps[*].with`). A second literal would be the
      # copy that drifts, and the one it drifts from is the upload.
      SHIP_STAGE: packages/infra/cli/ship/stage
      # The darwin half, as two values rather than one: the project is where the
      # command is run and the stage is what the upload takes, and spelling the
      # second as a suffix of the first would make an `--out` change silently
      # upload the wrong directory.
      SHIP_STAGE_DARWIN_PROJECT: tests/e2e/ship-macos/fixtures/dmg-app
      SHIP_STAGE_DARWIN: tests/e2e/ship-macos/fixtures/dmg-app/ship/stage
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/gjsify-setup
        with:
          fedora-version: ${{ fromJSON(needs.setup.outputs.fedora-matrix)[0].v }}
          # BOTH the tool and the payload. `gjsify.ship.bundle` for this package
          # is `dist/cli.gjs.mjs`, which ADR 0002 untracked — so the artifact
          # the `build` job publishes is the only copy this checkout can have,
          # and it is THIS commit's bundle rather than the published bootstrap.
          bootstrap-bundles: 'true'

      # `gjs -m dist/cli.gjs.mjs`, not `node_modules/.bin/gjsify`: the shim
      # prefers an on-disk `dist/cli.gjs.mjs` anyway (packages/infra/cli/AGENTS.md),
      # and naming the file makes it unambiguous WHICH bundle staged the payload.
      # `--skip-build` because `build` already produced it; rebuilding here would
      # stage a bundle nothing else in this run has seen.
      - name: Stage the payload, pack nothing
        run: su testuser -c "cd packages/infra/cli && gjs -m dist/cli.gjs.mjs ship --stage --skip-build --verbose"

      # HAZARD 2, asserted on the PRODUCING side because that is the only side
      # where the truth still exists. `actions/upload-artifact` FOLLOWS symlinks
      # rather than preserving them — measured in `docs/node-gi-platform-notes.md`,
      # where 859 links under `share/icons/Adwaita` were copied as links, the
      # artifact "looked complete" because the store dereferenced them, and
      # `npm pack` (which does not) shipped 0.2 MiB where 22 MB was intended.
      # `writeStage()` only ever calls `writeFileSync`, so a link in the stage is
      # already a bug; this makes it a LOUD bug here instead of a silent
      # difference between the two hosts.
      # NOTE ON WHAT THIS CAN AND CANNOT CATCH: today it cannot go red.
      # `writeStage()` materialises every file with `writeFileSync`, and the
      # discovery feeding it already throws on a symlink (`discover.ts`), so a
      # link in the stage is unreachable without rewriting the stager to
      # `cpSync`. It is kept as a forward guard for exactly that change — not as
      # evidence that the current stager is link-free, which is proven upstream.
      - name: The stage is regular files only
        run: |
          set -euo pipefail
          links=$(find "$SHIP_STAGE" -type l -print)
          if [ -n "$links" ]; then
            echo "::error title=Ship stage::the staged tree contains symlinks. actions/upload-artifact FOLLOWS them, so the pack host would receive dereferenced copies and the artifact would differ from what was staged, with nothing to notice."
            echo "$links"
            exit 1
          fi
          echo "no symlinks in the stage"

      # The handover measurement, printed rather than assumed. The mode column
      # is the interesting one: it is 0755 HERE and will not be 0755 on the pack
      # host (HAZARD 1), which is exactly why `readStage()` takes modes from the
      # PLAN and the plan travels inside `.gjsify-ship-stage.json`.
      - name: Record what is being handed over
        id: handover
        run: |
          set -euo pipefail
          if [ ! -f "$SHIP_STAGE/.gjsify-ship-stage.json" ]; then
            echo "::error title=Ship stage::\`--stage\` wrote no .gjsify-ship-stage.json at the stage root. Phase 2 has no closure to pack from (ADR 0024 § A2) and MUST refuse rather than re-derive."
            exit 1
          fi
          count=$(find "$SHIP_STAGE" -type f ! -name .gjsify-ship-stage.json | wc -l | tr -d '[:space:]')
          if [ "$count" -eq 0 ]; then
            echo "::error title=Ship stage::the stage holds only the sidecar. A payload-free stage packs into a valid, empty .deb that every structural reader accepts."
            exit 1
          fi
          echo "staged-count=$count" >> "$GITHUB_OUTPUT"
          echo "staged payload: $count file(s)"
          find "$SHIP_STAGE" -type f -printf '  %m %10s %P\n' | sort

      # HAZARD 3 and the LCA rule, both settled by the shape of this ONE upload.
      #
      #   * `upload-artifact` with a DIRECTORY `path:` uploads the directory's
      #     CONTENTS. Measured on the v0.26.1 publish (`release.yml`'s node-gi
      #     staging comment): four legs went green, four artifacts downloaded,
      #     and the staging assertion then found not one file where it looked.
      #     Harmless here because the download below names an explicit
      #     destination directory, so "contents" land back under a name we chose.
      #   * The archive is rooted at the LEAST COMMON ANCESTOR of the paths given
      #     (`.github/actions/gjsify-setup/action.yml` states it). ONE path
      #     entry, so the LCA is that directory and cannot move under us.
      #   * ONE artifact, never `pattern:` + `merge-multiple:`. That combination
      #     IS the v0.26.1 incident.
      #
      # `include-hidden-files: true` is load-bearing and appears nowhere else in
      # this repo: `upload-artifact` has EXCLUDED dotfiles by default since v4,
      # and the sidecar is `.gjsify-ship-stage.json`. Without it the upload
      # succeeds, `if-no-files-found: error` stays quiet, and the closure the
      # whole design rests on simply is not in the archive. The pack job asserts
      # its arrival anyway — the flag is the fix, the assertion is the check.
      #
      # `retention-days: 1`: this is an intra-run transport, and a ship stage is
      # re-derivable from the tag it was cut at. Same value the other three
      # intra-run transports in this file carry.
      - name: Upload the stage
        uses: actions/upload-artifact@v7
        with:
          name: ship-stage-linux-x64
          path: ${{ env.SHIP_STAGE }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # ── #1354 M4: the payload the `.dmg` is built around ──────────────────
      #
      # A SECOND STAGE OUT OF THIS ONE JOB, and a second FIXTURE rather than a
      # second layout of the one above. `packages/infra/cli` is
      # `gjsify.app: "gjs"`, and every macOS row is `interpreters: ['node']`
      # because there is no relocatable GJS to put inside a bundle a stranger
      # downloads (ADR 0024 § 4) — so `assertFormatCanRunInterpreter` refuses the
      # project the linux half stages. The darwin half needs a `--app node` one.
      #
      # AND IT HAS TO STAGE WITH `--skip-build`, for the same reason the linux
      # half passes that flag: this job's subject is the STAGER, so a bundler run
      # in front of it is one more thing that can fail in a job that is not about
      # bundling. `tests/e2e/ship-macos/fixtures/dmg-app` is built for that — its
      # "bundle" is a hand-written source file and it has no build step at all.
      #
      # WHY THE SMALL FIXTURE IS ENOUGH, and where the big one is. `window-app`
      # beside it carries a Node interpreter and a relocated GTK closure and
      # OPENS A WINDOW on a Mac, in `node-gi.yml`'s `macos-app-selfcontained`
      # leg. What the `.dmg` legs measure is the CONTAINER around a `<App>.app`,
      # and `tests/e2e/ship-macos` asserts the staged tree is byte-identical
      # across all three macOS containers — which is what lets the cheap payload
      # stand for the expensive one here, and is also why this leg must never be
      # read as a claim that the bundle inside the image runs.
      #
      # `--arch arm64` because `macos-latest` is Apple silicon and `macosArch`
      # never collapses an architecture to `all`: the label is in the artifact's
      # name, so the pack leg has to be the runner that name claims.
      - name: Stage the darwin payload a .dmg is built around
        run: su testuser -c "cd $SHIP_STAGE_DARWIN_PROJECT && gjs -m '$GITHUB_WORKSPACE/packages/infra/cli/dist/cli.gjs.mjs' ship darwin --arch arm64 --skip-build --stage --target macos-app-dmg --verbose"

      # The same handover measurement the linux half makes, and it is not
      # ceremony: the count travels to the pack job as an output, so "the artifact
      # store lost a file" is caught there against a number derived here rather
      # than against one written down somewhere.
      - name: Record what is being handed over to the Mac
        id: handover-darwin
        run: |
          set -euo pipefail
          if [ ! -f "$SHIP_STAGE_DARWIN/.gjsify-ship-stage.json" ]; then
            echo "::error title=Ship stage::the darwin --stage wrote no .gjsify-ship-stage.json at the stage root. Phase 2 has no closure to pack from (ADR 0024 § A2) and MUST refuse rather than re-derive."
            exit 1
          fi
          count=$(find "$SHIP_STAGE_DARWIN" -type f ! -name .gjsify-ship-stage.json | wc -l | tr -d '[:space:]')
          if [ "$count" -eq 0 ]; then
            echo "::error title=Ship stage::the darwin stage holds only the sidecar. hdiutil would build a valid image over an empty volume, and the Finder shows one of those as a window with nothing in it."
            exit 1
          fi
          # The OVERLAY, asserted on the producing side. `planOverlay` runs where
          # the project is; `--from-stage` rehydrates rather than plans, so a
          # sidecar without this key reaches the Mac and is refused there by
          # `assertOverlayIsLicensed` — in a job with no LICENSE and no project in
          # reach to fix it.
          python3 -c "import json,sys;m=json.load(open(sys.argv[1]));sys.exit(0 if m['overlay'].get('macos-app-dmg') else 1)" \
            "$SHIP_STAGE_DARWIN/.gjsify-ship-stage.json" || {
            echo "::error title=Ship stage::the darwin sidecar carries no overlay.macos-app-dmg, so the image would ship no licence file and nothing downstream would say so."
            exit 1
          }
          echo "staged-count-darwin=$count" >> "$GITHUB_OUTPUT"
          echo "staged darwin payload: $count file(s)"
          find "$SHIP_STAGE_DARWIN" -type f -printf '  %m %10s %P\n' | sort

      # `include-hidden-files` for the sidecar, `if-no-files-found: error` for an
      # empty upload — the same two flags and the same two reasons as the linux
      # stage above. The modes in the listing printed by the step before this one
      # will NOT survive this upload; that is expected, and `readStage` takes
      # every mode from the plan inside the sidecar for exactly that reason.
      - name: Upload the darwin stage
        uses: actions/upload-artifact@v7
        with:
          name: ship-stage-darwin-arm64
          path: ${{ env.SHIP_STAGE_DARWIN }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # The readers travel as an artifact so the pack job needs NO CHECKOUT —
      # see its header for why that is the point and not an optimisation.
      - name: Upload the artifact readers
        uses: actions/upload-artifact@v7
        with:
          name: ship-oracle
          path: .github/ship-oracle
          retention-days: 1
          if-no-files-found: error

  ship-pack-linux:
    # `setup` for the Fedora version in the bundle artifact's name; `ship-stage`
    # for the stage itself. `build` and `changes` are reached through ship-stage,
    # and listing them again would only make this job wait on them twice.
    needs: [setup, ship-stage]
    if: ${{ always() && needs.ship-stage.result == 'success' }}
    name: Ship pack + install (bare ubuntu, real dpkg)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      STAGE_DIR: incoming/stage
      ARTIFACTS: artifacts
      STAGED_COUNT: ${{ needs.ship-stage.outputs.staged-count }}
    steps:
      # THERE IS DELIBERATELY NO `actions/checkout` IN THIS JOB.
      #
      # The failure this leg exists to catch is a pack phase that quietly
      # re-derives what it was supposed to receive: `commands/ship.ts` computes
      # the mode plan, the licence overlay, the GI namespaces, the mtime and the
      # arch OUTSIDE the stage, and each omission fails at exit 0. A pack job
      # standing in a checkout can re-discover a project and stage it again, and
      # every artifact assertion below would still pass — green, and it never
      # exercised the handoff.
      #
      # `status/open-todos.md` item 3 names the proof: "stage into a tmpdir,
      # DELETE THE PROJECT TREE, pack from the stage". No checkout is that
      # deletion, expressed as job shape. The job's three inputs — the tool, the
      # payload, the readers — each arrive as their own artifact into their own
      # explicit destination, which is the download shape `release.yml`'s
      # v0.26.1 incident settled.

      # The claim "ubuntu-latest ships dpkg and lintian" is MEASURED here on
      # every run rather than asserted in a comment. The install step below then
      # makes the answer irrelevant for the tools we need: absence becomes a
      # download, never a skipped check.
      - name: Measure this runner's Debian tooling
        run: |
          set -euo pipefail
          if [ -f /imagegeneration/imagedata.json ]; then
            echo "runner image:"
            cat /imagegeneration/imagedata.json
          else
            echo "runner image: no /imagegeneration/imagedata.json on this runner"
          fi
          . /etc/os-release
          echo "os: ${PRETTY_NAME:-unknown}"
          for tool in dpkg dpkg-deb apt-cache apt-get lintian lintian-explain-tags docker gjs; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '  %-22s %s\n' "$tool" "$(command -v "$tool")"
            else
              printf '  %-22s ABSENT\n' "$tool"
            fi
          done
          dpkg-query -W -f='  ${Package} ${Version}\n' dpkg lintian 2>&1 || true

      # `gjs` runs the CLI bundle; `lintian` is the third reader. Both are
      # INSTALLED rather than probed, because `tests/e2e/ship`'s `probe()` rule
      # applies here too: a silently skipped reader leaves every assertion
      # behind it vacuous, and this job's whole value is its readers.
      - name: Install the readers this runner does not ship
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs
          # NOT --no-install-recommends for lintian: several of its check modules
          # are pulled in as Recommends, and a lintian missing them still exits 0
          # having run fewer checks — a reader that quietly reads less.
          sudo apt-get install -y lintian
          gjs --version
          lintian --version

      # Three downloads, three explicit destinations. The bundle artifact is
      # rooted at `packages/infra` (the LCA of the two paths its producer
      # uploads), so it lands as `tool/cli/dist/cli.gjs.mjs`.
      - name: Download the CLI bundle (the tool)
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-bundles-fedora${{ fromJSON(needs.setup.outputs.fedora-matrix)[0].v }}
          path: tool
      - name: Download the stage (the payload)
        uses: actions/download-artifact@v8
        with:
          name: ship-stage-linux-x64
          path: incoming/stage
      - name: Download the artifact readers
        uses: actions/download-artifact@v8
        with:
          name: ship-oracle
          path: oracle

      # HAZARD 1 and HAZARD 3, both observed on arrival before anything runs.
      #
      # HAZARD 1 — the GitHub artifact round-trip does not preserve the
      # executable bit. Demonstrated as a closed loop inside this repo: the
      # producer builds `dist/cli.gjs.mjs` with `--shebang`, which ends in
      # `await chmod(outfile, 0o755)` (`packages/infra/cli/src/actions/build.ts`),
      # and the consumer has to chmod 0755 again after every download
      # (`.github/actions/gjsify-setup/action.yml`, whose comment states the
      # rule: "the artifact round-trip does not preserve the mode"). 0755 in,
      # chmod needed out.
      #
      # NOT evidence for this, and deliberately not cited: what the gjsify STORE
      # does to prebuild modes. That is a different transport with the opposite
      # behaviour — `packages/infra/tar/src/extract.ts` reproduces the
      # publisher's tar mode verbatim (`packages/infra/tar/src/index.spec.ts`
      # pins 0755), so a prebuild statistic says nothing about this hazard.
      #
      # The consequence for this leg: the bundle has to be chmodded before `gjs`
      # can be pointed at it, and the STAGE's `bin/<name>` WILL be 0644 here.
      # That is harmless only because the mode travels as DATA in the sidecar's
      # `staged[]` and `readStage()` reads the plan rather than `stat()` — which
      # is what the mode-fidelity step below verifies for every path, not just
      # for the launcher.
      #
      # HAZARD 3 — a directory upload arrives as its CONTENTS. If the sidecar is
      # not here, the archive was rooted somewhere else or the dotfile was
      # filtered out; either way phase 2 has no closure, and the error says so
      # in the same words `gjsify-setup` uses for the same class.
      - name: Inspect what actually arrived
        run: |
          set -euo pipefail
          chmod 0755 tool/cli/dist/cli.gjs.mjs
          echo "arriving stage:"
          find "$STAGE_DIR" -type f -printf '  %m %10s %P\n' | sort
          if [ ! -f "$STAGE_DIR/.gjsify-ship-stage.json" ]; then
            echo "::error title=Ship handoff::$STAGE_DIR/.gjsify-ship-stage.json did not arrive. actions/upload-artifact roots the archive at the least common ancestor of the producer's paths AND excludes hidden files unless include-hidden-files is set; if either moved, this download's path: has to move with it (.github/workflows/main.yml)."
            find incoming -maxdepth 3 | head -50
            exit 1
          fi
          arrived=$(find "$STAGE_DIR" -type f ! -name .gjsify-ship-stage.json | wc -l | tr -d '[:space:]')
          if [ "$arrived" != "$STAGED_COUNT" ]; then
            echo "::error title=Ship handoff::the stage job staged $STAGED_COUNT payload file(s); $arrived arrived. The artifact store lost or added files."
            exit 1
          fi
          echo "$arrived payload file(s) arrived intact"

      # The finish phase. No project on this machine, so everything it packs has
      # to have come out of the stage.
      - name: Pack from the stage alone
        run: |
          set -euo pipefail
          # No `--target`: on the from-stage path an omitted target means the
          # stage's OWN `formats`, so this packs exactly what was assembled and
          # proves that list round-trips through the sidecar. Spelled `deb,rpm`
          # it was a sixth hand-maintained copy of the format vocabulary — the
          # one nothing binds, where a newly supported format would simply never
          # be built here and no check would say so.
          gjs -m tool/cli/dist/cli.gjs.mjs ship --from-stage "$STAGE_DIR" --out "$ARTIFACTS"
          find "$ARTIFACTS" -type f | sort

      # MODE FIDELITY, EVERY PATH — the check the launcher assertion is not.
      #
      # HAZARD 1 above says every staged file arrives here 0644, so the
      # sidecar's `staged[]` is the ONLY surviving record of what each mode
      # should be. Reading 0755 off `bin/<name>` and stopping covers one path
      # out of the payload and cannot see the failure that matters: a plan entry
      # and a tree entry whose paths are spelled differently. The CLI used to
      # resolve that to `?? 0o644` — a package that installs and cannot start,
      # at exit 0, with every structural reader happy. `readStage()` now refuses
      # it outright; this step is what still catches it if that refusal is ever
      # softened back to a default, because it compares the ARTIFACT to the
      # PLAN rather than to itself.
      #
      # Discriminator: flip the launcher's x bits in contents.txt and this exits
      # 1 naming `bin/<name>: planned 0755, packed 0644`. Both branches were run
      # against dpkg-deb-shaped fixtures before the oracle shipped.
      - name: The .deb reproduces every mode the sidecar planned
        run: |
          set -euo pipefail
          deb=$(find "$ARTIFACTS" -name '*.deb' | sort | sed -n '1p')
          if [ -z "$deb" ]; then
            echo "::error title=Ship handoff::no .deb to check the mode plan against"
            exit 1
          fi
          dpkg-deb --contents "$deb" > contents.txt
          python3 oracle/verify-modes.py "$STAGE_DIR/.gjsify-ship-stage.json" contents.txt

      # `find` + a count, not a hardcoded filename: the name carries the version
      # and the arch label, and "packed nothing" must not be indistinguishable
      # from "packed everything" — the same reasoning `release-cut.yml`'s asset
      # gate spells out for its release globs.
      - name: Locate exactly one artifact per format
        id: art
        run: |
          set -euo pipefail
          for fmt in deb rpm; do
            mapfile -t hits < <(find "$ARTIFACTS" -type f -name "*.$fmt" | sort)
            if [ "${#hits[@]}" -ne 1 ]; then
              echo "::error title=Ship pack::expected exactly one .$fmt under $ARTIFACTS, found ${#hits[@]}."
              exit 1
            fi
            echo "$fmt=${hits[0]}" >> "$GITHUB_OUTPUT"
            echo "$fmt: ${hits[0]}"
          done

      - name: Read the .deb with dpkg, install it, run it, purge it
        env:
          DEB: ${{ steps.art.outputs.deb }}
        run: bash oracle/verify-deb.sh "$DEB" "$STAGE_DIR" "$STAGED_COUNT"

      # `rpm` on a host that is not ours, in the image ADR 0024 § A3 names as
      # the independent oracle. PLAIN `fedora:44`, deliberately NOT
      # `ghcr.io/gjsify/ci-fedora:44`: the claim under test is "a stranger can
      # install this", and our own image has the toolchain baked in, which is
      # exactly what would mask a missing runtime dependency.
      #
      # PULL FIRST, AND RETRY IT — `prebuilds.yml` pays for this comment: an
      # implicit pull conflates a registry blip with a broken build, and Docker
      # Hub answered `502 Bad Gateway` with exit 125 on 2026-08-02 and took a
      # green run down with it.
      - name: Read the .rpm with rpm, install it, run it, erase it
        env:
          RPM: ${{ steps.art.outputs.rpm }}
          IMAGE: fedora:44
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if docker pull "$IMAGE"; then break; fi
            if [ "$attempt" = 5 ]; then
              echo "::error::could not pull $IMAGE after 5 attempts"
              exit 1
            fi
            echo "pull failed (attempt $attempt/5) — retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          docker run --rm -v "$PWD:/w" -w /w "$IMAGE" \
            bash oracle/verify-rpm.sh "$RPM" "$STAGE_DIR"

      # THE ANTI-RE-STAGE DISCRIMINATOR, as a positive test rather than as a
      # property of the job shape. No checkout makes re-staging impossible HERE;
      # this proves the COMMAND refuses it anywhere. `--from-stage` is handed a
      # working directory that is a perfectly good, completely different
      # project — if it ever falls back to project discovery, the artifact is
      # named after the decoy and this reds.
      - name: --from-stage packs the stage, never a project it stands in
        env:
          DEB: ${{ steps.art.outputs.deb }}
        run: |
          set -euo pipefail
          mkdir -p decoy/dist
          cat > decoy/package.json <<'JSON'
          {
            "name": "decoy",
            "version": "9.9.9",
            "license": "MIT",
            "author": "Decoy <decoy@example.org>",
            "main": "dist/gjs.js",
            "gjsify": { "ship": { "binaryName": "decoy", "bundle": "dist/gjs.js" } }
          }
          JSON
          printf 'print(1);\n' > decoy/dist/gjs.js
          ( cd decoy && gjs -m "$GITHUB_WORKSPACE/tool/cli/dist/cli.gjs.mjs" \
              ship --from-stage "$GITHUB_WORKSPACE/$STAGE_DIR" --target deb --out out )
          find decoy/out -type f -name '*.deb' | sort
          if find decoy/out -type f -name 'decoy_*.deb' | grep -q .; then
            echo "::error title=Ship handoff::--from-stage packed the DECOY project instead of the stage it was given. The finish phase must take its whole closure from .gjsify-ship-stage.json."
            exit 1
          fi
          if ! cmp -s "$DEB" "$(find decoy/out -type f -name '*.deb' | sed -n '1p')"; then
            echo "::error title=Ship handoff::the same stage packed to different bytes from a different working directory. Something outside the stage is still reaching the packer."
            exit 1
          fi
          echo "byte-identical to the artifact packed from an empty directory"

      # A stage the plan does not describe must be REFUSED, not packed. Both
      # directions, because `readStage()`'s `?? 0o644` fallback silently accepts
      # the first and `listFilesRecursive` silently drops the second.
      - name: A mutilated stage is refused, not packed
        run: |
          set -euo pipefail
          rm -rf mutant && cp -a "$STAGE_DIR" mutant

          # (a) a path the plan does not name — the shape a followed symlink or
          #     a merged second artifact would produce.
          printf 'stowaway\n' > mutant/stowaway.txt
          if gjs -m tool/cli/dist/cli.gjs.mjs ship --from-stage mutant --target deb --out mutant-out; then
            echo "::error title=Ship handoff::packed a stage carrying a file the plan does not name."
            exit 1
          fi
          rm -f mutant/stowaway.txt

          # (b) a planned path the stage lacks.
          # `sed -n 1p`, not `head -1`: `head` closes the pipe early, and under
          # `set -o pipefail` the SIGPIPE'd `sort` fails the whole assignment.
          victim=$(find mutant -type f ! -name .gjsify-ship-stage.json | sort | sed -n '1p')
          rm -f "$victim"
          if gjs -m tool/cli/dist/cli.gjs.mjs ship --from-stage mutant --target deb --out mutant-out; then
            echo "::error title=Ship handoff::packed a stage missing $victim, which its own plan names."
            exit 1
          fi

          # (c) a stage cut for another matrix leg.
          #
          # NO LITERAL `linux-x64` EXISTS IN THE SIDECAR. The manifest carries
          # `target: {os, arch}` as two separate JSON fields, and
          # `--expect-target` joins them at comparison time. An earlier draft of
          # this probe grepped for the joined string and would have failed on
          # its own guard on the first run — the schema is the authority, not
          # the flag's spelling.
          #
          # And the flag is what does the refusing: `assertExpectedTarget()`
          # returns immediately when `--expect-target` is absent, so mutating
          # the sidecar without passing it packs happily at exit 0. Both halves
          # are asserted here, positive control first so a gate that refused
          # everything could not pass as a gate that refuses the right thing.
          rm -rf mutant && cp -a "$STAGE_DIR" mutant
          # Spelled FROM the sidecar, not hardcoded: the schema owns the two
          # fields and this probe must not carry a third copy of how they join.
          own=$(python3 -c "import json;t=json.load(open('mutant/.gjsify-ship-stage.json'))['target'];print(t['os']+'-'+t['arch'])")
          echo "sidecar target: $own"
          # An `[ … ] && x=y` here would exit the step under `set -e` whenever
          # the test is FALSE, which is the normal case. `if` is not style.
          if [ "$own" = "linux-arm64" ]; then other=linux-x64; else other=linux-arm64; fi
          gjs -m tool/cli/dist/cli.gjs.mjs ship --from-stage mutant --target deb \
            --expect-target "$own" --out mutant-out
          if gjs -m tool/cli/dist/cli.gjs.mjs ship --from-stage mutant --target deb \
            --expect-target "$other" --out mutant-out; then
            echo "::error title=Ship handoff::packed a stage belonging to a different matrix leg. --expect-target named $other and the sidecar records $own."
            exit 1
          fi
          echo "all three refusals fired"

  # ── #1354 M4: the `.dmg`, packed where its tool lives and read where it is not ──
  #
  # THE PAIR BELOW IS ADR 0024 § A1 AS TWO JOBS. A `.dmg` is a UDIF image over a
  # real HFS+ volume; no HFS+ writer exists anywhere in this tree and `hdiutil` is
  # macOS-only, so the container is produced on darwin — the first format in this
  # table for which that is true. § A6 rejects writing one ourselves (1200-2000
  # lines against a whole packer surface of ~1243, every mistake silent because
  # the Finder mounts the image and shows an empty window) and names the price:
  # the artifact is built by the platform's own tool, so the reader must not be.
  #
  # WHICH IS WHY THERE ARE TWO JOBS AND NOT ONE. `hdiutil verify` on the pack leg
  # would be hdiutil reading what hdiutil wrote, and a green leg proving nothing
  # is this repository's most expensive failure class. Everything the image is
  # asserted to be is asserted by `ship-read-dmg` below, on Linux, with three
  # readers from three unrelated implementations.
  ship-pack-dmg:
    # `setup` for the Fedora version in the CLI bundle's artifact name;
    # `ship-stage` for the darwin stage and the file count to check it against.
    needs: [setup, ship-stage]
    if: ${{ always() && needs.ship-stage.result == 'success' }}
    name: Ship pack .dmg (macos-latest, real hdiutil)
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      STAGE_DIR: incoming/stage
      ARTIFACTS: artifacts
      STAGED_COUNT: ${{ needs.ship-stage.outputs.staged-count-darwin }}
    steps:
      # THERE IS DELIBERATELY NO `actions/checkout` IN THIS JOB EITHER, and the
      # argument is `ship-pack-linux`'s, one OS over: a pack phase standing in a
      # checkout can re-discover a project and stage it again, and every assertion
      # downstream would still pass — green, having never exercised the handoff.
      # Here it also buys the thing that makes the Mac leg cheap: no workspace
      # install, no `build:infra`, no toolchain. The tool arrives as a bundle and
      # the payload arrives as a stage.
      - name: Measure this runner and its image writer
        run: |
          set -euo pipefail
          sw_vers
          echo "arch:   $(uname -m)"
          echo "hdiutil: $(command -v hdiutil || echo ABSENT)"
          # `hdiutil` is part of macOS and cannot be installed, so its absence is a
          # broken runner rather than a missing package — which is exactly what the
          # format row's `installHint` says, and this is where that sentence is
          # measured instead of assumed.
          command -v hdiutil >/dev/null || {
            echo "::error title=Ship .dmg::hdiutil is not on PATH on a macOS runner. It ships with the OS; there is no package to install."
            exit 1
          }

      # The CLI bundle is `--app gjs`, so the pack host needs a GJS. Homebrew's
      # is the one `macos-suites.yml` uses, and the symlink below is that
      # workflow's measured repair rather than a precaution: `GjsPrivate-1.0.typelib`
      # names its library by BARE LEAF (`libgjs.0.dylib`) and Homebrew's `gjs`
      # carries exactly one rpath, into GLib's keg. The obvious fix —
      # `DYLD_LIBRARY_PATH` — cannot work, because SIP strips every `DYLD_*`
      # variable when a protected binary is exec'd and `/bin/sh` is protected, so
      # the value dies at the first `run:` boundary. A symlink at the location the
      # existing rpath already names needs no variable at all.
      - name: Install GJS, the CLI bundle's interpreter
        run: brew install gjs

      - name: Make libgjs resolvable without a DYLD_ variable
        run: |
          set -euo pipefail
          prefix="$(brew --prefix)"
          ln -sfn "$prefix/opt/gjs/lib/libgjs.0.dylib" "$prefix/opt/glib/lib/libgjs.0.dylib"
          ls -l "$prefix/opt/glib/lib/libgjs.0.dylib"
          gjs --version

      # Two downloads, two explicit destinations — the same shape and the same
      # v0.26.1 lesson as `ship-pack-linux`. The bundle artifact is rooted at
      # `packages/infra` (the LCA of the two paths its producer uploads), so it
      # lands as `tool/cli/dist/cli.gjs.mjs`.
      - name: Download the CLI bundle (the tool)
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-bundles-fedora${{ fromJSON(needs.setup.outputs.fedora-matrix)[0].v }}
          path: tool
      - name: Download the darwin stage (the payload)
        uses: actions/download-artifact@v8
        with:
          name: ship-stage-darwin-arm64
          path: incoming/stage

      # The same two hazards `ship-pack-linux` observes on arrival, and they are
      # not Linux's: the artifact round-trip stores no POSIX mode (so the bundle
      # has to be chmodded before `gjs` can be pointed at it, and every staged
      # file arrives 0644), and a directory upload arrives as its CONTENTS (so a
      # missing sidecar means the archive was rooted somewhere else or the dotfile
      # was filtered out).
      - name: Inspect what actually arrived
        run: |
          set -euo pipefail
          chmod 0755 tool/cli/dist/cli.gjs.mjs
          echo "arriving stage:"
          find "$STAGE_DIR" -type f -exec stat -f '  %Lp %10z %N' {} \; | sort
          if [ ! -f "$STAGE_DIR/.gjsify-ship-stage.json" ]; then
            echo "::error title=Ship handoff::$STAGE_DIR/.gjsify-ship-stage.json did not arrive. actions/upload-artifact excludes hidden files unless include-hidden-files is set, and roots the archive at the least common ancestor of the producer's paths; if either moved, this download's path: has to move with it."
            exit 1
          fi
          arrived=$(find "$STAGE_DIR" -type f ! -name .gjsify-ship-stage.json | wc -l | tr -d '[:space:]')
          if [ "$arrived" != "$STAGED_COUNT" ]; then
            echo "::error title=Ship handoff::the stage job staged $STAGED_COUNT payload file(s); $arrived arrived. The artifact store lost or added files."
            exit 1
          fi
          echo "$arrived payload file(s) arrived intact"

      # THE FINISH PHASE. No project on this machine, so everything in the image
      # came out of the stage. No `--target` either: on the from-stage path an
      # omitted target means the stage's OWN formats, so this packs exactly what
      # was assembled and proves that list round-trips through the sidecar —
      # spelled `macos-app-dmg` here it would be one more hand-maintained copy of
      # the format vocabulary.
      #
      # `--expect-target darwin-arm64` because this leg IS a claim about the
      # architecture: `macos-latest` is Apple silicon, the artifact's name carries
      # `arm64`, and a stage cut for the Intel image would otherwise pack happily
      # and be named after a machine it was not built for.
      - name: Pack the .dmg from the stage alone
        run: |
          set -euo pipefail
          # The tool, before the work: this is the first thing in this repository
          # to run the CLI bundle under a Homebrew GJS on macOS, and "gjs cannot
          # load the bundle" and "the pack failed" are two different diagnoses
          # that would otherwise arrive as one red step.
          gjs -m tool/cli/dist/cli.gjs.mjs --version
          gjs -m tool/cli/dist/cli.gjs.mjs ship --from-stage "$STAGE_DIR" \
            --expect-target darwin-arm64 --out "$ARTIFACTS" --verbose
          find "$ARTIFACTS" -type f | sort

      # `find` + a count, never a hardcoded filename: the name carries the version
      # and the arch label, and "packed nothing" must not be indistinguishable
      # from "packed everything".
      - name: Locate exactly one .dmg
        id: art
        run: |
          set -euo pipefail
          hits=$(find "$ARTIFACTS" -type f -name '*.dmg' | sort)
          count=$(printf '%s\n' "$hits" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "::error title=Ship pack::expected exactly one .dmg under $ARTIFACTS, found $count."
            exit 1
          fi
          echo "dmg=$hits" >> "$GITHUB_OUTPUT"
          ls -l "$hits"

      # INFORMATIONAL AND DELIBERATELY NOT A GATE. `hdiutil imageinfo` is hdiutil
      # reading what hdiutil wrote — ADR 0024 § A3 names this exact reader as the
      # one that does not count. It is printed because a human diagnosing the
      # Linux leg should see what the writer thought it produced, and it is
      # followed by `|| true` so it can never turn this job green or red.
      - name: What hdiutil thinks it wrote (not a check)
        env:
          DMG: ${{ steps.art.outputs.dmg }}
        run: |
          hdiutil imageinfo "$DMG" | sed -n '1,40p' || true

      # THE STEP OUTPUT, not a glob, and the first draft's glob is why. `ship
      # --out artifacts` writes the artifact to `artifacts/out/`, not to
      # `artifacts/` — `packOne` joins `out` onto the output root — so
      # `path: artifacts/*.dmg` matched nothing and the upload failed with "No
      # files were found with the provided path". `ship-pack-linux` never noticed
      # the same layout because it locates its artifacts with a RECURSIVE `find`.
      # The locate step above already derived the exact path; reading it back is
      # one spelling of the layout instead of two.
      #
      # `if-no-files-found: error` stays, and it is what turned that mistake into
      # a red step here rather than a missing file in the reader job two jobs on.
      - name: Upload the .dmg
        uses: actions/upload-artifact@v7
        with:
          name: ship-dmg-darwin-arm64
          path: ${{ steps.art.outputs.dmg }}
          retention-days: 1
          if-no-files-found: error

  # THE HALF THAT EARNS THE MILESTONE. Everything above runs on the machine that
  # WROTE the image; this reads it back somewhere else, with tools from three
  # unrelated codebases, and compares the result against the sidecar the stage
  # travelled with.
  #
  # BARE `ubuntu-latest`, NO `container:`, and that is what keeps M4 out of the
  # Dockerfile-then-test ordering trap: `build-ci-image.yml` publishes
  # `ghcr.io/gjsify/ci-fedora` only on a push to `main`, so a PR that adds a
  # package to the image AND a test that hard-requires it can never go green. The
  # three readers arrive by `apt-get` on a runner the image does not own — the
  # same route `ship-pack-linux` takes for `gjs` and `lintian`, and the reason
  # this milestone needs no Dockerfile change at all.
  ship-read-dmg:
    needs: [ship-stage, ship-pack-dmg]
    if: ${{ always() && needs.ship-pack-dmg.result == 'success' }}
    name: Ship read .dmg back (bare ubuntu, 7z + dmg2img + fsck.hfsplus)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      STAGE_DIR: incoming/stage
    steps:
      # NO CHECKOUT here either. The readers travel as the `ship-oracle` artifact
      # exactly as they do for the `.deb`, so this job holds the image, the
      # sidecar and three scripts and nothing else.
      - name: Measure this runner, then install the three readers
        run: |
          set -euo pipefail
          . /etc/os-release
          echo "os: ${PRETTY_NAME:-unknown}"
          # INSTALLED, never probed. `tests/e2e/ship`'s `probe()` rule applies
          # here with force: every assertion in `verify-dmg.py` sits behind one of
          # these three, so a silently absent reader would leave this job green
          # having read nothing.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 7zip dmg2img hfsprogs
          # The versions, in the log rather than in a comment. What each is FOR is
          # in `.github/ship-oracle/verify-dmg.py`'s header; what matters here is
          # that 7-Zip on ubuntu-24.04 is 23.01 and not this project's
          # workstation's 26.02 — which is why the image is asked for as UDZO
          # (zlib) rather than ULFO/ULMO, and why `-fs HFS+J` rather than the
          # APFS a modern hdiutil defaults to.
          7z i | sed -n '1,3p'
          7z i | grep -E '  (Dmg|HFS|APFS) ' || {
            echo "::error title=Ship .dmg::this 7-Zip advertises no Dmg/HFS/APFS handler, so it cannot be the reader."
            exit 1
          }
          dmg2img -V 2>&1 | head -2 || true
          fsck.hfsplus -V 2>&1 | head -2 || true

      - name: Download the .dmg
        uses: actions/download-artifact@v8
        with:
          name: ship-dmg-darwin-arm64
          path: incoming/dmg
      - name: Download the darwin stage (what the image is compared against)
        uses: actions/download-artifact@v8
        with:
          name: ship-stage-darwin-arm64
          path: incoming/stage
      - name: Download the artifact readers
        uses: actions/download-artifact@v8
        with:
          name: ship-oracle
          path: oracle

      - name: Locate the image that arrived
        id: art
        run: |
          set -euo pipefail
          hits=$(find incoming/dmg -type f -name '*.dmg' | sort)
          count=$(printf '%s\n' "$hits" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "::error title=Ship .dmg::expected exactly one .dmg to arrive, found $count."
            find incoming -maxdepth 3 | head -50
            exit 1
          fi
          echo "dmg=$hits" >> "$GITHUB_OUTPUT"
          ls -l "$hits"

      # GREEN. The whole chain: 7-Zip's Dmg handler over the container, `7z t` to
      # decompress what it stores, dmg2img to a raw volume, `fsck.hfsplus -f -n`
      # over that, and 7-Zip's HFS handler for the listing — compared against
      # `.gjsify-ship-stage.json` by name and size.
      - name: Read the image back and hold it against the stage
        env:
          DMG: ${{ steps.art.outputs.dmg }}
        run: python3 oracle/verify-dmg.py "$DMG" "$STAGE_DIR/.gjsify-ship-stage.json"

      # RED, THREE TIMES, ONE PER READER. Without these the whole job is one
      # script that could `exit 0` unconditionally, and a green run would say
      # nothing at all — the failure class this repository pays for most.
      #
      # THREE and not one, because a single byte flip does not red them all:
      # measured on ubuntu-24.04 against an 8 MiB `mkfs.hfsplus -J` volume,
      # flipping one byte at offsets 1028, 1100 and 2048 left BOTH `fsck.hfsplus`
      # and `7z l` at exit 0, while the same flip at 1024 — the `H+` volume
      # signature — gave fsck exit 8 and 7z exit 2. A negative control has to
      # corrupt something a reader reads.
      - name: RED — the readers refuse a corrupted UDIF trailer
        env:
          DMG: ${{ steps.art.outputs.dmg }}
        run: |
          set -euo pipefail
          python3 oracle/verify-dmg.py "$DMG" --mutate koly --out mutant-koly.dmg
          if python3 oracle/verify-dmg.py mutant-koly.dmg "$STAGE_DIR/.gjsify-ship-stage.json"; then
            echo "::error title=Ship .dmg::the chain accepted an image whose UDIF trailer magic was corrupted, so it is not reading the container."
            exit 1
          fi
          echo "refused, as it must"

      - name: RED — the readers refuse a corrupted compressed run
        env:
          DMG: ${{ steps.art.outputs.dmg }}
        run: |
          set -euo pipefail
          python3 oracle/verify-dmg.py "$DMG" --mutate payload --out mutant-payload.dmg
          if python3 oracle/verify-dmg.py mutant-payload.dmg "$STAGE_DIR/.gjsify-ship-stage.json"; then
            echo "::error title=Ship .dmg::the chain accepted an image with a byte flipped inside its data fork. A table-of-contents read is blind to that, which is why 7z t is in the chain — this says it is not doing its job."
            exit 1
          fi
          echo "refused, as it must"

      - name: RED — fsck.hfsplus refuses a corrupted volume signature
        env:
          DMG: ${{ steps.art.outputs.dmg }}
        run: |
          set -euo pipefail
          # The mutant is a raw VOLUME rather than an image: fsck's subject is the
          # filesystem, and the only way to hand it one is to convert first. That
          # is what `--kind volume` verifies.
          python3 oracle/verify-dmg.py "$DMG" --mutate volume --out mutant-volume.img
          if python3 oracle/verify-dmg.py mutant-volume.img "$STAGE_DIR/.gjsify-ship-stage.json" --kind volume; then
            echo "::error title=Ship .dmg::fsck.hfsplus called a volume with a corrupted HFS+ signature OK, so the deepest reader in the chain is not reading."
            exit 1
          fi
          echo "refused, as it must"

      # And the positive control for the mutation machinery itself: the UNTOUCHED
      # volume must still pass the `--kind volume` path. Without it, a `--mutate`
      # that corrupted the wrong thing — or a `--kind volume` branch that refused
      # everything — would read as three working discriminators.
      - name: CONTROL — the untouched volume passes the same reader
        env:
          DMG: ${{ steps.art.outputs.dmg }}
        run: |
          set -euo pipefail
          dmg2img "$DMG" control.img
          python3 oracle/verify-dmg.py control.img "$STAGE_DIR/.gjsify-ship-stage.json" --kind volume

  # ── Coverage summary ────────────────────────────────────────────────
  # Answers the question a green PR does NOT answer on its own: what did this
  # run actually check, and what did it deliberately NOT check?
  #
  # This workflow is full of deliberate PR cost controls — the affected
  # classifier, the `ci:macos` label gate, the per-tier `if:` gates — and every
  # one of them turns a job into a silent no-show. Read naively, "all checks
  # passed" then means "everything we run passed", not "everything passed", and
  # the difference is where a post-merge red comes from.
  #
  # Everything printed here is DERIVED, never restated:
  #   - the per-job rows are `needs.<job>.result`, i.e. GitHub's own evaluation
  #     of each job's `if:`. A gate that changes cannot desync from this.
  #   - the "why" values are the gating jobs' OWN outputs (`changes.outputs.*`
  #     from the classifier, `setup.outputs.macos-*` from the matrix planner),
  #     printed verbatim.
  #   - the cross-workflow table is the repo's active workflow list minus the
  #     workflows GitHub actually created a run for at this commit.
  # There is deliberately no hand-maintained "things we skip" list anywhere in
  # this job; such a list is exactly the artefact that drifts and then lies.
  #
  # Never gates. Its output is the step summary, not its exit code.
  ci-summary:
    name: CI coverage summary
    needs: [setup, changes, tree-checks, build, check, test, cross-runtime, macos, e2e, cold-bootstrap, integration, examples, browser, ship-stage, ship-pack-linux, ship-pack-dmg, ship-read-dmg]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the coverage-history query below — run and job records of past runs.
      actions: read
    timeout-minutes: 10
    steps:
      - name: Summarise what ran and what did not
        shell: bash
        env:
          # Every value is passed through the environment and quoted at use.
          # `include-args` in particular is built from workspace package names,
          # which on a fork PR are attacker-authored text.
          EVENT: ${{ github.event_name }}
          R_SETUP: ${{ needs.setup.result }}
          R_CHANGES: ${{ needs.changes.result }}
          R_TREE: ${{ needs.tree-checks.result }}
          R_BUILD: ${{ needs.build.result }}
          R_CHECK: ${{ needs.check.result }}
          R_TEST: ${{ needs.test.result }}
          R_CROSS: ${{ needs.cross-runtime.result }}
          R_MACOS: ${{ needs.macos.result }}
          R_E2E: ${{ needs.e2e.result }}
          R_EXAMPLES: ${{ needs.examples.result }}
          R_BROWSER: ${{ needs.browser.result }}
          R_SHIP_STAGE: ${{ needs.ship-stage.result }}
          R_SHIP_PACK: ${{ needs.ship-pack-linux.result }}
          R_SHIP_DMG_PACK: ${{ needs.ship-pack-dmg.result }}
          R_SHIP_DMG_READ: ${{ needs.ship-read-dmg.result }}
          C_SKIP_ALL: ${{ needs.changes.outputs.skip-all }}
          C_GLOBAL: ${{ needs.changes.outputs.global }}
          C_INCLUDE: ${{ needs.changes.outputs.include-args }}
          C_INTEGRATION: ${{ needs.changes.outputs.run-integration }}
          C_E2E: ${{ needs.changes.outputs.run-e2e }}
          C_REASON: ${{ needs.changes.outputs.reason }}
          M_ENABLED: ${{ needs.setup.outputs.macos-enabled }}
          M_REASON: ${{ needs.setup.outputs.macos-reason }}
        run: |
          set -u
          {
            echo "## What this run checked"
            echo
            echo "\`skipped\` is not \`passed\`. Each one is a deliberate cost control firing;"
            echo "the values under **Why** are what decided it."
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            printf '| Matrix planner (setup) | `%s` |\n'        "$R_SETUP"
            printf '| Affected classifier (changes) | `%s` |\n' "$R_CHANGES"
            printf '| Whole-tree checks (lint/format/deps) | `%s` |\n' "$R_TREE"
            printf '| Build + examples | `%s` |\n'              "$R_BUILD"
            printf '| Type-check | `%s` |\n'                    "$R_CHECK"
            printf '| Unit tests (GJS, 4 shards) | `%s` |\n'    "$R_TEST"
            printf '| Cross-runtime (node+bun+deno) | `%s` |\n' "$R_CROSS"
            printf '| macOS GJS suite | `%s` |\n'               "$R_MACOS"
            printf '| E2E (4 shards) | `%s` |\n'                "$R_E2E"
            printf '| Examples | `%s` |\n'                      "$R_EXAMPLES"
            printf '| Browser (Playwright/Firefox) | `%s` |\n'  "$R_BROWSER"
            printf '| Ship: stage (assemble) | `%s` |\n'        "$R_SHIP_STAGE"
            printf '| Ship: pack + install (dpkg/rpm) | `%s` |\n' "$R_SHIP_PACK"
            printf '| Ship: pack .dmg (macOS, hdiutil) | `%s` |\n' "$R_SHIP_DMG_PACK"
            printf '| Ship: read .dmg back (Linux, 7z/dmg2img/fsck) | `%s` |\n' "$R_SHIP_DMG_READ"
            echo
            echo "### Why"
            echo
            printf -- '- event: `%s`\n' "$EVENT"
            printf -- '- classifier: `skip-all=%s` `global=%s` `run-e2e=%s` `run-integration=%s`\n' \
              "${C_SKIP_ALL:-<unset>}" "${C_GLOBAL:-<unset>}" "${C_E2E:-<unset>}" "${C_INTEGRATION:-<unset>}"
            printf -- '- classifier reason: `%s`\n' "${C_REASON:-<unset — classifier did not run or crashed; jobs fall back to a full run>}"
            printf -- '- affected closure: `%s`\n' "${C_INCLUDE:-<empty — treated as a full run>}"
            printf -- '- macOS leg: `enabled=%s` — %s\n' "${M_ENABLED:-<unset>}" "${M_REASON:-<unset>}"
            echo "- integration suites (\`tests/integration/**\`): the measured-green subset gates"
            echo "  this run via the \`integration\` job; the rest are held out with their cause"
            echo "  recorded per suite in status/integration-coverage.md."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Coverage HISTORY, at the two granularities that hide the same thing: a
      # workflow that produced no run for this commit, and a job INSIDE a run that
      # resolved to `skipped`. Both are indistinguishable from a green one in the
      # checks UI, and the second one is the half this job could not see.
      #
      # It is what the second half cost that put it here. `node-gi.yml`'s `scope` job
      # gates the OS legs on `packages/node-gi/**`, so on a consumer-only change the
      # Windows legs resolve to `skipped` — and a file-level `node:test` failure on
      # one of them was chased against a `main` whose green tick said nothing about
      # it, the last run that actually EXECUTED it being two PRs earlier.
      #
      # A row is not automatically a bug: `release.yml` is post-merge by definition
      # and `node-gi.yml` skips fourteen legs on purpose. What made the old table
      # unreadable is that a gate which is merely quiet and one that is RED looked
      # identical in it. Measured (#1173): `node-gi.yml` sat in it from 2026-08-13
      # while `main` was red on it, and nothing in the row said so. The conclusion
      # column is what makes a row actionable; the annotation is what carries it out
      # of a step summary nobody opens.
      #
      # A SCRIPT rather than inline bash, so the derivation has tests. The failure
      # mode of a reporter is an EMPTY report, which a broken detector and a healthy
      # repository produce alike — `tests/e2e/ci-gate-history` therefore drives it
      # with the incident as a fixture and with the same shape green, and asserts
      # this wiring from the other side.
      - name: Check out the reporter
        uses: actions/checkout@v6

      - name: Report gates that did not run at this commit
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For `pull_request` the run's head_sha may be recorded as either the merge
          # commit or the PR head depending on the triggering event, so both are
          # queried and the results unioned.
          SHA_A: ${{ github.sha }}
          SHA_B: ${{ github.event.pull_request.head.sha }}
          # Annotate only where a red `main` is the reader's problem. The rows still
          # print on a PR; warning there would tag every open PR with someone else's
          # breakage, which is how #906 taught people to read a red check as noise.
          ANNOTATE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && '--annotate' || '' }}
        # Markdown lands in $GITHUB_STEP_SUMMARY, which the script reads from the
        # environment; annotations go to stdout, where GitHub reads workflow commands.
        run: |
          set -uo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --sha "$SHA_A")
          if [ -n "$SHA_B" ]; then args+=(--sha "$SHA_B"); fi
          if [ -n "$ANNOTATE" ]; then args+=("$ANNOTATE"); fi
          node scripts/report-gate-history.mjs "${args[@]}"

  # The integration suites are gated by the `integration` job above, for the
  # subset measured green in this image. Which suites those are, and the cause
  # held against each one that is out, is `status/integration-coverage.md`.
  #
  # "CI-incompatible preconditions" stood here as a blanket reason for all 35
  # until the per-suite measurement retired it: it is true of four of them
  # (podman, an Android device, a native `.node`, `openssl(1)`), while most of
  # the rest had simply never been run. Do not restore a blanket phrase — the
  # reason a suite is out belongs beside that suite.

  # The ONE job this workflow's verdict may be read from — the branch-protection
  # required check. Everything else here is either a matrix leg (its name carries
  # `${{ matrix… }}`, so it is not stably requirable) or `ci-summary`, which
  # reports and deliberately never gates.
  #
  # Why this exists: with no required check, GitHub had nothing to hold a merge
  # against. `gh pr merge --auto` therefore merged #910 the moment it was called,
  # with 12 checks still running — auto-merge waits for REQUIRED checks, and an
  # empty required set is satisfied immediately. `ci-summary` could not fill the
  # role: it is green while the build is red (measured on #910), so requiring it
  # would have bought a false green, which is worse than no gate at all.
  #
  # `skipped` passes. Selective CI skipping a leg is the system working, and the
  # skip reasons are already spelled out in ci-summary. `cancelled` FAILS: a
  # superseded or aborted run has not demonstrated anything, and the next push
  # produces a fresh verdict anyway.
  gate:
    name: CI gate (GJS)
    needs: [setup, changes, tree-checks, build, check, test, cross-runtime, macos, e2e, cold-bootstrap, integration, examples, browser, ship-stage, ship-pack-linux, ship-pack-dmg, ship-read-dmg]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # A hand-listed `needs:` is the artefact this workflow warns about two
      # jobs up — it drifts and then lies, and here the lie is a green merge
      # button for a job nobody gated. GitHub Actions has no "needs: every job",
      # so the list stays hand-written and this step holds it to the file: every
      # job defined in this workflow must be reachable from the gate.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: The gate covers every job in this workflow
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const lines = readFileSync(".github/workflows/main.yml", "utf8").split("\n");
            const start = lines.findIndex((l) => /^jobs:\s*$/.test(l));
            if (start < 0) { console.error("::error::no top-level `jobs:` key in main.yml"); process.exit(1); }
            const jobs = [];
            for (const line of lines.slice(start + 1)) {
              if (/^\S/.test(line)) break;                  // left the jobs block
              const m = /^  ([A-Za-z0-9_-]+):\s*$/.exec(line);
              if (m) jobs.push(m[1]);
            }
            // Anchor on the `gate:` key, never on the first matching `needs:`
            // line — `ci-summary` carries a needs list of the same shape and
            // comes first, so a bare search reads the wrong job and silently
            // audits a list that is not the gate’s.
            const gateAt = lines.findIndex((l) => /^  gate:\s*$/.test(l));
            const gateLine = lines.slice(gateAt).find((l) => /^    needs: \[/.test(l));
            if (gateAt < 0 || !gateLine) { console.error("::error::cannot find the gate job’s `needs:` list"); process.exit(1); }
            const needs = [...gateLine.matchAll(/[A-Za-z0-9_-]+/g)].map((m) => m[0]).slice(1);
            // `gate` cannot need itself; `ci-summary` reports and never gates.
            const expected = jobs.filter((j) => j !== "gate" && j !== "ci-summary");
            const missing = expected.filter((j) => !needs.includes(j));
            if (missing.length) {
              console.error(`::error::CI gate does not cover: ${missing.join(", ")}. ` +
                "Add them to the `gate` job’s `needs:` — a job outside the gate is a job that " +
                "cannot block a merge.");
              process.exit(1);
            }
            // `needs:` only makes the gate WAIT for a job. What decides the
            // verdict is the `RESULTS` env below, and that is a second
            // hand-written list which nothing held to the first: a job added
            // to `needs:` but not to `RESULTS` is waited for and then not
            // read, so its failure passes the gate. Same drift this workflow
            // warns about two jobs up, one level further in.
            const verdictAt = lines.findIndex((l) => /^\s+RESULTS: \|\s*$/.test(l));
            if (verdictAt < 0) { console.error("::error::cannot find the Verdict step’s `RESULTS:` block"); process.exit(1); }
            const scored = [];
            for (const line of lines.slice(verdictAt + 1)) {
              const m = /^\s+([A-Za-z0-9_-]+)=\$\{\{ needs\./.exec(line);
              if (!m) break;
              scored.push(m[1]);
            }
            const unscored = needs.filter((j) => !scored.includes(j));
            if (unscored.length) {
              console.error(`::error::the gate waits for but never SCORES: ${unscored.join(", ")}. ` +
                // The opening token is split so GITHUB does not read the rest as an
                // expression to evaluate. `<job>` is a placeholder for a human and not
                // a valid property dereference, so spelled whole the workflow file
                // stops LOADING — a run with zero jobs, which reads as a green PR.
                // This comment cannot spell it whole either: the scan is over raw
                // text and knows nothing about JavaScript comments.
                "Add `<job>=$" + "{{ needs.<job>.result }}` to the Verdict step’s `RESULTS` — a job in " +
                "`needs:` alone is waited for and then ignored, so its failure passes the gate.");
              process.exit(1);
            }
            console.log(`CI gate covers all ${expected.length} job(s): ${expected.join(", ")}`);
            console.log(`Verdict scores all ${needs.length} of them.`);
          '
      - name: Verdict
        shell: bash
        env:
          # Quoted at use; `needs.*.result` is one of success/failure/cancelled/skipped.
          RESULTS: |
            setup=${{ needs.setup.result }}
            changes=${{ needs.changes.result }}
            tree-checks=${{ needs.tree-checks.result }}
            build=${{ needs.build.result }}
            check=${{ needs.check.result }}
            test=${{ needs.test.result }}
            cross-runtime=${{ needs.cross-runtime.result }}
            macos=${{ needs.macos.result }}
            e2e=${{ needs.e2e.result }}
            cold-bootstrap=${{ needs.cold-bootstrap.result }}
            integration=${{ needs.integration.result }}
            examples=${{ needs.examples.result }}
            browser=${{ needs.browser.result }}
            ship-stage=${{ needs.ship-stage.result }}
            ship-pack-linux=${{ needs.ship-pack-linux.result }}
            ship-pack-dmg=${{ needs.ship-pack-dmg.result }}
            ship-read-dmg=${{ needs.ship-read-dmg.result }}
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            job="${line%%=*}"
            result="${line#*=}"
            case "$result" in
              success|skipped) printf '  %-14s %s\n' "$job" "$result" ;;
              *) printf '  %-14s %s  <-- blocks the merge\n' "$job" "$result"; bad=1 ;;
            esac
          done <<< "$RESULTS"
          if [ "$bad" -ne 0 ]; then
            echo "::error::GJS CI did not pass — see the jobs marked above."
            exit 1
          fi
          echo "GJS CI passed (skipped legs are deliberate; ci-summary says which and why)."
