name: Cancel superseded PR runs

# WHY THIS EXISTS
#
# A run whose verdict nobody will read still occupies a runner. Two events produce
# them, and `concurrency` covers NEITHER on its own.
#
# CLOSING a PR does not stop its in-flight runs, and `concurrency` structurally cannot
# help: its group is per-REF, so a closed PR's run has no successor on that ref to
# supersede it. It therefore keeps a full `main.yml` matrix (build + check + 4 test
# shards + 4 e2e shards + …) burning runner capacity for work nobody will read.
#
# MEASURED, 2026-08-02 18:35: four merged PRs — #929 (merged 17:55), #943 (18:23),
# #939 (18:31) — still held five concurrent `GJS` runs, with `main`'s own post-merge
# run and an open PR's run queued behind them.
#
# PUSHING to an open PR supersedes the previous commit's runs, and there `concurrency`
# is not structurally absent but conditionally useless. `main.yml` already sets
# `cancel-in-progress` for pull_request, but that fires when the SUPERSEDING run
# STARTS — and starting is exactly what a saturated queue prevents. So a force-push
# during a backlog leaves the stale run alive, the stale run keeps the queue saturated,
# and the queue keeps the new run from starting: a deadlock whose only exit is a human
# cancelling runs by hand.
#
# MEASURED, 2026-08-26: five parallel PRs (#1329–#1333) saturated the runner pool. Run
# 32937220245 — branch `fix/prebuilds-musl-leg`, commit 1fc2ebbdc, superseded hours
# earlier — sat `queued` holding the `main-pr` group; its successor could not start, so
# `cancel-in-progress` never fired, and `CI gate (GJS)` was never green on that branch
# until a human cancelled the run by hand. THAT is what the `synchronize` trigger buys
# over `cancel-in-progress`: ONE small job takes a runner long before a 20-job matrix
# does, so the cancel no longer depends on the queue having room for the work it
# unblocks. For `audit-runtimes.yml`, `build-ci-image.yml` and `commitlint.yml`, which
# carry no `concurrency` block at all, it is the only superseding mechanism there is.
#
# ONE SELECTION, TWO WINDOWS — and it lives in `scripts/select-superseded-runs.mjs`,
# not in the `run:` block below, because it ends in a cancel POST against other
# people's runs: a filter embedded in a workflow can only be reviewed by reading it,
# and nothing runs it until it runs for real. That script's header carries the window
# per event and why its time bound is load-bearing on BOTH; the decision itself is
# under fixtures in `tests/e2e/ci-cancel-superseded-runs`.
#
# THE CANCEL ITSELF IS A SECOND SCRIPT, for the second half of that same sentence.
# `scripts/cancel-superseded-runs.mjs` posts the cancels, re-reads the runs, and
# force-cancels the ones that never got a runner — because on 2026-09-04 this
# workflow selected two runs correctly, posted both cancels, reported
# `cancelled 4 run(s)`, and both runs sat `queued` holding the `main-pr` group for
# another 9 and 16 minutes (#1548). The `run:` block used to COUNT ITS OWN POSTS and
# call them cancellations; that is the one assertion that was true here while the
# outcome was false, so it moved to where fixtures can tell the two apart.
#
# DELIBERATELY `pull_request`, NOT `pull_request_target`. Cancelling needs
# `actions: write`, and AGENTS.md forbids pairing a write token with head code. The
# price is that a FORK PR gets a read-only token and the cancel no-ops for it; that is
# the right trade for a cost control (a gate would be a different discussion). Two
# places can carry that no-op and BOTH are written to report rather than fail: if the
# read-only token still grants `actions: read` the listing succeeds and every cancel
# POST comes back 403, which the `|| true` per run absorbs; if it does not, the listing
# itself fails and the branch above it says so and exits 0. Untested from a fork —
# this repository has no fork PR on record — so neither path is claimed as THE one.
#
# The checkout follows from the same decision, and it is pinned to the BASE SHA. Two
# reasons, one of which cost a red job before it was understood:
#
#   · A branch created before this script landed does not contain it. `set -euo
#     pipefail` then kills the job on `Cannot find module` — measured on #1340, whose
#     branch predated #1334 by hours and which therefore failed a job about its own
#     obsolete runs. Every future branch cut before a change to this script has the
#     same shape, so this is not a one-off transition cost.
#   · It carries the write-token argument FURTHER than the head SHA did. The job needs
#     `actions: write`, AGENTS.md forbids pairing a write token with head code, and the
#     head SHA was a compromise justified by sparseness — one script, from a branch
#     whose author already has write access. The base SHA is not a compromise: the job
#     materialises NO head code at all, and a fork PR now runs this repository's own
#     selection rather than the fork's.
#
# The base SHA is a real commit on the base branch and still resolves after the PR is
# closed, which is what ruled out the default merge ref. What it gives up is the ability
# for a PR to test a change to the selection ON ITSELF — that PR's own cancel job runs
# main's copy. `tests/e2e/ci-cancel-superseded-runs` is where such a change is proven,
# which is why it was put under fixtures rather than left in the `run:` block.

on:
    pull_request:
        types: [closed, synchronize]

# Only what the one API call needs.
permissions:
    actions: write
    contents: read

jobs:
    cancel:
        name: Cancel superseded runs for this PR
        runs-on: ubuntu-latest
        steps:
            - name: Check out the selection
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  fetch-depth: 1
                  sparse-checkout: |
                      scripts/select-superseded-runs.mjs
                      scripts/cancel-superseded-runs.mjs
                  sparse-checkout-cone-mode: false

            - name: Cancel the runs this event superseded
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  set -euo pipefail

                  # NARROWED TO THE BRANCH SERVER-SIDE, and that is not an optimisation.
                  # One page of `event=pull_request` runs is one page of the WHOLE
                  # repository: measured 2026-08-26, 100 rows spanned 3h04 of a 9973-run
                  # history, and about nine workflows answer a single push — so ten
                  # pushes fill the page. The run this trigger exists for had been
                  # superseded HOURS earlier and sat queued, which is precisely the row
                  # that falls off the end of a page sorted newest-first. `branch=` takes
                  # the same query to 9 rows. The selection still re-checks the branch:
                  # a filter that cannot be put under fixtures does not get to be the
                  # only thing deciding.
                  #
                  # `-f`, not string interpolation. The branch name is PR-controlled, gh
                  # URL-encodes field values, and it never becomes program text — the
                  # `--jq` filter this replaced took it straight into a jq program. The
                  # event and this job's own run id still reach the selection only
                  # through `$GITHUB_EVENT_PATH` and `$GITHUB_RUN_ID`.
                  if ! gh api -X GET "repos/${REPO}/actions/runs" \
                          -f event=pull_request \
                          -f branch="${HEAD_REF}" \
                          -f per_page=100 \
                          > "${RUNNER_TEMP}/runs.json"; then
                      echo "::notice::could not list this repository's runs. Nothing cancelled."
                      exit 0
                  fi

                  ids=$(node scripts/select-superseded-runs.mjs < "${RUNNER_TEMP}/runs.json")

                  # A HERE-STRING, not a pipe: the right-hand side of a pipeline runs
                  # in a subshell, so a non-zero exit there would not fail this step
                  # under `set -e` — the shape `.github/ship-oracle/verify-deb.sh`'s
                  # header spells out. The empty case is the script's own.
                  node scripts/cancel-superseded-runs.mjs <<<"${ids}"
