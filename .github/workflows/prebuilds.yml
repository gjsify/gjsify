      # -------- @gjsify/http2-native --------
      - name: Download http2-native x64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: http2-native-prebuilds-linux-x64
