          path: packages/infra/rolldown-native/prebuilds/linux-arm64/

      # -------- darwin-arm64 (macOS, Apple silicon) --------
      # rolldown-native, sab-native, webgl and webrtc-native have no darwin
      # artifact — see the rationale in build-prebuilds-macos above.
      - name: Download lightningcss-native darwin-arm64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: lightningcss-native-prebuilds-darwin-arm64
