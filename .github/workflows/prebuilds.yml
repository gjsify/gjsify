name: Build Native Prebuilds

# Two halves with different audiences — the same split `deploy-docs.yml` uses:
#
#   BUILD legs   — an ordinary check. They compile the Vala/meson sources and the
#                  Rust crates the `*-native` bridges link, and they run on
#                  `pull_request` TOO, so a change that cannot compile is caught
#                  before the merge instead of after it. main went red exactly
#                  that way: a Rust dependency-resolution break in
#                  @gjsify/oxfmt-native (a duplicate `oxc_allocator` crate
#                  identity, fixed in #827) appeared in NO PR check, and the fix
#                  PR could not prove itself either — its legs had to be
#                  dispatched by hand with `gh workflow run --ref`.
#   commit-prebuilds — main-only, by definition. It commits binaries back into
#                  the repository, which is a main-branch act and must never be
#                  reachable from a PR. Guarded twice over; see the job.
#
# WHICH legs run on a PR: every Linux one — native x64 + arm64 and the three
# QEMU legs. Only `build-prebuilds-macos` is held back (10x billing, a scarce
# shared concurrency pool, and the slowest leg here), with main.yml's `ci:macos`
# label as the opt-in. That is wider than the "native x86_64, Vala-only" shape
# STATUS.md once proposed, for two measured reasons:
#   • A Vala-only leg would have been GREEN on the very break that motivated
#     this — #827 was a Rust dependency-resolution failure in oxfmt-native. A PR
#     check that would not have caught its own motivating incident is worse than
#     none, so the Rust bridges are in.
#   • The emulated legs are kept because coverage of an architecture nobody can
#     otherwise test is worth more than PR latency, and they run in parallel
#     with the 8-15 min native legs. The "ppc64 3m00s / s390x 3m13s / riscv64
#     3m07s" figures once recorded here were not a measurement of emulation:
#     the legs were building x86-64 on the runner (see `build-prebuilds-qemu`),
#     so they timed nothing. The first fully-emulated run (#838, run
#     30310941686) measured them: ppc64 41m38s, s390x 38m54s, riscv64 96m47s.
#     They ARE the critical path, and one package is nearly all of it — see
#     the `changes` job.
#
# ONLY WHAT CHANGED IS BUILT. Every leg gates every package on the `changes`
# job below: a package is built when something it depends on changed, and
# otherwise its build AND its upload are skipped. The same rule on a pull
# request, on a push to main and on a dispatch — no event-based special-casing.
# `commit-prebuilds` gates its downloads on the identical decision, which is
# what keeps a skipped package's committed prebuild untouched rather than
# deleted (a missing artifact would otherwise FAIL the download step).
#
# The `prebuilds-summary` job prints what a given run did NOT cover — both the
# legs it skipped and the packages it skipped, with the reason — so a run that
# builds two of ten packages never reads like a full verification.
#
# `pull_request`, NOT `pull_request_target`. `pull_request_target` runs the BASE
# branch's workflow definition with a read/write token and repository secrets
# while checking out the PR's head code — precisely the combination that must
# not exist in a workflow that contains a job which pushes commits. Plain
# `pull_request` runs with a token GitHub forces to read-only for fork PRs, and
# the build legs need nothing more: they pull the PUBLIC `fedora:43` image, so
# unlike main.yml's private `ghcr.io/gjsify/ci-fedora` they also work on a fork
# PR. Least privilege backs that up rather than relying on it — see
# `permissions` below.
#
# Artifacts are uploaded and can be downloaded to commit into the repo before
# npm publish; on a PR they are the only CI-built copy of a binary that exists
# to compare a committed prebuild against, so they are NOT gated off there.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/framework/webgl/src/vala/**'
      - 'packages/framework/webgl/src/vapi/**'
      - 'packages/framework/webgl/meson.build'
      - 'packages/web/webrtc-native/src/vala/**'
      - 'packages/web/webrtc-native/meson.build'
      - 'packages/node/http-soup-bridge/src/vala/**'
      - 'packages/node/http-soup-bridge/meson.build'
      - 'packages/node/http2-native/src/vala/**'
      - 'packages/node/http2-native/meson.build'
      - 'packages/node/sab-native/src/vala/**'
      - 'packages/node/sab-native/meson.build'
      - 'packages/node/tls-native/src/vala/**'
      - 'packages/node/tls-native/src/c/**'
      - 'packages/node/tls-native/meson.build'
      - 'packages/node/terminal-native/src/vala/**'
      - 'packages/node/terminal-native/meson.build'
      - 'packages/infra/lightningcss-native/src/**'
      - 'packages/infra/lightningcss-native/meson.build'
      - 'packages/infra/oxfmt-native/src/**'
      - 'packages/infra/oxfmt-native/meson.build'
      - 'packages/infra/rolldown-native/src/**'
      - 'packages/infra/rolldown-native/meson.build'
      # The `refs/` submodule PINS the Rust bridges link by Cargo path
      # dependency. A gitlink change appears in a diff as the submodule path,
      # so these entries are what let a pin bump — which changes the binary
      # without touching one byte of the package — start this workflow at all.
      # Their absence was a silent never-rebuild; the `changes` job's
      # self-check fails if either list stops covering a linked submodule.
      - 'refs/oxc'
      - 'refs/rolldown'
      - '.github/workflows/prebuilds.yml'
      - '.github/prebuild-toolchain/**'
      # Shared scripts every build runs: staging (which target directory an
      # artifact lands in), the pin check, the loader-path verifier. A change
      # to one can change every artifact, so they trigger a run AND rebuild
      # every package (see the `changes` job's shared-input rule).
      #
      # `scripts/manifest-conformance/**` is here for the same reason and is
      # NOT optional: since #847 the three scripts above are thin CLI entry
      # points and the checks themselves live in that registry. Listing only
      # the entry points would mean editing what a build VERIFIES while
      # nothing rebuilds — the precise shape of silent staleness this gate
      # exists to prevent.
      - 'scripts/stage-prebuild.mjs'
      - 'scripts/check-refs-pin.mjs'
      - 'scripts/check-prebuild-loader-path.mjs'
      - 'scripts/manifest-conformance/**'

  # Repeated VERBATIM from `push` above — GitHub Actions supports no YAML
  # anchors, and the two lists MUST stay identical: a path that can change a
  # prebuild on main is a path that has to be able to prove itself on a PR.
  # `deploy-docs.yml` is the model.
  pull_request:
    paths:
      - 'packages/framework/webgl/src/vala/**'
      - 'packages/framework/webgl/src/vapi/**'
      - 'packages/framework/webgl/meson.build'
      - 'packages/web/webrtc-native/src/vala/**'
      - 'packages/web/webrtc-native/meson.build'
      - 'packages/node/http-soup-bridge/src/vala/**'
      - 'packages/node/http-soup-bridge/meson.build'
      - 'packages/node/http2-native/src/vala/**'
      - 'packages/node/http2-native/meson.build'
      - 'packages/node/sab-native/src/vala/**'
      - 'packages/node/sab-native/meson.build'
      - 'packages/node/tls-native/src/vala/**'
      - 'packages/node/tls-native/src/c/**'
      - 'packages/node/tls-native/meson.build'
      - 'packages/node/terminal-native/src/vala/**'
      - 'packages/node/terminal-native/meson.build'
      - 'packages/infra/lightningcss-native/src/**'
      - 'packages/infra/lightningcss-native/meson.build'
      - 'packages/infra/oxfmt-native/src/**'
      - 'packages/infra/oxfmt-native/meson.build'
      - 'packages/infra/rolldown-native/src/**'
      - 'packages/infra/rolldown-native/meson.build'
      - 'refs/oxc'
      - 'refs/rolldown'
      - '.github/workflows/prebuilds.yml'
      - '.github/prebuild-toolchain/**'
      - 'scripts/stage-prebuild.mjs'
      - 'scripts/check-refs-pin.mjs'
      - 'scripts/check-prebuild-loader-path.mjs'
      - 'scripts/manifest-conformance/**'

# Least privilege at the workflow level; each job adds only what it needs. This
# is what keeps the new PR trigger from ever handing a write-capable token to a
# job that builds head code: only `commit-prebuilds` widens to `contents: write`,
# and it cannot run on a `pull_request` event.
permissions:
  contents: read

# A PR that is pushed twice must not pay for two full Rust builds, so PR runs
# get a per-ref group that cancels itself. Non-PR runs keep exactly today's
# behaviour — their own group per run, never cancelled — because a main run
# commits prebuilds back and must be allowed to finish. (Keying the non-PR
# group by `run_id` is what keeps a dispatched verification run from cancelling
# an in-flight main run, and vice versa.)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('prebuilds-pr-{0}', github.ref) || format('prebuilds-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------------------
  # Which packages does this change set actually affect?
  #
  # Decided ONCE, here, and consumed by every leg and by `commit-prebuilds`, so
  # a build and the commit that ships it can never disagree about what was
  # produced. The rule is uniform across events — pull request, push to main,
  # dispatch: a package is built when something it depends on changed.
  #
  # WHY NOT `gjsify affected` (packages/infra/cli/dist/affected.gjs.mjs), the
  # classifier `main.yml` already runs. It was the first thing checked, and it
  # does not fit — for two independent reasons, either of which alone is fatal:
  #
  #   • It cannot see a submodule pin. `refs/**` is the FIRST entry of its
  #     IGNORE table (dropped before every other rule), and it ignores every
  #     workflow file except `main.yml` — including this one. Both of those are
  #     inputs to a prebuild, so the one classifier we have is structurally
  #     blind to two of the three things this gate exists to notice.
  #   • Its graph is the wrong graph. It walks the npm workspace's
  #     production-dependency edges to answer "whose TESTS must re-run". A
  #     native prebuild's inputs are Vala/C/Rust sources, `meson.build` and a
  #     pinned submodule — none of which that graph models. It would be wrong
  #     in both directions: an edit to a package `@gjsify/lightningcss-native`
  #     depends on would put it in the closure and rebuild a 32-minute cdylib
  #     whose sources did not change, while a `refs/rolldown` bump would leave
  #     `@gjsify/rolldown-native` out of it entirely.
  #
  # So this uses path matching — but it does not hand-write a second copy of
  # the path table: `changed-packages.mjs` DERIVES the package set from this
  # workflow's own `path: packages/…/prebuilds/…` steps and each package's
  # source globs from this workflow's own `on: paths:` filter, then adds the
  # `refs/` submodules from `gjsify.refsLockstep` + the package's Cargo path
  # dependencies. It fails loudly if the gate and the trigger ever disagree.
  # Full rationale, and what it deliberately cannot see, in that file's header.
  # ----------------------------------------------------------------
  changes:
    name: Detect affected prebuild packages
    runs-on: ubuntu-latest
    outputs:
      # A JSON array of the package keys NOT to build, e.g. `["oxfmt-native"]`.
      #
      # SKIP, not build, and matched with `contains()` on the raw string rather
      # than `fromJSON(...)`, because the failure mode has to be BUILD. An
      # unset output (job failed, output renamed, key missing) is the empty
      # string; `contains('', '"webgl"')` is false, so `!contains(...)` is true
      # and the package builds. The inverse — gating on a build list — would
      # turn every one of those into a silent skip, which is the one outcome
      # worse than the problem being solved. The keys are quoted inside the
      # JSON, so `'"http2-native"'` cannot match `"http2-native-x"`.
      skip: ${{ steps.detect.outputs.skip }}
      build: ${{ steps.detect.outputs.build }}
      reason: ${{ steps.detect.outputs.reason }}
      report: ${{ steps.detect.outputs.report }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The diff base has to be a commit this checkout actually has.
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        env:
          # Via `env:`, never interpolated into the script body — these are
          # event-controlled values.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)         base="$PUSH_BEFORE" ;;
            # A dispatch has no "previous state" to diff against, so it builds
            # everything — which also makes it the documented escape hatch for
            # rebuilding a package whose floating crates.io dependencies moved
            # without anything in this repository changing.
            *)            base="" ;;
          esac
          # An all-zero SHA is what a branch's first push reports, and a
          # force-push can leave a base this checkout does not contain.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=""
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Classify
        id: detect
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -uo pipefail
          if [ -n "$BASE" ]; then
            set -- --base "$BASE" --head "$GITHUB_SHA"
          else
            set -- --all
          fi
          if ! node .github/prebuild-toolchain/changed-packages.mjs "$@" --format=github-actions; then
            # FAIL OPEN, loudly. A classifier that cannot decide must not be
            # able to skip anything — the cost of being wrong here is a stale
            # committed binary, not a slow run.
            echo "::warning::changed-packages.mjs failed — building every package."
            {
              echo 'skip=[]'
              echo 'build=[]'
              echo 'reason=classifier failed; building everything'
              echo 'report=[]'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Restate the decision in the job log
        env:
          REASON: ${{ steps.detect.outputs.reason }}
          SKIP: ${{ steps.detect.outputs.skip }}
        run: |
          echo "reason: $REASON"
          echo "skipped: $SKIP"

  # ----------------------------------------------------------------
  # Native runners — x64 and arm64
  #
  # `matrix.arch` IS the prebuild directory suffix, so it is spelled the way
  # `process.arch` spells it (`x64`/`arm64`, not `uname -m`'s
  # `x86_64`/`aarch64`). That is the single `<os>-<arch>` vocabulary:
  # `package.json#gjsify.platforms` declares it, `scripts/stage-prebuild.mjs`
  # creates it, the CLI's `detectNativePackages()` resolves it without
  # translating, and `scripts/audit-runtimes.mjs --check` rejects anything else.
  #
  # The matrix stays a STATIC `include:` and both legs run on every event,
  # including `pull_request`. Two reasons, and the second is the load-bearing
  # one:
  #   • Cost — the legs run in PARALLEL, so dropping arm64 saves no PR latency
  #     at all; measured, the whole leg (7 Vala packages + the lightningcss,
  #     oxfmt and rolldown Rust builds) took 8m30s-15m05s across observed
  #     runs.
  #   • `scripts/audit-runtimes.mjs --check` READS THIS BLOCK. It learns which
  #     `<os>-<arch>` targets CI produces by scanning each job for `runs-on` and
  #     `arch:` matrix entries, and fails any package whose `gjsify.platforms`
  #     declares a target no job builds. An expression-driven matrix
  #     (`include: ${{ fromJSON(…) }}`) hides the arch tokens from that parser,
  #     which turns the declared-vs-built symmetry into a false failure on all
  #     ten native packages. If this ever has to become dynamic, teach
  #     `parseCiPlatforms()` the new shape in the SAME change.
  # ----------------------------------------------------------------
  build-prebuilds:
    name: Build prebuilds (${{ matrix.arch }})
    needs: [changes]
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:43

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Install prerequisites
        # gstreamer*-devel packages provide the .pc files for gstreamer-sdp-1.0
        # and gstreamer-webrtc-1.0 that @gjsify/webrtc-native needs at Vala build time.
        # libsoup3-devel is needed by @gjsify/http-soup-bridge for libsoup-3.0.
        # libnghttp2-devel is needed by @gjsify/http2-native for the HPACK / frame
        # encoder shim wrapping nghttp2.
        # gnutls-devel provides the gnutls.pc + gnutls/ocsp.h that
        # @gjsify/tls-native needs for OCSP-response parsing.
        # `curl` is needed by rustup-init below.
        run: >
          dnf install -y
          git tar xz findutils curl
          meson vala gcc pkgconf
          glib2-devel gobject-introspection-devel
          gtk4-devel gdk-pixbuf2-devel
          libepoxy-devel
          gstreamer1-devel
          gstreamer1-plugins-base-devel
          gstreamer1-plugins-bad-free-devel
          libsoup3-devel
          libnghttp2-devel
          gnutls-devel
          json-glib-devel

      - name: Install Rust toolchain (rustup, stable)
        # Only the three Rust bridges need it, so it follows the same gate they
        # do: a run that rebuilds only Vala bridges pays nothing for a toolchain
        # nothing will invoke.
        if: >-
          ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"')
          || !contains(needs.changes.outputs.skip, '"oxfmt-native"')
          || !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        # Fedora 43's `dnf install cargo` ships rustc ~1.79 — too old for
        # the lightningcss/rolldown crate trees that pull `indexmap@2.14`
        # which requires `edition2024` (rustc ≥ 1.85). Install rustup
        # directly for a current toolchain.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Checkout repository
        uses: actions/checkout@v6

      # -------- @gjsify/webgl (gwebgl) --------
      - name: Build @gjsify/webgl Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/framework/webgl
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/webgl prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/framework/webgl
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "prebuilds/linux-${ARCH}"
          cp build/libgwebgl.so build/Gwebgl-0.1.typelib "prebuilds/linux-${ARCH}/"
          echo "@gjsify/webgl prebuilds for linux-${ARCH}:"
          ls -lh "prebuilds/linux-${ARCH}/"

      - name: Upload @gjsify/webgl prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webgl-prebuilds-linux-${{ matrix.arch }}
          path: packages/framework/webgl/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/webrtc-native (GjsifyWebrtc) --------
      - name: Build @gjsify/webrtc-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"webrtc-native"') }}
        working-directory: packages/web/webrtc-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/webrtc-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webrtc-native"') }}
        working-directory: packages/web/webrtc-native
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "prebuilds/linux-${ARCH}"
          cp build/libgjsifywebrtc.so build/GjsifyWebrtc-0.1.typelib "prebuilds/linux-${ARCH}/"
          echo "@gjsify/webrtc-native prebuilds for linux-${ARCH}:"
          ls -lh "prebuilds/linux-${ARCH}/"

      - name: Upload @gjsify/webrtc-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webrtc-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webrtc-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/web/webrtc-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/http-soup-bridge (GjsifyHttpSoupBridge) --------
      - name: Build @gjsify/http-soup-bridge Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        working-directory: packages/node/http-soup-bridge
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/http-soup-bridge prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        working-directory: packages/node/http-soup-bridge
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "prebuilds/linux-${ARCH}"
          cp build/libgjsifyhttpsoupbridge.so build/GjsifyHttpSoupBridge-1.0.gir build/GjsifyHttpSoupBridge-1.0.typelib "prebuilds/linux-${ARCH}/"
          echo "@gjsify/http-soup-bridge prebuilds for linux-${ARCH}:"
          ls -lh "prebuilds/linux-${ARCH}/"

      - name: Upload @gjsify/http-soup-bridge prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http-soup-bridge-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/http-soup-bridge/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/http2-native (GjsifyHttp2) --------
      - name: Build @gjsify/http2-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        working-directory: packages/node/http2-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/http2-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        working-directory: packages/node/http2-native
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "prebuilds/linux-${ARCH}"
          cp build/libgjsifyhttp2.so build/GjsifyHttp2-1.0.gir build/GjsifyHttp2-1.0.typelib "prebuilds/linux-${ARCH}/"
          echo "@gjsify/http2-native prebuilds for linux-${ARCH}:"
          ls -lh "prebuilds/linux-${ARCH}/"

      - name: Upload @gjsify/http2-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http2-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/http2-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/sab-native (GjsifySabNative) --------
      # Pure libc (memfd_create, mmap, futex, socketpair, SCM_RIGHTS) — no
      # external libraries. Backs cross-process SharedBuffer for
      # @gjsify/worker_threads.
      - name: Build @gjsify/sab-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"sab-native"') }}
        working-directory: packages/node/sab-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/sab-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"sab-native"') }}
        working-directory: packages/node/sab-native
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "prebuilds/linux-${ARCH}"
          cp build/libgjsifysabnative.so build/GjsifySabNative-1.0.gir build/GjsifySabNative-1.0.typelib "prebuilds/linux-${ARCH}/"
          echo "@gjsify/sab-native prebuilds for linux-${ARCH}:"
          ls -lh "prebuilds/linux-${ARCH}/"

      - name: Upload @gjsify/sab-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"sab-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: sab-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/sab-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/tls-native (GjsifyTls) --------
      # Vala bridge over GnuTLS's OCSP-response parser (gnutls_ocsp_resp_*),
      # since Vala 0.56's bundled gnutls.vapi has no OCSP declarations.
      # gnutls-devel provides the .pc + headers; the sibling vapi
      # (`src/vala/gnutls-ocsp.vapi`) wires the missing declarations.
      - name: Build @gjsify/tls-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        working-directory: packages/node/tls-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/tls-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        working-directory: packages/node/tls-native
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "prebuilds/linux-${ARCH}"
          cp build/libgjsifytls.so build/GjsifyTls-1.0.gir build/GjsifyTls-1.0.typelib "prebuilds/linux-${ARCH}/"
          echo "@gjsify/tls-native prebuilds for linux-${ARCH}:"
          ls -lh "prebuilds/linux-${ARCH}/"

      - name: Upload @gjsify/tls-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: tls-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/tls-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/terminal-native (GjsifyTerminal) --------
      # Plain POSIX (isatty / ioctl TIOCGWINSZ / termios) + GLib — no external
      # libraries, so this is the cheapest bridge in the matrix (~30 s). It backs
      # @gjsify/tty + @gjsify/process, yet used to be absent from this workflow
      # entirely: its prebuilds/ held a hand-built x64-only drop and nothing
      # else, so arm64 (and every QEMU arch) silently had no native TTY support.
      - name: Build @gjsify/terminal-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        working-directory: packages/node/terminal-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/terminal-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        working-directory: packages/node/terminal-native
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "prebuilds/linux-${ARCH}"
          cp build/libgjsifyterminal.so build/GjsifyTerminal-1.0.gir build/GjsifyTerminal-1.0.typelib "prebuilds/linux-${ARCH}/"
          echo "@gjsify/terminal-native prebuilds for linux-${ARCH}:"
          ls -lh "prebuilds/linux-${ARCH}/"

      - name: Upload @gjsify/terminal-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/terminal-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/lightningcss-native (GjsifyLightningcss) --------
      # Pure Rust + Vala; depends on `lightningcss = "1"` from crates.io,
      # no submodule needed. cargo first downloads + compiles the crate
      # graph (~7 min cold on a fresh runner), then meson links the Vala
      # bridge against the resulting cdylib.
      - name: Build @gjsify/lightningcss-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        working-directory: packages/infra/lightningcss-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/lightningcss-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        working-directory: packages/infra/lightningcss-native
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "prebuilds/linux-${ARCH}"
          cp build/libgjsifylightningcss.so build/libgjsify_lightningcss.so build/GjsifyLightningcss-1.0.gir build/GjsifyLightningcss-1.0.typelib "prebuilds/linux-${ARCH}/"
          echo "@gjsify/lightningcss-native prebuilds for linux-${ARCH}:"
          ls -lh "prebuilds/linux-${ARCH}/"

      - name: Upload @gjsify/lightningcss-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: lightningcss-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/infra/lightningcss-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/oxfmt-native (GjsifyOxfmt) --------
      # The third member of the GJS engine set `installGjsEnginePackages()`
      # lays down (with rolldown-native + lightningcss-native), but it was never
      # built here — its prebuilds/ held a hand-built x64-only drop.
      # Like rolldown-native it path-deps into a submodule (refs/oxc, pinned to
      # the oxfmt_v* tag matching the workspace's npm `oxfmt`), because oxc's
      # formatter crates are not consumable from crates.io.
      - name: Init refs/oxc submodule (oxfmt-native source dep)
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive refs/oxc

      - name: Build @gjsify/oxfmt-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        working-directory: packages/infra/oxfmt-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/oxfmt-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        working-directory: packages/infra/oxfmt-native
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "prebuilds/linux-${ARCH}"
          cp build/libgjsifyoxfmt.so build/libgjsify_oxfmt.so build/GjsifyOxfmt-1.0.gir build/GjsifyOxfmt-1.0.typelib "prebuilds/linux-${ARCH}/"
          echo "@gjsify/oxfmt-native prebuilds for linux-${ARCH}:"
          ls -lh "prebuilds/linux-${ARCH}/"

      - name: Upload @gjsify/oxfmt-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: oxfmt-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/infra/oxfmt-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/rolldown-native (GjsifyRolldown) --------
      # Heavier than lightningcss-native: depends on the `refs/rolldown`
      # submodule (rolldown 0.1.0 on crates.io has broken transitive
      # deps — see packages/infra/rolldown-native/src/rust/Cargo.toml).
      # cold cargo build is ~5 min CPU on x86_64. Submodule init alone
      # downloads several hundred MB.
      - name: Init refs/rolldown submodule (rolldown-native source dep)
        # Several hundred MB of clone, so it is gated like the build it feeds.
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        # GitHub-Actions Fedora containers run as root while the
        # repo is bind-mounted as a different uid → git refuses with
        # "dubious ownership" unless the dir is whitelisted. Mirror
        # the same `safe.directory` workaround the other Fedora
        # workflows use before invoking submodule update.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive refs/rolldown

      - name: Build @gjsify/rolldown-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        working-directory: packages/infra/rolldown-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/rolldown-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        working-directory: packages/infra/rolldown-native
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "prebuilds/linux-${ARCH}"
          cp build/libgjsifyrolldown.so build/libgjsify_rolldown.so build/GjsifyRolldown-1.0.gir build/GjsifyRolldown-1.0.typelib "prebuilds/linux-${ARCH}/"
          echo "@gjsify/rolldown-native prebuilds for linux-${ARCH}:"
          ls -lh "prebuilds/linux-${ARCH}/"

      - name: Upload @gjsify/rolldown-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: rolldown-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/infra/rolldown-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

  # ----------------------------------------------------------------
  # QEMU-emulated builds — ppc64, s390x, riscv64
  #
  # All three run on ubuntu-latest host runners under qemu-user binfmt
  # emulation, registered at a PINNED version (see the step below) and driven
  # by a plain `docker run --platform`.
  #
  # ppc64 + s390x: fedora:43 has official images for both → same dnf
  #   package names as the native job above.
  # riscv64: fedora:43 has no riscv64 image → ubuntu:26.04 is used
  #   instead (package names differ; auto-detected via command -v dnf).
  #
  # Node.js process.arch values used as the prebuilds/ dir suffix:
  #   ppc64le (QEMU) → process.arch 'ppc64'  → prebuilds/linux-ppc64/
  #   s390x          → process.arch 's390x'  → prebuilds/linux-s390x/
  #   riscv64        → process.arch 'riscv64'→ prebuilds/linux-riscv64/
  # ----------------------------------------------------------------
  # These run on `pull_request` too, and stay on: an architecture nobody on the
  # team owns hardware for is exactly the one whose build must be checked before
  # merge, not after.
  #
  # COST, measured rather than assumed. The "~3 min per emulated leg" this
  # comment used to carry was an artifact of the platform bug fixed below — the
  # legs compiled x86-64 on the runner, so they timed no emulation at all. Under
  # real qemu-user (measured locally, ppc64le, qemu 10.2.2): the dependency
  # install is ~6 min and the seven Vala/GI packages are minutes; the
  # lightningcss Rust cdylib is the one expensive step. If a leg's total makes
  # it the PR critical path, the lever is to drop THAT package from the
  # emulated legs (its crate graph is portable and every PR already compiles it
  # on x64 + arm64) rather than to drop the architecture — the Vala/GI half is
  # the part the architecture actually changes, and it is the cheap part.
  build-prebuilds-qemu:
    name: Build prebuilds (${{ matrix.arch }}) [QEMU]
    needs: [changes]
    runs-on: ubuntu-latest
    # No `packages: write` — nothing here pushes to GHCR any more. The image
    # cache the removed action kept there was also the reason all three legs
    # collided on one `…-none-none` tag once the platform was set explicitly.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # IBM POWER9/10 workstations and servers (e.g. Raptor Computing Talos II)
          - arch: ppc64
            platform: linux/ppc64le
            base_image: fedora:43

          # IBM Z mainframes — enterprise Linux servers
          - arch: s390x
            platform: linux/s390x
            base_image: fedora:43

          # RISC-V boards (StarFive VisionFive 2, Milk-V Pioneer, SiFive HiFive, …)
          # ubuntu:26.04 because Fedora publishes no riscv64 image.
          - arch: riscv64
            platform: linux/riscv64
            base_image: ubuntu:26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # THE EMULATOR VERSION IS PART OF THE BUILD, SO IT IS PINNED.
      #
      # This job used `uraimo/run-on-arch-action`, which ignores its own `arch`
      # input whenever a custom `base_image` is supplied (its README says so) —
      # so every "emulated" leg ran the image for the RUNNER's platform and
      # compiled x86-64 into `prebuilds/linux-{ppc64,s390x,riscv64}/`. That is
      # the defect `audit-runtimes --check`'s machine-vs-directory invariant
      # now rejects.
      #
      # Supplying the platform explicitly exposed the second half: the action
      # ALSO resets binfmt to `multiarch/qemu-user-static` (qemu 7.2,
      # effectively unmaintained) before it builds, and under THAT emulator
      # Fedora's package manager does not survive — `dnf` segfaults on s390x
      # and the RPM transaction fails on ppc64. Both build cleanly under a
      # current qemu (verified locally against qemu 10.2.2: a real
      # `ELF 64-bit MSB … IBM S/390` library out of the s390x container), so
      # the emulator is pinned here like any other toolchain component and the
      # action is gone.
      - name: Register QEMU for ${{ matrix.platform }}
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
          platforms: ${{ matrix.platform }}

      # One `docker run` in the target-arch image. The script is a real file so
      # a failure reproduces by hand with `podman run --platform …`, which is
      # how the qemu-version root cause above was found. Package names stay in
      # THIS file via the per-package upload steps below — that is what
      # `audit-runtimes`' `parseCiPlatforms()` reads to learn which targets
      # this job produces, and it must keep seeing them here.
      #
      # GATING inside one step, not around it: the emulated build is a SINGLE
      # step covering every package, so the per-package decision has to travel
      # INTO the container. `PREBUILD_SKIP` carries the `changes` job's JSON
      # array verbatim and `emulated-build.sh` filters `build_pkg` against it —
      # including the dependency install, whose Rust half is only fetched when
      # a Rust bridge is actually in the list.
      #
      # The step still runs when everything is skipped. That is deliberate: the
      # ~20 s it costs buys back the invariant that `commit-prebuilds` depends
      # on this JOB succeeding, and a job that skipped itself would take the
      # commit down with it (see the `needs` comment there).
      - name: Build all prebuilds on ${{ matrix.arch }} via QEMU
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          BASE_IMAGE: ${{ matrix.base_image }}
          PREBUILD_SKIP: ${{ needs.changes.outputs.skip }}
        run: |
          set -euo pipefail
          docker run --rm --platform "$PLATFORM" \
            -v "$PWD:/workspace" -w /workspace \
            -e ARCH="$ARCH" \
            -e PREBUILD_SKIP="$PREBUILD_SKIP" \
            "$BASE_IMAGE" \
            bash .github/prebuild-toolchain/emulated-build.sh

      # The build ran as root inside the container, so the staged files are
      # root-owned on the runner. Hand them back before anything else reads
      # them.
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" packages || true

      - name: Upload @gjsify/webgl prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webgl-prebuilds-linux-${{ matrix.arch }}
          path: packages/framework/webgl/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/webrtc-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webrtc-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webrtc-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/web/webrtc-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/http-soup-bridge prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http-soup-bridge-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/http-soup-bridge/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/http2-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http2-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/http2-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/sab-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"sab-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: sab-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/sab-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/tls-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: tls-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/tls-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/lightningcss-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: lightningcss-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/infra/lightningcss-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/terminal-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/terminal-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

  # ----------------------------------------------------------------
  # macOS (Apple silicon) — prebuilds/darwin-arm64
  #
  # Until this job existed, EVERY native bridge shipped linux-<arch> only, which
  # made the Node-free gjsify toolchain a Linux-only feature: `gjsify install -g`
  # lays down @gjsify/{rolldown,lightningcss,oxfmt}-native, and on macOS none of
  # the three had an artifact to install.
  #
  # Toolchain: Homebrew, mirroring the `macos` job in napi.yml (the reference
  # macOS leg in this repo). These bridges are LIGHTER than napi's — they need
  # glib/gobject-introspection/vala/meson (+ one library each), not libgjs and
  # mozjs-140 — so there is no source build anywhere in this job.
  #
  # WHAT IS DELIBERATELY NOT HERE, and why (each is a hard blocker, not an
  # oversight — do not "fix" one by adding it to the matrix):
  #
  #   • @gjsify/rolldown-native — the Rust blocker is GONE (the three
  #     `libc::eventfd(2)` descriptors became portable anonymous pipes in
  #     src/rust/src/wakeup.rs, and `cargo check --target aarch64-apple-darwin`
  #     passes), and meson.build is darwin-ready. It is not in the REQUIRED
  #     matrix only because nothing has yet LINKED it on a real macOS host,
  #     generated its typelib, or loaded it under Homebrew `gjs` — and it needs
  #     `json-glib` on top of this job's brew closure plus
  #     `git submodule update --init refs/rolldown` and a rustup toolchain.
  #     It is wired into the manual-dispatch experimental job below; promote it
  #     here once that comes back green.
  #     CONSEQUENCE UNTIL THEN: `gjsify build` still has no engine on macOS —
  #     this job closes the format/CSS half of the toolchain, not the bundler half.
  #
  #   • @gjsify/sab-native — built on `memfd_create`, Linux `futex` and
  #     `SCM_RIGHTS`. It is Linux-only BY DESIGN; the portability decision for it
  #     is owned elsewhere. Do not add it here.
  #
  #   • @gjsify/webgl and @gjsify/webrtc-native — NOT blocked, just unverified.
  #     They pull the two heaviest macOS toolchains (gtk4 + libepoxy; the unified
  #     `gstreamer` formula for gstreamer-sdp-1.0 + gstreamer-webrtc-1.0), and
  #     GTK4's macOS backend caps at desktop GL 4.1 via CGL — no GLES 3.2, which
  #     is what the webgl Vala bridge targets. Rather than gamble a red required
  #     job on an unverified brew closure, they get the manual-dispatch
  #     `build-prebuilds-macos-experimental` job below.
  #
  # NAMING: `darwin-arm64` — the `${process.platform}-${process.arch}` convention
  # every job in this workflow now uses, on every OS (`linux-x64`, `linux-arm64`,
  # `darwin-arm64`). The CLI's loader resolves it without translating, because it
  # is exactly what a running process computes about itself; `buildNativeEnv()`
  # then emits the loader variable the host actually reads (`DYLD_LIBRARY_PATH`
  # on darwin — dyld ignores the ELF one). See
  # packages/infra/cli/src/utils/detect-native-packages.ts.
  # ----------------------------------------------------------------
  build-prebuilds-macos:
    name: Build prebuilds (darwin-arm64)
    # THE one cost control on a PR, and the only leg a green PR does not cover.
    # macOS runners bill at 10x and come from a small concurrency pool this repo
    # already shares between main.yml and napi.yml, and this is the slowest leg
    # in the workflow (a whole Homebrew closure before anything compiles).
    # Same shape and same escape hatch as main.yml's macOS job: label a PR
    # `ci:macos` to opt it in — do that for anything touching a per-platform
    # path (`meson.build` darwin branches, the Homebrew closure, a `.dylib`
    # leaf). The `prebuilds-summary` job names this leg as NOT covered on every
    # run that skips it, so a green PR cannot read as full coverage.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:macos')
    needs: [changes]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      # process.platform-process.arch for an Apple-silicon runner.
      PREBUILD: darwin-arm64
      # The `changes` job's decision, for the VERIFY steps below. They walk a
      # list of package directories rather than a single `working-directory`,
      # so they cannot carry a step-level `if:` — each one filters its own list
      # instead. Filtering is not cosmetic: the committed `prebuilds/darwin-arm64/`
      # of a skipped package is present in the checkout, so an unfiltered loop
      # would happily load-test a binary this run did not build and report it as
      # this run's coverage.
      PREBUILD_SKIP: ${{ needs.changes.outputs.skip }}

    steps:
      - name: Install GI toolchain + per-bridge libraries (Homebrew)
        run: |
          set -euo pipefail
          # gobject-introspection pulls glib (glib-2.0/gobject-2.0/gio-2.0 .pc)
          # and provides g-ir-compiler, which turns valac's .gir into a .typelib.
          # g-ir-scanner is never invoked — `vala_gir:` makes valac emit the GIR
          # directly — so no binary has to be introspected at build time.
          #   gnutls   → @gjsify/tls-native
          #   libsoup  → @gjsify/http-soup-bridge (needs >= 3.6)
          #   libnghttp2 → @gjsify/http2-native
          brew install gobject-introspection vala meson ninja pkgconf gnutls libsoup libnghttp2
          BREW_PREFIX="$(brew --prefix)"
          # libnghttp2 is keg-only on macOS (the OS ships its own copy for curl),
          # so it is NOT symlinked into the brew prefix. http2-native reaches it
          # through `cc.find_library('nghttp2', has_headers: [...])` rather than
          # pkg-config, which searches only the compiler's default paths — hence
          # the explicit CPPFLAGS/LDFLAGS. meson reads all three of these at
          # `meson setup` time.
          NGHTTP2_PREFIX="$(brew --prefix libnghttp2)"
          {
            echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/share/pkgconfig:${NGHTTP2_PREFIX}/lib/pkgconfig"
            echo "CPPFLAGS=-I${NGHTTP2_PREFIX}/include"
            echo "LDFLAGS=-L${NGHTTP2_PREFIX}/lib"
          } >> "$GITHUB_ENV"

      - name: Ensure a current Rust toolchain
        if: >-
          ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"')
          || !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        # lightningcss-native / oxfmt-native need rustc >= 1.85 (edition2024 in
        # the transitive graph). macOS runners preinstall rustup, so re-running
        # rustup-init would fail; install/refresh the stable toolchain instead
        # and fall back to rustup-init only if rustup is genuinely absent.
        run: |
          set -euo pipefail
          if command -v rustup > /dev/null 2>&1; then
            rustup toolchain install stable --profile minimal
            rustup default stable
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify toolchain
        run: |
          valac --version
          meson --version
          g-ir-compiler --version || true
          cargo --version
          echo "gnutls:      $(pkg-config --modversion gnutls)"
          echo "libsoup-3.0: $(pkg-config --modversion libsoup-3.0)"

      - name: Checkout repository
        uses: actions/checkout@v6

      # -------- @gjsify/lightningcss-native (GjsifyLightningcss) --------
      # Pure crates.io deps (no submodule) — the easiest Rust bridge to port.
      - name: Build @gjsify/lightningcss-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        working-directory: packages/infra/lightningcss-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/lightningcss-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        working-directory: packages/infra/lightningcss-native
        run: |
          mkdir -p "prebuilds/${PREBUILD}"
          cp build/libgjsifylightningcss.dylib build/libgjsify_lightningcss.dylib \
             build/GjsifyLightningcss-1.0.gir build/GjsifyLightningcss-1.0.typelib "prebuilds/${PREBUILD}/"
          ls -lh "prebuilds/${PREBUILD}/"

      # -------- @gjsify/oxfmt-native (GjsifyOxfmt) --------
      - name: Init refs/oxc submodule (oxfmt-native source dep)
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        run: git submodule update --init --recursive refs/oxc

      - name: Build @gjsify/oxfmt-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        working-directory: packages/infra/oxfmt-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/oxfmt-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        working-directory: packages/infra/oxfmt-native
        run: |
          mkdir -p "prebuilds/${PREBUILD}"
          cp build/libgjsifyoxfmt.dylib build/libgjsify_oxfmt.dylib \
             build/GjsifyOxfmt-1.0.gir build/GjsifyOxfmt-1.0.typelib "prebuilds/${PREBUILD}/"
          ls -lh "prebuilds/${PREBUILD}/"

      # -------- @gjsify/terminal-native (GjsifyTerminal) --------
      # Plain POSIX; the only Linux dependency it had was Vala's `linux.vapi`
      # (`Linux.winsize` / `Linux.Termios.TIOCGWINSZ`), now replaced by the
      # portable sibling src/vala/terminal-compat.vapi.
      - name: Build @gjsify/terminal-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        working-directory: packages/node/terminal-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/terminal-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        working-directory: packages/node/terminal-native
        run: |
          mkdir -p "prebuilds/${PREBUILD}"
          cp build/libgjsifyterminal.dylib build/GjsifyTerminal-1.0.gir build/GjsifyTerminal-1.0.typelib "prebuilds/${PREBUILD}/"
          ls -lh "prebuilds/${PREBUILD}/"

      # -------- @gjsify/tls-native (GjsifyTls) --------
      # Builds against gnutls headers only. Its Phase-2 SessionAccess reaches
      # into glib-networking's GTlsConnectionGnutls private struct at RUNTIME;
      # where that backend is absent, `is_supported()` reports false and the API
      # degrades to the documented undefined/false/no-op contract — so a macOS
      # prebuild is still correct, it just may expose Phase 1 (OCSP) only.
      - name: Build @gjsify/tls-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        working-directory: packages/node/tls-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/tls-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        working-directory: packages/node/tls-native
        run: |
          mkdir -p "prebuilds/${PREBUILD}"
          cp build/libgjsifytls.dylib build/GjsifyTls-1.0.gir build/GjsifyTls-1.0.typelib "prebuilds/${PREBUILD}/"
          ls -lh "prebuilds/${PREBUILD}/"

      # -------- @gjsify/http-soup-bridge (GjsifyHttpSoupBridge) --------
      - name: Build @gjsify/http-soup-bridge Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        working-directory: packages/node/http-soup-bridge
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/http-soup-bridge prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        working-directory: packages/node/http-soup-bridge
        run: |
          mkdir -p "prebuilds/${PREBUILD}"
          cp build/libgjsifyhttpsoupbridge.dylib build/GjsifyHttpSoupBridge-1.0.gir \
             build/GjsifyHttpSoupBridge-1.0.typelib "prebuilds/${PREBUILD}/"
          ls -lh "prebuilds/${PREBUILD}/"

      # -------- @gjsify/http2-native (GjsifyHttp2) --------
      - name: Build @gjsify/http2-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        working-directory: packages/node/http2-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/http2-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        working-directory: packages/node/http2-native
        run: |
          mkdir -p "prebuilds/${PREBUILD}"
          cp build/libgjsifyhttp2.dylib build/GjsifyHttp2-1.0.gir build/GjsifyHttp2-1.0.typelib "prebuilds/${PREBUILD}/"
          ls -lh "prebuilds/${PREBUILD}/"

      # A typelib whose recorded shared-library leaf still says `.so` is found via
      # GI_TYPELIB_PATH but never loads — the exact silent failure this job's
      # meson `host_machine.system()` branches exist to prevent. Assert it once
      # here so a regression fails the build instead of shipping a dead prebuild.
      - name: Verify every typelib records a .dylib leaf
        run: |
          set -euo pipefail
          # Shared by every verify step in this job: did THIS run build it?
          # Keyed on the directory basename, the key `changed-packages.mjs`
          # emits, quoted so `"http2-native"` cannot match `"http2-native-x"`.
          # An unset/empty PREBUILD_SKIP verifies everything, which is the same
          # fail-open direction the `if:` gates take.
          built() { case "${PREBUILD_SKIP:-}" in *"\"${1##*/}\""*) return 1 ;; *) return 0 ;; esac; }
          # `rc`, not `status`: `status` is a read-only special variable in zsh,
          # so the same snippet stays copy-pasteable outside the bash CI shell.
          rc=0
          for dir in \
            packages/infra/lightningcss-native \
            packages/infra/oxfmt-native \
            packages/node/terminal-native \
            packages/node/tls-native \
            packages/node/http-soup-bridge \
            packages/node/http2-native
          do
            built "$dir" || { echo "--- $dir: not built by this run, not verified"; continue; }
            for gir in "$dir/prebuilds/${PREBUILD}"/*.gir; do
              # -m1 rather than `| head -1`: under `set -o pipefail` a closed pipe
              # would surface as a spurious failure of the grep itself.
              leaf="$(grep -m1 -o 'shared-library="[^"]*"' "$gir")"
              echo "$gir -> $leaf"
              case "$leaf" in
                *.dylib\") ;;
                *) echo "::error file=$gir::expected a .dylib shared-library leaf, got: $leaf"; rc=1 ;;
              esac
            done
          done
          exit $rc

      # The Vala+Rust bridges ship TWO libraries whose leaf names differ on
      # purpose (`libgjsifyoxfmt.dylib` is what the typelib names;
      # `libgjsify_oxfmt.dylib` is what it links against), and nothing above
      # checks the second one at all. Two ways that ships broken, both of which
      # this asserts structurally — on the artifact, before it is uploaded:
      #   • the cdylib is not staged (the `cp` list forgot it), so dyld expands
      #     the rpath to the right directory and finds nothing there;
      #   • the Vala library records no `@loader_path`, so dyld searches
      #     Homebrew prefixes instead of the directory the pair shares.
      - name: Verify every prebuild resolves its own siblings
        run: |
          set -euo pipefail
          built() { case "${PREBUILD_SKIP:-}" in *"\"${1##*/}\""*) return 1 ;; *) return 0 ;; esac; }
          dirs=()
          for dir in \
            packages/infra/lightningcss-native \
            packages/infra/oxfmt-native \
            packages/node/terminal-native \
            packages/node/tls-native \
            packages/node/http-soup-bridge \
            packages/node/http2-native
          do
            built "$dir" && dirs+=("$dir/prebuilds/${PREBUILD}")
          done
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no bridge was rebuilt on this run — nothing to verify"
            exit 0
          fi
          node scripts/check-prebuild-loader-path.mjs "${dirs[@]}"

      # THE gate this job was missing. Until now it built six darwin-arm64
      # bridges, copied them, and uploaded them for `commit-prebuilds` to commit
      # to main — without ever loading one. The only job that loaded anything was
      # the manual-dispatch experimental one, which is precisely why a prebuild
      # that cannot be loaded reached main unnoticed.
      #
      # `imports.gi.<Ns>.<Class>` is the trigger, not a formality: resolving a
      # GObject class forces GI to call the class's `…_get_type` symbol, which
      # is what dlopens the recorded shared library and, transitively, its Rust
      # sibling. A typelib that is merely FOUND resolves the namespace and then
      # throws here.
      - name: Load-test every darwin-arm64 prebuild under Homebrew gjs
        run: |
          set -euo pipefail
          brew install gjs
          built() { case "${PREBUILD_SKIP:-}" in *"\"${1##*/}\""*) return 1 ;; *) return 0 ;; esac; }
          rc=0
          while IFS='|' read -r dir ns sym; do
            [ -n "$dir" ] || continue
            built "$dir" || { echo "--- ${ns}: not built by this run, not load-tested"; continue; }
            abs="$PWD/${dir}/prebuilds/${PREBUILD}"
            echo "--- ${ns}.${sym} from ${abs}"
            # GI_TYPELIB_PATH locates the typelib; DYLD_LIBRARY_PATH is what lets
            # dlopen resolve the BARE leaf the typelib records (dyld has no
            # notion of "next to the typelib"). This mirrors exactly what the CLI
            # exports via detectNativePackages()/buildNativeEnv() on darwin, so a
            # pass here is a pass for a real `gjsify` run. The sibling cdylib is
            # deliberately NOT covered by that variable — see the next step.
            # `< /dev/null`: the loop's stdin is the heredoc below, and a child
            # that reads it would eat the remaining rows.
            if GI_TYPELIB_PATH="$abs" DYLD_LIBRARY_PATH="$abs" gjs -c \
                 "const T = imports.gi.${ns}.${sym};
                  if (typeof T !== 'function') { throw new Error('${ns}.${sym} did not resolve to a class'); }
                  print('${ns}.${sym} resolved — shared library loaded');" < /dev/null
            then :; else
              echo "::error::${ns} prebuild in ${abs} does not load"
              rc=1
            fi
          done <<'EOF'
          packages/infra/lightningcss-native|GjsifyLightningcss|Engine
          packages/infra/oxfmt-native|GjsifyOxfmt|Formatter
          packages/node/terminal-native|GjsifyTerminal|Terminal
          packages/node/tls-native|GjsifyTls|Tls
          packages/node/http-soup-bridge|GjsifyHttpSoupBridge|Server
          packages/node/http2-native|GjsifyHttp2|SessionBridge
          EOF
          exit $rc

      # The stricter half: prove the Vala→Rust hop needs NO environment variable.
      # A prebuild that only loads because a launcher happened to export
      # DYLD_LIBRARY_PATH is fragile — dlopen the Vala library by ABSOLUTE path
      # with the loader variables unset, so the ONLY thing that can find the
      # sibling cdylib is the library's own @loader_path rpath.
      #
      # /usr/bin/python3 is used deliberately: SIP strips DYLD_* when spawning a
      # system binary, so the test cannot be contaminated by inherited state even
      # if `env -u` missed something.
      - name: Prove the sibling cdylib resolves with no environment variable
        run: |
          set -euo pipefail
          built() { case "${PREBUILD_SKIP:-}" in *"\"${1##*/}\""*) return 1 ;; *) return 0 ;; esac; }
          rc=0
          for lib in \
            "packages/infra/lightningcss-native/prebuilds/${PREBUILD}/libgjsifylightningcss.dylib" \
            "packages/infra/oxfmt-native/prebuilds/${PREBUILD}/libgjsifyoxfmt.dylib"
          do
            pkg="${lib%%/prebuilds/*}"
            built "$pkg" || { echo "--- $pkg: not built by this run, not dlopened"; continue; }
            echo "--- dlopen $lib with no DYLD_* set"
            if env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH /usr/bin/python3 -c \
                 'import ctypes, sys; ctypes.CDLL(sys.argv[1]); print("loaded", sys.argv[1])' "$PWD/$lib"
            then :; else
              echo "::error::$lib does not resolve its sibling Rust cdylib via @loader_path"
              rc=1
            fi
          done
          exit $rc

      - name: Upload @gjsify/lightningcss-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: lightningcss-native-prebuilds-darwin-arm64
          path: packages/infra/lightningcss-native/prebuilds/darwin-arm64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/oxfmt-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: oxfmt-native-prebuilds-darwin-arm64
          path: packages/infra/oxfmt-native/prebuilds/darwin-arm64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/terminal-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-native-prebuilds-darwin-arm64
          path: packages/node/terminal-native/prebuilds/darwin-arm64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/tls-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: tls-native-prebuilds-darwin-arm64
          path: packages/node/tls-native/prebuilds/darwin-arm64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/http-soup-bridge prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http-soup-bridge-prebuilds-darwin-arm64
          path: packages/node/http-soup-bridge/prebuilds/darwin-arm64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/http2-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http2-native-prebuilds-darwin-arm64
          path: packages/node/http2-native/prebuilds/darwin-arm64/
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------
  # macOS exploratory — @gjsify/webgl + @gjsify/webrtc-native
  #
  # MANUAL DISPATCH ONLY, and deliberately NOT in `commit-prebuilds`'s `needs`,
  # so it can never red a normal run — the same honest posture napi.yml uses for
  # its Windows attempt. These two are not known-blocked; they are UNVERIFIED:
  #
  #   • webgl needs gtk4 + libepoxy + gdk-pixbuf. GTK4's macOS (Quartz) backend
  #     goes through CGL, which tops out at desktop OpenGL 4.1 Core and offers no
  #     GLES 3.2 — the profile the Vala bridge is written against. Whether the
  #     bridge merely COMPILES there says nothing about whether Gtk.GLArea can
  #     actually render, so a green build here is a starting point, not a ship
  #     signal.
  #   • webrtc-native needs gstreamer-sdp-1.0 + gstreamer-webrtc-1.0, which come
  #     from gst-plugins-base/bad inside Homebrew's unified `gstreamer` formula.
  #     Whether that formula exports both .pc files is the open question.
  #
  # Run it, read the log, and promote whatever passes into build-prebuilds-macos
  # above (with an upload step + commit wiring) — or record the specific failure.
  # ----------------------------------------------------------------
  build-prebuilds-macos-experimental:
    name: Build prebuilds (darwin-arm64) [experimental — rolldown + webgl + webrtc]
    needs: [changes]
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      PREBUILD: darwin-arm64

    steps:
      - name: Install GI toolchain + GTK4/GStreamer (Homebrew)
        run: |
          set -euo pipefail
          # json-glib is rolldown-native's extra dependency over the required job's closure.
          brew install gobject-introspection vala meson ninja pkgconf gtk4 libepoxy gdk-pixbuf gstreamer json-glib
          BREW_PREFIX="$(brew --prefix)"
          echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Report what pkg-config actually resolved
        # The evidence this job exists to produce: whether the unified gstreamer
        # formula exports gstreamer-sdp-1.0/gstreamer-webrtc-1.0 at all.
        run: |
          for pc in gtk4 epoxy gdk-pixbuf-2.0 gstreamer-1.0 gstreamer-sdp-1.0 gstreamer-webrtc-1.0; do
            printf '%-24s %s\n' "$pc" "$(pkg-config --modversion "$pc" 2>/dev/null || echo 'MISSING')"
          done

      - name: Checkout repository
        uses: actions/checkout@v6

      # @gjsify/rolldown-native is the bundler engine `gjsify build` runs on under
      # GJS — the one package standing between macOS and a Node-free toolchain.
      # Its Rust core compiles for aarch64-apple-darwin since the eventfd→pipe
      # port (src/rust/src/wakeup.rs); what is UNPROVEN is the native build:
      # linking, GIR generation, and whether the typelib loads under Homebrew gjs.
      # That is what these steps answer. Promote into the required
      # `build-prebuilds-macos` job once this comes back green.
      - name: Install Rust toolchain (rustup, stable)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Fetch the pinned rolldown source
        run: git submodule update --init --depth 1 refs/rolldown

      - name: Build @gjsify/rolldown-native (Rust cdylib + Vala GI bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        working-directory: packages/infra/rolldown-native
        run: |
          set -euo pipefail
          meson setup build .
          meson compile -C build
          mkdir -p "prebuilds/${PREBUILD}"
          # BOTH libraries, not just the one the typelib names. The Vala library
          # records `@rpath/libgjsify_rolldown.dylib` for its Rust cdylib — a
          # DIFFERENT leaf (underscore) that this list used to omit, so the load
          # test below failed with the rpath expanded to exactly this directory
          # and `(no such file)`. The `.gir` travels with it for the same reason
          # the linux + required-macOS legs ship it.
          cp build/libgjsifyrolldown.dylib build/libgjsify_rolldown.dylib \
             build/GjsifyRolldown-1.0.gir build/GjsifyRolldown-1.0.typelib "prebuilds/${PREBUILD}/"
          ls -lh "prebuilds/${PREBUILD}/"

      - name: Verify the rolldown prebuild resolves its own sibling
        run: node scripts/check-prebuild-loader-path.mjs "packages/infra/rolldown-native/prebuilds/${PREBUILD}"

      - name: Load-test the rolldown typelib under Homebrew gjs
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        # A prebuild that builds but does not LOAD is the failure mode this whole
        # platform axis exists to catch (a typelib recording the wrong shared-library
        # leaf is found via GI_TYPELIB_PATH and then silently never loads).
        working-directory: packages/infra/rolldown-native
        run: |
          set -euo pipefail
          brew install gjs
          GI_TYPELIB_PATH="$PWD/prebuilds/${PREBUILD}" \
          DYLD_LIBRARY_PATH="$PWD/prebuilds/${PREBUILD}" \
            gjs -c 'const { Bundler } = imports.gi.GjsifyRolldown; if (!Bundler) { throw new Error("GjsifyRolldown.Bundler missing"); } print("rolldown typelib loaded OK");'

      - name: Prove rolldown's sibling cdylib resolves with no environment variable
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        # DYLD_LIBRARY_PATH above only has to find the leaf the typelib names.
        # The Vala→Rust hop must need nothing at all: dlopen by absolute path
        # with the loader variables unset leaves @loader_path as the only way the
        # cdylib next to it can be found.
        working-directory: packages/infra/rolldown-native
        run: |
          set -euo pipefail
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH /usr/bin/python3 -c \
            'import ctypes, sys; ctypes.CDLL(sys.argv[1]); print("loaded", sys.argv[1])' \
            "$PWD/prebuilds/${PREBUILD}/libgjsifyrolldown.dylib"

      - name: Build @gjsify/webgl Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/framework/webgl
        run: |
          meson setup build .
          meson compile -C build
          mkdir -p "prebuilds/${PREBUILD}"
          cp build/libgwebgl.dylib build/Gwebgl-0.1.typelib "prebuilds/${PREBUILD}/"
          ls -lh "prebuilds/${PREBUILD}/"

      - name: Build @gjsify/webrtc-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"webrtc-native"') }}
        working-directory: packages/web/webrtc-native
        run: |
          meson setup build .
          meson compile -C build
          mkdir -p "prebuilds/${PREBUILD}"
          cp build/libgjsifywebrtc.dylib build/GjsifyWebrtc-0.1.typelib "prebuilds/${PREBUILD}/"
          ls -lh "prebuilds/${PREBUILD}/"

  # ----------------------------------------------------------------
  # Commit all prebuilds back to the repo — main only, and never from a PR
  #
  # This job pushes binaries into the repository, so "a PR cannot reach it" must
  # not depend on any single line:
  #
  #   1. `github.event_name != 'pull_request'` — the direct gate.
  #   2. `github.ref == 'refs/heads/main'` — on a `pull_request` event the ref is
  #      `refs/pull/<n>/merge`, never `refs/heads/main`, so this fails
  #      independently. It also covers a push trigger on some other branch.
  #   3. On an UNLABELLED PR there is a third, structural gate: `needs` includes
  #      `build-prebuilds-macos`, which is skipped there, and a skipped `needs`
  #      skips the dependent job (this `if:` has no `always()`/`!cancelled()`,
  #      so the default all-needs-succeeded rule applies) — the same mechanism
  #      the comment below relies on for the experimental macOS job. This one
  #      does NOT hold on a `ci:macos`-labelled PR, where every needed job runs;
  #      1 and 2 are what make that case safe, which is why they are two
  #      independent conditions rather than one.
  #
  # And it is the only job that widens the token past the workflow-level
  # `contents: read`, so even a mistake in all of the above would not hand write
  # access to a job that builds PR head code.
  #
  # A SKIPPED PACKAGE HAS NO ARTIFACT, and this job is the place that fact can
  # do damage, so it is handled explicitly rather than hoped about.
  #
  #   What `actions/download-artifact` does with a name that does not exist:
  #   it FAILS. `src/download-artifact.ts` throws `Artifact '<name>' not found`,
  #   which reaches the top-level catch and `core.setFailed`s the step. There is
  #   no `if-no-artifact-found` input — the download action has no counterpart
  #   to upload's `if-no-files-found`. So an ungated download of a skipped
  #   package would red this job on every run that built less than everything.
  #   That failure is at least SAFE (a failed job commits nothing), but it would
  #   also block every package that DID rebuild, so each download carries the
  #   same `if:` its build did.
  #
  #   What that leaves on disk: nothing was downloaded for the skipped package,
  #   so its `prebuilds/` directory is exactly what `actions/checkout` wrote —
  #   the committed bytes. `git add` on an unchanged tree stages nothing, the
  #   existing `git diff --cached --quiet` short-circuit sees no change, and the
  #   committed prebuild is left untouched. Not deleted, not emptied.
  #
  #   Why there is a guard anyway: `git add <dir>` has staged DELETIONS since
  #   git 2.0, so anything that removed a file under `prebuilds/` — a download
  #   action that starts clearing its destination, a `path:` typo landing an
  #   artifact somewhere else, a future clean step — would be committed as a
  #   deletion and silently unship a binary. `Refuse to delete a committed
  #   prebuild` below asserts that no staged change under a `prebuilds/`
  #   directory is a deletion, and fails the job if one is. (An empty directory
  #   cannot be committed at all: git does not track directories, so "never
  #   commit an empty directory" is free — the reachable failure is the
  #   deletion, and that is what is checked.)
  # ----------------------------------------------------------------
  commit-prebuilds:
    name: Commit prebuilds to repo
    # build-prebuilds-macos-experimental is deliberately absent: it is
    # workflow_dispatch-only, and a skipped job in `needs` would skip this one too.
    #
    # `changes` is here because every download step below is gated on ITS
    # decision — the same decision the build legs used. Deciding once and
    # reading it in both places is what makes "a package was not built" and "no
