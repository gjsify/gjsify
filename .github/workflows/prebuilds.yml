    #
    # NOTE the corollary for the gates above: no build leg may be skipped as a
    # WHOLE job, only step by step. A skipped job in `needs` skips this one
    # (there is no `always()` here — deliberately; see gate 3 in the comment
    # above), so a leg that skipped itself because it had nothing to build
    # would silently suppress committing everything the OTHER legs produced.
    needs: [changes, build-prebuilds, build-prebuilds-qemu, build-prebuilds-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
