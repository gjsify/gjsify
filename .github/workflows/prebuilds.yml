      - name: Download terminal-native ppc64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: terminal-native-prebuilds-linux-ppc64
          path: packages/node/terminal-native/prebuilds/linux-ppc64/

      - name: Download terminal-native s390x prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
