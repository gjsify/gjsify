name: Build Native Prebuilds

# Two halves with different audiences — the same split `deploy-docs.yml` uses:
#
#   BUILD legs   — an ordinary check. They compile the Vala/meson sources and the
#                  Rust crates the `*-native` bridges link, and they run on
#                  `pull_request` TOO, so a change that cannot compile is caught
#                  before the merge instead of after it. main went red exactly
#                  that way: a Rust dependency-resolution break in
#                  @gjsify/oxfmt-native (a duplicate `oxc_allocator` crate
#                  identity, fixed in #827) appeared in NO PR check, and the fix
#                  PR could not prove itself either — its legs had to be
#                  dispatched by hand with `gh workflow run --ref`.
#   commit-prebuilds — main-only, by definition. It commits binaries back into
#                  the repository, which is a main-branch act and must never be
#                  reachable from a PR. Guarded twice over; see the job.
#
# WHICH legs run on a PR: every Linux glibc one — native x64 + arm64 and the
# three QEMU legs — plus the win32 pair. Only `build-prebuilds-macos` is held
# back (10x billing, a scarce shared concurrency pool, and the slowest leg
# here), with main.yml's `ci:macos` label as the opt-in. The win32 pair is NOT
# held back with it: `windows-latest` bills at 2x where macOS bills at 10x, and
# on a public repo both are free — so the cost that justifies the macOS opt-in
# does not exist here, and a target with no PR coverage is a target whose breaks
# are found on main. The EXPLORATORY leg `build-prebuilds-macos-experimental` is
# workflow_dispatch-only and nothing depends on it: it builds a target that is
# not yet declared in any `gjsify.platforms`, and this repo's declared-vs-built
# invariant is symmetric, so the leg proves itself first and the declaration
# follows. `build-prebuilds-musl` was in that category and is NOT any more — it
# runs here like the glibc legs and can go red, because `-musl` is not a
# `gjsify.platforms` token in the first place (its header carries why). That is
# wider than the "native x86_64, Vala-only" shape
# the status notes once proposed, for two measured reasons:
#   • A Vala-only leg would have been GREEN on the very break that motivated
#     this — #827 was a Rust dependency-resolution failure in oxfmt-native. A PR
#     check that would not have caught its own motivating incident is worse than
#     none, so the Rust bridges are in.
#   • The emulated legs are kept because coverage of an architecture nobody can
#     otherwise test is worth more than PR latency, and they run in parallel
#     with the 8-15 min native legs. The "ppc64 3m00s / s390x 3m13s / riscv64
#     3m07s" figures once recorded here were not a measurement of emulation:
#     the legs were building x86-64 on the runner (see `build-prebuilds-qemu`),
#     so they timed nothing. The first fully-emulated run (#838, run
#     30310941686) measured them: ppc64 41m38s, s390x 38m54s, riscv64 96m47s.
#     They ARE the critical path, and one package is nearly all of it — see
#     the `changes` job.
#
# ONLY WHAT CHANGED IS BUILT. Every leg gates every package on the `changes`
# job below: a package is built when something it depends on changed, and
# otherwise its build AND its upload are skipped. The same rule on a pull
# request, on a push to main and on a dispatch — no event-based special-casing.
# `commit-prebuilds` gates its downloads on the identical decision, which is
# what keeps a skipped package's committed prebuild untouched rather than
# deleted (a missing artifact would otherwise FAIL the download step).
#
# The `prebuilds-summary` job prints what a given run did NOT cover — both the
# legs it skipped and the packages it skipped, with the reason — so a run that
# builds two of ten packages never reads like a full verification.
#
# `pull_request`, NOT `pull_request_target`. `pull_request_target` runs the BASE
# branch's workflow definition with a read/write token and repository secrets
# while checking out the PR's head code — precisely the combination that must
# not exist in a workflow that contains a job which pushes commits. Plain
# `pull_request` runs with a token GitHub forces to read-only for fork PRs, and
# the build legs need nothing more: they pull the PUBLIC `fedora:43` image, so
# they also work on a fork PR. (`ghcr.io/gjsify/ci-fedora` is public too and is
# pulled anonymously since 1ff4d1224e — this comment called it private for as
# long as that was still true.) Least privilege backs that up rather than
# relying on it — see
# `permissions` below.
#
# Artifacts are uploaded and can be downloaded to commit into the repo before
# npm publish; on a PR they are the only CI-built copy of a binary that exists
# to compare a committed prebuild against, so they are NOT gated off there.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/framework/webgl/src/vala/**'
      - 'packages/framework/webgl/src/vapi/**'
      - 'packages/framework/webgl/meson.build'
      - 'packages/web/webrtc-native/src/vala/**'
      - 'packages/web/webrtc-native/meson.build'
      - 'packages/node/http-soup-bridge/src/vala/**'
      - 'packages/node/http-soup-bridge/meson.build'
      - 'packages/node/http2-native/src/vala/**'
      - 'packages/node/http2-native/meson.build'
      - 'packages/node/sab-native/src/vala/**'
      - 'packages/node/sab-native/meson.build'
      - 'packages/node/tls-native/src/vala/**'
      - 'packages/node/tls-native/src/c/**'
      - 'packages/node/tls-native/meson.build'
      - 'packages/node/terminal-native/src/vala/**'
      - 'packages/node/terminal-native/meson.build'
      - 'packages/framework/webkit-native/src/objc/**'
      - 'packages/framework/webkit-native/meson.build'
      - 'packages/infra/lightningcss-native/src/**'
      - 'packages/infra/lightningcss-native/meson.build'
      - 'packages/infra/oxfmt-native/src/**'
      - 'packages/infra/oxfmt-native/meson.build'
      - 'packages/infra/rolldown-native/src/**'
      - 'packages/infra/rolldown-native/meson.build'
      # The `refs/` submodule PINS the Rust bridges link by Cargo path
      # dependency. A gitlink change appears in a diff as the submodule path,
      # so these entries are what let a pin bump — which changes the binary
      # without touching one byte of the package — start this workflow at all.
      # Their absence was a silent never-rebuild; the `changes` job's
      # self-check fails if either list stops covering a linked submodule.
      - 'refs/oxc'
      - 'refs/rolldown'
      - '.github/workflows/prebuilds.yml'
      - '.github/prebuild-toolchain/**'
      # Shared scripts every build runs: staging (which target directory an
      # artifact lands in), the pin check, the loader-path verifier. A change
      # to one can change every artifact, so they trigger a run AND rebuild
      # every package (see the `changes` job's shared-input rule).
      #
      # `scripts/manifest-conformance/**` is here for the same reason and is
      # NOT optional: since #847 the three scripts above are thin CLI entry
      # points and the checks themselves live in that registry. Listing only
      # the entry points would mean editing what a build VERIFIES while
      # nothing rebuilds — the precise shape of silent staleness this gate
      # exists to prevent.
      - 'scripts/stage-prebuild.mjs'
      - 'scripts/check-refs-pin.mjs'
      - 'scripts/check-prebuild-loader-path.mjs'
      - 'scripts/manifest-conformance/**'
      # The four suites `gate-pushed-tree.sh` RUNS. Absent until now, so editing the
      # gate's own content did not trigger the workflow that runs it — measured: the
      # fix for a red `commit-prebuilds` touched `tests/e2e/prebuild-change-gate/` and
      # produced no prebuilds run at all, on the PR or on the merge. Held by
      # `prebuild-change-gate`'s own "its trigger covers what it runs" case.
      - 'tests/e2e/platform-exemption-clearing/**'
      - 'tests/e2e/prebuild-declaration-invariant/**'
      - 'tests/e2e/prebuild-loader-path/**'
      - 'tests/e2e/prebuild-change-gate/**'
      - 'tests/e2e/stage-prebuild/**'

  # Repeated VERBATIM from `push` above — GitHub Actions supports no YAML
  # anchors, and the two lists MUST stay identical: a path that can change a
  # prebuild on main is a path that has to be able to prove itself on a PR.
  # `deploy-docs.yml` is the model.
  pull_request:
    paths:
      - 'packages/framework/webgl/src/vala/**'
      - 'packages/framework/webgl/src/vapi/**'
      - 'packages/framework/webgl/meson.build'
      - 'packages/web/webrtc-native/src/vala/**'
      - 'packages/web/webrtc-native/meson.build'
      - 'packages/node/http-soup-bridge/src/vala/**'
      - 'packages/node/http-soup-bridge/meson.build'
      - 'packages/node/http2-native/src/vala/**'
      - 'packages/node/http2-native/meson.build'
      - 'packages/node/sab-native/src/vala/**'
      - 'packages/node/sab-native/meson.build'
      - 'packages/node/tls-native/src/vala/**'
      - 'packages/node/tls-native/src/c/**'
      - 'packages/node/tls-native/meson.build'
      - 'packages/node/terminal-native/src/vala/**'
      - 'packages/node/terminal-native/meson.build'
      - 'packages/framework/webkit-native/src/objc/**'
      - 'packages/framework/webkit-native/meson.build'
      - 'packages/infra/lightningcss-native/src/**'
      - 'packages/infra/lightningcss-native/meson.build'
      - 'packages/infra/oxfmt-native/src/**'
      - 'packages/infra/oxfmt-native/meson.build'
      - 'packages/infra/rolldown-native/src/**'
      - 'packages/infra/rolldown-native/meson.build'
      - 'refs/oxc'
      - 'refs/rolldown'
      - '.github/workflows/prebuilds.yml'
      - '.github/prebuild-toolchain/**'
      - 'scripts/stage-prebuild.mjs'
      - 'scripts/check-refs-pin.mjs'
      - 'scripts/check-prebuild-loader-path.mjs'
      - 'scripts/manifest-conformance/**'
      # The four suites `gate-pushed-tree.sh` RUNS. Absent until now, so editing the
      # gate's own content did not trigger the workflow that runs it — measured: the
      # fix for a red `commit-prebuilds` touched `tests/e2e/prebuild-change-gate/` and
      # produced no prebuilds run at all, on the PR or on the merge. Held by
      # `prebuild-change-gate`'s own "its trigger covers what it runs" case.
      - 'tests/e2e/platform-exemption-clearing/**'
      - 'tests/e2e/prebuild-declaration-invariant/**'
      - 'tests/e2e/prebuild-loader-path/**'
      - 'tests/e2e/prebuild-change-gate/**'
      - 'tests/e2e/stage-prebuild/**'

# Least privilege at the workflow level; each job adds only what it needs. This
# is what keeps the new PR trigger from ever handing a write-capable token to a
# job that builds head code: only `commit-prebuilds` widens to `contents: write`,
# and it cannot run on a `pull_request` event.
permissions:
  contents: read

# A PR that is pushed twice must not pay for two full Rust builds, so PR runs
# get a per-ref group that cancels itself. Non-PR runs keep exactly today's
# behaviour — their own group per run, never cancelled — because a main run
# commits prebuilds back and must be allowed to finish. (Keying the non-PR
# group by `run_id` is what keeps a dispatched verification run from cancelling
# an in-flight main run, and vice versa.)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('prebuilds-pr-{0}', github.ref) || format('prebuilds-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------------------
  # Which packages does this change set actually affect?
  #
  # Decided ONCE, here, and consumed by every leg and by `commit-prebuilds`, so
  # a build and the commit that ships it can never disagree about what was
  # produced. The rule is uniform across events — pull request, push to main,
  # dispatch: a package is built when something it depends on changed.
  #
  # WHY NOT `gjsify affected` (packages/infra/cli/dist/affected.gjs.mjs), the
  # classifier `main.yml` already runs. It was the first thing checked, and it
  # does not fit — for two independent reasons, either of which alone is fatal:
  #
  #   • It cannot see a submodule pin. `refs/**` is the FIRST entry of its
  #     IGNORE table (dropped before every other rule), and it ignores every
  #     workflow file except `main.yml` — including this one. Both of those are
  #     inputs to a prebuild, so the one classifier we have is structurally
  #     blind to two of the three things this gate exists to notice.
  #   • Its graph is the wrong graph. It walks the npm workspace's
  #     production-dependency edges to answer "whose TESTS must re-run". A
  #     native prebuild's inputs are Vala/C/Rust sources, `meson.build` and a
  #     pinned submodule — none of which that graph models. It would be wrong
  #     in both directions: an edit to a package `@gjsify/lightningcss-native`
  #     depends on would put it in the closure and rebuild a 32-minute cdylib
  #     whose sources did not change, while a `refs/rolldown` bump would leave
  #     `@gjsify/rolldown-native` out of it entirely.
  #
  # So this uses path matching — but it does not hand-write a second copy of
  # the path table: `changed-packages.mjs` DERIVES the package set from this
  # workflow's own `path: packages/…/prebuilds/…` steps and each package's
  # source globs from this workflow's own `on: paths:` filter, then adds the
  # `refs/` submodules from `gjsify.refsLockstep` + the package's Cargo path
  # dependencies. It fails loudly if the gate and the trigger ever disagree.
  # Full rationale, and what it deliberately cannot see, in that file's header.
  # ----------------------------------------------------------------
  changes:
    name: Detect affected prebuild packages
    runs-on: ubuntu-latest
    outputs:
      # A JSON array of the package keys NOT to build, e.g. `["oxfmt-native"]`.
      #
      # SKIP, not build, and matched with `contains()` on the raw string rather
      # than `fromJSON(...)`, because the failure mode has to be BUILD. An
      # unset output (job failed, output renamed, key missing) is the empty
      # string; `contains('', '"webgl"')` is false, so `!contains(...)` is true
      # and the package builds. The inverse — gating on a build list — would
      # turn every one of those into a silent skip, which is the one outcome
      # worse than the problem being solved. The keys are quoted inside the
      # JSON, so `'"http2-native"'` cannot match `"http2-native-x"`.
      skip: ${{ steps.detect.outputs.skip }}
      build: ${{ steps.detect.outputs.build }}
      reason: ${{ steps.detect.outputs.reason }}
      report: ${{ steps.detect.outputs.report }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The diff base has to be a commit this checkout actually has.
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        env:
          # Via `env:`, never interpolated into the script body — these are
          # event-controlled values.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)         base="$PUSH_BEFORE" ;;
            # A dispatch has no "previous state" to diff against, so it builds
            # everything — which also makes it the documented escape hatch for
            # rebuilding a package whose floating crates.io dependencies moved
            # without anything in this repository changing.
            *)            base="" ;;
          esac
          # An all-zero SHA is what a branch's first push reports, and a
          # force-push can leave a base this checkout does not contain.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=""
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Classify
        id: detect
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -uo pipefail
          if [ -n "$BASE" ]; then
            set -- --base "$BASE" --head "$GITHUB_SHA"
          else
            set -- --all
          fi
          if ! node .github/prebuild-toolchain/changed-packages.mjs "$@" --format=github-actions; then
            # FAIL OPEN, loudly. A classifier that cannot decide must not be
            # able to skip anything — the cost of being wrong here is a stale
            # committed binary, not a slow run.
            echo "::warning::changed-packages.mjs failed — building every package."
            {
              echo 'skip=[]'
              echo 'build=[]'
              echo 'reason=classifier failed; building everything'
              echo 'report=[]'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Restate the decision in the job log
        env:
          REASON: ${{ steps.detect.outputs.reason }}
          SKIP: ${{ steps.detect.outputs.skip }}
        run: |
          echo "reason: $REASON"
          echo "skipped: $SKIP"

  # ----------------------------------------------------------------
  # Native runners — x64 and arm64
  #
  # `matrix.arch` IS the prebuild directory suffix, so it is spelled the way
  # `process.arch` spells it (`x64`/`arm64`, not `uname -m`'s
  # `x86_64`/`aarch64`). That is the single `<os>-<arch>` vocabulary:
  # `package.json#gjsify.platforms` declares it, `scripts/stage-prebuild.mjs`
  # creates it, the CLI's `detectNativePackages()` resolves it without
  # translating, and `scripts/audit-runtimes.mjs --check` rejects anything else.
  #
  # The matrix stays a STATIC `include:` and both legs run on every event,
  # including `pull_request`. Two reasons, and the second is the load-bearing
  # one:
  #   • Cost — the legs run in PARALLEL, so dropping arm64 saves no PR latency
  #     at all; measured, the whole leg (7 Vala packages + the lightningcss,
  #     oxfmt and rolldown Rust builds) took 8m30s-15m05s across observed
  #     runs.
  #   • `scripts/audit-runtimes.mjs --check` READS THIS BLOCK. It learns which
  #     `<os>-<arch>` targets CI produces by scanning each job for `runs-on` and
  #     `arch:` matrix entries, and fails any package whose `gjsify.platforms`
  #     declares a target no job builds. An expression-driven matrix
  #     (`include: ${{ fromJSON(…) }}`) hides the arch tokens from that parser,
  #     which turns the declared-vs-built symmetry into a false failure on all
  #     ten native packages. If this ever has to become dynamic, teach
  #     `parseCiPlatforms()` the new shape in the SAME change.
  # ----------------------------------------------------------------
  build-prebuilds:
    name: Build prebuilds (${{ matrix.arch }})
    needs: [changes]
    runs-on: ${{ matrix.runner }}
    container:
      # ══════════════════════════════════════════════════════════════════
      # THIS IMAGE IS A DISTRIBUTION DECISION, NOT A TEST HOST. DO NOT BUMP
      # IT TO MATCH THE OTHER WORKFLOWS.
      #
      # Every other `fedora:<n>` in this repository picks a machine to RUN
      # tests on; a newer one is strictly better and bumping them together
      # is the obvious hygiene. This one picks the glibc our published
      # binaries are LINKED AGAINST, and that number is a promise to every
      # consumer — the toolchain's own `gjsify.glibcRequires` floor, which
      # `lightningcss-native` alone pushes to the highest value in the tree.
      #
      # #897 bumped it 43 → 44 as part of exactly that hygiene sweep, with
      # no functional need, and it took main red for three consecutive
      # `commit-prebuilds` runs. Measured:
      #
      #   fedora:43 → glibc 2.42, floor stays 2.39 (`pidfd_spawnp`, from
      #               Rust std) — the value every package declares today
      #   fedora:44 → glibc 2.43, floor jumps to 2.43, because 2.43
      #               RE-VERSIONS three float-math symbols
      #               (`acosf`/`asinf`/`atan2f`) that lightningcss's colour
      #               conversion calls. The linker binds the newest default
      #               version available, so merely BUILDING there rewrites
      #               the requirement — no source change, no review.
      #
      # The old symbol versions still exist in glibc 2.43 and behave the
      # way lightningcss needs, so nothing is gained by the newer ones. What
      # is LOST is every consumer below 2.43: at 2.39 this toolchain runs on
      # Ubuntu 24.04 and Debian 13; at 2.43 it runs on essentially nothing
      # shipping today.
      #
      # If this must move, the floor moves with it — so decide the floor
      # first (see `status/open-todos.md` → "the prebuild glibc floor is an
      # accident of the build image"), do not inherit it from a tag.
      # ══════════════════════════════════════════════════════════════════
      image: fedora:43

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Install prerequisites
        # gstreamer*-devel packages provide the .pc files for gstreamer-sdp-1.0
        # and gstreamer-webrtc-1.0 that @gjsify/webrtc-native needs at Vala build time.
        # libsoup3-devel is needed by @gjsify/http-soup-bridge for libsoup-3.0.
        # libnghttp2-devel is needed by @gjsify/http2-native for the HPACK / frame
        # encoder shim wrapping nghttp2.
        # gnutls-devel provides the gnutls.pc + gnutls/ocsp.h that
        # @gjsify/tls-native needs for OCSP-response parsing.
        # `curl` is needed by rustup-init below.
        # `nodejs` runs `scripts/stage-prebuild.mjs` — the shared stager every
        # collect step below goes through, which is also what runs
        # `checkPrebuildDir()` on what it wrote. It is a build-time tool here,
        # not a runtime: nothing in this job executes JavaScript otherwise.
        #
        # `--disablerepo=fedora-cisco-openh264` is AVAILABILITY, not size:
        # gdk-pixbuf2-devel reaches openh264 through a HARD Requires chain
        # (libheif → libopenh264.so.8), the package is served by a separately
        # hosted repo, and an outage there fails this whole transaction — for a
        # codec nothing here decodes. Disabling it resolves the same soname to
        # Fedora's `noopenh264` stub. `--setopt=install_weak_deps=False` is the
        # size half and does NOT drop openh264, the chain being hard; measured in
        # `fedora:43`, the two together cut this transaction from 565 packages
        # (openh264, from fedora-cisco-openh264) to 385 (noopenh264, from fedora).
        # Both flags must stay on THIS line: a folded `run: >` block has no
        # continuations, and `scripts/check-ci-image-packages.mjs` — which holds
        # every `dnf install` under .github/ to the first flag — reads a package
        # list to end of line (#1057).
        run: >
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264
          git tar xz findutils curl
          nodejs
          meson vala gcc pkgconf
          glib2-devel gobject-introspection-devel
          gtk4-devel gdk-pixbuf2-devel
          libepoxy-devel
          gstreamer1-devel
          gstreamer1-plugins-base-devel
          gstreamer1-plugins-bad-free-devel
          libsoup3-devel
          libnghttp2-devel
          gnutls-devel
          json-glib-devel

      - name: Install Rust toolchain (rustup, stable)
        # Only the three Rust bridges need it, so it follows the same gate they
        # do: a run that rebuilds only Vala bridges pays nothing for a toolchain
        # nothing will invoke.
        if: >-
          ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"')
          || !contains(needs.changes.outputs.skip, '"oxfmt-native"')
          || !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        # Fedora 43's `dnf install cargo` ships rustc ~1.79 — too old for
        # the lightningcss/rolldown crate trees that pull `indexmap@2.14`
        # which requires `edition2024` (rustc ≥ 1.85). Install rustup
        # directly for a current toolchain.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
            https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Checkout repository
        uses: actions/checkout@v6

      # THE INVARIANT THE `cp` USED TO GET FOR FREE, now asserted once.
      #
      # Every collect step below stages through `scripts/stage-prebuild.mjs`,
      # which DERIVES the target directory from the host it runs on. The upload
      # steps, by contrast, still name `linux-${{ matrix.arch }}` literally — so
      # where a hand-written `mkdir -p "prebuilds/linux-${ARCH}"` could not
      # disagree with them (same string, one place), a derived name can. A
      # disagreement would upload nothing under a path that does not exist, or —
      # worse on a mixed runner pool — stage a foreign arch into a directory that
      # names another.
      #
      # `hostStagingTarget()` is the exact function the stager calls, imported
      # rather than reimplemented, and importing runs no `main()` (it is guarded
      # on `process.argv[1]`). Same guard, same reason, as the musl leg's
      # "Confirm this container resolves as ${PREBUILD}" step — which is where
      # this shape was paid for.
      - name: Confirm this runner resolves as linux-${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          resolved="$(node -e 'import("./scripts/stage-prebuild.mjs").then((m) => console.log(m.hostStagingTarget()))')"
          echo "stage-prebuild.mjs resolves this runner as: ${resolved}"
          if [ "$resolved" != "linux-${ARCH}" ]; then
            echo "::error::this runner resolves as \`${resolved}\`, not \`linux-${ARCH}\`. Every collect step"
            echo "::error::below derives its target directory from that answer while the upload steps name"
            echo "::error::\`linux-${ARCH}\` literally, so the two would disagree: refusing to build."
            exit 1
          fi

      # -------- @gjsify/webgl (gwebgl) --------
      - name: Build @gjsify/webgl Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/framework/webgl
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/webgl prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/framework/webgl
        # `--scratch`: this leg commits nothing, `commit-prebuilds` downloads the
        # artifact into the per-target package. See the stager's own note.
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      - name: Upload @gjsify/webgl prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webgl-prebuilds-linux-${{ matrix.arch }}
          path: packages/framework/webgl/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/webrtc-native (GjsifyWebrtc) --------
      - name: Build @gjsify/webrtc-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"webrtc-native"') }}
        working-directory: packages/web/webrtc-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/webrtc-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webrtc-native"') }}
        working-directory: packages/web/webrtc-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      - name: Upload @gjsify/webrtc-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webrtc-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webrtc-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/web/webrtc-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/http-soup-bridge (GjsifyHttpSoupBridge) --------
      - name: Build @gjsify/http-soup-bridge Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        working-directory: packages/node/http-soup-bridge
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/http-soup-bridge prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        working-directory: packages/node/http-soup-bridge
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      - name: Upload @gjsify/http-soup-bridge prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http-soup-bridge-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/http-soup-bridge/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/http2-native (GjsifyHttp2) --------
      - name: Build @gjsify/http2-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        working-directory: packages/node/http2-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/http2-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        working-directory: packages/node/http2-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      - name: Upload @gjsify/http2-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http2-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/http2-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/sab-native (GjsifySabNative) --------
      # Pure libc (memfd_create, mmap, futex, socketpair, SCM_RIGHTS) — no
      # external libraries. Backs cross-process SharedBuffer for
      # @gjsify/worker_threads.
      - name: Build @gjsify/sab-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"sab-native"') }}
        working-directory: packages/node/sab-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/sab-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"sab-native"') }}
        working-directory: packages/node/sab-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      - name: Upload @gjsify/sab-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"sab-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: sab-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/sab-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/tls-native (GjsifyTls) --------
      # Vala bridge over GnuTLS's OCSP-response parser (gnutls_ocsp_resp_*),
      # since Vala 0.56's bundled gnutls.vapi has no OCSP declarations.
      # gnutls-devel provides the .pc + headers; the sibling vapi
      # (`src/vala/gnutls-ocsp.vapi`) wires the missing declarations.
      - name: Build @gjsify/tls-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        working-directory: packages/node/tls-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/tls-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        working-directory: packages/node/tls-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      - name: Upload @gjsify/tls-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: tls-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/tls-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/terminal-native (GjsifyTerminal) --------
      # Plain POSIX (isatty / ioctl TIOCGWINSZ / termios) + GLib — no external
      # libraries, so this is the cheapest bridge in the matrix (~30 s). It backs
      # @gjsify/tty + @gjsify/process, yet used to be absent from this workflow
      # entirely: its prebuilds/ held a hand-built x64-only drop and nothing
      # else, so arm64 (and every QEMU arch) silently had no native TTY support.
      - name: Build @gjsify/terminal-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        working-directory: packages/node/terminal-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/terminal-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        working-directory: packages/node/terminal-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      - name: Upload @gjsify/terminal-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/terminal-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/lightningcss-native (GjsifyLightningcss) --------
      # Pure Rust + Vala; depends on `lightningcss = "1"` from crates.io,
      # no submodule needed. cargo first downloads + compiles the crate
      # graph (~7 min cold on a fresh runner), then meson links the Vala
      # bridge against the resulting cdylib.
      - name: Build @gjsify/lightningcss-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        working-directory: packages/infra/lightningcss-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/lightningcss-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        working-directory: packages/infra/lightningcss-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      - name: Upload @gjsify/lightningcss-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: lightningcss-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/infra/lightningcss-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/oxfmt-native (GjsifyOxfmt) --------
      # The third member of the GJS engine set `installGjsEnginePackages()`
      # lays down (with rolldown-native + lightningcss-native), but it was never
      # built here — its prebuilds/ held a hand-built x64-only drop.
      # Like rolldown-native it path-deps into a submodule (refs/oxc, pinned to
      # the oxfmt_v* tag matching the workspace's npm `oxfmt`), because oxc's
      # formatter crates are not consumable from crates.io.
      - name: Init refs/oxc submodule (oxfmt-native source dep)
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive refs/oxc

      - name: Build @gjsify/oxfmt-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        working-directory: packages/infra/oxfmt-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/oxfmt-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        working-directory: packages/infra/oxfmt-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      - name: Upload @gjsify/oxfmt-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: oxfmt-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/infra/oxfmt-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # -------- @gjsify/rolldown-native (GjsifyRolldown) --------
      # Heavier than lightningcss-native: depends on the `refs/rolldown`
      # submodule (rolldown 0.1.0 on crates.io has broken transitive
      # deps — see packages/infra/rolldown-native/src/rust/Cargo.toml).
      # cold cargo build is ~5 min CPU on x86_64. Submodule init alone
      # downloads several hundred MB.
      - name: Init refs/rolldown submodule (rolldown-native source dep)
        # Several hundred MB of clone, so it is gated like the build it feeds.
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        # GitHub-Actions Fedora containers run as root while the
        # repo is bind-mounted as a different uid → git refuses with
        # "dubious ownership" unless the dir is whitelisted. Mirror
        # the same `safe.directory` workaround the other Fedora
        # workflows use before invoking submodule update.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive refs/rolldown

      - name: Build @gjsify/rolldown-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        working-directory: packages/infra/rolldown-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/rolldown-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        working-directory: packages/infra/rolldown-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      - name: Upload @gjsify/rolldown-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: rolldown-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/infra/rolldown-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # THE MEASUREMENT `commit-prebuilds` RUNS POST-MERGE, MOVED ONTO THE PR.
      #
      # `prebuilds.yml`'s base image decides which glibc the published binaries link
      # against, so bumping it rewrites `gjsify.glibcRequires` for every consumer
      # without touching a line of source. #897 bumped it 43 -> 44 in a hygiene sweep;
      # glibc 2.43 re-versions the float maths lightningcss calls, the measured floor
      # went 2.39 -> 2.43, and `main` was red for three consecutive `commit-prebuilds`
      # runs (#924). The gate worked and named both numbers -- it just fired POST-MERGE,
      # because `commit-prebuilds` is main-only, so the PR that caused it was green.
      #
      # It measures THIS LEG'S OUTPUT, not the committed copies: `stage-prebuild.mjs
      # --scratch` wrote `<bridge>/prebuilds/<target>/`, which is empty in git, while
      # the committed binaries live in the platform packages. Pointing plain
      # `audit-runtimes --check` here would grade the OLD bytes -- and pass while doing
      # it, since a missing target directory is a stat and not a failure there.
      # `nodejs` is already installed above for `stage-prebuild.mjs`.
      - name: Gate on the glibc floor of what this leg just built
        # THE TWO VALUES THAT LET IT TELL THE TWO ZEROS APART. `report` is the
        # `changes` job's own per-package decision — the one that was ACTED on,
        # and the same output `prebuilds-summary` renders — so the gate never
        # re-derives "which packages does this workflow gate"; `PREBUILD_TARGET`
        # is the single target this leg stages, without which every linux
        # platform package in the tree looks like one of its candidates.
        #
        # #1232 is why they are here: a PR editing TypeScript under
        # `packages/infra/rolldown-native/src/ts/` matched the `src/**` trigger,
        # the `changes` job correctly skipped all eight packages the emulated
        # legs build, every upload skipped with them — and this step read the
        # resulting zero as "the collect steps did not run" and failed all three.
        #
        # A BROKEN WIRE HERE STILL REDS THE LEG: without them the gate cannot
        # explain a zero, and an unexplained zero remains an error. It is the
        # fail-closed direction, and `tests/e2e/staged-prebuild-libc-gate` holds
        # both keys to this step so the wire cannot go missing quietly.
        env:
          PREBUILD_TARGET: linux-${{ matrix.arch }}
          PREBUILD_REPORT: ${{ needs.changes.outputs.report }}
        run: node scripts/check-staged-prebuild-libc.mjs

  # ----------------------------------------------------------------
  # QEMU-emulated builds — ppc64, s390x, riscv64
  #
  # All three run on ubuntu-latest host runners under qemu-user binfmt
  # emulation, registered at a PINNED version (see the step below) and driven
  # by a plain `docker run --platform`.
  #
  # ppc64 + s390x: fedora:43 has official images for both → same dnf
  #   package names as the native job above.
  # riscv64: fedora:43 has no riscv64 image → ubuntu:26.04 is used
  #   instead (package names differ; auto-detected via command -v dnf).
  #
  # Node.js process.arch values used as the prebuilds/ dir suffix:
  #   ppc64le (QEMU) → process.arch 'ppc64'  → prebuilds/linux-ppc64/
  #   s390x          → process.arch 's390x'  → prebuilds/linux-s390x/
  #   riscv64        → process.arch 'riscv64'→ prebuilds/linux-riscv64/
  # ----------------------------------------------------------------
  # These run on `pull_request` too, and stay on: an architecture nobody on the
  # team owns hardware for is exactly the one whose build must be checked before
  # merge, not after.
  #
  # COST, measured rather than assumed. The "~3 min per emulated leg" this
  # comment used to carry was an artifact of the platform bug fixed below — the
  # legs compiled x86-64 on the runner, so they timed no emulation at all. Under
  # real qemu-user (measured locally, ppc64le, qemu 10.2.2): the dependency
  # install is ~6 min and the seven Vala/GI packages are minutes; the
  # lightningcss Rust cdylib is the one expensive step. If a leg's total makes
  # it the PR critical path, the lever is to drop THAT package from the
  # emulated legs (its crate graph is portable and every PR already compiles it
  # on x64 + arm64) rather than to drop the architecture — the Vala/GI half is
  # the part the architecture actually changes, and it is the cheap part.
  build-prebuilds-qemu:
    name: Build prebuilds (${{ matrix.arch }}) [QEMU]
    needs: [changes]
    runs-on: ubuntu-latest
    # No `packages: write` — nothing here pushes to GHCR any more. The image
    # cache the removed action kept there was also the reason all three legs
    # collided on one `…-none-none` tag once the platform was set explicitly.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # IBM POWER9/10 workstations and servers (e.g. Raptor Computing Talos II)
          - arch: ppc64
            platform: linux/ppc64le
            # Same image as the native leg, and pinned to it for the same
            # reason: these artifacts are published too, so the emulated
            # legs' glibc sets their floor exactly as it does for x64/arm64.
            # See the block on `build-prebuilds`' own `container:`.
            base_image: fedora:43

          # IBM Z mainframes — enterprise Linux servers
          - arch: s390x
            platform: linux/s390x
            base_image: fedora:43

          # RISC-V boards (StarFive VisionFive 2, Milk-V Pioneer, SiFive HiFive, …)
          # ubuntu:26.04 because Fedora publishes no riscv64 image.
          - arch: riscv64
            platform: linux/riscv64
            base_image: ubuntu:26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # THE EMULATOR VERSION IS PART OF THE BUILD, SO IT IS PINNED.
      #
      # This job used `uraimo/run-on-arch-action`, which ignores its own `arch`
      # input whenever a custom `base_image` is supplied (its README says so) —
      # so every "emulated" leg ran the image for the RUNNER's platform and
      # compiled x86-64 into `prebuilds/linux-{ppc64,s390x,riscv64}/`. That is
      # the defect `audit-runtimes --check`'s machine-vs-directory invariant
      # now rejects.
      #
      # Supplying the platform explicitly exposed the second half: the action
      # ALSO resets binfmt to `multiarch/qemu-user-static` (qemu 7.2,
      # effectively unmaintained) before it builds, and under THAT emulator
      # Fedora's package manager does not survive — `dnf` segfaults on s390x
      # and the RPM transaction fails on ppc64. Both build cleanly under a
      # current qemu (verified locally against qemu 10.2.2: a real
      # `ELF 64-bit MSB … IBM S/390` library out of the s390x container), so
      # the emulator is pinned here like any other toolchain component and the
      # action is gone.
      - name: Register QEMU for ${{ matrix.platform }}
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
          platforms: ${{ matrix.platform }}

      # One `docker run` in the target-arch image. The script is a real file so
      # a failure reproduces by hand with `podman run --platform …`, which is
      # how the qemu-version root cause above was found. Package names stay in
      # THIS file via the per-package upload steps below — that is what
      # `audit-runtimes`' `parseCiPlatforms()` reads to learn which targets
      # this job produces, and it must keep seeing them here.
      #
      # GATING inside one step, not around it: the emulated build is a SINGLE
      # step covering every package, so the per-package decision has to travel
      # INTO the container. `PREBUILD_SKIP` carries the `changes` job's JSON
      # array verbatim and `emulated-build.sh` filters `build_pkg` against it —
      # including the dependency install, whose Rust half is only fetched when
      # a Rust bridge is actually in the list.
      #
      # The step still runs when everything is skipped. That is deliberate: the
      # ~20 s it costs buys back the invariant that `commit-prebuilds` depends
      # on this JOB succeeding, and a job that skipped itself would take the
      # commit down with it (see the `needs` comment there).
      #
      # `-e CI=true` is what makes the committed `src/rust/Cargo.lock` ENFORCED
      # in here too. Every other leg runs either directly on the runner or in a
      # job-level `container:`, both of which get GitHub's own `CI=true`, and
      # each `meson.build` turns that into `cargo build --locked`. A `docker run`
      # inherits NOTHING but what is listed here, so without this line the three
      # emulated legs would still USE the lock but never FAIL on a stale one.
      # Passed as the literal rather than `"$CI"` so `set -u` cannot trip when
      # the script is reproduced by hand (`podman run … emulated-build.sh`),
      # where an unlocked build is the wanted local behaviour anyway.
      - name: Build all prebuilds on ${{ matrix.arch }} via QEMU
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          BASE_IMAGE: ${{ matrix.base_image }}
          PREBUILD_SKIP: ${{ needs.changes.outputs.skip }}
        run: |
          set -euo pipefail
          # PULL FIRST, AND RETRY IT. `docker run` would pull implicitly, which
          # conflates two failures that deserve different treatment: a registry
          # blip and a broken build. On 2026-08-02 the ppc64 leg died on
          #   Head ".../library/fedora/manifests/43": 502 Bad Gateway
          # with exit 125 — Docker's "could not even start the container" — and
          # took a green run down with it. Docker Hub is unauthenticated here
          # (deliberately: it is what lets these legs work on a fork PR), so it
          # is both rate-limited and occasionally flaky, and every retry is
          # cheap next to the ~3 min of emulation behind it.
          for attempt in 1 2 3 4 5; do
            if docker pull --platform "$PLATFORM" "$BASE_IMAGE"; then break; fi
            if [ "$attempt" = 5 ]; then
              echo "::error::could not pull $BASE_IMAGE for $PLATFORM after 5 attempts"
              exit 1
            fi
            echo "pull failed (attempt $attempt/5) — retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          docker run --rm --platform "$PLATFORM" \
            -v "$PWD:/workspace" -w /workspace \
            -e ARCH="$ARCH" \
            -e PREBUILD_SKIP="$PREBUILD_SKIP" \
            -e CI=true \
            "$BASE_IMAGE" \
            bash .github/prebuild-toolchain/emulated-build.sh

      # The build ran as root inside the container, so the staged files are
      # root-owned on the runner. Hand them back before anything else reads
      # them.
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" packages || true

      - name: Upload @gjsify/webgl prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webgl-prebuilds-linux-${{ matrix.arch }}
          path: packages/framework/webgl/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/webrtc-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webrtc-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webrtc-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/web/webrtc-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/http-soup-bridge prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http-soup-bridge-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/http-soup-bridge/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/http2-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http2-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/http2-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/sab-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"sab-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: sab-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/sab-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/tls-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: tls-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/tls-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/lightningcss-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: lightningcss-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/infra/lightningcss-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      - name: Upload @gjsify/terminal-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-native-prebuilds-linux-${{ matrix.arch }}
          path: packages/node/terminal-native/prebuilds/linux-${{ matrix.arch }}/
          retention-days: 30

      # THE MEASUREMENT `commit-prebuilds` RUNS POST-MERGE, MOVED ONTO THE PR.
      #
      # `prebuilds.yml`'s base image decides which glibc the published binaries link
      # against, so bumping it rewrites `gjsify.glibcRequires` for every consumer
      # without touching a line of source. #897 bumped it 43 -> 44 in a hygiene sweep;
      # glibc 2.43 re-versions the float maths lightningcss calls, the measured floor
      # went 2.39 -> 2.43, and `main` was red for three consecutive `commit-prebuilds`
      # runs (#924). The gate worked and named both numbers -- it just fired POST-MERGE,
      # because `commit-prebuilds` is main-only, so the PR that caused it was green.
      #
      # It measures THIS LEG'S OUTPUT, not the committed copies: `stage-prebuild.mjs
      # --scratch` wrote `<bridge>/prebuilds/<target>/`, which is empty in git, while
      # the committed binaries live in the platform packages. Pointing plain
      # `audit-runtimes --check` here would grade the OLD bytes -- and pass while doing
      # it, since a missing target directory is a stat and not a failure there.
      # `nodejs` is already installed above for `stage-prebuild.mjs`.
      - name: Gate on the glibc floor of what this leg just built
        # THE TWO VALUES THAT LET IT TELL THE TWO ZEROS APART. `report` is the
        # `changes` job's own per-package decision — the one that was ACTED on,
        # and the same output `prebuilds-summary` renders — so the gate never
        # re-derives "which packages does this workflow gate"; `PREBUILD_TARGET`
        # is the single target this leg stages, without which every linux
        # platform package in the tree looks like one of its candidates.
        #
        # #1232 is why they are here: a PR editing TypeScript under
        # `packages/infra/rolldown-native/src/ts/` matched the `src/**` trigger,
        # the `changes` job correctly skipped all eight packages the emulated
        # legs build, every upload skipped with them — and this step read the
        # resulting zero as "the collect steps did not run" and failed all three.
        #
        # A BROKEN WIRE HERE STILL REDS THE LEG: without them the gate cannot
        # explain a zero, and an unexplained zero remains an error. It is the
        # fail-closed direction, and `tests/e2e/staged-prebuild-libc-gate` holds
        # both keys to this step so the wire cannot go missing quietly.
        env:
          PREBUILD_TARGET: linux-${{ matrix.arch }}
          PREBUILD_REPORT: ${{ needs.changes.outputs.report }}
        run: node scripts/check-staged-prebuild-libc.mjs

  # ----------------------------------------------------------------
  # macOS — prebuilds/darwin-arm64 (Apple silicon) + prebuilds/darwin-x64 (Intel)
  #
  # Until this job existed, EVERY native bridge shipped linux-<arch> only, which
  # made the Node-free gjsify toolchain a Linux-only feature: `gjsify install -g`
  # lays down @gjsify/{rolldown,lightningcss,oxfmt}-native, and on macOS none of
  # the three had an artifact to install.
  #
  # Toolchain: Homebrew, mirroring the `macos` job in napi.yml (the reference
  # macOS leg in this repo). These bridges are LIGHTER than napi's — they need
  # glib/gobject-introspection/vala/meson (+ one library each), not libgjs and
  # mozjs-140 — so there is no source build anywhere in this job.
  #
  # WHAT IS DELIBERATELY NOT HERE, and why (each is a hard blocker, not an
  # oversight — do not "fix" one by adding it to the matrix):
  #
  #   • @gjsify/rolldown-native — the Rust blocker is GONE (the three
  #     `libc::eventfd(2)` descriptors became portable anonymous pipes in
  #     src/rust/src/wakeup.rs, and `cargo check --target aarch64-apple-darwin`
  #     passes), and meson.build is darwin-ready. It is not in the REQUIRED
  #     matrix only because nothing has yet LINKED it on a real macOS host,
  #     generated its typelib, or loaded it under Homebrew `gjs` — and it needs
  #     `json-glib` on top of this job's brew closure plus
  #     `git submodule update --init refs/rolldown` and a rustup toolchain.
  #     It is wired into the manual-dispatch experimental job below; promote it
  #     here once that comes back green.
  #     CONSEQUENCE UNTIL THEN: `gjsify build` still has no engine on macOS —
  #     this job closes the format/CSS half of the toolchain, not the bundler half.
  #
  #   • @gjsify/sab-native — built on `memfd_create`, Linux `futex` and
  #     `SCM_RIGHTS`. It is Linux-only BY DESIGN; the portability decision for it
  #     is owned elsewhere. Do not add it here.
  #
  #   • @gjsify/webgl and @gjsify/webrtc-native — NOT blocked, just unverified.
  #     They pull the two heaviest macOS toolchains (gtk4 + libepoxy; the unified
  #     `gstreamer` formula for gstreamer-sdp-1.0 + gstreamer-webrtc-1.0), and
  #     GTK4's macOS backend caps at desktop GL 4.1 via CGL — no GLES 3.2, which
  #     is what the webgl Vala bridge targets. Rather than gamble a red required
  #     job on an unverified brew closure, they get the manual-dispatch
  #     `build-prebuilds-macos-experimental` job below.
  #
  # NAMING: `darwin-arm64` — the `${process.platform}-${process.arch}` convention
  # every job in this workflow now uses, on every OS (`linux-x64`, `linux-arm64`,
  # `darwin-arm64`). The CLI's loader resolves it without translating, because it
  # is exactly what a running process computes about itself; `buildNativeEnv()`
  # then emits the loader variable the host actually reads (`DYLD_LIBRARY_PATH`
  # on darwin — dyld ignores the ELF one). See
  # packages/infra/cli/src/utils/detect-native-packages.ts.
  # ----------------------------------------------------------------
  build-prebuilds-macos:
    name: Build prebuilds (darwin-${{ matrix.arch }})
    # THE one cost control on a PR, and the only leg a green PR does not cover.
    # macOS runners bill at 10x and come from a small concurrency pool this repo
    # already shares between main.yml and napi.yml, and this is the slowest leg
    # in the workflow (a whole Homebrew closure before anything compiles).
    # Same shape and same escape hatch as main.yml's macOS job: label a PR
    # `ci:macos` to opt it in — do that for anything touching a per-platform
    # path (`meson.build` darwin branches, the Homebrew closure, a `.dylib`
    # leaf). The `prebuilds-summary` job names this leg as NOT covered on every
    # run that skips it, so a green PR cannot read as full coverage.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:macos')
    needs: [changes]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    # Both macOS architectures from ONE job body — the steps are identical, so a
    # second copy would be the drift this repo keeps paying for elsewhere. A
    # static `include:` with an explicit `arch` per entry, per the OS-axis
    # contract in AGENTS.md: `parseCiPlatforms` reads these entries as (arch,
    # runner) PAIRS, which is what lets it derive `darwin-x64` for the Intel leg
    # instead of crediting it with the arm64 target.
    #
    # `macos-15-intel` is the only x86_64 macOS image Actions still offers
    # (`macos-13` retired December 2025) and it is a STANDARD runner, so it is
    # free on this public repo. It is also time-boxed: available until August
    # 2027, after which Apple's discontinuation of x86_64 ends GitHub's support
    # for it. A `darwin-x64` prebuild therefore has a horizon — when that leg
    # goes away, drop the target from `gjsify.platforms` rather than letting it
    # rot into a promise nothing produces.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel

    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      # `${process.platform}-${process.arch}` for whichever runner this leg is.
      PREBUILD: darwin-${{ matrix.arch }}
      # The `changes` job's decision, for the VERIFY steps below. They walk a
      # list of package directories rather than a single `working-directory`,
      # so they cannot carry a step-level `if:` — each one filters its own list
      # instead. Filtering is not cosmetic: the committed `prebuilds/darwin-${{ matrix.arch }}/`
      # of a skipped package is present in the checkout, so an unfiltered loop
      # would happily load-test a binary this run did not build and report it as
      # this run's coverage.
      PREBUILD_SKIP: ${{ needs.changes.outputs.skip }}

    steps:
      - name: Install GI toolchain + per-bridge libraries (Homebrew)
        run: |
          set -euo pipefail
          # gobject-introspection pulls glib (glib-2.0/gobject-2.0/gio-2.0 .pc)
          # and provides g-ir-compiler, which turns valac's .gir into a .typelib.
          # g-ir-scanner is never invoked — `vala_gir:` makes valac emit the GIR
          # directly — so no binary has to be introspected at build time.
          #   gnutls   → @gjsify/tls-native
          #   libsoup  → @gjsify/http-soup-bridge (needs >= 3.6)
          #   libnghttp2 → @gjsify/http2-native
          #   json-glib  → @gjsify/rolldown-native (its Vala bridge passes
          #                rolldown's options/output across as JSON)
          #   gtk4, libepoxy → @gjsify/webgl (Gtk.GLArea + the GL entry points;
          #                libepoxy is what the generated Vala calls into)
          brew install gobject-introspection vala meson ninja pkgconf gnutls libsoup libnghttp2 json-glib \
            gtk4 libepoxy
          BREW_PREFIX="$(brew --prefix)"
          # libnghttp2 is keg-only on macOS (the OS ships its own copy for curl),
          # so it is NOT symlinked into the brew prefix. http2-native reaches it
          # through `cc.find_library('nghttp2', has_headers: [...])` rather than
          # pkg-config, which searches only the compiler's default paths — hence
          # the explicit CPPFLAGS/LDFLAGS. meson reads all three of these at
          # `meson setup` time.
          NGHTTP2_PREFIX="$(brew --prefix libnghttp2)"
          {
            echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/share/pkgconfig:${NGHTTP2_PREFIX}/lib/pkgconfig"
            echo "CPPFLAGS=-I${NGHTTP2_PREFIX}/include"
            echo "LDFLAGS=-L${NGHTTP2_PREFIX}/lib"
          } >> "$GITHUB_ENV"

      - name: Ensure a current Rust toolchain
        if: >-
          ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"')
          || !contains(needs.changes.outputs.skip, '"oxfmt-native"')
          || !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        # lightningcss-native / oxfmt-native / rolldown-native need rustc >= 1.85 (edition2024 in
        # the transitive graph). macOS runners preinstall rustup, so re-running
        # rustup-init would fail; install/refresh the stable toolchain instead
        # and fall back to rustup-init only if rustup is genuinely absent.
        run: |
          set -euo pipefail
          if command -v rustup > /dev/null 2>&1; then
            rustup toolchain install stable --profile minimal
            rustup default stable
          else
            curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
            https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify toolchain
        run: |
          valac --version
          meson --version
          g-ir-compiler --version || true
          cargo --version
          echo "gnutls:      $(pkg-config --modversion gnutls)"
          echo "libsoup-3.0: $(pkg-config --modversion libsoup-3.0)"

      - name: Checkout repository
        uses: actions/checkout@v6

      # The same guard the Linux and musl legs carry, for the same reason: every
      # collect step below DERIVES its target directory from the host, while
      # `PREBUILD` (and therefore every verify step, every upload path) names it
      # literally. On a two-runner matrix that is the one place an Intel leg could
      # stage into `darwin-arm64/` and be believed.
      - name: Confirm this runner resolves as ${{ env.PREBUILD }}
        run: |
          set -euo pipefail
          resolved="$(node -e 'import("./scripts/stage-prebuild.mjs").then((m) => console.log(m.hostStagingTarget()))')"
          echo "stage-prebuild.mjs resolves this runner as: ${resolved}"
          if [ "$resolved" != "$PREBUILD" ]; then
            echo "::error::this runner resolves as \`${resolved}\`, not \`${PREBUILD}\` — the collect steps"
            echo "::error::would stage somewhere the verify and upload steps do not look. Refusing to build."
            exit 1
          fi

      # -------- @gjsify/lightningcss-native (GjsifyLightningcss) --------
      # Pure crates.io deps (no submodule) — the easiest Rust bridge to port.
      - name: Build @gjsify/lightningcss-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        working-directory: packages/infra/lightningcss-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/lightningcss-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        working-directory: packages/infra/lightningcss-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      # -------- @gjsify/oxfmt-native (GjsifyOxfmt) --------
      - name: Init refs/oxc submodule (oxfmt-native source dep)
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        run: git submodule update --init --recursive refs/oxc

      - name: Build @gjsify/oxfmt-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        working-directory: packages/infra/oxfmt-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/oxfmt-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        working-directory: packages/infra/oxfmt-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      # -------- @gjsify/rolldown-native (GjsifyRolldown) --------
      # Promoted out of `build-prebuilds-macos-experimental` on the evidence that
      # job exists to produce: run 30715865402 built the Rust cdylib + Vala bridge,
      # resolved the sibling, loaded GjsifyRolldown.Bundler under Homebrew gjs, and
      # passed the env-free dlopen — every step, none skipped.
      #
      # This is the package that makes the difference between "gjsify runs on
      # macOS" and "gjsify BUILDS on macOS": under GJS the only bundler engine is
      # this bridge (the npm `rolldown` is a napi binary GJS cannot load), so while
      # it shipped linux-only there was no `gjsify build` on any Mac at all. That
      # is why it belongs in the required job rather than behind a dispatch.
      #
      # `--depth 1` (not the `--recursive` the oxc row uses): rolldown's own
      # submodules are test fixtures the Cargo path-dep never reaches, and the
      # shallow fetch still lands the pinned commit that `refs-pin` verifies.
      - name: Init refs/rolldown submodule (rolldown-native source dep)
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        run: git submodule update --init --depth 1 refs/rolldown

      - name: Build @gjsify/rolldown-native (Rust cdylib + Vala bridge)
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        working-directory: packages/infra/rolldown-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/rolldown-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        working-directory: packages/infra/rolldown-native
        # BOTH libraries land here without either being named: the stager matches by
        # EXTENSION, so the Vala `.dylib` AND the `libgjsify_rolldown.dylib` cdylib it
        # records under `@rpath/` are picked up together. Omitting the second was the
        # #832 failure — a missing FILE that reads exactly like a broken rpath — and a
        # hand-written `cp` list is precisely where it went missing.
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      # -------- @gjsify/webkit-native (WebKit-6.0, darwin only) --------
      # The one bridge with NO Linux counterpart: it binds Apple's
      # WebKit.framework, which is why it appears here and in no other job. Its
      # typelib deliberately claims the `WebKit-6.0` namespace so `@gjsify/iframe`
      # keeps `gi://WebKit?version=6.0` verbatim on both platforms (ADR 0022).
      #
      # No `refs/` submodule and no Rust: the source is one Objective-C file and
      # a pure-C header, and the toolchain is clang + meson + gobject-introspection,
      # all of which this runner already has for the rows above.
      - name: Build @gjsify/webkit-native (Objective-C → GObject shim)
        if: ${{ !contains(needs.changes.outputs.skip, '"webkit-native"') }}
        working-directory: packages/framework/webkit-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/webkit-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webkit-native"') }}
        working-directory: packages/framework/webkit-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      # NOT optional, for two reasons that are easy to miss. Without an upload
      # the build is thrown away, so a `ci:macos` run would prove the shim
      # compiles and produce nothing to commit. And `changed-packages.mjs`
      # discovers the package table from exactly these `path:` lines — a bridge
      # with no upload step is invisible to it, so every edit under its
      # directory is classified as "shared input changed" and rebuilds all ten
      # other bridges on all five legs, QEMU included.
      - name: Upload @gjsify/webkit-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webkit-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webkit-native-prebuilds-darwin-${{ matrix.arch }}
          path: packages/framework/webkit-native/prebuilds/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

      # -------- @gjsify/terminal-native (GjsifyTerminal) --------
      # Plain POSIX; the only Linux dependency it had was Vala's `linux.vapi`
      # (`Linux.winsize` / `Linux.Termios.TIOCGWINSZ`), now replaced by the
      # portable sibling src/vala/terminal-compat.vapi.
      - name: Build @gjsify/terminal-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        working-directory: packages/node/terminal-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/terminal-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        working-directory: packages/node/terminal-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      # -------- @gjsify/tls-native (GjsifyTls) --------
      # Builds against gnutls headers only. Its Phase-2 SessionAccess reaches
      # into glib-networking's GTlsConnectionGnutls private struct at RUNTIME;
      # where that backend is absent, `is_supported()` reports false and the API
      # degrades to the documented undefined/false/no-op contract — so a macOS
      # prebuild is still correct, it just may expose Phase 1 (OCSP) only.
      - name: Build @gjsify/tls-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        working-directory: packages/node/tls-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/tls-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        working-directory: packages/node/tls-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      # -------- @gjsify/http-soup-bridge (GjsifyHttpSoupBridge) --------
      - name: Build @gjsify/http-soup-bridge Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        working-directory: packages/node/http-soup-bridge
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/http-soup-bridge prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        working-directory: packages/node/http-soup-bridge
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      # -------- @gjsify/http2-native (GjsifyHttp2) --------
      - name: Build @gjsify/http2-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        working-directory: packages/node/http2-native
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/http2-native prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        working-directory: packages/node/http2-native
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      # @gjsify/webgl was built by the EXPLORATORY job below for months without
      # anything downloading its output, so it built, proved it worked and threw
      # the result away. Nothing about it needed fixing to move here: its
      # `meson.build` already branches on `host_machine.system()` and records
      # `libgwebgl.dylib` in the typelib. Verified before promoting it, by
      # building it on a darwin-x64 host and resolving a class through GI —
      # `Gwebgl.WebGLRenderingContext` resolves, which is what proves the dlopen
      # actually happened, and `check-prebuild-loader-path.mjs` reads the Mach-O
      # as sound (one library, so no sibling hop to get wrong).
      - name: Build @gjsify/webgl Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/framework/webgl
        run: |
          meson setup build .
          meson compile -C build

      - name: Collect @gjsify/webgl prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/framework/webgl
        run: node ../../../scripts/stage-prebuild.mjs . --scratch

      # A typelib whose recorded shared-library leaf still says `.so` is found via
      # GI_TYPELIB_PATH but never loads — the exact silent failure this job's
      # meson `host_machine.system()` branches exist to prevent. Assert it once
      # here so a regression fails the build instead of shipping a dead prebuild.
      - name: Verify every typelib records a .dylib leaf
        run: |
          set -euo pipefail
          # `rc`, not `status`: `status` is a read-only special variable in zsh,
          # so the same snippet stays copy-pasteable outside the bash CI shell.
          rc=0
          # The one table, filtered to what this run built. `PREBUILD_SKIP` is
          # applied by the script, so the `built()` helper this step used to carry
          # (in four copies across this job) is gone.
          while read -r dir; do
            [ -n "$dir" ] || continue
            # `nullglob` + an explicit count, because the OLD loop's failure here
            # was UNNAMED: with no `.gir` in the directory the glob stayed literal,
            # `grep` failed on a path that does not exist, and `set -e` killed the
            # step with no mention of which package was missing what. The ten
            # committed linux directories that carry no `.gir` are exactly how that
            # state arises.
            shopt -s nullglob
            girs=("$dir"/*.gir)
            shopt -u nullglob
            if [ ${#girs[@]} -eq 0 ]; then
              echo "::error::$dir holds no .gir — the collect step staged an incomplete set (a typelib's recorded shared-library leaf cannot be verified without it)"
              rc=1
              continue
            fi
            for gir in "${girs[@]}"; do
              # -m1 rather than `| head -1`: under `set -o pipefail` a closed pipe
              # would surface as a spurious failure of the grep itself.
              leaf="$(grep -m1 -o 'shared-library="[^"]*"' "$gir")"
              echo "$gir -> $leaf"
              case "$leaf" in
                *.dylib\") ;;
                *) echo "::error file=$gir::expected a .dylib shared-library leaf, got: $leaf"; rc=1 ;;
              esac
            done
          done < <(node .github/prebuild-toolchain/darwin-bridges.mjs prebuild-dirs \
                     --target "$PREBUILD" --skip "${PREBUILD_SKIP:-}")
          exit $rc

      # The Vala+Rust bridges ship TWO libraries whose leaf names differ on
      # purpose (`libgjsifyoxfmt.dylib` is what the typelib names;
      # `libgjsify_oxfmt.dylib` is what it links against), and nothing above
      # checks the second one at all. Two ways that ships broken, both of which
      # this asserts structurally — on the artifact, before it is uploaded:
      #   • the cdylib is not staged (the `cp` list forgot it), so dyld expands
      #     the rpath to the right directory and finds nothing there;
      #   • the Vala library records no `@loader_path`, so dyld searches
      #     Homebrew prefixes instead of the directory the pair shares.
      - name: Verify every prebuild resolves its own siblings
        run: |
          set -euo pipefail
          # ONE invocation over every directory — the checker's output is a
          # per-directory report and a single verdict — so the rows are collected
          # into an array first.
          #
          # NOT `mapfile`/`readarray`: this job runs on macOS, where `/bin/bash` is
          # **3.2** (Apple ships no GPLv3 bash) and both are bash-4 builtins. It
          # failed exactly that way — `mapfile: command not found`, exit 127 — while
          # `bash -n` on a Linux bash 5 host had passed, which is the same
          # wrong-shell false green AGENTS.md records for git-bash on Windows. The
          # `while read` + `+=` form is bash 3.2 (and POSIX-ish); the machine check
          # that keeps this from regrowing lives in
          # `tests/e2e/prebuild-change-gate`.
          dirs=()
          while IFS= read -r d; do
            [ -n "$d" ] && dirs+=("$d")
          done < <(node .github/prebuild-toolchain/darwin-bridges.mjs prebuild-dirs \
                     --target "$PREBUILD" --skip "${PREBUILD_SKIP:-}")
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no bridge was rebuilt on this run — nothing to verify"
            exit 0
          fi
          node scripts/check-prebuild-loader-path.mjs "${dirs[@]}"

      # THE gate this job was missing. Until now it built six darwin-${{ matrix.arch }}
      # bridges, copied them, and uploaded them for `commit-prebuilds` to commit
      # to main — without ever loading one. The only job that loaded anything was
      # the manual-dispatch experimental one, which is precisely why a prebuild
      # that cannot be loaded reached main unnoticed.
      #
      # `imports.gi.<Ns>.<Class>` is the trigger, not a formality: resolving a
      # GObject class forces GI to call the class's `…_get_type` symbol, which
      # is what dlopens the recorded shared library and, transitively, its Rust
      # sibling. A typelib that is merely FOUND resolves the namespace and then
      # throws here.
      - name: Load-test every darwin-${{ matrix.arch }} prebuild under Homebrew gjs
        run: |
          set -euo pipefail
          brew install gjs
          rc=0
          # Rows from the one table (`dir|namespace|class`), already filtered to
          # what this run built — the heredoc this replaced was the third copy of
          # the package set and the one that carried `rolldown-native` while two
          # others did not.
          while IFS='|' read -r dir ns sym; do
            [ -n "$dir" ] || continue
            abs="$PWD/${dir}/prebuilds/${PREBUILD}"
            echo "--- ${ns}.${sym} from ${abs}"
            # GI_TYPELIB_PATH locates the typelib; DYLD_LIBRARY_PATH is what lets
            # dlopen resolve the BARE leaf the typelib records (dyld has no
            # notion of "next to the typelib"). The sibling cdylib is
            # deliberately NOT covered by that variable — see the next step.
            #
            # DYLD_FALLBACK_LIBRARY_PATH carries the HOST's libdir, and the split
            # between the two variables is the whole point rather than belt and
            # braces: the override variable wins by LEAF for every dylib in the
            # process, so a system libdir in it would shadow the very libraries a
            # prebuild links against. That is exactly the division
            # `buildNativeEnv()` makes on darwin — this step CLAIMED to mirror it
            # and did not, carrying only the override half, which held for as
            # long as no bridge here needed a host GNOME library by bare leaf.
            # `@gjsify/webkit-native` is the first that does (its typelib
            # references `libgtk-4.1.dylib`), and it failed with GJS's own Gtk
            # override unable to load — the darwin bare-leaf gap in
            # status/open-todos.md, surfacing in CI rather than in a consumer.
            # `/usr/lib` is appended because setting the variable REPLACES dyld's
            # default fallback list.
            #
            # `< /dev/null`: the loop's stdin is the table rows, and a child that
            # reads it would eat the remaining ones.
            if GI_TYPELIB_PATH="$abs" DYLD_LIBRARY_PATH="$abs" \
               DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib:/usr/lib" gjs -c \
                 "const T = imports.gi.${ns}.${sym};
                  if (typeof T !== 'function') { throw new Error('${ns}.${sym} did not resolve to a class'); }
                  print('${ns}.${sym} resolved — shared library loaded');" < /dev/null
            then :; else
              echo "::error::${ns} prebuild in ${abs} does not load"
              rc=1
            fi
          done < <(node .github/prebuild-toolchain/darwin-bridges.mjs load-tests \
                     --target "$PREBUILD" --skip "${PREBUILD_SKIP:-}")
          exit $rc

      # The stricter half: prove the Vala→Rust hop needs NO environment variable.
      # A prebuild that only loads because a launcher happened to export
      # DYLD_LIBRARY_PATH is fragile — dlopen the Vala library by ABSOLUTE path
      # with the loader variables unset, so the ONLY thing that can find the
      # sibling cdylib is the library's own @loader_path rpath.
      #
      # /usr/bin/python3 is used deliberately: SIP strips DYLD_* when spawning a
      # system binary, so the test cannot be contaminated by inherited state even
      # if `env -u` missed something.
      - name: Prove the sibling cdylib resolves with no environment variable
        run: |
          set -euo pipefail
          rc=0
          # Only the bridges that HAVE a sibling cdylib, which the table declares
          # (`rustSibling`) rather than this step re-deciding. A bridge with one
          # library has no hop to prove, so listing it would claim coverage its
          # artifact does not need — and the library leaf comes from the table's
          # own derivation, so it cannot drift from the name the typelib records.
          while IFS='|' read -r pkg lib; do
            [ -n "$lib" ] || continue
            echo "--- dlopen $lib with no DYLD_* set"
            if env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH /usr/bin/python3 -c \
                 'import ctypes, sys; ctypes.CDLL(sys.argv[1]); print("loaded", sys.argv[1])' "$PWD/$lib"
            then :; else
              echo "::error::$lib ($pkg) does not resolve its sibling Rust cdylib via @loader_path"
              rc=1
            fi
          done < <(node .github/prebuild-toolchain/darwin-bridges.mjs rust-libs \
                     --target "$PREBUILD" --skip "${PREBUILD_SKIP:-}")
          exit $rc

      - name: Upload @gjsify/lightningcss-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: lightningcss-native-prebuilds-darwin-${{ matrix.arch }}
          path: packages/infra/lightningcss-native/prebuilds/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/oxfmt-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: oxfmt-native-prebuilds-darwin-${{ matrix.arch }}
          path: packages/infra/oxfmt-native/prebuilds/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/rolldown-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: rolldown-native-prebuilds-darwin-${{ matrix.arch }}
          path: packages/infra/rolldown-native/prebuilds/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/terminal-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-native-prebuilds-darwin-${{ matrix.arch }}
          path: packages/node/terminal-native/prebuilds/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/tls-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: tls-native-prebuilds-darwin-${{ matrix.arch }}
          path: packages/node/tls-native/prebuilds/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/http-soup-bridge prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http-soup-bridge-prebuilds-darwin-${{ matrix.arch }}
          path: packages/node/http-soup-bridge/prebuilds/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/http2-native prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: http2-native-prebuilds-darwin-${{ matrix.arch }}
          path: packages/node/http2-native/prebuilds/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/webgl prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webgl-prebuilds-darwin-${{ matrix.arch }}
          path: packages/framework/webgl/prebuilds/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------
  # macOS exploratory — @gjsify/webgl + @gjsify/webrtc-native
  #
  # MANUAL DISPATCH ONLY, and deliberately NOT in `commit-prebuilds`'s `needs`,
  # so it can never red a normal run — the same honest posture napi.yml uses for
  # its Windows attempt. These two are not known-blocked; they are UNVERIFIED:
  #
  #   • webgl: RESOLVED, promoted into `build-prebuilds-macos` above. The concern
  #     recorded here was real and is now measured rather than suspected. On
  #     macOS 15.7, CGL does cap out at desktop GL 4.1 (asking for the 3.2 Core
  #     profile returns a 4.1 context) and offers no GLES profile at all — but of
  #     every GL entry point this bridge uses, exactly TWO are absent from
  #     OpenGL.framework: `glInvalidateFramebuffer` and
  #     `glInvalidateSubFramebuffer` (GL 4.3). `glTexStorage3D` and
  #     `glGetInternalformativ` are GL 4.2 and Apple ships them anyway. Since
  #     libepoxy resolves lazily and ABORTS on a miss, those two would have killed
  #     any macOS app touching a WebGL2 framebuffer; both are discardable-contents
  #     HINTS the spec lets an implementation ignore, so they are now guarded on
  #     `epoxy_gl_version() >= 43` and skipped instead. What remains unverified is
  #     RENDERING: a display-less host can create a GL context but not drive a
  #     `Gtk.GLArea`, so the first real macOS desktop run is still the one that
  #     proves pixels. The prebuild is declared because it builds and LOADS, which
  #     is this repo's documented bar; the CI load test holds that.
  #   • webrtc-native needs gstreamer-sdp-1.0 + gstreamer-webrtc-1.0, which come
  #     from gst-plugins-base/bad inside Homebrew's unified `gstreamer` formula.
  #     Whether that formula exports both .pc files is the open question.
  #
  # Run it, read the log, and promote whatever passes into build-prebuilds-macos
  # above (with an upload step + commit wiring) — or record the specific failure.
  # ----------------------------------------------------------------
  build-prebuilds-macos-experimental:
    name: Build prebuilds (darwin-arm64) [experimental — webrtc]
    needs: [changes]
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      PREBUILD: darwin-arm64

    steps:
      - name: Install GI toolchain + GTK4/GStreamer (Homebrew)
        run: |
          set -euo pipefail
          brew install gobject-introspection vala meson ninja pkgconf gtk4 libepoxy gdk-pixbuf gstreamer
          BREW_PREFIX="$(brew --prefix)"
          echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Report what pkg-config actually resolved
        # The evidence this job exists to produce: whether the unified gstreamer
        # formula exports gstreamer-sdp-1.0/gstreamer-webrtc-1.0 at all.
        run: |
          for pc in gtk4 epoxy gdk-pixbuf-2.0 gstreamer-1.0 gstreamer-sdp-1.0 gstreamer-webrtc-1.0; do
            printf '%-24s %s\n' "$pc" "$(pkg-config --modversion "$pc" 2>/dev/null || echo 'MISSING')"
          done

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build @gjsify/webrtc-native Vala library
        if: ${{ !contains(needs.changes.outputs.skip, '"webrtc-native"') }}
        working-directory: packages/web/webrtc-native
        # `--allow-undeclared` is not decoration here: `darwin-arm64` is deliberately
        # absent from this package's `gjsify.platforms` (that is what makes this leg
        # exploratory), so the stager prints its own "do NOT commit this" warning and
        # `--scratch` keeps the bytes in the bridge for the advisory load test below.
        run: |
          meson setup build .
          meson compile -C build
          node ../../../scripts/stage-prebuild.mjs . --scratch --allow-undeclared

      # The gate these two still owe before they can be promoted. rolldown-native
      # left this job on exactly this evidence and nothing less: BUILT is not
      # LOADABLE, and the distance between them is where #832 lived — a typelib
      # that GI_TYPELIB_PATH finds and that then never dlopens its library.
      #
      # ADVISORY, not fatal, and deliberately so: this job is dispatch-only, so it
      # reds no PR either way, and the reason to run it is to READ the answer. A
      # hard failure here would stop the run before the second row is even tried,
      # which is the opposite of what an exploratory leg is for. When both rows
      # print "resolved", promote them into `build-prebuilds-macos` the way
      # rolldown-native was promoted — with the load test made FATAL there.
      - name: Load-test what was built (advisory)
        if: always()
        run: |
          set -uo pipefail
          brew install gjs
          while IFS='|' read -r dir ns sym; do
            [ -n "$dir" ] || continue
            abs="$PWD/${dir}/prebuilds/${PREBUILD}"
            [ -d "$abs" ] || { echo "--- ${ns}: not built by this run"; continue; }
            echo "--- ${ns}.${sym} from ${abs}"
            # `< /dev/null`: the loop's stdin is the heredoc, and a child that
            # reads it would swallow the remaining rows.
            if GI_TYPELIB_PATH="$abs" DYLD_LIBRARY_PATH="$abs" gjs -c \
                 "const T = imports.gi.${ns}.${sym};
                  if (typeof T !== 'function') { throw new Error('${ns}.${sym} did not resolve to a class'); }
                  print('${ns}.${sym} resolved — shared library loaded');" < /dev/null
            then :; else
              echo "::warning::${ns} builds on darwin but does not load — that IS the finding this job exists for"
            fi
          done <<'EOF'
          packages/web/webrtc-native|GjsifyWebrtc|WebrtcbinBridge
          EOF

  # ════════════════════════════════════════════════════════════════════════════
  # win32-x64 — @gjsify/webgl, SPLIT ACROSS TWO JOBS
  #
  # PROMOTED. This pair was `workflow_dispatch`-only for as long as it took to
  # answer the questions below; the answers are all in, so it now runs on every
  # event like any other leg, `@gjsify/webgl` declares `win32-x64`,
  # `@gjsify/webgl-win32-x64` holds the artifact and `commit-prebuilds` lands it.
  # The declared-vs-built invariant is SYMMETRIC, which is why those four
  # arrived in one change rather than one at a time.
  #
  # THE PROMOTION FIXED A PARSER ASSUMPTION, and it is worth knowing which:
  # `parseCiPlatforms()` used to treat any job containing an
  # `actions/download-artifact` step as a pure CONSUMER and credit it with
  # nothing, on the stated ground that "no producer downloads". This pair is the
  # counter-example — the Windows half downloads the Linux half's generated C
  # and then builds the artifact — so the exclusion moved from the JOB to the
  # STEP. Without that, `@gjsify/webgl` would declare a target the audit could
  # not see any job produce, and this promotion would fail the very invariant it
  # satisfies.
  #
  # ── WHY IT IS TWO JOBS: valac MUST NOT RUN ON WINDOWS ─────────────────────
  #
  # This is the whole shape of the thing, and it is a researched conclusion
  # rather than a preference:
  #   • There is no standalone MSVC valac. `supercamel/ValaOnWindows` ships no
  #     compiler of its own (it points at Ooblerg or MSYS2 pacman), builds with
  #     MinGW-w64 gcc, and explicitly does not cover shared libraries or
  #     GIR/typelib generation — i.e. it omits both artifacts this bridge IS.
  #   • gvsbuild has no `vala` project at all. Its project list (checked against
  #     `repos/wingtk/gvsbuild/contents/gvsbuild/projects`) carries libepoxy,
  #     gtk, glib, gobject_introspection, libsoup, nghttp2, libnice and
  #     gstreamer — and no Vala compiler.
  #   • Reaching for MinGW anyway is an ABI HAZARD, not a shortcut. gvsbuild's
  #     GTK4 is MSVC-ABI, and this job's load test goes through
  #     `@gjsify/node-gi`, whose Windows stack loads girepository out of that
  #     same bundle. A MinGW-built DLL against MSVC-ABI GLib mixes CRTs, and
  #     GLib routinely allocates what the consumer frees. `napi.yml`'s `windows`
  #     job records the identical wall for the identical reason — read its
  #     header before proposing MinGW here.
  #
  # So: a host that HAS valac emits the C sources AND the GIR (valac produces
  # both; `vala_gir:` in the package's meson.build is what asks for the GIR),
  # and the Windows half compiles that C with MSVC and runs gvsbuild's
  # `g-ir-compiler` on that GIR.
  #
  # ── WHY THE C IS AN ARTIFACT AND NEVER A COMMIT ───────────────────────────
  #
  # Generation and consumption are two jobs of ONE RUN: same commit, same valac,
  # so drift between them is structurally impossible rather than merely
  # unlikely. A committed copy would be a build input nothing regenerates and
  # nothing byte-checks — precisely the stale-artifact class AGENTS.md
  # § Committed-artifact freshness exists to keep out, and the one committed
  # artifact family that still has no byte-check is `prebuilds/**` itself. The
  # package's `.gitignore` entry for `vala-c-export/` is the mechanism; the
  # option's comment is only the explanation.
  #
  # ── WHY ONE meson.build AND NOT A SECOND ──────────────────────────────────
  #
  # The Windows path lives in `packages/framework/webgl/meson.build` behind
  # `-Dprebuilt_vala_c=<dir>`, not in a parallel build file. A second
  # description is only ever exercised by the platform that uses it, so it
  # drifts from the one Linux CI reads on every PR and nobody finds out until
  # somebody dispatches this. The branch is "somebody else ran valac", NOT "this
  # is MSVC" — which is why a Linux host can and does exercise it (measured
  # locally before this landed: the prebuilt-C branch under GCC produces a
  # `Gwebgl-0.1.typelib` BYTE-IDENTICAL to the valac branch's, and both load
  # `Gwebgl.WebGLRenderingContext` under stock gjs).
  #
  # ── THE ONE GENUINE UNKNOWN — ANSWERED: YES, MSVC COMPILES IT ─────────────
  #
  # MEASURED END TO END, and the leg is GREEN (run 30808747504, cl.exe
  # 19.51.36252 / VS 2026, valac 0.56.19, gvsbuild 2026.6.0 = GLib 2.88.1 /
  # GTK 4.22.4 / epoxy 1.5.10):
  #   • all four generated `.c` files compiled, `gwebgl.dll` linked (189440 B),
  #     `Gwebgl-0.1.typelib` generated (41744 B — the Linux one is 41752 B, and
  #     the 8-byte delta is the recorded leaf string, `gwebgl.dll` vs
  #     `libgwebgl.so`);
  #   • ZERO language diagnostics on any file, so nothing about the generated
  #     code needed changing;
  #   • `Gwebgl.WebGLRenderingContext` resolved through node-gi, i.e. GI called
  #     `…_get_type` and the DLL was really loaded.
  # The FIRST dispatch (run 30808356641) is worth knowing about because it is
  # what located the one real obstacle: it compiled 2 of the 4 files and failed
  # the other two on `C1083: Cannot open include file: 'epoxy/gl.h'` — a header
  # present on disk that no `.pc` file names. See the `INCLUDE` line in the build
  # step; the mechanism is now printed by the diagnostics step every run.
  #
  # The pre-dispatch source scan that predicted this is kept because it explains
  # WHY, and because it is the thing to re-run if a valac bump ever breaks it —
  # across 10266 lines of emitted C (4 `.c` + `gwebgl.h`) there is no construct
  # MSVC rejects:
  #   • ZERO statement expressions, `typeof`, `__extension__`, `__builtin_*`,
  #     nested functions, VLAs or `long long`.
  #   • The single `__attribute__` in the whole set sits inside valac's OWN
  #     `#if defined(_MSC_VER)` ladder in `gwebgl.h`, whose MSVC arm is
  #     `#define VALA_EXTERN __declspec(dllexport) extern`. Vala therefore
  #     already handles Windows symbol export itself — no `.def` file, unlike
  #     the napi shim. And because that ladder is a PREPROCESSOR decision, C
  #     generated on Linux still takes the MSVC arm when MSVC compiles it, which
  #     is the property that makes this split work at all.
  #   • The only remaining GCC-isms are 3 `#pragma GCC/clang diagnostic` lines,
  #     which MSVC ignores as unknown pragmas (C4068).
  # `c_std` is deliberately NOT preset — MSVC's default C mode is its most
  # permissive, and the first run confirmed nothing stricter is needed. THE RULE
  # THAT GOT THIS ANSWER, kept for whoever hits the next wall: record what the
  # compiler actually rejected. Do not reach for flags that hide a real
  # incompatibility, and do not fall back to MinGW (see the ABI hazard above).
  # Selecting a C STANDARD or supplying a missing include DIRECTORY answers a
  # real question about the platform; `/w` answers none.
  #
  # ── WHAT THE PROMOTION ANSWERED, and what it deliberately did not ─────────
  #
  # "It built and loaded" was never the whole bill. The three open items and
  # where each landed:
  #   • `gwebgl.dll` imports `epoxy-0.dll` and Windows has no system libepoxy,
  #     so this is the ONE prebuild in the repo whose runtime closure is not
  #     satisfiable from the host. RESOLVED BY NOT MOVING ANY BYTES: the epoxy
  #     that satisfies it already ships, in `@gjsify/gtk-runtime-win32-x64`
  #     (GTK4 links it), and every win32 consumer of `@gjsify/webgl` has that
  #     package because it is how node-gi gets GObject at all. Duplicating epoxy
  #     into this tarball would ship a second copy of a DLL already on the
  #     process's search path — two libepoxy images in one address space is a
  #     worse failure than the one being solved. So the tarball's contract is
  #     identical to every sibling's (a `.dll` + its typelib) and the closure is
  #     documented in `@gjsify/webgl`'s README instead of packaged around.
  #   • The load test proves `dlopen` + `…_get_type`, never RENDERING — a
  #     display-less runner cannot drive a `Gtk.GLArea`, exactly as the macOS
  #     note above says. STILL TRUE, and it is why the promotion waited on a
  #     measurement no runner can make: `three-geometry-teapot` rendering on a
  #     real Windows desktop (win11-gjsify VM, Mesa 26.1.6 as the system ICD,
  #     GL 4.6 core). CI proves the artifact loads; a desktop proved it draws.
  #   • The CRT question is answered by the `Assert the prebuild links the
  #     REDISTRIBUTABLE CRT` step below, which reads the import table rather
  #     than loading anything — see its own comment for the incident.
  #
  # WHAT IS STILL OPEN, and is NOT this pair's to close: on a Windows host with
  # no vendor OpenGL ICD (a GPU-less VM, an RDP session, CI) the GL showcases
  # stay dark, because the batteries-included bundle ships no GL implementation
  # of its own — `epoxy-0.dll` is the dispatch layer and resolves nothing alone.
  # That is tracked as #1097 against the bundle, not against this prebuild.
  # ════════════════════════════════════════════════════════════════════════════
  webgl-vala-c-win32:
    name: Emit Vala C + GIR for the win32 build (fedora)
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 20
    container:
      # THE BAKED IMAGE, not a bare `fedora:43` — required, and machine-checked
      # by `scripts/check-ci-image-packages.mjs`: an amd64 containerised job that
      # COULD run on this image and does not must be ledgered with a reason, and
      # that ledger is deliberately empty. (It caught this job on its first run.
      # The three jobs still on a bare image are all `ubuntu-24.04-arm`, which
      # the check DERIVES as excused because `build-ci-image.yml` publishes
      # linux/amd64 only.) It also removes the `dnf install` this job used to
      # carry: the image already bakes meson, vala, gcc, pkgconf, glib2-devel,
      # gobject-introspection-devel, gtk4-devel, gdk-pixbuf2-devel and
      # libepoxy-devel, which is exactly this job's set.
      #
      # TAG 43, NOT 44, and for the VALAC VERSION rather than for glibc:
      # `ci-fedora:43` is `FROM fedora:43`, the image `build-prebuilds` pins, so
      # ONE valac produces the C for every target — the same compiler that builds
      # the committed Linux prebuilds emits what MSVC will compile, and the two
      # halves cannot disagree about generated code. The elaborate glibc-floor
      # argument on `build-prebuilds`' image does NOT apply here: everything this
      # job emits is text (C sources and an XML GIR), so this line is not a
      # distribution decision.
      image: ghcr.io/gjsify/ci-fedora:43
    steps:
      # Gated STEP BY STEP, never as a whole job — `commit-prebuilds` lists this
      # pair in `needs`, and a job skipped in its entirety would skip THAT one
      # too, silently suppressing the commit of everything the other legs
      # produced. So a run where webgl did not change walks both jobs and does
      # nothing in either, which costs seconds. (While the pair was
      # dispatch-only the gate was deliberately absent, because a dispatch
      # diffs against nothing and `skip` was always `[]` — that reasoning
      # retired with the promotion.)
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify the baked toolchain + record the generator's provenance
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        # TWO jobs, one step, because they print the same three facts. Verifying
        # is the convention every job on this image follows — assert the tools
        # are there rather than assume the pull was the image you meant, so a
        # bare `fedora:43` fails HERE naming the cause instead of inside `meson
        # setup`. Recording is what makes the C downstream actionable: it is an
        # opaque artifact by the time MSVC sees it, and a "MSVC rejects this"
        # finding is only useful next to a valac version.
        run: |
          echo "ci-fedora image major: $(cat /etc/gjsify-ci-fedora-version)"
          valac --version
          meson --version
          pkg-config --modversion glib-2.0 gtk4 epoxy gdk-pixbuf-2.0

      # The ORDINARY Linux build — no options, the same two commands every other
      # Linux leg runs. Meson drives valac as part of it and leaves the emitted
      # `.c` in its private object dir; running the full compile (rather than
      # just the codegen rule) also proves on the cheapest possible host that the
      # C compiles at all, so a Windows failure is unambiguously about MSVC.
      - name: Build @gjsify/webgl Vala library (generates the C + GIR)
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/framework/webgl
        run: |
          meson setup build .
          meson compile -C build

      # Meson has no declared output for the Vala→C step, so the export reads its
      # private object dir. That path is derived the same way this workflow's
      # other Linux steps derive `build/libgwebgl.so` — and every assumption in
      # it is ASSERTED rather than trusted, because a silent partial export would
      # surface on Windows as an undefined symbol at link time, a long way from
      # its cause.
      #
      # The `.vala` list is read off DISK and each file's `.c` is required to
      # exist. That also catches a `src/vala/*.vala` the package's `meson.build`
      # does not list — a file the Linux build silently ignores today.
      - name: Export the generated C + GIR
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/framework/webgl
        run: |
          set -euo pipefail
          PRIV=build/libgwebgl.so.p
          OUT=vala-c-export
          if [ ! -d "$PRIV" ]; then
            echo "::error::$PRIV is missing. Meson keeps the Vala-generated C in <builddir>/<library-file>.p/; either that layout changed or the library target was renamed. Fix this path, do not glob for it — picking the wrong private dir exports the TEST APP's subset and fails on Windows at link time."
            exit 1
          fi
          mkdir -p "$OUT/src/vala"
          rc=0
          for vala in src/vala/*.vala; do
            rel="src/vala/$(basename "$vala" .vala).c"
            if [ -f "$PRIV/$rel" ]; then
              cp "$PRIV/$rel" "$OUT/$rel"
            else
              echo "::error file=$vala::valac emitted no $rel — this .vala is not in meson.build's \`vala_sources\`, so the Linux build is ignoring it too."
              rc=1
            fi
          done
          # `gwebgl.h` is what every generated `.c` `#include`s; the GIR is the
          # g-ir-compiler input. Both are meson-declared outputs of the library
          # target, so these two paths are not layout guesses.
          cp build/gwebgl.h "$OUT/gwebgl.h"
          cp build/Gwebgl-0.1.gir "$OUT/Gwebgl-0.1.gir"
          echo "--- exported ---"
          find "$OUT" -type f | sort
          echo "--- the leaf THIS host's typelib recorded (for contrast, not shipped) ---"
          grep -m1 -o 'shared-library="[^"]*"' build/Gwebgl-0.1.gir || true
          exit $rc

      - name: Upload the Vala C + GIR
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webgl-vala-c-win32
          path: packages/framework/webgl/vala-c-export/
          if-no-files-found: error
          # Short on purpose: this is an intermediate consumed by the next job of
          # the SAME run. Nothing should ever reach for an old one — that would
          # be the committed-generated-C failure wearing a different hat.
          retention-days: 1

  build-prebuilds-win32:
    name: Build prebuilds (win32-x64) [webgl via MSVC]
    needs: [changes, webgl-vala-c-win32]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PREBUILD: win32-x64
      # gvsbuild setup is REUSED VERBATIM from node-gi.yml's `windows` job,
      # down to the cache key, so the two share one warm cache and there is
      # exactly one place that knows how a Windows GTK/GI toolchain is acquired
      # in this repository. Do not hand-roll a second copy; if this needs to
      # move, move it there.
      GVSBUILD_VERSION: '2026.6.0'
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Node 24 builds `@gjsify/node-gi` (node-gyp) and runs the load test — the
      # same version node-gi.yml's Windows jobs pin.
      #
      # From here down every step carries the `changes` gate, the SETUP ones
      # included: acquiring a 400 MB GTK stack for a package this run did not
      # change is the whole cost the gate exists to avoid, and gating only the
      # build steps would pay it anyway. See the vala-c job for why the gate is
      # per-step and never on the job.
      - name: Use Node.js 24
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache gvsbuild GTK4 bundle
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk\x64\release
          key: gvsbuild-gtk4-${{ env.GVSBUILD_VERSION }}-x64-v1

      - name: Download + extract gvsbuild GTK4 (MSVC-ABI, girepository-2.0)
        # A SKIPPED cache step leaves `cache-hit` empty, so `!= 'true'` is true
        # and this would run on a skipped-package run without the second half.
        if: ${{ steps.cache-gtk.outputs.cache-hit != 'true' && !contains(needs.changes.outputs.skip, '"webgl"') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      - name: Put GTK on PATH + set GI/PKG env
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        shell: pwsh
        run: |
          "$env:GTK_PREFIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=$env:GTK_PREFIX\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The typelib DIRECTORY is historically named girepository-1.0 even for
          # the girepository-2.0 API.
          "GI_TYPELIB_PATH=$env:GTK_PREFIX\lib\girepository-1.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GSETTINGS_SCHEMA_DIR=$env:GTK_PREFIX\share\glib-2.0\schemas" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install meson + ninja
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        run: python -m pip install --disable-pip-version-check meson ninja

      # THE EVIDENCE THIS JOB EXISTS TO PRODUCE, printed before anything can
      # fail on it — the same posture `build-prebuilds-macos-experimental` takes
      # with its "Report what pkg-config actually resolved" step. Two open
      # questions live here:
      #   • does the gvsbuild GTK4 bundle export `epoxy.pc`? GTK4 links libepoxy
      #     on Windows and gvsbuild has a libepoxy project, but the release ZIP's
      #     dev files are what decide it, and this bridge's C
      #     `#include <epoxy/gl.h>`.
      #   • is the typelib compiler still called `g-ir-compiler.exe`? GLib ≥ 2.80
      #     moved girepository in-tree and ships `gi-compile-repository`; the
      #     package's meson.build asks `find_program('g-ir-compiler')`, so an
      #     absent alias fails at `meson setup` with a message that does not
      #     explain itself. Naming both here turns that into a diagnosis. If it
      #     IS missing, teaching meson.build to accept either name is the fix —
      #     and it touches Linux and macOS too, so make it deliberately.
      - name: Report what the Windows toolchain actually resolved
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        shell: pwsh
        run: |
          Write-Host "pkg-config: $((Get-Command pkg-config -ErrorAction SilentlyContinue).Source)"
          foreach ($pc in @('glib-2.0','gobject-2.0','gdk-pixbuf-2.0','gtk4','epoxy','girepository-2.0')) {
            $v = & pkg-config --define-prefix --modversion $pc 2>$null
            if ($LASTEXITCODE -ne 0) { $v = 'MISSING' }
            Write-Host ("{0,-20} {1}" -f $pc, $v)
          }
          Write-Host "--- typelib compilers on PATH ---"
          foreach ($exe in @('g-ir-compiler','gi-compile-repository')) {
            $c = Get-Command "$exe" -ErrorAction SilentlyContinue
            Write-Host ("{0,-24} {1}" -f $exe, $(if ($c) { $c.Source } else { 'MISSING' }))
          }
          Write-Host "--- epoxy header ---"
          Write-Host $(if (Test-Path "$env:GTK_PREFIX\include\epoxy\gl.h") { 'epoxy/gl.h present' } else { 'epoxy/gl.h MISSING' })
          # MEASURED, not inferred: the first dispatch failed C1083 on
          # `epoxy/gl.h` while the header was present and `epoxy.pc` resolved,
          # because `epoxy.pc` emits NO -I at all. On a POSIX prefix
          # `<prefix>/include` is a default compiler search path so a .pc has
          # nothing to add; MSVC has no such default, so the header is present
          # and unreachable. Print the cflags each dependency contributes so
          # that mechanism stays visible in the log instead of living only in a
          # comment — glib is the contrast case, it names its own subdirectory.
          Write-Host "--- cflags each dependency contributes ---"
          foreach ($pc in @('epoxy','glib-2.0','gtk4')) {
            Write-Host ("{0,-12} {1}" -f $pc, (& pkg-config --define-prefix --cflags-only-I $pc 2>&1))
          }

      - name: Download the Vala C + GIR
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/download-artifact@v8
        with:
          name: webgl-vala-c-win32
          # The meson option takes a path RELATIVE to the package, because
          # meson's source sandbox refuses a `files()` outside the tree. Landing
          # the download here is what makes `-Dprebuilt_vala_c=vala-c-export`
          # resolvable, and `vala-c-export/` is gitignored so it can never be
          # committed by accident.
          path: packages/framework/webgl/vala-c-export

      - name: Show what arrived
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        shell: pwsh
        run: Get-ChildItem packages/framework/webgl/vala-c-export -Recurse -File | ForEach-Object { $_.FullName }

      # ONE `cmd` step, because vcvars64.bat exports its environment into the
      # shell it runs in and meson needs `cl.exe` on PATH. Deliberately NOT a
      # third-party "setup MSVC" action and NOT a vcvars→$GITHUB_ENV dump:
      # GitHub ignores PATH written through $GITHUB_ENV (it wants $GITHUB_PATH),
      # so that dump silently loses the one variable that matters. vswhere is how
      # this repo already locates the VS install (node-gi.yml's windowing bundle
      # finds dumpbin the same way) rather than hard-coding an edition.
      #
      # `meson compile` runs BOTH halves of the Windows build: cl.exe over the
      # imported C into `gwebgl.dll`, then g-ir-compiler over the imported GIR
      # into `Gwebgl-0.1.typelib` — recording whatever leaf name meson chose,
      # which is the point of `fs.name(libGwebgl.full_path())` in meson.build
      # (`gwebgl.dll` under MSVC, `libgwebgl.dll` under MinGW; no
      # `host_machine.system()` branch can be right for both).
      - name: Build @gjsify/webgl with MSVC from the imported C
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/framework/webgl
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          if not defined VSPATH ( echo ::error::vswhere found no Visual Studio installation & exit /b 1 )
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl 2>&1 | findstr /C:"Version"
          rem Supply the include ROOT of the gvsbuild prefix, which no .pc file
          rem names. MEASURED on the first dispatch (run 30808356641): MSVC
          rem compiled 2 of the 4 generated .c files and failed the other two
          rem with C1083 on `epoxy/gl.h` — a header that WAS present at
          rem %GTK_PREFIX%\include\epoxy\gl.h while `pkg-config epoxy` resolved
          rem 1.5.10 and contributed no -I whatsoever. `epoxy.pc` installs its
          rem headers straight into <prefix>/include, which on a POSIX prefix is
          rem already a default compiler search path, so the .pc has nothing to
          rem add; MSVC has no equivalent default. (glib is the contrast: it
          rem names include/glib-2.0, so its -I is explicit and it compiled.)
          rem
          rem This is SUPPLYING A PLATFORM DEFAULT, not hiding an
          rem incompatibility — the same class as this job's vcpkg ffi.h step
          rem and node-gi.yml's, which exists because gvsbuild omits ffi.h
          rem outright. It is deliberately NOT a `-Dc_args=` in meson.build:
          rem meson.build must stay free of Windows specifics, and `INCLUDE` is
          rem the variable MSVC itself defines for exactly this, set right next
          rem to the vcvars call that establishes the rest of the toolchain env.
          rem What it is NOT: /w, /std:cNN, or any diagnostic suppression.
          set INCLUDE=%GTK_PREFIX%\include;%INCLUDE%
          rem --buildtype=release is LOAD-BEARING ON WINDOWS, and on no other
          rem platform. meson's default buildtype is `debug`, whose MSVC meaning
          rem is not "keep the symbols" but `b_vscrt=mdd` — link the DEBUG CRT.
          rem MEASURED on the win11-gjsify VM against the artifact of the green
          rem dispatch (run 30808747504): that gwebgl.dll imports
          rem VCRUNTIME140D.dll and ucrtbased.dll, which ship ONLY with Visual
          rem Studio and which Microsoft's redistribution terms forbid shipping.
          rem Every other import (epoxy-0, gdk_pixbuf-2.0-0, glib-2.0-0,
          rem gobject-2.0-0) resolved from the batteries-included GTK bundle, so
          rem the DLL was two files away from working and failed with a bare
          rem "Das angegebene Modul wurde nicht gefunden" naming gwebgl.dll —
          rem the DEPENDENT, never the missing dependency, which is why the
          rem message sends you looking at the one file you know is present.
          rem
          rem WHY THE LOAD TEST BELOW CANNOT CATCH IT: windows-latest HAS Visual
          rem Studio, so the debug CRT resolves there and the probe goes green on
          rem the one artifact no user can load. That is not a gap in the probe —
          rem it is the runner being unrepresentative in exactly the dimension the
          rem probe cannot see, which is why the assertion after it reads the
          rem import table instead of loading anything.
          meson setup build . -Dprebuilt_vala_c=vala-c-export --buildtype=release || exit /b 1
          meson compile -C build || exit /b 1

      - name: Collect @gjsify/webgl prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The GIR comes from the ARTIFACT, not from build/: on the prebuilt-C branch
          # meson never re-emits it (valac did, one job ago), so `build/` legitimately
          # has none. Put valac's copy INTO build/ rather than staging it separately —
          # then the one shared stager sees the whole set in the one directory it reads,
          # and this leg stages by the same rule as every other (by EXTENSION, with
          # `checkPrebuildDir()` at the end) instead of by a second hand-written list.
          Copy-Item packages/framework/webgl/vala-c-export/Gwebgl-0.1.gir `
            -Destination packages/framework/webgl/build/
          # `--scratch`, and no `--allow-undeclared` any more: this leg commits
          # nothing (`commit-prebuilds` downloads the artifact into
          # `@gjsify/webgl-win32-x64`), and `win32-x64` IS declared now, so the
          # stager holds the target to the declaration like every other leg.
          node scripts/stage-prebuild.mjs packages/framework/webgl --scratch
          Get-ChildItem "packages/framework/webgl/prebuilds/$env:PREBUILD" | Select-Object Name, Length

      # A typelib whose recorded leaf is wrong is FOUND via GI_TYPELIB_PATH and
      # then never loads — the silent failure `fs.name()` replaced an OS-branch
      # chain to prevent. Assert it before the load test so a mismatch is named
      # here rather than diagnosed from a GI error.
      - name: Verify the typelib records a .dll leaf
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        shell: pwsh
        run: |
          $gir = "packages/framework/webgl/prebuilds/$env:PREBUILD/Gwebgl-0.1.gir"
          $leaf = (Select-String -Path $gir -Pattern 'shared-library="([^"]*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "$gir -> shared-library=$leaf"
          # The GIR is the LINUX-generated one, so its recorded leaf is still
          # `libgwebgl.so`; what matters is the TYPELIB, which meson rebuilt here
          # with `--shared-library` set from the target meson actually produced.
          # Read the string out of the compiled typelib rather than trusting the
          # command line that made it.
          $bytes = [System.IO.File]::ReadAllBytes("packages/framework/webgl/prebuilds/$env:PREBUILD/Gwebgl-0.1.typelib")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch 'gwebgl\.dll') {
            Write-Host "::error::the compiled typelib does not record a .dll leaf. Strings found: $(($text -split "`0" | Where-Object { $_ -match 'gwebgl' }) -join ', ')"
            exit 1
          }
          Write-Host "typelib records a .dll leaf"

      # The CRT a Windows prebuild links is a REDISTRIBUTION question, and it is
      # the one property this runner cannot answer by loading the artifact:
      # windows-latest ships Visual Studio, so a debug-CRT DLL loads here and
      # fails on every machine that does not. Read the import table instead —
      # a static property of the file, identical on every host.
      #
      # THE INCIDENT. `meson setup` was called without `--buildtype`, meson
      # defaults to `debug`, and MSVC's reading of `debug` is `b_vscrt=mdd`. The
      # green dispatch (run 30808747504) therefore published a gwebgl.dll
      # importing VCRUNTIME140D.dll + ucrtbased.dll, and it took a real Windows
      # desktop to notice, because the load test above passed on it.
      #
      # The `D`/`d` suffix is the whole signal: VCRUNTIME140D / ucrtbased /
      # MSVCP140D are the debug images, and Microsoft's terms forbid shipping
      # them at all — so this is a licence gate as much as a portability one.
      - name: Assert the prebuild links the REDISTRIBUTABLE CRT
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = "packages/framework/webgl/prebuilds/$env:PREBUILD/gwebgl.dll"
          # vswhere locates dumpbin the way node-gi.yml's windowing bundle does,
          # rather than hard-coding an edition or assuming a vcvars-primed shell.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\' } | Select-Object -First 1
          if (-not $dumpbin) { Write-Host "::error::dumpbin.exe not found under $vs"; exit 1 }
          $imports = & $dumpbin.FullName /dependents $dll |
            Select-String -Pattern '^\s{4}(\S+\.dll)$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          Write-Host "imports: $($imports -join ', ')"
          # A parse that matched NOTHING must not read as "clean" — that is the
          # same vacuous-pass shape as the bundle builder's ANGLE seed, which
          # silently matched no file and let a GL-less bundle call itself
          # windowing. gwebgl.dll links glib and the CRT at minimum, so an empty
          # list means dumpbin's format moved, not that the DLL is dependency-free.
          if ($imports.Count -lt 2) {
            Write-Host "::error::parsed $($imports.Count) imports from dumpbin — expected several. The output format changed and this check is no longer reading anything; fix the parse rather than trusting the pass."
            exit 1
          }
          # Match the debug CRT by NAME, not by a blanket `*d.dll` — `epoxy-0.dll`
          # and `libpng16d.dll`-shaped leaves would both trip a loose pattern.
          $debugCrt = $imports | Where-Object { $_ -match '^(vcruntime\d+d|ucrtbased|msvcp\d+d|concrt\d+d)\.dll$' }
          if ($debugCrt) {
            Write-Host "::error::gwebgl.dll links the DEBUG CRT ($($debugCrt -join ', ')). Those ship only with Visual Studio and may not be redistributed, so this artifact cannot load on an end-user machine. Build with --buildtype=release (MSVC: b_vscrt=md)."
            exit 1
          }
          Write-Host "CRT is redistributable"

      # ── THE LOAD TEST ────────────────────────────────────────────────────
      #
      # "A prebuild never LOADED in CI is a prebuild nobody tested", and this one
      # cannot use gjs: there is no libgjs for Windows (napi.yml's `windows` job
      # documents that open wall in detail). On Windows this project's runtime IS
      # Node, and GObject comes from `@gjsify/node-gi` — so going through node-gi
      # is not a workaround, it is the platform's actual GObject path, which is
      # what makes a pass here mean something to a real user.
      #
      # node-gi is built FROM SOURCE against the same gvsbuild bundle rather than
      # installed from npm, so the test cannot silently pass against a published
      # binary that has nothing to do with this run.
      - name: Supply libffi headers (gvsbuild omits ffi.h)
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        # Verbatim from node-gi.yml's `windows` job, which explains why: gvsbuild
        # installs ffi.lib but not ffi.h/ffitarget.h, while GLib's girffi.h
        # (which it DOES install) includes ffi.h — so the addon will not compile
        # (C1083) without them. libffi's public ABI is frozen across 3.x.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libffi:x64-windows
          $inc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          Copy-Item "$inc\ffi.h","$inc\ffitarget.h" -Destination "$env:GTK_PREFIX\include" -Force

      - name: Build @gjsify/node-gi (node-gyp / MSVC)
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        working-directory: packages/node-gi/node-gi
        run: npm install --no-audit --no-fund --foreground-scripts

      # Resolving a CLASS is the trigger, not a formality: `getGType` is what
      # forces GI to call the type's `…_get_type`, and THAT is what LoadLibrary's
      # the leaf the typelib records. A typelib merely FOUND resolves the
      # namespace and then returns null here — which is why the check below is on
      # the GType and not on `requireNamespace` succeeding.
      #
      # `node --input-type=module -e` from inside the node-gi package rather than
      # a written probe file: `-e`'s module base is the cwd, so `./index.js`
      # resolves with nothing to clean up afterwards. The array-join is not style
      # — a PowerShell here-string has to start at column 0, which terminates the
      # YAML block scalar the step is written in.
      - name: Load-test the win32-x64 prebuild through node-gi
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $abs = (Resolve-Path "packages/framework/webgl/prebuilds/$env:PREBUILD").Path
          # PATH is the DLL search path on Windows — the analogue of
          # LD_LIBRARY_PATH/DYLD_LIBRARY_PATH in the Linux/darwin load tests, and
          # what `buildNativeEnv()` exports for win32.
          $env:PATH = "$abs;$env:PATH"
          $env:GI_TYPELIB_PATH = "$abs;$env:GI_TYPELIB_PATH"
          $env:NODE_GI_NATIVE = 'build'
          $probe = @(
            "import { requireNamespace, getGType } from './index.js';",
            "requireNamespace('Gwebgl', '0.1');",
            "const g = getGType('Gwebgl', 'WebGLRenderingContext');",
            "if (g == null) throw new Error('getGType returned null - the typelib was found but gwebgl.dll never loaded');",
            "console.log('Gwebgl.WebGLRenderingContext resolved via node-gi - gwebgl.dll loaded, GType', g);"
          ) -join "`n"
          Push-Location packages/node-gi/node-gi
          try { node --input-type=module -e $probe } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload @gjsify/webgl win32-x64 prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/upload-artifact@v7
        with:
          name: webgl-prebuilds-win32-x64
          path: packages/framework/webgl/prebuilds/win32-x64/
          # `error`, not `warn`: `commit-prebuilds` downloads this by name and
          # `actions/download-artifact` FAILS on a name that does not exist, so
          # an empty upload turns into a red job two jobs later, naming the
          # download instead of the build that produced nothing.
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------
  # Alpine / musl — prebuilds/linux-{x64,arm64}-musl
  #
  # RUNS ON EVERY PR AND PUSH the workflow's paths reach, like the glibc build
  # legs, and it can go RED. It spent its whole life `workflow_dispatch`-only and
  # `continue-on-error: true`, and in that shape it was never dispatched once —
  # so the one leg that executes anything on musl gated nothing for its entire
  # existence, while the status surface described it as "unproven" rather than
  # "unrun". Measured: the GitHub API lists no `workflow_dispatch` run of this
  # workflow after 2026-08-10, and this job was added on 2026-08-16.
  #
  # WHY IT CAN BE A GATE NOW, given that the declared-vs-built invariant is
  # SYMMETRIC (`audit-runtimes --check` fails a declared target no CI job
  # produces AND a CI-produced target no package declares): because `-musl` is
  # not a `gjsify.platforms` token AT ALL, by an existing decision this leg does
  # not get to revisit. The target vocabulary is `<os>-<arch>` and the libc
  # distinction rides the npm `libc` field, which
  # `generate-platform-packages.mjs` MEASURES from the ELF — see
  # `musl-build.sh`'s header. So this job makes no platform PROMISE, and
  # `parseCiPlatforms()` must not credit it with one: each matrix entry carries
  # `libc: musl`, the parser composes `linux-<arch>-musl` from it and drops
  # libc-carrying tokens from the promise map, with an unknown libc value a hard
  # parse error rather than a silent fold. Without that key the parser would
  # credit these packages with `linux-x64`/`linux-arm64` — targets the glibc legs
  # build and this one does not — which is a green audit measuring the wrong job,
  # and would let the real leg be deleted unnoticed. Deleting the key is
  # therefore a defect the `ci-runner-arch` e2e fixtures fail on.
  #
  # WHAT WOULD STILL HAVE TO LAND FOR A COMMITTED `-musl` ARTIFACT: this leg
  # uploads and commits nothing, so nothing here promises a musl binary to a
  # consumer. That promotion is a separate change with its own prerequisites —
  # `status/open-todos.md` carries them.
  #
  # WHY MUSL. postmarketOS v26.06 ("Alpen Avocado", 2026-06-21) is based on
  # Alpine 3.24, which is the target that makes a GJS/GNOME phone able to use
  # these bridges at all. (That mapping is the one claim here taken from the
  # web rather than from a container.)
  #
  # EVIDENCE. Everything below was measured, and the two lines that used to say
  # "inferred" no longer do — the first real run of this job settled both. On
  # `ubuntu-24.04-arm` the aarch64 leg builds BOTH bridges in `alpine:3.24`,
  # resolves the host as `linux-arm64-musl`, loads `GjsifySabNative.SharedBuffer`
  # and `GjsifyLightningcss.Engine` under Alpine's gjs, `dlopen(RTLD_NOW)`s both
  # with no library-path variable and uploads both artifacts, in ~5 minutes; the
  # x64 leg does the same. The earlier `alpine:3.24.1` container probe (x86_64
  # natively, aarch64 under qemu-user) is what the per-package reasoning below
  # rests on, and it compiled only ONE Vala bridge on aarch64 — that gap is the
  # one this run closed.
  #
  # ── WHICH PACKAGES, AND THE MEASURED REASON FOR EACH ──────────────────────
  #
  # The scope rule is NOT "everything that compiles". A committed glibc artifact
  # that already loads on musl needs no musl sibling, and building one would
  # spend CI minutes producing a second copy of something that works. What the
  # probe measured — `dlopen(RTLD_NOW)` of every committed `linux-x64` and
  # `linux-arm64` library inside Alpine, with all their system dependencies
  # installed, so a failure means "incompatible with musl" and not "I forgot
  # gst-plugins-bad":
  #
  #   IN — the committed glibc build genuinely does not load:
  #     • @gjsify/sab-native — FAILS on BOTH arches, and by SYMBOL:
  #       `fcntl64` (x64), `__cmsg_nxthdr` (arm64). It is the one bridge that
  #       calls libc directly (memfd_create, SCM_RIGHTS, futex), so this is
  #       expected rather than surprising. Built against musl it is fine —
  #       verified building, dlopening and importing under gjs on Alpine x86_64
  #       with no change to its meson.build; `linux-headers` is what its C shim
  #       needs and is in the apk list below for exactly that.
  #     • @gjsify/lightningcss-native — FAILS on both, for two different
  #       reasons: on x64 its cargo cdylib records the glibc LOADER
  #       (`ld-linux-x86-64.so.2`) in DT_NEEDED, which musl cannot supply under
  #       any name; on arm64 it is the `gnu_get_libc_version` symbol. It also
  #       carries the highest glibc floor in the tree (GLIBC_2.39), i.e. it is
  #       the single artifact that decides which distros this toolchain runs on.
  #       The whole pipeline — cargo cdylib → Vala library → GIR → typelib — was
  #       verified end to end on Alpine x86_64 through its own unmodified
  #       meson.build in ~3 min, with `CI=true` set so the `${CI:+--locked}`
  #       enforcement was live: the committed `src/rust/Cargo.lock` resolved
  #       UNCHANGED on musl, so no per-libc lockfile is needed.
  #
  #   OUT — the committed glibc build already loads on musl (six for six, x64
  #   and aarch64): @gjsify/webgl, @gjsify/http-soup-bridge,
  #   @gjsify/http2-native, @gjsify/terminal-native, @gjsify/tls-native,
  #   @gjsify/webrtc-native. This is not a guess about `libc.so.6`: musl's
  #   loader treats a DT_NEEDED of `libc.so.6` as a request for ITSELF (a
  #   reserved name it refuses to reload), so glibc PROVENANCE is not
  #   unloadability — the correction `packages/infra/manifest-conformance/lib/
  #   rules/prebuild-libc.mjs` now encodes in `muslVerdictOfNeeded()`.
  #     THE CAVEAT, stated because it is the reason this list could grow: musl
  #     ignores ELF symbol versioning entirely, so a reference to a
  #     `GLIBC_2.x`-versioned symbol binds to musl's unversioned one with no
  #     compatibility check. "Loads" is therefore weaker than "behaves". Only
  #     tls-native was function-verified on musl (a real `parse_ocsp_response`
  #     call returning the right answer). If a musl user ever reports a WRONG
  #     ANSWER rather than a load failure from one of the other five, that is
  #     the reason, and the fix is to move it into this leg.
  #
  #   OUT — unproven, not known-good: @gjsify/oxfmt-native and
  #   @gjsify/rolldown-native. Their committed x64 artifacts DO fail on musl
  #   (glibc loader again) while their arm64 ones load, so a musl build is
  #   wanted — but neither was ever COMPILED on musl. Both path-dep into a
  #   `refs/` submodule whose `[patch.crates-io]` crate-identity graph is the
  #   part most likely to break, and the emulated legs exclude them for cost
  #   reasons already. Prove one locally first (see the reproduce line below),
  #   then add it here with its measured build time.
  #
  #   OUT — not this workflow's package: @gjsify/napi (built by napi.yml). Its
  #   Alpine blocker is not libc at all but a SONAME: Fedora links
  #   `libmozjs-140.so.0`, Alpine ships `libmozjs-140.so`. `mozjs-dev` provides
  #   `mozjs-140.pc`, so a from-source build there is plausible; untested.
  #
  # ── THE TOOLCHAIN, AND THE APK TRAPS A COPY OF THE FEDORA LIST FALLS INTO ─
  #
  # `alpine:3.24` is pinned like every other image here (it resolves to 3.24.1
  # today). Every package the Fedora legs use has an Alpine equivalent and all
  # of them resolved; the traps a copy of the Fedora list walks into:
  #   • `ninja` is NOT a package name on Alpine — it is `ninja-build`.
  #   • the Vala compiler is `vala`, not `valac`/`vala-dev`.
  #   • `g-ir-compiler` DOES exist (`/usr/bin/g-ir-compiler`, from
  #     `gobject-introspection-dev`, alongside GLib's newer
  #     `gi-compile-repository`), so `find_program('g-ir-compiler')` in every
  #     meson.build resolves unchanged. This was the single likeliest blocker
  #     for the whole idea and it is not one.
  #   • `gjs` and `nodejs` live in the **community** repository, which is
  #     enabled in the official image — gjs 1.88.1 exactly matches this repo's
  #     GJS 1.86+/SpiderMonkey 140 target, which is what lets this leg GATE
  #     itself rather than merely compile.
  # Alpine has no weak/recommended dependencies at all, so the
  # `--setopt=install_weak_deps=False` reasoning `emulated-build.sh` documents
  # (574 packages, a build dying inside wireplumber's `%posttrans`) cannot arise
  # here. The list below is the probe's list minus the entries that belong to
  # bridges this leg does not build (gnutls-dev → tls, gtk4.0-dev/gdk-pixbuf-dev/
  # libepoxy-dev → webgl, gstreamer* → webrtc, libsoup3-dev → http-soup-bridge,
  # nghttp2-dev → http2, json-glib-dev → rolldown); re-add the matching line
  # when a bridge moves into this leg. `git` is the one addition (for
  # actions/checkout).
  #
  # ── RUST: USE APK'S, AND DO NOT PASS `--target` ───────────────────────────
  #
  # The Fedora legs install rustup because Fedora's rustc is too old for the
  # `edition2024` crates in the graph. Alpine's apk rustc is 1.96.1, so that
  # step is not merely unnecessary here, it is HARMFUL: rustup's musl target is
  # `*-unknown-linux-musl`, which defaults to `crt-static` ON and therefore
  # **cannot produce a cdylib at all** ("error: cannot produce cdylib for `p` as
  # the target `x86_64-unknown-linux-musl` does not support these crate types").
  # Alpine's own host triple is `x86_64-alpine-linux-musl` /
  # `aarch64-alpine-linux-musl`, both with `crt-static` OFF, so a plain
  # `cargo build --release` — which is what meson runs — produces exactly the
  # cdylib the Vala half links. `musl-dev` supplies the link-time libc; the
  # runtime `libgcc_s.so.1` arrives as a dependency.
  #
  # ── STAGING: `stage-prebuild.mjs`, AND WHY THAT IS THE SAFETY GUARD ───────
  #
  # A hand-written `mkdir -p prebuilds/linux-$ARCH && cp` in an Alpine container
  # OVERWRITES THE COMMITTED GLIBC ARTIFACT with a musl one, and every
  # downstream declaration check stays green — the same shape as the
  # `run-on-arch-action` incident (right directory, wrong machine), except this
  # one destroys a committed binary. `scripts/stage-prebuild.mjs` cannot do that:
  # it derives the directory from the HOST (`hostPrebuildTarget()` plus a
  # musl-loader probe) and refuses to fall back from `<os>-<arch>-musl` to
  # `<os>-<arch>`. The "Confirm this container resolves as a musl target" step
  # below asserts that resolution BEFORE anything is built, using the very
  # function the stager calls, so a node that mis-detected the host fails loudly
  # instead of clobbering.
  #
  # EACH BRIDGE STAGES INTO ITS OWN DIRECTORY, and that is not tidiness — it is
  # the defect that kept this leg from ever being green. Both packages used to
  # pass one `--dest` directory, and the stager REPLACES its destination
  # (`rmSync`, so a renamed library cannot ship a stale set), so whichever
  # package staged second deleted the first one's typelib and the leg died on
  # `Typelib file for namespace 'GjsifySabNative' (any version) not found` —
  # a message naming musl and GI for a file its own run had removed. The fix is
  # `--scratch`, which DERIVES the destination from the package, so two bridges
  # cannot name one directory; `--allow-undeclared` stays, because
  # `linux-<arch>-musl` is in no `gjsify.platforms` (see the header above) and
  # the stager then prints its own "do NOT commit this" warning. Exactly the pair
  # `build-prebuilds-macos-experimental` uses, for the same two reasons.
  #   It is also what makes the uploads possible at all: `--scratch` writes into
  #   the BIND-MOUNTED workspace, and `/tmp/musl-prebuilds` did not — it lived in
  #   a `--rm` container, so both upload steps (`if-no-files-found: error`) could
  #   never have found a file, whatever the build did.
  #
  # NOTHING IS WIRED INTO `commit-prebuilds`, and no `gjsify.platforms` /
  # `libc` / `optionalDependencies` entry is added. The artifacts are uploaded so
  # a run can be inspected and diffed; committing them is a separate promotion
  # whose prerequisites (a published musl-carrying platform package, and
  # `PLATFORM_RE`/`canonicalPlatform` learning the optional suffix — they are
  # libc-blind today, which `prebuild-libc.mjs` records as its own follow-up) are
  # in `status/open-todos.md`. What this leg buys without any of that is the thing
  # it was always for: the npm `libc` policy — `@gjsify/<x>-linux-<arch>` is
  # installed on musl hosts BY DESIGN — rests on the claim that these sources
  # work when built against musl, and nothing else in CI compiles or runs
  # anything on musl.
  #
  # ── REPRODUCE BY HAND ─────────────────────────────────────────────────────
  #
  # `musl-build.sh`'s header carries the one-liner, and running THAT is the
  # reproduction — the script is the whole job. Read the SELinux and `--platform`
  # notes there before improvising the flags: both were paid for once.
  #
  # ── THE JOB'S SHAPE IS NOT A GUESS ────────────────────────────────────────
  #
  # There is no job-level `container:` and no JavaScript action runs inside
  # Alpine: `actions/checkout` and `actions/upload-artifact` run on the glibc
  # host, and everything that must observe musl runs inside `alpine:3.24` through
  # one script. That inversion is what the arm64 leg needs — GitHub's action
  # runtime ships for musl only as an x64 binary, so a job-level Alpine container
  # dies at `Checkout repository` there with "JavaScript Actions in Alpine
  # containers are only supported on x64 Linux runners" — and it is also what
  # makes the leg reproducible by hand, since the script takes the whole job.
  # ----------------------------------------------------------------
  build-prebuilds-musl:
    name: Build prebuilds (linux-${{ matrix.arch }}-musl) [Alpine/musl]
    needs: [changes]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    # NO job-level `container:`, and that is the fix rather than a preference.
    #
    # This leg used `container: image: alpine:3.24`, which puts GitHub's own
    # action runtime inside the container. On the arm64 runner that fails before
    # anything is built:
    #
    #     JavaScript Actions in Alpine containers are only supported on x64
    #     Linux runners. Detected Linux Arm64
    #
    # `actions/checkout` is a JavaScript action and its runtime ships for musl
    # only as an x64 binary, so the arm64 leg could never go green as written —
    # it died at `Checkout repository` on every run. Nothing about gjs or Alpine
    # on arm64 is at fault: the container runs natively there, and the
    # limitation is entirely in the action runtime.
    #
    # Inverting the containment costs nothing and buys a property this leg
    # lacked: the JS actions run on the glibc host, everything that must see
    # musl runs inside `alpine:3.24` via one script, and that script is
    # reproducible by hand (see its header). Both arches stay NATIVE — no
    # emulation, no binfmt pin — and the script asserts that rather than
    # assuming it, by requiring `stage-prebuild.mjs` to resolve the host as the
    # matrix entry's own token before it builds anything.
    #
    # NO `continue-on-error`, and that removal is the point of this shape. It was
    # justified as "a canary's failure has to be visible and harmless, in that
    # order" — the incident being 2026-08-01..03, when two permanently-red musl
    # legs made the workflow look broken while `commit-prebuilds` failed at its
    # gate for 41 hours with every build leg green. That reasoning holds for a leg
    # EXPECTED to be red; both of its premises are now gone. The legs were red
    # because of a job shape (a musl `container:` on arm64) and a staging defect
    # (two packages, one `--dest`), and both are fixed and reproduced locally, so
    # a red run here means a real regression on the one libc axis nothing else in
    # CI touches. `continue-on-error` on a leg that can be green is the exact
    # shape of a gate that cannot fail, which is this repository's most expensive
    # defect class.
    #   The 41-hour incident's real lesson is kept elsewhere and is not undone
    #   here: `commit-prebuilds` still owns its own gate and is not gated on this
    #   job, so a musl failure cannot hide or block the commit path.

    strategy:
      fail-fast: false
      matrix:
        include:
          # Both arches have a NATIVE runner, so nothing here is emulated. The
          # probe measured an emulated Alpine aarch64 leg at ~3.5 min wall
          # (Alpine's package set is tiny), so emulation stays a viable
          # fallback if `ubuntu-24.04-arm` is ever unavailable — but a native
          # runner is cheaper and needs no binfmt pinning.
          #
          # `arch` carries the bare CPU token, exactly as in `build-prebuilds`;
          # the `-musl` suffix is composed into `PREBUILD` below rather than
          # smuggled into this key, so the value stays the one
          # `${process.arch}` computes.
          #
          # `libc` is what keeps this job out of the platform-PROMISE audit now
          # that it is no longer dispatch-only. `parseCiPlatforms()` reads it,
          # composes `linux-<arch>-musl`, and drops libc-carrying tokens from the
          # map that declared-vs-built is computed from — because `-musl` is not a
          # `gjsify.platforms` token at all (the libc distinction rides the npm
          # `libc` field; see `musl-build.sh`'s header). DELETING THIS KEY IS A
          # DEFECT, not a simplification: without it the parser credits these two
          # packages with `linux-x64`/`linux-arm64`, which the glibc legs build and
          # this one does not, so the audit would go green having measured the
          # wrong job — and the real leg could then be deleted unnoticed. The
          # `ci-runner-arch` e2e fixtures fail on both halves of that.
          #
          # `machine` is `file(1)`'s spelling of the ELF e_machine this leg must
          # produce. The committed tree's machine-vs-directory invariant is held
          # by `readLibrary()` in manifest-conformance's `lib/binary.mjs` via
          # `audit-runtimes --check`; these artifacts are never committed, so
          # they never reach that audit and this leg has to assert it itself —
          # the same way `emulated-build.sh` reports `file` on what it just
          # produced, and for the same incident.
          - arch: x64
            libc: musl
            runner: ubuntu-latest
            machine: x86-64
          - arch: arm64
            libc: musl
            runner: ubuntu-24.04-arm
            machine: aarch64

    env:
      # `${process.platform}-${process.arch}` + the libc suffix — the token
      # `stage-prebuild.mjs` will independently derive from the host. The two
      # agreeing is asserted, not assumed (see the confirm step).
      PREBUILD: linux-${{ matrix.arch }}-musl
      # Matrix values reach the scripts through `env:`, the way the Fedora leg
      # passes `ARCH` — a value interpolated into a shell body is a value the
      # shell never gets to quote.
      MACHINE: ${{ matrix.machine }}
      # The `changes` job's decision, for the steps that walk a LIST of package
      # directories and therefore cannot carry a step-level `if:`. Same helper,
      # same quoting rule as the macOS legs above.
      PREBUILD_SKIP: ${{ needs.changes.outputs.skip }}

    steps:
      # Checkout runs on the GLIBC HOST — that is the entire point of dropping
      # `container:` (see the job comment). It also means it can come first:
      # under the old shape `apk add … git` had to run before it, because the
      # Alpine base image has no git.
      - name: Checkout repository
        uses: actions/checkout@v6

      # One step, one container, one script — and the script is the same one a
      # human runs by hand (its header carries the command). Everything that
      # must observe musl lives in there; nothing that needs GitHub's action
      # runtime does.
      #
      # No `--platform`: the runner's own architecture IS the target, so pulling
      # `alpine:3.24` natively is both correct and fastest. Getting that wrong
      # would silently emulate, which is why the script REFUSES unless
      # `stage-prebuild.mjs` resolves the host as this entry's own token — and
      # why the per-artifact `file(1)` machine check is inside it too. (Measured
      # locally: without a forced platform, a cached foreign-arch image runs
      # emulated and podman warns rather than fails — an assertion is the only
      # thing that catches that in CI.)
      #
      # `-e CI=true` is what makes the committed `src/rust/Cargo.lock` ENFORCED in
      # here, exactly as the emulated Fedora leg above documents: a `docker run`
      # inherits NOTHING, so without it `${CI:+--locked}` in
      # `lightningcss-native/meson.build` expands to nothing, the build still USES
      # the lock and silently stops FAILING on a stale one. This leg is the only
      # place a musl `cargo build` happens, and the musl notes claim the committed
      # lock resolves UNCHANGED there — a claim that is only tested with the flag.
      # Passed as the literal rather than `"$CI"` so `set -u` cannot trip when the
      # command is reproduced by hand.
      - name: Build and verify every musl prebuild inside alpine:3.24
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e PREBUILD -e MACHINE -e PREBUILD_SKIP \
            -e CI=true \
            alpine:3.24 sh .github/prebuild-toolchain/musl-build.sh

      # The build ran as root inside the container, so the staged files are
      # root-owned on the runner. Hand them back before the uploads read them —
      # the same step, for the same reason, as the emulated Fedora leg.
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" packages || true

      # The uploads stay on the host: their paths are in the bind-mounted
      # workspace, and `upload-artifact` is a JS action that must not be asked to
      # run inside Alpine.
      - name: Upload @gjsify/sab-native musl prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"sab-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: sab-native-prebuilds-linux-${{ matrix.arch }}-musl
          path: packages/node/sab-native/prebuilds/linux-${{ matrix.arch }}-musl/
          if-no-files-found: error
          retention-days: 30

      - name: Upload @gjsify/lightningcss-native musl prebuilds artifact
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        uses: actions/upload-artifact@v7
        with:
          name: lightningcss-native-prebuilds-linux-${{ matrix.arch }}-musl
          path: packages/infra/lightningcss-native/prebuilds/linux-${{ matrix.arch }}-musl/
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------
  # Do the COMMITTED prebuilds resolve on musl? — the only leg that asks
  #
  # The libc axis is the one no other CI branch covers, and until this job it was
  # asserted nowhere that a PR or a merge could see. `build-prebuilds-musl` owns
  # the same question for the artifacts it BUILDS, and it is a gate too now — but
  # a different one, and both are wanted: that leg answers "do these SOURCES work
  # when compiled against musl", this job answers "do the binaries users actually
  # get resolve there". Only the second needs no build, which is what lets it run
  # unconditionally and cost nothing.
  #
  # This job needs no build at all: it reads binaries already in the tree, which
  # is also what makes it cheap enough to run unconditionally. No `needs:` —
  # its subject is the committed tree, not this run's package set, so a `changes`
  # decision has nothing to say about it.
  #
  # NATIVE runners for both arches, no QEMU: `musl-committed-check.sh` refuses a
  # target that is not the container's own machine, because musl's `ldd` answers
  # for a foreign object instead of refusing it and the whole check then passes
  # having judged nothing (measured; the script's guard carries the numbers).
  # ----------------------------------------------------------------
  check-committed-musl:
    name: Committed prebuilds on musl (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      # Checkout runs on the GLIBC HOST, like the musl build leg and for the same
      # reason: `actions/checkout` is a JavaScript action and its runtime ships
      # for musl only as an x64 binary, so an Alpine job-level `container:` dies
      # at checkout on the arm64 runner.
      - name: Checkout repository
        uses: actions/checkout@v6

      # No `--platform`: the runner's own architecture IS the target. The script
      # asserts that rather than trusting it.
      - name: Check the committed linux-${{ matrix.arch }} prebuilds under musl
        env:
          TARGET: linux-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e TARGET \
            alpine:3.24 sh .github/prebuild-toolchain/musl-committed-check.sh



  # ----------------------------------------------------------------
  # Commit all prebuilds back to the repo — main only, and never from a PR
  #
  # This job pushes binaries into the repository, so "a PR cannot reach it" must
  # not depend on any single line:
  #
  #   1. `github.event_name != 'pull_request'` — the direct gate.
  #   2. `github.ref == 'refs/heads/main'` — on a `pull_request` event the ref is
  #      `refs/pull/<n>/merge`, never `refs/heads/main`, so this fails
  #      independently. It also covers a push trigger on some other branch.
  #   3. On an UNLABELLED PR there is a third, structural gate: `needs` includes
  #      `build-prebuilds-macos`, which is skipped there, and a skipped `needs`
  #      skips the dependent job (this `if:` has no `always()`/`!cancelled()`,
  #      so the default all-needs-succeeded rule applies) — the same mechanism
  #      the comment below relies on for the experimental macOS job. This one
  #      does NOT hold on a `ci:macos`-labelled PR, where every needed job runs;
  #      1 and 2 are what make that case safe, which is why they are two
  #      independent conditions rather than one.
  #
  # And it is the only job that widens the token past the workflow-level
  # `contents: read`, so even a mistake in all of the above would not hand write
  # access to a job that builds PR head code.
  #
  # A SKIPPED PACKAGE HAS NO ARTIFACT, and this job is the place that fact can
  # do damage, so it is handled explicitly rather than hoped about.
  #
  #   What `actions/download-artifact` does with a name that does not exist:
  #   it FAILS. `src/download-artifact.ts` throws `Artifact '<name>' not found`,
  #   which reaches the top-level catch and `core.setFailed`s the step. There is
  #   no `if-no-artifact-found` input — the download action has no counterpart
  #   to upload's `if-no-files-found`. So an ungated download of a skipped
  #   package would red this job on every run that built less than everything.
  #   That failure is at least SAFE (a failed job commits nothing), but it would
  #   also block every package that DID rebuild, so each download carries the
  #   same `if:` its build did.
  #
  #   What that leaves on disk: nothing was downloaded for the skipped package,
  #   so its `prebuilds/` directory is exactly what `actions/checkout` wrote —
  #   the committed bytes. `git add` on an unchanged tree stages nothing, the
  #   existing `git diff --cached --quiet` short-circuit sees no change, and the
  #   committed prebuild is left untouched. Not deleted, not emptied.
  #
  #   Why there is a guard anyway: `git add <dir>` has staged DELETIONS since
  #   git 2.0, so anything that removed a file under `prebuilds/` — a download
  #   action that starts clearing its destination, a `path:` typo landing an
  #   artifact somewhere else, a future clean step — would be committed as a
  #   deletion and silently unship a binary. The staging script
  #   (`.github/prebuild-toolchain/sync-and-stage.sh`) asserts that no staged
  #   change under a `prebuilds/` directory is a deletion, and fails the job if
  #   one is — inside the script rather than in a step of its own so that it
  #   holds on every re-stage the push retry performs. (An empty directory
  #   cannot be committed at all: git does not track directories, so "never
  #   commit an empty directory" is free — the reachable failure is the
  #   deletion, and that is what is checked.)
  # ----------------------------------------------------------------
  commit-prebuilds:
    name: Commit prebuilds to repo
    # build-prebuilds-macos-experimental is deliberately absent: it is
    # workflow_dispatch-only, and a skipped job in `needs` would skip this one
    # too.
    #
    # build-prebuilds-musl is absent for a DIFFERENT reason now that it is no
    # longer dispatch-only, and the difference matters in both directions. It
    # produces `-musl` artifacts no package declares, and committing an undeclared
    # target is exactly what the `prebuild-artifacts` rule fails on — so there is
    # nothing here to download and it gets wired in only with the declaration.
    # Keeping it out of `needs` is also what preserves the 41-hour incident's
    # lesson: a musl regression colours the run red on its own without taking the
    # commit path down with it, which is what `continue-on-error` used to buy at
    # the price of a leg that could not fail at all.
    #
    # `build-prebuilds-win32` IS here, and it is what that sentence looks like
    # once it has been paid: the leg lost its dispatch gate, `@gjsify/webgl`
    # gained the `win32-x64` token and `@gjsify/webgl-win32-x64` exists to hold
    # the directory — one change, in the order the musl note prescribes.
    #
    # `changes` is here because every download step below is gated on ITS
    # decision — the same decision the build legs used. Deciding once and
    # reading it in both places is what makes "a package was not built" and "no
    # artifact is downloaded for it" the same fact rather than two guesses.
    #
    # NOTE the corollary for the gates above: no build leg may be skipped as a
    # WHOLE job, only step by step. A skipped job in `needs` skips this one
    # (there is no `always()` here — deliberately; see gate 3 in the comment
    # above), so a leg that skipped itself because it had nothing to build
    # would silently suppress committing everything the OTHER legs produced.
    needs: [changes, build-prebuilds, build-prebuilds-qemu, build-prebuilds-macos, build-prebuilds-win32]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      # SSH, not the workflow token, and that is forced rather than preferred.
      #
      # `main` is protected by a ruleset requiring three status checks, and a
      # direct push carries none — the commit is new, nothing has run against it
      # yet — so the push is rejected with `GH006: 3 of 3 required status checks
      # are expected` and the binaries this job just downloaded are discarded.
      # That is what took main red on 2026-08-02 with every build leg green.
      #
      # The obvious repair, exempting the Actions bot, IS NOT AVAILABLE: adding
      # the GitHub Actions integration to the ruleset's bypass list is refused by
      # the API — "Actor GitHub Actions integration must be part of the ruleset
      # source or owner organization". Of the actors it does accept, a repository
      # ROLE (`Write`) would hand the bypass to every human with push access and
      # make the gate decorative; a DEPLOY KEY is scoped to this repository
      # alone, cannot open pull requests, cannot reach anything else in the org,
      # and is listed by name in the ruleset. So the bypass list holds
      # `DeployKey`, and this job is the only thing that owns one.
      #
      # A pull-request flow would need no bypass at all, and was preferred until
      # it was checked: a PR opened with `GITHUB_TOKEN` does not trigger
      # workflows, so its required checks would never run and auto-merge would
      # never fire. That route needs a non-workflow identity too, and a broader
      # one than a single-repository key.
      #
      # SETUP (one-time, maintainer): generate a keypair, add the PUBLIC half
      # under Settings -> Deploy keys WITH write access, and the PRIVATE half as
      # the `PREBUILDS_DEPLOY_KEY` secret.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Handing the key to checkout is what makes the later `git push` use
          # it: checkout writes the remote's auth config, so the push needs no
          # separate remote or credential juggling.
          ssh-key: ${{ secrets.PREBUILDS_DEPLOY_KEY }}

      # -------- @gjsify/webgl --------
      - name: Download webgl x64 prebuilds
