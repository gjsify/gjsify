          path: packages/node/terminal-native-darwin-arm64/prebuilds/darwin-arm64/

      - name: Download tls-native darwin-arm64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: tls-native-prebuilds-darwin-arm64
          path: packages/node/tls-native-darwin-arm64/prebuilds/darwin-arm64/

      - name: Download http-soup-bridge darwin-arm64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        uses: actions/download-artifact@v8
        with:
          name: http-soup-bridge-prebuilds-darwin-arm64
          path: packages/node/http-soup-bridge-darwin-arm64/prebuilds/darwin-arm64/

      - name: Download http2-native darwin-arm64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: http2-native-prebuilds-darwin-arm64
          path: packages/node/http2-native-darwin-arm64/prebuilds/darwin-arm64/

      - name: Download webgl darwin-arm64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/download-artifact@v8
        with:
          name: webgl-prebuilds-darwin-arm64
          path: packages/framework/webgl-darwin-arm64/prebuilds/darwin-arm64/

      # THE ONLY WAY darwin-arm64 EVER GETS A WEBKIT BINARY. ADR 0022 added the
      # build and the upload but not these two downloads, so the artifact was
      # produced on every `ci:macos` run and thrown away — which is why
      # `@gjsify/webkit-native-darwin-arm64` carried a `platformsUncommitted`
      # entry blaming the authoring host's architecture. The host was never the
      # blocker; the missing download was.
      - name: Download webkit-native darwin-arm64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webkit-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: webkit-native-prebuilds-darwin-arm64
          path: packages/framework/webkit-native-darwin-arm64/prebuilds/darwin-arm64/

      # -------- darwin-x64 (macOS, Intel) --------
      # The SAME eight packages as the arm64 block above, because both come from
      # the one matrixed `build-prebuilds-macos` job — the sets cannot drift.
      - name: Download lightningcss-native darwin-x64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"lightningcss-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: lightningcss-native-prebuilds-darwin-x64
          path: packages/infra/lightningcss-native-darwin-x64/prebuilds/darwin-x64/

      - name: Download oxfmt-native darwin-x64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"oxfmt-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: oxfmt-native-prebuilds-darwin-x64
          path: packages/infra/oxfmt-native-darwin-x64/prebuilds/darwin-x64/

      - name: Download rolldown-native darwin-x64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"rolldown-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: rolldown-native-prebuilds-darwin-x64
          path: packages/infra/rolldown-native-darwin-x64/prebuilds/darwin-x64/

      - name: Download terminal-native darwin-x64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"terminal-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: terminal-native-prebuilds-darwin-x64
          path: packages/node/terminal-native-darwin-x64/prebuilds/darwin-x64/

      - name: Download tls-native darwin-x64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"tls-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: tls-native-prebuilds-darwin-x64
          path: packages/node/tls-native-darwin-x64/prebuilds/darwin-x64/

      - name: Download http-soup-bridge darwin-x64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http-soup-bridge"') }}
        uses: actions/download-artifact@v8
        with:
          name: http-soup-bridge-prebuilds-darwin-x64
          path: packages/node/http-soup-bridge-darwin-x64/prebuilds/darwin-x64/

      - name: Download http2-native darwin-x64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"http2-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: http2-native-prebuilds-darwin-x64
          path: packages/node/http2-native-darwin-x64/prebuilds/darwin-x64/

      - name: Download webgl darwin-x64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webgl"') }}
        uses: actions/download-artifact@v8
        with:
          name: webgl-prebuilds-darwin-x64
          path: packages/framework/webgl-darwin-x64/prebuilds/darwin-x64/

      - name: Download webkit-native darwin-x64 prebuilds
        if: ${{ !contains(needs.changes.outputs.skip, '"webkit-native"') }}
        uses: actions/download-artifact@v8
        with:
          name: webkit-native-prebuilds-darwin-x64
          path: packages/framework/webkit-native-darwin-x64/prebuilds/darwin-x64/

      # Two scratch paths, named ONCE, both OUTSIDE the repository so nothing
      # parked in them can be staged by accident. Four steps and two scripts have
      # to agree about them, and six literals would not.
      #
      # Published from `$RUNNER_TEMP` in a step rather than declared in a job-level
      # `env:` block, and that is not a style choice: the `runner` context does not
      # EXIST outside steps, so `${{ runner.temp }}` in `jobs.<id>.env` makes GitHub
      # refuse to load the whole file. Measured here — run 30890615702, "This run
      # likely failed because of a workflow file issue", raised as a `push`-event
      # run on a branch this workflow's `push` trigger does not even cover, because
      # a file GitHub cannot parse never gets its triggers evaluated. That is the
      # failure mode `status/open-todos.md` records as "a workflow GitHub refuses to
      # load reports the PR as GREEN": it is not a PR check, so `gh pr checks` does
      # not show it. `tests/e2e/prebuild-change-gate` now fails a `runner`/`steps`
      # reference in any job-level `env:` block, since the file cannot self-check.
      - name: Name this run's scratch paths
        run: |
          set -euo pipefail
          {
            echo "PREBUILD_SNAPSHOT=$RUNNER_TEMP/prebuild-downloads.tar"
            echo "PREBUILD_GATED_TREE=$RUNNER_TEMP/gated-tree.sha"
          } >> "$GITHUB_ENV"

      # ── Everything from here is about getting the downloaded binaries onto the
      # CURRENT `main` without ever asking git to MERGE one. The old shape did the
      # opposite — commit first, `git pull --rebase origin main` second — and that
      # ordering is fatal on darwin, deterministically rather than as a race. The
      # measurement is in `.github/prebuild-toolchain/sync-and-stage.sh`.
      - name: Snapshot the downloaded artifacts
        run: |
          set -euo pipefail
          # The next step syncs the worktree to `origin/main` with `git reset
          # --hard`, which restores every tracked file — including the prebuild
          # binaries this job just downloaded. So they have to be parked somewhere
          # git will not touch and re-applied over the synced tree. `$RUNNER_TEMP`
          # is outside the repository, so nothing parked there can be staged by
          # accident.
          #
          # A positive fact about the downloads FIRST, and it is not the same
          # question as the one below: did files land at all. `download-artifact`
          # fails hard on a missing artifact, so this can only be zero if the
          # `path:` inputs stopped pointing into the tree — in which case every
          # later step would operate on main's own bytes while reporting success,
          # which is the failure class this job keeps being bitten by.
          landed="$(find packages/*/*/prebuilds -type f | wc -l)"
          echo "prebuild directories hold ${landed} file(s) after the downloads."
          if [ "$landed" -eq 0 ]; then
            echo "::error::no files under packages/*/*/prebuilds — the download steps put nothing into the tree"
            exit 1
          fi

          # The snapshot is scoped to WHAT THIS RUN CHANGED, not to all sixty
          # directories, and that scoping is a correctness property rather than an
          # optimisation (though it also takes the archive from ~132 MB to a few).
          # Re-applying every directory over a freshly-synced tree would resurrect
          # a prebuild file that `main` legitimately DELETED while this run was in
          # flight — a target retired, a library renamed — and `git add` stages a
          # resurrection as an ADDITION, so the deletion guard would not see it.
          # Silently reverting someone else's commit is not a trade this job may
          # make; it exists to stop binaries going missing, not to start.
          #
          # Deletions are filtered out by the `-f` test: a download only ever
          # writes, so a ` D ` entry cannot come from this run, and `tar` would
          # fail on a path that is not there.
          #
          # `:(glob)` is load-bearing and was MEASURED. A bare
          # `packages/*/*/prebuilds/` pathspec matches NOTHING — git's default
          # wildmatch runs without WM_PATHNAME, so `*` crosses `/` and the pattern
          # has to match the whole path, which a file three levels deeper does not.
          # It reports a clean tree on a dirty one: the snapshot comes out empty,
          # `Commit prebuilds` says "No prebuild changes to commit", and the run is
          # green with every binary discarded. Caught by rehearsing the step against
          # a scratch repository rather than by reading it. `:(glob)` switches on
          # pathname-aware matching, so `*` stops at `/` and `**` spans the rest.
          changed="$RUNNER_TEMP/changed-prebuilds.txt"
          : > "$changed"
          while IFS= read -r line; do
            f="${line:3}"
            if [ -f "$f" ]; then printf '%s\n' "$f" >> "$changed"; fi
          done < <(git status --porcelain -uall -- ':(glob)packages/*/*/prebuilds/**')
          count="$(wc -l < "$changed")"
          echo "the downloads changed ${count} prebuild path(s) relative to this checkout:"
          cat "$changed"

          # TWO oracles for the one question, because the failure above is silent
          # by nature: a pathspec that matches nothing is indistinguishable from a
          # tree with nothing to commit, and this job reports the second as success.
          # So the scoped count is checked against an unscoped status filtered by
          # plain text. Every tracked `/prebuilds/` path in this repository is under
          # `packages/<pillar>/<pkg>/`, so the two sets are identical (187 = 187 on
          # main) and any disagreement means the pathspec stopped meaning what it
          # says. `-prebuilds/` directory names (the `dlx-native-prebuilds` fixture)
          # do not match `/prebuilds/` and cannot inflate the second count.
          textual="$(git status --porcelain -uall | grep -c '/prebuilds/' || true)"
          if [ "$count" -ne "$textual" ]; then
            echo "::error::the prebuild pathspec matched ${count} path(s) while an unscoped status shows ${textual} — the pathspec no longer selects what it names, and an empty selection here reads as 'nothing to commit'"
            git status --porcelain -uall | grep '/prebuilds/' || true
            exit 1
          fi

          # `tar`, not `cp -r`: it takes the path set from a file, restores it with
          # no directory logic of its own, and can be COUNTED — which is what the
          # restore assertion in the sync script is built on. An EMPTY set is
          # legitimate and deliberately not an error: the ELF legs reproduce
          # exactly, so a linux-only run can rebuild every artifact byte for byte.
          # (The 16 darwin dylibs never do — see the sync script.) `Commit
          # prebuilds` reports that as "nothing to commit", which is the truth.
          if [ "$count" -eq 0 ]; then
            tar -cf "$PREBUILD_SNAPSHOT" --files-from /dev/null
          else
            tar -cf "$PREBUILD_SNAPSHOT" --files-from "$changed"
          fi
          echo "snapshot: ${count} file(s) -> $PREBUILD_SNAPSHOT"

      # SYNC FIRST, THEN STAGE — the ordering that is the whole fix. The script
      # fetches `origin/main`, resets the worktree onto it, re-applies the snapshot
      # over that tree, clears the platform exemptions the downloads satisfied,
      # stages, and refuses both a staged prebuild DELETION and any write it left
      # unstaged.
      #
      # In a script rather than inline because the push step calls it AGAIN per
      # attempt: `main` can still move between this sync and the push, and retrying
      # the push alone would push a tree built on a stale base. A second inline
      # copy is how the two would drift. `tests/e2e/prebuild-change-gate` scans it
      # for hand-written prebuild staging alongside this workflow, so moving shell
      # out of the YAML does not move it out from under that ban.
      - name: Sync to origin/main and stage the artifacts
        run: bash .github/prebuild-toolchain/sync-and-stage.sh 1

      # THE SECOND guard, and the one that closes a hole the first cannot see: a
      # rebuilt binary that is perfectly well-formed but needs a NEWER glibc than
      # the package promises.
      #
      # `gjsify.glibcRequires` is a per-target floor measured out of
      # `SHT_GNU_verneed`, and `audit-runtimes --check`'s `prebuild-libc` rule
      # fails when a rebuild has outgrown it. That rule already runs — in
      # `audit-runtimes.yml`, on push and pull_request. It just never ran on the
      # commit that can CHANGE the floor: this job commits with `[skip ci]`, so
      # the audit workflow is not triggered by it, and the drift surfaces on the
      # next unrelated push instead — attributed to whatever that push touched.
      #
      # Raising the floor is not cosmetic. `lightningcss-native` at GLIBC_2.39
      # alone decides whether this toolchain runs on Ubuntu 24.04 / Debian 13 or
      # only on something newer, and a base-image bump (fedora:43 → 44 → …) is
      # exactly the change that moves that number without touching one line of
      # source. Gating HERE makes the job that produced the binary fail, naming
      # both numbers, rather than committing it and reporting it elsewhere later.
      #
      # Cheap by construction: `audit-runtimes.mjs` is pure Node with zero deps
      # beyond builtins (see audit-runtimes.yml, which relies on the same fact),
      # so this needs no install and no build. It runs on the STAGED tree — after
      # every download, before the commit — which is the only moment the new
      # binaries and the old declarations exist side by side.
      #
      # This step is the FAST FAIL. It is deliberately kept even though the gate
      # below subsumes it: failing before a commit exists is a clearer log than
      # failing after one.
      - name: Gate on the measured glibc floor + libc flavour
        run: |
          set -euo pipefail
          node scripts/audit-runtimes.mjs --check

      # THE THIRD guard, and the only moment its question can be asked at all.
      #
      # `check-committed-musl` reads the tree, so on a PR it judges binaries that
      # are ALREADY committed. The ones this job is about to commit reach it only
      # on some later run — and NOT on the next push, because this job commits
      # with `[skip ci]`, so the binaries it pushes trigger no workflow at all.
      # Between here and the next PR that happens to touch a native path, a musl
      # regression is shipped and unmeasured. Asking on the staged tree costs one
      # container per arch and closes exactly that window.
      #
      # QEMU for the arm64 half: this runner is x64, and the script REFUSES a
      # target that is not the container's own machine rather than answering for
      # it — musl's `ldd` resolves a foreign object against the HOST's libraries
      # and reports success, so without the refusal this step would be green
      # about nothing (the guard's own comment carries the measurement).
      # `check-committed-musl` gets a native runner per arch; here one runner
      # serves both, so the emulator is registered and pinned exactly the way
      # `build-prebuilds-qemu` pins it — the emulator version is part of the
      # answer, so it is not left to the runner image.
      - name: Register QEMU for the arm64 musl check
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3
          platforms: linux/arm64

      # Both targets are judged even when the first fails: a single red arch must
      # not hide the state of the other, or the fix lands blind.
      - name: Check the staged prebuilds under musl, both arches
        run: |
          set -euo pipefail
          rc=0
          while IFS='|' read -r target platform; do
            [ -n "$target" ] || continue
            echo "::group::committed-musl check — ${target}"
            if docker run --rm --platform "$platform" \
              -v "$PWD:/workspace" -w /workspace \
              -e TARGET="$target" \
              alpine:3.24 sh .github/prebuild-toolchain/musl-committed-check.sh
            then :; else rc=1; fi
            echo "::endgroup::"
          done <<'EOF'
          linux-x64|linux/amd64
          linux-arm64|linux/arm64
          EOF
          exit $rc

      # NO REBASE HERE, and its absence is the fix. This step used to end in
      # `git pull --rebase origin main` — commit the binaries, then ask git to
      # replay that commit onto a moved `main`. git has no merge driver for a
      # binary file, and Mach-O output is not byte-reproducible, so the replay
      # conflicted on the first dylib on every run that had a darwin artifact
      # (run 30864276535: `Cannot merge binary files: …libgjsifytls.dylib`,
      # exit 1, 26848 insertions discarded, nothing pushed).
      #
      # The sync moved to BEFORE the staging, where it is a `reset --hard` onto
      # `origin/main` with the artifacts re-applied on top — an operation with no
      # merge in it at all. This step therefore only commits.
      - name: Commit prebuilds
        id: commit
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No prebuild changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update native prebuilds [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # THE THIRD guard, and the one that closes the hole the first two share:
      # they check a tree nobody pushes.
      #
      # Two separate defects, both measured, both fixed by putting one step here:
      #
      # 1. ORDERING. The gate above ran before `git pull --rebase origin main`,
      #    so the audited tree was provably not the pushed tree. A PR that edits a
      #    bridge's `gjsify.platforms`, drops a per-target package or bumps a
      #    version can merge while this job sits between the two steps; the rebase
      #    replays the prebuild commit onto it cleanly, because the hunks do not
      #    overlap, and the combination nobody audited is what lands.
      #
      #    That rebase is gone now — the sync happens BEFORE the staging — but the
      #    ordering requirement did not go away with it, it just changed shape: the
      #    PUSH step re-syncs and re-stages whenever `main` moved under it, so
      #    there is still a way for the tree to change after this step ran. Which
      #    is why the certification below is a STAMP the push checks rather than a
      #    position in this file: the gate script writes the tree hash it read, the
      #    push refuses any tree that does not match it and re-runs the gate after
      #    every re-stage. Step order is now the readable form of the invariant;
      #    the stamp is the enforced one.
      #
      # 2. SCOPE. The push carries `[skip ci]`, which suppresses BOTH required
      #    checks on the resulting commit — `CI gate (GJS)` and `Detect runtime-
      #    triplet drift` — and the step above substitutes exactly one of
      #    audit-runtimes.yml's steps. Everything else that reads what this job
      #    writes ran nowhere. That is not hypothetical: on 2026-08-03 f5d250b32
      #    cleared `gjsify.platformsUncommitted` from the darwin manifests (now the
      #    sync script's job) and broke `tests/e2e/platform-exemption-clearing`,
      #    whose fixture had seeded itself from one of them. `main` was red for
      #    every open PR for hours, each one blaming its own diff, and the commit
      #    that caused it had no CI to blame. The fixture is hermetic now — but
      #    hermetic fixtures are not the general answer, because several of these
      #    suites measure the REAL committed artifact on purpose:
      #    `prebuild-loader-path` asserts exact glibc floors, exact DT_NEEDED sets
      #    and a `=== null`; `prebuild-declaration-invariant` hard-codes measured
      #    floors. Those are properties of bytes THIS JOB REWRITES.
      #
      # So: the checks that read this job's output run on the exact tree this job
      # pushes, and a bot that would break `main` fails instead — `main` stays
      # green and the next PR author is never handed someone else's failure.
      #
      # The command list, why `--strict`, and what a green verdict does NOT cover
      # all live in the script, next to the commands themselves.
      - name: Gate the tree being pushed
        if: steps.commit.outputs.changed == 'true'
        run: bash .github/prebuild-toolchain/gate-pushed-tree.sh

      # `main` can move between the gate and this push, and that is the remaining
      # race — handled honestly rather than hoped away.
      #
      # Before this, a rejected push was the END of the run: the step failed and
      # every binary the run had downloaded was discarded with no retry (recorded
      # in `status/open-todos.md` as "Two `commit-prebuilds` jobs can race" — the
      # non-PR concurrency group is keyed by `run_id` with `cancel-in-progress:
      # false`, deliberately, so a `workflow_dispatch` run overlapping a `push` run
      # produces exactly that).
      #
      # The retry RE-STAGES rather than re-pushing. Retrying the push alone would
      # push a tree built on a stale base — the same defect as the old rebase, one
      # layer out — so each attempt re-runs the whole sequence: sync onto the new
      # `origin/main`, re-apply the snapshot, re-stage, re-commit, RE-GATE. Nothing
      # reaches `main` that the gate did not read, which the stamp check enforces
      # at the top of every attempt.
      #
      # A successful push whose ref is no longer ours is NOT an error: a second run
      # can land after us. It falls into the same re-stage, which answers the only
      # question that matters — are our bytes in `origin/main`? If the re-stage has
      # nothing to stage, they are, and the run is done.
      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # No stamp means the gate did not run. Fail rather than push: this is the
          # assertion that makes the gate unskippable, not its `if:`.
          if [ ! -f "$PREBUILD_GATED_TREE" ]; then
            echo "::error::no gated-tree stamp at $PREBUILD_GATED_TREE — the gate did not certify a tree, so nothing may be pushed"
            exit 1
          fi
          attempts=5
          attempt=1
          while [ "$attempt" -le "$attempts" ]; do
            gated="$(cat "$PREBUILD_GATED_TREE")"
            tree="$(git rev-parse 'HEAD^{tree}')"
            if [ "$tree" != "$gated" ]; then
              echo "::error::HEAD's tree ($tree) is not the tree the gate certified ($gated) — something changed the tree after the gate ran; refusing to push"
              exit 1
            fi
            echo "::group::push attempt ${attempt}/${attempts} (tree ${tree})"
            if git push origin "HEAD:refs/heads/main"; then
              remote="$(git ls-remote origin refs/heads/main | cut -f1)"
              head="$(git rev-parse HEAD)"
              echo "::endgroup::"
              if [ "$remote" = "$head" ]; then
                echo "pushed ${head} — origin/main is now this commit."
                exit 0
              fi
              echo "push succeeded but origin/main is ${remote}, not ${head} — another run landed after us; re-syncing to verify our artifacts survived."
            else
              echo "::endgroup::"
              echo "push rejected — origin/main moved. Re-syncing and RE-STAGING onto the new tip."
            fi
            attempt=$((attempt + 1))
            bash .github/prebuild-toolchain/sync-and-stage.sh "$attempt"
            if git diff --cached --quiet; then
              echo "origin/main already carries these artifacts — nothing left to push."
              exit 0
            fi
            git commit -m "chore: update native prebuilds [skip ci]"
            bash .github/prebuild-toolchain/gate-pushed-tree.sh
          done
          echo "::error::could not land the prebuild commit in ${attempts} attempts — origin/main is moving faster than this job can re-stage. The artifacts are still in the run's uploads; re-run this job."
          exit 1

  # ----------------------------------------------------------------
  # Coverage summary — what this run actually built, and what it did not
  #
  # A run that skips a leg must not read like a run that did not, so every run
  # states its own coverage. Everything here is DERIVED and nothing is restated:
  # the per-job rows are `needs.<job>.result` — GitHub's own evaluation of each
  # `if:` — so adding a job to `needs` is all it takes for that job to appear,
  # and there is deliberately no hand-maintained "what we skip" list, which is
  # the artefact that drifts and then lies (main.yml's `ci-summary` rule).
  #
  # Since the legs became per-package, "which legs ran" is no longer the whole
  # answer: a run can have every leg green and still have compiled two of ten
  # packages. So the PACKAGE table is printed too, straight from the `changes`
  # job's own `report` output — same source the gates read, so the summary
  # cannot describe a decision other than the one that was acted on.
  #
  # Never gates: `if: always()` and its output is the summary, not its exit code.
  # ----------------------------------------------------------------
  prebuilds-summary:
    name: Coverage summary
    needs:
      - changes
      - build-prebuilds
      - build-prebuilds-qemu
      - build-prebuilds-macos
      - build-prebuilds-macos-experimental
      - webgl-vala-c-win32
      - build-prebuilds-win32
      - build-prebuilds-musl
      - check-committed-musl
      - commit-prebuilds
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write what this run covered
        env:
          # `needs` carries a `result` for every job above, whatever its `if:`
          # decided. This is the whole data source.
          NEEDS: ${{ toJSON(needs) }}
          REPORT: ${{ needs.changes.outputs.report }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          set -euo pipefail
          skipped="$(jq -r '[to_entries[] | select(.value.result == "skipped") | "`" + .key + "`"] | join(", ")' <<< "$NEEDS")"
          {
            echo '## Native prebuilds — coverage for this run'
            echo
            echo "- event: \`${GITHUB_EVENT_NAME}\` · ref: \`${GITHUB_REF}\`"
            echo
            echo '| job | result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| `\(.key)` | \(.value.result) |"' <<< "$NEEDS"
            echo
            echo '### Packages'
            echo
            # An empty/absent report means the `changes` job never produced one
            # (it failed, or was cancelled). Say that rather than print an empty
            # table that reads like "nothing needed building".
            if [ -z "${REPORT:-}" ] || [ "$REPORT" = '[]' ]; then
              echo 'The `changes` job produced no package report, so this run built **every**'
              echo 'package (that is the fail-open path — an undecidable classification never'
              echo 'skips). Nothing below is a claim about individual packages.'
            else
              echo "Decision: \`${REASON}\`. A package is built when something it depends on"
              echo 'changed — its own sources per this workflow'"'"'s `on: paths:` filter, its'
              echo '`refs/` submodule pin, or a shared input (this file, the emulated build'
              echo 'script, the staging/verification scripts) which rebuilds all of them.'
              echo
              echo '| package | built | why |'
              echo '| --- | --- | --- |'
              jq -r '.[] | "| `\(.key)` | \(if .build then "yes" else "**NO**" end) | \(.why) |"' <<< "$REPORT"
              echo
              nb="$(jq -r '[.[] | select(.build | not) | "`" + .key + "`"] | join(", ")' <<< "$REPORT")"
              if [ -n "$nb" ]; then
                echo "**NOT built by this run: ${nb}.**"
                echo
                echo 'Green legs above therefore say nothing about those packages: they were not'
                echo 'compiled, not staged and not uploaded on ANY leg, and on main their'
                echo 'committed prebuilds were left exactly as they were. Force a full rebuild'
                echo 'with a `workflow_dispatch` run of this workflow.'
              else
                echo '**Every package this workflow owns was built.**'
              fi
            fi
            echo
            if [ -n "$skipped" ]; then
              echo "**Legs NOT covered by this run: ${skipped}.**"
              echo
              echo 'A green result above therefore does not extend to those. On a pull request the'
              echo 'skipped leg that matters is `build-prebuilds-macos` — every Linux target in'
              echo '`package.json#gjsify.platforms` is built, neither `darwin-arm64` nor'
              echo '`darwin-x64` is (both are legs of that one matrixed job). Label the PR'
              echo '`ci:macos` to add them. (`build-prebuilds-macos-experimental` is dispatch-only'
              echo 'by design — it builds targets no package declares yet, so it proves itself'
              echo 'before the declaration exists — and `commit-prebuilds` is main-only by'
              echo 'design. `build-prebuilds-musl` is neither: it runs here like the glibc legs'
              echo 'and a skip means the `changes` job found neither of its two packages'
              echo 'affected.)'
            else
              echo '**Every prebuild leg in this workflow ran.**'
            fi
          # `tee`, not `>>`: the coverage note belongs in the JOB LOG as well as
          # the run summary. The summary is the readable artefact; the log is
          # what a `gh run view --log` (or a bug report pasting one) carries.
          } | tee -a "$GITHUB_STEP_SUMMARY"
