name: Audit runtimes

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Detect runtime-triplet drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      # `scripts/audit-runtimes.mjs` is pure Node (zero deps beyond builtins),
      # so no `yarn install` / `npm install` is needed. The script walks
      # `packages/**/package.json`, classifies each one against the five-axis
      # cross-runtime model (see AGENTS.md `## Strategic direction`), and
      # exits 1 if any package's declared `gjsify.runtimes` triplet diverges
      # from what its source-code signals (`@girs/*` value-imports, `gi://`
      # URL imports, dynamic `import('gi://...')`, legacy `imports.X`, etc.)
      # would suggest. Catches the case where a package's impl changes shape
      # but its triplet declaration is left stale.
      # `--strict` additionally runs the functional probes: every declared
      # `native` slot's `globals.mjs` re-exports must resolve on-target, and
      # every `browser:"polyfill"` package that ships a standard `src/test.{mts,ts}`
      # must also ship a `src/test.browser.{mts,ts}` entry for the `tests/browser/`
      # Playwright suite. Meta/asset packages with no standard test are exempt.
      # Every `--check` run ALSO holds the tier (ADR 0003/0005), platform
      # (OS axis), prebuild-artifact, reachability (ADR 0014) and headless
      # (ADR 0015) contracts.
      # The prebuild-artifact half is why this workflow deliberately carries NO
      # `paths` filter: the things that break it are a `gjsify.platforms` edit,
      # a `prebuilds/**` binary and `prebuilds.yml`'s own matrix, which no
      # per-package path list would cover together. It checks that every
      # declared target of a package naming a committed `gjsify.prebuilds`
      # directory HAS that directory with a structurally loadable library +
      # typelib in it — the machine matching the directory, every `libgjsify*`
      # sibling staged and reachable via `$ORIGIN`/`@loader_path`, and every
      # leaf the typelib names present. On this runner's own target it goes
      # further and really `dlopen`s them with the library-path variables
      # stripped; a cross-arch prebuild cannot be loaded here and the audit
      # reports that boundary rather than papering over it.
      # The last one is the only check on intra-GJS LAYERING: a package that
      # declares `gjsify.headless` must not reach the typelibs it promised not
      # to from its ROOT entry — the axis every runtime-slot check is blind to,
      # and how the "headless, NO GTK dependency" `@gjsify/canvas2d-core` came
      # to import `gi://Gdk` (= libgtk-4.so) for its entire life.
      # Since the manifest-conformance consolidation this step runs a RULE
      # REGISTRY (`@gjsify/manifest-conformance` + `scripts/manifest-conformance/`),
      # not a hand-wired list of audits. Its last rule, `field-coverage`, derives
      # the set of `gjsify.*` declaration kinds the tree actually uses and FAILS
      # on any key no rule claims — so a new declaration cannot be added without
      # a check, which is the failure mode every other rule here exists because
      # of. A key that genuinely cannot be checked yet is declared, with a
      # written reason, in `scripts/manifest-conformance/unchecked-fields.mjs`;
      # every such deferral is printed on every run.
      #
      # This stays `node scripts/…` and must NOT become `gjsify <command>`. The
      # job deliberately does no install and no build (see the note above), so a
      # CLI route would have to boot the COMMITTED `dist/cli.gjs.mjs` — which
      # reintroduces exactly the staleness circularity
      # `scripts/verify-committed-bundles.mjs` exists to break: a rule added in
      # source but not rebuilt into the bundle would silently not run, and #821
      # proved bundles do merge stale.
      #
      # `node scripts/audit-runtimes.mjs --rules` prints the registry: every
      # rule, its scope (portable / repo) and the manifest fields it governs.
      - name: Check declared vs detected runtime triplets (strict)
        run: node scripts/audit-runtimes.mjs --check --strict

      # Every package that ships a `test:gjs` / `test:node` leg must RUN it from
      # its `test` script — else `gjsify foreach test` silently skips that
      # runtime (the fetch/formdata/webcrypto GJS + abort-controller/adwaita-app/
      # storybook-core node incidents).
      - name: Check test scripts run their declared runtime legs
        run: node scripts/audit-test-scripts.mjs

      # Containerised jobs vs the image they run on. Two derived questions: a
      # job ON the baked image must not `dnf install` something the Dockerfile
      # lacks (the "MUST stay in lockstep" comment, made real), and a job still
      # on a bare `fedora:<major>` must say WHY in the script's ledger. This
      # belongs here rather than in `main.yml` for the same reason as the rest
      # of this workflow: it is pure Node over the repo's own files, needs no
      # install and no build, and it must run on every PR — a workflow edit is
      # exactly what silently reintroduces a per-run `dnf install`.
      - name: Check CI container images cover their jobs
        run: node scripts/check-ci-image-packages.mjs

      # `build:infra` must be bundler-free up to the clause that BUILDS the
      # bundler — every clause before `bootstrap-native-facades.mjs` has to get
      # by on tsc, because under GJS `gjsify build` cannot run before the engine
      # facade exists. #1031 lost that invariant while fixing something else, and
      # it stayed green for a day: Node loads the npm rolldown engine instead, and
      # a warm cache skips `build:infra` entirely, so only a COLD GJS tree can see
      # it. v0.31.0's `publish-napi` is such a tree — it failed there, and
      # `@gjsify/napi` did not publish. Incident + rule in the script header.
      - name: Check build:infra is bundler-free before the bundler
        run: node scripts/check-build-infra-order.mjs

      # A spec that writes `const O_CREAT = 64` or `expect(err.errno).toBe(-17)`
      # asks a different question on darwin and win32, and CANNOT fail on Linux —
      # so this pipeline is structurally blind to it and the OS legs pay for it on
      # `main`. #1039 merged three of them and reddened macos-suites and
      # windows-suites for eight hours. This is the part of that class a
      # Linux-only run can see. Incident + rule in the script header.
      - name: Check no spec spells a POSIX constant as a Linux number
        run: node scripts/check-spec-posix-literals.mjs

      # The same class one level up from constants: a FILESYSTEM path split on `'/'` alone
      # separates on `'\\'` on win32, so `lastIndexOf('/')` returns -1 there — a value the
      # existing "no separator" branches already handle, which is why four copies shipped in
      # silence and `fetch('/res/…')` died as `Invalid URL` on Windows (#1143). Also Linux-blind
      # by construction, hence its place in this job. A `/`-separated IDENTIFIER (D-Bus object
      # path, URL pathname, npm specifier, git path) is legitimate and common here, so the check
      # demands a stated reason per file rather than banning the shape.
      - name: Check no filesystem path is split on '/' alone
        run: node scripts/check-posix-path-slice.mjs

      # `actionlint` parses workflow syntax and runs with `-shellcheck=` empty, so nothing
      # read the SHELL inside a `run:` block. `release-cut.yml` passed its publish dispatch
      # as `node -e '…'` with an apostrophe in a comment; the string closed early, node got
      # a truncated program, and v0.38.0 was cut, tagged and released without ever being
      # dispatched to npm. The release dry run cannot cover it either — that step is the
      # one thing a dry run skips. `bash -n` on every extracted block does, in milliseconds.
      - name: Check every workflow `run:` block is valid shell
        run: node scripts/check-workflow-run-syntax.mjs

      # The PR-title linter inherits its type list from the action default
      # instead of carrying a second copy of `type-enum`. That is only sound
      # while the two agree — this is what says so out loud.
      - name: Check the PR-title type list still matches commitlint
        run: node scripts/check-pr-title-types.mjs

      # Same shape as the two above: a rule that only prose enforced, broken by a
      # copy that grew next to the resolver whose comment forbids it. `@gjsify/cli`
      # is dual-entry, so a fixed-depth read of its own manifest is right from
      # `lib/` and wrong from `dist/cli.gjs.mjs` — the entry a globally installed
      # `gjsify` runs. It fails silently (the read is inside a `try`), and the
      # version it fails to produce is what `showcase` pins its dlx spec to, so
      # 0.38.0 served a cached 0.37.0 showcase that crashed on a bug 0.38.0 had
      # fixed. Invisible to every CI leg, all of which use the `lib/` entry.
      - name: Check the CLI reads its own version through one resolver
        run: node scripts/check-cli-own-version-read.mjs

      # Comment volume has no natural limit, so nothing failed while `cli-fail.ts` grew
      # a 47-line yargs research diary above a 3-line function (ratio 9.3), while
      # `rolldown-plugin-gjsify` reached one comment line per code line, or while
      # `scripts/` reached 0.77 — 105k comment lines repo-wide, paid by every reader and
      # every agent context afterwards. The ceilings are MEASURED, not chosen: each is
      # what the tree had when it was last cleaned, so a cleanup cannot grow back
      # without a reviewed commit that raises one.
      # REPORTED, NOT GATED — and that is a deliberate exception to this repo's own
      # rule that a check which only warns gets ignored. The difference is what it
      # measures. The gates around it assert a FACT about the code; this one scores a
      # PROXY (comment lines over code lines) that is satisfiable without removing a
      # word: a full-line comment moved to the end of a code line leaves the comment
      # count lower and the code count unchanged, and ~1670 such lines are already
      # invisible to it. Blocking power over unrelated PRs is more than that
      # measurement earns — as a whole-tree aggregate it is a shared counter every
      # branch contends for (#1157), and `--update` re-baselines to exactly the
      # measured value, so trees sit at zero headroom and a pure code deletion can turn
      # a green branch red.
      #
      # The table still prints on every run and each over-ceiling tree still raises a
      # visible warning, so drift stays observable; `--check` remains for local use and
      # for a deliberate cleanup commit.
      - name: Report each tree's comment budget
        run: node scripts/check-comment-budget.mjs --warn

      # Same failure mode one level up: an AGENTS.md is loaded on EVERY agent turn, and
      # the root file reached 277 KB before it was split, one defensible paragraph at a
      # time. Past 32 KiB (`project_doc_max_bytes`) Codex truncates the tail with no
      # warning, so the end of an oversized file is not read at all. Per-file ceilings
      # are MEASURED for the same reason as above: two files are over the 20 KB target
      # AGENTS.md sets itself, and a flat gate would have been waived on arrival.
      - name: Check agent context file sizes
        run: node scripts/check-agent-context-size.mjs --check

      # The published API tables told readers to install `@gjsify/streams` and
      # `@gjsify/globals`, five rows between them, neither name ever a package
      # (`@gjsify/web-streams`, `@gjsify/node-globals`). A rename lands in `packages/`
      # and nothing walks the prose citing it. Website-scoped so the allowlist is
      # empty: repo-wide, fixtures like `@gjsify/e2e-pub-otp` would need ~76 entries.
      - name: Check website package names resolve
        run: node scripts/check-website-package-names.mjs

      # A multi-line inline `node -e '…'` whose body contains the quote that opened
      # it: the shell truncates the program and the step dies before asserting
      # anything, so the gate reports nothing about what it was gating. Belongs here
      # for the same reason as the rest of this job, plus one more — the workflows
      # most in need of it (`release.yml`, `cli-cross-platform.yml`) never run on a
      # pull request, so this is the only place their inline scripts get read before
      # a release. Incident + scope in the script header.
      - name: Check inline workflow scripts are not self-truncating
        run: node scripts/check-workflow-inline-scripts.mjs

      # An e2e suite on disk that no script names runs NOWHERE. 12 of 112 were in that
      # state, eleven of them by oversight — including the one written to cover the
      # release gate that let v0.28.0 publish half its packages, whose PR body claimed it
      # WAS the pre-release coverage. `e2e-shard.mjs` parses the script rather than
      # globbing, correctly; what was missing is a record of which omissions are meant.
      - name: Check every e2e suite runs or says why not
        run: node scripts/check-e2e-suite-coverage.mjs

      # Fifteen e2e suites carried a hand-written npm harness — ustar writer, SRI
      # integrity, CLI runner — drifted into nine variants of the writer alone, so a
      # correction reached one suite in fifteen. The lift is half a fix; this is the
      # half that stops the sixteenth copy.
      - name: Check no e2e suite re-implements the npm harness
        run: node scripts/check-e2e-harness-duplication.mjs

      # ADR 0017 sat on disk, load-bearing and ABSENT from the index table, because
      # nothing compared the directory to it. The mirror-image cost landed the same day:
      # an agent reading a pre-fix checkout filed an issue asserting 0018 did not exist,
      # hours after it had. The Status column is a second copy of each ADR's own line, so
      # this compares those too — promoting Proposed → Accepted touches two files.
      - name: Check the ADR index lists every ADR
        run: node scripts/check-adr-index.mjs

      # `$adw-components` in adwaita-web's `_reset.scss` is a hand-written copy of 58
      # `customElements.define('adw-…')` calls, and it is what applies the ADR 0010
      # style-isolation floor. A tag missing from it renders in the host page's font and
      # colour, silently. It had already drifted — `adw-source-view` was never listed —
      # and the spec ADR 0010 names as the guard instantiates exactly one element.
      - name: Check adwaita-web's style-isolation list covers every element
        run: node scripts/check-adwaita-reset-components.mjs

      # A conformance table with no RENDERER behind it asserts a derivation against
      # itself. A census (#1072) found 43 such tables, 16 of them silent gaps rather
      # than deliberate — and two headers in the same area were asserting coverage
      # that did not exist, which reads as a reason not to look.
      - name: Check every conformance table is driven or explains why not
        run: node scripts/check-adwaita-conformance-drivers.mjs

      # The style-class LEDGER against libadwaita's own style-classes.md. 21 documented
      # classes (`.card`, `.boxed-list`, `.toolbar`, `.linked`, `.osd`, …) had no rule in
      # adwaita-web at all (#1049) while the roadmap tracked "missing partials" by
      # filename — a diff that reports gaps that are not gaps and misses the ones that
      # are. SKIPs without `refs/libadwaita`; the rules themselves are asserted against
      # the COMPILED css by the browser suite's style-classes.spec.ts.
      - name: Check the style-class ledger covers libadwaita's documented surface
        run: node scripts/check-adwaita-style-classes.mjs

      # Three READMEs promised the three storybook targets "compare 1:1 by screenshot"
      # (#1052) and no such harness existed. It was not built — three rasterisers cannot
      # be compared pixel-for-pixel, and the NativeScript leg needs a device CI has not
      # got — so the claim went, and this holds the part that IS true and checkable:
      # the three targets render the same story SET. A story on one target and not the
      # others is the one state where no comparison is possible at all.
      - name: Check every storybook story exists on all three targets
        run: node scripts/check-storybook-story-parity.mjs

      # Story-set parity says the same stories EXIST; it cannot say the reader meets
      # them in the same order. That order was a by-product of enumeration — a path
      # glob on two targets, a hand-written list on the third — and a comment claiming
      # the two mirrored each other was the only thing holding it. They did not:
      # `Overview` led one sidebar and sat fifth, below the fold, on another, which
      # reads as the overview being missing rather than as an ordering difference.
      - name: Check every storybook category is placed by the declaration
        run: node scripts/check-storybook-category-order.mjs

      # A NativeScript widget's className and the theme's selector are two halves of
      # one decision that nothing compares. Renaming the shortcut-label keycap class
      # from `keycap` to `adw-keycap` was measured: 3221 tests stayed GREEN while
      # every keycap lost its fill, radius, padding and minimum width. The renderer
      # spec cannot see it — it reads the same constant the widget writes.
      # AdwExpanderRow extends GridLayout, so no off-device spec can construct one —
      # which is how its entire expand affordance stayed a 16-unit chevron on the port
      # whose targets are fingers (#1155). Measured on the emulator: a NativeScript tap
      # does NOT stop at the child that handles it, so toggling from the row's own tap
      # would collapse the row whenever a user touched anything nested inside it.
      - name: Check disclosure toggles are wired to the header, not the whole row
        run: node scripts/check-nativescript-disclosure-toggles.mjs

      - name: Check the NativeScript theme styles every class its widgets emit
        run: node scripts/check-nativescript-theme-classes.mjs

      # The NS theme inlines the accent as a literal in every rule that uses it (the
      # CSS subset has no custom properties), so a runtime accent is a generated
      # override of those exact selectors. A table with nothing checking it drifts:
      # add a themed rule and that widget silently keeps painting the default blue,
      # which reads as "the accent almost works" and is invisible in a diff.
      - name: Check the NativeScript accent override covers the theme
        run: node scripts/check-nativescript-accent-rules.mjs

      # A lockfile whose FORMAT lags the installer is silent: `--immutable` accepts old
      # versions on purpose, so every install still succeeds — just without the platform
      # fields the filter reads. That is how this repo installed every platform's
      # prebuilds (4935 MB where 1268 MB is usable, 183 unusable packages) for as long as
      # the filter had shipped, with e2e coverage proving the filter itself worked.
      - name: Check the tracked lockfile carries current platform data
        run: node scripts/check-lockfile-current.mjs

      # The READER must ship one release BEFORE the WRITER.
      #
      # A host with only gjs bootstraps a fresh clone through `install.mjs` → the
      # newest PUBLISHED cli.gjs.mjs → `gjsify install --immutable` against this
      # repo's lockfile — and once the CLI bundle is untracked (ADR 0002) that is
      # what CI does too. Raise LOCKFILE_VERSION before a release ships a CLI
      # that READS it and that path is dead for the whole window in between,
      # failing with a complaint about a lockfile that plainly exists.
      # `LOCKFILE_VERSION` moved twice in four releases, so this is a live
      # ordering constraint rather than a hypothetical.
      #
      # It belongs in THIS job, not main.yml: build-free, no install, ~2 s, and
      # no `paths:` filter — so it gates every PR including the ones selective CI
      # narrows. Deliberately NOT deferred to release-cut: a PR that bumps the
      # format would then land with no signal, and `main` would be
      # unbootstrappable for Node-less clones until someone cut a release.
      # Registry unreachable warns rather than passing silently.
      - name: Check the published CLI can still read this lockfile format
        run: node scripts/check-lockfile-reader-lead.mjs

      # A workflow file GitHub REFUSES TO LOAD reports the pull request as GREEN.
      #
      # GitHub creates a run with zero jobs for it, hence zero check runs, so there
      # is nothing red to see — the only visible trace is a run oddly named after
      # the file path instead of the workflow name. MEASURED: moving nine jobs onto
      # the baked CI image deleted a single-line `run:` and left a step carrying
      # only a `name:`. GitHub rejected the whole file, six node-gi jobs silently
      # did not run, and the PR reported 24 GREEN CHECKS. It was caught by a human
      # asking why the expected job names were missing, not by any signal.
      #
      # This job is the right home for the same reason the checks above are: it
      # runs on every pull request with no install and no build, so it can see
      # what the broken workflow cannot report about itself.
      #
      # WHY actionlint AND NOT OUR OWN CHECKER. A hand-rolled YAML outline scanner
      # was written for exactly this and produced 17 FALSE POSITIVES on
      # `prebuilds.yml` and `release.yml`, both of which GitHub loads fine — and a
      # check that cries wolf is worse than no check. Node ships no YAML parser, so
      # the alternatives were a real parser plus schema logic of our own (the same
      # drift risk, better hidden) or the purpose-built tool. actionlint validates
      # the workflow schema, `needs:` references, runner labels and `${{ }}`
      # expressions — a superset of the load-blocking class.
      #
      # Pinned + checksummed: this downloads a binary into a job that reads this
      # repository's workflows, so "latest" is not acceptable and neither is an
      # unverified tarball. Bump both values together.
      #
      # `-shellcheck=` and `-pyflakes=` are DELIBERATELY empty. Both are
      # preinstalled on the ubuntu image, both answer a different question (shell
      # and Python style inside `run:` bodies), and the volume they would add here
      # is UNMEASURED — turning them on is how this step would acquire the false
      # positives that killed its predecessor. With them off the whole repository
      # is clean at 0 findings, which is why this gates rather than warns.
      # Widening to shellcheck is a separate, measured change.
      - name: Check GitHub can load every workflow file
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          tmp="$(mktemp -d)"
          # The same flags `prebuilds.yml` already downloads with, for the reason it
          # learned them: a GitHub release asset can die mid-transfer, and plain `curl`
          # answers `curl: (56) Connection died, tried 5 times before giving up` — which
          # failed this REQUIRED check on two PRs on 2026-08-12, neither of which had
          # touched a workflow file. `--retry-all-errors` is the load-bearing flag:
          # `--retry` alone covers HTTP statuses and connect failures, not a receive error.
          curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 30 -o "$tmp/$tarball" "$url"
          echo "${ACTIONLINT_SHA256}  $tmp/$tarball" | sha256sum -c -
          tar xzf "$tmp/$tarball" -C "$tmp" actionlint
          "$tmp/actionlint" -version
          # No file arguments: actionlint discovers `.github/workflows/**` itself,
          # so a newly added workflow is covered without editing this step.
          "$tmp/actionlint" -shellcheck= -pyflakes=

      # Prose a change resurrects after the base branch deleted it. Git merges that
      # WITHOUT a conflict — the merge base has neither wording, so "replace these
      # paragraphs with those" is an ordinary edit. That is how #886 put back five
      # paragraphs #885 had consolidated, and #892 the whole pre-#885 AGENTS.md.
      # Nothing else can see it: prose has no test, no type, no conformance rule.
      #
      # Advisory on purpose: a deliberate revert has the identical signature, and a
      # hard gate on an ambiguous signal is one people learn to route around. A
      # `Revert-Of:` trailer marks the intent. Needs history, so it deepens the
      # shallow checkout for this step alone rather than making every other check in
      # the job pay for a full clone.
      - name: Check for resurrected prose (advisory)
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --quiet --deepen=200 origin "$BASE_REF" 2>/dev/null || true
          node scripts/check-doc-revert.mjs --base "origin/$BASE_REF"

  # The same manifest checks, on Windows.
  #
  # WHY THIS JOB EXISTS
  #
  # Every rule above reads only `package.json` files, the workflow YAML and the
  # committed binaries — no install, no build, no container. That makes it the
  # ONE gate in this repository that a Windows runner can execute in full, and
  # therefore the cheapest place to hold a Windows contract on every PR. Nothing
  # else does: `main.yml` is Fedora-only, and `cli-cross-platform.yml`'s Windows
  # leg tests the PUBLISHED CLI on a weekly cron, so it cannot see a regression
  # in a branch at all.
  #
  # It is not hypothetical. Three separate rules were reporting DIFFERENT results
  # on Windows and Linux for the same commit, in the direction that matters —
  # green here, red there, so no CI run could have shown it:
  #   • `classifyAxis` split a repo-relative path on `/`, saw `gjs\unit` as one
  #     segment, and demanded a `gjsify.runtimes` declaration from five infra
  #     packages that must not carry one;
  #   • `platforms-ci` looks for a package's path inside a workflow step's text,
  #     and `packages\node-gi\node-gi` never occurs in YAML that writes
  #     `packages/node-gi/node-gi`, so node-gi's macOS legs went uncredited;
  #   • `audit-test-scripts`' ignore list is spelled with `/`, so its exemption
  #     for `packages/node-gi` was a no-op on Windows and the script failed on
  #     the one package it is written to skip.
  # All three are fixed; this job is what keeps the fourth from shipping.
  #
  # WHY A SEPARATE JOB RATHER THAN A MATRIX ON `check`
  #
  # A matrix renames the check to `Detect runtime-triplet drift (ubuntu-latest)`,
  # which silently detaches any branch-protection rule that requires the current
  # name. A second job adds the signal without touching the required one.
  #
  # WHAT IT DELIBERATELY OMITS: the resurrected-prose step and the actionlint
  # workflow-load gate. The first is advisory, needs a deepened fetch and POSIX
  # shell syntax, and running an OS-independent text diff twice buys nothing. The
  # second is the same argument plus a concrete one — actionlint reads YAML, its
  # verdict cannot depend on the host, and the pinned tarball is `linux_amd64`.
  check-windows:
    name: Manifest checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # Before checkout, so it governs the checkout itself. `core.autocrlf=true`
      # — Git for Windows' installer default — would rewrite line endings on the
      # way in, and it is also what `website/…/platform-support.md` tells a
      # Windows contributor to turn OFF. Pinning it here means this job measures
      # the setup the docs recommend, and cannot start failing because a runner
      # image changed its git defaults.
      - name: Check out with line endings untouched
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      # Same command as the Linux job, deliberately: a divergence between the
      # two is the finding. Anything a Windows host genuinely cannot do the
      # audit already reports as a boundary rather than a pass — on win32-x64
      # there are no committed prebuilds, so the functional `dlopen` half has
      # nothing to load and says so.
      - name: Check declared vs detected runtime triplets (strict)
        run: node scripts/audit-runtimes.mjs --check --strict

      - name: Check test scripts run their declared runtime legs
        run: node scripts/audit-test-scripts.mjs

      - name: Check CI container images cover their jobs
        run: node scripts/check-ci-image-packages.mjs

      # `build:infra` must be bundler-free up to the clause that BUILDS the
      # bundler — every clause before `bootstrap-native-facades.mjs` has to get
      # by on tsc, because under GJS `gjsify build` cannot run before the engine
      # facade exists. #1031 lost that invariant while fixing something else, and
      # it stayed green for a day: Node loads the npm rolldown engine instead, and
      # a warm cache skips `build:infra` entirely, so only a COLD GJS tree can see
      # it. v0.31.0's `publish-napi` is such a tree — it failed there, and
      # `@gjsify/napi` did not publish. Incident + rule in the script header.
      - name: Check build:infra is bundler-free before the bundler
        run: node scripts/check-build-infra-order.mjs

      # A spec that writes `const O_CREAT = 64` or `expect(err.errno).toBe(-17)`
      # asks a different question on darwin and win32, and CANNOT fail on Linux —
      # so this pipeline is structurally blind to it and the OS legs pay for it on
      # `main`. #1039 merged three of them and reddened macos-suites and
      # windows-suites for eight hours. This is the part of that class a
      # Linux-only run can see. Incident + rule in the script header.
      - name: Check no spec spells a POSIX constant as a Linux number
        run: node scripts/check-spec-posix-literals.mjs

      # The same class one level up from constants: a FILESYSTEM path split on `'/'` alone
      # separates on `'\\'` on win32, so `lastIndexOf('/')` returns -1 there — a value the
      # existing "no separator" branches already handle, which is why four copies shipped in
      # silence and `fetch('/res/…')` died as `Invalid URL` on Windows (#1143). Also Linux-blind
      # by construction, hence its place in this job. A `/`-separated IDENTIFIER (D-Bus object
      # path, URL pathname, npm specifier, git path) is legitimate and common here, so the check
      # demands a stated reason per file rather than banning the shape.
      - name: Check no filesystem path is split on '/' alone
        run: node scripts/check-posix-path-slice.mjs

      - name: Check the PR-title type list still matches commitlint
        run: node scripts/check-pr-title-types.mjs

      # A multi-line inline `node -e '…'` whose body contains the quote that opened
      # it: the shell truncates the program and the step dies before asserting
      # anything, so the gate reports nothing about what it was gating. Belongs here
      # for the same reason as the rest of this job, plus one more — the workflows
      # most in need of it (`release.yml`, `cli-cross-platform.yml`) never run on a
      # pull request, so this is the only place their inline scripts get read before
      # a release. Incident + scope in the script header.
      - name: Check inline workflow scripts are not self-truncating
        run: node scripts/check-workflow-inline-scripts.mjs

      # An e2e suite on disk that no script names runs NOWHERE. 12 of 112 were in that
      # state, eleven of them by oversight — including the one written to cover the
      # release gate that let v0.28.0 publish half its packages, whose PR body claimed it
      # WAS the pre-release coverage. `e2e-shard.mjs` parses the script rather than
      # globbing, correctly; what was missing is a record of which omissions are meant.
      - name: Check every e2e suite runs or says why not
        run: node scripts/check-e2e-suite-coverage.mjs

      # Fifteen e2e suites carried a hand-written npm harness — ustar writer, SRI
      # integrity, CLI runner — drifted into nine variants of the writer alone, so a
      # correction reached one suite in fifteen. The lift is half a fix; this is the
      # half that stops the sixteenth copy.
      - name: Check no e2e suite re-implements the npm harness
        run: node scripts/check-e2e-harness-duplication.mjs

      # ADR 0017 sat on disk, load-bearing and ABSENT from the index table, because
      # nothing compared the directory to it. The mirror-image cost landed the same day:
      # an agent reading a pre-fix checkout filed an issue asserting 0018 did not exist,
      # hours after it had. The Status column is a second copy of each ADR's own line, so
      # this compares those too — promoting Proposed → Accepted touches two files.
      - name: Check the ADR index lists every ADR
        run: node scripts/check-adr-index.mjs

      # `$adw-components` in adwaita-web's `_reset.scss` is a hand-written copy of 58
      # `customElements.define('adw-…')` calls, and it is what applies the ADR 0010
      # style-isolation floor. A tag missing from it renders in the host page's font and
      # colour, silently. It had already drifted — `adw-source-view` was never listed —
      # and the spec ADR 0010 names as the guard instantiates exactly one element.
      - name: Check adwaita-web's style-isolation list covers every element
        run: node scripts/check-adwaita-reset-components.mjs

      # A conformance table with no RENDERER behind it asserts a derivation against
      # itself. A census (#1072) found 43 such tables, 16 of them silent gaps rather
      # than deliberate — and two headers in the same area were asserting coverage
      # that did not exist, which reads as a reason not to look.
      - name: Check every conformance table is driven or explains why not
        run: node scripts/check-adwaita-conformance-drivers.mjs

      # The style-class LEDGER against libadwaita's own style-classes.md. 21 documented
      # classes (`.card`, `.boxed-list`, `.toolbar`, `.linked`, `.osd`, …) had no rule in
      # adwaita-web at all (#1049) while the roadmap tracked "missing partials" by
      # filename — a diff that reports gaps that are not gaps and misses the ones that
      # are. SKIPs without `refs/libadwaita`; the rules themselves are asserted against
      # the COMPILED css by the browser suite's style-classes.spec.ts.
      - name: Check the style-class ledger covers libadwaita's documented surface
        run: node scripts/check-adwaita-style-classes.mjs

      # Three READMEs promised the three storybook targets "compare 1:1 by screenshot"
      # (#1052) and no such harness existed. It was not built — three rasterisers cannot
      # be compared pixel-for-pixel, and the NativeScript leg needs a device CI has not
      # got — so the claim went, and this holds the part that IS true and checkable:
      # the three targets render the same story SET. A story on one target and not the
      # others is the one state where no comparison is possible at all.
      - name: Check every storybook story exists on all three targets
        run: node scripts/check-storybook-story-parity.mjs

      # Story-set parity says the same stories EXIST; it cannot say the reader meets
      # them in the same order. That order was a by-product of enumeration — a path
      # glob on two targets, a hand-written list on the third — and a comment claiming
      # the two mirrored each other was the only thing holding it. They did not:
      # `Overview` led one sidebar and sat fifth, below the fold, on another, which
      # reads as the overview being missing rather than as an ordering difference.
      - name: Check every storybook category is placed by the declaration
        run: node scripts/check-storybook-category-order.mjs

      # A NativeScript widget's className and the theme's selector are two halves of
      # one decision that nothing compares. Renaming the shortcut-label keycap class
      # from `keycap` to `adw-keycap` was measured: 3221 tests stayed GREEN while
      # every keycap lost its fill, radius, padding and minimum width. The renderer
      # spec cannot see it — it reads the same constant the widget writes.
      # AdwExpanderRow extends GridLayout, so no off-device spec can construct one —
      # which is how its entire expand affordance stayed a 16-unit chevron on the port
      # whose targets are fingers (#1155). Measured on the emulator: a NativeScript tap
      # does NOT stop at the child that handles it, so toggling from the row's own tap
      # would collapse the row whenever a user touched anything nested inside it.
      - name: Check disclosure toggles are wired to the header, not the whole row
        run: node scripts/check-nativescript-disclosure-toggles.mjs

      - name: Check the NativeScript theme styles every class its widgets emit
        run: node scripts/check-nativescript-theme-classes.mjs

      # The NS theme inlines the accent as a literal in every rule that uses it (the
      # CSS subset has no custom properties), so a runtime accent is a generated
      # override of those exact selectors. A table with nothing checking it drifts:
      # add a themed rule and that widget silently keeps painting the default blue,
      # which reads as "the accent almost works" and is invisible in a diff.
      - name: Check the NativeScript accent override covers the theme
        run: node scripts/check-nativescript-accent-rules.mjs

      # A lockfile whose FORMAT lags the installer is silent: `--immutable` accepts old
      # versions on purpose, so every install still succeeds — just without the platform
      # fields the filter reads. That is how this repo installed every platform's
      # prebuilds (4935 MB where 1268 MB is usable, 183 unusable packages) for as long as
      # the filter had shipped, with e2e coverage proving the filter itself worked.
      - name: Check the tracked lockfile carries current platform data
        run: node scripts/check-lockfile-current.mjs
