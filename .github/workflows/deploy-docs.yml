name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Pull the private ci-fedora image from ghcr (same as main.yml / release.yml).
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    container:
      # Prebuilt CI image (`.docker/ci-fedora.Dockerfile`) baking gjs + the
      # full GNOME devel stack AND `libatomic` — the same image main.yml /
      # release.yml standardised on. `libatomic.so.1` is required by the
      # Node >= 26 binary that actions/setup-node downloads; the bare
      # `fedora:43` container lacked it, so the docs build died at
      # `node: error while loading shared libraries: libatomic.so.1`.
      # Using the image also skips the 3-5 min `dnf install` at job start.
      image: ghcr.io/gjsify/ci-fedora:44
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      # Phase D.7d: Node-free install via the committed GJS bundle.
      # Mirrors main.yml — see that workflow for rationale.
      - name: Install dependencies (gjsify install --immutable)
        run: gjs -m packages/infra/cli/dist/cli.gjs.mjs install --immutable

      - name: Build documentation site
        run: PATH="$PWD/node_modules/.bin:$PATH" gjsify run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
