name: napi

# Dedicated CI for @gjsify/napi — the Node-API (N-API) host that implements the
# napi C ABI over GJS's SpiderMonkey (mozjs-140) so GJS can load UNMODIFIED
# compiled .node addons (the forward mirror of @gjsify/node-gi). Like
# packages/napi/** is NOT a gjsify workspace member (the GJS-first
# install/foreach tooling can't build a Vala+C++/meson shim or node-gyp
# addons), so the main GJS workflow neither builds nor tests it; this workflow
# is its source of truth. Builds the Vala+C++ shim (.so+.gir+.typelib), builds
# the Node N-API test addons with node-gyp, and runs every gate + the
# golden-diff conformance oracle on Fedora 44 (GJS 1.88 / mozjs-140).

on:
  push:
    branches: [main]
    paths:
      - 'packages/napi/**'
      # The nodegi-shim job below BUILDS + TESTS @gjsify/node-gi under the shim
      # (the N-API fidelity oracle), so a node-gi change that could break the
      # oracle must re-run this workflow too.
      - 'packages/node-gi/**'
      # The transparent addon matrix in the `consumer` job below covers
      # `napiNodeAddonPlugin`, which LIVES here — so a change to the plugin is
      # exactly what must re-run this workflow. Without this path the matrix
      # would still not have caught the six defects it exists for (#840): they
      # were all in rolldown-plugin-gjsify, which triggers main.yml, not napi.yml.
      - 'packages/infra/rolldown-plugin-gjsify/**'
      - '.github/workflows/napi.yml'
  pull_request:
    paths:
      - 'packages/napi/**'
      - 'packages/node-gi/**'
      - 'packages/infra/rolldown-plugin-gjsify/**'
      - '.github/workflows/napi.yml'
  # Manual driver for the experimental `windows` job below (gated on this event)
  # — the from-source gjs + mozjs-140 Windows attempt is opt-in so it never reds
  # a normal push/PR while gjs-on-Windows remains blocked (see STATUS.md).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: napi-${{ github.ref }}
  cancel-in-progress: true

# The pinned refs/node revision the conformance addon sources + committed
# goldens are generated from. MUST match the refs/node submodule gitlink so the
# UNMODIFIED addons + their Node-reference output stay byte-identical in CI.
env:
  NODE_TEST_REV: ed63b195cd61367db7b611cb601352197569ee0e

jobs:
  build-test:
    name: Build & gates & conformance (GJS / Fedora 44)
    runs-on: ubuntu-latest
    # Backstop: a shim regression could hang a gate or the valgrind leg; cap the
    # job rather than wait the default 6h.
    timeout-minutes: 30
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + mozjs-140 + GJS + GI dev headers + valgrind
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            mozjs140-devel gjs gjs-devel libsoup3 libuv \
            gobject-introspection gobject-introspection-devel glib2-devel \
            vala meson ninja-build valgrind
          gjs --version
          echo "mozjs-140: $(pkg-config --modversion mozjs-140)"
          echo "gjs-1.0:   $(pkg-config --modversion gjs-1.0)"
          echo "valac:     $(valac --version)"

      # Official nodejs.org build, NOT Fedora's `dnf nodejs` (which segfaults
      # rolldown's prebuilt napi binding — used by the consumer gate's bundler).
      # node-gyp builds the N-API test addons against this Node's headers.
      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      # refs/node is an SSH-url submodule (nodejs/node) the checkout can't init;
      # sparse partial-clone the two N-API test suites at the pinned rev so the
      # conformance addons + goldens stay byte-identical. Lightweight (blob
      # filter + two paths + depth 1).
      - name: Fetch Node N-API test addons (sparse, pinned rev)
        run: |
          rm -rf refs/node && mkdir -p refs/node && cd refs/node
          git init -q
          git remote add origin https://github.com/nodejs/node.git
          git config extensions.partialClone origin
          git sparse-checkout init --cone
          git sparse-checkout set test/js-native-api test/node-api
          git fetch -q --depth 1 --filter=blob:none origin "$NODE_TEST_REV"
          git checkout -q FETCH_HEAD
          echo "addons: js-native-api=$(ls test/js-native-api | wc -l) node-api=$(ls test/node-api | wc -l) dirs"

      # Build the Vala+C++ shim → libgjsifynapi.so + GjsifyNapi-1.0.{gir,typelib}
      # and stage it into the committed prebuild dir (imports.gi loads the staged
      # .so, and the conformance orchestrator pins GI_TYPELIB_PATH there).
      - name: Build the @gjsify/napi shim (meson) + stage prebuild
        working-directory: packages/napi/napi
        run: |
          meson setup build .
          meson compile -C build
          cp build/libgjsifynapi.so build/GjsifyNapi-1.0.gir build/GjsifyNapi-1.0.typelib prebuilds/linux-x64/
          echo "staged: $(ls -1 prebuilds/linux-x64)"

      # Assert the checked-in stubs.cc is in sync with the sources (a function
      # implemented but still stubbed would fail the meson link; a regeneration
      # drift is caught here before the gates run).
      - name: Verify stubs.cc is regenerated in sync
        working-directory: packages/napi/napi
        run: |
          cp src/cc/stubs.cc "$RUNNER_TEMP/stubs.committed"
          python3 scripts/gen-stubs.py
          diff -u "$RUNNER_TEMP/stubs.committed" src/cc/stubs.cc \
            || { echo "::error::stubs.cc out of sync — run: python3 scripts/gen-stubs.py"; exit 1; }

      # The gate + conformance addons (raw C/C++ N-API, node-gyp).
      - name: Build gate test addons (node-gyp)
        working-directory: packages/napi/napi
        run: npm run build:test-addons

      - name: Gate P0.0 — load
        working-directory: packages/napi/napi
        run: npm run test:gate

      - name: Gate P0.1 — env + value model + scopes
        working-directory: packages/napi/napi
        run: npm run test:gate:p01

      - name: Gate P0.2 — objects + functions + classes
        working-directory: packages/napi/napi
        run: npm run test:gate:p02

      - name: Gate P0.3 — lifetime (+ teardown)
        working-directory: packages/napi/napi
        run: npm run test:gate:p03

      - name: Gate P0.4 — arraybuffer / typedarray
        working-directory: packages/napi/napi
        run: GI_TYPELIB_PATH=build LD_LIBRARY_PATH=build gjs test/p04-gate.js

      # Phase-1 threadsafe-function gate: the raw-C tsfn-addon (already built by
      # the "Build gate test addons" step — build:test-addons globs test/*-addon)
      # drives make_threadsafe_function from real foreign pthreads through the
      # shim's coalescing / flood / blocking / abort paths. Pure-shim, no
      # workspace — the cheap Phase-1 gate, so it lives beside the P0.x gates.
      - name: Gate P1 — threadsafe functions (tsfn)
        working-directory: packages/napi/napi
        run: npm run test:gate:p1

      # Per-claim owner attribution at env teardown. MEASURES the teardown cost
      # of each claim-owner shape (the case script prints CLOCK_MONOTONIC at its
      # last statement; the driver reads the same clock at child exit), so a
      # regression shows up as a number, not a hang: a claim nothing can hand
      # back must NOT cost the 2 s join, while a claim a foreign thread really
      # holds must still be waited for and still warn.
      - name: Gate — tsfn env-teardown claim attribution
        working-directory: packages/napi/napi
        run: npm run test:gate:tsfn-teardown

      # Golden-diff conformance oracle: each UNMODIFIED Node N-API test addon
      # (node-gyp) runs on Node (golden REFERENCE) and on GJS-under-shim; stdout
      # must be byte-identical. Strict ledger — an unlisted GJS failure fails the
      # harness; a ledgered program that starts passing also fails.
      - name: Conformance oracle (golden-diff, Node vs GJS-under-shim)
        working-directory: packages/napi/napi
        run: npm run test:conformance

      # Valgrind memcheck over a GC-stressed conformance load→run→exit loop —
      # 0 memory errors (the invalid-read/write/UAF crash class).
      - name: Conformance memory leg (valgrind memcheck, 0 errors)
        working-directory: packages/napi/napi
        run: npm run test:conformance:mem

  consumer:
    name: better-sqlite3 consumer gate (GJS / Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: fedora:44
    steps:
      - name: Install toolchain + mozjs-140 + GJS + GI dev headers
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            mozjs140-devel gjs gjs-devel libsoup3 \
            gobject-introspection gobject-introspection-devel glib2-devel \
            vala meson ninja-build \
            json-glib
          gjs --version

      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the @gjsify/napi shim (meson) + stage prebuild
        working-directory: packages/napi/napi
        run: |
          meson setup build .
          meson compile -C build
          cp build/libgjsifynapi.so build/GjsifyNapi-1.0.gir build/GjsifyNapi-1.0.typelib prebuilds/linux-x64/

      # Build better-sqlite3 from source (the real npm native addon the gate
      # proves runs unmodified on GJS). --force_build so it never uses a shipped
      # prebuild; the gate additionally disables prebuilds so Node + GJS load the
      # SAME source-built .node.
      - name: Build better-sqlite3 from source (node-gyp)
        working-directory: packages/napi/napi
        run: |
          npm install --prefix test/consumer better-sqlite3 --no-audit --no-fund --foreground-scripts
          ( cd test/consumer/node_modules/better-sqlite3 && npm exec -- node-gyp rebuild --force_build=1 )

      # Node-free workspace install via the committed CLI bundle (the supported
      # `gjsify install --immutable` path) so @gjsify/napi's L1 + the CLI can be
      # built under Node.
      # Restore the workspace node_modules keyed on the lockfile — SHARED with the
      # main CI's `node-modules-v1` cache, so a napi PR whose lockfile matches main
      # (the common case) rides main's warm tree and the multi-minute
      # `gjsify install --immutable` extract below becomes a near-instant no-op.
      # Restore-ONLY (no save): the `.bin/gjsify` repoint + per-gate installs below
      # mutate node_modules in a napi-specific way that must never be written back
      # into the cache main CI shares.
      - name: Restore node_modules (shared with main CI)
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            !node_modules/.cache/gjsify/build
            packages/*/*/node_modules
          key: node-modules-v1-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: |
            node-modules-v1-

      # Cache the transpiled workspace libs (packages/*/*/lib) under a napi-scoped
      # key (exact-only: lockfile + sources). An exact hit means the sources are
      # unchanged, so BOTH build steps below (the polyfill `build:gjsify` foreach
      # and the rolldown-plugin-gjsify shim build) are SKIPPED — guarded on this
      # step's cache-hit. That guard is only sound because every job saving under
      # this key runs the SAME fill steps, so a hit always carries both outputs;
      # the `consumer` and `nodegi-shim` jobs race to save the first entry per
      # key, and an entry under a live key is immortal. v1 → v2 because v1
      # entries predate the shim-build step: they hold the polyfill libs but NOT
      # packages/infra/rolldown-plugin-gjsify/lib, and an exact v1 hit would skip
      # the step that produces it and red the GJS-engine matrix below. NOT shared
      # with main's build-vN cache, whose entries also carry the lib/types
      # (.d.ts) the transpile-only polyfill build omits.
      - name: Cache workspace polyfill libs (lib/esm)
        id: napi-libs-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/*/lib
            !packages/infra/tsc/lib
            !packages/infra/resolve-npm/lib
          key: napi-libs-v2-${{ hashFiles('gjsify-lock.json') }}-${{ hashFiles('packages/*/*/src/**/*.ts', 'packages/*/*/src/**/*.mts', 'packages/*/*/src/**/*.cts') }}

      - name: Install the gjsify workspace (committed CLI bundle, Node-free)
        run: gjs -m packages/infra/cli/dist/cli.gjs.mjs install --immutable

      # Repoint the workspace `.bin/gjsify` at a Node-runnable published @gjsify/cli
      # (npm rolldown), NOT the committed GJS bundle (which needs the absent
      # @gjsify/rolldown-native). Same rationale as node-gi.yml's consumer job.
      - name: Use a published @gjsify/cli as the Node bundler (npm rolldown)
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1
          # Prefer the version this checkout declares, but do not REQUIRE it to
          # be on npm yet. The release commit bumps every package.json and only
          # then does release.yml publish, so between those two events this step
          # asks npm for a version that provably does not exist and reddens main
          # on every single release. A recurring, self-resolving red teaches
          # people to ignore the signal.
          if ! npm install "@gjsify/cli@${CLI_VERSION}" --no-audit --no-fund --no-save 2>/dev/null; then
            echo "::warning::@gjsify/cli@${CLI_VERSION} is not on npm (yet) — falling back to @latest."
            npm install "@gjsify/cli@latest" --no-audit --no-fund --no-save
          fi
          cd - >/dev/null
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          echo "Node bundler: $(node_modules/.bin/gjsify --version)"

      # better-sqlite3's node: builtins bundle to @gjsify/* polyfills (a highly
      # connected graph — node-globals pulls in a broad set), whose lib/esm must
      # exist for the bundler to resolve them. A fresh `gjsify install` only
      # symlinks the workspace packages; it does not build them. Transpile every
      # package's lib/esm (build:gjsify — no tsc, so no @gjsify/unit type gate).
      - name: Build workspace polyfill libs (lib/esm) for the bundler
        # Skip when the napi-libs cache restored an exact-key hit (sources
        # unchanged) — the restored packages/*/*/lib is already what this step
        # would produce. A miss (or restore-key fallback) rebuilds + repopulates.
        if: steps.napi-libs-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          # `--exclude @gjsify/tsc`: this step exists to transpile the POLYFILL
          # lib/esm trees, and every polyfill's `build:gjsify` is a self-contained
          # `gjsify build --library`. `@gjsify/tsc`'s is not — it BUNDLES typescript
          # `--app gjs`, which resolves `node:fs` → `@gjsify/fs` and therefore needs
          # the very lib/esm trees this loop is still producing. `foreach` is
          # unordered by default (`--topological` is opt-in) and discovery puts
          # packages/infra/tsc before packages/node/fs, so it died with
          # `cannot resolve @gjsify/fs`. Topological order would not help either:
          # tsc reaches fs through the alias substitution, not a declared dep.
          # These jobs never use the tsc bundle, so skip building it.
          gjsify foreach build:gjsify --exclude '@gjsify/tsc'

      # The committed dist/cli.gjs.mjs INLINES the build pipeline's CODE but not
      # its runtime DATA files: `resolveShim()` (rolldown-plugin-gjsify's
      # app/gjs.ts) hands rolldown FILE paths under
      # packages/infra/rolldown-plugin-gjsify/lib/shims/ (unicorn-magic,
      # console-gjs, module-resolve), resolved through the package's
      # `./shims/<name>` subpath export at BUILD time and inlined into the
      # OUTPUT bundle. That `lib/` is a plain-`tsc` build output the polyfill
      # step above never produces (the package has no `build:gjsify` script), so
      # without this step every `--app gjs` build driven by the committed bundle
      # dies at config time with `cannot locate the "unicorn-magic" shim` — the
      # first red of the GJS-engine transparent matrix. `--with-dependencies`
      # tsc-builds the small workspace-dep closure the plugin's own `tsc` needs
      # declarations from (console, deepkit, pnp, blueprint); deps without a
      # `build` script are skipped. Runs in BOTH jobs that save the napi-libs
      # cache so an entry always carries this output regardless of which job's
      # post-job save wins the per-key race (see the cache step above).
      - name: Build @gjsify/rolldown-plugin-gjsify lib (bundler shims)
        if: steps.napi-libs-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          gjsify workspace @gjsify/rolldown-plugin-gjsify build --with-dependencies

      # The consumer gate builds @gjsify/napi's L1 itself and drives the workout
      # build through a Node CLI entry — point it at the published @gjsify/cli
      # (npm rolldown), so no fragile in-repo workspace build is needed. The gate
      # then runs the SAME workout on Node (golden) + GJS-under-shim and byte-diffs
      # (better-sqlite3's node: builtins → @gjsify/* polyfills; its addon → the
      # shim via loadAddon). Prints CONSUMER GATE: PASS on an exact match.
      - name: better-sqlite3 consumer gate (Node vs GJS byte-identical)
        working-directory: packages/napi/napi
        env:
          GJSIFY_CLI_ENTRY: /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js
        run: node test/consumer-gate.mjs

      # TRANSPARENT matrix — the gate that covers `napiNodeAddonPlugin`'s
      # auto-resolution across all four addon codegens (node-gyp-build ×2,
      # bindings, napi-rs entry-replacement), each byte-diffed Node vs
      # GJS-under-shim.
      #
      # It ran in NO workflow until now, which is why six defects in that plugin
      # shipped at once (#840): every one of them was in the acquisition path
      # this matrix exercises, and nothing ran it. Vendoring is 4 npm packages +
      # two small node-gyp builds, so it belongs in this already-warm job rather
      # than a new one.
      - name: Vendor + source-build the addon matrix
        working-directory: packages/napi/napi
        run: sh test/addons/setup.sh

      # Driven by the COMMITTED dist/cli.gjs.mjs, NOT the published CLI the
      # consumer gate above uses — and that distinction is the whole point.
      # The published CLI carries the LAST RELEASE's plugin, so a PR changing
      # `napiNodeAddonPlugin` would test nothing at all; the committed bundle
      # carries THIS commit's plugin (the pre-commit hook rebuilds it, and
      # main.yml's verify-committed-bundles proves it reproduces from that
      # source). It also runs the build on `@gjsify/rolldown-native` — the
      # engine where two of the six #840 defects lived (a `null` importer
      # across the JSON hook boundary, and a Rust-`regex`-incompatible filter
      # that silently disabled every interception). A Node-driven build cannot
      # see either.
      #
      # There is deliberately no second leg on the published CLI: it can only
      # ever report on code that already shipped.
      #
      # `@gjsify/napi` must be resolvable by BARE specifier for the emitted
      # shims, exactly as in a real consumer — the `gjsify install @gjsify/napi`
      # stand-in, since packages/napi is not a workspace member.
      #
      # GJSIFY_CLI_ENTRY covers only the gate's build-the-napi-L1 FALLBACK
      # (normally a no-op — the consumer gate above already built lib/esm): the
      # in-repo Node CLI is not built in this job, so without it that fallback
      # would spawn a nonexistent packages/infra/cli/lib/index.js. The matrix
      # BUILD itself is driven by the committed bundle (GJSIFY_GATE_ENGINE=gjs),
      # never by this entry.
      - name: Transparent addon matrix (GJS engine, committed CLI bundle)
        working-directory: packages/napi/napi
        env:
          GJSIFY_GATE_ENGINE: gjs
          GJSIFY_CLI_ENTRY: /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js
        run: |
          mkdir -p "$GITHUB_WORKSPACE/node_modules/@gjsify"
          ln -sfn "$GITHUB_WORKSPACE/packages/napi/napi" "$GITHUB_WORKSPACE/node_modules/@gjsify/napi"
          sh test/run-transparent-matrix.sh

  # Phase-1 N-API fidelity oracle: @gjsify/node-gi (a REAL native N-API addon —
  # the reverse GObject-Introspection engine) runs UNDER the @gjsify/napi shim on
  # GJS, proving the threadsafe-function + make_callback surface end to end, and a
  # differential-oracle leg shows node-gi-under-shim is byte-identical to native
  # `gi://`. This guards the shim's N-API fidelity, so napi.yml is its home. It
  # needs three build systems (the meson shim, the node-gyp node-gi addon, the
  # GJS-first gjsify workspace + polyfills), so it is a dedicated heavy job that
  # reuses the consumer gate's proven Node-free-install + published-CLI recipe.
  nodegi-shim:
    name: node-gi N-API fidelity under shim (GJS / Fedora 44)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: fedora:44
    steps:
      # Consumer-gate toolchain (mozjs-140 + GJS + Vala/meson shim deps + libsoup3,
      # which the committed cli.gjs.mjs eager-imports via gi://Soup) PLUS
      # @gjsify/node-gi's GObject runtime deps: cairo (+ -gobject) backs the addon's
      # node-gyp build (binding.gyp: pkg-config girepository-2.0 cairo) and the
      # cairo/Pango/GdkPixbuf conformance programs; dejavu supplies a real font so
      # Pango layout relations hold deterministically. Same names node-gi.yml uses.
      - name: Install toolchain + mozjs-140 + GJS + GI dev headers + node-gi GObject deps
        run: |
          dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
            git gcc-c++ make python3 pkgconf-pkg-config tar xz unzip \
            mozjs140-devel gjs gjs-devel libsoup3 \
            gobject-introspection gobject-introspection-devel glib2-devel \
            vala meson ninja-build \
            cairo cairo-devel cairo-gobject-devel pango gdk-pixbuf2 dejavu-sans-fonts
          gjs --version

      - name: Use official Node.js (Fedora's dnf node crashes the bundler)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      # Build the Vala+C++ shim → libgjsifynapi.so + GjsifyNapi-1.0.{gir,typelib}
      # and stage it into the committed prebuild dir the gates load via
      # GI_TYPELIB_PATH/LD_LIBRARY_PATH. meson-direct (not `gjsify run
      # build:prebuilds`) avoids an ordering dependency on the not-yet-set-up CLI.
      - name: Build the @gjsify/napi shim (meson) + stage prebuild
        working-directory: packages/napi/napi
        run: |
          meson setup build .
          meson compile -C build
          cp build/libgjsifynapi.so build/GjsifyNapi-1.0.gir build/GjsifyNapi-1.0.typelib prebuilds/linux-x64/

      # Build @gjsify/node-gi from source (node-gyp) → build/Release/node_gi.node,
      # the addon both gates load through the shim. Its `install` script IS
      # `node-gyp rebuild`; the explicit rebuild is belt-and-suspenders so the addon
      # exists even if the install script is ever skipped.
      - name: Build @gjsify/node-gi native addon (node-gyp)
        working-directory: packages/node-gi/node-gi
        run: |
          npm install --no-audit --no-fund --foreground-scripts
          npm exec -- node-gyp rebuild

      # Node-free workspace install via the committed CLI bundle (the supported
      # `gjsify install --immutable` path) so the @gjsify/* polyfills the gates'
      # --app gjs bundles inline are symlinked into node_modules.
      # Restore the workspace node_modules keyed on the lockfile — SHARED with the
      # main CI's `node-modules-v1` cache, so a napi PR whose lockfile matches main
      # (the common case) rides main's warm tree and the multi-minute
      # `gjsify install --immutable` extract below becomes a near-instant no-op.
      # Restore-ONLY (no save): the `.bin/gjsify` repoint + per-gate installs below
      # mutate node_modules in a napi-specific way that must never be written back
      # into the cache main CI shares.
      - name: Restore node_modules (shared with main CI)
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            !node_modules/.cache/gjsify/build
            packages/*/*/node_modules
          key: node-modules-v1-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: |
            node-modules-v1-

      # Cache the transpiled workspace libs (packages/*/*/lib) under a napi-scoped
      # key (exact-only: lockfile + sources). An exact hit means the sources are
      # unchanged, so BOTH build steps below (the polyfill `build:gjsify` foreach
      # and the rolldown-plugin-gjsify shim build) are SKIPPED — guarded on this
      # step's cache-hit. That guard is only sound because every job saving under
      # this key runs the SAME fill steps, so a hit always carries both outputs;
      # the `consumer` and `nodegi-shim` jobs race to save the first entry per
      # key, and an entry under a live key is immortal. v1 → v2 because v1
      # entries predate the shim-build step: they hold the polyfill libs but NOT
      # packages/infra/rolldown-plugin-gjsify/lib, and an exact v1 hit would skip
      # the step that produces it and red the GJS-engine matrix below. NOT shared
      # with main's build-vN cache, whose entries also carry the lib/types
      # (.d.ts) the transpile-only polyfill build omits.
      - name: Cache workspace polyfill libs (lib/esm)
        id: napi-libs-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/*/lib
            !packages/infra/tsc/lib
            !packages/infra/resolve-npm/lib
          key: napi-libs-v2-${{ hashFiles('gjsify-lock.json') }}-${{ hashFiles('packages/*/*/src/**/*.ts', 'packages/*/*/src/**/*.mts', 'packages/*/*/src/**/*.cts') }}

      - name: Install the gjsify workspace (committed CLI bundle, Node-free)
        run: gjs -m packages/infra/cli/dist/cli.gjs.mjs install --immutable

      # Repoint the workspace `.bin/gjsify` at a Node-runnable published @gjsify/cli
      # (npm rolldown), NOT the committed GJS bundle (which needs the absent
      # @gjsify/rolldown-native). Same rationale as the consumer job.
      - name: Use a published @gjsify/cli as the Node bundler (npm rolldown)
        run: |
          CLI_VERSION="$(node -p "require('./packages/infra/cli/package.json').version")"
          mkdir -p /tmp/gjsify-node-cli
          cd /tmp/gjsify-node-cli && npm init -y >/dev/null 2>&1
          # Prefer the version this checkout declares, but do not REQUIRE it to
          # be on npm yet. The release commit bumps every package.json and only
          # then does release.yml publish, so between those two events this step
          # asks npm for a version that provably does not exist and reddens main
          # on every single release. A recurring, self-resolving red teaches
          # people to ignore the signal.
          if ! npm install "@gjsify/cli@${CLI_VERSION}" --no-audit --no-fund --no-save 2>/dev/null; then
            echo "::warning::@gjsify/cli@${CLI_VERSION} is not on npm (yet) — falling back to @latest."
            npm install "@gjsify/cli@latest" --no-audit --no-fund --no-save
          fi
          cd - >/dev/null
          ln -sf /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js node_modules/.bin/gjsify
          echo "Node bundler: $(node_modules/.bin/gjsify --version)"

      # node-gi's node:* imports bundle to @gjsify/* polyfills whose lib/esm must
      # exist for the bundler to resolve them; a fresh `gjsify install` only
      # symlinks the packages, it does not build them. Transpile every package's
      # lib/esm (build:gjsify — no tsc, so no type gate).
      - name: Build workspace polyfill libs (lib/esm) for the bundler
        # Skip when the napi-libs cache restored an exact-key hit (sources
        # unchanged) — the restored packages/*/*/lib is already what this step
        # would produce. A miss (or restore-key fallback) rebuilds + repopulates.
        if: steps.napi-libs-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          # `--exclude @gjsify/tsc`: this step exists to transpile the POLYFILL
          # lib/esm trees, and every polyfill's `build:gjsify` is a self-contained
          # `gjsify build --library`. `@gjsify/tsc`'s is not — it BUNDLES typescript
          # `--app gjs`, which resolves `node:fs` → `@gjsify/fs` and therefore needs
          # the very lib/esm trees this loop is still producing. `foreach` is
          # unordered by default (`--topological` is opt-in) and discovery puts
          # packages/infra/tsc before packages/node/fs, so it died with
          # `cannot resolve @gjsify/fs`. Topological order would not help either:
          # tsc reaches fs through the alias substitution, not a declared dep.
          # These jobs never use the tsc bundle, so skip building it.
          gjsify foreach build:gjsify --exclude '@gjsify/tsc'

      # The committed dist/cli.gjs.mjs INLINES the build pipeline's CODE but not
      # its runtime DATA files: `resolveShim()` (rolldown-plugin-gjsify's
      # app/gjs.ts) hands rolldown FILE paths under
      # packages/infra/rolldown-plugin-gjsify/lib/shims/ (unicorn-magic,
      # console-gjs, module-resolve), resolved through the package's
      # `./shims/<name>` subpath export at BUILD time and inlined into the
      # OUTPUT bundle. That `lib/` is a plain-`tsc` build output the polyfill
      # step above never produces (the package has no `build:gjsify` script), so
      # without this step every `--app gjs` build driven by the committed bundle
      # dies at config time with `cannot locate the "unicorn-magic" shim` — the
      # first red of the GJS-engine transparent matrix. `--with-dependencies`
      # tsc-builds the small workspace-dep closure the plugin's own `tsc` needs
      # declarations from (console, deepkit, pnp, blueprint); deps without a
      # `build` script are skipped. Runs in BOTH jobs that save the napi-libs
      # cache so an entry always carries this output regardless of which job's
      # post-job save wins the per-key race (see the cache step above).
      - name: Build @gjsify/rolldown-plugin-gjsify lib (bundler shims)
        if: steps.napi-libs-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          gjsify workspace @gjsify/rolldown-plugin-gjsify build --with-dependencies

      # Phase-1 node-gi gate: bundles nodegi-workout.mjs `--app gjs` (node-gi's
      # node:* → @gjsify/* polyfills; the addon pinned via NODE_GI_NATIVE + loaded
      # through the shim by node-gi's gjs host mode), runs it under `gjs -m`, and
      # asserts the workout markers PLUS the toggle-debug proof that a tsfn dispatch
      # executed a GObject teardown on the JS thread. GJSIFY_CLI_ENTRY points at the
      # published CLI's Node entry (the in-repo one is not built here).
      - name: Phase-1 node-gi gate (node-gi under shim on GJS)
        env:
          GJSIFY_CLI_ENTRY: /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js
        run: node packages/napi/napi/test/nodegi-gate.mjs

      # Differential-oracle leg: every conformance gi:// program runs on native gjs
      # (the reference golden) AND on node-gi-under-shim (the `gjs-napi` runtime);
      # stdout must be byte-identical. All 21 programs must be green — there are no
      # gjs-napi ledger entries, so a single unexpected result fails the harness.
      - name: Conformance oracle (gjs-napi — node-gi under shim vs native gi://)
        working-directory: packages/node-gi/node-gi
        env:
          GJSIFY_CLI_ENTRY: /tmp/gjsify-node-cli/node_modules/@gjsify/cli/lib/index.js
        run: node scripts/conformance.mjs --runtimes=gjs-napi

  # macOS proof (the shim BUILDS + LOADS + runs the core gates on macOS). The whole
  # team is Linux-only, so a macos-latest runner (Apple silicon, arm64 → the
  # prebuild is darwin-arm64) is the only way to validate. THE HARD PART vs the
  # `node-gi` macOS job: node-gi links the portable girepository stack (Homebrew
  # ships it), whereas THIS shim links GJS's SpiderMonkey (mozjs-140) + libgjs — a
  # heavier dependency. Homebrew HAS the exact pairing the Fedora job uses: `gjs`
  # 1.88.x depends on `spidermonkey` 140.x (mozjs-140), so the intrinsic
  # mozjs-major pin (ADR 0011) holds with no source build. meson builds the Vala+C++
  # shim into libgjsifynapi.dylib + GjsifyNapi-1.0.{gir,typelib} (macOS uses ld64's
  # -exported_symbols_list, not the GNU version-script — see meson.build), and the
  # load + P0.x value-model gates PLUS the P1 tsfn gate run UNMODIFIED node-gyp
  # .node addons through it on `gjs` (the earlier macOS exit-segfault after the tsfn
  # gate was an abort-path use-after-free — a tsfn freed under a live foreign claim —
  # now fixed by gating the finalize on thread_count == 0; see the P1 step below).
  # The darwin-arm64 prebuild is staged + uploaded (the shim's
  # OWN prebuild triple — node-gi's conformance.mjs already computes
  # `${platform}-${arch}` = darwin-arm64 for the non-linux case). DEFERRED here (NOT
  # Linux-only, just a wider first cut): the golden-diff conformance oracle, the
  # better-sqlite3 consumer gate, the node-gi-under-shim oracle, and the valgrind
  # memory legs (valgrind has no maintained arm64-macOS target). Windows has no
  # counterpart job — no prebuilt MSVC mozjs-140 exists (see STATUS.md).
  macos:
    name: macOS build + gates (GJS / macos-latest arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Install GJS + SpiderMonkey (mozjs-140) + GI toolchain (Homebrew)
        run: |
          # `gjs` pulls `spidermonkey` (mozjs-140) + glib/gobject/gio/cairo
          # transitively; name gobject-introspection (g-ir-compiler), vala, meson,
          # ninja and pkgconf explicitly so the shim's build deps all resolve.
          brew install gjs gobject-introspection vala meson ninja pkgconf
          BREW_PREFIX="$(brew --prefix)"
          # Neither `gjs` nor `spidermonkey` is keg-only, so brew symlinks their
          # lib/pkgconfig (gjs-1.0.pc, mozjs-140.pc + the glib/gobject/gio .pc that
          # gjs-1.0.pc Requires) into $BREW_PREFIX/lib/pkgconfig — one dir resolves
          # the whole shim closure.
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Verify toolchain (gjs / mozjs-140 / gjs-1.0 / valac)
        run: |
          gjs --version
          echo "mozjs-140: $(pkg-config --modversion mozjs-140)"
          echo "gjs-1.0:   $(pkg-config --modversion gjs-1.0)"
          echo "valac:     $(valac --version)"

      # Node 24 builds the N-API test addons with node-gyp (macOS clang, arm64).
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout
        uses: actions/checkout@v4

      # Build the Vala+C++ shim → libgjsifynapi.dylib + GjsifyNapi-1.0.{gir,typelib}
      # and stage it into the shim's own darwin-arm64 prebuild dir.
      - name: Build the @gjsify/napi shim (meson) + stage darwin-arm64 prebuild
        working-directory: packages/napi/napi
        run: |
          meson setup build .
          meson compile -C build
          mkdir -p prebuilds/darwin-arm64
          cp build/libgjsifynapi.dylib build/GjsifyNapi-1.0.gir build/GjsifyNapi-1.0.typelib prebuilds/darwin-arm64/
          echo "staged: $(ls -1 prebuilds/darwin-arm64)"

      # The gate + conformance addons (raw C/C++ N-API, node-gyp) — same script the
      # Fedora job uses; node-gyp targets darwin-arm64 here.
      - name: Build gate test addons (node-gyp)
        working-directory: packages/napi/napi
        run: npm run build:test-addons

      # Run the load + value-model + tsfn gates on `gjs` with the shim loaded from
      # build/. macOS dyld reads DYLD_LIBRARY_PATH (not LD_LIBRARY_PATH), so invoke
      # gjs directly rather than via the Linux-shaped `test:gate*` npm scripts.
      - name: Gate P0.0 — load (unmodified .node addon through the shim)
        working-directory: packages/napi/napi
        run: GI_TYPELIB_PATH="$PWD/build" DYLD_LIBRARY_PATH="$PWD/build" gjs test/load-gate.js test/hello-addon/build/Release/hello.node

      - name: Gate P0.1 — env + value model + scopes
        working-directory: packages/napi/napi
        run: GI_TYPELIB_PATH="$PWD/build" DYLD_LIBRARY_PATH="$PWD/build" gjs test/p01-gate.js

      - name: Gate P0.2 — objects + functions + classes
        working-directory: packages/napi/napi
        run: GI_TYPELIB_PATH="$PWD/build" DYLD_LIBRARY_PATH="$PWD/build" gjs test/p02-gate.js

      - name: Gate P0.4 — arraybuffer / typedarray
        working-directory: packages/napi/napi
        run: GI_TYPELIB_PATH="$PWD/build" DYLD_LIBRARY_PATH="$PWD/build" gjs test/p04-gate.js

      # Phase-1 threadsafe-function gate on macOS (arm64, mozjs-140). Its tsfn
      # DELIVERIES always passed here (coalescing, flood-under-GC, blocking,
      # abort-under-load — all "ok"); what segfaulted was process EXIT after the
      # last test. Root cause: the abort path FREED a tsfn the instant `closing`
      # was observed, while foreign claimants still held claims and were about to
      # lock its (by then g_mutex_clear'd + freed) mutex — a use-after-free that
      # Linux/glibc tolerated (mutex-destroy is a no-op, freed bytes survive) but
      # macOS's pthread + allocator + exit-time dyld unload turned into a crash.
      # Fixed (tsfn.cc): the finalize/free is gated on thread_count == 0 — the
      # tsfn analog of async_work's join-before-free — so the struct is released
      # only once every claimant has drained its claim and no thread can touch it.
      # The team is Linux-only locally, so THIS macOS CI leg is the fix's proof.
      - name: Gate P1 — threadsafe functions (tsfn)
        working-directory: packages/napi/napi
        run: GI_TYPELIB_PATH="$PWD/build" DYLD_LIBRARY_PATH="$PWD/build" gjs test/p1-tsfn-gate.js

      # The env-teardown claim-attribution gate belongs on macOS in particular:
      # this is where freeing a tsfn under a live claim stopped being benign, and
      # the teardown path now hands the struct to its last claimant instead of
      # force-freeing it. The driver picks DYLD_LIBRARY_PATH itself on darwin.
      - name: Gate — tsfn env-teardown claim attribution
        working-directory: packages/napi/napi
        run: npm run test:gate:tsfn-teardown

      # Upload the staged darwin-arm64 prebuild (.dylib + .gir + .typelib) so a
      # release can ship prebuilds/darwin-arm64/ alongside linux-x64/.
      - name: Upload darwin-arm64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-prebuild-darwin-arm64
          path: packages/napi/napi/prebuilds/darwin-arm64
          if-no-files-found: error

  # Windows attempt (win32-x64) — EXPERIMENTAL, manual-dispatch only. UNLIKE the
  # macOS job (which ships), this job is expected to hit a documented wall and is
  # here to (a) prove how far the toolchain acquisition gets and (b) pinpoint the
  # exact remaining blocker on a real windows-latest runner. It runs ONLY on
  # workflow_dispatch (never on push/PR) so it can't red normal CI.
  #
  # THE WALL (re-checked 2026-07-25): the shim links GJS's SpiderMonkey
  # (mozjs-140) + libgjs. Two halves:
  #   • GObject/GI half (glib/gobject/gio/girepository + g-ir-compiler + pkgconf)
  #     — SOLVED: gvsbuild ships a prebuilt MSVC-ABI GTK4 bundle (reused verbatim
  #     from node-gi.yml's `windows` job).
  #   • mozjs-140 — NOW OBTAINABLE: servo/mozjs publishes a prebuilt
  #     libmozjs-x86_64-pc-windows-msvc archive at mozjs-sys v140.13.0 (ESR 140),
  #     the same mozjs major the Fedora/macOS jobs pin. This overturns the prior
  #     "no prebuilt MSVC mozjs-140 exists" conclusion — BUT it is servo's PATCHED
  #     fork in a Rust-crate static-lib layout, NOT a pkg-config `mozjs-140.pc` +
  #     shared lib that gjs's meson `dependency('mozjs-140')` consumes.
  #   • libgjs — the OPEN WALL: no prebuilt libgjs exists for Windows (gvsbuild
  #     has no gjs/spidermonkey project; conda-forge spidermonkey is 91 + skips
  #     win; MSYS2 mozjs/gjs are open unmerged requests #17734/#5699 and mingw-ABI
  #     anyway), and GNOME/gjs upstream CI is Linux-only (no Windows artifact).
  #     gjs's own README.MSVC.md requires building gjs from source with clang-cl
  #     against a mozjs-140 — experimental on Windows. This job attempts exactly
  #     that (against the servo prebuilt) and walls at the gjs `meson setup`.
  # Unblocks when: a prebuilt libgjs-win32 (a gvsbuild gjs/spidermonkey module or
  # a GNOME gjs Windows CI artifact) appears, OR gjs builds cleanly against the
  # servo/mozjs prebuilt (a pkg-config `mozjs-140.pc` shim + clang-cl gjs build).
  windows:
    name: Windows attempt (from-source gjs + mozjs-140 / windows-latest x64)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    env:
      # Same gvsbuild bundle + prefix node-gi.yml's `windows` job uses (shared
      # cache key) — the GObject/GI half the shim also links.
      GVSBUILD_VERSION: '2026.6.0'
      GTK_PREFIX: 'C:\gtk-build\gtk\x64\release'
      # servo/mozjs prebuilt SpiderMonkey (ESR 140), MSVC-ABI x86_64.
      MOZJS_TAG: 'mozjs-sys-v140.13.0-0'
      MOZJS_PREFIX: 'C:\mozjs-140'
      # A gjs release on the mozjs-140 line (matches the Fedora/macOS pin).
      GJS_REF: '1.88.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ---- GObject/GI half (SOLVED via gvsbuild) — verbatim from node-gi.yml ----
      - name: Cache gvsbuild GTK4 bundle
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk-build\gtk\x64\release
          key: gvsbuild-gtk4-${{ env.GVSBUILD_VERSION }}-x64-v1

      - name: Download + extract gvsbuild GTK4 (MSVC-ABI, girepository-2.0)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o gtk4.zip $url
          New-Item -ItemType Directory -Force -Path $env:GTK_PREFIX | Out-Null
          tar.exe -xf gtk4.zip -C $env:GTK_PREFIX
          Remove-Item gtk4.zip

      - name: Put GTK on PATH + set GI/PKG env
        shell: pwsh
        run: |
          "$env:GTK_PREFIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=$env:GTK_PREFIX\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GI_TYPELIB_PATH=$env:GTK_PREFIX\lib\girepository-1.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # gvsbuild omits ffi.h/ffitarget.h (GLib's girffi.h #includes ffi.h); supply
      # them from vcpkg's libffi — same fix node-gi.yml's `windows` job uses.
      - name: Supply libffi headers (gvsbuild omits ffi.h)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libffi:x64-windows
          $inc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"
          Copy-Item "$inc\ffi.h","$inc\ffitarget.h" -Destination "$env:GTK_PREFIX\include" -Force

      # ---- mozjs-140 half (NOW OBTAINABLE via servo/mozjs prebuilt) ----
      - name: Cache servo/mozjs prebuilt (mozjs-140 MSVC)
        id: cache-mozjs
        uses: actions/cache@v4
        with:
          path: C:\mozjs-140
          key: servo-mozjs-${{ env.MOZJS_TAG }}-x86_64-msvc-v1

      # Download + extract the servo/mozjs prebuilt and PRINT its layout so the CI
      # log documents exactly what ships (headers? static vs shared? any .pc?) —
      # the evidence behind the "mozjs-140 is obtainable, but as a Rust static-lib
      # layout not a pkg-config mozjs-140" finding.
      - name: Download + inspect servo/mozjs prebuilt (mozjs-140, x86_64-msvc)
        if: steps.cache-mozjs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/servo/mozjs/releases/download/$env:MOZJS_TAG/libmozjs-x86_64-pc-windows-msvc.tar.gz"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 -o mozjs.tar.gz $url
          New-Item -ItemType Directory -Force -Path $env:MOZJS_PREFIX | Out-Null
          tar.exe -xzf mozjs.tar.gz -C $env:MOZJS_PREFIX
          Remove-Item mozjs.tar.gz
          Write-Host "--- servo/mozjs prebuilt tree (top 3 levels) ---"
          Get-ChildItem -Recurse -Depth 2 $env:MOZJS_PREFIX | Select-Object -ExpandProperty FullName
          Write-Host "--- static/import libs ---"
          Get-ChildItem -Recurse $env:MOZJS_PREFIX -Include *.lib,*.a,*.dll | Select-Object -ExpandProperty FullName
          Write-Host "--- any pkg-config (.pc) shipped? (expected: none) ---"
          Get-ChildItem -Recurse $env:MOZJS_PREFIX -Include *.pc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      # ---- THE WALL: build gjs-on-Windows from source against the servo mozjs ----
      # This is the documented blocker. gjs's meson wants a pkg-config
      # `mozjs-140` (Requires-private nspr, a shared/usable libmozjs + the JSAPI
      # headers). We best-effort synthesize a `mozjs-140.pc` pointing at the servo
      # prebuilt and run gjs's `meson setup` — the step surfaces the EXACT gap
      # (mozjs-140 not found, or found-but-servo's-fork-mismatch, or a
      # gjs-on-Windows meson error). If configure ever passes, `meson compile`
      # runs. Expected to fail here; that failure IS the concrete wall.
      - name: Build gjs from source (clang-cl) against servo mozjs — EXPECTED WALL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pip install --quiet meson ninja
          git clone --depth 1 --branch $env:GJS_REF https://gitlab.gnome.org/GNOME/gjs.git gjs-src
          # Best-effort mozjs-140.pc over the servo prebuilt layout (paths printed
          # by the inspect step above). This is deliberately optimistic — servo's
          # fork is a Rust static-lib layout, so this is the point that reveals
          # whether gjs's meson can consume it at all.
          $pcDir = "$env:MOZJS_PREFIX\pkgconfig"
          New-Item -ItemType Directory -Force -Path $pcDir | Out-Null
          # Build the .pc as a string array (no PowerShell here-string — its `"@`
          # terminator must sit at column 0, impossible inside an indented YAML
          # run block). Single-quoted lines keep pkg-config's ${...} vars literal.
          $prefixFwd = $env:MOZJS_PREFIX -replace '\\','/'
          $pc = @(
            "prefix=$prefixFwd"
            'libdir=${prefix}/lib'
            'includedir=${prefix}/include'
            ''
            'Name: mozjs-140'
            'Description: SpiderMonkey 140 (servo/mozjs prebuilt, MSVC) - SYNTHESIZED'
            'Version: 140.13.0'
            'Libs: -L${libdir} -lmozjs-140'
            'Cflags: -I${includedir}'
          )
          $pc | Set-Content -Path "$pcDir\mozjs-140.pc" -Encoding ascii
          $env:PKG_CONFIG_PATH = "$pcDir;$env:GTK_PREFIX\lib\pkgconfig"
          Write-Host "mozjs-140 via pkg-config:"
          pkg-config --modversion mozjs-140
          # clang-cl toolchain per gjs README.MSVC.md.
          meson setup gjs-src gjs-build --prefix C:\gjs `
            -Dc_std=c11 -Dcpp_std=c++17 --buildtype release
          meson compile -C gjs-build
          meson install -C gjs-build
          "$env:GTK_PREFIX\bin;C:\gjs\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=C:\gjs\lib\pkgconfig;$pcDir;$env:GTK_PREFIX\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---- Post-wall: the shim build + gates (reached only if gjs built) ----
      # These document the intended completion path; they run only if the gjs
      # build above succeeded (default `if: success()`). The meson `windows`
      # branch (.def exports + gjsifynapi.dll leaf) + the module.cc `#ifdef
      # _WIN32` loader shims make this build possible once libgjs exists.
      - name: Build the @gjsify/napi shim (meson) + stage win32-x64 prebuild
        working-directory: packages/napi/napi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          meson setup build .
          meson compile -C build
          New-Item -ItemType Directory -Force -Path prebuilds/win32-x64 | Out-Null
          Copy-Item build/gjsifynapi.dll,build/GjsifyNapi-1.0.gir,build/GjsifyNapi-1.0.typelib prebuilds/win32-x64/
          Write-Host "staged: $(Get-ChildItem prebuilds/win32-x64 | Select-Object -ExpandProperty Name)"

      - name: Build gate test addons (node-gyp / MSVC)
        working-directory: packages/napi/napi
        run: npm run build:test-addons

      # Windows resolves the shim DLL via PATH (no LD_LIBRARY_PATH/DYLD_*); the
      # build dir carries gjsifynapi.dll, GI resolves the typelib via
      # GI_TYPELIB_PATH. Run the load + value-model gates (P1 tsfn deferred, as on
      # macOS).
      - name: Gate P0.0 — load (unmodified .node addon through the shim)
        working-directory: packages/napi/napi
        shell: pwsh
        run: |
          $env:GI_TYPELIB_PATH = "$PWD\build"
          $env:PATH = "$PWD\build;$env:PATH"
          gjs test/load-gate.js test/hello-addon/build/Release/hello.node

      - name: Gate P0.1 — env + value model + scopes
        working-directory: packages/napi/napi
        shell: pwsh
        run: |
          $env:GI_TYPELIB_PATH = "$PWD\build"
          $env:PATH = "$PWD\build;$env:PATH"
          gjs test/p01-gate.js

      - name: Gate P0.2 — objects + functions + classes
        working-directory: packages/napi/napi
        shell: pwsh
        run: |
          $env:GI_TYPELIB_PATH = "$PWD\build"
          $env:PATH = "$PWD\build;$env:PATH"
          gjs test/p02-gate.js

      - name: Gate P0.4 — arraybuffer / typedarray
        working-directory: packages/napi/napi
        shell: pwsh
        run: |
          $env:GI_TYPELIB_PATH = "$PWD\build"
          $env:PATH = "$PWD\build;$env:PATH"
          gjs test/p04-gate.js

      - name: Upload win32-x64 prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-prebuild-win32-x64
          path: packages/napi/napi/prebuilds/win32-x64
          if-no-files-found: error
