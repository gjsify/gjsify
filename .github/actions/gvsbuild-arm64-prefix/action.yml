name: gvsbuild arm64 GTK4 prefix
description: >
  Builds (or restores from cache) the win32-arm64 GTK4 prefix at
  C:\gtk-build\gtk\ARM64\release with our MSVC gvsbuild fork (ADR 0089). Upstream
  wingtk/gvsbuild publishes no arm64 ZIP, so unlike x64 there is nothing to download.
  Windows-on-ARM runner only. The caller must run actions/checkout first.

  THE FORK SHA BELOW IS THE ONLY PIN. It is a commit on the fork's default branch
  (gjsify/gvsbuild PR #1 merged), never a feature-branch head, and it is part of the
  cache key, so a bump rebuilds once. `gtk-runtime-bundle-gates.test.mjs` holds every
  fork pin in .github/ to the same value. Exit: when upstream gvsbuild ships arm64,
  switch to the `GVSBUILD_VERSION` pin and delete this action.

runs:
  using: composite
  steps:
    # The project list is the one the fork's own `Build GTK4 Binaries (ARM64)` job
    # proves green; it is in the cache key because changing it changes the prefix.
    - name: Restore the arm64 GTK4 prefix
      id: cache-gtk
      uses: actions/cache/restore@v4
      with:
        path: C:\gtk-build\gtk\ARM64\release
        key: gvsbuild-fork-b63cf45a87601a4c613d05a522dac0d167409aed-arm64-gtk4-libadwaita-gtksourceview5-gi-gstreamer-soup-vorbis-mf-v3

    - name: Set up Python
      if: steps.cache-gtk.outputs.cache-hit != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    # Cold build measured at 1 h 32 min on windows-11-arm (fork CI). `-j2` is the
    # fork's own out-of-memory guard for the hosted runner. Composite steps take
    # no `timeout-minutes`; the calling jobs bound it (240 min).
    - name: Build GTK4 from the gjsify/gvsbuild fork (MSVC, arm64)
      if: steps.cache-gtk.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        python -m pip install "git+https://github.com/gjsify/gvsbuild@b63cf45a87601a4c613d05a522dac0d167409aed"
        if ($LASTEXITCODE -ne 0) { throw "pip install of the gvsbuild fork exited $LASTEXITCODE" }
        # gvsbuild spells VS versions vs2022 / vs2026, not the major; same explicit
        # map as node-gi.yml's windowing bundle job, an unknown major is an error.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsMajor = (& $vswhere -latest -property installationVersion).Split('.')[0]
        $vsVer = switch ($vsMajor) {
          '17' { 'vs2022' }
          '18' { 'vs2026' }
          default { throw "unmapped Visual Studio major '$vsMajor' — add it here (gvsbuild spells these vs2022 / vs2026)" }
        }
        Write-Host "Visual Studio $vsMajor -> gvsbuild --vs-ver $vsVer"
        # TWO PASSES, AND THE ORDER IS THE POINT — the x64 leg (release.yml, "Build GStreamer with
        # gvsbuild") records why. gst-plugins-good's `soup` and gst-plugins-base's `vorbis` are
        # meson `auto` features whose libraries gvsbuild does not declare as dependencies, so a
        # build that reaches them first is green and has no gstsoup.dll / gstvorbis.dll in it (#1117).
        # Pass 1 therefore builds the libraries (+ the GIO TLS backend libsoup3 pulls in), pass 2 the
        # plugins with `soup`/`vorbis` pinned to `enabled`, so a miss is a configure error naming the
        # library. `--fast-build` keeps pass 2 from rebuilding what pass 1 already marked built.
        # libvorbis needs no CMake-policy flag here: the fork's project already passes it.
        gvsbuild build --ninja-opts -j2 --enable-gi --vs-ver $vsVer --platform arm64 gtk4 libadwaita gtksourceview5 gobject-introspection glib-networking libsoup3 libvorbis
        if ($LASTEXITCODE -ne 0) { throw "gvsbuild (arm64): the GTK4/libsoup3/libvorbis pass exited $LASTEXITCODE" }
        # `gst-plugins-bad` is here for ONE plugin: `mediafoundation` (mfmp3dec/mfaacdec wrap the
        # decoders Windows ships — the bundle's only MP3/AAC route, ADR 0056 § 7), and the arm64
        # manifest claims it like the x64 one. `--auto-features=disabled` keeps the other ~100 bad
        # plugins out of the build; the `--skip`s are bad's (and good's libvpx) declared
        # dependencies that only WebRTC/VP8 plugins use, which that flag has switched off.
        gvsbuild build --fast-build --ninja-opts -j2 --enable-gi --vs-ver $vsVer --platform arm64 --skip libvpx --skip libnice --skip libsrtp2 --skip webrtc-audio-processing --extra-opts 'gst-plugins-base:-Dvorbis=enabled' --extra-opts 'gst-plugins-good:-Dsoup=enabled' --extra-opts 'gst-plugins-bad:--auto-features=disabled;-Dmediafoundation=enabled' gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad
        if ($LASTEXITCODE -ne 0) { throw "gvsbuild (arm64): the GStreamer pass exited $LASTEXITCODE" }

    - name: Assert the prefix is complete
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $p = 'C:\gtk-build\gtk\ARM64\release'
        foreach ($f in @('bin\glib-2.0-0.dll', 'lib\girepository-1.0\Gtk-4.0.typelib', 'include\ffi.h', 'bin\intl.dll')) {
          if (-not (Test-Path "$p\$f")) { Write-Host "MISSING $p\$f"; exit 1 }
        }
        # NAMED, not counted: the arm64 bundle manifest CLAIMS these formats, and the bundle builder
        # (build-gtk-runtime-win32.mjs) fails on a claimed plugin the prefix lacks — which, caught
        # there, is a release job after a 1.5 h build (v0.64.7). Same list as the x64 prefix check.
        foreach ($leaf in @('gstsoup.dll', 'gstvorbis.dll', 'gstmediafoundation.dll', 'gsticydemux.dll', 'gstid3demux.dll')) {
          if (-not (Test-Path "$p\lib\gstreamer-1.0\$leaf")) { Write-Host "MISSING $p\lib\gstreamer-1.0\$leaf"; exit 1 }
        }
        if (-not (Get-ChildItem "$p\lib\gio\modules" -Filter *.dll -ErrorAction SilentlyContinue)) { Write-Host "no GIO module in the prefix — glib-networking did not build"; exit 1 }
        # Without GNU gettext's intl.dll, glib silently falls back to proxy-libintl (intl-8.dll),
        # whose bindtextdomain answers "/dummy" and never translates.
        Write-Host "arm64 prefix present (cache hit: ${{ steps.cache-gtk.outputs.cache-hit }})"

    # Saved HERE, not by actions/cache's post step: that one only runs when the whole job
    # succeeds, so a failure in any later step threw away a 1.5 h build (run 37047489401).
    - name: Save the arm64 GTK4 prefix
      if: steps.cache-gtk.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: C:\gtk-build\gtk\ARM64\release
        key: gvsbuild-fork-b63cf45a87601a4c613d05a522dac0d167409aed-arm64-gtk4-libadwaita-gtksourceview5-gi-gstreamer-soup-vorbis-mf-v3
