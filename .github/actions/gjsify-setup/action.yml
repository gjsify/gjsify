name: gjsify CI setup
description: >
  Shared setup for every gjsify CI job (build / test / e2e / examples): boots the
  prebuilt Fedora image's prerequisites, sets up Node + corepack, restores the
  node_modules + build-output caches, creates the non-root test user, runs the
  Node-free install, and (on request) restores the GJS bootstrap bundles the
  `build` job publishes as a run artifact. Encapsulated as a
  composite action because GitHub Actions has no other way to share a step
  sequence across parallel jobs (no YAML anchors). The calling job MUST run
  `actions/checkout` first — a local composite action can only be resolved once
  the repo (incl. this file) is on disk.


  The calling job must NOT declare `container.credentials`. The
  `ghcr.io/gjsify/ci-fedora` image is public and is pulled anonymously, which
  is what gives fork pull requests any CI at all: a fork's `GITHUB_TOKEN`
  cannot authenticate against the org's package registry, so a `credentials:`
  block makes every container job fail before its first step for exactly the
  contributors who most need the feedback.


  The calling job MUST ALSO declare `container.options: --ulimit
  nofile=1048576:1048576`. "Create non-root user" below raises testuser's
  `nofile` in `/etc/security/limits.conf`, and `pam_limits` refuses to open a
  session asking for more than the container's HARD limit — every later
  `su testuser -c` then fails with the opaque `su: cannot open session:
  Permission denied` before running a single command.

inputs:
  fedora-version:
    description: Fedora major (43/44) — scopes the per-major build-output cache.
    required: true
  node-version:
    description: Node version for actions/setup-node.
    required: false
    default: 26.x
  bootstrap-bundles:
    description: >
      Download the `bootstrap-bundles-fedora<v>` artifact the `build` job
      publishes, restoring `packages/infra/{cli,tsc}/dist/*.gjs.mjs`. Set it on
      any job that BOOTS one of those bundles — since ADR 0002 untracked them, a
      checkout no longer carries them. Requires a job that `needs: build`.
    required: false
    default: 'false'

outputs:
  build-cache-key:
    description: >
      The build-output cache's PRIMARY key. The `build` job needs it to SAVE the
      cache itself — this action only RESTORES (see the restore step's comment).
    value: ${{ steps.build-cache.outputs.cache-primary-key }}
  build-cache-hit:
    description: >
      'true' when the primary key matched EXACTLY. The saver must skip on a
      true here: `actions/cache/save` cannot overwrite an existing key.
    value: ${{ steps.build-cache.outputs.cache-hit }}
  build-cache-paths:
    description: >
      The cached path list, so the `build` job's save step uses the SAME set
      without a second copy of it. `cache/save` requires its own `path` input
      and two literal copies WOULD drift; this output is the one source.
    value: ${{ steps.build-cache-paths.outputs.paths }}
  bootstrap-bundle:
    description: >
      Path to the verified, content-addressed PUBLISHED `cli.gjs.mjs` that
      `install.mjs --fetch-only` cached. Also exported as `GJSIFY_BOOTSTRAP`
      for every later step in the job — a building job needs it because the
      `node_modules/.bin` shim only works once `packages/infra/cli/lib/` or
      `dist/cli.gjs.mjs` exists, and since ADR 0002 neither is in a checkout.
    value: ${{ steps.install.outputs.bootstrap-bundle }}

runs:
  using: composite
  steps:
    - name: Verify prebuilt CI image
      # The image bakes /etc/gjsify-ci-fedora-version. Its presence confirms we
      # booted the prebuilt ghcr.io/gjsify/ci-fedora image and not a bare
      # fallback. Non-fatal — a missing package fails a later step anyway.
      shell: bash
      run: |
        if [ -f /etc/gjsify-ci-fedora-version ]; then
          echo "Prebuilt CI image OK (Fedora $(cat /etc/gjsify-ci-fedora-version))"
        else
          echo "::warning::/etc/gjsify-ci-fedora-version missing — not the prebuilt ci-fedora image; dnf packages may be absent."
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    # GJS / GNOME devel libs + Meson / Vala / Blueprint are baked into the
    # prebuilt image (.docker/ci-fedora.Dockerfile) — no per-job dnf install.

    - name: Enable corepack (yarn shim for PnP e2e suite)
      # tests/e2e/{cli-only-pnp,pnp-zip-static-reads}/ hard-require yarn (>= 4 via
      # corepack's packageManager field). Node >= 25 UNBUNDLED corepack.
      shell: bash
      run: |
        npm install -g corepack
        corepack enable

    # Persistent node_modules cache. The native install backend is idempotent
    # (isAlreadyExtracted skips any package already matching the lockfile), so a
    # warm node_modules turns the ~16 min extract phase into a near-instant no-op.
    # OS-independent → one entry shared across both Fedora legs. MUST run before
    # "Create non-root user" so the chown -R hands the restored tree to testuser.
    - name: Cache node_modules
      uses: actions/cache@v6
      with:
        # The per-package build cache under node_modules/.cache/gjsify/build
        # is persisted by the build job's own restore/save pair (main.yml,
        # ADR 0006) — exclude it here so the two caches don't double-store.
        path: |
          node_modules
          !node_modules/.cache/gjsify/build
          packages/*/*/node_modules
        # EXACT KEY ONLY — no `restore-keys` fallback, deliberately.
        #
        # There used to be a `node-modules-v1-` prefix fallback, and it cost a day.
        # gjsify#1683 bumped @girs; an early run of that PR genuinely nested
        # node_modules/@girs/gtk-4.0/node_modules/@girs/graphene-1.0 and saved the
        # tree. The fix push changed the lockfile → new key → miss → the FALLBACK
        # handed the job a tree built for a DIFFERENT lockfile. `gjsify install
        # --immutable` added what was missing and removed nothing, so the nesting
        # survived and tsc reported TS2883, one type with two identities — against a
        # path the lockfile never contains. The still-nested tree was then saved
        # under the NEW key, so no plain re-run could go green: the failure
        # reproduced itself until the caches were deleted by hand.
        #
        # `--immutable` now REFUSES an undescribed tree by name rather than
        # installing over it (packages/infra/cli/src/utils/install-extraneous.ts), so
        # a restored foreign tree is no longer silent — it is a hard, immediate
        # failure. Keeping the fallback would therefore turn every lockfile-changing
        # PR red. An exact key hit is a tree built from THIS lockfile, which is the
        # only tree `--immutable` can accept.
        #
        # THE PRICE, stated honestly. Every lockfile-changing PR now pays a fully
        # cold install in EVERY job that uses this action: the ~16 min extract phase
        # above, plus re-DOWNLOADING all ~1850 tarballs. Not extract-only — the
        # content-addressed install cache lives in `.gjsify-cache/`, which this step
        # `mkdir -p`s fresh each run and which NO actions/cache path covers, so it
        # never survives a run. (On a developer's machine XDG_CACHE_HOME does
        # persist, so there the same miss really is extract-only. CI is the
        # different case.) The old fallback bought a warm baseline and paid for the
        # delta only; that is what is being given up, and it is worth more than one
        # extract.
        #
        # That download half is bought back by the tarball store cached two steps
        # below, which DOES carry a prefix fallback. The two blocks sit next to each
        # other with OPPOSITE fallback policies on purpose; read that step's comment
        # before touching either. The asymmetry is the point, not an oversight.
        key: node-modules-v1-${{ hashFiles('gjsify-lock.json') }}

    # The content-addressed TARBALL store — the half of a cold install that is
    # network, not CPU. This is what buys back the download the step above gives up,
    # and it is why dropping `restore-keys` there costs an extract rather than a
    # re-download of the whole closure.
    #
    # THIS ONE CARRIES A PREFIX FALLBACK, AND THE STEP ABOVE MUST NOT. That is not an
    # inconsistency to tidy up — it is the distinction the #1683 incident turned on,
    # so read this before "fixing" either.
    #
    #   A node_modules TREE encodes a RESOLUTION DECISION: which version was hoisted
    #   where, for one specific lockfile. Restore it under a different lockfile and
    #   the decision is silently wrong — a nested @girs/graphene-1.0 that the new
    #   lockfile never placed, surviving an install that only ever adds. That is the
    #   whole incident.
    #
    #   This store holds BLOBS keyed BY THEIR OWN HASH:
    #   `<sri-alg>/<2-hex shard>/<64-hex>.tgz` (install-tarball-cache.ts `pathFor`).
    #   The path IS the digest of the bytes, so a stale store can only ever be a
    #   subset or a superset of the blobs wanted — never a wrong answer to a right
    #   name. A blob cannot masquerade as another blob without a hash collision, and
    #   the reader verifies integrity on top. There is no decision here to invalidate,
    #   which is exactly why a fallback is sound for this and fatal for that.
    #
    # THE KEY. Coarse on purpose. Keying the store to the lockfile hash ALONE would
    # defeat it, since surviving a lockfile change is the entire value — so the value
    # comes from `restore-keys`, which hands any lockfile the newest store there is.
    # The exact key exists only to decide when to SAVE: a new entry is written once
    # per distinct lockfile (when the store has actually gained blobs), not once per
    # run, which is what keeps this from minting a fresh ~420 MB entry on every push.
    # `v1` mirrors `CACHE_LAYOUT_VERSION` in install-tarball-cache.ts — bump together.
    - name: Restore the tarball store
      id: tarballs
      uses: actions/cache/restore@v6
      with:
        path: .gjsify-cache/gjsify/tarballs
        key: gjsify-tarballs-v1-${{ hashFiles('gjsify-lock.json') }}
        restore-keys: |
          gjsify-tarballs-v1-

    - name: Create non-root user for tests
      shell: bash
      run: |
        useradd -m testuser
        # Raise testuser's open-file limit via PAM — `su testuser -c` resets the
        # soft nofile limit back to the login default, undoing the container's
        # --ulimit. Applied by pam_limits on every `su testuser`.
        echo "testuser - nofile 1048576" >> /etc/security/limits.conf
        # Pre-create the (possibly cache-restored) gjsify cache dir so the chown
        # below hands it to testuser for the install step.
        mkdir -p .gjsify-cache
        chown -R testuser:testuser .

    # Node-free install via the PUBLISHED gjsify (ADR 0002) — exactly what a
    # developer with only gjs on their machine does, rather than a second path
    # invented for CI. `install.mjs` fetches the release asset, hard-fails on a
    # missing `.sha256`, verifies it and content-addresses the cache; the
    # `--fetch-only` mode hands back that verified path so this does not grow a
    # `curl` + `sha256sum` copy of logic that already exists here.
    #
    # `latest`, deliberately not a pin: pinning insures against one thing — a
    # broken release blocking CI — which already has a one-line escape hatch
    # (`--bootstrap-url` / GJSIFY_INSTALL_BOOTSTRAP_URL), so it can be added the
    # moment it bites instead of carrying a pin file and a staleness check for a
    # hypothetical. What keeps `latest` safe is the reader-lead check in
    # `audit-runtimes.yml`: the published CLI must be able to read this repo's
    # lockfile format.
    #
    # Both commands run AS testuser against the workspace-local cache, so the
    # fetch writes where the install reads — root's `~/.cache` is not readable
    # by testuser, and a bootstrap fetched there would be re-downloaded (or fail)
    # at the point of use.
    #
    # Warm node_modules cache hit → near-instant no-op; miss → extract the delta.
    #
    # The verified path is published as `GJSIFY_BOOTSTRAP` for the rest of the
    # job. Since ADR 0002 untracked `dist/cli.gjs.mjs`, a tree that has been
    # INSTALLED but not yet BUILT has no runnable `gjsify` at all — the
    # `node_modules/.bin` shim dispatches to `dist/cli.gjs.mjs` or to
    # `packages/infra/cli/lib/index.js` and both are build outputs. This is the
    # one CLI such a job can reach, and `scripts/resolve-gjsify.mjs` reads the
    # same variable as its last rung so repo scripts inherit it.
    - name: Install dependencies (gjsify install --immutable)
      id: install
      shell: bash
      run: |
        B=$(su testuser -c "XDG_CACHE_HOME='$PWD/.gjsify-cache' gjs -m install.mjs --fetch-only")
        su testuser -c "XDG_CACHE_HOME='$PWD/.gjsify-cache' gjs -m '$B' install --immutable"
        echo "GJSIFY_BOOTSTRAP=$B" >> "$GITHUB_ENV"
        echo "bootstrap-bundle=$B" >> "$GITHUB_OUTPUT"

    # Counting blobs is the only way to tell a WARM store from a fresh directory:
    # `cache-hit` reports the KEY, not the contents, and cannot distinguish them.
    #
    # The `-d` test and the `|| true` are load-bearing, not defensive clutter. Every
    # composite step runs under `bash -e -o pipefail`, and a MISSING store directory
    # is the normal case this step exists to detect — an exact node_modules hit means
    # the install downloads nothing, so `.gjsify-cache/gjsify/tarballs` is never
    # created. `find` on a path that does not exist exits 1; `pipefail` promotes that
    # over `wc`'s 0, `-e` then kills the step, and the count never runs. That is
    # exactly how this failed the docs job on its first green-path run: exit 1 in
    # 55 ms, before printing a single line. Do not "simplify" it back to a bare
    # pipeline — verify any edit with `bash --noprofile --norc -e -o pipefail` against
    # a directory that is ABSENT, not merely empty.
    - name: Count the tarball store
      id: tarball-store
      shell: bash
      run: |
        n=0
        if [ -d .gjsify-cache/gjsify/tarballs ]; then
          n=$(find .gjsify-cache/gjsify/tarballs -type f -name '*.tgz' 2>/dev/null | wc -l || true)
        fi
        echo "blobs=$n" >> "$GITHUB_OUTPUT"
        echo "tarball store holds $n blob(s)"

    # Save the grown store under the EXACT key, so the next lockfile's fallback finds
    # a newer superset than the one this job restored.
    #
    # The emptiness guard closes a real self-inflicted miss rather than being
    # defensive noise: on an exact node_modules hit the install downloads NOTHING, so
    # if no store was restored the directory is still the empty one `mkdir -p` made.
    # Saving that would publish an empty store as the newest entry, and `restore-keys`
    # would hand it to every later lockfile — a cache that exists, hits, and carries
    # nothing, which is strictly worse than no cache because it looks healthy.
    #
    # Concurrent savers are expected and benign: every job on a new lockfile misses
    # the same key, one wins the reservation and the rest log "Unable to reserve
    # cache" and move on. They would all have written identical content.
    #
    # NOT SOLVED, worth knowing: this store only GROWS. Nothing prunes a blob whose
    # package left the dependency graph, and each save re-uploads the whole grown
    # store, so the entry drifts upward from the ~420 MB this repo's Linux closure
    # measures today. GitHub's 10 GB repo budget evicts least-recently-used, which
    # happens to be the right order here — the newest store is the one the fallback
    # wants, and an evicted old one costs a one-time re-download, not a wrong answer.
    # That makes growth a cost rather than a correctness problem, which is why it is
    # left standing; a TTL or a lockfile-driven sweep is the fix if it ever bites.
    - name: Save the tarball store
      if: steps.tarballs.outputs.cache-hit != 'true' && steps.tarball-store.outputs.blobs != '0'
      uses: actions/cache/save@v6
      with:
        path: .gjsify-cache/gjsify/tarballs
        key: ${{ steps.tarballs.outputs.cache-primary-key }}

    # The cached path set, defined ONCE. The `build` job's explicit save step
    # needs the identical list and `actions/cache/save` takes its own `path`
    # input, so a second literal copy would silently drift the day one side is
    # edited. Emitting it as a step output makes the restore and the save read
    # the same value.
    - name: Resolve build-output cache paths
      id: build-cache-paths
      shell: bash
      run: |
        {
          echo 'paths<<GJSIFY_CACHE_PATHS_EOF'
          cat <<'PATHS'
        packages/*/*/lib
        !packages/infra/tsc/lib
        !packages/infra/resolve-npm/lib
        !packages/infra/manifest-conformance/lib
        packages/*/*/tsconfig.tsbuildinfo
        packages/*/*/tsconfig.*.tsbuildinfo
        packages/*/*/dist
        packages/*/*/dist-templates
        !packages/infra/cli/dist/cli.gjs.mjs
        !packages/infra/cli/dist/affected.gjs.mjs
        !packages/infra/tsc/dist/tsc.gjs.mjs
        PATHS
          echo 'GJSIFY_CACHE_PATHS_EOF'
        } >> "$GITHUB_OUTPUT"

    # RESTORE ONLY — this action must never SAVE the build-output cache.
    #
    # `actions/cache` registers a post-job save in EVERY job that uses it, and
    # this composite is used by six of them plus `deploy-docs.yml`. Whichever
    # finishes first wins the reservation, and the rest get "Unable to reserve
    # cache … another job may be creating this cache". `deploy-docs` builds only
    # the website and finishes in ~2 min, so it beat the ~22 min `build` job
    # EVERY time: the build-output cache has essentially never contained a full
    # build. It held a website-shaped tree of ~4.5 MB — which is why
    # `@gjsify/xmlhttprequest`'s `lib/types` was missing from it, why the
    # completeness probe fires, and why selective builds ran on a junk baseline.
    #
    # So exactly ONE job writes this cache: `build`, via an explicit
    # `actions/cache/save` placed AFTER `Verify declared package outputs exist`.
    # That gives two properties a post-job save cannot: only the job that has a
    # complete tree can write, and it only writes a tree it has PROVEN complete
    # (the automatic save runs even when the job FAILED, so a half-built tree
    # would otherwise be published under a fresh key).
    #
    # The three `!` excludes below stay after ADR 0002, for two different
    # reasons — do not "tidy" them as leftovers:
    #   • `affected.gjs.mjs` is still COMMITTED; caching it would let a
    #     restore-key fallback shadow the checkout.
    #   • `cli.gjs.mjs` / `tsc.gjs.mjs` are no longer committed, but the cache is
    #     still the wrong transport for them: its key hashes
    #     `packages/*/*/src/**/*.ts`, while `cli.gjs.mjs` inlines
    #     `packages/infra/resolve-npm/lib/*.mjs` — tracked source that is not
    #     under `src/**` and not in the key, so two revisions differing only
    #     there share a key. That is incident #821. They travel as the
    #     `bootstrap-bundles-fedora<v>` run artifact instead.
    # They are kept as DOCUMENTATION of that intent, not as enforcement: a `!`
    # on a file cannot subtract from `packages/*/*/dist`, which matches the
    # DIRECTORY and is archived whole. `Drop cache-restored toolchain bundles`
    # below is what actually holds the line — see its comment for the incident.
    - name: Restore build output (lib/ + tsbuildinfo)
      id: build-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.build-cache-paths.outputs.paths }}
        # v3 added packages/*/*/dist-templates (create-gjsify's processed templates).
        #
        # v4 is an INCOMPATIBLE-PAYLOAD bump, which is what the version segment is for.
        # ADR 0063 removed the published `./resolve` subpath of
        # `@gjsify/vite-plugin-blueprint`, and every v3 archive holds a
        # `packages/infra/cli/lib` built while the CLI still imported it. Restored over a
        # checkout whose `package.json` no longer exports it, that `lib/` cannot be LOADED
        # at all: `ERR_PACKAGE_PATH_NOT_EXPORTED` from `check-system-deps.js`, which bricks
        # the very CLI the bootstrap step uses to rebuild it. Measured on run 35466252963
        # (`Build Fedora 44`) and 35466252957 (`Build Documentation`), both reached through
        # the un-hashed third restore-key. The v2/v3 fallbacks are NOT carried over: a warm
        # baseline that can only come from a poisoned archive is the defect, not a saving.
        #
        # The bare fedora-scoped restore-key stays for v4 — it is a real warm-start win.
        # What makes it safe is the step below, which drops the CLI's `lib/` whenever the
        # archive came from that key, so a manifest-mismatched payload costs a cold
        # bootstrap rather than a red run nobody can read.
        key: build-v4-${{ runner.os }}-fedora${{ inputs.fedora-version }}-${{ hashFiles('gjsify-lock.json', 'package.json', 'packages/*/*/tsconfig*.json', 'packages/*/*/package.json') }}-${{ hashFiles('packages/*/*/src/**/*.ts', 'packages/*/*/src/**/*.mts', 'packages/*/*/src/**/*.cts') }}
        restore-keys: |
          build-v4-${{ runner.os }}-fedora${{ inputs.fedora-version }}-${{ hashFiles('gjsify-lock.json', 'package.json', 'packages/*/*/tsconfig*.json', 'packages/*/*/package.json') }}-
          build-v4-${{ runner.os }}-fedora${{ inputs.fedora-version }}-

    # WHICH KEY MATCHED DECIDES WHETHER `cli/lib` CAN BE TRUSTED TO RUN THE BUILD.
    #
    # The primary key and the first restore-key both carry the manifest hash over
    # `packages/*/*/package.json`, so an archive reached through either agrees with this
    # tree about every `exports` map. The bare fedora-scoped key carries no such hash, and
    # an archive reached through IT can hold a `packages/infra/cli/lib` built against a
    # different export surface. That is not a stale-output nuisance: the `.bin` shim
    # dispatches to that `lib/`, so an import it can no longer resolve bricks the CLI the
    # bootstrap step uses to rebuild it. ADR 0063 removed `@gjsify/vite-plugin-blueprint`'s
    # `./resolve`, and `Build Fedora 44` (run 35466252963) and `Build Documentation`
    # (35466252957) both died on `ERR_PACKAGE_PATH_NOT_EXPORTED` from
    # `cli/lib/utils/check-system-deps.js` before a single package was built.
    #
    # NOT a load probe, which was tried and measured USELESS here: `gjsify --version`
    # returns 0 on exactly this broken tree because the CLI loads subcommand modules
    # lazily and never reaches `check-system-deps.js` on that path. A probe that passes on
    # the failing case is worse than none. The key that matched is the honest signal, and
    # it is known before anything is executed.
    #
    # Dropping only `cli/lib` and not the whole archive is deliberate: every other
    # package's `lib/` is rebuilt by the build steps and cannot brick the tool doing the
    # rebuilding. The existing `-f packages/infra/cli/lib/index.js` tests in `main.yml`
    # and `deploy-docs.yml` then take their cold branch, which is the behaviour they were
    # written for.
    - name: Drop a cache-restored CLI lib that no manifest hash vouches for
      shell: bash
      env:
        MATCHED: ${{ steps.build-cache.outputs.cache-matched-key }}
        PRIMARY: ${{ steps.build-cache.outputs.cache-primary-key }}
        EXACT: ${{ steps.build-cache.outputs.cache-hit }}
      run: |
        # SELF-TEST, because this step's whole behaviour rests on an output name that
        # cannot be verified anywhere but here: an empty `cache-matched-key` is
        # indistinguishable from "no cache restored", so a typo would turn this guard into
        # a silent no-op and the failure it prevents would come back looking new. On an
        # exact hit the two keys are equal BY DEFINITION, so that case proves the wiring.
        if [ "$EXACT" = "true" ] && [ "$MATCHED" != "$PRIMARY" ]; then
          echo "::error::cache-hit=true but cache-matched-key ('$MATCHED') is not cache-primary-key."
          echo "The restore action's outputs are not what this step reads. Fix the names before trusting it."
          exit 1
        fi
        if [ -z "$MATCHED" ]; then
          echo "No build-output cache was restored — nothing to drop."
          exit 0
        fi
        # The primary key is <prefix>-<src-hash>; <prefix>- is exactly the manifest-scoped
        # restore-key, and the src hash carries no dashes, so stripping the last segment
        # reconstructs it without a second copy of the hashFiles expression.
        SAFE_PREFIX="${PRIMARY%-*}-"
        case "$MATCHED" in
          "$SAFE_PREFIX"*)
            echo "Build cache matched a manifest-scoped key — cli/lib agrees with this tree's exports."
            ;;
          *)
            echo "::warning::Build cache matched \"$MATCHED\", which carries no manifest hash."
            echo "Dropping packages/infra/cli/lib so the bootstrap rebuilds it from source."
            # The tsbuildinfo goes WITH it. `tsc` treats a surviving one as proof the
            # outputs are current, so deleting the tree alone makes the next build exit 0
            # having emitted nothing (#67) — the `lib/` would simply stay missing, which is
            # a worse failure than the one this step exists to prevent.
            # `find -delete` rather than a shell glob: an unmatched `*.tsbuildinfo` is
            # passed through literally by bash (and swallowed by `rm -f`) but ABORTS the
            # whole command under zsh's `nomatch`. Measured both ways — the zsh run left
            # `lib/` in place while reporting only the glob. This step declares bash, so
            # that is latent rather than live, and latent is exactly how it gets found the
            # hard way later.
            rm -rf packages/infra/cli/lib
            find packages/infra/cli -maxdepth 1 -name '*.tsbuildinfo' -delete
            ;;
        esac

    # @gjsify/resolve-npm is a no-build package; its lib/*.mjs are TRACKED SOURCE.
    # A restore-key fallback can extract an OLD archive whose stale resolve-npm/lib
    # shadows the checkout — re-checkout just that dir from HEAD.
    #
    # `packages/infra/cli/dist` stays in the list for `affected.gjs.mjs`, which
    # ADR 0002 kept committed and which lives under a CACHED path
    # (`packages/*/*/dist`). The `!` excludes above are the first line of
    # defence, but they only help for entries someone remembered to list —
    # `affected.gjs.mjs` was the one missed, so every job restored a stale copy
    # over the checkout and ran it, and nothing could see it. Re-checking out
    # from HEAD is exhaustive by construction: it covers any tracked file under
    # those dirs, including ones added later.
    #
    # `packages/infra/tsc/dist` left the list with ADR 0002 — nothing tracked
    # lives there any more, and `git checkout HEAD --` on a path with no tracked
    # content is an error, not a no-op. `tsc/lib` is NOT added in its place:
    # those libs are regenerated by the verify step, which runs after this.
    - name: Re-assert committed sources over the build cache
      shell: bash
      run: |
        # Explicit paths, not a word-split variable — the latter behaves
        # differently across shells and this must not depend on that.
        chown -R testuser:testuser \
          packages/infra/resolve-npm/lib packages/infra/manifest-conformance/lib packages/infra/cli/dist
        # Report BEFORE repairing — after the checkout the tree is clean by
        # construction, so a check placed after it could never fire.
        SHADOWED=$(su testuser -c "git -c safe.directory='*' diff --name-only HEAD -- \
          packages/infra/resolve-npm/lib packages/infra/manifest-conformance/lib packages/infra/cli/dist")
        su testuser -c "git -c safe.directory='*' checkout HEAD -- \
          packages/infra/resolve-npm/lib packages/infra/manifest-conformance/lib packages/infra/cli/dist"
        if [ -n "$SHADOWED" ]; then
          echo "::warning::The build cache shadowed tracked file(s); restored from HEAD. Add them to the cache excludes:"
          echo "$SHADOWED"
        else
          echo "Tracked build outputs match the checkout."
        fi

    # The UNTRACKED half of the same repair, and the reason the `!` excludes on
    # the cache path list cannot do it.
    #
    # `actions/cache` expands `packages/*/*/dist` to DIRECTORIES, and tar then
    # archives each one whole — so `!packages/infra/cli/dist/cli.gjs.mjs` and
    # `!packages/infra/tsc/dist/tsc.gjs.mjs` remove nothing, and every archive
    # carries both bundles. Measured on PR #1225: a `build-v3` archive from
    # 2026-08-17 restored a **0.40.0** `cli.gjs.mjs` into a 0.41.0 tree, and
    # `node_modules/.bin/gjsify` PREFERS `dist/cli.gjs.mjs` over `lib/index.js`
    # whenever `gjs` exists — so every job ran a CLI one release old. Its
    # `gjsify tsc` never exited under GJS, which parked `build:infra` until the
    # job timeout: 60 min in `deploy-docs`, 3 h in `Build Fedora 44`, with the
    # last log line being whatever the previous clause printed. Three separate
    # pushes hung identically while `main` stayed green, because `main`'s own
    # builds keep rewriting the bundle they cache.
    #
    # `git clean` rather than an `rm -f` list, for the reason the step above
    # re-checks-out a DIRECTORY: it is exhaustive by construction. It removes
    # every ignored/untracked file under these two dirs — including one added
    # later that nobody remembered to list — and cannot touch `affected.gjs.mjs`,
    # which is tracked. Jobs that legitimately need the bundles take them from
    # the `bootstrap-bundles-fedora<v>` artifact, downloaded by the NEXT step;
    # the rest fall back to `lib/index.js` under Node, which is the documented
    # path for a tree that has been installed but not yet built.
    - name: Drop cache-restored toolchain bundles
      shell: bash
      run: |
        REMOVED=$(su testuser -c "git -c safe.directory='*' clean -fdx --dry-run -- \
          packages/infra/cli/dist packages/infra/tsc/dist")
        su testuser -c "git -c safe.directory='*' clean -fdx -- \
          packages/infra/cli/dist packages/infra/tsc/dist" >/dev/null
        if [ -n "$REMOVED" ]; then
          echo "Dropped cache-restored bundle(s) — the build cache is not their transport:"
          echo "$REMOVED"
        else
          echo "No cache-restored toolchain bundles to drop."
        fi

    # ONE download block, not one per calling job. Deliberately AFTER the
    # re-assert above: that step restores tracked paths from HEAD, so running
    # first would let it overwrite the artifact. Last writer wins, and the
    # artifact has to be it — it is the only source of these two files once
    # they leave git.
    # `path: packages/infra` is NOT arbitrary. `upload-artifact` roots the
    # archive at the LEAST COMMON ANCESTOR of the paths it was given, and the
    # producer uploads `packages/infra/cli/dist/cli.gjs.mjs` +
    # `packages/infra/tsc/dist/tsc.gjs.mjs` — so the archive holds
    # `cli/dist/…` and `tsc/dist/…`, and extracting to `.` would put them at
    # `./cli/dist/…`. (The `example-dist-fedora*` pair works with no `path:`
    # for the same rule read the other way: `showcases/` and `examples/` are
    # siblings at the repo root, so their LCA IS the root.)
    #
    # Because that coupling is invisible from either side, the next step
    # ASSERTS the files landed rather than trusting it — add a path outside
    # `packages/infra` to the upload and this fails loudly instead of leaving
    # every downstream job booting a checkout that has no bundle.
    - name: Restore the GJS bootstrap bundles
      if: ${{ inputs.bootstrap-bundles == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: bootstrap-bundles-fedora${{ inputs.fedora-version }}
        path: packages/infra

    - name: Hand the restored bundles to testuser
      if: ${{ inputs.bootstrap-bundles == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        for f in packages/infra/cli/dist/cli.gjs.mjs packages/infra/tsc/dist/tsc.gjs.mjs; do
          if [ ! -f "$f" ]; then
            echo "::error::$f missing after download-artifact. The archive is rooted at the"
            echo "::error::least common ancestor of the producer's paths; if that moved, the"
            echo "::error::download's \`path:\` has to move with it (.github/workflows/main.yml)."
            find . -maxdepth 4 -name '*.gjs.mjs' -not -path './node_modules/*' | head -20
            exit 1
          fi
        done
        # `download-artifact` writes as root; every later step runs as testuser.
        chown -R testuser:testuser packages/infra/cli/dist packages/infra/tsc/dist
        # The CLI bundle is exec'd through a `gjsify.bin` launcher and by the
        # `.bin` shim's `gjs -m` — the artifact round-trip does not preserve the
        # mode, and a non-executable bundle fails as "command not found".
        chmod 0755 packages/infra/cli/dist/cli.gjs.mjs packages/infra/tsc/dist/tsc.gjs.mjs
