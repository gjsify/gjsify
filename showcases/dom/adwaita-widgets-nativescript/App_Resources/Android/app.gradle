// You can add your native dependencies here
dependencies {
//  implementation 'androidx.multidex:multidex:2.0.1'
}

android {
  compileSdkVersion 35
  buildToolsVersion "35"
  // ndkVersion ""

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 35

    // Version Information
    versionCode 1
    versionName "1.0.0"

    generatedDensities = []

    // Spike: build only the emulator's ABI to keep the APK small (the
    // @nativescript/canvas native libs ship 4 ABIs → ~218 MB otherwise).
    ndk {
      abiFilters "x86_64"
    }
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }
}
