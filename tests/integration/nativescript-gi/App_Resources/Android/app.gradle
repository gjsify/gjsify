// You can add your native dependencies here
dependencies {
//  implementation 'androidx.multidex:multidex:2.0.1'
}

android {
  compileSdkVersion 36
  buildToolsVersion "36"
  // ndkVersion ""

  defaultConfig {
    // 26 (Android 8.0) rather than 24: it costs 0.5 points of reach (96.6% → 96.1%)
    // and drops two years of legacy. NOT a prerequisite for edge-to-edge —
    // WindowInsetsCompat works down to 21 — the two just travel together.
    minSdkVersion 26
    // 36 because Play requires it for updates from 2026-08-31 and there is no reason
    // to sit on 35. Edge-to-edge is enforced from 35 either way, which is why the
    // inset work (#1128) was needed before this bump, not because of it.
    targetSdkVersion 36

    // Version Information
    versionCode 1
    versionName "1.0.0"

    generatedDensities = []

    // BOTH ABIs the plugin carries, and no others. `@gjsify/gi-runtime-android`'s AAR
    // ships `jni/arm64-v8a` and `jni/x86_64`; naming them here is what makes the APK a
    // universal one over exactly that payload, so the same APK installs on the arm64
    // phone this suite is measured on and on an x86_64 emulator. Dropping one of them is
    // also the build mistake `useRealGObjectEngine`'s error message warns about, so the
    // filter stays visible rather than defaulting to "whatever is in the tree".
    ndk {
      abiFilters "arm64-v8a", "x86_64"
    }
  }

  // PER-ABI APKs, on request only: `-PgjsifyAbiSplits`.
  //
  // ADR 0110 gate 2 asks what the payload costs a SHIPPING download, and a universal APK cannot
  // answer that — it carries both ABIs, so its total is about 15 MB larger than anything a device
  // ever downloads. A split names the cost per ABI, which is the number the gate is about.
  //
  // Not enabled unconditionally, because `scripts/run-on-device.mjs` installs
  // `outputs/apk/debug/app-debug.apk` by path and a split build writes
  // `app-<abi>-debug.apk` instead. The property keeps the suite's everyday flow intact and makes
  // the measurement build an explicit one.
  if (project.hasProperty("gjsifyAbiSplits")) {
    // AGP refuses `ndk.abiFilters` and `splits.abi` together ("Conflicting configuration … cannot
    // be present when splits abi filters are set"), even when both name the same ABIs — and the
    // filters above are not only ours: NativeScript's generated build.gradle adds all four it
    // knows, so the merged set is a union we do not control. Clearing it leaves the `include`
    // below as the single source of which ABIs get built, which is what a split build means.
    defaultConfig.ndk.abiFilters.clear()
    splits {
      abi {
        enable true
        // `reset()` first: the default include list is every ABI AGP knows, and the two the
        // payload has are the only two that can work (see `abiFilters` above).
        reset()
        include "arm64-v8a", "x86_64"
        // No universal APK: it would be the thing this build exists to stop measuring.
        universalApk false
      }
    }
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }
}
