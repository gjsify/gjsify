// You can add your native dependencies here
dependencies {
//  implementation 'androidx.multidex:multidex:2.0.1'
}

android {
  compileSdkVersion 36
  buildToolsVersion "36"
  // ndkVersion ""

  defaultConfig {
    // 26 (Android 8.0) rather than 24: it costs 0.5 points of reach (96.6% → 96.1%)
    // and drops two years of legacy. NOT a prerequisite for edge-to-edge —
    // WindowInsetsCompat works down to 21 — the two just travel together.
    minSdkVersion 26
    // 36 because Play requires it for updates from 2026-08-31 and there is no reason
    // to sit on 35. Edge-to-edge is enforced from 35 either way, which is why the
    // inset work (#1128) was needed before this bump, not because of it.
    targetSdkVersion 36

    // Version Information
    versionCode 1
    versionName "1.0.0"

    generatedDensities = []

    // BOTH ABIs the plugin carries, and no others. `@gjsify/gi-runtime-android`'s AAR
    // ships `jni/arm64-v8a` and `jni/x86_64`; naming them here is what makes the APK a
    // universal one over exactly that payload, so the same APK installs on the arm64
    // phone this suite is measured on and on an x86_64 emulator. Dropping one of them is
    // also the build mistake `useRealGObjectEngine`'s error message warns about, so the
    // filter stays visible rather than defaulting to "whatever is in the tree".
    ndk {
      abiFilters "arm64-v8a", "x86_64"
    }
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }
}
