<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamepad SNES Controller</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #debug {
            position: fixed;
            left: 12px;
            bottom: 12px;
            margin: 0;
            color: #ddd;
            font: 12px monospace;
        }
        #rumble {
            position: fixed;
            top: 12px;
            right: 12px;
        }
    </style>
    <script defer src="browser.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <pre id="debug"></pre>
    <button id="rumble">Rumble</button>
</body>
</html>
